<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D47A1">
<title>Kimchi Mart · Shelf Display Reference</title>
<link rel="stylesheet" href="km-design.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#1f2937;max-width:960px;margin:0 auto;padding-bottom:32px;-webkit-tap-highlight-color:transparent}

.hd{background:linear-gradient(135deg,#0D47A1,#1565C0);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hd-row{display:flex;align-items:center;gap:10px}
.hd h1{font-size:1rem;font-weight:700;flex:1}
.lang-pill{display:inline-flex;background:rgba(255,255,255,.15);border-radius:14px;padding:2px}
.lang-pill button{background:0;border:0;color:#fff;font-size:.7rem;font-weight:600;padding:4px 8px;border-radius:12px;cursor:pointer}
.lang-pill button.on{background:#fff;color:#1565C0}
.back-btn{background:rgba(255,255,255,.2);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:56px;z-index:90}
.tab{padding:7px 12px;border-radius:20px;font-size:.78rem;font-weight:600;border:1.5px solid #e5e7eb;background:#fff;color:#6b7280;cursor:pointer;white-space:nowrap;transition:.15s}
.tab.on{background:#0D47A1;color:#fff;border-color:#0D47A1}
.tab .cnt{font-size:.62rem;opacity:.7;margin-left:2px}

.sec{display:none;padding:16px 12px}
.sec.on{display:block}
.sec-title{font-size:1.15rem;font-weight:800;color:#0D47A1;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sel-all{margin-left:auto;background:#0D47A1;color:#fff;border:0;padding:6px 12px;border-radius:14px;font-size:.7rem;font-weight:700;cursor:pointer}
.sel-all:hover{background:#1565C0}
.sel-all.all-on{background:#dc2626}
.sec-cnt{font-size:.82rem;color:#6b7280;font-weight:400}
.sec-empty{text-align:center;padding:60px 16px;color:#9CA3AF;font-size:.9rem}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{position:relative;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1);transition:.2s}
.card:hover{box-shadow:0 4px 16px rgba(13,71,161,.25);transform:translateY(-2px)}
.card-img{cursor:pointer}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}

.card-ctrl{position:absolute;top:4px;right:4px;display:flex;gap:4px;z-index:5}
.ctrl-sel{font-size:.6rem;padding:3px 4px;border-radius:8px;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.95);cursor:pointer;max-width:90px;font-weight:600}
.ctrl-del{background:rgba(239,68,68,.95);color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:.85rem;font-weight:bold;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ctrl-del:hover{background:#dc2626}

.chg-btn{background:rgba(255,200,0,.25);border:0;color:#fff;padding:6px 10px;border-radius:14px;font-size:.7rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}
.chg-btn:hover{background:rgba(255,200,0,.4)}
.chg-cnt{background:#fbbf24;color:#000;border-radius:10px;padding:1px 6px;font-size:.65rem;font-weight:800}
.admin-only{display:none}
body.admin .admin-only{display:flex}
.exit-btn{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:.65rem;padding:5px 9px;border-radius:12px;cursor:pointer}

.card-check{position:absolute;top:4px;left:4px;width:26px;height:26px;background:rgba(255,255,255,.95);border:2px solid #aaa;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:6;font-size:.9rem;font-weight:bold;color:transparent;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.card.selected .card-check{background:#0D47A1;border-color:#0D47A1;color:#fff}
.card.selected{outline:3px solid #0D47A1;outline-offset:-1px}

.batch-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0D47A1;color:#fff;padding:10px 14px;border-radius:30px;display:none !important;align-items:center;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:200;flex-wrap:wrap;max-width:95vw}
body.admin .batch-bar.show{display:flex !important}
.batch-cnt{font-weight:700;font-size:.8rem;white-space:nowrap}
.batch-sel{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 8px;border-radius:14px;font-size:.7rem;font-weight:600;cursor:pointer;max-width:160px}
.batch-sel option{color:#000}
.batch-btn{background:rgba(255,255,255,.2);border:0;color:#fff;padding:6px 10px;border-radius:14px;font-size:.7rem;font-weight:700;cursor:pointer}
.batch-btn:hover{background:rgba(255,255,255,.3)}
.batch-del{background:rgba(239,68,68,.9)}
.batch-del:hover{background:#dc2626}

@media(min-width:540px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:780px){.grid{grid-template-columns:repeat(4,1fr)}}

.lb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.lb-overlay.show{display:flex}
.lb-close{position:absolute;top:12px;right:16px;background:0;border:0;color:#fff;font-size:2rem;cursor:pointer;z-index:1001;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.lb-img-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;max-width:900px;overflow:hidden}
.lb-img-wrap img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px}
.lb-nav{display:flex;gap:12px;padding:12px;align-items:center}
.lb-nav button{background:rgba(255,255,255,.15);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-nav button:hover{background:rgba(255,255,255,.3)}
.lb-counter{color:#fff;font-size:.8rem;font-weight:600;min-width:60px;text-align:center}
.lb-caption{color:#fff;font-size:.72rem;text-align:center;margin-top:4px;opacity:.8}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-row">
    <button class="back-btn" onclick="history.back()">&#8592;</button>
    <h1 id="hdTitle"></h1>
    <span id="adminHdrSlot"></span>
    <div class="lang-pill">
      <button class="on" onclick="setLang('ko')">KO</button>
      <button onclick="setLang('en')">EN</button>
      <button onclick="setLang('es')">ES</button>
    </div>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div id="content"></div>

<div id="batchSlot"></div>

<div class="lb-overlay" id="lightbox">
  <button class="lb-close" onclick="closeLB()">&times;</button>
  <div class="lb-img-wrap"><img id="lbImg" src="" alt=""></div>
  <div class="lb-caption" id="lbCaption"></div>
  <div class="lb-nav">
    <button onclick="navLB(-1)">&#9664;</button>
    <span class="lb-counter" id="lbCounter"></span>
    <button onclick="navLB(1)">&#9654;</button>
  </div>
</div>

<script src="hmart-photos/manifest.js"></script>
<script>
var TXT={
  ko:{title:'쉘브 디스플레이 레퍼런스',empty:'사진 준비 중'},
  en:{title:'Shelf Display Reference',empty:'Photos coming soon'},
  es:{title:'Referencia de Exhibición',empty:'Fotos próximamente'}
};
var DEPTS=[
  {id:'hotfood',icon:'🔥',ko:'핫푸드',en:'Hot Food',es:'Comida Caliente'},
  {id:'sidedish',icon:'🥢',ko:'반찬\xB7사이드',en:'Side Dish',es:'Acompañamientos'},
  {id:'sushi',icon:'🍣',ko:'스시\xB7사시미',en:'Sushi',es:'Sushi'},
  {id:'seafood',icon:'🦐',ko:'해산물\xB7생선',en:'Seafood',es:'Mariscos'},
  {id:'produce',icon:'🥬',ko:'청과',en:'Produce',es:'Verduras'},
  {id:'meat',icon:'🥩',ko:'정육',en:'Meat',es:'Carne'},
  {id:'ramen_noodles',icon:'🍜',ko:'라면',en:'Ramen\xB7Noodles',es:'Ramen'},
  {id:'dry_noodles',icon:'🍝',ko:'건면',en:'Dry Noodles',es:'Fideos Secos'},
  {id:'sauce',icon:'🫙',ko:'양념\xB7소스',en:'Sauce',es:'Salsas'},
  {id:'grain',icon:'🌾',ko:'곡물',en:'Grain',es:'Granos'},
  {id:'mealkit',icon:'📦',ko:'밀키트',en:'Meal Kit',es:'Meal Kit'},
  {id:'can',icon:'🥫',ko:'캔\xB7통조림',en:'Can',es:'Enlatados'},
  {id:'tea',icon:'🍵',ko:'차',en:'Tea',es:'Té'},
  {id:'snack',icon:'🍪',ko:'스낵\xB7과자',en:'Snack',es:'Snacks'},
  {id:'drinks',icon:'🥤',ko:'음료',en:'Drinks',es:'Bebidas'},
  {id:'beer_sake_soju',icon:'🍶',ko:'주류',en:'Beer\xB7Sake\xB7Soju',es:'Licores'},
  {id:'houseware',icon:'🍳',ko:'주방용품',en:'Houseware',es:'Utensilios'},
  {id:'sale_zone',icon:'🏷️',ko:'세일존',en:'Sale Zone',es:'Zona de Ofertas'},
  {id:'facility',icon:'🏬',ko:'시설',en:'Facility',es:'Instalaciones'},
  {id:'refrigerated',icon:'🥶',ko:'냉장',en:'Refrigerated',es:'Refrigerados'},
  {id:'frozen',icon:'🧊',ko:'냉동',en:'Frozen',es:'Congelados'},
  {id:'poultry',icon:'🍗',ko:'가금류',en:'Poultry',es:'Aves'},
  {id:'seaweed',icon:'🌿',ko:'해조류',en:'Seaweed',es:'Algas'}
];
var PHOTO_BASE='hmart-photos/';
var lang=localStorage.getItem('km-lang')||'ko';
var activeDept=location.hash.slice(1)||'hotfood';
var CHG_KEY='planogram-changes-v1';
var ADMIN_KEY='planogram-admin-v1';
var ADMIN_PW='kimchi2026';
var isAdmin=false;
(function(){
  var url=new URLSearchParams(location.search);
  var pw=url.get('edit');
  if(pw){
    var input=pw==='1'?prompt('관리자 비밀번호:'):pw;
    if(input===ADMIN_PW){
      localStorage.setItem(ADMIN_KEY,'1');
    }
    history.replaceState(null,'',location.pathname+location.hash);
  }
  isAdmin=localStorage.getItem(ADMIN_KEY)==='1';
})();
function injectAdminUI(){
  if(!isAdmin)return;
  document.body.classList.add('admin');
  var hdr=document.getElementById('adminHdrSlot');
  if(hdr&&!hdr.dataset.injected){
    hdr.dataset.injected='1';
    hdr.innerHTML='<button class="chg-btn" onclick="exportChanges()" title="변경사항 내보내기">💾<span class="chg-cnt" id="chgCnt">0</span></button>'+
                  '<button class="exit-btn" onclick="exitAdmin()" title="관리자 종료">🔒</button>';
  }
  var bs=document.getElementById('batchSlot');
  if(bs&&!bs.dataset.injected){
    bs.dataset.injected='1';
    bs.innerHTML='<div class="batch-bar" id="batchBar">'+
      '<span class="batch-cnt" id="batchCnt">0장 선택</span>'+
      '<select class="batch-sel" id="batchSel"><option value="">→ 이동할 카테고리</option></select>'+
      '<button class="batch-btn" onclick="batchMove()">이동</button>'+
      '<button class="batch-btn batch-del" onclick="batchDelete()">✕ 삭제</button>'+
      '<button class="batch-btn" onclick="clearSelection()">해제</button>'+
    '</div>';
  }
}
window.addEventListener('DOMContentLoaded',function(){injectAdminUI();if(isAdmin){refreshBatchSel();updateChgCnt();updateSelectionUI()}});
function exitAdmin(){
  if(confirm('관리자 모드를 종료하시겠습니까?')){
    localStorage.removeItem(ADMIN_KEY);
    localStorage.removeItem(CHG_KEY);
    location.reload();
  }
}

function loadChanges(){try{return JSON.parse(localStorage.getItem(CHG_KEY)||'[]')}catch(e){return[]}}
function saveChanges(arr){localStorage.setItem(CHG_KEY,JSON.stringify(arr));updateChgCnt()}
function updateChgCnt(){var el=document.getElementById('chgCnt');if(el)el.textContent=loadChanges().length}
function applyChanges(){
  if(!isAdmin)return;
  var chgs=loadChanges();
  chgs.forEach(function(c){
    if(!HMART_PHOTOS[c.from])return;
    var idx=HMART_PHOTOS[c.from].indexOf(c.file);
    if(idx<0)return;
    HMART_PHOTOS[c.from].splice(idx,1);
    if(c.action==='move'){
      if(!HMART_PHOTOS[c.to])HMART_PHOTOS[c.to]=[];
      HMART_PHOTOS[c.to].push(c.file);
      HMART_PHOTOS[c.to].sort();
    }
  });
}
function movePhotoCore(fromDept,file,toDept){
  if(!toDept||toDept===fromDept)return false;
  var chgs=loadChanges();
  chgs.push({action:'move',from:fromDept,to:toDept,file:file});
  saveChanges(chgs);
  var idx=HMART_PHOTOS[fromDept].indexOf(file);
  if(idx>=0)HMART_PHOTOS[fromDept].splice(idx,1);
  if(!HMART_PHOTOS[toDept])HMART_PHOTOS[toDept]=[];
  HMART_PHOTOS[toDept].push(file);
  HMART_PHOTOS[toDept].sort();
  return true;
}
function deletePhotoCore(fromDept,file){
  var chgs=loadChanges();
  chgs.push({action:'delete',from:fromDept,file:file});
  saveChanges(chgs);
  var idx=HMART_PHOTOS[fromDept].indexOf(file);
  if(idx>=0)HMART_PHOTOS[fromDept].splice(idx,1);
}
function movePhoto(fromDept,file,toDept){movePhotoCore(fromDept,file,toDept);render()}
function deletePhoto(fromDept,file){deletePhotoCore(fromDept,file);render()}

var selectedSet=new Set();
var lastClicked={dept:null,index:-1};
function toggleSelect(dept,file,index,shiftKey){
  if(shiftKey&&lastClicked.dept===dept&&lastClicked.index>=0){
    var photos=HMART_PHOTOS[dept]||[];
    var start=Math.min(lastClicked.index,index);
    var end=Math.max(lastClicked.index,index);
    for(var i=start;i<=end;i++){
      if(photos[i])selectedSet.add(dept+'::'+photos[i]);
    }
  }else{
    var k=dept+'::'+file;
    if(selectedSet.has(k))selectedSet.delete(k);
    else selectedSet.add(k);
  }
  lastClicked={dept:dept,index:index};
  updateSelectionUI();
}
function selectAllInDept(dept){
  var photos=HMART_PHOTOS[dept]||[];
  if(!photos.length)return;
  var allSel=photos.every(function(f){return selectedSet.has(dept+'::'+f)});
  photos.forEach(function(f){
    var k=dept+'::'+f;
    if(allSel)selectedSet.delete(k);
    else selectedSet.add(k);
  });
  updateSelectionUI();
}
function updateSelectionUI(){
  document.querySelectorAll('.card').forEach(function(c){
    var k=c.dataset.key;
    c.classList.toggle('selected',selectedSet.has(k));
  });
  document.querySelectorAll('.sel-all').forEach(function(b){
    var dept=b.dataset.dept;
    var photos=HMART_PHOTOS[dept]||[];
    var allSel=photos.length&&photos.every(function(f){return selectedSet.has(dept+'::'+f)});
    b.classList.toggle('all-on',allSel);
    b.textContent=allSel?'전체 해제':'전체 선택('+photos.length+')';
  });
  var bar=document.getElementById('batchBar');
  if(!bar)return;
  bar.classList.toggle('show',selectedSet.size>0);
  var cnt=document.getElementById('batchCnt');
  if(cnt)cnt.textContent=selectedSet.size+'장 선택';
}
function refreshBatchSel(){
  var sel=document.getElementById('batchSel');
  if(!sel)return;
  var html='<option value="">→ 이동할 카테고리</option>';
  DEPTS.forEach(function(d){html+='<option value="'+d.id+'">'+d.icon+' '+(d[lang]||d.en)+'</option>'});
  sel.innerHTML=html;
}
function batchMove(){
  var dept=document.getElementById('batchSel').value;
  if(!dept){alert('이동할 카테고리를 선택하세요');return}
  var moved=0;
  selectedSet.forEach(function(k){
    var p=k.split('::');
    if(p[0]!==dept&&movePhotoCore(p[0],p[1],dept))moved++;
  });
  selectedSet.clear();
  render();
  alert(moved+'장 이동됨');
}
function batchDelete(){
  if(!confirm(selectedSet.size+'장을 삭제하시겠습니까?'))return;
  selectedSet.forEach(function(k){var p=k.split('::');deletePhotoCore(p[0],p[1])});
  selectedSet.clear();
  render();
}
function clearSelection(){selectedSet.clear();updateSelectionUI()}
function exportChanges(){
  var chgs=loadChanges();
  if(!chgs.length){alert('변경사항 없음');return}
  var summary={};
  chgs.forEach(function(c){
    var k=c.action==='delete'?(c.from+' → 삭제'):(c.from+' → '+c.to);
    summary[k]=(summary[k]||0)+1;
  });
  var s='변경사항 '+chgs.length+'건:\n';
  for(var k in summary)s+='  '+k+': '+summary[k]+'\n';
  var json=JSON.stringify(chgs);
  if(navigator.clipboard){
    navigator.clipboard.writeText(json).then(function(){
      if(confirm(s+'\n✅ 클립보드에 복사됨.\nClaude에게 붙여넣고 "변경사항 적용해줘"라고 보내세요.\n\n변경사항을 초기화할까요?')){
        localStorage.removeItem(CHG_KEY);location.reload();
      }
    });
  }else{
    prompt(s+'\n복사하세요:',json);
  }
}

function getPhotos(id){
  if(typeof HMART_PHOTOS==='undefined')return[];
  return(HMART_PHOTOS[id]||[]);
}

function onMoveSel(sel,fromDept,file){
  if(sel.value)movePhoto(fromDept,file,sel.value);
}
function onDelBtn(ev,fromDept,file){
  ev.stopPropagation();
  if(confirm('이 사진을 삭제하시겠습니까?\n'+file))deletePhoto(fromDept,file);
}

function setLang(l){
  lang=l;localStorage.setItem('km-lang',l);
  document.querySelectorAll('.lang-pill button').forEach(function(b){b.classList.toggle('on',b.textContent===l.toUpperCase())});
  render();
}

function setDept(id){
  activeDept=id;
  location.hash=id;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.id===id)});
  document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('on',s.id==='sec-'+id)});
}

function render(){
  document.getElementById('hdTitle').textContent=TXT[lang].title;
  var tb=document.getElementById('tabs');
  tb.innerHTML=DEPTS.map(function(d){
    var n=getPhotos(d.id).length;
    return '<div class="tab'+(d.id===activeDept?' on':'')+'" data-id="'+d.id+'" onclick="setDept(\''+d.id+'\')">'+d.icon+' '+(d[lang]||d.en)+(n?'<span class="cnt">('+n+')</span>':'')+'</div>';
  }).join('');

  var c=document.getElementById('content');
  c.innerHTML=DEPTS.map(function(d){
    var photos=getPhotos(d.id);
    var name=d[lang]||d.en;
    var h='<div class="sec'+(d.id===activeDept?' on':'')+'" id="sec-'+d.id+'">';
    h+='<div class="sec-title">'+d.icon+' '+name+' <span class="sec-cnt">'+photos.length+(lang==='ko'?'장':'')+'</span>';
    if(isAdmin&&photos.length){h+='<button class="sel-all" data-dept="'+d.id+'" onclick="selectAllInDept(\''+d.id+'\')">전체 선택('+photos.length+')</button>'}
    h+='</div>';
    if(!photos.length){
      h+='<div class="sec-empty">'+TXT[lang].empty+'</div>';
    }else{
      var optsHtml='<option value="">→</option>';
      DEPTS.forEach(function(dd){
        if(dd.id!==d.id)optsHtml+='<option value="'+dd.id+'">'+dd.icon+' '+(dd[lang]||dd.en)+'</option>';
      });
      h+='<div class="grid">';
      photos.forEach(function(f,i){
        h+='<div class="card" data-key="'+d.id+'::'+f+'">'+
          (isAdmin?'<div class="card-check admin-only" onclick="event.stopPropagation();toggleSelect(\''+d.id+'\',\''+f+'\','+i+',event.shiftKey)">✓</div>':'')+
          '<div class="card-img" onclick="openLB(\''+d.id+'\','+i+')"><img src="'+PHOTO_BASE+f+'" alt="" loading="lazy"></div>'+
          (isAdmin?'<div class="card-ctrl admin-only" onclick="event.stopPropagation()">'+
            '<select class="ctrl-sel" onchange="onMoveSel(this,\''+d.id+'\',\''+f+'\')">'+optsHtml+'</select>'+
            '<button class="ctrl-del" onclick="onDelBtn(event,\''+d.id+'\',\''+f+'\')" title="삭제">✕</button>'+
          '</div>':'')+
        '</div>';
      });
      h+='</div>';
    }
    h+='</div>';
    return h;
  }).join('');
  refreshBatchSel();
  updateSelectionUI();
}

applyChanges();
render();
updateChgCnt();
refreshBatchSel();
updateSelectionUI();

var lbPhotos=[],lbIdx=0;

function openLB(deptId,idx){
  lbPhotos=getPhotos(deptId);
  lbIdx=Math.min(idx,lbPhotos.length-1);
  showLB();
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeLB(){
  document.getElementById('lightbox').classList.remove('show');
  document.body.style.overflow='';
}
function navLB(dir){
  lbIdx=(lbIdx+dir+lbPhotos.length)%lbPhotos.length;
  showLB();
}
function showLB(){
  if(!lbPhotos.length)return;
  var f=lbPhotos[lbIdx];
  document.getElementById('lbImg').src=PHOTO_BASE+f;
  document.getElementById('lbCounter').textContent=(lbIdx+1)+' / '+lbPhotos.length;
  document.getElementById('lbCaption').textContent=f.replace('.jpg','').replace(/_/g,' ');
}

document.getElementById('lightbox').addEventListener('click',function(e){
  if(e.target===this||e.target.classList.contains('lb-img-wrap'))closeLB();
});
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lightbox').classList.contains('show'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowLeft')navLB(-1);
  if(e.key==='ArrowRight')navLB(1);
});
(function(){
  var sx=0;
  var lb=document.getElementById('lbImg');
  lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>50)navLB(dx<0?1:-1);
  },{passive:true});
})();
</script>
<script src="back-nav.js"></script>
</body>
