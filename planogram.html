<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D47A1">
<title>Kimchi Mart · Shelf Display Planogram</title>
<link rel="stylesheet" href="km-design.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#1f2937;max-width:720px;margin:0 auto;padding-bottom:24px;-webkit-tap-highlight-color:transparent}

/* HEADER */
.hd{background:linear-gradient(135deg,#0D47A1,#1565C0);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hd-row{display:flex;align-items:center;gap:10px}
.hd h1{font-size:.95rem;font-weight:700;flex:1}
.hd .sub{font-size:.7rem;opacity:.85;margin-top:2px}
.lang-pill{display:inline-flex;background:rgba(255,255,255,.15);border-radius:14px;padding:2px}
.lang-pill button{background:0;border:0;color:#fff;font-size:.7rem;font-weight:600;padding:4px 8px;border-radius:12px;cursor:pointer}
.lang-pill button.on{background:#fff;color:#1565C0}
.back-btn{background:rgba(255,255,255,.2);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* DEPT TABS */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #e5e7eb}
.tab{padding:7px 12px;border-radius:20px;font-size:.75rem;font-weight:600;border:1.5px solid #e5e7eb;background:#fff;color:#6b7280;cursor:pointer;white-space:nowrap;transition:.15s}
.tab.on{background:#0D47A1;color:#fff;border-color:#0D47A1}

/* SECTION */
.sec{display:none;padding:16px 12px}
.sec.on{display:block}
.sec-title{font-size:1.1rem;font-weight:800;color:#0D47A1;margin-bottom:4px}
.sec-sub{font-size:.75rem;color:#6b7280;margin-bottom:14px}

/* GONDOLA DIAGRAM */
.gondola{border-radius:12px;overflow:hidden;border:2px solid #1565C0;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.gond-hd{background:#0D47A1;color:#fff;padding:8px 12px;font-size:.78rem;font-weight:700;text-align:center}
.zone{padding:10px 12px;border-bottom:1px solid #e5e7eb;display:flex;gap:10px;align-items:flex-start;min-height:54px}
.zone:last-child{border-bottom:0}
.zone-tag{flex-shrink:0;width:60px;padding:4px 0;border-radius:6px;font-size:.65rem;font-weight:800;text-align:center;color:#fff;line-height:1.2}
.zone-tag small{display:block;font-size:.55rem;font-weight:500;opacity:.85}
.z-stretch .zone-tag{background:#78909C}
.z-hot .zone-tag{background:#E53935}
.z-reach .zone-tag{background:#FB8C00}
.z-stoop .zone-tag{background:#43A047}
.zone-body{flex:1;font-size:.8rem;line-height:1.5;color:#374151}
.zone-body .sku{display:inline-block;background:#EEF2FF;border:1px solid #C7D2FE;border-radius:6px;padding:2px 8px;margin:2px 3px 2px 0;font-size:.72rem;font-weight:500;color:#3730A3;white-space:nowrap}
.zone-body .sku .face{background:#3730A3;color:#fff;border-radius:4px;padding:0 4px;margin-left:4px;font-size:.62rem}
.zone-body .note{font-size:.7rem;color:#9CA3AF;margin-top:2px}

/* HEIGHT LABEL */
.height-bar{display:flex;justify-content:space-between;padding:0 12px;margin-bottom:2px}
.height-bar span{font-size:.6rem;color:#9CA3AF}

/* CHECKLIST */
.cl-wrap{background:#fff;border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #e5e7eb}
.cl-title{font-size:.85rem;font-weight:700;color:#1f2937;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.cl-title::before{content:'✅';font-size:.9rem}
.cl-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:.78rem;color:#374151}
.cl-item:last-child{border-bottom:0}
.cl-item input[type=checkbox]{margin-top:2px;width:18px;height:18px;accent-color:#0D47A1;flex-shrink:0}

/* RULES CARD */
.rule-card{background:linear-gradient(135deg,#FFF8E1,#FFF3E0);border:1px solid #FFE0B2;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.rule-card h3{font-size:.82rem;font-weight:700;color:#E65100;margin-bottom:6px}
.rule-card ul{padding-left:18px;font-size:.76rem;color:#4E342E;line-height:1.7}
.rule-card li{margin-bottom:2px}

/* SEASON CARD */
.season-card{background:linear-gradient(135deg,#E8F5E9,#F1F8E9);border:1px solid #C8E6C9;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.season-card h3{font-size:.82rem;font-weight:700;color:#2E7D32;margin-bottom:6px}
.season-tbl{width:100%;font-size:.74rem;border-collapse:collapse}
.season-tbl th{text-align:left;padding:4px 6px;background:#C8E6C9;color:#1B5E20;font-weight:700}
.season-tbl td{padding:4px 6px;border-bottom:1px solid #E8F5E9}

/* PHOTO GRID */
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.photo-slot{aspect-ratio:4/3;background:#E8EAF6;border:2px dashed #9FA8DA;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5C6BC0;font-size:.72rem;text-align:center;padding:8px;cursor:pointer;transition:.15s}
.photo-slot:hover{background:#C5CAE9}
.photo-slot .ico{font-size:1.5rem;margin-bottom:4px}
.photo-slot img{width:100%;height:100%;object-fit:cover;border-radius:8px}

/* TEMP BADGE */
.temp{display:inline-block;background:#E3F2FD;color:#0D47A1;border-radius:6px;padding:2px 8px;font-size:.68rem;font-weight:700;margin:2px 4px 2px 0}
.temp.hot{background:#FFEBEE;color:#C62828}
.temp.freeze{background:#E8EAF6;color:#283593}

/* 5 PILLARS */
.pillars{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:16px}
.pillar{background:#fff;border-radius:10px;padding:10px 12px;border-left:4px solid;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pillar:nth-child(1){border-color:#E53935}
.pillar:nth-child(2){border-color:#FB8C00}
.pillar:nth-child(3){border-color:#7B1FA2}
.pillar:nth-child(4){border-color:#1565C0}
.pillar:nth-child(5){border-color:#2E7D32}
.pillar .p-title{font-size:.8rem;font-weight:800;color:#1f2937}
.pillar .p-desc{font-size:.72rem;color:#6b7280;margin-top:2px}

/* INTRO CARD */
.intro-card{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);border:1px solid #90CAF9;border-radius:12px;padding:14px;margin-bottom:16px}
.intro-card h3{font-size:.85rem;font-weight:800;color:#0D47A1;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.intro-card p{font-size:.76rem;color:#1565C0;line-height:1.6;margin:0}
.intro-card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.intro-card .tag{background:#0D47A1;color:#fff;border-radius:20px;padding:3px 10px;font-size:.65rem;font-weight:600}

/* 6 TYPES GRID */
.type-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:16px}
.type-card{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #e5e7eb;display:flex;gap:10px;align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.type-card .t-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:#0D47A1;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
.type-card .t-body{flex:1}
.type-card .t-name{font-size:.78rem;font-weight:700;color:#1f2937}
.type-card .t-desc{font-size:.7rem;color:#6b7280;margin-top:2px;line-height:1.4}

/* 4 ELEMENTS */
.elem-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.elem-card{background:#fff;border-radius:10px;padding:12px;border-top:3px solid;box-shadow:0 1px 4px rgba(0,0,0,.06);text-align:center}
.elem-card:nth-child(1){border-color:#E53935}
.elem-card:nth-child(2){border-color:#FB8C00}
.elem-card:nth-child(3){border-color:#1565C0}
.elem-card:nth-child(4){border-color:#7B1FA2}
.elem-card .e-icon{font-size:1.3rem;margin-bottom:4px}
.elem-card .e-name{font-size:.76rem;font-weight:700;color:#1f2937}
.elem-card .e-desc{font-size:.68rem;color:#6b7280;margin-top:3px;line-height:1.4}

/* BENEFITS */
.benefit-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:16px}
.benefit{background:#fff;border-radius:10px;padding:10px 12px;border-left:4px solid #43A047;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;gap:8px;align-items:flex-start}
.benefit .b-icon{font-size:1rem;flex-shrink:0}
.benefit .b-text{font-size:.76rem;color:#374151;line-height:1.5}
.benefit .b-text strong{color:#2E7D32}

/* COMPLIANCE */
.comply-card{background:linear-gradient(135deg,#FCE4EC,#F8BBD0);border:1px solid #F48FB1;border-radius:12px;padding:14px;margin-bottom:16px}
.comply-card h3{font-size:.85rem;font-weight:800;color:#C62828;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.comply-list{list-style:none;padding:0;margin:0}
.comply-list li{font-size:.76rem;color:#4E342E;padding:5px 0;border-bottom:1px solid rgba(0,0,0,.06);display:flex;gap:6px;align-items:flex-start}
.comply-list li:last-child{border:0}
.comply-list .ci{flex-shrink:0;font-size:.8rem}

/* SECTION DIVIDER */
.sec-div{font-size:.88rem;font-weight:800;color:#0D47A1;margin:18px 0 8px;padding-bottom:6px;border-bottom:2px solid #0D47A1;display:flex;align-items:center;gap:6px}

@media(min-width:500px){
  .type-grid{grid-template-columns:1fr 1fr}
  .benefit-grid{grid-template-columns:1fr 1fr}
}

/* VISUAL SHELF */
.vshelf{border-radius:12px;overflow:hidden;border:2px solid #37474F;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.vshelf-hd{background:#37474F;color:#fff;padding:8px 12px;font-size:.78rem;font-weight:700;text-align:center}
.vshelf-row{display:flex;align-items:flex-end;padding:6px 8px;border-bottom:2px solid #90A4AE;background:linear-gradient(180deg,#FAFAFA 0%,#E0E0E0 100%);min-height:70px;gap:4px;position:relative}
.vshelf-row:last-child{border-bottom:0}
.vshelf-tag{position:absolute;left:4px;top:4px;font-size:.55rem;font-weight:800;color:#fff;padding:2px 6px;border-radius:4px;z-index:2}
.vshelf-tag.hot{background:#E53935}
.vshelf-tag.reach{background:#FB8C00}
.vshelf-tag.stoop{background:#43A047}
.vshelf-tag.stretch{background:#78909C}
.vshelf-item{display:flex;flex-direction:column;align-items:center;flex:1;max-width:90px;min-width:50px}
.vshelf-item img{width:100%;max-height:64px;object-fit:contain;border-radius:3px;background:#fff;border:1px solid #e0e0e0}
.vshelf-item .vi-name{font-size:.55rem;color:#374151;text-align:center;margin-top:2px;line-height:1.2;max-height:2.4em;overflow:hidden;font-weight:600}
.vshelf-item .vi-face{font-size:.5rem;color:#fff;background:#0D47A1;border-radius:3px;padding:0 4px;margin-top:1px}

/* CROSS-MD */
.cross-md{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid #e5e7eb;display:flex;gap:8px;align-items:center}
.cross-md .arrow{font-size:1rem;color:#FB8C00;flex-shrink:0}
.cross-md .pair{font-size:.76rem;color:#374151}
.cross-md .pair strong{color:#0D47A1}

@media(min-width:500px){
  .photo-grid{grid-template-columns:repeat(3,1fr)}
  .pillars{grid-template-columns:repeat(2,1fr)}
  .vshelf-item img{max-height:80px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hd">
  <div class="hd-row">
    <button class="back-btn" onclick="history.back()">←</button>
    <div style="flex:1">
      <h1 id="hdTitle">📋 쉘브 디스플레이 플래노그램</h1>
      <div class="sub" id="hdSub">핵심 제품 오더 기반 · 6지점 통일 진열 표준</div>
    </div>
    <div class="lang-pill">
      <button class="on" onclick="setLang('ko')">KO</button>
      <button onclick="setLang('en')">EN</button>
      <button onclick="setLang('es')">ES</button>
    </div>
  </div>
</div>

<!-- DEPT TABS -->
<div class="tabs" id="tabs"></div>

<!-- SECTIONS rendered by JS -->
<div id="content"></div>

<script>
// ======================== DATA ========================
const LANG_TEXT = {
  ko: {
    title: '📋 쉘브 디스플레이 플래노그램',
    sub: '핵심 제품 오더 기반 · 6지점 통일 진열 표준',
    stretch:'STRETCH',hot:'HOT',reach:'REACH',stoop:'STOOP',
    face:'페이싱',checklist:'체크리스트',season:'시즌 트리거',
    rules:'진열 핵심 룰',photos:'참고 사진',crossMd:'교차 진열',
    photoAdd:'사진 추가 예정',heightTop:'200cm',heightHot:'170cm',
    heightReach:'90cm',heightBottom:'0cm',
    pillars:'기본 원칙 5가지',
    p1t:'Full = Sells',p1d:'가득 찬 선반이 더 팔린다',
    p2t:'Eye = Buy',p2d:'눈높이가 매출의 핵심',
    p3t:'Color = Stop',p3d:'컬러 블록이 시선을 멈춘다',
    p4t:'Story = Cart',p4d:'메뉴·상황으로 묶으면 카트가 커진다',
    p5t:'Clean = Trust',p5d:'청결 = 신뢰 = 재방문',
    overview:'전체 원칙'
  },
  en: {
    title:'📋 Shelf Display Planogram',
    sub:'Core product order-based · Unified standard for 6 stores',
    stretch:'STRETCH',hot:'HOT',reach:'REACH',stoop:'STOOP',
    face:'facing',checklist:'Checklist',season:'Season Triggers',
    rules:'Key Display Rules',photos:'Reference Photos',crossMd:'Cross Merchandising',
    photoAdd:'Photos coming soon',heightTop:'200cm',heightHot:'170cm',
    heightReach:'90cm',heightBottom:'0cm',
    pillars:'5 Core Pillars',
    p1t:'Full = Sells',p1d:'Full shelves sell more',
    p2t:'Eye = Buy',p2d:'Eye-level is the money zone',
    p3t:'Color = Stop',p3d:'Color blocks catch the eye',
    p4t:'Story = Cart',p4d:'Bundle by meal = bigger cart',
    p5t:'Clean = Trust',p5d:'Clean = Trust = Repeat visit',
    overview:'Overview'
  },
  es: {
    title:'📋 Planograma de Exhibición',
    sub:'Basado en productos clave · Estándar unificado para 6 tiendas',
    stretch:'STRETCH',hot:'HOT',reach:'REACH',stoop:'STOOP',
    face:'facing',checklist:'Lista de verificación',season:'Temporada',
    rules:'Reglas clave',photos:'Fotos de referencia',crossMd:'Exhibición cruzada',
    photoAdd:'Fotos próximamente',heightTop:'200cm',heightHot:'170cm',
    heightReach:'90cm',heightBottom:'0cm',
    pillars:'5 Pilares Básicos',
    p1t:'Full = Sells',p1d:'Estantes llenos venden más',
    p2t:'Eye = Buy',p2d:'Nivel de ojos = zona de ventas',
    p3t:'Color = Stop',p3d:'Bloques de color captan la vista',
    p4t:'Story = Cart',p4d:'Agrupar por comida = carrito más grande',
    p5t:'Clean = Trust',p5d:'Limpio = Confianza = Regreso',
    overview:'Resumen'
  }
};

const DEPTS = [
  {id:'overview', icon:'📐', ko:'전체 원칙', en:'Overview', es:'Resumen'},
  {id:'beverage', icon:'🥤', ko:'음료', en:'Beverage', es:'Bebidas'},
  {id:'sauce',    icon:'🫙', ko:'양념·소스', en:'Sauce', es:'Salsas'},
  {id:'ramen',    icon:'🍜', ko:'라면·면', en:'Ramen·Noodle', es:'Ramen'},
  {id:'canned',   icon:'🥫', ko:'통조림·즉석', en:'Canned·Ready', es:'Enlatados'},
  {id:'grain',    icon:'🌾', ko:'곡물·차', en:'Grain·Tea', es:'Granos·Té'},
  {id:'meat',     icon:'🥩', ko:'정육', en:'Meat', es:'Carne'},
  {id:'fish',     icon:'🐟', ko:'생선', en:'Fish', es:'Pescado'},
  {id:'seafood',  icon:'🦐', ko:'해산물', en:'Seafood', es:'Mariscos'},
  {id:'sashimi',  icon:'🍣', ko:'사시미', en:'Sashimi', es:'Sashimi'},
  {id:'produce',  icon:'🥬', ko:'청과', en:'Produce', es:'Verduras'},
  {id:'banchan',  icon:'🥢', ko:'반찬·델리', en:'Banchan·Deli', es:'Banchan'},
  {id:'mealkit',  icon:'📦', ko:'밀키트', en:'Meal Kit', es:'Meal Kit'},
  {id:'jam',      icon:'🍯', ko:'잼·꿀', en:'Jam·Honey', es:'Mermelada'}
];

function buildGondola(title, zones) {
  let html = `<div class="gondola"><div class="gond-hd">${esc(title)}</div>`;
  zones.forEach(z => {
    const cls = z.type === 'stretch' ? 'z-stretch' : z.type === 'hot' ? 'z-hot' : z.type === 'reach' ? 'z-reach' : 'z-stoop';
    const tagLabel = T(z.type);
    html += `<div class="zone ${cls}">
      <div class="zone-tag">${tagLabel}<small>${z.height||''}</small></div>
      <div class="zone-body">${z.items.map(i =>
        `<span class="sku">${esc(i.name)}${i.face ? `<span class="face">${i.face}</span>` : ''}</span>`
      ).join('')}${z.note ? `<div class="note">${esc(z.note)}</div>` : ''}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

const IMG_BASE = 'https://specialmasterdj-sketch.github.io/kimchi-mart-order/';
function buildVisualShelf(title, rows) {
  let html = `<div class="vshelf"><div class="vshelf-hd">${esc(title)}</div>`;
  rows.forEach(r => {
    html += `<div class="vshelf-row"><span class="vshelf-tag ${r.zone}">${r.label}</span>`;
    r.items.forEach(it => {
      const src = it.img ? IMG_BASE + it.img : '';
      html += `<div class="vshelf-item">`;
      if (src) html += `<img src="${src}" alt="${esc(it.name)}" loading="lazy" onerror="this.style.display='none'">`;
      else html += `<div style="width:100%;height:50px;background:#E8EAF6;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:#9FA8DA">📷</div>`;
      html += `<div class="vi-name">${esc(it.name)}</div>`;
      if (it.face) html += `<span class="vi-face">×${it.face}</span>`;
      html += `</div>`;
    });
    html += `</div>`;
  });
  html += '</div>';
  return html;
}

function buildChecklist(items) {
  let html = `<div class="cl-wrap"><div class="cl-title">${T('checklist')}</div>`;
  items.forEach((item, i) => {
    html += `<div class="cl-item"><input type="checkbox" id="cl${i}"><label for="cl${i}">${esc(item)}</label></div>`;
  });
  html += '</div>';
  return html;
}

function buildSeasonTable(rows) {
  let html = `<div class="season-card"><h3>📅 ${T('season')}</h3><table class="season-tbl">`;
  rows.forEach(r => { html += `<tr><td><strong>${esc(r[0])}</strong></td><td>${esc(r[1])}</td></tr>`; });
  html += '</table></div>';
  return html;
}

function buildRules(items) {
  let html = `<div class="rule-card"><h3>⚡ ${T('rules')}</h3><ul>`;
  items.forEach(r => { html += `<li>${esc(r)}</li>`; });
  html += '</ul></div>';
  return html;
}

function buildCrossMd(pairs) {
  let html = '';
  pairs.forEach(p => {
    html += `<div class="cross-md"><span class="arrow">↔</span><div class="pair"><strong>${esc(p[0])}</strong> + ${esc(p[1])}</div></div>`;
  });
  return html;
}

function buildPhotoGrid(labels) {
  let html = `<div style="margin-bottom:14px"><h3 style="font-size:.85rem;font-weight:700;margin-bottom:8px">📸 ${T('photos')}</h3><div class="photo-grid">`;
  labels.forEach(l => {
    html += `<div class="photo-slot"><span class="ico">📷</span>${esc(l)}<br><small style="color:#9FA3AF">${T('photoAdd')}</small></div>`;
  });
  html += '</div></div>';
  return html;
}

// ======================== SECTIONS ========================
function renderOverview() {
  const L = LANG_TEXT[lang];
  const k = lang==='ko', e = lang==='en';

  // --- 1. What is a Planogram ---
  const introTitle = k?'📋 플래노그램이란?':e?'📋 What is a Planogram?':'📋 ¿Qué es un Planograma?';
  const introBody = k

// ======================== RENDERING ========================
let lang = localStorage.getItem('km-lang') || 'ko';
let activeDept = 'overview';

function T(k) { return (LANG_TEXT[lang] && LANG_TEXT[lang][k]) || LANG_TEXT.ko[k] || k; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function setLang(l) {
  lang = l;
  localStorage.setItem('km-lang', l);
  document.querySelectorAll('.lang-pill button').forEach(b => b.classList.toggle('on', b.textContent === l.toUpperCase()));
  render();
}

function setDept(id) {
  activeDept = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.id === id));
  document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === 'sec-' + id));
}

function render() {
  document.getElementById('hdTitle').textContent = T('title');
  document.getElementById('hdSub').textContent = T('sub');

  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = DEPTS.map(d =>
    `<div class="tab${d.id===activeDept?' on':''}" data-id="${d.id}" onclick="setDept('${d.id}')">${d.icon} ${d[lang]||d.en}</div>`
  ).join('');

  const c = document.getElementById('content');
  c.innerHTML = [
    renderOverview(),
    renderBeverage(),
    renderSauce(),
    renderRamen(),
    renderCanned(),
    renderGrain(),
    renderMeat(),
    renderFish(),
    renderSeafood(),
    renderSashimi(),
    renderProduce(),
    renderBanchan(),
    renderMealkit(),
    renderJam()
  ].join('');

  setDept(activeDept);
}

render();
