<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>매대 확인서 — HQ 운영본부</title>
<meta name="theme-color" content="#1a5c3a">
<link rel="manifest" href="./manifest.json">
<!-- fb-auth-fetch 먼저 — fetch 에 로그인 토큰 자동 부착. auth-gate 가 로그인/승인 확인. -->
<script type="module" src="./fb-auth-fetch.js?v=4"></script>
<script type="module" src="./auth-gate.js?v=8"></script>
<script src="./km-back-button.js?v=1"></script>
<style>
:root{--line:#e5e7eb;--sub:#64748b;--brand:#1a5c3a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f6f8f7;color:#0f172a;font-size:15px;padding:12px;padding-bottom:90px}
.wrap{max-width:900px;margin:0 auto}
.top{background:linear-gradient(135deg,#1a5c3a,#15803d);color:#fff;padding:16px 18px;border-radius:14px;margin-bottom:12px;position:relative}
.top h1{font-size:1.18em;font-weight:900;padding-right:112px}
.top .s{font-size:.84em;opacity:.93;margin-top:5px;line-height:1.5}
.lang{position:absolute;right:14px;top:14px;display:flex;gap:4px}
.lang b{background:rgba(255,255,255,.18);border-radius:7px;padding:5px 9px;font-size:.74em;cursor:pointer;font-weight:800}
.lang b.on{background:#fff;color:var(--brand)}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.btn{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9em;
     font-weight:800;cursor:pointer;font-family:inherit;color:#0f172a}
.btn.go{background:#1565C0;border-color:#1565C0;color:#fff}
.btn.sm{padding:7px 11px;font-size:.84em}
select.btn{min-width:150px}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.card .ttl{font-weight:900;font-size:1.03em}
.card .sub{font-size:.82em;color:var(--sub);margin-top:3px;line-height:1.5}
.pill{font-size:.76em;font-weight:900;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill.a{background:#dcfce7;color:#15803d}
.pill.b{background:#fef3c7;color:#92400e}
.tag{font-size:.74em;font-weight:900;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.br{background:#1a5c3a;color:#fff}
.tag.vd{background:#e0e7ff;color:#1e3a8a}
.tag.iv{background:#f1f5f9;color:#475569;font-family:Consolas,monospace;font-weight:700}

/* 묶음(① ② …) — 무엇을 왜 묻는지 먼저 보여 준다 */
.grp{margin-top:16px;border:1.5px solid #c7d2fe;border-radius:11px;overflow:hidden}
.grp>.gh{background:#eef2ff;padding:10px 12px}
.grp>.gh .gt{font-weight:900;font-size:.98em;color:#1e3a8a}
.grp>.gh .gw{font-size:.83em;color:#334155;margin-top:4px;line-height:1.55}
.grp>.gh .gx{font-size:.83em;color:#15803d;font-weight:800;margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:.92em}
th{background:#f1f5f9;font-size:.8em;font-weight:800;padding:8px 6px;border:1px solid var(--line);text-align:left}
td{padding:9px 6px;border:1px solid var(--line);vertical-align:top}
.bc{font-family:Consolas,monospace;font-size:.86em;color:#475569}
.inf{font-size:.78em;color:var(--sub);line-height:1.6;margin-top:3px}
.inf b{color:#334155}
.ans{width:100%;border:2px solid #bf9000;background:#fffde7;border-radius:8px;padding:8px;
     font-size:.92em;font-family:inherit}
.ansq{font-size:.78em;font-weight:800;color:#92400e;margin:0 0 3px}
tr.done td{background:#f0fdf4}
.who{font-size:.74em;color:var(--sub);margin-top:3px}

.empty{text-align:center;color:var(--sub);padding:40px 16px;line-height:1.7;font-size:.92em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;
  padding:12px 20px;border-radius:24px;font-size:.9em;font-weight:700;z-index:99;opacity:0;
  pointer-events:none;transition:opacity .22s;max-width:92vw;text-align:center}
.toast.on{opacity:.96}
.hint{font-size:.84em;color:var(--sub);line-height:1.6;padding:10px 12px;background:#fff;
  border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
textarea{width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:10px;padding:10px;
  font-family:Consolas,monospace;font-size:.82em;resize:vertical}
.fld{margin-bottom:8px}
.fld label{display:block;font-size:.8em;font-weight:800;color:#334155;margin-bottom:4px}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px;font-size:.92em;font-family:inherit}
.row2{display:flex;gap:8px}.row2>*{flex:1}

/* ── 인쇄 — 손으로 적을 칸을 넉넉히 비운다 ── */
#pr{display:none}
@media print{
  @page{size:letter portrait;margin:11mm}
  body{background:#fff;padding:0;font-size:10.5pt}
  .wrap,.toast,.km-back,#kmBack{display:none!important}
  #pr{display:block!important}
  #pr h1{font-size:16pt;font-weight:900;margin-bottom:2mm}
  #pr .sub{font-size:9pt;color:#444;margin-bottom:3mm;line-height:1.5}
  #pr .gh{margin:5mm 0 2mm;border-left:4px solid #1a5c3a;padding-left:3mm;page-break-after:avoid}
  #pr .gt{font-size:11.5pt;font-weight:900}
  #pr .gw{font-size:9pt;color:#333;line-height:1.5;margin-top:1mm}
  #pr .gx{font-size:9pt;font-weight:800;margin-top:1mm}
  #pr table{width:100%;border-collapse:collapse;font-size:9.5pt;page-break-inside:auto}
  #pr tr{page-break-inside:avoid}
  #pr th{background:#eef2f7;border:1px solid #999;padding:4px;font-size:8.5pt}
  #pr td{border:1px solid #999;padding:5px 4px;vertical-align:top}
  #pr .wbox{border:1.5px solid #bf9000;background:#fffdf0;min-height:11mm}
  #pr .inf{font-size:8pt;color:#555}
  #pr .sg{margin-top:6mm;border:1px solid #999;padding:4mm;font-size:9pt}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="lang"><b id="Lko" onclick="setLang('ko')">KO</b><b id="Len" onclick="setLang('en')">EN</b><b id="Les" onclick="setLang('es')">ES</b></div>
    <h1 id="tT">📋 매대 확인서</h1>
    <div class="s" id="tS"></div>
  </div>

  <div class="bar">
    <select id="br" class="btn" onchange="pickBranch()"></select>
    <button class="btn" id="bNew" onclick="toggleNew()" style="display:none">➕ <span id="tNew"></span></button>
  </div>

  <div id="newBox" style="display:none" class="card">
    <div class="row2">
      <div class="fld"><label id="lVend"></label><input id="nVend" placeholder="WG HANMI"></div>
      <div class="fld"><label id="lInv"></label><input id="nInv" placeholder="0048415-IN"></div>
    </div>
    <div class="fld"><label id="lPaste"></label>
      <div style="display:flex;gap:7px;margin-bottom:6px">
        <button class="btn sm" onclick="document.getElementById('nFile').click()" id="bFile"></button>
        <span id="fName" style="font-size:.84em;color:var(--sub);align-self:center"></span>
      </div>
      <input type="file" id="nFile" accept=".json" style="display:none" onchange="loadFile(this)">
      <textarea id="nData" placeholder='{"groups":[{"title":"...","why":"...","how":"...","rows":[...]}]}'></textarea></div>
    <div class="hint" id="hPaste"></div>
    <button class="btn go" onclick="createSheet()" id="bSave"></button>
  </div>

  <div id="list"><div class="empty">⏳</div></div>
</div>

<div id="pr"></div>
<div class="toast" id="toast"></div>

<script>
/* 📋 매대 확인서 — HQ 가 "확인할 것" 을 올리면 지점이 앱에서 보고, 인쇄해 들고 다니고,
   답을 적어 넣는다. 파일을 주고받지 않는다 (가격표 교체 price-tags.html 과 같은 얼개).

   왜 생겼나 — 2026-10-12 WG 한미 10월 건에서 **벤더 바코드를 믿을 수 없다**는 것이 드러났다.
   같은 바코드가 다른 상품에 돌려 찍혀 있어, 매대에서 실물을 보지 않으면 원가를 못 고친다.
   엑셀 확인서를 만들어 드렸지만 전무님이 "가격표 교체처럼 앱에서 인쇄해 쓰게" 하라고 하셨다.

   저장 위치는 expiry/{지점}/checkSheets — expiry 규칙이 이미 지점을 가려 주므로 **규칙 게시가 필요 없다**.
   ⚠ Write 로만 고칠 것. */
const L={
 t:{ko:'📋 매대 확인서',en:'📋 Shelf Check Sheet',es:'📋 Hoja de Verificación'},
 s:{ko:'매대에서 실물을 보고 <b>노란 칸</b>에 적어 주세요. 인쇄해서 들고 다니셔도 됩니다.',
    en:'Check the actual item on the shelf and write in the <b>yellow box</b>. You can print this and carry it.',
    es:'Revise el producto en el estante y escriba en la <b>casilla amarilla</b>. Puede imprimirlo y llevarlo.'},
 nw:{ko:'새 확인서 올리기',en:'New check sheet',es:'Nueva hoja'},
 lVend:{ko:'거래처',en:'Vendor',es:'Proveedor'},
 lInv:{ko:'인보이스 번호',en:'Invoice no.',es:'N.º de factura'},
 lPaste:{ko:'확인서 자료 (HQ가 만든 .json)',en:'Sheet data (.json from HQ)',es:'Datos (.json de HQ)'},
 bFile:{ko:'📎 파일 고르기',en:'📎 Choose file',es:'📎 Elegir archivo'},
 hPaste:{ko:'HQ 운영본부가 만들어 준 <b>.json</b> 파일을 고르거나 내용을 붙여 넣으세요.',
         en:'Choose the <b>.json</b> file prepared by HQ Operations, or paste its contents.',
         es:'Elija el archivo <b>.json</b> preparado por HQ, o pegue su contenido.'},
 save:{ko:'☁️ 올리기',en:'☁️ Upload',es:'☁️ Subir'},
 print:{ko:'🖨 인쇄',en:'🖨 Print',es:'🖨 Imprimir'},
 del:{ko:'🗑 지우기',en:'🗑 Delete',es:'🗑 Borrar'},
 delQ:{ko:'이 확인서를 지울까요? 적어 둔 답도 같이 사라집니다.',
       en:'Delete this sheet? The answers written in it will be gone too.',
       es:'¿Borrar esta hoja? Las respuestas también se perderán.'},
 items:{ko:'{n}가지 확인',en:'{n} to check',es:'{n} para revisar'},
 doneN:{ko:'{a} / {n} 적음',en:'{a} / {n} answered',es:'{a} / {n} respondidas'},
 eff:{ko:'올린날 {d}',en:'Uploaded {d}',es:'Subido {d}'},
 none:{ko:'아직 확인서가 없습니다.',en:'No check sheets yet.',es:'Todavía no hay hojas.'},
 hName:{ko:'상품',en:'Item',es:'Producto'},
 hInfo:{ko:'알려 드리는 것',en:'What we know',es:'Lo que sabemos'},
 hAns:{ko:'여기에 적어 주세요',en:'Write here',es:'Escriba aquí'},
 saved:{ko:'적었습니다',en:'Saved',es:'Guardado'},
 need:{ko:'자료를 붙여 넣어 주세요',en:'Please paste the data',es:'Pegue los datos'},
 bad:{ko:'자료 모양이 맞지 않습니다 — HQ가 준 .json 그대로 넣어 주세요',
      en:'The data does not look right — paste the .json from HQ as it is',
      es:'Los datos no son válidos — pegue el .json de HQ tal cual'},
 ok:{ko:'올렸습니다',en:'Uploaded',es:'Subido'},
 sign:{ko:'확인한 사람 / 날짜',en:'Checked by / Date',es:'Revisado por / Fecha'}
};
let LANG='ko'; try{ LANG=localStorage.getItem('kimchi_lang')||'ko'; }catch(e){}
function t(k,v){ const o=L[k]; let s=o?(o[LANG]||o.ko):k; if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]); return s; }

/* 🔴 2026-10-12 전무님 — "언어 전환 해줘, 한국인은 소수라".
   화면 틀은 3개 언어였는데 **자료 안쪽 글**(묶음 제목·까닭·묻는 말·칸 이름)이 한국어로만 박혀 있었다.
   그래서 자료 쪽 글은 {ko,en,es} 로도 받을 수 있게 한다. 그냥 글자면 그대로 쓴다
   (상품명·금액처럼 번역할 필요가 없는 것). */
function tx(v){
  if (v && typeof v === 'object' && !Array.isArray(v)) return v[LANG] || v.ko || v.en || '';
  return v == null ? '' : String(v);
}

const BRANCHES=[{id:'HOLLYWOOD',ko:'할리우드',en:'Hollywood'},{id:'MIAMI',ko:'마이애미',en:'Miami'},
  {id:'PEMBROKE',ko:'펨브로크',en:'Pembroke'},{id:'CORAL',ko:'코럴스프링스',en:'Coral Springs'},
  {id:'LASOLAS',ko:'라스올라스',en:'Las Olas'}];
const bname=id=>{const b=BRANCHES.find(x=>x.id===id);return b?(LANG==='ko'?b.ko:b.en):id;};

const $=s=>document.getElementById(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function me(){ try{ return window.__currentUser||JSON.parse(localStorage.getItem('chat.me')||'{}'); }catch(e){ return {}; } }
const isBoss=()=>{ const m=me(); return m.branch==='*'||['OWNER','EXECUTIVE'].includes(m.role); };
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

let BRANCH=(function(){
  try{ const v=localStorage.getItem('km_branch'); if(BRANCHES.some(x=>x.id===v)) return v; }catch(e){}
  const m=me(); if(m.branch==='*'||['OWNER','EXECUTIVE'].includes(m.role)) return 'HOLLYWOOD';
  return (m&&BRANCHES.some(x=>x.id===m.branch))?m.branch:'HOLLYWOOD'; })();
let DATA={}, OPEN=null, F=null, SUBS=[], tt=null;

function toast(m){ const el=$('toast'); el.innerHTML=m; el.classList.add('on'); clearTimeout(tt);
  tt=setTimeout(()=>el.classList.remove('on'),2400); }
function setLang(l){ LANG=l; try{ localStorage.setItem('kimchi_lang',l); }catch(e){} paint(); render(); }

function paint(){
  $('tT').textContent=t('t'); $('tS').innerHTML=t('s'); $('tNew').textContent=t('nw');
  $('lVend').textContent=t('lVend'); $('lInv').textContent=t('lInv'); $('lPaste').textContent=t('lPaste');
  $('bFile').textContent=t('bFile'); $('hPaste').innerHTML=t('hPaste'); $('bSave').textContent=t('save');
  $('bNew').style.display=isBoss()?'':'none';
  $('br').innerHTML=BRANCHES.map(b=>'<option value="'+b.id+'"'+(b.id===BRANCH?' selected':'')+'>'+esc(bname(b.id))+'</option>').join('');
  $('br').disabled=!isBoss();
  ['ko','en','es'].forEach(l=>$('L'+l).classList.toggle('on',l===LANG));
}
function pickBranch(){ BRANCH=$('br').value;
  try{ localStorage.setItem('km_branch',BRANCH); }catch(e){} OPEN=null; watch(); }
function toggleNew(){ const b=$('newBox'); b.style.display=b.style.display==='none'?'':'none'; }

/* ===== 읽기 ===== */
function watch(){
  if(!F) return;
  SUBS.forEach(u=>{try{u()}catch(e){}}); SUBS=[]; DATA={};
  $('list').innerHTML='<div class="empty">⏳</div>';
  SUBS.push(F.onValue(F.ref(F.db,'expiry/'+BRANCH+'/checkSheets'), s=>{
    DATA={}; const v=s.val()||{};
    Object.entries(v).forEach(([k,o])=>{ if(o) DATA[k]={...o,_id:k,_br:BRANCH}; });
    render();
  }, e=>{ console.warn('[chk]',e); $('list').innerHTML='<div class="empty">'+esc(String(e.message||e))+'</div>'; }));
}

const total=b=>(b.groups||[]).reduce((a,g)=>a+(g.rows||[]).length,0);
const answered=b=>Object.keys(b.ans||{}).length;

function render(){
  const ids=Object.keys(DATA).sort((a,b)=>(DATA[b].ts||0)-(DATA[a].ts||0));
  if(!ids.length){ $('list').innerHTML='<div class="empty">'+esc(t('none'))+'</div>'; return; }
  $('list').innerHTML=ids.map(id=>{
    const b=DATA[id], n=total(b), a=answered(b);
    return '<div class="card">'
      +'<div class="h" onclick="openB(\''+id+'\')">'
      +'<div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px">'
        +'<span class="tag br">'+esc(bname(b.branch||BRANCH))+'</span>'
        +(b.vendor?'<span class="tag vd">'+esc(b.vendor)+'</span>':'')
        +(b.inv?'<span class="tag iv">'+esc(b.inv)+'</span>':'')
      +'</div>'
      +'<div class="ttl">'+esc(t('items',{n}))+'</div>'
      +'<div class="sub">'+esc(t('eff',{d:(b.got||'')}))+' · '+esc(b.by||'')+'</div></div>'
      +'<span class="pill '+(a>=n?'a':'b')+'">'+esc(t('doneN',{a,n}))+'</span></div>'
      +(OPEN===id?body(id,b):'')+'</div>';
  }).join('');
}

function body(id,b){
  let h='<div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap">'
    +'<button class="btn go sm" onclick="doPrint(\''+id+'\')">'+esc(t('print'))+'</button>'
    +(isBoss()?'<button class="btn sm" onclick="delB(\''+id+'\')">'+esc(t('del'))+'</button>':'')+'</div>';
  (b.groups||[]).forEach((g,gi)=>{
    h+='<div class="grp"><div class="gh"><div class="gt">'+esc(tx(g.title))+'</div>'
      +(g.why?'<div class="gw">'+esc(tx(g.why))+'</div>':'')
      +(g.how?'<div class="gx">👉 '+esc(tx(g.how))+'</div>':'')+'</div>'
      +'<table><tr><th style="width:38%">'+esc(t('hName'))+'</th><th style="width:28%">'+esc(t('hInfo'))+'</th>'
      +'<th>'+esc(t('hAns'))+'</th></tr>';
    (g.rows||[]).forEach((r,ri)=>{
      const key=gi+'_'+ri, got=(b.ans||{})[key]||{};
      /* 🔑 답을 담는 열쇠는 **묻는 말의 차례(q0,q1)** 다. 말 자체를 열쇠로 쓰면
         언어를 바꾸는 순간 적어 둔 답이 사라진 것처럼 보인다. */
      const any=(r.ask||[]).some((q,qi)=>String(got['q'+qi]||'').trim());
      h+='<tr class="'+(any?'done':'')+'">'
        +'<td><b>'+esc(r.name||'')+'</b>'+(r.code?'<div class="bc">'+esc(r.code)+'</div>':'')+'</td>'
        +'<td><div class="inf">'+(r.info||[]).map(p=>'<b>'+esc(tx(p[0]))+'</b> '+esc(tx(p[1]))).join('<br>')+'</div></td>'
        +'<td>'+(r.ask||[]).map((q,qi)=>'<div style="margin-bottom:6px"><div class="ansq">'+esc(tx(q))+'</div>'
            +'<input class="ans" value="'+esc(got['q'+qi]||'')+'" '
            +'onchange="saveAns(\''+id+'\',\''+key+'\',\'q'+qi+'\',this.value)"></div>').join('')
          +(got._by?'<div class="who">— '+esc(got._by)+'</div>':'')+'</td></tr>';
    });
    h+='</table></div>';
  });
  return h;
}
function openB(id){ OPEN=OPEN===id?null:id; render(); }

async function saveAns(id,key,q,val){
  const b=DATA[id]; if(!b) return;
  const m=me();
  try{
    await F.update(F.ref(F.db,'expiry/'+b._br+'/checkSheets/'+b._id+'/ans/'+key),
      { [q]:String(val||'').trim(), _by:(m.name||''), _ts:Date.now() });
    toast(t('saved'));
  }catch(e){ alert(String(e.message||e)); }
}
async function delB(id){ if(!confirm(t('delQ')))return;
  try{ await F.remove(F.ref(F.db,'expiry/'+DATA[id]._br+'/checkSheets/'+DATA[id]._id)); OPEN=null; }
  catch(e){ alert(String(e.message||e)); } }

/* ===== 올리기 (HQ) ===== */
function loadFile(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  $('fName').textContent=f.name;
  const rd=new FileReader();
  rd.onload=()=>{ $('nData').value=String(rd.result||'');
    try{ const j=JSON.parse($('nData').value);
      if(j.vendor&&!$('nVend').value) $('nVend').value=j.vendor;
      if(j.inv&&!$('nInv').value) $('nInv').value=j.inv;
    }catch(e){} };
  rd.readAsText(f,'utf-8');
  inp.value='';
}
async function createSheet(){
  const raw=$('nData').value.trim();
  if(!raw){ toast(t('need')); return; }
  let j; try{ j=JSON.parse(raw); }catch(e){ toast(t('bad')); return; }
  const groups=Array.isArray(j.groups)?j.groups:null;
  if(!groups||!groups.length||!groups.every(g=>Array.isArray(g.rows))){ toast(t('bad')); return; }
  const m=me();
  try{
    const r=F.push(F.ref(F.db,'expiry/'+BRANCH+'/checkSheets'));
    await F.set(r,{ vendor:($('nVend').value.trim()||j.vendor||''),
      inv:($('nInv').value.trim()||j.inv||''), title:j.title||'', src:j.src||'',
      groups, got:today(), branch:BRANCH, by:(m.name||''), byUid:(m.uid||''), ts:Date.now() });
    $('nData').value=''; $('nVend').value=''; $('nInv').value=''; $('fName').textContent='';
    $('newBox').style.display='none'; toast(t('ok'));
  }catch(e){ alert(String(e.message||e)); }
}

/* ===== 인쇄 — 손으로 적을 칸을 넉넉히 비운다 ===== */
function doPrint(id){
  const b=DATA[id]; if(!b) return;
  let h='<h1>'+esc(t('t'))+' — '+esc(bname(b.branch||BRANCH))+'</h1>'
    +'<div class="sub">'+esc([b.vendor,b.inv].filter(Boolean).join(' · '))
    +(b.src?'<br>'+esc(b.src):'')+'<br>'+esc(t('eff',{d:(b.got||'')}))+'</div>';
  (b.groups||[]).forEach((g,gi)=>{
    h+='<div class="gh"><div class="gt">'+esc(tx(g.title))+'</div>'
      +(g.why?'<div class="gw">'+esc(tx(g.why))+'</div>':'')
      +(g.how?'<div class="gx">👉 '+esc(tx(g.how))+'</div>':'')+'</div>'
      +'<table><tr><th style="width:34%">'+esc(t('hName'))+'</th><th style="width:26%">'+esc(t('hInfo'))+'</th>'
      +'<th>'+esc(t('hAns'))+'</th></tr>';
    (g.rows||[]).forEach((r,ri)=>{
      const got=(b.ans||{})[gi+'_'+ri]||{};
      h+='<tr><td><b>'+esc(r.name||'')+'</b>'+(r.code?'<br><span class="inf">'+esc(r.code)+'</span>':'')+'</td>'
        +'<td><span class="inf">'+(r.info||[]).map(p=>esc(tx(p[0]))+' '+esc(tx(p[1]))).join('<br>')+'</span></td>'
        +'<td class="wbox">'+(r.ask||[]).map((q,qi)=>'<div class="inf">'+esc(tx(q))+'</div>'
            +(String(got['q'+qi]||'').trim()?'<div><b>'+esc(got['q'+qi])+'</b></div>':'')).join('')+'</td></tr>';
    });
    h+='</table>';
  });
  h+='<div class="sg">'+esc(t('sign'))+' : ______________________________   ____ / ____ / ______</div>';
  $('pr').innerHTML=h;
  setTimeout(()=>window.print(),60);
}

function boot(){ paint(); watch(); }
if(window.__fb){ F=window.__fb; boot(); }
else window.addEventListener('fb-ready',()=>{ F=window.__fb; boot(); },{once:true});
