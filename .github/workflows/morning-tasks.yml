name: Daily Morning Tasks (Hollywood 4am ET)

# 매장(플로리다) 시간 기준 매일 4am 자동 발송.
# cron 은 UTC 기준. 정시(:00)에 cron 몰리면 GitHub 가 skip 자주 함 — 5/15
# 첫 실행 누락 사건 (총 발화 0건) 후 :07/:13 으로 옮김.
#   - 4am EDT (3월~11월, DST 적용) = 08:07 UTC
#   - 4am EST (11월~3월, 표준시)    = 09:07 UTC
# 추가로 5분 간격 retry 두 번 더 (08:13, 08:23 — 첫 발화가 GitHub 부하로
# 누락돼도 백업). 스크립트는 idempotent — 이미 있으면 skip 처리.
on:
  schedule:
    - cron: '7 8 * * *'    # 08:07 UTC = 4:07am EDT (여름) — 주 발화
    - cron: '13 8 * * *'   # 08:13 UTC — 1차 backup (EDT)
    - cron: '23 8 * * *'   # 08:23 UTC — 2차 backup (EDT)
    - cron: '7 9 * * *'    # 09:07 UTC = 4:07am EST (겨울) — 주 발화
    - cron: '13 9 * * *'   # 09:13 UTC — 1차 backup (EST)
    - cron: '23 9 * * *'   # 09:23 UTC — 2차 backup (EST)
  workflow_dispatch:       # 수동 발송 — Actions 탭에서 'Run workflow' 클릭
    inputs:
      branch:
        description: '대상 매장 ID (예: HOLLYWOOD, MIAMI)'
        required: false
        default: 'HOLLYWOOD'

jobs:
  send-daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send daily reports
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch || 'HOLLYWOOD' }}
        run: node scripts/daily-tasks.js
