name: Daily Morning Tasks (Stores 6:40am ET)

# 매장(플로리다) 시간 기준 매일 6:40am 자동 발송 — 직원 7am 출근 20분 전.
# 2026-05-20 전무님 명시: 7am 출근하니 6:40am 으로 변경 (이전 4:07am 너무 일렀음).
# cron 은 UTC 기준. 정시(:00)에 cron 몰리면 GitHub 가 skip 자주 함 — 5/15
# 첫 실행 누락 사건 (총 발화 0건) 후 :40/:45/:53 분 단위로 분산.
#   - 6:40am EDT (3월~11월, DST 적용) = 10:40 UTC
#   - 6:40am EST (11월~3월, 표준시)    = 11:40 UTC
# 추가로 5분·13분 간격 retry 두 번 더 — 첫 발화 누락 대비. 모두 7am 출근 전 발화.
# 스크립트는 idempotent — 이미 있으면 skip 처리.
on:
  schedule:
    - cron: '40 10 * * *'  # 10:40 UTC = 6:40am EDT (여름) — 주 발화
    - cron: '45 10 * * *'  # 10:45 UTC — 1차 backup (EDT)
    - cron: '53 10 * * *'  # 10:53 UTC — 2차 backup (EDT)
    - cron: '40 11 * * *'  # 11:40 UTC = 6:40am EST (겨울) — 주 발화
    - cron: '45 11 * * *'  # 11:45 UTC — 1차 backup (EST)
    - cron: '53 11 * * *'  # 11:53 UTC — 2차 backup (EST)
  workflow_dispatch:       # 수동 발송 — Actions 탭에서 'Run workflow' 클릭
    inputs:
      branch:
        description: 'ALL(=전 지점) 또는 단일 매장 ID (HOLLYWOOD/MIAMI/CORAL_SPRINGS/LASOLAS/PEMBROKE_PINES)'
        required: false
        default: 'ALL'

jobs:
  send-daily-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send daily reports
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch || 'ALL' }}
        run: node scripts/daily-tasks.js
