<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 재고 QR 스티커 · 김치마트</title>
<link rel="icon" href="./pwa-assets/icon-192.png" type="image/png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif}
body{background:#f4f6f9;color:#1f2937;padding-bottom:40px}
.bar{background:linear-gradient(135deg,#581c87,#7c2d92);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:1.05em;font-weight:800;flex:1;min-width:200px}
.bar select{background:rgba(255,255,255,.15);color:#fff;border:0;padding:9px 14px;border-radius:10px;font-size:.95em;font-weight:700}
.bar select option{background:#581c87}
.bar button{background:#fff;color:#7c2d92;border:0;border-radius:10px;padding:9px 18px;font-size:.95em;font-weight:800;cursor:pointer}
.hint{max-width:820px;margin:12px auto 0;padding:11px 14px;background:#f3e8ff;border-radius:10px;font-size:.85em;color:#6b21a8;line-height:1.6}
.sheet{max-width:820px;margin:14px auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.sheet h2{font-size:1.15em;color:#1f2937;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #7c2d92}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sticker{border:2px dashed #9ca3af;border-radius:12px;padding:12px 8px;text-align:center;page-break-inside:avoid}
.sticker .dept{font-size:1.05em;font-weight:900;margin-bottom:2px}
.sticker .dept-en{font-size:.72em;color:#6b7280;font-weight:600;margin-bottom:7px}
.sticker img{width:100%;max-width:150px;aspect-ratio:1;object-fit:contain}
.sticker .how{font-size:.68em;font-weight:800;color:#7c2d92;margin-top:6px;line-height:1.45}
.sticker .br{font-size:.62em;color:#9ca3af;font-weight:700;margin-top:4px}
@media print{
  body{background:#fff;padding:0}
  .bar,.hint{display:none!important}
  .sheet{box-shadow:none;border-radius:0;max-width:none;margin:0;padding:10px;page-break-after:always}
  .sheet:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<div class="bar">
  <h1>🎤 음성 재고 QR 스티커 (부서당 9장)</h1>
  <select id="branchSel"></select>
  <button onclick="window.print()">🖨️ 인쇄</button>
</div>
<div class="hint">부서(쿨러·매대)별로 한 페이지에 같은 QR 9장 — 잘라서 워크인 쿨러 문, 쇼케이스, 백룸 등 여러 곳에 붙이세요.
스캔하면 음성 재고 앱이 <b>해당 지점·부서로 바로 열립니다</b> → 말로 카운트 → 📤 채팅 보고(재고 파악 방, +1점).</div>
<div id="sheets"></div>
<script>
const APP_URL='https://specialmasterdj-sketch.github.io/kfood-guide/voice-stock.html';
const BRANCHES=[
  {id:'HOLLYWOOD',ko:'헐리우드',en:'Hollywood'},{id:'MIAMI',ko:'마이애미',en:'Miami'},
  {id:'CORAL_SPRINGS',ko:'코럴 스프링스',en:'Coral Springs'},{id:'LASOLAS',ko:'라스올라스',en:'Las Olas'},
  {id:'PEMBROKE_PINES',ko:'펨브로크 파인스',en:'Pembroke Pines'},{id:'WESTPALM',ko:'웨스트팜',en:'West Palm'},
];
const DEPTS=[
  {id:'produce',emoji:'🥬',ko:'야채',en:'Produce'},
  {id:'meat',emoji:'🥩',ko:'정육',en:'Meat'},
  {id:'seafood',emoji:'🐟',ko:'해산물',en:'Seafood'},
  {id:'frozen',emoji:'❄️',ko:'냉동',en:'Frozen'},
  {id:'chilled',emoji:'🧊',ko:'냉장',en:'Chilled'},
  {id:'general',emoji:'🛒',ko:'일반',en:'General'},
];
let BRANCH='HOLLYWOOD';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){
  const b=BRANCHES.find(x=>x.id===BRANCH)||{};
  document.getElementById('sheets').innerHTML=DEPTS.map(d=>{
    const url=APP_URL+'?b='+encodeURIComponent(BRANCH)+'&d='+encodeURIComponent(d.id);
    const qr='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=4&data='+encodeURIComponent(url);
    const sticker='<div class="sticker">'+
      '<div class="dept">'+d.emoji+' '+esc(d.ko)+' 재고</div>'+
      '<div class="dept-en">'+esc(d.en)+' · Voice Stock Count</div>'+
      '<img src="'+qr+'" alt="QR">'+
      '<div class="how">📷 스캔 → 🎤 말로 카운트 → 📤 보고 (+1점)<br>Scan → Speak → Report (+1pt)</div>'+
      '<div class="br">KIMCHI MART · '+esc(b.en||BRANCH)+'</div>'+
    '</div>';
    return '<div class="sheet"><h2>'+d.emoji+' '+esc(d.ko)+' ('+esc(d.en)+') — '+esc(b.ko||BRANCH)+' · 9장</h2><div class="grid">'+sticker.repeat(9)+'</div></div>';
  }).join('');
}
document.getElementById('branchSel').innerHTML=BRANCHES.map(b=>'<option value="'+b.id+'">'+esc(b.ko)+'</option>').join('');
document.getElementById('branchSel').onchange=function(){BRANCH=this.value;render();};
render();
</script>
</body>
</html>
