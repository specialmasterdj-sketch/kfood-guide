<script>
(function(){
  var BUST = 'barcodefix_2026_07_24_v1';
  try {
    var KEY='barcodefix.bust';
    if (localStorage.getItem(KEY)!==BUST) localStorage.setItem(KEY,BUST);
    var __lastAct = Date.now();
    ['pointerdown','keydown','touchstart','wheel'].forEach(function(ev){
      window.addEventListener(ev, function(){ __lastAct = Date.now(); }, {passive:true, capture:true});
    });
    var __pendingBust = null;
    function __busy(){
      try {
        var el = document.activeElement;
        if (el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'file'))) return true;
        var tas = document.querySelectorAll('textarea');
        for (var i = 0; i < tas.length; i++) if (tas[i].value) return true;
        if (Date.now() - __lastAct < 120000) return true;
      } catch(e){}
      return false;
    }
    function __applyBust(){
      if (!__pendingBust) return;
      if (__busy()) { setTimeout(__applyBust, 60000); return; }
      try { localStorage.setItem(KEY, __pendingBust); } catch(e){}
      location.reload();
    }
    setInterval(function(){
      fetch('./barcode-fix.html?bust='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
        var m=t.match(/var BUST = '([^']+)'/);
        if(m&&m[1]!==BUST&&m[1]!==__pendingBust){__pendingBust=m[1];__applyBust();}
      }).catch(function(){});
    }, 5*60*1000);
  } catch(e){}
})();
</script>

<style>
:root{
  --bg:#12161C; --surface:#1B212A; --surface2:#232B36; --line:#2B3440;
  --text:#F2EFEA; --mute:#8B93A1; --amber:#F2A93B; --mint:#34D399; --red:#F2645A;
  --mono:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto}

/* header */
.hd{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.hd .krow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
.hd .kicker{font-size:11px;letter-spacing:.14em;color:var(--amber);font-weight:700;margin-bottom:4px}
.hd h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hd .branch{font-size:12px;color:var(--mute);white-space:nowrap;text-align:right}
.hd .branch b{color:var(--text)}

/* tabs */
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font-weight:700;font-size:13px}
.tab.on{border-color:var(--amber);background:rgba(242,169,59,.12);color:var(--amber)}

.pad{padding:20px}

/* dropzone */
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;background:var(--surface)}
.drop .ico{font-size:32px;margin-bottom:10px}
.drop .t1{font-weight:700;margin-bottom:4px}
.drop .t2{font-size:13px;color:var(--mute)}

/* config card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card .ttl{font-weight:700;margin-bottom:14px;font-size:14px}
.fld{font-size:12px;color:var(--mute);margin-bottom:6px}
select.sel,input.txt{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:14px;outline:none}
.gap{height:10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--mute);cursor:pointer}
.chk input{width:16px;height:16px}

/* buttons */
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.bp{padding:11px 18px;border-radius:10px;border:none;background:var(--amber);color:#1A1300;font-weight:800;font-size:14px}
.bg{padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font-weight:700;font-size:14px}
.bga{border-color:var(--amber);color:var(--amber)}
.bgd{border-color:rgba(242,100,90,.35);color:var(--red)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.stat .n{font-size:20px;font-weight:800;font-family:var(--mono)}
.stat .l{font-size:11px;color:var(--mute);margin-top:2px}
.skipnote{font-size:12px;color:var(--mute);margin-bottom:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}

/* result rows */
.rlist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rscroll{max-height:420px;overflow-y:auto}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.rrow .nm{flex:1;min-width:0}
.rrow .nm .n1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm .bc{font-family:var(--mono);font-size:13px;color:var(--amber);margin-top:2px}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0}

/* checklist */
.synbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.syn{font-size:11px;color:var(--mute);padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.syn .ok{color:var(--mint);margin-left:6px}
.stripe{display:flex;gap:2px;height:10px;width:100%}
.stripe .b{flex-grow:1;border-radius:1px;transition:background .25s ease}
.progline{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--mute)}
.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;margin:12px 0;outline:none}
.clrow{display:flex;flex-direction:column;gap:8px}
.ci{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:all .15s ease}
.ci.done{border-color:var(--mint);background:rgba(52,211,153,.08)}
.ci .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;color:var(--bg);font-weight:900}
.ci.done .box{border-color:var(--mint);background:var(--mint)}
.ci .nm{flex:1;min-width:0}
.ci .nm .n1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci.done .nm .n1{text-decoration:line-through;color:var(--mute)}
.ci .nm .bc{font-family:var(--mono);font-size:13px;color:var(--amber);margin-top:2px}
.ci.done .nm .bc{color:var(--mute)}
.empty{text-align:center;padding:40px 20px;color:var(--mute)}
.empty .ico{font-size:28px;margin-bottom:8px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">

<script>
/* ==================== 상태 ==================== */
var TAB = 'convert';
var RAW = null;         // 데이터 행(헤더 제외)
var HEADERS = [];
var BARCODE_COL = 0, NAME_COL = 0, COST_COL = -1;
var ONLY_COST = true;
var PROCESSED = null;   // 변환 결과 배열
var FILE_NAME = '';
var CHECKLIST = {};     // {id:{name,full,type,status,checked,checkedAt,checkedBy}}
var CHK_META = null;    // {sentBy,sentAt,sourceFile}
var BRANCH = 'HOLLYWOOD';
var FB = null, DB_REF = null, UNSUB = null;

/* ==================== 체크디지트 수학 ==================== */
function onlyDigits(v){ return (v==null?'':''+v).replace(/\D/g,''); }
function upcaCheckDigit(d11){
  var odd=0,even=0;
  for(var i=0;i<11;i++){ var n=parseInt(d11[i],10); if((i+1)%2===1)odd+=n; else even+=n; }
  return (10-((odd*3+even)%10))%10;
}
function ean13CheckDigit(d12){
  var odd=0,even=0;
  for(var i=0;i<12;i++){ var n=parseInt(d12[i],10); if((i+1)%2===1)odd+=n; else even+=n; }
  return (10-((odd+even*3)%10))%10;
}
function resolveBarcode(raw){
  var d=onlyDigits(raw), len=d.length;
  if(len===11){ return {type:'UPC-A',status:'계산됨',full:d+upcaCheckDigit(d),note:'11자리 → 체크디지트 계산'}; }
  if(len===12){
    var chk=upcaCheckDigit(d.slice(0,11));
    if(chk===parseInt(d[11],10)) return {type:'UPC-A',status:'이미 완성',full:d,note:'12자리 그대로 유효한 UPC-A'};
    return {type:'EAN-13',status:'계산됨',full:d+ean13CheckDigit(d),note:'12자리 → 체크디지트 계산'};
  }
  if(len===13){
    var cd=ean13CheckDigit(d.slice(0,12));
    if(cd===parseInt(d[12],10)) return {type:'EAN-13',status:'이미 완성',full:d,note:'13자리 그대로 유효'};
    return {type:'EAN-13',status:'불일치',full:d,note:'체크디지트가 맞지 않음 — 직접 확인 필요'};
  }
  return {type:'알수없음',status:'확인필요',full:d,note:'자릿수 '+len+'개 — 표준 길이(11/12/13) 아님'};
}

/* ==================== 헬퍼 ==================== */
function esc(s){ return (s==null?'':''+s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function bestColumnGuess(rows, headers, predicate){
  var bestIdx=0,bestScore=-1;
  headers.forEach(function(_,idx){
    var score=0;
    rows.slice(0,30).forEach(function(r){ if(predicate(r[idx]))score++; });
    if(score>bestScore){ bestScore=score; bestIdx=idx; }
  });
  return bestIdx;
}
function tagColor(type){ return type==='UPC-A'?'#7CB8F2':(type==='EAN-13'?'#F2A93B':'#F2645A'); }
function statusColor(status){ return status==='이미 완성'?'#34D399':(status==='계산됨'?'#F2A93B':'#F2645A'); }
function tagHtml(type){ var c=tagColor(type); return '<span class="tag" style="background:'+c+'22;color:'+c+'">'+esc(type)+'</span>'; }
function statusHtml(status){ var c=statusColor(status); return '<span class="tag" style="background:'+c+'22;color:'+c+'">'+esc(status)+'</span>'; }
function meName(){ try{ return (JSON.parse(localStorage.getItem('chat.me')||'null')||{}).name||'직원'; }catch(e){ return '직원'; } }
function meBranch(){ try{ var b=(JSON.parse(localStorage.getItem('chat.me')||'null')||{}).branch; return (b&&b!=='*')?b:'HOLLYWOOD'; }catch(e){ return 'HOLLYWOOD'; } }

/* ==================== 탭 ==================== */
function setTab(t){
  TAB=t;
  document.getElementById('tabConvert').classList.toggle('on',t==='convert');
  document.getElementById('tabChecklist').classList.toggle('on',t==='checklist');
  document.getElementById('paneConvert').classList.toggle('hidden',t!=='convert');
  document.getElementById('paneChecklist').classList.toggle('hidden',t!=='checklist');
}

/* ==================== 파일 처리 ==================== */
document.getElementById('fileIn').addEventListener('change', function(e){ handleFile(e.target.files[0]); });
function handleFile(file){
  if(!file) return;
  FILE_NAME=file.name;
  var reader=new FileReader();
  reader.onload=function(e){
    var data=new Uint8Array(e.target.result);
    var wb=XLSX.read(data,{type:'array'});
    var sheet=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
    if(!rows.length) return;
    HEADERS=rows[0].map(function(h,i){ return h?String(h):('열 '+(i+1)); });
    RAW=rows.slice(1).filter(function(r){ return r.some(function(c){return c!=='';}); });
    BARCODE_COL=bestColumnGuess(RAW,HEADERS,function(v){ var d=onlyDigits(v); return d.length>=10&&d.length<=13; });
    NAME_COL=bestColumnGuess(RAW,HEADERS,function(v){ var s=(v==null?'':''+v); return s.length>1 && onlyDigits(s).length<s.length/2; });
    COST_COL=HEADERS.findIndex(function(h){ return /cost|원가|단가|매입/i.test(h); });
    PROCESSED=null;
    renderCols();
  };
  reader.readAsArrayBuffer(file);
}
function fillSelect(sel, selectedIdx, allowNone){
  var html='';
  if(allowNone) html+='<option value="-1"'+(selectedIdx<0?' selected':'')+'>선택 안 함</option>';
  HEADERS.forEach(function(h,i){ html+='<option value="'+i+'"'+(i===selectedIdx?' selected':'')+'>'+esc(h)+'</option>'; });
  sel.innerHTML=html;
}
function renderCols(){
  document.getElementById('dz').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('cfg').classList.remove('hidden');
  document.getElementById('cfgTitle').textContent=FILE_NAME+' · '+RAW.length+'개 행 인식됨';
  fillSelect(document.getElementById('selBarcode'),BARCODE_COL,false);
  fillSelect(document.getElementById('selName'),NAME_COL,false);
  fillSelect(document.getElementById('selCost'),COST_COL,true);
  document.getElementById('costChkWrap').classList.toggle('hidden',COST_COL<0);
  document.getElementById('onlyCost').checked=ONLY_COST;
}
document.getElementById('selBarcode').addEventListener('change',function(e){ BARCODE_COL=+e.target.value; });
document.getElementById('selName').addEventListener('change',function(e){ NAME_COL=+e.target.value; });
document.getElementById('selCost').addEventListener('change',function(e){ COST_COL=+e.target.value; document.getElementById('costChkWrap').classList.toggle('hidden',COST_COL<0); });
document.getElementById('onlyCost').addEventListener('change',function(e){ ONLY_COST=e.target.checked; });
function resetFile(){
  RAW=null;PROCESSED=null;HEADERS=[];FILE_NAME='';
  document.getElementById('fileIn').value='';
  document.getElementById('cfg').classList.add('hidden');
  document.getElementById('results').classList.add('hidden');
  document.getElementById('dz').classList.remove('hidden');
}
function backToCols(){ PROCESSED=null; renderCols(); }
function hasCostValue(row){
  if(COST_COL<0) return true;
  var v=row[COST_COL];
  if(v===''||v==null) return false;
  var num=parseFloat((''+v).replace(/[^0-9.-]/g,''));
  return !isNaN(num)&&num>0;
}

/* ==================== 변환 ==================== */
function runConversion(){
  if(!RAW) return;
  var source=(ONLY_COST&&COST_COL>=0)?RAW.filter(hasCostValue):RAW;
  PROCESSED=source.map(function(r){
    var rawBarcode=r[BARCODE_COL];
    var name=r[NAME_COL];
    var resolved=resolveBarcode(rawBarcode);
    return {
      id: onlyDigits(rawBarcode)+'-'+Math.random().toString(36).slice(2,7),
      name:(name==null?'':''+name),
      original:(rawBarcode==null?'':''+rawBarcode),
      type:resolved.type, status:resolved.status, full:resolved.full, note:resolved.note,
      row:r
    };
  });
  renderResults();
}
function renderResults(){
  document.getElementById('cfg').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  var s={total:PROCESSED.length,upc:0,ean:0,flagged:0,skipped:0};
  PROCESSED.forEach(function(p){
    if(p.type==='UPC-A')s.upc++; else if(p.type==='EAN-13')s.ean++;
    if(p.status==='확인필요'||p.status==='불일치')s.flagged++;
  });
  if(RAW&&ONLY_COST&&COST_COL>=0) s.skipped=RAW.length-PROCESSED.length;
  document.getElementById('stTotal').textContent=s.total;
  document.getElementById('stUpc').textContent=s.upc;
  document.getElementById('stEan').textContent=s.ean;
  var flag=document.getElementById('stFlag');
  flag.textContent=s.flagged; flag.style.color=s.flagged?'#F2645A':'#34D399';
  var sn=document.getElementById('skipNote');
  if(s.skipped>0){ sn.textContent='원가(cost) 없는 '+s.skipped+'개 상품은 제외하고 변환했어요.'; sn.classList.remove('hidden'); }
  else sn.classList.add('hidden');
  var html='';
  PROCESSED.forEach(function(p){
    html+='<div class="rrow"><div class="nm"><div class="n1">'+esc(p.name||'(이름없음)')+'</div>'+
          '<div class="bc">'+esc(p.full)+'</div></div>'+tagHtml(p.type)+statusHtml(p.status)+'</div>';
  });
  document.getElementById('resultRows').innerHTML=html;
}
function downloadFile(){
  if(!PROCESSED) return;
  var outRows=PROCESSED.map(function(p){
    var o={};
    HEADERS.forEach(function(h,i){ o[h]=p.row[i]; });
    o['완성 바코드']=p.full; o['바코드 타입']=p.type; o['상태']=p.status; o['비고']=p.note;
    return o;
  });
  var ws=XLSX.utils.json_to_sheet(outRows);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'완성바코드');
  XLSX.writeFile(wb,'완성바코드_'+(FILE_NAME||'결과')+'.xlsx');
}

/* ==================== Firebase 실시간 체크리스트 (지점별) ==================== */
function chkPath(){ return 'barcodeChecklist/'+BRANCH; }
function subscribeChecklist(){
  if(!FB) return;
  if(UNSUB){ try{UNSUB();}catch(e){} UNSUB=null; }
  DB_REF=FB.ref(FB.db, chkPath());
  UNSUB=FB.onValue(DB_REF, function(snap){
    var v=snap.val()||{};
    CHECKLIST=v.items||{};
    CHK_META=v.meta||null;
    document.getElementById('clLoading').classList.add('hidden');
    renderChecklist();
  }, function(err){
    document.getElementById('clLoading').textContent='불러오기 실패: '+(err&&err.code||err)+' — 로그인/규칙을 확인하세요.';
  });
}
function itemsArray(){ return Object.keys(CHECKLIST).map(function(k){ var it=CHECKLIST[k]; it.id=k; return it; }); }
function sendToChecklist(){
  if(!PROCESSED||!FB) return;
  var items={};
  PROCESSED.forEach(function(p){
    items[p.id]={ name:p.name||'(이름없음)', full:p.full, type:p.type, status:p.status, checked:false, checkedAt:null, checkedBy:null };
  });
  var payload={ items:items, meta:{ sentBy:meName(), sentAt:Date.now(), sourceFile:FILE_NAME, count:PROCESSED.length } };
  FB.set(FB.ref(FB.db,chkPath()), payload).then(function(){ setTab('checklist'); })
    .catch(function(e){ flashStorage('전송 실패 — 다시 시도해주세요'); });
}
function toggleCheck(id){
  var it=CHECKLIST[id]; if(!it||!FB) return;
  var next=!it.checked;
  it.checked=next; it.checkedAt=next?Date.now():null; it.checkedBy=next?meName():null; // 낙관적 갱신
  renderChecklist();
  FB.update(FB.ref(FB.db,chkPath()+'/items/'+id),{ checked:next, checkedAt:it.checkedAt, checkedBy:it.checkedBy })
    .catch(function(e){ flashStorage('저장 실패 — 다시 시도해주세요'); });
}
function resetChecks(){
  if(!FB||!Object.keys(CHECKLIST).length) return;
  var upd={};
  Object.keys(CHECKLIST).forEach(function(id){ upd[id+'/checked']=false; upd[id+'/checkedAt']=null; upd[id+'/checkedBy']=null; });
  FB.update(FB.ref(FB.db,chkPath()+'/items'),upd).catch(function(e){ flashStorage('초기화 실패'); });
}
function clearAll(){
  if(!FB) return;
  if(!confirm('이 지점('+BRANCH+') 체크리스트를 전체 삭제할까요?')) return;
  FB.remove(FB.ref(FB.db,chkPath())).catch(function(e){ flashStorage('삭제 실패'); });
}
function flashStorage(msg){
  var el=document.getElementById('storageMsg');
  el.textContent=msg; setTimeout(function(){ el.textContent=''; },2500);
}
function renderChecklist(){
  var arr=itemsArray();
  var body=document.getElementById('clBody'), empty=document.getElementById('clEmpty');
  if(!arr.length){ body.classList.add('hidden'); empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden'); body.classList.remove('hidden');
  // meta
  var meta=document.getElementById('synMeta');
  if(CHK_META&&CHK_META.sentAt){
    var d=new Date(CHK_META.sentAt);
    meta.textContent='· '+esc(CHK_META.sentBy||'')+' 전송 '+d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  } else meta.textContent='';
  // progress
  var done=arr.filter(function(c){return c.checked;}).length;
  document.getElementById('progText').textContent=done+' / '+arr.length+' 확인 완료';
  renderStripe(arr.length?done/arr.length:0);
  // list (search + sort unchecked first)
  var q=(document.getElementById('search').value||'').trim().toLowerCase();
  var list=arr;
  if(q) list=list.filter(function(it){ return (it.name||'').toLowerCase().indexOf(q)>=0 || (it.full||'').toLowerCase().indexOf(q)>=0; });
  list.sort(function(a,b){ return Number(a.checked)-Number(b.checked); });
  var html='';
  list.forEach(function(it){
    html+='<div class="ci'+(it.checked?' done':'')+'" onclick="toggleCheck(\''+it.id+'\')">'+
          '<div class="box">'+(it.checked?'✓':'')+'</div>'+
          '<div class="nm"><div class="n1">'+esc(it.name)+'</div><div class="bc">'+esc(it.full)+'</div></div>'+
          '<span class="tag" style="background:'+tagColor(it.type)+'22;color:'+tagColor(it.type)+'">'+esc(it.type)+'</span></div>';
  });
  document.getElementById('clItems').innerHTML=html;
}
function renderStripe(progress){
  var bars=40, filled=Math.round(bars*progress), html='';
  for(var i=0;i<bars;i++){
    var w=(i*37)%5===0?3:((i*13)%7===0?1:2);
    html+='<div class="b" style="width:'+w+'px;background:'+(i<filled?'#F2A93B':'#2B3440')+'"></div>';
  }
  document.getElementById('stripe').innerHTML=html;
}

/* ==================== 부팅 ==================== */
function boot(){
  BRANCH=meBranch();
  document.getElementById('branchLbl').textContent=BRANCH;
  if(window.__fb){ FB=window.__fb; subscribeChecklist(); }
}
window.addEventListener('fb-ready', boot);
if(window.__fb){ boot(); }
// 로그인 준비되면 지점 라벨/구독 갱신 (chat.me 늦게 채워지는 경우)
window.addEventListener('fb-auth-ready', function(){
  var b=meBranch();
  if(b!==BRANCH){ BRANCH=b; document.getElementById('branchLbl').textContent=BRANCH; subscribeChecklist(); }
});
</script>
