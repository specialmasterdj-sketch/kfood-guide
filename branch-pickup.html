<style>
:root{
  --green:#1a5c3a; --green2:#15803d; --lgreen:#e8f5ee; --bg:#f4f7f5; --card:#fff;
  --line:#e2e8e5; --text:#1f2937; --mute:#6b7280; --amber:#b45309; --red:#dc2626;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:1em}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding-bottom:60px}
.hd{background:var(--green);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:20}
.hd .t{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd h1{font-size:1.15em;font-weight:800;letter-spacing:-.01em}
.hd .me{font-size:.78em;opacity:.92;font-weight:600;text-align:right;line-height:1.3}
.langs{display:flex;gap:4px;margin-top:8px}
.langs button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:6px;padding:3px 10px;font-size:.76em;font-weight:700}
.langs button.on{background:#fff;color:var(--green)}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.tabs button{flex:1;background:none;border:0;padding:13px 8px;font-weight:800;color:var(--mute);font-size:.98em;border-bottom:3px solid transparent}
.tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.page{display:none;padding:16px}
.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
label.lbl{display:block;font-weight:700;font-size:.86em;color:var(--mute);margin:2px 0 6px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
input:focus,select:focus{outline:0;border-color:var(--green)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:800}
.btn.sec{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.grey{background:#eef2f0;color:#374151;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
#reader{width:100%;border-radius:12px;overflow:hidden;margin-top:10px}
#reader.live{min-height:230px;background:#000}
#reader:not(.live){display:none}
.banner{margin-top:10px;border-radius:10px;padding:11px 13px;font-weight:700;display:none}
.banner.show{display:block}
.banner.ok{background:#dcfce7;color:#166534}
.banner.nf{background:#fef3c7;color:#92400e}
.cart{margin-top:6px}
.citem{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.citem:last-child{border-bottom:0}
.citem .nm{flex:1;min-width:0}
.citem .nm .n1{font-weight:700;font-size:.95em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .nm .n2{font-size:.75em;color:var(--mute);font-variant-numeric:tabular-nums}
.qtybox{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.qtybox button{width:34px;height:34px;background:#f3f5f4;border:0;font-size:1.1em;font-weight:800;color:var(--green)}
.qtybox input{width:44px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;padding:8px 2px}
.citem .del{background:none;border:0;color:var(--red);font-size:1.1em;padding:4px 6px}
.muted{color:var(--mute);font-size:.88em;text-align:center;padding:16px 4px}
.sumrow{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--lgreen);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:1.35em;font-weight:900;color:var(--green)}
.stat span{font-size:.72em;color:var(--green2);font-weight:700}
.datenav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.datenav input{flex:1}
.datenav button{width:44px;padding:11px 0;background:#fff;border:1.5px solid var(--line);border-radius:10px;font-weight:800;color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:.86em}
th{background:var(--lgreen);color:var(--green);font-weight:800;padding:8px 6px;text-align:left;font-size:.8em}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td .p{font-weight:700}
td .b{font-size:.82em;color:var(--mute);font-variant-numeric:tabular-nums}
.tag{display:inline-block;background:#eef2f0;border-radius:6px;padding:2px 7px;font-size:.8em;font-weight:700;color:#374151}
.tools{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.tools .btn{flex:1;padding:10px;font-size:.9em}
.qp-tabs{display:flex;gap:6px;margin-bottom:10px}
.qp-tabs button{flex:1;background:#f3f5f4;border:1.5px solid var(--line);border-radius:9px;padding:8px;font-weight:800;color:var(--mute);font-size:.9em}
.qp-tabs button.on{background:var(--lgreen);border-color:var(--green);color:var(--green)}
.qpchips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;font-weight:700;font-size:.92em;color:var(--text)}
.chip:active{background:var(--lgreen)}
.chip.add{border-style:dashed;color:var(--green);border-color:var(--green)}
.chip .x{color:var(--red);font-weight:900;font-size:1.05em;line-height:1;margin-left:2px;padding:0 2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 20px;border-radius:12px;font-weight:800;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.25);display:none}
.delrow{background:none;border:0;color:var(--red);font-weight:700;font-size:.82em;padding:2px 4px}
@media print{
  .hd,.tabs,.tools,.datenav,.langs,.delrow{display:none!important}
  .page:not(.on){display:none}
  body{background:#fff}
  .card{box-shadow:none;border:0}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* ============ 체크디지트 / 바코드 ============ */
function onlyDigits(v){return (v==null?'':''+v).replace(/\D/g,'');}
function upcaCD(d11){var o=0,e=0;for(var i=0;i<11;i++){var n=+d11[i];if((i+1)%2===1)o+=n;else e+=n;}return (10-((o*3+e)%10))%10;}
function ean13CD(d12){var o=0,e=0;for(var i=0;i<12;i++){var n=+d12[i];if((i+1)%2===1)o+=n;else e+=n;}return (10-((o+e*3)%10))%10;}
function ean8CD(d7){var s=0;for(var i=0;i<7;i++){s+=((i%2===0)?3:1)*(+d7[i]);}return (10-(s%10))%10;}
function fullFromPos(pos){
  var d=onlyDigits(pos),len=d.length;
  if(len===7)return d+ean8CD(d);
  if(len===11)return d+upcaCD(d);
  if(len===12)return d+ean13CD(d);
  return d;
}
function lstrip0(s){return String(s||'').replace(/^0+/,'')||'0';}

/* ============ 제품명 조회 — products/{지점} (상품조회 앱과 동일 소스) ============ */
var barcodeIndex={};   // 바코드 변형키 -> 제품명
var CAT_COUNT=0;
function eanCheckDigit(d12){var s=0;for(var i=0;i<12;i++){s+=(+d12[i])*((i%2)?3:1);}return String((10-(s%10))%10);}
function barcodeKeys(raw){
  var keys=[];var s=String(raw||'').trim();if(!s)return keys;keys.push(s);
  var d=s.replace(/\D/g,'');if(!d)return keys;keys.push(d);
  [8,11,12,13].forEach(function(len){if(d.length<=len)keys.push(d.padStart(len,'0'));});
  var st=d.replace(/^0+/,'');if(st)keys.push(st);
  if(d.length===12)keys.push(d+eanCheckDigit(d));
  else if(d.length===13)keys.push(d.slice(0,12));
  return keys;
}
function rowsArr(payload){
  if(!payload)return[];
  if(Array.isArray(payload))return payload;
  if(payload.rows)return Array.isArray(payload.rows)?payload.rows:Object.values(payload.rows);
  if(typeof payload==='object')return Object.values(payload);
  return[];
}
function buildProductIndex(payload){
  barcodeIndex={};CAT_COUNT=0;
  rowsArr(payload).forEach(function(r){
    if(!r||typeof r!=='object')return;
    var name=r.NAME||r.name||r.Name||'';
    var bc=r.FULL_BARCODE||r.fullbarcode||r.barcode||r.Barcode||'';
    if(!name||!bc)return;
    barcodeKeys(bc).forEach(function(k){if(!barcodeIndex[k])barcodeIndex[k]=name;});
    CAT_COUNT++;
  });
}
function findProduct(code){
  var d=String(code||'').replace(/\D/g,'');
  if(!d)return null;
  // POS 데이터는 끝자리(체크디지트)가 빠져 있음 → 스캔한 풀바코드 그대로 + 끝자리 뗀 값 둘 다 매칭
  var forms=[d];
  if(d.length>=5) forms.push(d.slice(0,-1));   // 끝자리 제거 = POS 원본
  for(var f=0;f<forms.length;f++){
    var ks=barcodeKeys(forms[f]);
    for(var i=0;i<ks.length;i++){if(barcodeIndex[ks[i]])return {name:barcodeIndex[ks[i]]};}
  }
  return null;
}
function setCatStatus(kind){
  var el=document.getElementById('catStatus');if(!el)return;
  if(kind==='loading'){el.textContent='⏳ '+t('catLoading');el.style.color='var(--mute)';}
  else if(kind==='ok'){el.textContent=t('catReady')(CAT_COUNT);el.style.color='var(--green2)';}
  else{el.textContent='⚠ '+t('catNone');el.style.color='var(--amber)';}
}
function buildFromCatalog(){
  barcodeIndex={};CAT_COUNT=0;
  var cat=window.PICKUP_CATALOG||{};
  Object.keys(cat).forEach(function(code){
    var name=cat[code];if(!name)return;
    barcodeKeys(code).forEach(function(k){if(!barcodeIndex[k])barcodeIndex[k]=name;});
    CAT_COUNT++;
  });
}
function loadCatalog(){
  setCatStatus('loading');
  if(window.PICKUP_CATALOG){buildFromCatalog();setCatStatus(CAT_COUNT?'ok':'none');return;}
  // 카탈로그 파일이 아직 로딩 안됐으면 잠깐 기다렸다 재시도
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    if(window.PICKUP_CATALOG){clearInterval(iv);buildFromCatalog();setCatStatus(CAT_COUNT?'ok':'none');}
    else if(tries>25){clearInterval(iv);setCatStatus('none');}
  },200);
}

/* ============ 가져간 사람 — 지점 직원 명단에서 선택 ============ */

  var sel=document.getElementById('fPersonSel'); if(!sel)return;
  var cur=sel.value;

function getPerson(){
  var sel=document.getElementById('fPersonSel');

function onBranchPick(){
  var code=document.getElementById('fBranch').value;
  PERSON_NAMES=[]; fillPersonSelect([]);   // 초기화 (선택 안내 + 직접입력만)
  if(!code)return;
  fetch(DBURL+'/schedules/'+code+'/employees.json',{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(data){
      if(!data)return;
      var arr=Array.isArray(data)?data:Object.values(data);
      var names=arr.filter(function(e){return e&&e.name;}).map(function(e){return e.name;});
      names.sort(function(a,b){return String(a).localeCompare(String(b));});
      PERSON_NAMES=names;
      fillPersonSelect(names);
    }).catch(function(){});
}
window.onBranchPick=onBranchPick;

/* ============ 스캐너 ============ */
var SCANNER=null, LAST={code:'',t:0};
function toggleScan(){ if(window.__scanning) stopScan(); else startScan(); }
window.toggleScan=toggleScan;
function startScan(){
  if(typeof Html5Qrcode==='undefined'){alert('스캐너 로딩 실패 — 인터넷 확인 후 새로고침');return;}
  ensureAudio();   // 사용자 터치 시점에 오디오 활성화 (iOS 소리 보장)
  var reader=document.getElementById('reader'); reader.classList.add('live');
  SCANNER=new Html5Qrcode('reader');
  var fmts;
  try{fmts=[Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF];}catch(e){fmts=undefined;}
  function qb(vw){var w=Math.max(160,Math.min((vw||300)-30,320));return {width:w,height:Math.round(w*0.6)};}
  var config={fps:10,qrbox:qb,formatsToSupport:fmts};
  function onOk(){window.__scanning=true;var sb=document.getElementById('scanBtn');sb.innerHTML='⏹ <span id="L_scanBtn">'+t('scanStop')+'</span>';}
  function onFail(err){
    Html5Qrcode.getCameras().then(function(cams){
      if(!cams||!cams.length)throw new Error('카메라 없음');
      var back=cams.find(function(c){return /back|rear|environment|후면/i.test(c.label||'');})||cams[cams.length-1];
      return SCANNER.start(back.id,config,function(x){handleScan(x);},function(){});
    }).then(onOk).catch(function(e2){
      reader.classList.remove('live');SCANNER=null;
      alert('카메라를 열 수 없습니다.\n\n확인:\n· 카메라 권한 "허용"\n· 아이폰은 Safari 브라우저에서 열기\n· 다른 앱이 카메라 사용 중인지');
    });
  }
  SCANNER.start({facingMode:'environment'},config,function(x){handleScan(x);},function(){}).then(onOk).catch(onFail);
}
function stopScan(){
  window.__scanning=false;
  var sb=document.getElementById('scanBtn');sb.innerHTML='📷 <span id="L_scanBtn">'+t('scanBtn')+'</span>';
  if(SCANNER){try{SCANNER.stop().then(function(){try{SCANNER.clear();}catch(e){}SCANNER=null;}).catch(function(){SCANNER=null;});}catch(e){SCANNER=null;}}
  var reader=document.getElementById('reader');reader.innerHTML='';reader.classList.remove('live');
}
/* iOS 대응 — 사용자 터치(스캔 시작) 때 오디오 컨텍스트를 만들어 두고 재사용 */
var AUDIO=null;
function ensureAudio(){
  try{ if(!AUDIO){AUDIO=new (window.AudioContext||window.webkitAudioContext)();} if(AUDIO.state==='suspended'){AUDIO.resume();} }catch(e){}
}
function beep(ok){
  ensureAudio();
  try{
    if(AUDIO){
      var o=AUDIO.createOscillator(),g=AUDIO.createGain();
      o.connect(g);g.connect(AUDIO.destination);
      o.type='square'; o.frequency.value=ok?1050:280;
      var tnow=AUDIO.currentTime, dur=ok?0.16:0.34;
      g.gain.setValueAtTime(0.0001,tnow);
      g.gain.exponentialRampToValueAtTime(0.4,tnow+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,tnow+dur);
      o.start(tnow); o.stop(tnow+dur+0.02);
    }
  }catch(e){}
  try{ if(navigator.vibrate){ navigator.vibrate(ok?70:[90,60,90]); } }catch(e){}
}
function handleScan(raw){
  var code=onlyDigits(raw);
  if(code.length<6)return;
  var now=Date.now();
  if(code===LAST.code&&now-LAST.t<2200)return;
  LAST={code:code,t:now};
  var p=findProduct(code);
  var name=p?p.name:'';
  addToCart(code,name);
  beep(true);
  var b=document.getElementById('banner');
  b.className='banner show '+(p?'ok':'nf');
  b.innerHTML=(p?'✅ ':'➕ ')+esc(name||t('notInCat'))+' <span style="opacity:.7;font-size:.85em">'+esc(code)+'</span>';
}

/* ============ 바코드 없는 품목 빠른선택 ============ */
var QP_BUILTIN={
  veg:['대파','쪽파','양파','마늘','생강','배추','무','오이','애호박','당근','감자','고구마','청양고추','풋고추','부추','상추','깻잎','콩나물','숙주','미나리','시금치','알타리무','열무'],
  supply:['비닐봉투','장갑','랩','은박지','종이타월','세제','행주','수세미','영수증용지','가격표','테이프','마커','쓰레기봉투','앞치마']
};
var QP_CUSTOM={veg:{},supply:{}};
var QP_CAT='veg';
function qpTab(cat){QP_CAT=cat;document.querySelectorAll('.qp-tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.cat===cat);});renderQuick();}
window.qpTab=qpTab;
function subscribeQuick(){
  var fb=window.__fb;if(!fb)return;
  fb.onValue(fb.ref(fb.db,'receiving/quickItems'),function(snap){QP_CUSTOM=snap.val()||{veg:{},supply:{}};renderQuick();});
}
var QP_LIST=[];   // 렌더된 칩의 raw 이름 (인덱스로 참조 — 이스케이프 문제 방지)
function renderQuick(){
  var el=document.getElementById('qpChips');if(!el)return;
  var builtin=QP_BUILTIN[QP_CAT]||[];
  var custom=QP_CUSTOM[QP_CAT]||{};
  var canDel=isMgr();
  QP_LIST=[];
  var html=builtin.map(function(n){
    var i=QP_LIST.push(n)-1;
    return '<button class="chip" onclick="qpPick('+i+')">'+esc(n)+'</button>';
  }).join('');
  html+=Object.keys(custom).map(function(id){
    var n=custom[id];var i=QP_LIST.push(n)-1;
    return '<span class="chip"><span onclick="qpPick('+i+')">'+esc(n)+'</span>'+(canDel?'<span class="x" onclick="qpDel(\''+id+'\')">×</span>':'')+'</span>';
  }).join('');
  html+='<button class="chip add" onclick="qpNew()">'+t('qpAdd')+'</button>';
  el.innerHTML=html;
}
function qpPick(i){var n=QP_LIST[i];if(n==null)return;qpAdd(n);}
window.qpPick=qpPick;
function qpAdd(name){addToCart('',name);beep(true);var b=document.getElementById('banner');b.className='banner show ok';b.innerHTML='➕ '+esc(name);}
window.qpAdd=qpAdd;
function qpNew(){
  var name=prompt(t('qpPrompt'));if(!name)return;name=name.trim();if(!name)return;
  var fb=window.__fb;if(!fb){alert('연결 대기중');return;}
  var id=newId();
  fb.set(fb.ref(fb.db,'receiving/quickItems/'+QP_CAT+'/'+id),name).catch(function(e){alert('추가 실패: '+(e.message||e));});
}
window.qpNew=qpNew;
function qpDel(id){
  if(!confirm(t('qpDelC')))return;
  var fb=window.__fb;fb.remove(fb.ref(fb.db,'receiving/quickItems/'+QP_CAT+'/'+id)).catch(function(e){alert('삭제 실패: '+(e.message||e));});
}
window.qpDel=qpDel;

/* ============ 카트 ============ */
var CART=[];  // {barcode, name, qty}
function addToCart(barcode,name){
  var key=onlyDigits(barcode);
  var found=null;
  for(var i=0;i<CART.length;i++){ if(key && CART[i].barcode===key){found=CART[i];break;} }
  if(found){found.qty+=1;}
  else{CART.push({barcode:key,name:name||'',qty:1});}
  renderCart();
}
function manualAdd(){
  var name=document.getElementById('mName').value.trim();
  var bc=onlyDigits(document.getElementById('mBc').value);
  var qty=parseInt(document.getElementById('mQty').value,10)||1;
  if(!name&&!bc){document.getElementById('mName').focus();return;}
  if(!name&&bc){var p=findProduct(bc);if(p)name=p.name;}
  // 같은 바코드 있으면 합치기
  var merged=false;
  if(bc){for(var i=0;i<CART.length;i++){if(CART[i].barcode===bc){CART[i].qty+=qty;merged=true;break;}}}
  if(!merged)CART.push({barcode:bc,name:name||'',qty:qty});
  document.getElementById('mName').value='';document.getElementById('mBc').value='';document.getElementById('mQty').value='1';
  renderCart();
  document.getElementById('mName').focus();
}
window.manualAdd=manualAdd;
function cartQty(i,delta){CART[i].qty=Math.max(1,(CART[i].qty||1)+delta);renderCart();}
function cartSetQty(i,v){var n=parseInt(v,10);CART[i].qty=(isNaN(n)||n<1)?1:n;}
function cartDel(i){CART.splice(i,1);renderCart();}
function cartRename(i,v){CART[i].name=v;}
window.cartQty=cartQty;window.cartSetQty=cartSetQty;window.cartDel=cartDel;window.cartRename=cartRename;
function renderCart(){
  var el=document.getElementById('cart');if(!el)return;
  if(!CART.length){el.innerHTML='<div class="muted">'+t('cartEmpty')+'</div>';return;}
  el.innerHTML=CART.map(function(c,i){
    return '<div class="citem">'+
      '<div class="nm"><input class="n1" style="border:0;padding:2px 0;width:100%" value="'+esc(c.name)+'" placeholder="'+t('mNamePh')+'" onchange="cartRename('+i+',this.value)">'+
      (c.barcode?'<div class="n2">'+esc(c.barcode)+'</div>':'')+'</div>'+
      '<div class="qtybox"><button onclick="cartQty('+i+',-1)">−</button>'+
      '<input type="number" min="1" value="'+c.qty+'" onchange="cartSetQty('+i+',this.value)"><button onclick="cartQty('+i+',1)">＋</button></div>'+
      '<button class="del" onclick="cartDel('+i+')">🗑</button></div>';
  }).join('');
}

/* ============ 저장 ============ */
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(el.__t);el.__t=setTimeout(function(){el.style.display='none';},1800);}
function saveAll(){
  var branch=document.getElementById('fBranch').value;
  if(!branch){alert(t('needBranch'));return;}
  if(!CART.length){alert(t('needItems'));return;}
  var person=getPerson();
  var note=document.getElementById('fNote').value.trim();
  var fb=window.__fb; if(!fb){alert('연결 대기중 — 잠시 후 다시');return;}
  var at=Date.now(); var dk=todayKey(); var sid=newId();
  var writes=CART.map(function(c){
    var id=newId();
    var rec={branch:branch,person:person,barcode:c.barcode||'',name:c.name||'',qty:c.qty||1,note:note,
             by:meName(),byBranch:meBranch(),at:at,session:sid};
    return fb.set(fb.ref(fb.db,'receiving/branchPickups/'+dk+'/'+id),rec);
  });
  Promise.all(writes).then(function(){
    CART=[];renderCart();
    document.getElementById('fNote').value='';
    var b=document.getElementById('banner');b.className='banner';
    toast(t('saved'));
  }).catch(function(e){alert('저장 실패: '+(e.message||e)+'\n로그인/인터넷 확인');});
}
window.saveAll=saveAll;

/* ============ 내역 ============ */
var LOG_DATA={}, LOG_UNSUB=null;
function shiftDay(delta){
  var inp=document.getElementById('logDate');
  var d=inp.value?new Date(inp.value+'T00:00:00'):new Date();
  d.setDate(d.getDate()+delta);
  inp.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  subscribeLog();
}
window.shiftDay=shiftDay;
function subscribeLog(){
  var fb=window.__fb;if(!fb)return;
  var dk=document.getElementById('logDate').value||todayKey();
  document.getElementById('logDate').value=dk;
  if(LOG_UNSUB){try{LOG_UNSUB();}catch(e){}LOG_UNSUB=null;}
  var r=fb.ref(fb.db,'receiving/branchPickups/'+dk);
  LOG_UNSUB=fb.onValue(r,function(snap){LOG_DATA=snap.val()||{};renderLog();});
}
window.subscribeLog=subscribeLog;
function currentLogRows(){
  var bf=document.getElementById('logBranch').value;
  var rows=Object.keys(LOG_DATA).map(function(id){return Object.assign({id:id},LOG_DATA[id]);});
  if(bf)rows=rows.filter(function(r){return r.branch===bf;});
  rows.sort(function(a,b){return (b.at||0)-(a.at||0);});
  return rows;
}
function renderLog(){
  var el=document.getElementById('logList');if(!el)return;
  var rows=currentLogRows();
  var totQ=0,brset={};rows.forEach(function(r){totQ+=(+r.qty||0);brset[r.branch]=1;});
  document.getElementById('statCount').textContent=rows.length;
  document.getElementById('statQty').textContent=totQ;
  document.getElementById('statBranch').textContent=Object.keys(brset).length;
  if(!rows.length){el.innerHTML='<div class="muted">'+t('logEmpty')+'</div>';return;}
  var canDel=isMgr();
  var html='<table><thead><tr><th>'+t('colTime')+'</th><th>'+t('colBranch')+'</th><th>'+t('colItem')+'</th><th style="text-align:center">'+t('colQty')+'</th><th>'+t('colPerson')+'</th>'+(canDel?'<th></th>':'')+'</tr></thead><tbody>';
  html+=rows.map(function(r){
    var tm=new Date(r.at||0);var hh=String(tm.getHours()).padStart(2,'0')+':'+String(tm.getMinutes()).padStart(2,'0');
    return '<tr><td class="b">'+hh+'</td>'+
      '<td><span class="tag">'+esc(branchName(r.branch))+'</span></td>'+
      '<td><div class="p">'+esc(r.name||'-')+'</div>'+(r.barcode?'<div class="b">'+esc(r.barcode)+'</div>':'')+(r.note?'<div class="b">📝 '+esc(r.note)+'</div>':'')+'</td>'+
      '<td style="text-align:center;font-weight:800">'+esc(r.qty||1)+'</td>'+
      '<td class="b">'+esc(r.person||'')+'<br><span style="opacity:.7">'+esc(r.by||'')+'</span></td>'+
      (canDel?'<td><button class="delrow" onclick="delRec(\''+r.id+'\')">'+t('del')+'</button></td>':'')+
      '</tr>';
  }).join('');
  html+='</tbody></table>';
  el.innerHTML=html;
}
window.renderLog=renderLog;
function isMgr(){
  var m=meObj();var role=String(m.role||'').toUpperCase();
  var em=String(m.email||'').toLowerCase();
  if(em==='specialmasterdj@gmail.com'||em==='byhoki64@gmail.com')return true;
  return /OWNER|EXECUTIVE|MANAGER|ASSISTANT|SUPERVISOR|사장|전무|매니저/.test(role);
}
function delRec(id){
  if(!confirm(t('confirmDel')))return;
  var fb=window.__fb;var dk=document.getElementById('logDate').value||todayKey();
  fb.remove(fb.ref(fb.db,'receiving/branchPickups/'+dk+'/'+id)).catch(function(e){alert('삭제 실패: '+(e.message||e));});
}
window.delRec=delRec;

/* ============ 엑셀 / 내보내기 ============ */
function rowsToSheet(rows){
  return rows.map(function(r){
    var tm=new Date(r.at||0);
    var o={};
    o[t('colTime')]=tm.toLocaleString();
    o[t('colBranch')]=branchName(r.branch);
    o[t('colItem')]=r.name||'';
    o['바코드/Barcode']=r.barcode||'';
    o[t('colQty')]=r.qty||1;
    o[t('colPerson')]=r.person||'';
    o[t('colNote')]=r.note||'';
    o[t('colBy')]=r.by||'';
    return o;
  });
}
function exportDay(){
  var rows=currentLogRows();
  if(!rows.length){alert(t('logEmpty'));return;}
  var dk=document.getElementById('logDate').value;
  var ws=XLSX.utils.json_to_sheet(rowsToSheet(rows));
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,dk);
  XLSX.writeFile(wb,'반출기록_'+dk+'.xlsx');
}
window.exportDay=exportDay;
function exportMonth(){
  var dk=document.getElementById('logDate').value||todayKey();
  var ym=dk.slice(0,7);
  fetch(DBURL+'/receiving/branchPickups.json',{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(all){
      if(!all){alert('데이터 없음');return;}
      var rows=[];
      Object.keys(all).forEach(function(day){
        if(day.slice(0,7)!==ym)return;
        var bucket=all[day]||{};
        Object.keys(bucket).forEach(function(id){rows.push(Object.assign({id:id},bucket[id]));});
      });
      var bf=document.getElementById('logBranch').value;
      if(bf)rows=rows.filter(function(r){return r.branch===bf;});
      if(!rows.length){alert(ym+' 기록 없음');return;}
      rows.sort(function(a,b){return (a.at||0)-(b.at||0);});
      var ws=XLSX.utils.json_to_sheet(rowsToSheet(rows));
      var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,ym);
      XLSX.writeFile(wb,'반출기록_'+ym+'.xlsx');
    }).catch(function(e){alert('불러오기 실패: '+(e.message||e));});
}
window.exportMonth=exportMonth;

/* ============ 부팅 ============ */
function updateMe(){var m=meObj();document.getElementById('mePill').innerHTML=esc(m.name||'—')+'<br>'+esc(branchName(m.branch));}
var __booted=false;
function boot(){
  if(__booted)return;__booted=true;
  fillBranchSelects();
  applyLang();
  updateMe();
  renderCart();
  document.getElementById('logDate').value=todayKey();
  loadCatalog();
  subscribeQuick();
  renderQuick();
  // me 기본 지점이 헐리우드가 아니면(다른 지점에서 열어도) 그대로 — 기록은 '가져가는 지점' 기준
}
window.addEventListener('fb-ready',boot);
if(window.__fb)boot();
window.addEventListener('storage',function(e){if(e.key==='chat.me'){updateMe();}});
setTimeout(function(){updateMe();},1500);
</script>
