<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>인보이스 접수</title>
<meta name="theme-color" content="#1a5c3a">
<link rel="manifest" href="./manifest.json">
<!-- fb-auth-fetch 먼저 — fetch 에 로그인 토큰 자동 부착. auth-gate 가 로그인/승인 확인. -->
<script type="module" src="./fb-auth-fetch.js?v=4"></script>
<script type="module" src="./auth-gate.js?v=5"></script>
<script src="./km-back-button.js?v=1"></script>
<style>
:root{--line:#e5e7eb;--sub:#64748b;--brand:#1a5c3a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f6f8f7;color:#0f172a;font-size:15px;padding:12px;padding-bottom:90px}
.wrap{max-width:760px;margin:0 auto}
.top{background:linear-gradient(135deg,#1a5c3a,#15803d);color:#fff;padding:16px 18px;border-radius:14px;margin-bottom:12px}
.top h1{font-size:1.18em;font-weight:900}
.top .s{font-size:.84em;opacity:.93;margin-top:5px;line-height:1.5}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:12px}
label{display:block;font-weight:800;font-size:.85em;margin:11px 0 5px;color:#334155}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:1em;font-family:inherit;background:#fff}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:9px}.row>*{flex:1}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer;font-size:1em;font-family:inherit}
.btn.g{background:#475569}.btn.lite{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{width:100%;margin-top:14px;padding:16px;font-size:1.06em}
.files{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.f{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:.7em;color:#475569;text-align:center;padding:4px}
.f img{width:100%;height:100%;object-fit:cover}
.f b{font-size:1.7em;display:block}
.f .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:21px;height:21px;cursor:pointer;font-size:.95em;line-height:1}
.note{background:#fff8e1;border-left:4px solid #f59e0b;padding:11px 13px;border-radius:8px;font-size:.85em;line-height:1.55;color:#5d4037;margin-bottom:12px}
.warn{background:#fee2e2;border-left:4px solid #dc2626;color:#7f1d1d}
.it{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;background:#fff}
.it .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.it .v{font-weight:900}
.it .m{font-size:.82em;color:var(--sub);margin-top:4px;line-height:1.6}
.bdg{font-size:.72em;font-weight:800;padding:3px 9px;border-radius:11px;white-space:nowrap}
.b0{background:#fef3c7;color:#92400e}.b1{background:#dbeafe;color:#1e40af}.b2{background:#dcfce7;color:#15803d}
.lk{display:inline-block;margin:5px 6px 0 0;font-size:.8em;background:#f1f5f9;border-radius:7px;padding:4px 9px;color:#1e40af;text-decoration:none}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fl button{border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:20px;padding:6px 13px;font-size:.82em;font-weight:800;cursor:pointer;font-family:inherit}
.fl button.on{border-color:var(--brand);background:var(--brand);color:#fff}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:.9em;line-height:1.7}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:.9em;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
h2{font-size:1em;font-weight:900;color:var(--brand);margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🧾 인보이스 접수</h1>
    <div class="s">배달과 함께 온 인보이스를 올려 주세요. <b>사진·PDF·엑셀 무엇이든</b> 됩니다.<br>올리시면 전산팀이 받아서 가격 대조까지 진행합니다.</div>
  </div>

  <div class="note">
    📷 <b>사진으로 올리실 때</b> — 한 장에 한 페이지씩, <b>밝은 곳에서 똑바로</b> 찍어 주세요.
    글씨가 흐리면 금액을 못 읽어서 되돌려 드리게 됩니다.<br>
    📄 벤더가 <b>메일로 PDF·엑셀을 보내준 경우</b>엔 그 파일을 그대로 올리시는 게 가장 정확합니다.
  </div>

  <div class="card">
    <h2>1. 어디서 온 인보이스인가요</h2>
    <label>지점</label>
    <select id="branch"></select>

    <label>벤더 (거래처)</label>
    <select id="vendorSel"></select>
    <input id="vendorEtc" placeholder="목록에 없으면 여기에 직접 적어 주세요" style="display:none;margin-top:7px">

    <div class="row">
      <div>
        <label>받은 날짜</label>
        <input type="date" id="dt">
      </div>
      <div>
        <label>인보이스 번호 <span style="font-weight:400;color:#94a3b8">(모르면 비워두세요)</span></label>
        <input id="invno" placeholder="예: 96-1107632">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2. 인보이스 올리기</h2>
    <div style="font-size:.84em;color:var(--sub);line-height:1.6;margin-bottom:4px">
      여러 장이면 <b>페이지 순서대로</b> 올려 주세요.
    </div>

    <label>총 몇 장(페이지)인가요? <span style="font-weight:400;color:#94a3b8">— 빠진 장 확인용</span></label>
    <input type="number" id="pages" min="1" placeholder="예: 4" inputmode="numeric">

    <div class="row" style="margin-top:12px">
      <button class="btn lite" id="btnCam">📷 사진 찍기</button>
      <button class="btn lite" id="btnFile">📎 파일 고르기</button>
    </div>
    <input type="file" id="pick" accept="image/*,application/pdf,.pdf,.xlsx,.xls,.csv" multiple style="display:none">
    <input type="file" id="cam" accept="image/*" capture="environment" multiple style="display:none">

    <div class="files" id="files"></div>
    <div id="pageWarn"></div>

    <label>메모 <span style="font-weight:400;color:#94a3b8">(선택)</span></label>
    <textarea id="memo" placeholder="예: 3페이지가 안 보여서 다시 받아야 합니다 / 냉동만 따로 왔습니다"></textarea>

    <button class="btn big" id="btnSend">☁️ 전산팀으로 보내기</button>
  </div>

  <div class="card">
    <h2>3. 접수 내역</h2>
    <div class="fl" id="filters"></div>
    <div id="list"><div class="empty">⏳</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getDatabase, ref, push, set, update, remove, onValue, get } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
  import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';
  const cfg = { apiKey:"AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4", authDomain:"kimchi-mart-order.firebaseapp.com",
                databaseURL:"https://kimchi-mart-order-default-rtdb.firebaseio.com", projectId:"kimchi-mart-order",
                storageBucket:"kimchi-mart-order.firebasestorage.app" };
  const app = getApps().length ? getApp() : initializeApp(cfg);
  // 버킷을 명시한다 — 다른 스크립트가 버킷 없이 앱을 먼저 만들어도 안전 (2026-09-20 사고)
  window.__fb = { db: getDatabase(app), ref, push, set, update, remove, onValue, get,
                  st: getStorage(app, 'gs://kimchi-mart-order.firebasestorage.app'), sRef, uploadBytes, getDownloadURL };
  window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
const BRANCHES=[
  {id:'HOLLYWOOD',ko:'할리우드'},{id:'MIAMI',ko:'마이애미'},
  {id:'PEMBROKE_PINES',ko:'펨브로크 파인즈'},{id:'CORAL_SPRINGS',ko:'코럴 스프링스'},
  {id:'LASOLAS',ko:'라스올라스'}];
/* 자주 오는 거래처 — 없으면 '직접 입력' 으로 적으면 되고, 적은 건 그대로 저장된다 */
const VENDORS=['JFC','SEOULTRADING','WG HANMI','WISMETTAC','NDM (남대문)','BANDI FOOD','EASTLAND',
  'K.C TRADING','RHEE BROS','WEI CHUAN','HAITAI','TWO BROS','WELL LUCK','OCM','SKY HARVEST',
  'WALONG','ASSI','CJ','FAF','AAF IMPORT','PULMUONE','POCAS','BANZAI','EDEN','KOCO','JB',
  'FRESHPOINT','A & D FOOD','LINK TRADING','MY-A & COMPANY','BZLB'];

function me(){ try{ return window.__currentUser||JSON.parse(localStorage.getItem('chat.me')||'{}'); }catch(e){ return {}; } }
const isBoss=()=>{ const m=me(); return m.branch==='*'||['OWNER','EXECUTIVE'].includes(m.role); };
let BRANCH=(function(){ try{ const b=localStorage.getItem('km_branch'); if(BRANCHES.some(x=>x.id===b))return b; }catch(e){}
  const m=me(); return (m&&BRANCHES.some(x=>x.id===m.branch))?m.branch:'HOLLYWOOD'; })();
let FILES=[], DATA={}, FILTER='new', unsub=null;

const $=s=>document.getElementById(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let tTimer=null;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tTimer); tTimer=setTimeout(()=>t.classList.remove('on'),2600); }

/* ---------- 화면 준비 ---------- */
$('dt').value=today();
$('branch').innerHTML=BRANCHES.map(b=>'<option value="'+b.id+'"'+(b.id===BRANCH?' selected':'')+'>'+b.ko+'</option>').join('');
$('branch').disabled=!isBoss();          // 지점 직원은 자기 지점 고정
$('branch').onchange=function(){ BRANCH=this.value; try{localStorage.setItem('km_branch',BRANCH);}catch(e){} subscribe(); };
$('vendorSel').innerHTML='<option value="">— 고르세요 —</option>'
  +VENDORS.map(v=>'<option>'+v+'</option>').join('')+'<option value="__etc">기타 (직접 입력)</option>';
$('vendorSel').onchange=function(){ $('vendorEtc').style.display=this.value==='__etc'?'':'none'; if(this.value==='__etc')$('vendorEtc').focus(); };

/* ---------- 파일 고르기 ----------
   인보이스는 숫자를 읽어야 해서 사진을 너무 줄이면 안 된다.
   크레딧 앱은 1000px 로 줄이지만 여기는 2000px — 지난번 위스메탁 사진이 흐려서
   한 페이지(16품목 $573)를 통째로 못 읽은 적이 있다. */
async function shrink(file){
  try{
    if(typeof createImageBitmap!=='function') return null;
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image',resizeWidth:2000,resizeQuality:'high'});
    const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));
    try{ bmp.close(); }catch(e){}
    c.width=c.height=0;                       // 폰 메모리 해제 — 안 하면 여러 장에서 멈춘다
    return blob;
  }catch(e){ console.warn('[inv] shrink',e); return null; }
}
async function addFiles(list){
  for(const f of list){
    const isImg=/^image\//.test(f.type);
    let blob=f, url='';
    if(isImg){
      const small=await shrink(f);
      if(small && small.size<f.size) blob=small;
      url=URL.createObjectURL(blob);
    }
    FILES.push({name:f.name||('photo_'+(FILES.length+1)+'.jpg'),type:f.type||'image/jpeg',blob,url,isImg});
  }
  paint();
}
$('btnCam').onclick=()=>$('cam').click();
$('btnFile').onclick=()=>$('pick').click();
$('cam').onchange=async function(){ if(this.files&&this.files.length){ toast('⏳ 사진 준비 중…'); await addFiles([...this.files]); } this.value=''; };
$('pick').onchange=async function(){ if(this.files&&this.files.length){ toast('⏳ 준비 중…'); await addFiles([...this.files]); } this.value=''; };

function icon(t,n){ if(/pdf/i.test(t)||/\.pdf$/i.test(n))return '📕'; if(/sheet|excel|csv/i.test(t)||/\.(xlsx?|csv)$/i.test(n))return '📗'; return '📄'; }
function paint(){
  $('files').innerHTML=FILES.map((f,i)=>
    '<div class="f">'+(f.isImg?'<img src="'+f.url+'" alt="">':'<b>'+icon(f.type,f.name)+'</b><span>'+esc(f.name.slice(0,18))+'</span>')
    +'<button class="x" onclick="rm('+i+')">&times;</button></div>').join('');
  checkPages();
}
function rm(i){ try{ if(FILES[i].url)URL.revokeObjectURL(FILES[i].url); }catch(e){} FILES.splice(i,1); paint(); }
function checkPages(){
  const want=parseInt($('pages').value,10);
  const el=$('pageWarn');
  if(!want||!FILES.length){ el.innerHTML=''; return; }
  if(FILES.length<want) el.innerHTML='<div class="note warn" style="margin:11px 0 0">⚠ '+want+'장이라고 하셨는데 <b>'+FILES.length+'장</b>만 올라왔습니다. 빠진 장이 없는지 봐 주세요.</div>';
  else if(FILES.length>want) el.innerHTML='<div class="note" style="margin:11px 0 0">'+want+'장이라고 하셨는데 '+FILES.length+'장입니다. 괜찮으면 그대로 보내셔도 됩니다.</div>';
  else el.innerHTML='<div class="note" style="margin:11px 0 0;background:#dcfce7;border-color:#15803d;color:#14532d">✅ '+want+'장 다 올라왔습니다.</div>';
}
$('pages').oninput=checkPages;

/* ---------- 보내기 ---------- */
$('btnSend').onclick=async function(){
  const btn=this;
  const vendor=($('vendorSel').value==='__etc'?$('vendorEtc').value.trim():$('vendorSel').value).trim();
  if(!vendor){ toast('거래처를 골라 주세요'); $('vendorSel').focus(); return; }
  if(!FILES.length){ toast('인보이스를 올려 주세요 (사진이나 파일)'); return; }
  btn.disabled=true; const old=btn.textContent;
  try{
    const ts=Date.now(), out=[];
    for(let i=0;i<FILES.length;i++){
      btn.textContent='☁️ 올리는 중 ('+(i+1)+'/'+FILES.length+')';
      const f=FILES[i];
      const ext=(f.name.match(/\.[a-z0-9]+$/i)||[f.isImg?'.jpg':''])[0]||'';
      const path='invoices/'+BRANCH+'/'+ts+'_'+i+ext;
      try{
        const r=window.__fb.sRef(window.__fb.st,path);
        const snap=await window.__fb.uploadBytes(r,f.blob,{contentType:f.type||'application/octet-stream'});
        out.push({n:f.name,u:await window.__fb.getDownloadURL(snap.ref)});
      }catch(e){ console.warn('[inv] upload',e); throw new Error('파일 올리기 실패 — 인터넷을 확인하고 다시 눌러 주세요'); }
    }
    btn.textContent='💾 …';
    const m=me();
    const rec={ vendor, invNo:$('invno').value.trim(), got:$('dt').value||today(),
      pages:parseInt($('pages').value,10)||FILES.length, files:out, memo:$('memo').value.trim(),
      by:(m.name||''), byUid:(m.uid||''), branch:BRANCH, ts, status:'new' };
    const r=window.__fb.push(window.__fb.ref(window.__fb.db,'expiry/'+BRANCH+'/invoices'));
    await window.__fb.set(r,rec);
    FILES.forEach(f=>{ try{ if(f.url)URL.revokeObjectURL(f.url); }catch(e){} });
    FILES=[]; paint(); $('invno').value=''; $('memo').value=''; $('pages').value=''; $('pageWarn').innerHTML='';
    toast('✅ 보냈습니다. 전산팀이 확인합니다.');
  }catch(e){ alert('보내기 실패: '+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent=old; }
};

/* ---------- 접수 내역 ----------
   저장 위치는 expiry/{지점}/invoices — expiry 규칙이 이미 '본인 지점 또는 전 지점(*)' 으로
   잡혀 있어서 규칙을 새로 게시하지 않아도 된다. 크레딧 기록(expiry/{지점}/credits)과 섞이지 않는다. */
function subscribe(){
  if(unsub){ try{ unsub(); }catch(e){} unsub=null; }
  $('list').innerHTML='<div class="empty">⏳</div>';
  const path='expiry/'+BRANCH+'/invoices';
  unsub=window.__fb.onValue(window.__fb.ref(window.__fb.db,path),s=>{ DATA=s.val()||{}; render(); },
    err=>{ $('list').innerHTML='<div class="empty">'+esc(err&&err.message||'불러오지 못했습니다')+'</div>'; });
}
const STAT={new:['접수됨','b0'],doing:['처리중','b1'],done:['완료','b2']};
function rows(){
  return Object.keys(DATA).map(id=>Object.assign({id},DATA[id])).filter(r=>r&&r.vendor)
    .filter(r=>FILTER==='all'?true:(r.status||'new')===FILTER)
    .sort((a,b)=>(b.ts||0)-(a.ts||0));
}
function render(){
  $('filters').innerHTML=[['new','접수됨'],['doing','처리중'],['done','완료'],['all','전체']]
    .map(([k,l])=>'<button class="'+(FILTER===k?'on':'')+'" onclick="setF(\''+k+'\')">'+l+'</button>').join('');
  const rs=rows();
  if(!rs.length){ $('list').innerHTML='<div class="empty">아직 올라온 인보이스가 없습니다.<br>위에서 사진이나 파일을 올려 주세요.</div>'; return; }
  $('list').innerHTML=rs.map(r=>{
    const st=STAT[r.status||'new']||STAT.new;
    const d=new Date(r.ts||0);
    const when=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
      +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    const links=(r.files||[]).map((f,i)=>'<a class="lk" href="'+esc(f.u)+'" target="_blank" rel="noopener">'+(i+1)+'. '+esc((f.n||'파일').slice(0,20))+'</a>').join('');
    const next=(r.status||'new')==='new'?'doing':((r.status==='doing')?'done':'new');
    const nextL={doing:'처리중으로',done:'완료로',new:'접수됨으로'}[next];
    return '<div class="it"><div class="h"><div class="v">'+esc(r.vendor)+(r.invNo?' <span style="font-weight:400;color:#64748b">#'+esc(r.invNo)+'</span>':'')
      +'</div><span class="bdg '+st[1]+'">'+st[0]+'</span></div>'
      +'<div class="m">받은날 '+esc(r.got||'')+' · 파일 '+((r.files||[]).length)+'장'
      +(r.pages&&r.pages!==(r.files||[]).length?' <b style="color:#b91c1c">(적어주신 '+r.pages+'장과 다릅니다)</b>':'')
      +'<br>올린 사람 '+esc(r.by||'-')+' · '+when+(r.memo?('<br>메모: '+esc(r.memo)):'')+'</div>'
      +links
      +(isBoss()?'<div style="margin-top:9px"><button class="btn g" style="padding:7px 13px;font-size:.82em" onclick="setStatus(\''+r.id+'\',\''+next+'\')">'+nextL+'</button></div>':'')
      +'</div>';
  }).join('');
}
function setF(k){ FILTER=k; render(); }
async function setStatus(id,st){
  try{ await window.__fb.update(window.__fb.ref(window.__fb.db,'expiry/'+BRANCH+'/invoices/'+id),{status:st,stBy:(me().name||''),stTs:Date.now()}); }
  catch(e){ alert('바꾸지 못했습니다: '+(e.message||e)); }
}
window.rm=rm; window.setF=setF; window.setStatus=setStatus;

/* 위 module 스크립트가 __fb 를 올린 뒤에 구독한다.
   module 은 defer 라 이 스크립트보다 늦게 돌 수 있어서 fb-ready 를 기다린다. */
(function start(){
  if(window.__fb&&window.__fb.db){ subscribe(); return; }
  window.addEventListener('fb-ready',()=>subscribe(),{once:true});
  setTimeout(()=>{ if(window.__fb&&window.__fb.db&&!unsub)subscribe(); },2500);
})();
</script>
