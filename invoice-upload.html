<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>인보이스 접수 — HQ 운영본부</title>
<meta name="theme-color" content="#1a5c3a">
<link rel="manifest" href="./manifest.json">
<!-- fb-auth-fetch 먼저 — fetch 에 로그인 토큰 자동 부착. auth-gate 가 로그인/승인 확인. -->
<script type="module" src="./fb-auth-fetch.js?v=4"></script>
<script type="module" src="./auth-gate.js?v=5"></script>

<style>
:root{--line:#e5e7eb;--sub:#64748b;--brand:#1a5c3a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f6f8f7;color:#0f172a;font-size:15px;padding:12px;padding-bottom:90px}
.wrap{max-width:760px;margin:0 auto}
.top{background:linear-gradient(135deg,#1a5c3a,#15803d);color:#fff;padding:16px 18px;border-radius:14px;margin-bottom:12px;position:relative}
.top h1{font-size:1.18em;font-weight:900;padding-right:112px}
.top .s{font-size:.84em;opacity:.93;margin-top:5px;line-height:1.5}
.langs{position:absolute;top:14px;right:14px;display:flex;gap:4px}
.langs button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:7px;padding:5px 9px;font-size:.72em;font-weight:800;cursor:pointer;font-family:inherit}
.langs button.on{background:#fff;color:var(--brand)}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:12px}
label{display:block;font-weight:800;font-size:.85em;margin:11px 0 5px;color:#334155}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:1em;font-family:inherit;background:#fff}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:9px}.row>*{flex:1}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer;font-size:1em;font-family:inherit}
.btn.g{background:#475569}.btn.lite{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.big{width:100%;margin-top:14px;padding:16px;font-size:1.06em}
.files{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.f{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:.7em;color:#475569;text-align:center;padding:4px}
.f img{width:100%;height:100%;object-fit:cover}
.f b{font-size:1.7em;display:block}
.f .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:50%;width:21px;height:21px;cursor:pointer;font-size:.95em;line-height:1}
.note{background:#fff8e1;border-left:4px solid #f59e0b;padding:11px 13px;border-radius:8px;font-size:.85em;line-height:1.55;color:#5d4037;margin-bottom:12px}
.warn{background:#fee2e2;border-left:4px solid #dc2626;color:#7f1d1d}
.ok{background:#dcfce7;border-left:4px solid #15803d;color:#14532d}
.it{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;background:#fff}
.it .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.it .v{font-weight:900}
.it .m{font-size:.82em;color:var(--sub);margin-top:4px;line-height:1.6}
.bdg{font-size:.72em;font-weight:800;padding:3px 9px;border-radius:11px;white-space:nowrap}
.b0{background:#fef3c7;color:#92400e}.b1{background:#dbeafe;color:#1e40af}.b2{background:#dcfce7;color:#15803d}
.lk{display:inline-block;margin:5px 6px 0 0;font-size:.8em;background:#f1f5f9;border-radius:7px;padding:4px 9px;color:#1e40af;text-decoration:none}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fl button{border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:20px;padding:6px 13px;font-size:.82em;font-weight:800;cursor:pointer;font-family:inherit}
.fl button.on{border-color:var(--brand);background:var(--brand);color:#fff}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:.9em;line-height:1.7}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:.9em;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
h2{font-size:1em;font-weight:900;color:var(--brand);margin-bottom:4px}
.hint{font-size:.84em;color:var(--sub);line-height:1.6;margin-bottom:4px}
.opt{font-weight:400;color:#94a3b8}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="langs">
      <button data-l="ko">KO</button><button data-l="en">EN</button><button data-l="es">ES</button>
    </div>
    <h1 id="tTitle"></h1>
    <div class="s" id="tSub"></div>
  </div>

  <div class="note" id="tNote"></div>

  <div class="card">
    <h2 id="tS1"></h2>
    <label id="tBranch"></label>
    <select id="branch"></select>

    <div id="vendorBox">
      <label id="tVendor"></label>
      <select id="vendorSel"></select>
      <input id="vendorEtc" style="display:none;margin-top:7px">
    </div>

    <div class="row">
      <div>
        <label id="tGot"></label>
        <input type="date" id="dt">
      </div>
      <div id="invnoBox">
        <label id="tInvNo"></label>
        <input id="invno" placeholder="96-1107632">
      </div>
    </div>
  </div>

  <!-- 🏢 전 지점으로 보는 중이면 여기에 까닭을 적고 올리기 칸을 잠근다 -->
  <div class="note" id="allModeNote" style="display:none"></div>

  <div class="card" id="upCard">
    <h2 id="tS2"></h2>
    <div class="hint" id="tOrder"></div>

    <!-- 📚 2026-10-05 전무님: "인보이스가 많은 곳은 10장도 넘어"
         → 한 장씩 10번 입력하지 않도록 '여러 장 한 번에' 를 넣었다. -->
    <button class="btn lite" id="btnBulk" style="width:100%;margin-bottom:10px"></button>
    <div class="note" id="bulkNote" style="display:none;margin:0 0 12px"></div>

    <div id="pagesBox">
      <label id="tPages"></label>
      <input type="number" id="pages" min="1" inputmode="numeric">
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn lite" id="btnCam"></button>
      <button class="btn lite" id="btnFile"></button>
    </div>
    <input type="file" id="pick" accept="image/*,application/pdf,.pdf,.xlsx,.xls,.csv" multiple style="display:none">
    <input type="file" id="cam" accept="image/*" capture="environment" multiple style="display:none">

    <div class="files" id="files"></div>
    <div id="pageWarn"></div>

    <label id="tMemo"></label>
    <textarea id="memo"></textarea>

    <button class="btn big" id="btnSend"></button>
  </div>

  <div class="card">
    <h2 id="tS3"></h2>
    <div class="fl" id="filters"></div>
    <div id="list"><div class="empty">⏳</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getDatabase, ref, push, set, update, remove, onValue, get } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
  import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js';
  const cfg = { apiKey:"AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4", authDomain:"kimchi-mart-order.firebaseapp.com",
                databaseURL:"https://kimchi-mart-order-default-rtdb.firebaseio.com", projectId:"kimchi-mart-order",
                storageBucket:"kimchi-mart-order.firebasestorage.app" };
  const app = getApps().length ? getApp() : initializeApp(cfg);
  // 버킷을 명시한다 — 다른 스크립트가 버킷 없이 앱을 먼저 만들어도 안전 (2026-09-20 사고)
  window.__fb = { db: getDatabase(app), ref, push, set, update, remove, onValue, get,
                  st: getStorage(app, 'gs://kimchi-mart-order.firebasestorage.app'), sRef, uploadBytes, getDownloadURL };
  window.dispatchEvent(new Event('fb-ready'));
</script>

/* ===== 파일 고르기 =====
   인보이스는 숫자를 읽어야 해서 사진을 너무 줄이면 안 된다.
   크레딧 앱은 1000px 로 줄이지만 여기는 2000px — 지난번 위스메탁 사진이 흐려서
   한 페이지(16품목 $573)를 통째로 못 읽은 적이 있다. */
async function shrink(file){
  try{
    if(typeof createImageBitmap!=='function') return null;
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image',resizeWidth:2000,resizeQuality:'high'});
    const c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));
    try{ bmp.close(); }catch(e){}
    c.width=c.height=0;                       // 폰 메모리 해제 — 안 하면 여러 장에서 멈춘다
    return blob;
  }catch(e){ console.warn('[inv] shrink',e); return null; }
}
async function addFiles(list){
  for(const f of list){
    const isImg=/^image\//.test(f.type);
    let blob=f, url='';
    if(isImg){
      const small=await shrink(f);
      if(small && small.size<f.size) blob=small;
      url=URL.createObjectURL(blob);
    }
    FILES.push({name:f.name||('photo_'+(FILES.length+1)+'.jpg'),type:f.type||'image/jpeg',blob,url,isImg});
  }
  paint();
}

/* 파일 하나를 Storage 에 올리고 {n,u} 를 돌려준다 (한 장씩·묶음 공용) */
async function putOne(f,path,safe){
  const r=window.__fb.sRef(window.__fb.st,path);
  const snap=await window.__fb.uploadBytes(r,f.blob,{
    contentType:f.type||'application/octet-stream',
    contentDisposition:'attachment; filename="'+safe+'"'});
  return { n:f.name, u:await window.__fb.getDownloadURL(snap.ref) };
}

/* ===== 📚 묶음 보내기 — 한 건씩 저장하고, 실패한 건만 화면에 남긴다 ===== */
async function sendBulk(btn){
  const groups=bulkGroups();
  if(!groups.length){ toast(t('needFile')); return; }
  const m=me(), got=$('dt').value||today(), memo=$('memo').value.trim();
  const keep=[]; let ok=0;
  for(let gi=0; gi<groups.length; gi++){
    const idx=groups[gi];
    btn.textContent=t('uploading')+' ('+(gi+1)+'/'+groups.length+')';
    const vendor=(FILES[idx[0]].vendor||'').trim();
    const ts=Date.now()+gi;
    try{
      const out=[];
      for(let k=0;k<idx.length;k++){
        const f=FILES[idx[k]];
        const ext=(f.name.match(/\.[a-z0-9]+$/i)||[f.isImg?'.jpg':''])[0]||'';
        const safe=('INV_'+(vendor||'UNKNOWN')+'_'+got+'_'+(k+1)+ext).replace(/[^A-Za-z0-9._-]+/g,'_');
        out.push(await putOne(f,'invoices/'+BRANCH+'/'+ts+'_'+k+ext,safe));
      }
      const r=window.__fb.push(window.__fb.ref(window.__fb.db,'expiry/'+BRANCH+'/invoices'));
      await window.__fb.set(r,{ vendor, invNo:'', got, pages:idx.length, files:out, memo,
        by:(m.name||''), byUid:(m.uid||''), branch:BRANCH, ts, status:'new' });
      idx.forEach(i=>{ try{ if(FILES[i].url)URL.revokeObjectURL(FILES[i].url); }catch(e){} });
      ok++;
    }catch(e){
      console.warn('[inv] bulk',e);
      idx.forEach((i,k)=>{ const f=FILES[i]; keep.push(Object.assign({},f,{merge:k>0})); });
    }
  }
  FILES=keep; paint();
  if(!keep.length){ $('memo').value=''; toast(t('bulkDone',{n:ok})); }
  else alert(t('bulkPart',{n:ok,m:groups.length-ok}).replace(/<[^>]+>/g,''));
}

    for(let i=0;i<FILES.length;i++){
      btn.textContent=t('uploading')+' ('+(i+1)+'/'+FILES.length+')';
      const f=FILES[i];
      const ext=(f.name.match(/\.[a-z0-9]+$/i)||[f.isImg?'.jpg':''])[0]||'';
      const path='invoices/'+BRANCH+'/'+ts+'_'+i+ext;
      /* 받을 때 바로 다운로드되도록 attachment 로 올린다.
         이걸 안 하면 링크를 눌러도 브라우저가 화면에 띄우기만 하고,
         파일로 가져오려면 다른 도메인이라 막힌다 (2026-10-02 전무님 테스트). */
      const safe=('INV_'+vendor+'_'+($('dt').value||today())+'_'+(i+1)+ext)
                 .replace(/[^A-Za-z0-9._-]+/g,'_');
      try{
        const r=window.__fb.sRef(window.__fb.st,path);
        const snap=await window.__fb.uploadBytes(r,f.blob,{
          contentType:f.type||'application/octet-stream',
          contentDisposition:'attachment; filename="'+safe+'"'});
        out.push({n:f.name,u:await window.__fb.getDownloadURL(snap.ref)});
      }catch(e){ console.warn('[inv] upload',e); throw new Error(t('failUp')); }
    }
    btn.textContent='💾 …';
    const m=me();
    const rec={ vendor, invNo:$('invno').value.trim(), got:$('dt').value||today(),

      by:(m.name||''), byUid:(m.uid||''), branch:BRANCH, ts, status:'new' };
    const r=window.__fb.push(window.__fb.ref(window.__fb.db,'expiry/'+BRANCH+'/invoices'));
    await window.__fb.set(r,rec);
    FILES.forEach(f=>{ try{ if(f.url)URL.revokeObjectURL(f.url); }catch(e){} });
    FILES=[]; paint(); $('invno').value=''; $('memo').value=''; $('pages').value=''; $('pageWarn').innerHTML='';
    toast(t('sent'));

};

/* ===== 접수 내역 =====
   저장 위치는 expiry/{지점}/invoices — expiry 규칙이 이미 '본인 지점 또는 전 지점(*)' 으로
   잡혀 있어서 규칙을 새로 게시하지 않아도 된다. 크레딧 기록(expiry/{지점}/credits)과 섞이지 않는다. */
let UNSUBS=[];
function stopAll(){
  if(unsub){ try{ unsub(); }catch(e){} unsub=null; }
  UNSUBS.forEach(u=>{ try{ u(); }catch(e){} }); UNSUBS=[];
}
function subscribe(){
  stopAll();
  $('list').innerHTML='<div class="empty">⏳</div>';

  /* 🏢 전 지점 — 다섯 곳을 따로 듣고 한 목록으로 합친다.
     열쇠는 '지점::아이디' 로 둬서 상태 바꾸기·내려받기가 제 지점을 찾아간다. */
  if(BRANCH==='*'){
    DATA={};
    const got={};
    BRANCHES.forEach(b=>{
      const u=window.__fb.onValue(window.__fb.ref(window.__fb.db,'expiry/'+b.id+'/invoices'),
        s=>{
          const v=s.val()||{};
          Object.keys(DATA).forEach(k=>{ if(k.indexOf(b.id+'::')===0) delete DATA[k]; });
          Object.keys(v).forEach(id=>{ DATA[b.id+'::'+id]=Object.assign({},v[id],{_br:b.id,_id:id}); });
          got[b.id]=1; render();
        },
        err=>{ got[b.id]=1; console.warn('[inv] '+b.id, err&&err.message); render(); });
      UNSUBS.push(u);
    });
    return;
  }

  unsub=window.__fb.onValue(window.__fb.ref(window.__fb.db,'expiry/'+BRANCH+'/invoices'),
    s=>{ DATA=s.val()||{}; render(); },
    err=>{ $('list').innerHTML='<div class="empty">'+esc(err&&err.message||t('loading'))+'</div>'; });
}

/* 전 지점으로 보는 동안은 올릴 곳이 없다 — 올리기 칸을 잠그고 까닭을 적어 둔다 */
function applyAllMode(){
  const on=(BRANCH==='*');
  const note=$('allModeNote');
  if(note){ note.style.display=on?'':'none'; note.innerHTML=t('allNote'); }
  ['vendorSel','vendorEtc','invno','dt','pages','memo','btnCam','btnFile','btnBulk','btnSend']
    .forEach(id=>{ const el=$(id); if(el) el.disabled=on; });
  const card=$('upCard'); if(card){ card.style.opacity=on?'.45':''; card.style.pointerEvents=on?'none':''; }
}
const STAT={new:['fNew','b0'],doing:['fDoing','b1'],done:['fDone','b2']};
function rows(){
  return Object.keys(DATA).map(id=>Object.assign({id},DATA[id])).filter(r=>r&&r.vendor)
    .filter(r=>FILTER==='all'?true:(r.status||'new')===FILTER)
    .sort((a,b)=>(b.ts||0)-(a.ts||0));
}
function render(){
  /* 탭마다 몇 건인지 숫자를 같이 보여준다 — 상태를 바꾸면 다른 칸으로 가는데,
     숫자가 없으면 "없어졌다" 고 오해한다 */
  const all=Object.keys(DATA).map(id=>DATA[id]).filter(r=>r&&r.vendor);
  const cnt=k=>k==='all'?all.length:all.filter(r=>(r.status||'new')===k).length;
  $('filters').innerHTML=[['new','fNew'],['doing','fDoing'],['done','fDone'],['all','fAll']]
    .map(([k,l])=>'<button class="'+(FILTER===k?'on':'')+'" onclick="setF(\''+k+'\')">'+esc(t(l))+' '+cnt(k)+'</button>').join('')
    +'<div style="width:100%;font-size:.76em;color:var(--sub);margin-top:2px">'+esc(t('tabHint'))+'</div>';
  const rs=rows();
  if(!rs.length){ $('list').innerHTML='<div class="empty">'+t('noRec')+'</div>'; return; }
  $('list').innerHTML=rs.map(r=>{
    const st=STAT[r.status||'new']||STAT.new;
    const d=new Date(r.ts||0);
    const when=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
      +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    const nf=(r.files||[]).length;
    const links=(r.files||[]).map((f,i)=>
      '<span class="lk" style="padding:0;background:none">'
      +'<a class="lk" href="'+esc(f.u)+'" target="_blank" rel="noopener">'+(i+1)+'. '+esc((f.n||'file').slice(0,18))+'</a>'
      +'<button class="lk" style="border:0;cursor:pointer;background:#e0e7ff;font-family:inherit;font-weight:700" onclick="dlOne(\''+r.id+'\','+i+')">⬇ '+esc(t('dlOne'))+'</button>'
      +'</span>').join('');
    const next=(r.status||'new')==='new'?'doing':((r.status==='doing')?'done':'new');
    const nextL={doing:'toDoing',done:'toDone',new:'toNew'}[next];
    const brTag=(BRANCH==='*'&&r._br)
      ? '<span style="display:inline-block;background:#e8f5ee;border:1px solid #bbf7d0;color:#15803d;border-radius:999px;padding:1px 8px;font-size:.74em;font-weight:900;margin-right:6px;vertical-align:middle">'+esc(bname(r._br))+'</span>'
      : '';
    return '<div class="it"><div class="h"><div class="v">'+brTag+esc(r.vendor)+(r.invNo?' <span style="font-weight:400;color:#64748b">#'+esc(r.invNo)+'</span>':'')
      +'</div><span class="bdg '+st[1]+'">'+esc(t(st[0]))+'</span></div>'
      +'<div class="m">'+esc(t('gotL'))+' '+esc(r.got||'')+' · '+esc(t('filesL',{n:nf}))
      +(r.pages&&r.pages!==nf?' <b style="color:#b91c1c">'+esc(t('diffL',{n:r.pages}))+'</b>':'')
      +'<br>'+esc(t('byL'))+' '+esc(r.by||'-')+' · '+when+(r.memo?('<br>'+esc(t('memoL'))+': '+esc(r.memo)):'')+'</div>'
      +links
      +'<div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap">'
      +(nf>1?'<button class="btn lite" style="padding:7px 13px;font-size:.82em" onclick="dlAll(\''+r.id+'\')">'+esc(t('dlAll'))+'</button>':'')
      +(isBoss()?'<button class="btn g" style="padding:7px 13px;font-size:.82em" onclick="setStatus(\''+r.id+'\',\''+next+'\')">'+esc(t(nextL))+'</button>':'')
      +'</div></div>';
  }).join('');
}
function setF(k){ FILTER=k; render(); }

/* ===== 파일 내려받기 =====
   Storage 링크를 그냥 열면 브라우저가 화면에 띄워버려서 "저장" 이 한 번 더 필요하다.
   파일을 통째로 받아와 blob 으로 저장하면 바로 다운로드 폴더에 떨어진다.
   다만 저장소가 다른 도메인이라 막히는 환경이 있어서, 막히면 새 창으로 열고 안내한다. */
async function dl(url,name,win){
  try{
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const b=await res.blob();
    const u=URL.createObjectURL(b);
    const a=document.createElement('a');
    a.href=u; a.download=name||'invoice'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
    try{ if(win)win.close(); }catch(e){}       // 미리 열어 둔 빈 창은 필요 없으니 닫는다
    return true;
  }catch(e){
    console.warn('[inv] dl',e);
    /* 저장소가 다른 도메인이라 막히는 환경이 있다. 그때는 그냥 열어 준다.
       ⚠ 창은 '클릭한 그 순간' 에 미리 열어 둬야 한다 — await 뒤에 열면 팝업 차단에 막혀
       아무 일도 안 일어난 것처럼 보인다 (2026-10-02 전무님 테스트에서 확인). */
    try{ if(win)win.location=url; else window.open(url,'_blank','noopener'); }catch(e2){}
    return false;
  }
}
function dlOne(id,i){
  const r=DATA[id]; if(!r||!r.files||!r.files[i])return;
  const f=r.files[i];
  const w=window.open('','_blank');            // 클릭 순간에 창을 미리 잡아 둔다
  toast(t('dlGo'));
  dl(f.u,f.n,w).then(ok=>toast(ok?t('dlDone'):t('dlOpen')));
}
function dlAll(id){
  const r=DATA[id]; if(!r||!r.files||!r.files.length)return;
  /* 🔴 창은 '클릭한 바로 그 순간' 에 다 잡아 둬야 한다.
     dlOne 은 그렇게 해서 되는데 dlAll 은 안 해서, 파일 가져오기가 막히는 환경에서는
     await 뒤에 열린 창이 전부 팝업 차단에 걸려 '아무 일도 안 일어난' 것처럼 보였다
     (2026-10-08 전무님). 같은 함정을 주석에 적어 두고도 여기엔 적용이 안 돼 있었다.
     가져오기가 잘 되면 dl() 이 이 창들을 알아서 닫는다 — 쓸데없이 남지 않는다. */
  const n=Math.min(r.files.length,12);               // 12장 넘게 한꺼번에는 창을 안 연다
  const wins=[];
  for(let i=0;i<n;i++){ try{ wins.push(window.open('','_blank')); }catch(e){ wins.push(null); } }
  toast(t('dlGo'));
  (async()=>{
    let ok=true, blocked=0;
    for(let i=0;i<r.files.length;i++){
      const f=r.files[i];
      const prefix=(r.vendor||'invoice').replace(/[^\w가-힣.-]+/g,'_')+'_'+(r.got||'')+'_'+(i+1)+'_';
      if(!await dl(f.u,prefix+(f.n||'file'),wins[i]||null)){ ok=false; if(!wins[i]) blocked++; }
      await new Promise(s=>setTimeout(s,350)); // 연달아 받으면 브라우저가 막는다 — 조금 쉬어 준다
    }
    /* 미처 못 연 창이 남아 있으면 닫아 준다 */
    wins.forEach(w=>{ try{ if(w&&!w.closed&&!w.location.href) w.close(); }catch(e){} });
    toast(ok?t('dlDone'):(blocked?t('dlPop'):t('dlOpen')));
  })();
}
async function setStatus(id,st){
  try{
    const rec=DATA[id]||{};
    const br=rec._br||BRANCH, rid=rec._id||id;        // 전 지점으로 볼 때는 그 기록의 지점에 쓴다
    await window.__fb.update(window.__fb.ref(window.__fb.db,'expiry/'+br+'/invoices/'+rid),{status:st,stBy:(me().name||''),stTs:Date.now()});
    /* 상태를 바꾸면 보고 있던 칸에서 사라진다 — 없어진 걸로 오해하기 쉬워서
       옮겨간 칸으로 같이 따라가고, 어디로 갔는지 알려 준다 (2026-10-02 전무님 지적) */
    if(FILTER!=='all'){ FILTER=st; }
    render();
    toast(t('moved',{s:t({new:'fNew',doing:'fDoing',done:'fDone'}[st])}));
  }
  catch(e){ alert(t('failStat')+': '+(e.message||e)); }
}
window.rm=rm; window.setF=setF; window.setStatus=setStatus; window.dlOne=dlOne; window.dlAll=dlAll;

applyLang();
/* 위 module 스크립트가 __fb 를 올린 뒤에 구독한다.
   module 은 defer 라 이 스크립트보다 늦게 돌 수 있어서 fb-ready 를 기다린다. */
(function start(){
  if(window.__fb&&window.__fb.db){ subscribe(); return; }
  window.addEventListener('fb-ready',()=>subscribe(),{once:true});
  setTimeout(()=>{ if(window.__fb&&window.__fb.db&&!unsub)subscribe(); },2500);
})();
</script>
