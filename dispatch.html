<script>
/* ===== 상태 ===== */
var FB=null, ORDERS={}, FILTER='all', LANG='ko', PICK_TYPE='meat';
var PHOTO_TARGET=null, PHOTO_STAGE='send';
var PENDING_PICS=[];
var LB_PICS=[], LB_I=0;
var BRANCHES=['HOLLYWOOD','MIAMI','CORAL SPRINGS','PEMBROKE PINES','LAS OLAS','PALM BEACH'];

/* ===== 다국어 ===== */
var I18N={
 ko:{title:'헐리우드 발송 주문',meLbl:'내 지점',newOrder:'새 주문 넣기',formTitle:'발송 주문서',fType:'제품 종류',tMeat:'고기',tFish:'생선',tOther:'기타',fItem:'품목 (무엇을 보낼까요)',fQty:'수량 / 무게',fNeed:'필요 날짜',fBranch:'요청 지점 (받는 곳)',fNote:'메모 (선택)',fPhoto:'사진 (선택)',addPic:'사진 찍기/추가',btnSubmit:'주문 넣기',btnCancel:'취소',fAll:'전체',fReq:'요청됨',fPrep:'준비완료',fSent:'발송완료',phItem:'예: LA갈비, 삼겹살, 고등어…',phQty:'예: 10 lb, 5팩',phNote:'손질 방법·포장 요청 등',btnPrepared:'준비완료',btnSent:'발송완료',photo:'사진',addPhoto:'사진 추가',undo:'되돌리기',del:'삭제',by:'요청',need:'필요',preparedBy:'준비',sentBy:'발송',viewPics:'사진 보기',reqAt:'요청',emptyT:'아직 주문이 없어요',emptyD:'위 "새 주문 넣기"로 첫 주문을 넣어보세요.',needItem:'품목을 입력하세요',delConfirm:'이 주문을 삭제할까요?',compressing:'사진 준비 중…',uploading:'사진 올리는 중…',saving:'저장 중…',mustLogin:'로그인이 필요해요.',sgOrder:'🛒 주문',sgPrepare:'👨‍🍳 준비',sgSend:'📤 발송',tapRemove:'탭하면 삭제'},
 en:{title:'Hollywood Dispatch',meLbl:'My branch',newOrder:'New order',formTitle:'Dispatch order',fType:'Product type',tMeat:'Meat',tFish:'Fish',tOther:'Other',fItem:'Item (what to send)',fQty:'Qty / Weight',fNeed:'Needed by',fBranch:'Requesting branch',fNote:'Note (optional)',fPhoto:'Photo (optional)',addPic:'Take/add photo',btnSubmit:'Place order',btnCancel:'Cancel',fAll:'All',fReq:'Requested',fPrep:'Prepared',fSent:'Sent',phItem:'e.g. LA galbi, pork belly, mackerel…',phQty:'e.g. 10 lb, 5 packs',phNote:'Cutting/packing requests…',btnPrepared:'Mark prepared',btnSent:'Mark sent',photo:'Photo',addPhoto:'Add photo',undo:'Undo',del:'Delete',by:'By',need:'Need',preparedBy:'Prepared',sentBy:'Sent',viewPics:'View photos',reqAt:'Requested',emptyT:'No orders yet',emptyD:'Tap "New order" above to add the first one.',needItem:'Please enter an item',delConfirm:'Delete this order?',compressing:'Preparing photo…',uploading:'Uploading photo…',saving:'Saving…',mustLogin:'Please log in.',sgOrder:'🛒 Order',sgPrepare:'👨‍🍳 Prepared',sgSend:'📤 Sent',tapRemove:'tap to remove'},
 es:{title:'Envíos Hollywood',meLbl:'Mi tienda',newOrder:'Nuevo pedido',formTitle:'Pedido de envío',fType:'Tipo de producto',tMeat:'Carne',tFish:'Pescado',tOther:'Otro',fItem:'Artículo (qué enviar)',fQty:'Cant. / Peso',fNeed:'Para cuándo',fBranch:'Tienda que pide',fNote:'Nota (opcional)',fPhoto:'Foto (opcional)',addPic:'Tomar/agregar foto',btnSubmit:'Hacer pedido',btnCancel:'Cancelar',fAll:'Todos',fReq:'Solicitado',fPrep:'Preparado',fSent:'Enviado',phItem:'ej: LA galbi, panceta, caballa…',phQty:'ej: 10 lb, 5 paq.',phNote:'Cortes/empaque…',btnPrepared:'Marcar preparado',btnSent:'Marcar enviado',photo:'Foto',addPhoto:'Agregar foto',undo:'Deshacer',del:'Eliminar',by:'Pide',need:'Para',preparedBy:'Preparado',sentBy:'Enviado',viewPics:'Ver fotos',reqAt:'Solicitado',emptyT:'Aún no hay pedidos',emptyD:'Toca "Nuevo pedido" arriba para agregar el primero.',needItem:'Ingresa un artículo',delConfirm:'¿Eliminar este pedido?',compressing:'Preparando foto…',uploading:'Subiendo foto…',saving:'Guardando…',mustLogin:'Inicia sesión.',sgOrder:'🛒 Pedido',sgPrepare:'👨‍🍳 Preparado',sgSend:'📤 Enviado',tapRemove:'toca para quitar'}
};
function t(k){ return (I18N[LANG]&&I18N[LANG][k])||I18N.ko[k]||k; }
function esc(s){ return (s==null?'':''+s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function meName(){ try{ return (JSON.parse(localStorage.getItem('chat.me')||'null')||{}).name||'직원'; }catch(e){ return '직원'; } }
function meBranch(){ try{ var b=(JSON.parse(localStorage.getItem('chat.me')||'null')||{}).branch; return (b&&b!=='*')?b:'HOLLYWOOD'; }catch(e){ return 'HOLLYWOOD'; } }
function busy(on,msg){ var b=document.getElementById('busy'); b.textContent=msg||t('saving'); b.style.display=on?'block':'none'; }
function stageLabel(st){ return st==='order'?t('sgOrder'):st==='prepare'?t('sgPrepare'):t('sgSend'); }
function stageForStatus(s){ return s==='requested'?'order':s==='prepared'?'prepare':'send'; }

function applyLang(){
  document.querySelectorAll('[data-i]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i')); });
  document.querySelectorAll('[data-iph]').forEach(function(el){ el.placeholder=t(el.getAttribute('data-iph')); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang')===LANG); });
  render();
}
function setLang(l){ LANG=l; try{ localStorage.setItem('km.lang',l);}catch(e){} applyLang(); }

var TYPE_ICON={meat:'🥩',fish:'🐟',other:'📦'};
function typeLabel(tp){ return t(tp==='meat'?'tMeat':tp==='fish'?'tFish':'tOther'); }

/* ===== 폼 ===== */
function toggleForm(show){
  document.getElementById('formCard').classList.toggle('hidden',!show);
  document.getElementById('newBtn').classList.toggle('hidden',show);
  if(show){ window.scrollTo({top:0,behavior:'smooth'}); }
}
function pickType(tp){ PICK_TYPE=tp; document.querySelectorAll('#typeBtns button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-type')===tp); }); }
function fillBranchSelect(){
  var sel=document.getElementById('fBranch'); var mine=meBranch();
  sel.innerHTML=BRANCHES.map(function(b){ return '<option value="'+esc(b)+'"'+(b===mine?' selected':'')+'>'+esc(b)+'</option>'; }).join('');
}
function renderOrderPics(){
  document.getElementById('orderPics').innerHTML=PENDING_PICS.map(function(u,i){ return '<img src="'+u+'" title="'+t('tapRemove')+'" onclick="PENDING_PICS.splice('+i+',1);renderOrderPics();">'; }).join('');
}
document.getElementById('orderPhotoInput').addEventListener('change', function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  busy(true,t('compressing'));
  compress(f,1100,0.6).then(function(url){ PENDING_PICS.push(url); renderOrderPics(); busy(false); }).catch(function(){ busy(false); });
  e.target.value='';
});
function submitOrder(){
  if(!FB){ alert(t('mustLogin')); return; }
  var item=(document.getElementById('fItem').value||'').trim();
  if(!item){ alert(t('needItem')); return; }
  var order={
    type:PICK_TYPE, item:item,
    qty:(document.getElementById('fQty').value||'').trim(),
    need:(document.getElementById('fNeed').value||''),
    branch:document.getElementById('fBranch').value||meBranch(),
    note:(document.getElementById('fNote').value||'').trim(),
    status:'requested', by:meName(), byBranch:meBranch(), at:Date.now(), photoCount:0
  };
  var pics=PENDING_PICS.slice();
  busy(true,t('saving'));
  var r=FB.push(FB.ref(FB.db,'dispatch/orders')); var oid=r.key;
  FB.set(r, order).then(function(){
    return pics.reduce(function(p,url){ return p.then(function(){ return pushPhoto(oid,url,'order'); }); }, Promise.resolve());
  }).then(function(){
    if(pics.length) return FB.update(FB.ref(FB.db,'dispatch/orders/'+oid), {photoCount:pics.length, lastPhotoAt:Date.now()});
  }).then(function(){
    PENDING_PICS=[]; renderOrderPics(); busy(false);
    document.getElementById('fItem').value=''; document.getElementById('fQty').value='';
    document.getElementById('fNeed').value=''; document.getElementById('fNote').value='';
    toggleForm(false);
  }).catch(function(e){ busy(false); alert('❌ '+(e.message||e)); });
}

/* ===== 상태 변경 ===== */
function setStatus(id, st){
  if(!FB) return;
  var patch={status:st};
  if(st==='sent'){ patch.sentBy=meName(); patch.sentAt=Date.now(); }
  if(st==='prepared'){ patch.preparedBy=meName(); patch.preparedAt=Date.now(); }
  FB.update(FB.ref(FB.db,'dispatch/orders/'+id), patch).catch(function(e){ alert('❌ '+(e.message||e)); });
}
/* 상태 바꾸고 → 그 단계 사진 찍기(선택) */
function markStage(id, st){ setStatus(id, st); startPhoto(id, st==='sent'?'send':'prepare'); }
/* 지금 단계에 맞는 사진 추가 */
function genPhoto(id){ var o=ORDERS[id]||{}; startPhoto(id, stageForStatus(o.status||'requested')); }
function delOrder(id){
  if(!FB) return;
  if(!confirm(t('delConfirm'))) return;
  FB.remove(FB.ref(FB.db,'dispatch/orders/'+id)).catch(function(){});
  FB.remove(FB.ref(FB.db,'dispatchPhotos/'+id)).catch(function(){});
}

/* ===== 사진 ===== */
function pushPhoto(id, dataUrl, stage){
  var r=FB.push(FB.ref(FB.db,'dispatchPhotos/'+id));
  return FB.set(r, { url:dataUrl, stage:stage, by:meName(), at:Date.now() });
}
function startPhoto(id, stage){ PHOTO_TARGET=id; PHOTO_STAGE=stage||'send'; var inp=document.getElementById('photoInput'); inp.value=''; inp.click(); }
document.getElementById('photoInput').addEventListener('change', function(e){
  var f=e.target.files&&e.target.files[0]; if(!f||!PHOTO_TARGET) return;
  var id=PHOTO_TARGET, stage=PHOTO_STAGE;
  busy(true,t('compressing'));
  compress(f,1100,0.6).then(function(url){
    busy(true,t('uploading'));
    return pushPhoto(id, url, stage);
  }).then(function(){
    var o=ORDERS[id]||{};
    delete PIC_CACHE[id];
    return FB.update(FB.ref(FB.db,'dispatch/orders/'+id), { photoCount:(o.photoCount||0)+1, lastPhotoAt:Date.now() });
  }).then(function(){ busy(false); }).catch(function(err){ busy(false); alert('❌ '+(err.message||err)); });
});
function compress(file,maxDim,q){
  return new Promise(function(resolve,reject){
    var img=new Image(); var url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{ URL.revokeObjectURL(url); }catch(e){}
      resolve(c.toDataURL('image/jpeg',q));
    };
    img.onerror=function(){ reject(new Error('image load fail')); };
    img.src=url;
  });
}
var PIC_CACHE={};
function viewPics(id){
  if(PIC_CACHE[id]){ openLightbox(PIC_CACHE[id]); return; }
  busy(true,'…');
  FB.get(FB.ref(FB.db,'dispatchPhotos/'+id)).then(function(snap){
    busy(false);
    var v=snap.val()||{}; var arr=Object.keys(v).map(function(k){ return v[k]; });
    arr.sort(function(a,b){ return (a.at||0)-(b.at||0); });
    PIC_CACHE[id]=arr;
    if(arr.length) openLightbox(arr);
  }).catch(function(){ busy(false); });
}
function openLightbox(arr){ LB_PICS=arr; LB_I=0; showLb(); document.getElementById('lightbox').style.display='flex'; }
function showLb(){
  var p=LB_PICS[LB_I]; if(!p) return;
  var url=(typeof p==='string')?p:p.url; var stg=(typeof p==='string')?'':p.stage; var who=(typeof p==='string')?'':p.by;
  document.getElementById('lbImg').src=url||'';
  document.getElementById('lbCap').innerHTML=(LB_I+1)+' / '+LB_PICS.length+(stg?('　<span class="stg">'+stageLabel(stg)+'</span>'):'')+(who?('　· '+esc(who)):'');
}
function closeLightbox(){ document.getElementById('lightbox').style.display='none'; }
document.getElementById('lbImg').addEventListener('click', function(){ if(LB_PICS.length>1){ LB_I=(LB_I+1)%LB_PICS.length; showLb(); } });

/* ===== 필터 & 렌더 ===== */
function setFilter(f){ FILTER=f; document.querySelectorAll('#filters button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-f')===f); }); render(); }
function fmtTime(ts){ if(!ts) return ''; var d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function render(){
  var arr=Object.keys(ORDERS).map(function(k){ var o=ORDERS[k]; o._id=k; return o; });
  var cnt={all:arr.length,requested:0,prepared:0,sent:0};
  arr.forEach(function(o){ if(cnt[o.status]!=null) cnt[o.status]++; });
  ['all','requested','prepared','sent'].forEach(function(k){ var el=document.getElementById('c-'+k); if(el) el.textContent=cnt[k]?('('+cnt[k]+')'):''; });
  arr.sort(function(a,b){ return (b.at||0)-(a.at||0); });
  if(FILTER!=='all') arr=arr.filter(function(o){ return o.status===FILTER; });
  var list=document.getElementById('list');
  if(!arr.length){ list.innerHTML='<div class="empty"><div class="ico">📭</div><b>'+t('emptyT')+'</b><br>'+t('emptyD')+'</div>'; return; }
  list.innerHTML=arr.map(function(o){
    var id=o._id; var badge=t(o.status==='requested'?'fReq':o.status==='prepared'?'fPrep':'fSent');
    var pics=(o.photoCount>0)?('<div><button class="more" onclick="viewPics(\''+id+'\')">🖼 '+t('viewPics')+' ('+o.photoCount+')</button></div>'):'';
    var a='<div class="acts">';
    if(o.status==='requested') a+='<button class="a-prep" onclick="markStage(\''+id+'\',\'prepared\')">✅ '+t('btnPrepared')+'</button>';
    if(o.status==='prepared') a+='<button class="a-send" onclick="markStage(\''+id+'\',\'sent\')">🚚 '+t('btnSent')+'</button>';
    a+='<button class="a-photo" onclick="genPhoto(\''+id+'\')">📷 '+t(o.status==='sent'?'addPhoto':'photo')+'</button>';
    if(o.status==='prepared') a+='<button class="a-undo" onclick="setStatus(\''+id+'\',\'requested\')">↩ '+t('undo')+'</button>';
    if(o.status==='sent') a+='<button class="a-undo" onclick="setStatus(\''+id+'\',\'prepared\')">↩ '+t('undo')+'</button>';
    a+='<button class="a-del" onclick="delOrder(\''+id+'\')">🗑 '+t('del')+'</button></div>';
    return '<div class="order st-'+o.status+'">'+
      '<div class="oh"><div class="ttl">'+(TYPE_ICON[o.type]||'📦')+' '+esc(o.item||'')+(o.qty?(' <span style="font-weight:600;color:var(--mute)">· '+esc(o.qty)+'</span>'):'')+'</div>'+
      '<span class="badge '+o.status+'">'+badge+'</span></div>'+
      '<div class="meta">📍 <b>'+esc(o.branch||'')+'</b> · '+typeLabel(o.type)+' · '+t('by')+': '+esc(o.by||'')+' · '+t('reqAt')+' '+fmtTime(o.at)+
      (o.need?('<br>🗓 '+t('need')+': <b>'+esc(o.need)+'</b>'):'')+
      (o.status!=='requested'&&o.preparedBy?('<br>👨‍🍳 '+t('preparedBy')+': '+esc(o.preparedBy)+' '+fmtTime(o.preparedAt)):'')+
      (o.status==='sent'&&o.sentBy?('<br>✅ '+t('sentBy')+': '+esc(o.sentBy)+' '+fmtTime(o.sentAt)):'')+'</div>'+
      (o.note?('<div class="note">'+esc(o.note)+'</div>'):'')+
      pics+a+'</div>';
  }).join('');
}

/* ===== 부팅 ===== */
function boot(){
  try{ LANG=localStorage.getItem('km.lang')||'ko'; }catch(e){}
  document.getElementById('myBranchLbl').textContent=meBranch();
  fillBranchSelect(); applyLang(); pickType('meat');
  if(window.__fb){ FB=window.__fb; subscribe(); }
}
function subscribe(){
  if(!FB) return;
  FB.onValue(FB.ref(FB.db,'dispatch/orders'), function(snap){ ORDERS=snap.val()||{}; render(); }, function(){});
}
window.addEventListener('fb-ready', boot);
if(window.__fb){ boot(); }
window.addEventListener('fb-auth-ready', function(){ document.getElementById('myBranchLbl').textContent=meBranch(); fillBranchSelect(); });
</script>
