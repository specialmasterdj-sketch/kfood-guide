function t(k){ return (I18N[LANG]&&I18N[LANG][k])||I18N.ko[k]||k; }
function esc(s){ return (s==null?'':''+s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function meBranch(){ try{ var b=(JSON.parse(localStorage.getItem('chat.me')||'null')||{}).branch; return (b&&b!=='*')?b:'HOLLYWOOD'; }catch(e){ return 'HOLLYWOOD'; } }
function meIsManager(){ try{ var me=JSON.parse(localStorage.getItem('chat.me')||'null'); if(!me||!me.role) return false; var r=String(me.role).toUpperCase(); var TK=['OWNER','BOSS','오너','사장','대표','DUEÑO','DUENO','PROPIETARIO','MANAGER','GERENTE','매니저','점장','부매니저','ASSISTANT MANAGER','ASST MANAGER','EXECUTIVE','전무','VICE PRESIDENT','VP','SUPERVISOR']; return TK.some(function(x){ return r.indexOf(x.toUpperCase())>=0; }); }catch(e){ return false; } }
function busy(on,msg){ var b=document.getElementById('busy'); b.textContent=msg||t('saving'); b.style.display=on?'block':'none'; }
function stageLabel(st){ return st==='order'?t('sgOrder'):st==='progress'?t('sgProgress'):st==='prepare'?t('sgPrepare'):t('sgSend'); }
function stageForStatus(s){ return s==='requested'?'order':s==='inprogress'?'progress':s==='prepared'?'prepare':'send'; }
var TYPE_ICON={meat:'🥩',fish:'🐟',other:'📦'};
function typeLabel(tp){ return t(tp==='meat'?'tMeat':tp==='fish'?'tFish':'tOther'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dueState(o){ if(!o.need||o.status==='sent') return ''; var td=todayStr(); if(o.need<td) return 'over'; if(o.need===td) return 'today'; return ''; }
function dueChip(o){ var d=dueState(o); if(d==='over') return '<span class="duechip over">⏰ '+t('overdue')+'</span>'; if(d==='today') return '<span class="duechip today">⏰ '+t('dueToday')+'</span>'; return ''; }
function orderRank(o){ if(o.status==='sent') return 2; if(o.delayed) return 1; return 0; }

function applyLang(){
  document.querySelectorAll('[data-i]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i')); });
  document.querySelectorAll('[data-iph]').forEach(function(el){ el.placeholder=t(el.getAttribute('data-iph')); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang')===LANG); });
  render();
}

function renderOrderPics(){ document.getElementById('orderPics').innerHTML=PENDING_PICS.map(function(u,i){ return '<img src="'+u+'" title="'+t('tapRemove')+'" onclick="PENDING_PICS.splice('+i+',1);renderOrderPics();">'; }).join(''); }

function submitOrder(){
  if(!FB){ alert(t('mustLogin')); return; }
  var item=(document.getElementById('fItem').value||'').trim();
  if(!item){ alert(t('needItem')); return; }
  var order={ type:PICK_TYPE, item:item, qty:(document.getElementById('fQty').value||'').trim(), need:(document.getElementById('fNeed').value||''), branch:document.getElementById('fBranch').value||meBranch(), note:(document.getElementById('fNote').value||'').trim(), status:'requested', by:meName(), byBranch:meBranch(), at:Date.now(), photoCount:0 };
  var pics=PENDING_PICS.slice(); busy(true,t('saving'));
  var r=FB.push(FB.ref(FB.db,'dispatch/orders')); var oid=r.key;
  FB.set(r, order).then(function(){ return pics.reduce(function(p,url){ return p.then(function(){ return pushPhoto(oid,url,'order'); }); }, Promise.resolve()); })
  .then(function(){ if(pics.length) return FB.update(FB.ref(FB.db,'dispatch/orders/'+oid), {photoCount:pics.length, lastPhotoAt:Date.now()}); })
  .then(function(){ PENDING_PICS=[]; renderOrderPics(); busy(false); document.getElementById('fItem').value=''; document.getElementById('fQty').value=''; document.getElementById('fNeed').value=''; document.getElementById('fNote').value=''; toggleForm(false); })
  .catch(function(e){ busy(false); alert('❌ '+(e.message||e)); });
}

function setStatus(id, st){
  if(!FB) return;
  var patch={status:st};
  if(st==='inprogress'){ patch.progBy=meName(); patch.progAt=Date.now(); }
  if(st==='prepared'){ patch.preparedBy=meName(); patch.preparedAt=Date.now(); }
  if(st==='sent'){ patch.sentBy=meName(); patch.sentAt=Date.now(); }
  FB.update(FB.ref(FB.db,'dispatch/orders/'+id), patch).catch(function(e){ alert('❌ '+(e.message||e)); });
}
function markStage(id, st){
  setStatus(id, st);
  if(st==='sent'){ var o=ORDERS[id]; if(o && !o.reported) reportToChat(id, o); startPhoto(id,'send'); }
  else if(st==='prepared'){ startPhoto(id,'prepare'); }
}
function genPhoto(id){ var o=ORDERS[id]||{}; startPhoto(id, stageForStatus(o.status||'requested')); }
function setDelay(id){ if(!FB) return; var reason=prompt(t('delayPrompt'),''); if(reason===null) return; FB.update(FB.ref(FB.db,'dispatch/orders/'+id), { delayed:true, delayNote:reason, delayBy:meName(), delayAt:Date.now() }).catch(function(e){ alert('\u274c '+(e.message||e)); }); }
function clearDelay(id){ if(!FB) return; FB.update(FB.ref(FB.db,'dispatch/orders/'+id), { delayed:false, delayNote:'' }).catch(function(){}); }
function delOrder(id){ if(!FB) return; if(!confirm(t('delConfirm'))) return; FB.remove(FB.ref(FB.db,'dispatch/orders/'+id)).catch(function(){}); FB.remove(FB.ref(FB.db,'dispatchPhotos/'+id)).catch(function(){}); }

function reportToChat(id, o){
  if(!FB) return;
  var kws=REPORT_KW[o.type]||REPORT_KW.other;
  var wantIds=REPORT_ROOM_IDS[o.type]||REPORT_ROOM_IDS.other;
  FB.get(FB.ref(FB.db,'chat/rooms')).then(function(snap){
    var rooms=snap.val()||{}; var roomId=null, roomName='';
    // 1순위: 정확한 방 ID (제품종류→평가방 고정 매핑)
    for(var w=0;w<wantIds.length;w++){ if(rooms[wantIds[w]]){ roomId=wantIds[w]; roomName=(rooms[roomId].name)||roomId; break; } }
    // 2순위(폴백): 방 ID 가 없을 때만 이름 키워드 검색. 1:1 DM 방은 제외.
    if(!roomId){ Object.keys(rooms).forEach(function(rid){ if(roomId||rid.indexOf('dm__')===0) return; var nm=((rooms[rid]&&rooms[rid].name)||'').toLowerCase(); for(var i=0;i<kws.length;i++){ if(nm.indexOf(kws[i].toLowerCase())>=0){ roomId=rid; roomName=rooms[rid].name; break; } } }); }
    if(!roomId){ console.warn('[dispatch] no report room'); return; }
    var ts=Date.now(); var msgId='m'+ts+Math.floor(Math.random()*900);
    var text='🚚 ['+t('repMsg')+'] '+(TYPE_ICON[o.type]||'')+' '+o.item+(o.qty?(' ('+o.qty+')'):'')+' → '+o.branch+'\n· '+typeLabel(o.type)+' · '+t('sentBy')+': '+meName()+(o.photoCount?(' · 📷'+o.photoCount):'');
    var msg={ sender:meName(), senderBranch:meBranch(), senderRole:'', isManager:false, color:'#0277BD', text:text, ts:ts, photos:[], files:[] };
    FB.set(FB.ref(FB.db,'chat/messages/'+roomId+'/'+msgId), msg).then(function(){
      FB.update(FB.ref(FB.db,'chat/rooms/'+roomId), { lastMsg:'🚚 '+t('repMsg')+' '+o.item, lastTs:ts, lastSender:meName() }).catch(function(){});
      FB.update(FB.ref(FB.db,'dispatch/orders/'+id), { reported:true, reportedRoom:roomName, reportedAt:ts }).catch(function(){});
    }).catch(function(e){ console.warn('[dispatch] report fail', e); });
  }).catch(function(){});
}

function pushPhoto(id, dataUrl, stage){ var r=FB.push(FB.ref(FB.db,'dispatchPhotos/'+id)); return FB.set(r, { url:dataUrl, stage:stage, by:meName(), at:Date.now() }); }
function startPhoto(id, stage){ PHOTO_TARGET=id; PHOTO_STAGE=stage||'send'; var inp=document.getElementById('photoInput'); inp.value=''; inp.click(); }
document.getElementById('photoInput').addEventListener('change', function(e){
  var f=e.target.files&&e.target.files[0]; if(!f||!PHOTO_TARGET) return;
  var id=PHOTO_TARGET, stage=PHOTO_STAGE; busy(true,t('compressing'));
  compress(f,1100,0.6).then(function(url){ busy(true,t('uploading')); return pushPhoto(id,url,stage); })
  .then(function(){ var o=ORDERS[id]||{}; delete PIC_CACHE[id]; return FB.update(FB.ref(FB.db,'dispatch/orders/'+id), { photoCount:(o.photoCount||0)+1, lastPhotoAt:Date.now() }); })
  .then(function(){ busy(false); }).catch(function(err){ busy(false); alert('❌ '+(err.message||err)); });
});
function compress(file,maxDim,q){
  return new Promise(function(resolve,reject){
    var img=new Image(); var url=URL.createObjectURL(file);
    img.onload=function(){ var w=img.width,h=img.height; if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); try{URL.revokeObjectURL(url);}catch(e){} resolve(c.toDataURL('image/jpeg',q)); };
    img.onerror=function(){ reject(new Error('image load fail')); }; img.src=url;
  });
}
var PIC_CACHE={};
function viewPics(id){
  if(PIC_CACHE[id]){ openLightbox(PIC_CACHE[id]); return; }
  busy(true,'…');
  FB.get(FB.ref(FB.db,'dispatchPhotos/'+id)).then(function(snap){ busy(false); var v=snap.val()||{}; var arr=Object.keys(v).map(function(k){return v[k];}); arr.sort(function(a,b){return (a.at||0)-(b.at||0);}); PIC_CACHE[id]=arr; if(arr.length) openLightbox(arr); }).catch(function(){ busy(false); });
}
function openLightbox(arr){ LB_PICS=arr; LB_I=0; showLb(); document.getElementById('lightbox').style.display='flex'; }
function showLb(){ var p=LB_PICS[LB_I]; if(!p) return; var url=(typeof p==='string')?p:p.url; var stg=(typeof p==='string')?'':p.stage; var who=(typeof p==='string')?'':p.by; document.getElementById('lbImg').src=url||''; document.getElementById('lbCap').innerHTML=(LB_I+1)+' / '+LB_PICS.length+(stg?('　<span class="stg">'+stageLabel(stg)+'</span>'):'')+(who?('　· '+esc(who)):''); }

function printOrders(id){
  var list;
  if(id){ var o=ORDERS[id]; if(!o) return; o._id=id; list=[o]; }
  else { list=Object.keys(ORDERS).map(function(k){ var x=ORDERS[k]; x._id=k; return x; }).filter(function(x){ return x.status!=='sent'; }); list.sort(function(a,b){ return (a.need||'9999-99-99').localeCompare(b.need||'9999-99-99'); }); }
  if(!list.length){ alert(t('noPrint')); return; }
  var w=window.open('','_blank'); if(!w){ alert(t('popupBlock')); return; }
  w.document.write(printHTML(list)); w.document.close(); w.focus(); setTimeout(function(){ try{ w.print(); }catch(e){} }, 350);
}
function printHTML(list){

      '<td class="qt">'+esc(o.qty||'')+'</td>'+
      '<td class="fr">'+esc(o.branch||'')+'</td>'+
      '<td class="nd">'+esc(o.need||'-')+due+dly+'</td>'+
    '</tr>';
  }).join('');
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+t('printTitle')+'</title><style>'+
    '@page{margin:10mm}'+
    'body{font-family:-apple-system,"Malgun Gothic",Arial,sans-serif;color:#000;padding:0;margin:0}'+
    'h1{font-size:18px;margin:0 0 2px}.sub{font-size:11px;color:#444;margin-bottom:8px;border-bottom:2px solid #000;padding-bottom:5px}'+
    'table{width:100%;border-collapse:collapse}'+
    'th,td{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top}'+
    'thead th{background:#eee;font-size:12px;font-weight:800}'+
    'tr{page-break-inside:avoid}'+
    'td.c{width:26px;text-align:center;font-size:20px;font-weight:800;padding:2px 0}'+
    'td.no{width:26px;text-align:center;font-size:12px;color:#555}'+
    'td.it{font-size:15px;font-weight:800}'+
    'td.qt{font-size:14px;font-weight:800;white-space:nowrap;width:90px}'+
    'td.fr{font-size:13px;white-space:nowrap}'+
    'td.nd{font-size:13px;white-space:nowrap}'+
    '.nt{font-size:12px;font-weight:400;color:#333;margin-top:2px}'+
    '.ov{color:#fff;background:#b91c1c;padding:0 5px;border-radius:8px;font-size:11px;font-weight:800}'+
    '.td{color:#fff;background:#b45309;padding:0 5px;border-radius:8px;font-size:11px;font-weight:800}'+
    '.dl{color:#fff;background:#c2410c;padding:0 5px;border-radius:8px;font-size:11px;font-weight:800}'+
    '</style></head><body><h1>🚚 '+t('printTitle')+'</h1><div class="sub">'+new Date().toLocaleString()+'　·　'+list.length+' '+ (LANG==='ko'?'건':(LANG==='es'?'pedidos':'orders')) +'</div>'+
    '<table><thead><tr><th class="c">✓</th><th class="no">#</th><th>'+H.it+'</th><th>'+H.qt+'</th><th>'+H.fr+'</th><th>'+H.nd+'</th></tr></thead><tbody>'+rows+'</tbody></table></body></html>';
}

function setFilter(f){ FILTER=f; document.querySelectorAll('#filters button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-f')===f); }); render(); }
function fmtTime(ts){ if(!ts) return ''; var d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function render(){
  var arr=Object.keys(ORDERS).map(function(k){ var o=ORDERS[k]; o._id=k; return o; });
  var cnt={all:arr.length,requested:0,inprogress:0,prepared:0,sent:0};
  arr.forEach(function(o){ if(cnt[o.status]!=null) cnt[o.status]++; });
  ['all','requested','inprogress','prepared','sent'].forEach(function(k){ var el=document.getElementById('st-'+k); if(el) el.textContent=cnt[k]; });
  var dlN=arr.filter(function(o){ return o.delayed&&o.status!=='sent'; }).length; var dlEl=document.getElementById('st-delayed'); if(dlEl) dlEl.textContent=dlN;
  arr.sort(function(a,b){ var ra=orderRank(a),rb=orderRank(b); if(ra!==rb) return ra-rb; return (b.at||0)-(a.at||0); });
  if(FILTER==='delayed') arr=arr.filter(function(o){ return o.delayed&&o.status!=='sent'; });
  else if(FILTER!=='all') arr=arr.filter(function(o){ return o.status===FILTER; });
  var list=document.getElementById('list');
  if(!arr.length){ list.innerHTML='<div class="empty"><div class="ico">📭</div><b>'+t('emptyT')+'</b><br>'+t('emptyD')+'</div>'; return; }
  list.innerHTML=arr.map(function(o){
    var id=o._id; var badge=t(o.status==='requested'?'fReq':o.status==='inprogress'?'fProg':o.status==='prepared'?'fPrep':'fSent');
    var over=(dueState(o)==='over')?' overdue':'';
    var pics=(o.photoCount>0)?('<div class="pics"><button class="more" onclick="viewPics(\''+id+'\')">🖼 '+t('viewPics')+' ('+o.photoCount+')</button></div>'):'';
    var a='<div class="acts">';
    if(o.status==='requested') a+='<button class="a-prog" onclick="markStage(\''+id+'\',\'inprogress\')">👀 '+t('btnProg')+'</button>';
    if(o.status==='inprogress') a+='<button class="a-prep" onclick="markStage(\''+id+'\',\'prepared\')">✅ '+t('btnPrepared')+'</button>';
    if(o.status==='prepared') a+='<button class="a-send" onclick="markStage(\''+id+'\',\'sent\')">🚚 '+t('btnSent')+'</button>';
    a+='<button class="a-photo" onclick="genPhoto(\''+id+'\')">📷 '+t(o.status==='sent'?'addPhoto':'photo')+'</button>';
    if(o.status==='inprogress') a+='<button class="a-undo" onclick="setStatus(\''+id+'\',\'requested\')">↩ '+t('undo')+'</button>';
    if(o.status==='prepared') a+='<button class="a-undo" onclick="setStatus(\''+id+'\',\'inprogress\')">↩ '+t('undo')+'</button>';
    if(o.status==='sent') a+='<button class="a-undo" onclick="setStatus(\''+id+'\',\'prepared\')">↩ '+t('undo')+'</button>';
    if(o.status!=='sent') a+= o.delayed ? ('<button class="a-undo" onclick="clearDelay(\''+id+'\')">✅ '+t('delayClear')+'</button>') : ('<button class="a-delay" onclick="setDelay(\''+id+'\')">⚠️ '+t('delayBtn')+'</button>');
    if(meIsManager()) a+='<button class="a-del" onclick="delOrder(\''+id+'\')">🗑 '+t('del')+'</button>';
    a+='</div>';
    var stamp = (o.status==='sent') ? ('<div class="stamp done">'+t('stampDone')+'</div>') : ((o.delayed) ? ('<div class="stamp delay">'+t('fDelay')+'</div>') : '');
    return '<div class="order st-'+o.status+over+'">'+stamp+
      '<div class="oh"><div class="ttl">'+(TYPE_ICON[o.type]||'📦')+' '+esc(o.item||'')+(o.qty?(' <span style="font-weight:600;color:var(--mute)">· '+esc(o.qty)+'</span>'):'')+'</div>'+
      '<span class="badge '+o.status+'">'+badge+'</span></div>'+
      '<div class="meta">📍 <b>'+esc(o.branch||'')+'</b> · '+typeLabel(o.type)+' · '+t('by')+': '+esc(o.by||'')+' · '+t('reqAt')+' '+fmtTime(o.at)+
      (o.need?('<br>🗓 '+t('need')+': <b>'+esc(o.need)+'</b>'+dueChip(o)):'')+
      (o.progBy&&o.status!=='requested'?('<br>👀 '+t('progBy')+': '+esc(o.progBy)+' '+fmtTime(o.progAt)):'')+
      (o.preparedBy&&(o.status==='prepared'||o.status==='sent')?('<br>👨‍🍳 '+t('preparedBy')+': '+esc(o.preparedBy)+' '+fmtTime(o.preparedAt)):'')+
      (o.status==='sent'&&o.sentBy?('<br>✅ '+t('sentBy')+': '+esc(o.sentBy)+' '+fmtTime(o.sentAt)):'')+'</div>'+
      (o.note?('<div class="note">'+esc(o.note)+'</div>'):'')+
      ((o.delayed&&o.status!=='sent')?('<div class="delaybox">⚠️ '+t('delayTitle')+(o.delayNote?(' — '+esc(o.delayNote)):'')+' ('+esc(o.delayBy||'')+')</div>'):'')+
      (o.reported?('<div class="rep">📣 '+t('reported')+(o.reportedRoom?(' · '+esc(o.reportedRoom)):'')+'</div>'):'')+
      pics+a+'</div>';
  }).join('');
}

function boot(){ try{ LANG=localStorage.getItem('km.lang')||'ko'; }catch(e){} document.getElementById('myBranchLbl').textContent=meBranch(); fillBranchSelect(); applyLang(); pickType('meat'); if(window.__fb){ FB=window.__fb; subscribe(); } }
function subscribe(){ if(!FB) return; FB.onValue(FB.ref(FB.db,'dispatch/orders'), function(snap){ ORDERS=snap.val()||{}; render(); }, function(){}); }
window.addEventListener('fb-ready', boot);
if(window.__fb){ boot(); }
window.addEventListener('fb-auth-ready', function(){ document.getElementById('myBranchLbl').textContent=meBranch(); fillBranchSelect(); });
</script>
</body>
</html>
