<style>
:root{--green:#1a5c3a;--green2:#15803d;--lgreen:#e8f5ee;--bg:#f4f7f5;--card:#fff;--line:#e2e8e5;
 --text:#1f2937;--mute:#6b7280;--amber:#b45309;--red:#dc2626;--blue:#1d4ed8;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select{font-family:inherit;font-size:1em}button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding-bottom:50px}
.topwrap{position:sticky;top:0;z-index:20}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hd{background:var(--green);color:#fff;padding:10px 12px}
.hd .r1,.hd .r2{display:flex;align-items:center;gap:8px}
.hd .r2{margin-top:8px}
.hd h1{font-size:1.05em;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .back{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-size:1.5em;font-weight:800;line-height:1}
.lang{flex:none;display:flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px}
.lang button{background:transparent;border:0;color:rgba(255,255,255,.8);font-weight:800;font-size:.8em;min-width:36px;height:32px;border-radius:7px}
.lang button.on{background:#fff;color:var(--green)}
.datenav input{min-width:0;width:150px}
.hd .r2 .btn{margin-left:auto}
@media(max-width:759px){.topwrap{display:contents}.hd{position:sticky;top:0;z-index:20}}
@media(min-width:760px){.hd{display:flex;align-items:center;gap:12px}.hd .r1{flex:1;min-width:0}.hd .r2{margin-top:0}}
.hd .btn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:7px 12px;font-weight:700;font-size:.82em}
.hd .btn.on{background:#fff;color:var(--green)}
.datenav{display:flex;align-items:center;gap:6px}
.datenav input{border:0;border-radius:8px;padding:6px 8px;font-weight:700}
.datenav button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;width:32px;height:32px;font-weight:800;font-size:1.1em}
.bar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#f1f5f4;border:1.5px solid var(--line);border-radius:20px;padding:6px 13px;font-weight:700;font-size:.85em;color:var(--mute)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip .n{background:rgba(255,255,255,.35);border-radius:10px;padding:0 6px;margin-left:5px;font-size:.9em}
.bar select{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:700;background:#fff}
.stats{display:flex;gap:10px;padding:12px 16px;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:center}
.stat b{display:block;font-size:1.5em;font-weight:900;color:var(--green)}
.stat.new b{color:var(--red)}
.stat span{font-size:.74em;color:var(--mute);font-weight:700}
.list{padding:6px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:5px solid var(--mute)}
.card.new{border-left-color:var(--red)}
.card.preparing{border-left-color:var(--amber)}
.card.done{border-left-color:var(--green2);opacity:.72}
.card.cancelled{border-left-color:#9ca3af;opacity:.6}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.0)}50%{box-shadow:0 0 0 5px rgba(220,38,38,.35)}}
.card.flash{animation:flash 1s ease-in-out 4}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.onum{font-weight:900;font-size:.95em}
.ago{color:var(--mute);font-size:.78em;margin-left:auto}
.badge{display:inline-block;border-radius:7px;padding:2px 8px;font-size:.74em;font-weight:800}
.b-del{background:#dbeafe;color:var(--blue)}
.b-pick{background:#dcfce7;color:var(--green2)}
.pill{border-radius:20px;padding:3px 10px;font-size:.74em;font-weight:800}
.pill.new{background:#fee2e2;color:var(--red)}
.pill.preparing{background:#fef3c7;color:var(--amber)}
.pill.done{background:#dcfce7;color:var(--green2)}
.pill.cancelled{background:#f3f4f6;color:#6b7280}
.cust{font-weight:700;font-size:.95em;margin-bottom:2px}
.cust a{color:var(--blue);text-decoration:none}
.meta{font-size:.83em;color:var(--mute);line-height:1.5;margin-bottom:8px}
.items{background:#f8faf9;border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:.88em}
.items .it{display:flex;justify-content:space-between;padding:2px 0}
.items .it b{font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:900;border-top:1px solid var(--line);margin-top:5px;padding-top:5px}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:6px 9px;font-size:.83em;color:#92400e;margin-bottom:8px}
.pay{font-size:.83em;font-weight:700;color:var(--text);margin-bottom:10px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{flex:1;min-width:74px;border:0;border-radius:9px;padding:9px;font-weight:800;font-size:.85em;color:#fff}
.act-prep{background:var(--amber)}.act-done{background:var(--green2)}.act-cancel{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.act-reopen{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.empty{padding:50px 16px;text-align:center;color:var(--mute)}
.gate{display:none;padding:60px 20px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topwrap">
  <div class="hd">
    <div class="r1">
      <a class="back" href="./apps.html" onclick="return goBack()" aria-label="Back">‹</a>
      <h1 data-i="title">🛒 온라인 주문 접수</h1>
      <div class="lang" id="langBox"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="ko" onclick="setLang('ko')">KO</button><button data-l="es" onclick="setLang('es')">ES</button></div>
    </div>
    <div class="r2">
      <div class="datenav">
        <button onclick="shiftDay(-1)">‹</button>
        <input type="date" id="oDate" onchange="subscribe()">
        <button onclick="shiftDay(1)">›</button>
      </div>
      <button class="btn" id="soundBtn" onclick="toggleSound()">🔕</button>
    </div>
  </div>

  <div class="bar">
    <div class="chips" id="statusChips">
      <button class="chip on" data-s="active" onclick="setStatusFilter('active')"><span data-i="f_active">진행중</span></button>
      <button class="chip" data-s="new" onclick="setStatusFilter('new')"><span data-i="f_new">신규</span> <span class="n" id="cNew">0</span></button>
      <button class="chip" data-s="preparing" onclick="setStatusFilter('preparing')"><span data-i="f_prep">준비중</span> <span class="n" id="cPrep">0</span></button>
      <button class="chip" data-s="done" onclick="setStatusFilter('done')"><span data-i="f_done">완료</span></button>
      <button class="chip" data-s="all" onclick="setStatusFilter('all')"><span data-i="f_all">전체</span></button>
    </div>
    <select id="typeFilter" onchange="render()">
      <option value="" data-i="ty_all">🚗🏪 배달+픽업</option>
      <option value="delivery" data-i="ty_del">🚗 배달만</option>
      <option value="pickup" data-i="ty_pick">🏪 픽업만</option>
    </select>
    <select id="storeFilter" onchange="render()"><option value="" data-i="all_st">🏢 전 지점</option></select>
  </div>
  </div>

  <div class="stats">
    <div class="stat new"><b id="stNew">0</b><span data-i="s_new">신규 대기</span></div>
    <div class="stat"><b id="stCount">0</b><span data-i="s_count">오늘 주문</span></div>
    <div class="stat"><b id="stRevenue">$0</b><span data-i="s_rev">오늘 매출</span></div>
  </div>

  <div class="list" id="list"></div>
  <div class="gate" id="gate" data-i="gate">로그인이 필요합니다. 승인된 직원만 볼 수 있어요.</div>
</div>

<audio id="ding" preload="auto"></audio>

<script>
/* ===== 기본 ===== */
var STORES=['Miami (Palmetto Bay)','Pembroke Pines','Hollywood','Coral Springs','Fort Lauderdale (Las Olas)','New Location · Coming Soon'];
var ORDERS={};           // {id: order}
var KNOWN=new Set();     // 이미 본 주문 id (신규 알림용)
var FIRST_LOAD=true;
var STATUS_FILTER='active';
var SOUND_ON=false;
var UNSUB=null;
/* ===== 언어 (EN/KO/ES) ===== */
var I18N={
 en:{title:'🛒 Online Orders',f_active:'Active',f_new:'New',f_prep:'Preparing',f_done:'Done',f_all:'All',ty_all:'🚗🏪 Delivery + Pickup',ty_del:'🚗 Delivery only',ty_pick:'🏪 Pickup only',all_st:'🏢 All stores',
  s_new:'New waiting',s_count:'Orders today',s_rev:'Sales today',gate:'Please sign in. Approved staff only.',snd_on:'🔔 Sound on',snd_off:'🔕 Sound off',now:'just now',m:'m ago',h:'h ago',d:'d ago',
  ch_fail:'Update failed: ',c_cancel:'Cancel this order?',st_new:'New',st_prep:'Preparing',st_done:'Done',st_cancel:'Cancelled',empty:'No orders match',del:'🚗 Delivery',pick:'🏪 Pickup',
  b_prep:'Start preparing',b_done:'Done',b_cancel:'Cancel',b_mark:'Mark done',b_reopen:'Reopen',total:'Total',items:' items',dfee:' · Delivery fee '},
 ko:{title:'🛒 온라인 주문 접수',f_active:'진행중',f_new:'신규',f_prep:'준비중',f_done:'완료',f_all:'전체',ty_all:'🚗🏪 배달+픽업',ty_del:'🚗 배달만',ty_pick:'🏪 픽업만',all_st:'🏢 전 지점',
  s_new:'신규 대기',s_count:'오늘 주문',s_rev:'오늘 매출',gate:'로그인이 필요합니다. 승인된 직원만 볼 수 있어요.',snd_on:'🔔 소리 켜짐',snd_off:'🔕 소리 꺼짐',now:'방금',m:'분 전',h:'시간 전',d:'일 전',
  ch_fail:'변경 실패: ',c_cancel:'이 주문을 취소 처리할까요?',st_new:'신규',st_prep:'준비중',st_done:'완료',st_cancel:'취소',empty:'해당 조건의 주문이 없습니다',del:'🚗 배달',pick:'🏪 픽업',
  b_prep:'준비 시작',b_done:'완료',b_cancel:'취소',b_mark:'완료 처리',b_reopen:'다시 열기',total:'합계',items:'개',dfee:' · 배달비 '},
 es:{title:'🛒 Pedidos en línea',f_active:'Activos',f_new:'Nuevos',f_prep:'Preparando',f_done:'Listos',f_all:'Todos',ty_all:'🚗🏪 Entrega + Recogida',ty_del:'🚗 Solo entrega',ty_pick:'🏪 Solo recogida',all_st:'🏢 Todas las tiendas',
  s_new:'Nuevos en espera',s_count:'Pedidos hoy',s_rev:'Ventas hoy',gate:'Inicie sesión. Solo personal aprobado.',snd_on:'🔔 Sonido activado',snd_off:'🔕 Sonido apagado',now:'ahora',m:' min',h:' h',d:' d',
  ch_fail:'Error al cambiar: ',c_cancel:'¿Cancelar este pedido?',st_new:'Nuevo',st_prep:'Preparando',st_done:'Listo',st_cancel:'Cancelado',empty:'No hay pedidos',del:'🚗 Entrega',pick:'🏪 Recogida',
  b_prep:'Empezar',b_done:'Listo',b_cancel:'Cancelar',b_mark:'Marcar listo',b_reopen:'Reabrir',total:'Total',items:' art.',dfee:' · Envío '}
};
var LANG=(function(){try{var v=localStorage.getItem('kimchi_lang');return I18N[v]?v:'en';}catch(e){return 'en';}})();
function t(k){return (I18N[LANG]&&I18N[LANG][k]!=null)?I18N[LANG][k]:(I18N.en[k]||k);}
function applyLang(){document.documentElement.lang=LANG;document.title=t('title');document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i);});document.querySelectorAll('#langBox button').forEach(function(b){b.classList.toggle('on',b.dataset.l===LANG);});var sb=document.getElementById('soundBtn');if(sb)sb.textContent=SOUND_ON?t('snd_on'):t('snd_off');}
function setLang(l){if(!I18N[l])return;LANG=l;try{['kimchi_lang','hub.lang','tasks.lang'].forEach(function(k){localStorage.setItem(k,l);});}catch(e){}applyLang();render();}
window.setLang=setLang;
function goBack(){try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return false;}}catch(e){}return true;}
window.goBack=goBack;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function money(n){return '$'+(Math.round((+n||0)*100)/100).toFixed(2);}
function ago(ts){if(!ts)return '';var s=Math.floor((Date.now()-ts)/1000);if(s<60)return t('now');if(s<3600)return Math.floor(s/60)+t('m');if(s<86400)return Math.floor(s/3600)+t('h');return Math.floor(s/86400)+t('d');}

/* ===== 소리 알림 ===== */
var AUDIO=null;
function ensureAudio(){try{if(!AUDIO)AUDIO=new (window.AudioContext||window.webkitAudioContext)();if(AUDIO.state==='suspended')AUDIO.resume();}catch(e){}}
function ding(){
  if(!SOUND_ON)return;
  ensureAudio();
  try{
    if(!AUDIO)return;
    [0,0.18,0.36].forEach(function(off){
      var o=AUDIO.createOscillator(),g=AUDIO.createGain();o.connect(g);g.connect(AUDIO.destination);
      o.type='sine';o.frequency.value=880;
      var tt=AUDIO.currentTime+off;
      g.gain.setValueAtTime(0.0001,tt);g.gain.exponentialRampToValueAtTime(0.4,tt+0.01);g.gain.exponentialRampToValueAtTime(0.0001,tt+0.16);
      o.start(tt);o.stop(tt+0.18);
    });
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([120,60,120]);}catch(e){}
}
function toggleSound(){
  SOUND_ON=!SOUND_ON;
  var b=document.getElementById('soundBtn');
  b.classList.toggle('on',SOUND_ON);
  b.textContent=SOUND_ON?t('snd_on'):t('snd_off');
  if(SOUND_ON){ensureAudio();ding();}
}
window.toggleSound=toggleSound;

/* ===== 날짜/구독 ===== */
function shiftDay(d){var inp=document.getElementById('oDate');var dt=inp.value?new Date(inp.value+'T00:00:00'):new Date();dt.setDate(dt.getDate()+d);inp.value=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');subscribe();}
window.shiftDay=shiftDay;
function subscribe(){
  var fb=window.__fb;if(!fb)return;
  var dk=document.getElementById('oDate').value||todayKey();
  document.getElementById('oDate').value=dk;
  if(UNSUB){try{UNSUB();}catch(e){}UNSUB=null;}
  FIRST_LOAD=true;KNOWN=new Set();
  var r=fb.ref(fb.db,'shopOrders/'+dk);
  UNSUB=fb.onValue(r,function(snap){
    ORDERS=snap.val()||{};
    // 신규 주문 감지 → 소리
    var newCount=0;
    Object.keys(ORDERS).forEach(function(id){
      if(!KNOWN.has(id)){
        if(!FIRST_LOAD && (ORDERS[id].status==='new'||!ORDERS[id].status)) newCount++;
        KNOWN.add(id);
      }
    });
    if(newCount>0){ding();}
    FIRST_LOAD=false;
    render();
  });
}
window.subscribe=subscribe;

/* ===== 필터 ===== */
function setStatusFilter(s){STATUS_FILTER=s;document.querySelectorAll('#statusChips .chip').forEach(function(c){c.classList.toggle('on',c.dataset.s===s);});render();}
window.setStatusFilter=setStatusFilter;

/* ===== 상태 변경 ===== */
function setStatus(id,st){
  var fb=window.__fb;var dk=document.getElementById('oDate').value||todayKey();
  var me=null;try{me=JSON.parse(localStorage.getItem('chat.me')||'null');}catch(e){}
  fb.update(fb.ref(fb.db,'shopOrders/'+dk+'/'+id),{status:st, handledBy:(me&&me.name)||'', handledAt:Date.now()}).catch(function(e){alert(t('ch_fail')+(e.message||e));});
}
window.setStatus=setStatus;
function cancelOrder(id){if(confirm(t('c_cancel')))setStatus(id,'cancelled');}
window.cancelOrder=cancelOrder;

/* ===== 렌더 ===== */
function fillStoreFilter(){
  var sel=document.getElementById('storeFilter');if(sel.options.length>1)return;
  sel.innerHTML='<option value="" data-i="all_st">'+t('all_st')+'</option>'+STORES.filter(function(s){return s.indexOf('Coming')<0;}).map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>';}).join('');
}
function statusKo(st){return st==='preparing'?t('st_prep'):st==='done'?t('st_done'):st==='cancelled'?t('st_cancel'):t('st_new');}
function render(){
  var el=document.getElementById('list');if(!el)return;
  var typeF=document.getElementById('typeFilter').value;
  var storeF=document.getElementById('storeFilter').value;
  var rows=Object.keys(ORDERS).map(function(id){return Object.assign({_id:id},ORDERS[id]);});
  // stats (필터 무관, 그날 전체)
  var stNew=0,stRev=0;
  rows.forEach(function(o){var st=o.status||'new';if(st==='new')stNew++;if(st!=='cancelled')stRev+=(+o.total||0);});
  document.getElementById('stNew').textContent=stNew;
  document.getElementById('stCount').textContent=rows.length;
  document.getElementById('stRevenue').textContent=money(stRev);
  document.getElementById('cNew').textContent=rows.filter(function(o){return (o.status||'new')==='new';}).length;
  document.getElementById('cPrep').textContent=rows.filter(function(o){return o.status==='preparing';}).length;
  // 필터
  rows=rows.filter(function(o){
    var st=o.status||'new';
    if(STATUS_FILTER==='active'){if(st==='done'||st==='cancelled')return false;}
    else if(STATUS_FILTER!=='all'){if(st!==STATUS_FILTER)return false;}
    if(typeF && o.type!==typeF)return false;
    if(storeF && o.store!==storeF)return false;
    return true;
  });
  // 정렬: 신규 먼저, 최신순
  var order={'new':0,'preparing':1,'done':2,'cancelled':3};
  rows.sort(function(a,b){var d=(order[a.status||'new']-order[b.status||'new']);return d||(b.at||0)-(a.at||0);});
  if(!rows.length){el.innerHTML='<div class="empty">'+t('empty')+'</div>';return;}
  el.innerHTML=rows.map(function(o){
    var st=o.status||'new';
    var typeBadge=o.type==='delivery'?'<span class="badge b-del">'+t('del')+'</span>':'<span class="badge b-pick">'+t('pick')+'</span>';
    var addr=o.address?('📍 '+esc([o.address.street,o.address.apt,o.address.city,o.address.zip].filter(Boolean).join(', '))):'';
    var phone=o.customer&&o.customer.phone?esc(o.customer.phone):'';
    var items=(o.items||[]).map(function(it){return '<div class="it"><span>'+esc(it.name)+(it.nameKr?(' <span style="color:#9ca3af">'+esc(it.nameKr)+'</span>'):'')+' × '+it.qty+'</span><b>'+money(it.lineTotal!=null?it.lineTotal:(it.price*it.qty))+'</b></div>';}).join('');
    var acts='';
    if(st==='new')acts='<button class="act-prep" onclick="setStatus(\''+o._id+'\',\'preparing\')">'+t('b_prep')+'</button><button class="act-done" onclick="setStatus(\''+o._id+'\',\'done\')">'+t('b_done')+'</button><button class="act-cancel" onclick="cancelOrder(\''+o._id+'\')">'+t('b_cancel')+'</button>';
    else if(st==='preparing')acts='<button class="act-done" onclick="setStatus(\''+o._id+'\',\'done\')">'+t('b_mark')+'</button><button class="act-cancel" onclick="cancelOrder(\''+o._id+'\')">'+t('b_cancel')+'</button>';
    else acts='<button class="act-reopen" onclick="setStatus(\''+o._id+'\',\'new\')">'+t('b_reopen')+'</button>';
    var flash=(st==='new' && (Date.now()-(o.at||0)<120000))?' flash':'';
    return '<div class="card '+st+flash+'">'+
      '<div class="crow"><span class="onum">#'+esc(o.id||o._id)+'</span>'+typeBadge+
        '<span class="pill '+st+'">'+statusKo(st)+'</span><span class="ago">'+ago(o.at)+'</span></div>'+
      '<div class="cust">👤 '+esc((o.customer&&o.customer.name)||'-')+(phone?' · <a href="tel:'+phone.replace(/[^0-9+]/g,'')+'">📞 '+phone+'</a>':'')+'</div>'+
      '<div class="meta">'+
        (o.store?('🏢 '+esc(o.store)+'<br>'):'')+
        (addr?(addr+'<br>'):'')+
        '🕐 '+esc(o.time||'ASAP')+
      '</div>'+
      '<div class="items">'+items+
        '<div class="tot"><span>'+t('total')+(o.itemCount?(' ('+o.itemCount+t('items')+')'):'')+'</span><span>'+money(o.total)+'</span></div>'+
      '</div>'+
      '<div class="pay">💰 '+esc(o.paymentLabel||o.payment||'')+(o.deliveryFee?(t('dfee')+money(o.deliveryFee)):'')+'</div>'+
      (o.notes?('<div class="note">📝 '+esc(o.notes)+'</div>'):'')+
      '<div class="acts">'+acts+'</div>'+
    '</div>';
  }).join('');
}
window.render=render;

/* ===== 부팅 ===== */
function isAdmin(){try{var m=JSON.parse(localStorage.getItem('chat.me')||'null');if(!m)return false;var em=String(m.email||'').toLowerCase();if(em)return true;return !!m.name;}catch(e){return false;}}
var booted=false;
applyLang();
function boot(){
  if(booted)return;if(!window.__fb)return;booted=true;
  fillStoreFilter();
  document.getElementById('oDate').value=todayKey();
  subscribe();
}
window.addEventListener('fb-ready',boot);
if(window.__fb)boot();
</script>
</body>
