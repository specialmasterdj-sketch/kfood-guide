  전무님: "지점마다 박스로 오더해 20% 팔고 나머지는 버린다. 한 박스 받아 다른 지점으로
  나눠 팔면 좋겠다." 트럭 매일 · 발주는 지점별 각자 · 원가는 따로 기록 (전무님 답).

  흐름: ① 모집 — 지점들이 "우리 N개" 입력, 1박스 차면 📦 재고 부족/과다 방에 알림
        ② 주문 지점이 벤더에 주문 → [주문함]
        ③ 입고 → [입고됨] → 같은 방에 🚚 LASOLAS TRUCKING 배송 목록 자동 게시(기사가 보는 곳)
        ④ 받은 지점 [받음] → 모두 받으면 완료
        ⑤ 💲 원가 나누기 표 — 원가는 매장에서 따로 기록하므로 복사해 가게 한다
  저장: shareOrders/{id}  (⚠️ 새 경로 — RTDB 규칙 게시 필요)
  후보는 유통기한 앱 손실 리포트의 "🤝 나눠 받기 후보"에서 고른다 (그 줄의 버튼으로 바로 옴).

<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}

async function api(path, method, body){
  var opt = { cache:'no-store' };
  if (method){ opt = { method: method }; if (method !== 'DELETE'){ opt.headers = { 'Content-Type':'application/json' }; opt.body = JSON.stringify(body); } }
  var r = await fetch(DB + '/' + path + '.json', opt);
  if (!r.ok){ var e = new Error(r.status); e.status = r.status; throw e; }
  return method ? null : r.json();
}
function failToast(e){ toast((e && (e.status === 401 || e.status === 403)) ? t('noRule') : t('fail') + ' (' + ((e && e.message) || e) + ')'); }
async function load(){
  try {
    var all = (await api('shareOrders')) || {};
    HUB = all._items || {}; HUB_CFG = all._config || {};
    DATA = {}; Object.keys(all).forEach(function(k){ if (k.charAt(0) !== '_') DATA[k] = all[k]; });
    render();
  }
  catch(e){ document.getElementById('list').innerHTML = '<div class="empty">' + ((e.status === 401 || e.status === 403) ? t('noRule') : t('fail')) + '</div>'; }
}

async function postChat(text, meta){
  var ts = Date.now(), id = 'm' + ts + Math.floor(Math.random() * 900);
  var msg = { sender: meName(), senderBranch: MYB, senderRole: (me() && me().role) || '', isManager: !!(me() && me().isManager),
              color: '#1D4ED8', text: text, ts: ts, photos: [], meta: meta || {} };
  await api('chat/messages/' + ROOM + '/' + id, 'PUT', msg);
  api('chat/rooms/' + ROOM, 'PATCH', { lastMsg: text.split('\n')[0].slice(0, 40), lastTs: ts, lastSender: meName() }).catch(function(){});
}

// 🏬 경유 품목 목록 — 지점은 개수만 넣고 [요청]. 그 품목의 열린 회차에 합쳐진다(없으면 새로 연다).
function renderHub(){
  var list = document.getElementById('list');
  var keys = Object.keys(HUB).filter(function(k){ return HUB[k] && HUB[k].active !== false; })
    .sort(function(a, b){ var x = HUB[a], y = HUB[b]; return String(x.vendorName || '').localeCompare(String(y.vendorName || '')) || String(x.name || '').localeCompare(String(y.name || '')); });
  var h = '<div class="meta" style="margin:0 2px 10px;font-size:.84em">' + t('hubIntro') + '</div>';
  h += '<div class="meta" style="margin:0 2px 12px">👤 ' + t('hubOwner') + ': <b>' + esc(HUB_CFG.hubOwner || '—') + '</b>' +
       (isExec() ? ' <button class="btn" data-hub="owner" style="padding:3px 9px;margin-left:6px">' + t('hubOwnerSet') + '</button>' : '') + '</div>';
  if (!keys.length){ list.innerHTML = h + '<div class="empty">' + t('hubEmpty') + '</div>'; wireHub(list); return; }
  h += keys.map(function(k){
    var it = HUB[k];
    var rid = openRoundFor(k), o = rid ? DATA[rid] : null, sum = o ? wantSum(o) : 0, cs = +it.caseSize || 0;
    var mine = o && o.wants && o.wants[MYB] ? o.wants[MYB].qty : '';
    var now = o ? '<div class="prog"><div class="bar"><div class="f" style="width:' + (cs ? Math.min(100, Math.round(sum / cs * 100)) : 0) + '%"></div></div><span>' +
      t('hubNow') + ' ' + sum + (cs ? ' / ' + cs : '') + '</span></div><div class="wants">' +
      BRANCHES.map(function(b){ var w = o.wants && o.wants[b.id]; return w && w.qty ? '<span class="want' + (b.id === MYB ? ' me' : '') + '">' + esc(bl(b.id)) + ' ' + w.qty + '</span>' : ''; }).join('') + '</div>' : '';
    return '<div class="card' + (k === FOCUS ? ' full' : '') + '" id="hub_' + esc(k) + '">' +
      '<div style="display:flex;gap:10px;align-items:flex-start">' +
        (it.image ? '<img src="' + esc(it.image) + '" alt="" loading="lazy" style="width:64px;height:64px;object-fit:contain;border-radius:10px;background:#f8fafc;border:1px solid var(--line);flex:none" onerror="this.style.display=\'none\'">' : '') +
        '<div style="min-width:0;flex:1"><b>' + esc(it.name) + '</b>' + (it.nameKr && it.nameKr !== it.name ? '<div class="meta">' + esc(it.nameKr) + '</div>' : '') +
        '<div class="meta">🏬 ' + esc(it.vendorName || it.vendor) + ' · #' + esc(it.pid) + (it.size ? ' · ' + esc(it.size) : '') + (cs ? ' · ' + t('caseOf', { n: cs }) : '') + '</div></div>' +
      '</div>' + now +
      '<div class="myrow"><span style="font-size:.8em;font-weight:800">' + esc(bl(MYB)) + ' — ' + t('myQty') + '</span>' +
        '<input type="number" min="0" inputmode="numeric" id="hq_' + esc(k) + '" value="' + esc(mine) + '">' +
        '<button class="btn g" data-hub="req" data-key="' + esc(k) + '">' + t('hubReq') + '</button></div>' +
    '</div>';
  }).join('');
  list.innerHTML = h;
  wireHub(list);
  if (FOCUS){
    var el = document.getElementById('hub_' + FOCUS);
    if (el){ el.scrollIntoView({ block:'center' }); var inp = document.getElementById('hq_' + FOCUS); if (inp) setTimeout(function(){ inp.focus(); }, 300); }
    FOCUS = '';
  }
}
function openRoundFor(k){
  return Object.keys(DATA).filter(function(id){ return DATA[id] && DATA[id].itemKey === k && DATA[id].status === 'open'; })
    .sort(function(a, b){ return (DATA[b].createdAt || 0) - (DATA[a].createdAt || 0); })[0] || '';
}
function wireHub(list){
  list.querySelectorAll('[data-hub]').forEach(function(b){
    b.addEventListener('click', async function(){
      var kind = b.getAttribute('data-hub');
      if (kind === 'owner'){
        var nm = prompt(t('hubOwnerAsk'), HUB_CFG.hubOwner || '');
        if (nm === null) return;
        try { await api('shareOrders/_config/hubOwner', 'PUT', nm.trim()); } catch(e){ failToast(e); return; }
        await load(); return;
      }
      var k = b.getAttribute('data-key'), it = HUB[k]; if (!it) return;
      var v = Math.max(0, parseInt(document.getElementById('hq_' + k).value, 10) || 0);
      var rid = openRoundFor(k);
      try {
        if (!rid){
          if (!v){ toast(t('hubNeedQty')); return; }
          rid = 's' + Date.now();
          var o = { name: it.name, nameKr: it.nameKr || '', barcode: it.barcode || '', caseSize: +it.caseSize || 0, lead: 'HOLLYWOOD',
                    vendor: it.vendorName || it.vendor || '', vendorCode: it.pid || '', image: it.image || '', itemKey: k, hub: true,
                    unitCost: 0, memo: '', status: 'open', createdBy: meName(), createdAt: Date.now(), createdDay: today() };
          await api('shareOrders/' + rid, 'PUT', o);
          DATA[rid] = o;
        }
      } catch(e){ failToast(e); return; }
      await act('want', rid, v);
      toast(t('hubRequested'));
    });
  });
}
function render(){
  if (TAB === 'hub'){ renderHub(); return; }
  var ids = Object.keys(DATA).filter(function(id){
    var s = DATA[id] && DATA[id].status;
    return TAB === 'open' ? (s === 'open' || s === 'ordered' || s === 'shipping') : (s === 'done' || s === 'cancelled');
  }).sort(function(a, b){ return (DATA[b].createdAt || 0) - (DATA[a].createdAt || 0); });
  if (TAB === 'done') ids = ids.slice(0, 40);
  var list = document.getElementById('list');
  if (!ids.length){ list.innerHTML = '<div class="empty">' + t(TAB === 'open' ? 'emptyOpen' : 'emptyDone') + '</div>'; return; }
  list.innerHTML = ids.map(function(id){ return cardHtml(id, DATA[id]); }).join('');
  list.querySelectorAll('[data-act]').forEach(function(b){
    b.addEventListener('click', function(){ act(b.getAttribute('data-act'), b.getAttribute('data-id')); });
  });
}
function cardHtml(id, o){
  var sum = wantSum(o), cs = +o.caseSize || 0;
  var pct = cs ? Math.min(100, Math.round(sum / cs * 100)) : 0;
  var diff = cs - sum;
  var prog = diff > 0 ? t('left', { n: diff }) : diff < 0 ? t('over', { n: -diff }) : '✓';
  var wants = BRANCHES.map(function(b){
    var w = (o.wants || {})[b.id]; var q = w ? +w.qty || 0 : 0;
    if (!q && b.id !== o.lead && b.id !== MYB) return '';
    var got = o.received && o.received[b.id];
    var cls = 'want' + (b.id === MYB ? ' me' : '') + (b.id === o.lead ? ' lead' : '') + (got ? ' got' : '');
    return '<span class="' + cls + '">' + (b.id === o.lead ? '📦 ' : '') + esc(bl(b.id)) + ' ' + q + (got ? ' ✓' : '') + '</span>';
  }).join('');
  var h = '<div class="card' + (o.status === 'open' && sum >= cs && cs ? ' full' : '') + '">';
  h += '<div class="ttl">' +
       (o.image ? '<img src="' + esc(o.image) + '" alt="" loading="lazy" style="width:44px;height:44px;object-fit:contain;border-radius:8px;background:#f8fafc;border:1px solid var(--line);flex:none" onerror="this.style.display=\'none\'">' : '') +
       '<b>' + esc(o.name) + '</b>' + (o.hub ? '<span class="chip st-open" style="background:#ecfdf5;color:#166534">' + t('hubChip') + '</span>' : '') +
       '<span class="chip st-' + esc(o.status) + '">' + t('st_' + o.status) + '</span></div>';
  h += '<div class="meta">' + t('caseOf', { n: cs }) + ' · ' + t('leadIs', { b: esc(bl(o.lead)) }) +
       (o.vendor ? ' · 🏬 ' + esc(o.vendor) : '') + (o.barcode ? ' · 🏷 ' + esc(o.barcode) : '') +
       (o.memo ? '<br>📝 ' + esc(o.memo) : '') + '<br>' + esc(o.createdBy || '') + ' · ' + esc(o.createdDay || '') + '</div>';
  h += '<div class="prog"><div class="bar"><div class="f' + (diff < 0 ? ' over' : '') + '" style="width:' + pct + '%"></div></div><span>' +
       t('filled', { a: sum, n: cs }) + ' · ' + prog + '</span></div>';
  h += '<div class="wants">' + wants + '</div>';
  if (o.status === 'open'){
    var mine = ((o.wants || {})[MYB] || {}).qty || '';
    h += '<div class="myrow"><span style="font-size:.8em;font-weight:800">' + esc(bl(MYB)) + ' — ' + t('myQty') + '</span>' +
         '<input type="number" min="0" inputmode="numeric" id="q_' + esc(id) + '" value="' + esc(mine) + '">' +
         '<button class="btn g" data-act="want" data-id="' + esc(id) + '">' + t('save') + '</button></div>';
  }
  h += '<div class="acts">';
  if (o.status === 'open')     h += '<button class="btn b" data-act="ordered" data-id="' + esc(id) + '">' + t('btnOrdered') + '</button>';
  if (o.status === 'ordered')  h += '<button class="btn p" data-act="arrived" data-id="' + esc(id) + '">' + t('btnArrived') + '</button>';
  if (o.status === 'shipping' && MYB !== o.lead && ((o.wants || {})[MYB] || {}).qty > 0 && !(o.received || {})[MYB])
                               h += '<button class="btn g" data-act="got" data-id="' + esc(id) + '">' + t('btnGot') + '</button>';
  if (o.status === 'open' || o.status === 'ordered') h += '<button class="btn ghost" data-act="cancel" data-id="' + esc(id) + '">' + t('btnCancel') + '</button>';
  if (o.status === 'done' || o.status === 'cancelled') h += '<button class="btn" data-act="again" data-id="' + esc(id) + '">' + t('btnAgain') + '</button>';
  if (+o.unitCost > 0 && sum > 0) h += '<button class="btn" data-act="copy" data-id="' + esc(id) + '">' + t('btnCopy') + '</button>';
  // 낱개 원가 — 경유 품목은 주문 앱 가격만으론 낱개 원가를 알 수 없어, 헐리우드(주문 지점)나 임원이 넣는다
  if ((isExec() || MYB === o.lead) && o.status !== 'cancelled')
    h += '<button class="btn" data-act="cost" data-id="' + esc(id) + '">' + t('costSet') + (+o.unitCost > 0 ? ' $' + (+o.unitCost).toFixed(2) : '') + '</button>';
  h += '</div>';
  if (+o.unitCost > 0 && sum > 0){
    h += '<div class="cost"><b>' + t('costTitle') + '</b> ($' + (+o.unitCost).toFixed(2) + ')<table>' +
      costRows(o).map(function(r){ return '<tr><td>' + esc(bl(r.b)) + '</td><td class="r">' + r.q + ' × $' + (+o.unitCost).toFixed(2) + '</td><td class="r">$' + r.amt.toFixed(2) + '</td></tr>'; }).join('') +
      '</table></div>';
  }
  return h + '</div>';
}
// 원가 나누기 — 박스를 다 못 채우고 주문했으면 남는 개수는 주문 지점 몫
function costRows(o){
  var cs = +o.caseSize || 0, c = +o.unitCost || 0, rows = [], sum = 0;
  BRANCHES.forEach(function(b){ var q = +(((o.wants || {})[b.id] || {}).qty || 0); if (q){ rows.push({ b: b.id, q: q }); sum += q; } });
  if (cs > sum){ var lead = rows.filter(function(r){ return r.b === o.lead; })[0]; if (lead) lead.q += cs - sum; else rows.push({ b: o.lead, q: cs - sum }); }
  rows.forEach(function(r){ r.amt = Math.round(r.q * c * 100) / 100; });
  return rows;
}
async function act(a, id, val){
  var o = DATA[id]; if (!o) return;
  try {
    if (a === 'want'){
      // val = 🏬 경유 품목 탭에서 넘어온 개수 / 없으면 회차 카드의 입력칸
      var v = (val != null) ? Math.max(0, parseInt(val, 10) || 0) : Math.max(0, parseInt(document.getElementById('q_' + id).value, 10) || 0);
      // 다른 지점이 방금 넣은 숫자까지 알아야 "1박스가 막 찼다"를 정확히 잡는다 → 서버에서 다시 읽는다
      var fresh = await api('shareOrders/' + id);
      if (fresh){ o = fresh; DATA[id] = fresh; }
      var before = wantSum(o);
      var hadMine = !!(((o.wants || {})[MYB] || {}).qty);
      if (v) await api('shareOrders/' + id + '/wants/' + MYB, 'PUT', { qty: v, by: meName(), at: today() });
      else   await api('shareOrders/' + id + '/wants/' + MYB, 'DELETE');
      o.wants = o.wants || {}; if (v) o.wants[MYB] = { qty: v, by: meName(), at: today() }; else delete o.wants[MYB];
      // 🏬 경유 품목은 박스가 안 차도 헐리우드가 수시로 주문한다 → 새 요청이 들어올 때마다 담당자에게 알린다
      if (o.hub && v && !hadMine && MYB !== o.lead){
        var owner = HUB_CFG.hubOwner ? ' @' + HUB_CFG.hubOwner : '';
        postChat('🏬 헐리우드 경유 요청 / Hub request — ' + bl(MYB) + ' ' + v + '개' + owner + '\n' +
                 '📦 ' + o.name + (o.vendor ? ' · 🏬 ' + o.vendor : '') + (o.vendorCode ? ' #' + o.vendorCode : '') + '\n' +
                 '지금 합계 / total ' + wantSum(o) + (+o.caseSize ? ' / ' + o.caseSize : '') + ' — ' + meName(),
                 { kind:'hub_request', id: id }).catch(function(){});
      }
      var after = wantSum(o), cs = +o.caseSize || 0;
      // 1박스가 막 찼으면 주문 지점이 알 수 있게 방에 알린다 (발주는 지점별로 각자 하므로)
      if (cs && before < cs && after >= cs){
        postChat('🤝 공동 오더 모집 완료 — ' + bl(o.lead) + ' 지점 주문해주세요 / Shared order full — ' + bl(o.lead) + ' please order' +
                 (o.hub && HUB_CFG.hubOwner ? ' @' + HUB_CFG.hubOwner : '') + '\n' +
                 '📦 ' + o.name + ' · 1박스 ' + cs + '개' + (o.vendor ? ' · 🏬 ' + o.vendor : '') + '\n' +
                 BRANCHES.filter(function(b){ return ((o.wants || {})[b.id] || {}).qty; }).map(function(b){ return bl(b.id) + ' ' + o.wants[b.id].qty; }).join(' · '),
                 { kind:'share_full', id: id }).catch(function(){});
      }
      toast(t('saved'));
    } else if (a === 'ordered'){
      var left = (+o.caseSize || 0) - wantSum(o);
      if (left > 0 && !confirm(t('askOrderNotFull', { n: left }))) return;
      await api('shareOrders/' + id, 'PATCH', { status:'ordered', orderedBy: meName(), orderedAt: Date.now() });
    } else if (a === 'arrived'){
      var ship = BRANCHES.filter(function(b){ return b.id !== o.lead && +(((o.wants || {})[b.id] || {}).qty || 0) > 0; });
      var listTxt = ship.length ? ship.map(function(b){ return '➡️ ' + bl(b.id) + ' ' + o.wants[b.id].qty; }).join('\n') : t('nobody');
      if (!confirm(t('askArrived', { list: listTxt }))) return;
      await api('shareOrders/' + id, 'PATCH', { status: ship.length ? 'shipping' : 'done', arrivedBy: meName(), arrivedAt: Date.now() });
      if (ship.length){
        // 기존 🚚 LASOLAS TRUCKING 흐름과 같은 머리말 — 기사가 늘 보던 모양 그대로
        await postChat('🚚 LASOLAS TRUCKING — 🤝 공동 오더 배송 / Shared order delivery\n' +
                       '📦 ' + o.name + ' (1박스 ' + o.caseSize + '개) · ' + bl(o.lead) + ' 입고 / from ' + bl(o.lead) + '\n' +
                       ship.map(function(b){ return '• ' + bl(b.id) + ' ' + o.wants[b.id].qty + '개'; }).join('\n') +
                       '\n— ' + meName(), { kind:'share_ship', id: id }).catch(function(e){ console.warn('[share chat]', e); });
      }
    } else if (a === 'got'){
      await api('shareOrders/' + id + '/received/' + MYB, 'PUT', { by: meName(), at: Date.now() });
      o.received = o.received || {}; o.received[MYB] = { by: meName(), at: Date.now() };
      var need = BRANCHES.filter(function(b){ return b.id !== o.lead && +(((o.wants || {})[b.id] || {}).qty || 0) > 0; });
      if (need.every(function(b){ return o.received[b.id]; })) await api('shareOrders/' + id, 'PATCH', { status:'done', doneAt: Date.now() });
    } else if (a === 'cancel'){
      if (!confirm(t('askCancel'))) return;
      await api('shareOrders/' + id, 'PATCH', { status:'cancelled', cancelledBy: meName(), cancelledAt: Date.now() });
    } else if (a === 'again'){
      var nid = 's' + Date.now();
      await api('shareOrders/' + nid, 'PUT', { name:o.name, barcode:o.barcode || '', caseSize:o.caseSize, lead:o.lead, vendor:o.vendor || '',
        unitCost:o.unitCost || 0, memo:o.memo || '', status:'open', createdBy: meName(), createdAt: Date.now(), createdDay: today(), prevId: id });
      TAB = 'open'; setTabs();
    } else if (a === 'cost'){
      var c = prompt(t('costAsk'), o.unitCost ? String(o.unitCost) : '');
      if (c === null) return;
      await api('shareOrders/' + id, 'PATCH', { unitCost: Math.max(0, parseFloat(c) || 0) });
    } else if (a === 'copy'){
      var txt = '🤝 ' + o.name + ' — ' + t('costTitle') + ' ($' + (+o.unitCost).toFixed(2) + ')\n' +
        costRows(o).map(function(r){ return bl(r.b) + '\t' + r.q + '\t$' + r.amt.toFixed(2); }).join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast(t('copied')); }, function(){ prompt('', txt); });
      else prompt('', txt);
      return;
    }
  } catch(e){ failToast(e); return; }
  await load();
}

function openForm(pre){
  pre = pre || {};
  var ov = document.createElement('div'); ov.className = 'ov';
  var opts = BRANCHES.map(function(b){ return '<option value="' + b.id + '"' + ((pre.lead || MYB) === b.id ? ' selected' : '') + '>' + esc(bl(b.id)) + '</option>'; }).join('');
  ov.innerHTML = '<div class="modal"><h3>🤝 ' + t('f_title') + '</h3>' +
    '<label>' + t('f_name') + '</label><input id="fName" value="' + esc(pre.name || '') + '">' +
    '<label>' + t('f_bc') + '</label><input id="fBc" inputmode="numeric" value="' + esc(pre.bc || '') + '">' +
    '<label>' + t('f_case') + '</label><input id="fCase" type="number" min="1" inputmode="numeric" value="' + esc(pre.cs || '') + '">' +
    '<label>' + t('f_lead') + '</label><select id="fLead">' + opts + '</select><div class="hint">' + t('f_leadHint') + '</div>' +
    '<label>' + t('f_vendor') + '</label><input id="fVendor" value="' + esc(pre.vendor || '') + '">' +
    '<label>' + t('f_cost') + '</label><input id="fCost" type="number" step="0.01" min="0" inputmode="decimal" value="' + esc(pre.cost || '') + '"><div class="hint">' + t('f_costHint') + '</div>' +
    '<label>' + t('f_memo') + '</label><input id="fMemo" value="' + esc(pre.memo || '') + '">' +
    '<div class="acts" style="margin-top:14px"><button class="btn" id="fClose">' + t('f_cancel') + '</button><button class="btn g" id="fOk" style="flex:1">' + t('f_create') + '</button></div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e){ if (e.target === ov) ov.remove(); });
  ov.querySelector('#fClose').onclick = function(){ ov.remove(); };
  ov.querySelector('#fOk').onclick = async function(){
    var name = ov.querySelector('#fName').value.trim(), cs = parseInt(ov.querySelector('#fCase').value, 10) || 0;
    if (!name || !cs){ toast(t('f_need')); return; }
    var id = 's' + Date.now();
    try {
      await api('shareOrders/' + id, 'PUT', {
        name: name, barcode: ov.querySelector('#fBc').value.trim(), caseSize: cs, lead: ov.querySelector('#fLead').value,
        vendor: ov.querySelector('#fVendor').value.trim(), unitCost: parseFloat(ov.querySelector('#fCost').value) || 0,
        memo: ov.querySelector('#fMemo').value.trim(), status: 'open',
        createdBy: meName(), createdAt: Date.now(), createdDay: today()
      });
    } catch(e){ failToast(e); return; }
    ov.remove(); TAB = 'open'; setTabs(); await load();
  };
}

function setTabs(){
  document.getElementById('tabHub').classList.toggle('on', TAB === 'hub');
  document.getElementById('tabOpen').classList.toggle('on', TAB === 'open');
  document.getElementById('tabDone').classList.toggle('on', TAB === 'done');
}
function applyLang(){
  document.documentElement.lang = lang;
  document.getElementById('tTitle').textContent = t('title');
  document.getElementById('tSub').textContent = t('sub');
  document.getElementById('tMyBranch').textContent = t('myBranch');
  document.getElementById('btnNew').textContent = t('newBtn');
  document.getElementById('tabHub').textContent = t('tabHub');
  document.getElementById('tabOpen').textContent = t('tabOpen');
  document.getElementById('tabDone').textContent = t('tabDone');
  document.querySelectorAll('[data-l]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-l') === lang); });
  var sel = document.getElementById('myBranch');
  sel.innerHTML = BRANCHES.map(function(b){ return '<option value="' + b.id + '"' + (b.id === MYB ? ' selected' : '') + '>' + esc(bl(b.id)) + '</option>'; }).join('');
  render();
}
document.querySelectorAll('[data-l]').forEach(function(b){
  b.addEventListener('click', function(){ lang = b.getAttribute('data-l'); try { localStorage.setItem('kimchi_lang', lang); } catch(e){} applyLang(); });
});
document.getElementById('myBranch').addEventListener('change', function(){ MYB = this.value; try { localStorage.setItem('share.myBranch', MYB); } catch(e){} render(); });
document.getElementById('btnNew').onclick = function(){ openForm(); };
document.getElementById('tabHub').onclick = function(){ TAB = 'hub'; setTabs(); render(); };
document.getElementById('tabOpen').onclick = function(){ TAB = 'open'; setTabs(); render(); };
document.getElementById('tabDone').onclick = function(){ TAB = 'done'; setTabs(); render(); };

// 주문 앱의 [🏬 헐리우드에 요청]에서 오면 (?hub=벤더__품번&from=지점) 그 품목을 연 채로
var qs = new URLSearchParams(location.search);
if (qs.get('from') && BRANCHES.some(function(b){ return b.id === qs.get('from'); })){
  MYB = qs.get('from'); try { localStorage.setItem('share.myBranch', MYB); } catch(e){}
}
if (qs.get('hub')){ TAB = 'hub'; FOCUS = qs.get('hub'); }
setTabs();
applyLang();
// 유통기한 앱 "🤝 나눠 받기 후보" 에서 넘어오면 바로 만들기 창 (?new=1&name=…&bc=…)
if (qs.get('new')) openForm({ name: qs.get('name') || '', bc: qs.get('bc') || '', cost: qs.get('cost') || '' });
load();
window.addEventListener('fb-auth-ready', load);          // 로그인 토큰이 늦게 복원되면 다시 불러온다
// 1분마다 다른 지점 입력을 반영 — 단, 숫자를 입력하는 중이면 지우지 않게 건너뛴다
setInterval(function(){
  var a = document.activeElement;
  if (document.hidden || document.querySelector('.ov') || (a && a.tagName === 'INPUT')) return;
  load();
}, 60000);
})();
</script>
</body>
</html>
