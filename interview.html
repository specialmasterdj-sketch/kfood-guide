<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KIMCHI MART — Video Interview</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a5c3a">
<!-- 🎤 2026-11-20 사장님: HR 매니저 다니엘이 외부 누구와도 빠르고 신뢰감 있게 화상 인터뷰.
     외부 지원자가 여는 공개 안내 페이지 — 앱 로그인·auth-gate 없음, 데이터베이스 읽기·쓰기 없음.
     링크에 담긴 값(인터뷰 코드·이름·시간·직무)만 화면에 보여 주고, [인터뷰 입장]은 그 코드의 전용 방을 연다.
     방 이름 = KimchiMart-Interview-{코드} (코드는 다니엘 화면에서 무작위 생성 → 추측 불가). -->
<style>
:root{--brand:#1a5c3a;--brand2:#15803d;--ink:#0f172a;--sub:#64748b;--line:#e5e7eb;--bg:#f6f8f7;--card:#fff;--warn:#b45309}
@media (prefers-color-scheme: dark){:root{--ink:#e5e7eb;--sub:#94a3b8;--line:#334155;--bg:#0b1210;--card:#111c18}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI','Malgun Gothic',-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:16px}
.wrap{max-width:560px;margin:0 auto}
.hd{background:linear-gradient(135deg,#1a5c3a,#15803d);color:#fff;border-radius:18px;padding:22px 20px;text-align:center;box-shadow:0 6px 24px rgba(21,128,61,.25)}
.hd img{height:44px;width:auto;filter:brightness(0) invert(1);display:block;margin:0 auto 10px}
.hd h1{font-size:1.35em;font-weight:900;letter-spacing:-.01em}
.hd p{font-size:.92em;opacity:.92;margin-top:6px}
.langs{display:flex;gap:6px;justify-content:center;margin:12px 0 0}
.langs button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.8em;cursor:pointer;font-family:inherit}
.langs button.on{background:#fff;color:#15803d}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:14px}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .ic{font-size:1.3em;width:28px;text-align:center;flex:none}
.row .k{font-size:.78em;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.row .v{font-size:1.02em;font-weight:800;margin-top:2px;word-break:break-word}
.go{display:block;width:100%;background:#1d4ed8;color:#fff;border:0;border-radius:14px;padding:16px;font-size:1.1em;font-weight:900;cursor:pointer;font-family:inherit;margin-top:16px;box-shadow:0 4px 14px rgba(29,78,216,.3)}
.go:active{transform:scale(.99)}
.tips{font-size:.88em;line-height:1.6;color:var(--sub)}
.tips li{margin:4px 0 4px 18px}
.note{font-size:.84em;line-height:1.55;border-left:4px solid #f59e0b;background:rgba(245,158,11,.08);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:12px}
.bad{text-align:center;padding:30px 10px;color:var(--sub)}
.ft{text-align:center;font-size:.78em;color:var(--sub);margin:18px 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <img src="./pwa-assets/kimchi-text-logo.png?v=2" alt="KIMCHI MART" onerror="this.style.display='none'">
    <h1 id="tTitle"></h1>
    <p id="tSub"></p>
    <div class="langs"><button data-l="en">EN</button><button data-l="es">ES</button><button data-l="ko">KO</button></div>
  </div>
  <div id="main"></div>
  <div class="ft">KIMCHI MART · Human Resources · South Florida</div>
</div>
<script>
(function(){
  const T = {
    title:{en:'Video Interview',es:'Entrevista por video',ko:'화상 인터뷰'},
    sub:{en:'You are invited to a video interview with KIMCHI MART',es:'Está invitado(a) a una entrevista por video con KIMCHI MART',ko:'KIMCHI MART 화상 인터뷰에 초대되셨습니다'},
    cand:{en:'Candidate',es:'Candidato(a)',ko:'지원자'},
    pos:{en:'Position',es:'Puesto',ko:'지원 직무'},
    when:{en:'Date & time',es:'Fecha y hora',ko:'일시'},
    with_:{en:'Interviewer',es:'Entrevistador',ko:'면접관'},
    withV:{en:'Daniel Banos — HR Manager, KIMCHI MART',es:'Daniel Banos — Gerente de RH, KIMCHI MART',ko:'Daniel Banos — KIMCHI MART HR 매니저'},
    join:{en:'🎥  Join the interview',es:'🎥  Entrar a la entrevista',ko:'🎥  인터뷰 입장'},
    tipsH:{en:'Before you join',es:'Antes de entrar',ko:'입장 전 확인'},
    tips:{en:['No app or account needed — it opens in your browser (Chrome or Safari).','Allow camera and microphone when your browser asks.','Find a quiet, well-lit place. Headphones help.','Please join 2–3 minutes early.'],
          es:['No necesita app ni cuenta — se abre en su navegador (Chrome o Safari).','Permita la cámara y el micrófono cuando el navegador lo pida.','Busque un lugar tranquilo y con buena luz. Los audífonos ayudan.','Por favor entre 2–3 minutos antes.'],
          ko:['앱 설치·가입 없이 브라우저(크롬·사파리)에서 바로 열립니다.','브라우저가 카메라·마이크 허용을 물으면 [허용]을 눌러 주세요.','조용하고 밝은 곳에서 접속해 주세요. 이어폰이 있으면 좋습니다.','2~3분 일찍 입장해 주세요.']},
    rec:{en:'This interview is not recorded. Florida law requires everyone\'s consent before any recording.',es:'Esta entrevista no se graba. La ley de Florida exige el consentimiento de todos antes de cualquier grabación.',ko:'이 인터뷰는 녹화하지 않습니다. 플로리다 법상 녹화는 참여자 모두의 동의가 있어야 합니다.'},
    bad:{en:'This interview link is not valid. Please check the link you received, or contact KIMCHI MART HR.',es:'Este enlace no es válido. Revise el enlace recibido o contacte a RH de KIMCHI MART.',ko:'올바르지 않은 인터뷰 링크입니다. 받으신 링크를 확인하시거나 KIMCHI MART HR 에 문의해 주세요.'},
    et:{en:'Eastern Time',es:'hora del Este',ko:'미 동부 시간'},
  };
  const q = new URLSearchParams(location.search);
  const code = String(q.get('c') || '');
  const ok = /^[A-Za-z0-9]{8,24}$/.test(code);
  const clip = (s, n) => String(s || '').replace(/[\u0000-\u001f]/g, '').slice(0, n);
  const name = clip(q.get('n'), 80), pos = clip(q.get('p'), 80), when = clip(q.get('t'), 40);
  let L = (q.get('l') || (navigator.language || 'en')).slice(0, 2).toLowerCase();
  if (!T.title[L]) L = 'en';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function fmtWhen(){
    if (!when) return '';
    const d = new Date(when);
    if (isNaN(d)) return when;
    const loc = {en:'en-US',es:'es-US',ko:'ko-KR'}[L];
    try {
      return d.toLocaleString(loc, {timeZone:'America/New_York', weekday:'long', month:'long', day:'numeric', hour:'numeric', minute:'2-digit'}) + ' (' + T.et[L] + ')';
    } catch(e){ return d.toString(); }
  }
  function roomUrl(){
    const dn = name || 'Candidate';
    return 'https://meet.ffmuc.net/KimchiMart-Interview-' + code +
      '#config.prejoinConfig.enabled=true&config.disableDeepLinking=true&config.startWithVideoMuted=false' +
      '&userInfo.displayName=' + encodeURIComponent(JSON.stringify(dn));
  }
  function render(){
    document.documentElement.lang = L;
    document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === L));
    document.getElementById('tTitle').textContent = T.title[L];
    document.getElementById('tSub').textContent = T.sub[L];
    const m = document.getElementById('main');
    if (!ok){ m.innerHTML = '<div class="card bad">' + esc(T.bad[L]) + '</div>'; return; }
    const rows = [];
    if (name) rows.push(['👤', T.cand[L], name]);
    if (pos)  rows.push(['💼', T.pos[L], pos]);
    if (when) rows.push(['🗓', T.when[L], fmtWhen()]);
    rows.push(['🤝', T.with_[L], T.withV[L]]);
    m.innerHTML =
      '<div class="card">' + rows.map(r => '<div class="row"><div class="ic">' + r[0] + '</div><div><div class="k">' + esc(r[1]) + '</div><div class="v">' + esc(r[2]) + '</div></div></div>').join('') +
      '<button class="go" id="go">' + esc(T.join[L]) + '</button>' +
      '<div class="note">🔒 ' + esc(T.rec[L]) + '</div></div>' +
      '<div class="card"><div class="k" style="font-weight:900;margin-bottom:6px">' + esc(T.tipsH[L]) + '</div><ul class="tips">' +
      T.tips[L].map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
    document.getElementById('go').onclick = () => { location.href = roomUrl(); };
  }
  document.querySelectorAll('.langs button').forEach(b => b.onclick = () => { L = b.dataset.l; render(); });
  render();
})();
</script>
</body>
</html>
