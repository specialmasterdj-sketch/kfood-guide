<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗂 직원 기록 카드</title>
<script type="module" src="./fb-auth-fetch.js?v=1"></script>
<script type="module" src="./auth-gate.js?v=5"></script>
<style>
  :root{ --green:#1a5c3a; --lgreen:#e8f5ee; --gold:#f59e0b; --lgold:#fef3c7; --gray:#f1f5f9; --bd:#e2e8f0; }
  *{ box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif; }
  body{ background:#f6f8f7; color:#1e293b; }
  .top{ background:var(--green); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .top h1{ font-size:1.15em; font-weight:800; }
  .top select{ border:0; border-radius:8px; padding:8px 12px; font-weight:700; font-size:.95em; }
  .wrap{ max-width:1080px; margin:0 auto; padding:16px; }
  .emp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-top:10px; }
  .emp-chip{ background:#fff; border:1.5px solid var(--bd); border-radius:12px; padding:12px 14px; cursor:pointer; font-weight:700; display:flex; align-items:center; gap:9px; transition:.15s; }
  .emp-chip:hover{ border-color:var(--green); background:var(--lgreen); }
  .emp-chip .av{ width:32px; height:32px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.85em; flex-shrink:0; }
  .emp-chip small{ display:block; font-weight:600; color:#64748b; font-size:.78em; }
  .card{ background:#fff; border:1.5px solid var(--bd); border-radius:16px; margin-top:14px; overflow:hidden; }
  .card h2{ background:var(--green); color:#fff; font-size:.98em; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; }
  .card h2 .h-act{ display:flex; gap:8px; }
  .sec{ padding:12px 14px; }
  table{ width:100%; border-collapse:collapse; font-size:.88em; }
  th{ background:var(--lgreen); color:var(--green); font-weight:800; padding:7px 8px; text-align:left; border:1px solid var(--bd); font-size:.86em; }
  td{ padding:7px 8px; border:1px solid var(--bd); vertical-align:top; }
  tr.auto td{ background:#fffdf3; }
  .pill{ display:inline-block; border-radius:10px; padding:2px 8px; font-size:.8em; font-weight:800; }
  .pill.star{ background:var(--lgold); color:#92400e; }
  .pill.warn{ background:#fee2e2; color:#b91c1c; }
  .pill.rev{ background:#dbeafe; color:#1d4ed8; }
  .btn{ background:var(--green); color:#fff; border:0; border-radius:9px; padding:9px 14px; font-weight:800; font-size:.88em; cursor:pointer; }
  .btn.sec2{ background:#fff; color:var(--green); border:1.5px solid var(--green); }
  .btn.small{ padding:5px 10px; font-size:.8em; }
  .btn.danger{ background:#fff; color:#dc2626; border:1px solid #fecaca; padding:3px 8px; font-size:.76em; border-radius:7px; }
  .addrow{ display:flex; gap:7px; flex-wrap:wrap; margin-top:9px; align-items:center; }
  .addrow input, .addrow select, .addrow textarea{ border:1.5px solid var(--bd); border-radius:8px; padding:8px 10px; font-size:.88em; background:#fffde7; }
  .addrow input:focus, .addrow textarea:focus{ outline:2px solid var(--green); }
  .profile-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:9px; }
  .pf label{ display:block; font-size:.76em; font-weight:800; color:#64748b; margin-bottom:3px; }
  .pf input{ width:100%; border:1.5px solid var(--bd); border-radius:8px; padding:8px 10px; font-size:.9em; background:#fffde7; }
  .muted{ color:#94a3b8; font-size:.84em; padding:8px 2px; }
  .backbar{ display:flex; align-items:center; gap:10px; margin-top:4px; flex-wrap:wrap; }
  .backbar .nm{ font-size:1.25em; font-weight:900; color:var(--green); }
  .notice{ background:var(--lgold); border:1.5px solid var(--gold); border-radius:12px; padding:10px 14px; font-size:.86em; font-weight:600; color:#92400e; margin-top:12px; }
  #gateBlock{ display:none; position:fixed; inset:0; background:#f6f8f7; z-index:9999; align-items:center; justify-content:center; text-align:center; padding:30px; }
  @media print{
    .top, .addrow, .btn, .backbar .btn, .notice, #empPick{ display:none !important; }
    .card{ border:1px solid #999; break-inside:avoid; }
    body{ background:#fff; }
  }
</style>
</head>
<body>
<div id="gateBlock"><div>
  <div style="font-size:3em">🔒</div>
  <h2 style="margin:10px 0 6px">직원 기록 카드</h2>
  <p style="color:#64748b">사장님·전무님 전용 앱입니다.<br>채팅 앱에서 본인 이름(DJ / B.H.K)으로 로그인된 브라우저에서 열어주세요.</p>
</div></div>

<div class="top">
  <h1>🗂 직원 기록 카드</h1>
  <select id="branchSel"></select>
  <span style="flex:1"></span>
  <span style="font-size:.8em;opacity:.85">사장님·전무님 전용 · 평가/상점/리뷰 자동 연동</span>
</div>

<div class="wrap">
  <!-- 직원 선택 -->
  <div id="empPick">
    <div class="notice">직원을 선택하면 기록 카드가 열립니다. ⭐ 상점·구글리뷰 기록은 자동으로 쌓여요 — 시급·평가·면담은 여기서 직접 추가하면 클라우드에 저장됩니다 (모든 기기에서 동일하게 보임).</div>
    <div class="emp-grid" id="empGrid"><div class="muted">직원 명단 불러오는 중…</div></div>
  </div>

  <!-- 카드 -->
  <div id="cardView" style="display:none">
    <div class="backbar">
      <button class="btn sec2" onclick="backToList()">← 목록</button>
      <span class="nm" id="cardName"></span>
      <span class="pill star" id="cardBranch"></span>
      <span style="flex:1"></span>
      <button class="btn sec2" onclick="window.print()">🖨 인쇄 / PDF</button>
    </div>

    <div class="card"><h2>① 인적 사항 <span class="h-act"><button class="btn small" style="background:#fff;color:var(--green)" onclick="saveProfile()">💾 저장</button></span></h2>
      <div class="sec profile-grid" id="profileGrid"></div>
    </div>

    <div class="card"><h2>② 직급 · 시급 이력</h2>
      <div class="sec">
        <table id="wageTbl"></table>
        <div class="addrow">
          <input id="wDate" type="date" style="width:140px">
          <input id="wRole" placeholder="직급" style="width:130px">
          <input id="wPay" placeholder="시급 $" style="width:90px">
          <input id="wPct" placeholder="인상률 %" style="width:90px">
          <input id="wWhy" placeholder="사유 (평가 A등급, 승진 등)" style="flex:1;min-width:160px">
          <button class="btn" onclick="addWage()">＋ 추가</button>
        </div>
      </div>
    </div>

    <div class="card"><h2>③ 분기 평가 이력</h2>
      <div class="sec">
        <table id="evalTbl"></table>
        <div class="addrow">
          <input id="ePeriod" placeholder="기간 (2026 2분기)" style="width:140px">
          <input id="eTotal" placeholder="총점" style="width:70px">
          <input id="eGrade" placeholder="등급" style="width:60px">
          <input id="eSales" placeholder="매출항목(30)" style="width:100px">
          <input id="eCmt" placeholder="핵심 코멘트" style="flex:1;min-width:150px">
          <button class="btn" onclick="addEval()">＋ 추가</button>
        </div>
      </div>
    </div>

    <div class="card"><h2>④ 상벌 기록 <span style="font-size:.75em;font-weight:600;opacity:.9">⭐상점·구글리뷰 = 자동</span></h2>
      <div class="sec">
        <table id="meritTbl"></table>
        <div class="addrow">
          <input id="nDate" type="date" style="width:140px">
          <select id="nType" style="width:110px"><option value="warn">⚠ 경고</option><option value="praise">⭐ 칭찬(수동)</option></select>
          <input id="nTxt" placeholder="내용" style="flex:1;min-width:180px">
          <input id="nAct" placeholder="조치/포인트" style="width:120px">
          <button class="btn" onclick="addNote()">＋ 추가</button>
        </div>
      </div>
    </div>

    <div class="card"><h2>⑤ 면담 기록</h2>
      <div class="sec">
        <table id="talkTbl"></table>
        <div class="addrow">
          <input id="tDate" type="date" style="width:140px">
          <input id="tTxt" placeholder="내용 요약 (잘한 점 2 · 개선점 1 · 직원 의견)" style="flex:1;min-width:220px">
          <input id="tNext" placeholder="후속 조치" style="width:180px">
          <button class="btn" onclick="addTalk()">＋ 추가</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getDatabase, ref, get, set, push, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
  const cfg = { apiKey:"AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4", authDomain:"kimchi-mart-order.firebaseapp.com", databaseURL:"https://kimchi-mart-order-default-rtdb.firebaseio.com", projectId:"kimchi-mart-order", storageBucket:"kimchi-mart-order.firebasestorage.app", appId:"1:903841418321:web:5c0d9f3e6a5a1b2c3d4e5f" };
  const app = initializeApp(cfg);
  window.__fb = { db:getDatabase(app), ref, get, set, push, remove, onValue };
  const auth = getAuth(app);
  onAuthStateChanged(auth, () => { try{ window.__hrBoot && window.__hrBoot(); }catch(e){} });
  setTimeout(() => { try{ window.__hrBoot && window.__hrBoot(); }catch(e){} }, 1600);
</script>

<script>
// ================= 기본 =================
const BRANCHES = [
  { id:'MIAMI', ko:'마이애미' }, { id:'PEMBROKE_PINES', ko:'펨브로크 파인즈' },
  { id:'HOLLYWOOD', ko:'할리우드' }, { id:'CORAL_SPRINGS', ko:'코럴 스프링스' },
  { id:'LASOLAS', ko:'라스올라스' },
];
function me(){ try{ return JSON.parse(localStorage.getItem('chat.me')||'null'); }catch(_){ return null; } }
function isAdmin(){
  const m = me(); if(!m) return false;
  const em = String(m.email||'').toLowerCase().trim();
  const key = String(m.name||'').toUpperCase().replace(/[^A-Z0-9가-힣]/g,'');
  return em==='specialmasterdj@gmail.com' || em==='byhoki64@gmail.com' || key==='DJ' || key==='BHK' || key==='비에이치케이';
}
function slug(n){ return String(n||'').toLowerCase().replace(/[.#$\[\]\/\s]+/g,'_').replace(/[^a-z0-9가-힣_]/g,'').slice(0,50); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtD(ts){ if(!ts) return ''; const d=new Date(+ts||ts); return isNaN(d)?String(ts):(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }
function tk(s){ return String(s||'').toLowerCase().split(/[^a-z0-9가-힣]+/).filter(t=>t.length>=2); }
function nameMatch(a,b){
  const ta=tk(a), tb=tk(b); if(!ta.length||!tb.length) return false;
  const na=ta.join(''), nb=tb.join(''); if(na===nb) return true;
  const [sh,lg]=ta.length<=tb.length?[ta,tb]:[tb,ta]; const S=new Set(lg);
  return sh.every(t=>S.has(t));
}
let BRANCH = localStorage.getItem('hr.branch') || 'MIAMI';
let EMP = null;      // { name, role }
let BONUS = null;    // mgrBonus cache for BRANCH
let booted = false;

window.__hrBoot = function(){
  if (booted) return;
  if (!window.__fb) return;
  booted = true;
  if (!isAdmin()){ document.getElementById('gateBlock').style.display='flex'; return; }
  const sel = document.getElementById('branchSel');
  sel.innerHTML = BRANCHES.map(b=>`<option value="${b.id}">🏢 ${b.ko}</option>`).join('');
  sel.value = BRANCH;
  sel.onchange = () => { BRANCH = sel.value; localStorage.setItem('hr.branch', BRANCH); BONUS=null; backToList(); loadRoster(); };
  loadRoster();
};

async function fbGet(path){
  const s = await window.__fb.get(window.__fb.ref(window.__fb.db, path));
  return s.exists() ? s.val() : null;
}

// ================= 직원 목록 =================
async function loadRoster(){
  const grid = document.getElementById('empGrid');
  grid.innerHTML = '<div class="muted">직원 명단 불러오는 중…</div>';
  let emps = [];
  try {
    const data = await fbGet('schedules/'+BRANCH+'/employees');
    const arr = Array.isArray(data) ? data : (data && typeof data==='object' ? Object.values(data) : []);
    emps = arr.filter(e=>e&&e.name);
  } catch(e){ grid.innerHTML = '<div class="muted">명단 로드 실패 — 로그인 상태를 확인하세요 ('+esc(e.message||e)+')</div>'; return; }
  if (!emps.length){ grid.innerHTML = '<div class="muted">이 지점 직원 명단이 없습니다</div>'; return; }
  emps.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  grid.innerHTML = emps.map(e=>{
    const ini = String(e.name).trim().charAt(0).toUpperCase();
    return `<div class="emp-chip" onclick="openCard('${esc(e.name)}','${esc(e.role||'')}')"><div class="av">${ini}</div><div>${esc(e.name)}<small>${esc(e.role||'')}</small></div></div>`;
  }).join('');
}

// ================= 카드 =================
window.openCard = async function(name, role){
  EMP = { name, role };
  document.getElementById('empPick').style.display='none';
  document.getElementById('cardView').style.display='';
  document.getElementById('cardName').textContent = name;
  const b = BRANCHES.find(x=>x.id===BRANCH);
  document.getElementById('cardBranch').textContent = (b?b.ko:BRANCH) + (role?' · '+role:'');
  renderProfile({}); renderWage({}); renderEvals({}); renderTalks({});
  document.getElementById('meritTbl').innerHTML = '<tr><td class="muted">불러오는 중…</td></tr>';
  const base = 'hr/'+BRANCH+'/'+slug(name);
  // 병렬 로드
  fbGet(base+'/profile').then(p=>renderProfile(p||{})).catch(()=>{});
  fbGet(base+'/wage').then(w=>renderWage(w||{})).catch(()=>{});
  fbGet(base+'/evals').then(v=>renderEvals(v||{})).catch(()=>{});
  fbGet(base+'/talks').then(t=>renderTalks(t||{})).catch(()=>{});
  loadMerits(name, base);
};
window.backToList = function(){
  EMP = null;
  document.getElementById('cardView').style.display='none';
  document.getElementById('empPick').style.display='';
};

// ---- ① 프로필 ----
const PF = [ ['hire','입사일'], ['dept','부서'], ['emp_type','고용 형태'], ['phone','전화'], ['emergency','비상 연락처'], ['memo','메모'] ];
function renderProfile(p){
  document.getElementById('profileGrid').innerHTML = PF.map(([k,l])=>
    `<div class="pf"><label>${l}</label><input id="pf_${k}" value="${esc(p[k]||'')}"></div>`).join('');
}
window.saveProfile = async function(){
  if (!EMP) return;
  const p = {};
  PF.forEach(([k])=>{ p[k] = document.getElementById('pf_'+k).value.trim(); });
  p.name = EMP.name; p.role = EMP.role; p.updatedAt = Date.now();
  try { await window.__fb.set(window.__fb.ref(window.__fb.db, 'hr/'+BRANCH+'/'+slug(EMP.name)+'/profile'), p); toast('💾 저장됨'); }
  catch(e){ alert('저장 실패: '+(e.message||e)+'\n(Firebase 규칙에 hr 경로 추가 필요할 수 있음)'); }
};

// ---- 공용 리스트 ----
function listRows(obj){
  return Object.entries(obj||{}).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
}
async function pushItem(kind, item){
  item.by = (me()&&me().name)||''; item.ts = Date.now();
  await window.__fb.push(window.__fb.ref(window.__fb.db, 'hr/'+BRANCH+'/'+slug(EMP.name)+'/'+kind), item);
}
async function delItem(kind, id){
  if (!confirm('이 기록을 삭제할까요?')) return;
  await window.__fb.remove(window.__fb.ref(window.__fb.db, 'hr/'+BRANCH+'/'+slug(EMP.name)+'/'+kind+'/'+id));
  refresh(kind);
}
window.delItem = delItem;
function refresh(kind){
  const base='hr/'+BRANCH+'/'+slug(EMP.name);
  if (kind==='wage') fbGet(base+'/wage').then(w=>renderWage(w||{}));
  if (kind==='evals') fbGet(base+'/evals').then(v=>renderEvals(v||{}));
  if (kind==='talks') fbGet(base+'/talks').then(t=>renderTalks(t||{}));
  if (kind==='notes') loadMerits(EMP.name, base);
}
function toast(t){
  let el=document.getElementById('__toast');
  if(!el){ el=document.createElement('div'); el.id='__toast'; el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a5c3a;color:#fff;padding:10px 20px;border-radius:12px;font-weight:800;z-index:999;box-shadow:0 8px 20px rgba(0,0,0,.25)'; document.body.appendChild(el); }
  el.textContent=t; el.style.display='';
  clearTimeout(el.__t); el.__t=setTimeout(()=>{ el.style.display='none'; },1800);
}

// ---- ② 시급 ----
function renderWage(w){
  const rows = listRows(w);
  document.getElementById('wageTbl').innerHTML =
    '<tr><th style="width:105px">적용일</th><th>직급</th><th>시급</th><th>인상률</th><th>사유</th><th style="width:56px"></th></tr>' +
    (rows.length ? rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.role)}</td><td><b>${esc(r.pay)}</b></td><td>${esc(r.pct)}</td><td>${esc(r.why)}</td><td><button class="btn danger" onclick="delItem('wage','${r.id}')">삭제</button></td></tr>`).join('')
      : '<tr><td colspan="6" class="muted">기록 없음 — 아래에서 추가</td></tr>');
}
window.addWage = async function(){
  const date=wDate.value, role=wRole.value.trim(), pay=wPay.value.trim();
  if(!date||!pay){ alert('적용일·시급은 필수'); return; }
  await pushItem('wage', { date, role, pay, pct:wPct.value.trim(), why:wWhy.value.trim() });
  wRole.value=wPay.value=wPct.value=wWhy.value=''; refresh('wage'); toast('＋ 추가됨');
};

// ---- ③ 평가 ----
function renderEvals(v){
  const rows = Object.entries(v||{}).map(([id,x])=>Object.assign({id},x)).sort((a,b)=>String(b.period||'').localeCompare(String(a.period||'')));
  document.getElementById('evalTbl').innerHTML =
    '<tr><th>평가 기간</th><th>총점</th><th>등급</th><th>매출(30)</th><th>코멘트</th><th style="width:56px"></th></tr>' +
    (rows.length ? rows.map(r=>`<tr><td>${esc(r.period)}</td><td><b>${esc(r.total)}</b></td><td><b>${esc(r.grade)}</b></td><td>${esc(r.sales)}</td><td>${esc(r.cmt)}</td><td><button class="btn danger" onclick="delItem('evals','${r.id}')">삭제</button></td></tr>`).join('')
      : '<tr><td colspan="6" class="muted">기록 없음 — 분기 평가 후 총점·등급 추가</td></tr>');
}
window.addEval = async function(){
  if(!ePeriod.value.trim()||!eTotal.value.trim()){ alert('기간·총점은 필수'); return; }
  await pushItem('evals', { period:ePeriod.value.trim(), total:eTotal.value.trim(), grade:eGrade.value.trim(), sales:eSales.value.trim(), cmt:eCmt.value.trim(), date:ePeriod.value.trim() });
  ePeriod.value=eTotal.value=eGrade.value=eSales.value=eCmt.value=''; refresh('evals'); toast('＋ 추가됨');
};

// ---- ④ 상벌 (자동 + 수동) ----
async function loadMerits(name, base){
  if (!BONUS){
    try { BONUS = await fbGet('mgrBonus/'+BRANCH) || {}; }
    catch(e){ BONUS = {}; }
  }
  const auto = Object.entries(BONUS).map(([id,a])=>Object.assign({id},a))
    .filter(a=>a && a.to && nameMatch(a.to, name))
    .map(a=>({ auto:true, date:fmtD(a.ts), type:(String(a.note||a.reason||'').includes('구글리뷰')||a.kind==='review_auto')?'rev':'star',
               txt:(a.note||a.reason||'상점'), act:'+'+(a.points||0)+'pt', by:a.by||'' }));
  let manual = [];
  try { manual = listRows(await fbGet(base+'/notes')); } catch(_){}
  const rows = auto.concat(manual.map(m=>({ id:m.id, auto:false, date:m.date, type:m.type==='warn'?'warn':'star', txt:m.txt, act:m.act, by:m.by })))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  document.getElementById('meritTbl').innerHTML =
    '<tr><th style="width:100px">날짜</th><th style="width:90px">구분</th><th>내용</th><th>조치/포인트</th><th>기록자</th><th style="width:56px"></th></tr>' +
    (rows.length ? rows.map(r=>{
      const pill = r.type==='warn' ? '<span class="pill warn">⚠ 경고</span>' : r.type==='rev' ? '<span class="pill rev">📸 리뷰</span>' : '<span class="pill star">⭐ 상점</span>';
      const del = r.auto ? '<span style="font-size:.72em;color:#94a3b8">자동</span>' : `<button class="btn danger" onclick="delItem('notes','${r.id}')">삭제</button>`;
      return `<tr${r.auto?' class="auto"':''}><td>${esc(r.date)}</td><td>${pill}</td><td>${esc(r.txt)}</td><td><b>${esc(r.act)}</b></td><td>${esc(r.by)}</td><td>${del}</td></tr>`;
    }).join('') : '<tr><td colspan="6" class="muted">기록 없음 — 상점을 주면 자동으로 여기 쌓입니다</td></tr>');
}
window.addNote = async function(){
  if(!nDate.value||!nTxt.value.trim()){ alert('날짜·내용은 필수'); return; }
  await pushItem('notes', { date:nDate.value, type:nType.value, txt:nTxt.value.trim(), act:nAct.value.trim() });
  nTxt.value=nAct.value=''; refresh('notes'); toast('＋ 추가됨');
};

// ---- ⑤ 면담 ----
function renderTalks(t){
  const rows = listRows(t);
  document.getElementById('talkTbl').innerHTML =
    '<tr><th style="width:105px">날짜</th><th>내용 요약</th><th>후속 조치</th><th>면담자</th><th style="width:56px"></th></tr>' +
    (rows.length ? rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.txt)}</td><td>${esc(r.next)}</td><td>${esc(r.by)}</td><td><button class="btn danger" onclick="delItem('talks','${r.id}')">삭제</button></td></tr>`).join('')
      : '<tr><td colspan="6" class="muted">기록 없음 — 분기 면담 후 요약 추가</td></tr>');
}
window.addTalk = async function(){
  if(!tDate.value||!tTxt.value.trim()){ alert('날짜·내용은 필수'); return; }
  await pushItem('talks', { date:tDate.value, txt:tTxt.value.trim(), next:tNext.value.trim() });
  tTxt.value=tNext.value=''; refresh('talks'); toast('＋ 추가됨');
};
</script>
