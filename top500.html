<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🏆 Top 500 재고 관리 — 김치마트</title>
<link rel="manifest" href="pwa-assets/manifest.webmanifest">
<meta name="theme-color" content="#1a5c3a">
<!-- fb-auth-fetch 먼저 — RTDB fetch 에 토큰 자동 부착. 빠지면 저장 시 401. -->
<script type="module" src="./fb-auth-fetch.js?v=2"></script>
<script type="module" src="./auth-gate.js?v=4"></script>
<script src="./nav-sidebar.js?v=20" defer></script>
<script src="./back-nav.js?v=1"></script>
<script src="./lang-sync.js?v=2" defer></script>
<!-- ZXing — iOS Safari 용 바코드 스캔. Android 는 native BarcodeDetector 사용. -->
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<link rel="stylesheet" href="./km-design.css?v=3">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f4f6f9;padding-bottom:80px;color:#0f172a}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.topbar{background:linear-gradient(135deg,#1a5c3a,#2e7d32);color:#fff;padding:18px 20px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{font-size:1.3em;font-weight:900;letter-spacing:-.01em}
.topbar .sub{font-size:.82em;opacity:.88;margin-top:2px}
.topbar .head-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.branch-pill{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-size:.86em;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.branch-pill select{background:transparent;border:0;color:#fff;font-weight:700;font-family:inherit;font-size:.95em;outline:0;cursor:pointer}
.branch-pill select option{color:#0f172a}
.lang-sw{display:inline-flex;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.32);border-radius:999px;overflow:hidden}
.lang-sw button{background:transparent;color:#fff;border:0;padding:6px 11px;font-size:.78em;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.02em}
.lang-sw button.active{background:#fff;color:#1a5c3a}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:#fff;border-radius:12px;padding:14px 12px;text-align:center;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1.5px solid transparent;cursor:pointer;transition:.15s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(15,23,42,.10)}
.kpi.active{border-color:currentColor}
.kpi .ic{font-size:1.4em;line-height:1}
.kpi .num{font-size:1.8em;font-weight:900;margin:3px 0;line-height:1.1}
.kpi .lbl{font-size:.78em;font-weight:700;opacity:.85}
.kpi.crit{color:#dc2626}
.kpi.low{color:#d97706}
.kpi.ok{color:#15803d}
.toolbar{background:#fff;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.toolbar input[type=text]{flex:1;min-width:160px;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:.94em;font-family:inherit;outline:0}
.toolbar input[type=text]:focus{border-color:#1a5c3a}
.btn{background:#1a5c3a;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:700;font-size:.86em;cursor:pointer;font-family:inherit}
.btn.sec{background:#fff;color:#1a5c3a;border:1.5px solid #1a5c3a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid #e5e7eb;color:#374151;border-radius:999px;padding:5px 12px;font-size:.82em;font-weight:700;cursor:pointer;font-family:inherit}
.chip.active{background:#1a5c3a;color:#fff;border-color:#1a5c3a}
/* Category 드롭다운 — 매장 매대 따라 스캔하기 위한 카테고리 필터 */
.cat-select-wrap{background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(15,23,42,.05);display:flex;align-items:center;gap:8px}
.cat-select-wrap label{font-size:.82em;font-weight:800;color:#475569;flex-shrink:0}
.cat-select{flex:1;padding:11px 14px;border:1.5px solid #e5e7eb;border-radius:9px;font-size:.94em;font-weight:700;font-family:inherit;color:#0f172a;background:#fff;cursor:pointer;outline:0;appearance:menulist}
.cat-select:focus{border-color:#1a5c3a;box-shadow:0 0 0 3px rgba(26,92,58,.12)}
.cat-progress{font-size:.78em;color:#1a5c3a;text-align:center;margin-bottom:8px;font-weight:700;background:#f0fdf4;border-radius:8px;padding:6px;display:none}
.cat-progress.show{display:block}
.item-row{background:#fff;border-radius:11px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:.12s;cursor:pointer}
.item-row:hover{box-shadow:0 2px 8px rgba(15,23,42,.08)}
.item-row.crit{border-left:4px solid #dc2626;background:linear-gradient(90deg,#fef2f2,#fff 30%)}
.item-row.low{border-left:4px solid #d97706;background:linear-gradient(90deg,#fffbeb,#fff 30%)}
.item-row.ok{border-left:4px solid #16a34a}
.item-row.unset{border-left:4px solid #cbd5e1}
.rank{flex-shrink:0;width:36px;height:36px;border-radius:8px;background:#f1f5f9;color:#475569;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78em}
.rank.top10{background:#fef3c7;color:#92400e}
.rank.top50{background:#fee2e2;color:#991b1b}
/* Product thumbnail — 시각 인식 빠른 매대 스캔용. 탭 시 카메라/갤러리 메뉴. */
.thumb{flex-shrink:0;width:46px;height:46px;border-radius:9px;background:#f8fafc;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;border:1.5px solid #e5e7eb;transition:.12s;position:relative}
.thumb:hover{border-color:#1a5c3a;background:#f0fdf4}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{font-size:1.5em;line-height:1}
.thumb .cam-badge{position:absolute;bottom:-2px;right:-2px;background:#1a5c3a;color:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:.55em;border:1.5px solid #fff;opacity:.85}
.thumb:has(img) .cam-badge{display:none}
@media (max-width: 600px) {
  .thumb{width:42px;height:42px}
  .thumb .ph{font-size:1.35em}
}
.body{flex:1;min-width:0;overflow:hidden}
.name{font-weight:700;font-size:.92em;line-height:1.25;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:.74em;color:#6b7280;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.meta .cat{background:#f1f5f9;color:#475569;border-radius:999px;padding:1px 7px;font-weight:700}
.meta .sales{color:#1a5c3a;font-weight:700}
.qbox{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:78px}
.qval{font-size:1.7em;font-weight:900;line-height:1;color:#0f172a}
.qval.unset{color:#cbd5e1;font-size:1.4em}
.qstatus{font-size:.68em;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.qstatus.crit{background:#dc2626;color:#fff}
.qstatus.low{background:#d97706;color:#fff}
.qstatus.ok{background:#16a34a;color:#fff}
.qstatus.unset{background:#e5e7eb;color:#6b7280}
.qbtns{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.qbtns button{flex-shrink:0;background:#fff;border:1.5px solid #e5e7eb;color:#374151;border-radius:6px;width:34px;height:30px;font-weight:800;font-size:.85em;cursor:pointer;font-family:inherit;padding:0}
.qbtns button:hover{background:#f0fdf4;border-color:#1a5c3a;color:#1a5c3a}
.qbtns button.active{background:#1a5c3a;border-color:#1a5c3a;color:#fff}
.empty{text-align:center;padding:50px 20px;color:#9ca3af;font-size:.92em}
.empty .emoji{font-size:3em;margin-bottom:10px}
@media (max-width: 600px) {
  .item-row{padding:8px 10px;gap:8px}
  .rank{width:32px;height:32px;font-size:.74em}
  .qval{font-size:1.4em}
  .qbtns{display:none} /* mobile: tap row for modal */
}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
.ov.show{display:flex}
.sheet{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.sheet h3{font-size:1.05em;font-weight:800;color:#0f172a;margin-bottom:4px}
.sheet .pname{font-size:1.1em;font-weight:800;color:#1a5c3a;margin-bottom:2px}
.sheet .pmeta{font-size:.84em;color:#6b7280;margin-bottom:14px}
.sheet .npad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.sheet .npad button{background:#f1f5f9;border:0;border-radius:10px;padding:14px 0;font-size:1.15em;font-weight:900;cursor:pointer;font-family:inherit;color:#0f172a}
.sheet .npad button:hover{background:#e2e8f0}
.sheet .npad button.zero{grid-column:span 2;background:#fee2e2;color:#dc2626}
.sheet .npad button.zero:hover{background:#fecaca}
.sheet .input-display{background:#f8fafc;border:2px solid #e5e7eb;border-radius:10px;padding:14px;text-align:center;font-size:2em;font-weight:900;color:#0f172a;margin-bottom:10px;font-family:'Courier New',monospace}
.sheet .actions{display:flex;gap:8px;margin-top:10px}
.sheet .actions button{flex:1;padding:12px;border-radius:9px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.94em;border:0}
.sheet .b-cancel{background:#f1f5f9;color:#374151}
.sheet .b-save{background:#1a5c3a;color:#fff}
.last-check{font-size:.78em;color:#6b7280;text-align:center;margin-top:8px;padding:6px;background:#f9fafb;border-radius:8px}
/* 사진 미리보기 - qty modal 상단 */
.sheet .photo-preview{width:120px;height:120px;border-radius:12px;margin:0 auto 10px;background:#f8fafc;border:1.5px solid #e5e7eb;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;position:relative}
.sheet .photo-preview img{width:100%;height:100%;object-fit:cover}
.sheet .photo-preview .ph-big{font-size:3em;line-height:1}
.sheet .photo-preview .edit-hint{position:absolute;bottom:0;left:0;right:0;background:rgba(15,23,42,.78);color:#fff;font-size:.7em;font-weight:700;padding:3px;text-align:center}
/* 사진 관리 모달 */
.photo-sheet{background:#fff;border-radius:16px;max-width:380px;width:100%;padding:22px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.photo-sheet .ph-name{font-size:1.05em;font-weight:800;color:#1a5c3a;margin-bottom:2px;text-align:center}
.photo-sheet .ph-code{font-size:.78em;color:#6b7280;margin-bottom:14px;text-align:center}
.photo-sheet .ph-view{width:100%;aspect-ratio:1;background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px}
.photo-sheet .ph-view img{width:100%;height:100%;object-fit:cover}
.photo-sheet .ph-view .ph-big{font-size:4.5em;line-height:1;opacity:.55}
.photo-sheet .ph-btns{display:flex;flex-direction:column;gap:8px}
.photo-sheet .ph-btns button{padding:13px;border-radius:9px;font-weight:800;font-size:.95em;font-family:inherit;cursor:pointer;border:0}
.photo-sheet .ph-take{background:#1a5c3a;color:#fff}
.photo-sheet .ph-take:hover{background:#155029}
.photo-sheet .ph-del{background:#fee2e2;color:#dc2626}
.photo-sheet .ph-del:hover{background:#fecaca}
.photo-sheet .ph-close{background:#f1f5f9;color:#374151}
.photo-sheet .ph-busy{text-align:center;color:#6b7280;font-size:.84em;padding:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;font-size:.88em;opacity:0;transition:.2s;z-index:1100;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
/* Barcode scanner — 전체 화면 카메라 뷰포트 (lookup.html 패턴 차용) */
.scan-ov{position:fixed;inset:0;background:#000;z-index:1200;display:none;flex-direction:column}
.scan-ov.active{display:flex}
.scan-video{flex:1;width:100%;height:100%;object-fit:cover;background:#000}
.scan-top{position:absolute;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);z-index:2}
.scan-top .scan-title{color:#fff;font-weight:800;font-size:1em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.scan-top button{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.88em;cursor:pointer;font-family:inherit}
.scan-reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(80vw,360px);height:min(36vh,180px);border:3px solid #16a34a;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none;z-index:2}
.scan-reticle::before,.scan-reticle::after{content:'';position:absolute;left:8%;right:8%;height:2px;background:#16a34a}
.scan-reticle::before{top:50%}
.scan-bottom{position:absolute;bottom:0;left:0;right:0;padding:18px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);z-index:2}
.scan-hint{color:#fff;font-size:.86em;font-weight:600;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.scan-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.scan-actions button{background:rgba(255,255,255,.92);color:#0f172a;border:0;border-radius:9px;padding:10px 16px;font-weight:700;font-size:.88em;cursor:pointer;font-family:inherit}
.scan-actions button:hover{background:#fff}
.stat-line{font-size:.78em;color:#6b7280;text-align:center;margin-bottom:8px}
</style>
</head>
<body class="kmd">

<div class="wrap">
  <div class="topbar">
    <div>
      <h1 id="pageTitle">🏆 Top 500 재고 관리</h1>
      <div class="sub" id="pageSub">가장 많이 팔리는 500개 — 매일 5분 점검으로 품절 방지</div>
    </div>
    <div class="head-right">
      <div class="lang-sw" id="langSw">
        <button data-lang="ko">한국어</button>
        <button data-lang="en">EN</button>
        <button data-lang="es">ES</button>
      </div>
      <div class="branch-pill">
        🏪 <select id="branchSel"></select>
      </div>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi crit" data-f="crit" onclick="setFilter('crit',this)">
      <div class="ic">🔴</div>
      <div class="num" id="kpiCrit">0</div>
      <div class="lbl" id="kpiCritLbl">긴급 / Critical</div>
    </div>
    <div class="kpi low" data-f="low" onclick="setFilter('low',this)">
      <div class="ic">🟡</div>
      <div class="num" id="kpiLow">0</div>
      <div class="lbl" id="kpiLowLbl">부족 / Low</div>
    </div>
    <div class="kpi ok" data-f="ok" onclick="setFilter('ok',this)">
      <div class="ic">🟢</div>
      <div class="num" id="kpiOk">0</div>
      <div class="lbl" id="kpiOkLbl">정상 / OK</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="🔎 상품명·코드 검색" oninput="QUERY=this.value;render()">
    <button class="btn sec" onclick="startScan()" id="scanBtn">📷 스캔</button>
    <button class="btn sec" onclick="setFilter('unset',null)" id="unsetBtn" title="아직 점검 안 한 항목">⬜ 미점검</button>
    <button class="btn sec" onclick="setFilter('all',null)" id="allBtn">전체</button>
  </div>

  <div class="cat-select-wrap">
    <label for="catSel" id="catSelLbl">📂 카테고리</label>
    <select id="catSel" class="cat-select"></select>
  </div>
  <div class="cat-progress" id="catProgress"></div>

  <div class="stat-line" id="statLine">로딩 중…</div>
  <div id="list"></div>
</div>

<!-- QTY INPUT MODAL -->
<div class="ov" id="qtyOv" onclick="if(event.target.id==='qtyOv')closeQtyOv()">
  <div class="sheet">
    <div class="photo-preview" id="qtyPhoto" onclick="event.stopPropagation();openPhotoModalFromQty()">
      <span class="ph-big" id="qtyPhotoPh">📦</span>
      <div class="edit-hint" id="qtyPhotoHint">📷 사진 추가</div>
    </div>
    <div class="pname" id="qtyProdName">—</div>
    <div class="pmeta" id="qtyProdMeta">—</div>
    <!-- 박스 계산기 — 박스 N × 입수 M + 낱개 K = 총 수량.
         박스 단위로 들어오는 입고/재고를 빠르게 환산. -->
    <div class="box-calc" style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:.88em">
      <div id="boxCalcTitle" style="font-size:.78em;font-weight:700;color:#92400e;margin-bottom:5px">📦 박스 계산 (선택)</div>
      <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
        <input type="number" id="qtyBoxN" min="0" placeholder="박스" inputmode="numeric" oninput="updateBoxCalc()" style="width:62px;border:1px solid #fcd34d;border-radius:6px;padding:5px 7px;font-size:1em;font-weight:700;text-align:center">
        <span style="color:#92400e;font-weight:700">×</span>
        <input type="number" id="qtyBoxPer" min="0" placeholder="입수" inputmode="numeric" oninput="updateBoxCalc()" style="width:62px;border:1px solid #fcd34d;border-radius:6px;padding:5px 7px;font-size:1em;font-weight:700;text-align:center">
        <span style="color:#92400e;font-weight:700">+</span>
        <input type="number" id="qtyBoxLoose" min="0" placeholder="낱개" inputmode="numeric" oninput="updateBoxCalc()" style="width:62px;border:1px solid #fcd34d;border-radius:6px;padding:5px 7px;font-size:1em;font-weight:700;text-align:center">
        <span style="color:#92400e;font-weight:700">=</span>
        <span id="qtyBoxTotal" style="font-size:1.15em;font-weight:900;color:#15803d">0</span>
        <button type="button" id="boxApplyBtn" onclick="applyBoxCalc()" style="margin-left:auto;background:#15803d;color:#fff;border:0;border-radius:6px;padding:5px 12px;font-size:.84em;font-weight:800;cursor:pointer">📦 적용</button>
      </div>
    </div>
    <div class="input-display" id="qtyDisp">0</div>
    <div class="npad">
      <button onclick="numpadAdd('1')">1</button>
      <button onclick="numpadAdd('2')">2</button>
      <button onclick="numpadAdd('3')">3</button>
      <button onclick="numpadClear()" style="background:#fef3c7;color:#92400e">⌫</button>
      <button onclick="numpadAdd('4')">4</button>
      <button onclick="numpadAdd('5')">5</button>
      <button onclick="numpadAdd('6')">6</button>
      <button onclick="numpadSet(10)" style="background:#dbeafe;color:#1d4ed8">10</button>
      <button onclick="numpadAdd('7')">7</button>
      <button onclick="numpadAdd('8')">8</button>
      <button onclick="numpadAdd('9')">9</button>
      <button onclick="numpadSet(20)" style="background:#dbeafe;color:#1d4ed8">20</button>
      <button class="zero" onclick="numpadSet(0)" id="zeroBtn">0 (품절)</button>
      <button onclick="numpadAdd('0')">0</button>
      <button onclick="numpadSet(50)" style="background:#dbeafe;color:#1d4ed8">50</button>
    </div>
    <div class="last-check" id="qtyLastCheck"></div>
    <div class="actions">
      <button class="b-cancel" onclick="closeQtyOv()" id="cancelBtn">취소</button>
      <button type="button" id="clearQtyBtn" onclick="clearQty()" style="display:none;background:#fff;color:#dc2626;border:1.5px solid #dc2626;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer">🗑 점검 취소</button>
      <button class="b-save" onclick="saveQty()" id="saveBtn">💾 저장</button>
    </div>
  </div>
</div>

<!-- PHOTO MANAGE MODAL -->
<div class="ov" id="photoOv" onclick="if(event.target.id==='photoOv')closePhotoModal()">

  if (/ICE.?CREAM|DESSERT/i.test(c)) return '🍦';
  if (/BAKERY|BREAD|CAKE/i.test(c)) return '🥖';
  if (/ALCOHOL|SOJU|BEER|LIQUOR|WINE|MAKGEOLLI/i.test(c)) return '🍶';
  if (/SAUCE|PASTE|MARINADE|GOCHUJANG|SOY|MISO/i.test(c)) return '🥫';
  if (/RICE|GRAIN/i.test(c)) return '🍚';
  if (/MEAT|BEEF|PORK|CHICKEN/i.test(c)) return '🥩';
  if (/SEAFOOD|FISH/i.test(c)) return '🐟';
  if (/PRODUCE|FRUIT/i.test(c)) return '🍎';
  if (/VEGETABLE/i.test(c)) return '🥬';
  if (/TOFU|SOY/i.test(c)) return '🫛';
  if (/MEAL|REFRIGERATED|FROZEN.?MEAL/i.test(c)) return '🍱';
  if (/COFFEE|TEA/i.test(c)) return '☕';
  if (/SEAWEED|NORI/i.test(c)) return '🌿';

// ============== Photos (전 지점 공유, RTDB /catalog/photos/{code}) ==============
// 사진 소스 우선순위:
//   1. RTDB /catalog/photos/{code} — 사용자 업로드 (dataURL, base64)
//   2. ./top500/photos/{safeCode}.jpg — kimchi-mart-order 카탈로그 매칭 결과 (URL)
// dataURL 인지 URL 인지로 사용자 업로드 vs static 구분 가능.
//
// 🔑 바코드 정규화: Vela CSV 가 같은 상품을 지점마다 다르게 export 함:
//    "07441074180", "=07441074180", "0744107418" (앞 0 변형) 등.
//    조회/저장 시 normBarcode() 통과시켜 한 키로 통일.
let STATIC_PHOTO_MAP = {};   // { upc: safeCode } — static 자산이 있는 코드 목록

// 바코드 정규화 — 앞 = 떼고 leading-zero 제거. 빈 문자열은 그대로.
function normBarcode(code){
  let s = String(code||'').trim();
  if (!s) return '';
  // 앞 = 모두 제거 (Vela CSV "텍스트 강제" 형식)
  s = s.replace(/^=+/, '');
  // 숫자가 아닌 문자 제거 (혹시 모를 보호)
  s = s.replace(/[^0-9]/g, '');
  // leading 0 제거 — 단, 길이 6 이상 유지
  while (s.length > 6 && s.startsWith('0')) s = s.slice(1);
  return s;
}

// Vela CODE 와 catalog 바코드 매칭 변형 — Vela 는 보통 check digit 빠진 11자리.
// 정규화된 키 + prefix 11/12 자리를 lookup 키로 시도.
function photoLookupKeys(code){
  const out = [];
  out.push(String(code||'').trim());           // 원형
  const n = normBarcode(code);
  if (n) out.push(n);
  // n 의 11자리 prefix (check digit 잘림 대응)
  if (n.length >= 11) out.push(n.slice(0, 11));
  if (n.length >= 12) out.push(n.slice(0, 12));
  return [...new Set(out)].filter(Boolean);
}

// 사진 lookup — 다양한 바코드 변형 시도. 첫 매치 반환.
function photoFor(code){
  for (const k of photoLookupKeys(code)){
    if (PHOTOS[k]) return PHOTOS[k];
  }
  return null;
}

async function loadPhotos(){
  PHOTOS = {};
  // 1. RTDB 사용자 업로드 (top priority)
  try {
    const r = await fetch(`${FB_DB}/catalog/photos.json?t=` + Date.now(), { cache:'no-store' });
    if (r.ok) {
      const raw = (await r.json()) || {};
      // 사용자가 업로드한 키와 정규화 키 둘 다 등록 — variant 매칭
      for (const [code, dataURL] of Object.entries(raw)){
        PHOTOS[code] = dataURL;
        const n = normBarcode(code);
        if (n && n !== code && !PHOTOS[n]) PHOTOS[n] = dataURL;
      }
    }
  } catch(e) { console.warn('[photos rtdb]', e); }
  // 2. 정적 카탈로그 매칭 fallback
  try {
    const r2 = await fetch('./top500/photos-map.json?t=' + Date.now(), { cache:'no-store' });
    if (r2.ok) {
      STATIC_PHOTO_MAP = (await r2.json()) || {};
      for (const [code, safe] of Object.entries(STATIC_PHOTO_MAP)) {
        const url = `./top500/photos/${safe}.jpg`;
        if (!PHOTOS[code]) PHOTOS[code] = url;
        const n = normBarcode(code);
        if (n && n !== code && !PHOTOS[n]) PHOTOS[n] = url;
      }
    }
  } catch(e) { console.warn('[photos static]', e); }
}
function isUserPhoto(code){
  // 사용자 업로드 사진은 dataURL (data:image/...) 로 시작
  const p = photoFor(code);
  return p && typeof p === 'string' && p.startsWith('data:');
}

// 사진 저장/삭제 시 사용할 정규화 키 — 한 지점이 올리면 다른 지점도 보이게.
function photoStorageKey(code){
  const n = normBarcode(code);
  return n || String(code||'').trim();
}

// 썸네일 로드 실패 시 이모지로 폴백 — static 사진 파일 404, SW 캐시 문제, 네트워크 오류 등.
// 동시에 PHOTOS[code] 에서도 제거해 재렌더 시 깨끗하게 emoji 가 나오도록.
function handleThumbError(img){
  const code = img.dataset.code || '';
  const emoji = img.dataset.emoji || '📦';
  // 원형/정규화 키 둘 다 정리. 사용자 업로드 (dataURL) 는 보존 — static URL 만 제거.
  if (code){
    for (const k of photoLookupKeys(code)){
      if (PHOTOS[k] && !String(PHOTOS[k]).startsWith('data:')) delete PHOTOS[k];
    }
  }
  const parent = img.parentNode;
  if (parent) parent.innerHTML = `<span class="ph">${emoji}</span><span class="cam-badge">📷</span>`;
}
window.handleThumbError = handleThumbError;

  const key = photoStorageKey(code);

// 이미지 압축 — JPEG 120×120 max, ~5-8KB. RTDB 에 base64 저장하기에 적합한 크기.
async function compressImage(file, maxDim, quality){
  maxDim = maxDim || 220;
  quality = (typeof quality === 'number') ? quality : 0.72;
  const dataUrl = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = dataUrl;
  });
  const ratio = Math.min(maxDim/img.width, maxDim/img.height, 1);
  const w = Math.max(1, Math.round(img.width * ratio));
  const h = Math.max(1, Math.round(img.height * ratio));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}

// 진열대 부족 판단 — 일평균 sales × 안전일수 (기본 3일치).
// qty < min/2 → 긴급, qty < min → 부족, else 정상.
const SAFE_DAYS = 3;
function minQtyFor(code){
  const dailyAvg = (SALES_INDEX[code] || 0) / SOURCE_DAYS;
  return Math.max(Math.round(dailyAvg * SAFE_DAYS), 2);
}
function statusOf(code){
  const s = STATE[code];
  if (!s || typeof s.qty !== 'number') return 'unset';
  const min = minQtyFor(code);
  if (s.qty < min/2) return 'crit';
  if (s.qty < min) return 'low';
  return 'ok';
}

// 🔄 페이지 로드 시 localStorage 백업 자동 재시도 — 401 silent fail 복구.
async function retryBackedUpWrites(){
  // (1) 재고 점검 백업 재시도
  let stateBackup = {};
  try { stateBackup = JSON.parse(localStorage.getItem('top500.stateBackup') || '{}'); } catch(_){}
  const stateBranches = Object.keys(stateBackup);
  let stateOk = 0, stateFail = 0;
  for (const br of stateBranches) {
    for (const [code, entry] of Object.entries(stateBackup[br]||{})) {
      try {
        const r = await fetch(`${FB_DB}/inventory/top500/${br}/${encodeURIComponent(code)}.json`, {
          method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(entry)
        });
        if (r.ok) { stateOk++; delete stateBackup[br][code]; }
        else stateFail++;
      } catch(_) { stateFail++; }
    }
    if (Object.keys(stateBackup[br]||{}).length === 0) delete stateBackup[br];
  }
  try { localStorage.setItem('top500.stateBackup', JSON.stringify(stateBackup)); } catch(_){}

  // (2) 사진 백업 재시도
  let photoBackup = {};
  try { photoBackup = JSON.parse(localStorage.getItem('top500.photoBackup') || '{}'); } catch(_){}
  let photoOk = 0, photoFail = 0;
  for (const [key, item] of Object.entries(photoBackup)) {
    try {
      const r = await fetch(`${FB_DB}/catalog/photos/${encodeURIComponent(key)}.json`, {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(item.dataURL)
      });
      if (r.ok) { photoOk++; delete photoBackup[key]; }
      else photoFail++;
    } catch(_) { photoFail++; }
  }
  try { localStorage.setItem('top500.photoBackup', JSON.stringify(photoBackup)); } catch(_){}

  if (stateOk + photoOk > 0) {
    showToast('✅ 미저장 데이터 ' + (stateOk + photoOk) + '건 복구됨' + (stateFail + photoFail > 0 ? ' (실패 ' + (stateFail + photoFail) + '건)' : ''));
  }
}

// 매장 매대 따라 스캔하기 위한 카테고리 드롭다운 — 큰 카테고리부터 정렬, 미점검 수 표시.
// 가로 스크롤 칩에서 select 로 변경 (전무 요청: 카테고리 너무 많아 옆으로 밀기 불편).
function renderCatBar(){
  const sel = $('catSel');
  if (!sel) return;
  if (!TOP500.length) { sel.innerHTML = ''; $('catProgress').classList.remove('show'); return; }
  // 카테고리별 통계 — 총 개수 + 미점검 개수
  const stats = {};
  TOP500.forEach(p => {
    const c = p.cat || '(no cat)';
    if (!stats[c]) stats[c] = { total: 0, pending: 0 };
    stats[c].total++;
    if (statusOf(p.code) === 'unset') stats[c].pending++;
  });
  // 카운트 desc 정렬 — 큰 매대부터 노출
  const cats = Object.entries(stats).sort((a,b) => b[1].total - a[1].total);
  const totalAll = TOP500.length;
  const pendingAll = TOP500.filter(p => statusOf(p.code) === 'unset').length;
  const t = T();
  // 옵션 생성 — value 에 raw 카테고리 이름, label 에 i18n 포맷 (개수 + 미점검 뱃지)
  // 🐛 이전 버그: onclick="setCategory(...)" 에 JSON.stringify 한 따옴표가 속성 큰따옴표와 충돌해
  // 클릭이 무시됐음. select 의 native value 로 바꿔서 해결.
  const opts = [
    `<option value="all">${escHtml(t.catOptAll(totalAll, pendingAll))}</option>`
  ];
  cats.forEach(([c, s]) => {
    opts.push(`<option value="${escHtml(c)}">${escHtml(t.catOpt(c, s.total, s.pending))}</option>`);
  });
  sel.innerHTML = opts.join('');
  // 저장된 카테고리가 더 이상 없으면 'all' 로 폴백
  if (CATEGORY !== 'all' && !stats[CATEGORY]) CATEGORY = 'all';
  sel.value = CATEGORY;
  // 진행률 — 카테고리 선택 시에만 표시
  const prog = $('catProgress');
  if (CATEGORY !== 'all' && stats[CATEGORY]) {
    const s = stats[CATEGORY];
    const done = s.total - s.pending;
    prog.textContent = t.catProgress(CATEGORY, done, s.total);
    prog.classList.add('show');
  } else {
    prog.classList.remove('show');
    prog.textContent = '';
  }
}

    return;
  }
  const html = list.map(p => renderRow(p)).join('');
  $('list').innerHTML = html;
}

function computeKpis(){
  let crit=0, low=0, ok=0, unset=0;
  TOP500.forEach(p => {
    const s = statusOf(p.code);
    if (s==='crit') crit++;
    else if (s==='low') low++;
    else if (s==='ok') ok++;
    else unset++;
  });
  $('kpiCrit').textContent = crit;
  $('kpiLow').textContent = low;
  $('kpiOk').textContent = ok;
  $('unsetBtn').textContent = T().kpiUnsetBtn(unset);
}

function renderRow(p){
  const s = STATE[p.code];
  const status = statusOf(p.code);
  const qty = s && typeof s.qty === 'number' ? s.qty : null;
  const min = minQtyFor(p.code);
  const dailyAvg = (p.qty || 0) / SOURCE_DAYS;
  const rankCls = p.rank <= 10 ? 'top10' : p.rank <= 50 ? 'top50' : '';
  const t = T();
  const statusLbl = { crit: t.statusCrit, low: t.statusLow, ok: t.statusOk, unset: t.statusUnset }[status];
  const qHtml = qty === null
    ? `<div class="qval unset">—</div>`
    : `<div class="qval">${qty}</div>`;
  // 썸네일 — 사진 있으면 <img>, 없으면 카테고리 이모지. 탭 시 사진 관리 모달 (qty 모달과 분리).
  // onerror: static 사진 파일이 404 (GitHub Pages 배포 race 등) 시 이모지로 폴백.
  const photo = photoFor(p.code);
  const emoji = categoryEmoji(p.cat||'');
  const codeEsc = escHtml(p.code);
  const thumbInner = photo
    ? `<img loading="lazy" src="${escHtml(photo)}" alt="" data-code="${codeEsc}" data-emoji="${emoji}" onerror="handleThumbError(this)">`
    : `<span class="ph">${emoji}</span><span class="cam-badge">📷</span>`;
  return `<div class="item-row ${status}" onclick="openQtyOv('${codeEsc}')">
    <div class="rank ${rankCls}">#${p.rank}</div>
    <div class="thumb" data-code="${codeEsc}" onclick="event.stopPropagation();openPhotoModal('${codeEsc}')">${thumbInner}</div>
    <div class="body">
      <div class="name">${escHtml(p.name)}</div>
      <div class="meta">
        <span>#${codeEsc}</span>
        <span class="cat">${escHtml(p.cat||'')}</span>
        <span class="sales">${escHtml(t.sales90(p.qty))}</span>
        <span>${escHtml(t.rowAvg(dailyAvg.toFixed(1), min))}</span>
      </div>
    </div>
    <div class="qbox">
      ${qHtml}
      <div class="qstatus ${status}">${escHtml(statusLbl)}</div>
    </div>
  </div>`;
}

function numpadAdd(d){

  if (NUMPAD_VAL.length >= 4) return;
  NUMPAD_VAL += d;
  $('qtyDisp').textContent = NUMPAD_VAL || '0';
}
function numpadSet(n){
  NUMPAD_VAL = String(n);
  $('qtyDisp').textContent = NUMPAD_VAL;
}
function numpadClear(){
  NUMPAD_VAL = NUMPAD_VAL.slice(0, -1);
  $('qtyDisp').textContent = NUMPAD_VAL || '0';
}
// 박스 계산기 — 박스 N × 입수 M + 낱개 K = 총 수량. input 변경 시 실시간 표시
function updateBoxCalc(){
  const n = parseInt(($('qtyBoxN')||{}).value || '0', 10) || 0;
  const per = parseInt(($('qtyBoxPer')||{}).value || '0', 10) || 0;
  const loose = parseInt(($('qtyBoxLoose')||{}).value || '0', 10) || 0;
  const total = n * per + loose;
  const out = $('qtyBoxTotal');
  if (out) out.textContent = total;
}
// [📦 적용] 버튼 — 계산 결과를 큰 qtyDisp 에 set + numpad 값 갱신
function applyBoxCalc(){
  const n = parseInt(($('qtyBoxN')||{}).value || '0', 10) || 0;
  const per = parseInt(($('qtyBoxPer')||{}).value || '0', 10) || 0;
  const loose = parseInt(($('qtyBoxLoose')||{}).value || '0', 10) || 0;
  const total = n * per + loose;
  numpadSet(total);
}
window.updateBoxCalc = updateBoxCalc;
window.applyBoxCalc = applyBoxCalc;
async function saveQty(){
  if (!CUR_CODE) return;
  const t = T();
  const n = parseInt(NUMPAD_VAL, 10);

  await saveState(CUR_CODE, n);
  const min = minQtyFor(CUR_CODE);
  let msg;

  else if (n < min/2) msg = t.toastCrit(CUR_CODE, n, min);

  showToast(msg);
  closeQtyOv();
  render();
}

// ============== Barcode scan ==============
// 실시간 카메라 스캔 — Android: BarcodeDetector, iOS: ZXing, 폴백: 파일/직접 입력.
// lookup.html 의 검증된 패턴 차용.
let scanVideoStream = null;
let scanInterval = null;
let zxingReader = null;
let zxingLiveActive = false;
let scanOpen = false;

async function startScan(){
  if (scanOpen) return;
  scanOpen = true;
  const overlay = $('scanOv');
  const video = $('scanVideo');
  overlay.classList.add('active');

  // Android / Chrome: native BarcodeDetector (가장 빠름)
  if ('BarcodeDetector' in window){
    try {
      scanVideoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width:{ideal:1280}, height:{ideal:720} }
      });
      video.srcObject = scanVideoStream;
      video.onloadedmetadata = () => {
        const detector = new BarcodeDetector({
          formats: ['ean_13','upc_a','upc_e','ean_8','code_128','code_39','qr_code']
        });
        scanInterval = setInterval(async () => {
          if (!scanOpen) return;
          if (video.readyState === video.HAVE_ENOUGH_DATA){
            try {
              const codes = await detector.detect(video);
              if (codes && codes.length > 0) handleScannedCode(codes[0].rawValue);
            } catch(_) {}
          }
        }, 400);
      };
      return;
    } catch(e){ console.warn('BarcodeDetector failed:', e); }
  }

  // iOS Safari: ZXing live stream.
  // Stability guard: 같은 값 2번 디코드되면 commit, 또는 800ms 후 single-hit 도 허용.
  if (typeof ZXing !== 'undefined' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try {
      if (!zxingReader) zxingReader = new ZXing.BrowserMultiFormatReader();
      zxingLiveActive = true;
      const hits = new Map();
      const scanStart = Date.now();
      let committed = false;
      await zxingReader.decodeFromConstraints(
        { video: { facingMode: { ideal: 'environment' } } },
        video,
        (result) => {
          if (!zxingLiveActive || committed || !result) return;
          const text = result.getText();
          if (!text || text.replace(/\D/g,'').length < 8) return;
          const n = (hits.get(text) || 0) + 1;
          hits.set(text, n);
          if (n >= 2){ committed = true; handleScannedCode(text); return; }
          if (Date.now() - scanStart >= 800){ committed = true; handleScannedCode(text); }
        }
      );
      return;
    } catch(e){
      zxingLiveActive = false;
      console.warn('ZXing scan unavailable:', e);
    }
  }

  // 최후 폴백: 파일 업로드 모드로 전환
  showToast(T().scanNoCam);
  triggerScanFile();
}

function closeScan(){
  scanOpen = false;
  if (scanInterval){ clearInterval(scanInterval); scanInterval = null; }
  zxingLiveActive = false;
  if (scanVideoStream){
    try { scanVideoStream.getTracks().forEach(t => t.stop()); } catch(_){}
    scanVideoStream = null;
  }
  if (zxingReader){ try { zxingReader.reset(); } catch(_){} }
  const v = $('scanVideo');
  if (v && v.srcObject){
    try { v.srcObject.getTracks().forEach(t => t.stop()); } catch(_){}
    v.srcObject = null;
  }
  $('scanOv').classList.remove('active');
}

// 스캔 코드 처리 — top500 내 매칭 후 qty modal 열기.
// 바코드 정규화로 = 접두사, leading 0 등 변형 모두 시도.
function handleScannedCode(code){
  closeScan();
  const raw = String(code||'').trim();
  if (!raw) return;
  // Top500 안에서 매칭 시도 (변형 키 사용)
  const hit = findTop500ByBarcode(raw);
  const t = T();
  if (hit){
    showToast(t.scanSuccess(raw));
    openQtyOv(hit.code);
  } else {
    if (confirm(t.scanNotFound(raw))){
      window.location.href = './lookup.html?q=' + encodeURIComponent(raw);
    }
  }
}

function findTop500ByBarcode(scanned){
  const variants = photoLookupKeys(scanned);   // 정규화 + prefix 변형
  for (const v of variants){
    let hit = TOP500.find(p => p.code === v);
    if (hit) return hit;
  }
  // top500 코드를 정규화한 후 비교 (반대 방향)
  const normScan = normBarcode(scanned);
  for (const p of TOP500){
    const normProd = normBarcode(p.code);
    if (normProd && (normProd === normScan || normProd.startsWith(normScan) || normScan.startsWith(normProd))){
      return p;
    }
  }
  return null;
}

function triggerScanFile(){
  $('scanFile').value = '';
  $('scanFile').click();
}

async function handleScanFile(file){
  if (!file) return;
  const t = T();
  let result = null;
  // BarcodeDetector 우선
  if ('BarcodeDetector' in window){
    try {
      const img = await createImageBitmap(file);
      const detector = new BarcodeDetector({
        formats: ['ean_13','upc_a','upc_e','ean_8','code_128','code_39','qr_code']
      });
      const codes = await detector.detect(img);
      if (codes && codes.length > 0) result = codes[0].rawValue;
    } catch(e){}
  }
  // ZXing 폴백
  if (!result && typeof ZXing !== 'undefined'){
    try {
      const url = URL.createObjectURL(file);
      if (!zxingReader) zxingReader = new ZXing.BrowserMultiFormatReader();
      const res = await zxingReader.decodeFromImageUrl(url);
      URL.revokeObjectURL(url);
      if (res) result = res.getText();
    } catch(e){}
  }
  if (result){
    handleScannedCode(result);
  } else {
    showToast(t.scanFail);
  }
}

function manualBarcodeEntry(){
  closeScan();
  const code = prompt(T().scanPrompt);
  if (code) handleScannedCode(code);
}

window.startScan = startScan;
window.closeScan = closeScan;
window.triggerScanFile = triggerScanFile;
window.manualBarcodeEntry = manualBarcodeEntry;

// ============== Init ==============
function init(){
  try { ME = JSON.parse(localStorage.getItem('chat.me')||'null'); } catch(_){ ME = null; }
  // Branch selector
  const sel = $('branchSel');
  sel.innerHTML = BRANCHES.map(b => `<option value="${b.id}">${b[LANG]||b.ko||b.id}</option>`).join('');
  const def = (ME && ME.branch && ME.branch !== '*') ? ME.branch : (localStorage.getItem('hub.branch') || 'HOLLYWOOD');
  if (BRANCHES.find(b => b.id === def)) sel.value = def;
  BRANCH = sel.value;
  sel.addEventListener('change', async () => {
    BRANCH = sel.value;
    try { localStorage.setItem('hub.branch', BRANCH); } catch(_){}
    // 🐛 FIX: branch 변경 시 그 지점의 top500 JSON 도 새로 로드 (이전엔 state 만 갱신)
    await loadTop500();
    await loadState();
    render();
  });
  // Lang switcher wire-up
  document.querySelectorAll('#langSw button').forEach(btn => {
    btn.addEventListener('click', () => setLang(btn.dataset.lang));
  });
  // Category dropdown wire-up — native select 이라 onclick 속성 충돌 문제 없음
  const catSel = $('catSel');
  if (catSel) catSel.addEventListener('change', () => setCategory(catSel.value));
  // Photo file picker wire-up — 카메라 input + 갤러리 input 둘 다 동일 처리
  ['photoFile','photoFileGallery'].forEach(id => {
    const inp = $(id);
    if (inp) inp.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) handlePhotoFile(f);
    });
  });
  // Scan file picker wire-up
  const scanFile = $('scanFile');
  if (scanFile) scanFile.addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) handleScanFile(f);
  });
  // 다른 페이지에서 언어 바꾸고 돌아왔을 때 동기화 (lang-sync.js 가 broadcast)
  window.addEventListener('storage', (e) => {
    if (e.key === 'kimchi_lang' && e.newValue && I18N[e.newValue] && e.newValue !== LANG) {
      LANG = e.newValue;
      applyI18N();
      render();
    }
  });
  applyI18N();
}
(async function(){
  init();
  // 🔄 401 silent fail 로 못 들어간 백업 데이터 자동 재시도 — 이번 fix 이후
  // 토큰이 정상이면 이전에 실패했던 사진/재고가 알아서 RTDB 에 들어감.
  try { await retryBackedUpWrites(); } catch(_){}
  // 사진은 전 지점 공통이라 병렬 로드. 첫 로드는 빈 객체로 시작해도 OK.
  await Promise.all([loadTop500(), loadState(), loadPhotos()]);
  render();
})();
