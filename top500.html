<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🏆 Top 500 재고 관리 — 김치마트</title>
<link rel="manifest" href="pwa-assets/manifest.webmanifest">
<meta name="theme-color" content="#1a5c3a">
<script type="module" src="./auth-gate.js?v=3"></script>
<script src="./nav-sidebar.js?v=18" defer></script>
<script src="./back-nav.js?v=1"></script>
<link rel="stylesheet" href="./km-design.css?v=3">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f4f6f9;padding-bottom:80px;color:#0f172a}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.topbar{background:linear-gradient(135deg,#1a5c3a,#2e7d32);color:#fff;padding:18px 20px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{font-size:1.3em;font-weight:900;letter-spacing:-.01em}
.topbar .sub{font-size:.82em;opacity:.88;margin-top:2px}
.branch-pill{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-size:.86em;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.branch-pill select{background:transparent;border:0;color:#fff;font-weight:700;font-family:inherit;font-size:.95em;outline:0;cursor:pointer}
.branch-pill select option{color:#0f172a}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:#fff;border-radius:12px;padding:14px 12px;text-align:center;box-shadow:0 1px 3px rgba(15,23,42,.06);border:1.5px solid transparent;cursor:pointer;transition:.15s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(15,23,42,.10)}
.kpi.active{border-color:currentColor}
.kpi .ic{font-size:1.4em;line-height:1}
.kpi .num{font-size:1.8em;font-weight:900;margin:3px 0;line-height:1.1}
.kpi .lbl{font-size:.78em;font-weight:700;opacity:.85}
.kpi.crit{color:#dc2626}
.kpi.low{color:#d97706}
.kpi.ok{color:#15803d}
.toolbar{background:#fff;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.toolbar input[type=text]{flex:1;min-width:160px;border:1.5px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:.94em;font-family:inherit;outline:0}
.toolbar input[type=text]:focus{border-color:#1a5c3a}
.btn{background:#1a5c3a;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:700;font-size:.86em;cursor:pointer;font-family:inherit}
.btn.sec{background:#fff;color:#1a5c3a;border:1.5px solid #1a5c3a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid #e5e7eb;color:#374151;border-radius:999px;padding:5px 12px;font-size:.82em;font-weight:700;cursor:pointer;font-family:inherit}
.chip.active{background:#1a5c3a;color:#fff;border-color:#1a5c3a}
.item-row{background:#fff;border-radius:11px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:.12s;cursor:pointer}
.item-row:hover{box-shadow:0 2px 8px rgba(15,23,42,.08)}
.item-row.crit{border-left:4px solid #dc2626;background:linear-gradient(90deg,#fef2f2,#fff 30%)}
.item-row.low{border-left:4px solid #d97706;background:linear-gradient(90deg,#fffbeb,#fff 30%)}
.item-row.ok{border-left:4px solid #16a34a}
.item-row.unset{border-left:4px solid #cbd5e1}
.rank{flex-shrink:0;width:36px;height:36px;border-radius:8px;background:#f1f5f9;color:#475569;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78em}
.rank.top10{background:#fef3c7;color:#92400e}
.rank.top50{background:#fee2e2;color:#991b1b}
.body{flex:1;min-width:0;overflow:hidden}
.name{font-weight:700;font-size:.92em;line-height:1.25;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:.74em;color:#6b7280;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.meta .cat{background:#f1f5f9;color:#475569;border-radius:999px;padding:1px 7px;font-weight:700}
.meta .sales{color:#1a5c3a;font-weight:700}
.qbox{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:78px}
.qval{font-size:1.7em;font-weight:900;line-height:1;color:#0f172a}
.qval.unset{color:#cbd5e1;font-size:1.4em}
.qstatus{font-size:.68em;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.qstatus.crit{background:#dc2626;color:#fff}
.qstatus.low{background:#d97706;color:#fff}
.qstatus.ok{background:#16a34a;color:#fff}
.qstatus.unset{background:#e5e7eb;color:#6b7280}
.qbtns{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.qbtns button{flex-shrink:0;background:#fff;border:1.5px solid #e5e7eb;color:#374151;border-radius:6px;width:34px;height:30px;font-weight:800;font-size:.85em;cursor:pointer;font-family:inherit;padding:0}
.qbtns button:hover{background:#f0fdf4;border-color:#1a5c3a;color:#1a5c3a}
.qbtns button.active{background:#1a5c3a;border-color:#1a5c3a;color:#fff}
.empty{text-align:center;padding:50px 20px;color:#9ca3af;font-size:.92em}
.empty .emoji{font-size:3em;margin-bottom:10px}
@media (max-width: 600px) {
  .item-row{padding:8px 10px;gap:8px}
  .rank{width:32px;height:32px;font-size:.74em}
  .qval{font-size:1.4em}
  .qbtns{display:none} /* mobile: tap row for modal */
}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
.ov.show{display:flex}
.sheet{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:22px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.sheet h3{font-size:1.05em;font-weight:800;color:#0f172a;margin-bottom:4px}
.sheet .pname{font-size:1.1em;font-weight:800;color:#1a5c3a;margin-bottom:2px}
.sheet .pmeta{font-size:.84em;color:#6b7280;margin-bottom:14px}
.sheet .npad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.sheet .npad button{background:#f1f5f9;border:0;border-radius:10px;padding:14px 0;font-size:1.15em;font-weight:900;cursor:pointer;font-family:inherit;color:#0f172a}
.sheet .npad button:hover{background:#e2e8f0}
.sheet .npad button.zero{grid-column:span 2;background:#fee2e2;color:#dc2626}
.sheet .npad button.zero:hover{background:#fecaca}
.sheet .input-display{background:#f8fafc;border:2px solid #e5e7eb;border-radius:10px;padding:14px;text-align:center;font-size:2em;font-weight:900;color:#0f172a;margin-bottom:10px;font-family:'Courier New',monospace}
.sheet .actions{display:flex;gap:8px;margin-top:10px}
.sheet .actions button{flex:1;padding:12px;border-radius:9px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.94em;border:0}
.sheet .b-cancel{background:#f1f5f9;color:#374151}
.sheet .b-save{background:#1a5c3a;color:#fff}
.last-check{font-size:.78em;color:#6b7280;text-align:center;margin-top:8px;padding:6px;background:#f9fafb;border-radius:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;font-size:.88em;opacity:0;transition:.2s;z-index:1100;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.stat-line{font-size:.78em;color:#6b7280;text-align:center;margin-bottom:8px}
</style>
</head>
<body class="kmd">

<div class="wrap">
  <div class="topbar">
    <div>
      <h1>🏆 Top 500 재고 관리</h1>
      <div class="sub">가장 많이 팔리는 500개 — 매일 5분 점검으로 품절 방지</div>
    </div>
    <div class="branch-pill">
      🏪 <select id="branchSel"></select>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi crit" data-f="crit" onclick="setFilter('crit',this)">
      <div class="ic">🔴</div>
      <div class="num" id="kpiCrit">0</div>
      <div class="lbl">긴급 / Critical</div>
    </div>
    <div class="kpi low" data-f="low" onclick="setFilter('low',this)">
      <div class="ic">🟡</div>
      <div class="num" id="kpiLow">0</div>
      <div class="lbl">부족 / Low</div>
    </div>
    <div class="kpi ok" data-f="ok" onclick="setFilter('ok',this)">
      <div class="ic">🟢</div>
      <div class="num" id="kpiOk">0</div>
      <div class="lbl">정상 / OK</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="🔎 상품명·코드 검색" oninput="QUERY=this.value;render()">
    <button class="btn sec" onclick="startScan()" id="scanBtn">📷 스캔</button>
    <button class="btn sec" onclick="setFilter('unset',null)" id="unsetBtn" title="아직 점검 안 한 항목">⬜ 미점검</button>
    <button class="btn sec" onclick="setFilter('all',null)">전체</button>
  </div>

  <div class="stat-line" id="statLine">로딩 중…</div>
  <div id="list"></div>
</div>

<!-- QTY INPUT MODAL -->
<div class="ov" id="qtyOv" onclick="if(event.target.id==='qtyOv')closeQtyOv()">
  <div class="sheet">
    <div class="pname" id="qtyProdName">—</div>
    <div class="pmeta" id="qtyProdMeta">—</div>
    <div class="input-display" id="qtyDisp">0</div>
    <div class="npad">
      <button onclick="numpadAdd('1')">1</button>
      <button onclick="numpadAdd('2')">2</button>
      <button onclick="numpadAdd('3')">3</button>
      <button onclick="numpadClear()" style="background:#fef3c7;color:#92400e">⌫</button>
      <button onclick="numpadAdd('4')">4</button>
      <button onclick="numpadAdd('5')">5</button>
      <button onclick="numpadAdd('6')">6</button>
      <button onclick="numpadSet(10)" style="background:#dbeafe;color:#1d4ed8">10</button>
      <button onclick="numpadAdd('7')">7</button>
      <button onclick="numpadAdd('8')">8</button>
      <button onclick="numpadAdd('9')">9</button>
      <button onclick="numpadSet(20)" style="background:#dbeafe;color:#1d4ed8">20</button>
      <button class="zero" onclick="numpadSet(0)">0 (품절)</button>
      <button onclick="numpadAdd('0')">0</button>
      <button onclick="numpadSet(50)" style="background:#dbeafe;color:#1d4ed8">50</button>
    </div>
    <div class="last-check" id="qtyLastCheck"></div>
    <div class="actions">
      <button class="b-cancel" onclick="closeQtyOv()">취소</button>
      <button class="b-save" onclick="saveQty()">💾 저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const FB_DB = 'https://kimchi-mart-order-default-rtdb.firebaseio.com';

const BRANCHES = [
  { id:'MIAMI',          ko:'마이애미',       en:'Miami',           es:'Miami' },
  { id:'PEMBROKE_PINES', ko:'펨브로크 파인즈', en:'Pembroke Pines',  es:'Pembroke Pines' },
  { id:'HOLLYWOOD',      ko:'할리우드',       en:'Hollywood',       es:'Hollywood' },
  { id:'CORAL_SPRINGS',  ko:'코럴 스프링스',  en:'Coral Springs',   es:'Coral Springs' },
  { id:'LASOLAS',        ko:'라스올라스',     en:'Las Olas',        es:'Las Olas' },
  { id:'WEST_PALM',      ko:'웨스트 팜 비치', en:'West Palm Beach', es:'West Palm Beach' },
];

let LANG = (function(){ try { return localStorage.getItem('kimchi_lang') || 'ko'; } catch(e){ return 'ko'; }})();
let TOP500 = [];        // [{rank, code, name, cat, qty:salesQty, ...}]
let SALES_INDEX = {};   // code → salesQty (90-day units)
let STATE = {};         // code → { qty, ts, by, status }
let BRANCH = null;
let QUERY = '';
let FILTER = 'all';     // 'all'|'crit'|'low'|'ok'|'unset'
let ME = null;
let SOURCE_DAYS = 90;   // CSV 데이터의 기간 — 일일 평균 계산용

// 진열대 부족 판단 — 일평균 sales × 안전일수 (기본 3일치).
// qty < min/2 → 긴급, qty < min → 부족, else 정상.
const SAFE_DAYS = 3;
function minQtyFor(code){
  const dailyAvg = (SALES_INDEX[code] || 0) / SOURCE_DAYS;
  return Math.max(Math.round(dailyAvg * SAFE_DAYS), 2);
}
function statusOf(code){
  const s = STATE[code];
  if (!s || typeof s.qty !== 'number') return 'unset';
  const min = minQtyFor(code);
  if (s.qty < min/2) return 'crit';
  if (s.qty < min) return 'low';
  return 'ok';
}

function $(id){ return document.getElementById(id); }
function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

async function loadTop500(){
  // 지점별 데이터 — top500/<BRANCH>.json. 없으면 빈 상태 + 안내.
  TOP500 = []; SALES_INDEX = {};
  if (!BRANCH) { $('statLine').textContent = '지점을 먼저 선택하세요'; return; }
  try {
    const r = await fetch(`./top500/${BRANCH}.json?t=` + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    TOP500 = d.items || [];
    TOP500.forEach(p => { SALES_INDEX[p.code] = p.qty; });
    const branchObj = BRANCHES.find(b => b.id === BRANCH);
    const branchLbl = branchObj ? (branchObj[LANG]||branchObj.ko) : BRANCH;
    $('statLine').innerHTML =
      `📍 ${escHtml(branchLbl)} · ${TOP500.length}개 상품 · 매출량 ${(d.coverageQty*100).toFixed(0)}% / 매출액 ${(d.coverageRevenue*100).toFixed(0)}% 커버`;
  } catch(e) {
    const branchObj = BRANCHES.find(b => b.id === BRANCH);
    const branchLbl = branchObj ? (branchObj[LANG]||branchObj.ko) : BRANCH;
    $('statLine').innerHTML = `<span style="color:#dc2626;font-weight:700">⚠️ ${escHtml(branchLbl)} 지점 데이터 없음 — CSV 업로드 후 빌드 필요</span>`;
    console.warn('[top500] no data for', BRANCH, e);
  }
}

async function loadState(){
  if (!BRANCH) return;
  try {
    const r = await fetch(`${FB_DB}/inventory/top500/${BRANCH}.json?t=` + Date.now(), { cache:'no-store' });
    STATE = (r.ok && await r.json()) || {};
  } catch(e) { STATE = {}; console.warn(e); }
}

async function saveState(code, qty){
  if (!BRANCH || !ME) { showToast('이름·지점 확인 필요'); return; }
  const entry = { qty, ts: Date.now(), by: ME.name||'', status: 'manual' };
  STATE[code] = entry;
  try {
    await fetch(`${FB_DB}/inventory/top500/${BRANCH}/${encodeURIComponent(code)}.json`, {
      method:'PUT',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify(entry)
    });
  } catch(e) { console.warn(e); showToast('저장 실패 — 네트워크 확인'); }
}

function setFilter(f, el){
  FILTER = f;
  document.querySelectorAll('.kpi').forEach(k => k.classList.toggle('active', el === k));
  render();
}

function render(){
  computeKpis();
  const q = String(QUERY||'').trim().toLowerCase();
  let list = TOP500.slice();
  if (q) {
    list = list.filter(p =>
      String(p.name||'').toLowerCase().includes(q) ||
      String(p.code||'').toLowerCase().includes(q) ||
      String(p.cat||'').toLowerCase().includes(q));
  }
  if (FILTER !== 'all') list = list.filter(p => statusOf(p.code) === FILTER);
  if (!list.length){
    if (TOP500.length === 0) {
      const branchObj = BRANCHES.find(b => b.id === BRANCH);
      const branchLbl = branchObj ? (branchObj[LANG]||branchObj.ko) : BRANCH;
      $('list').innerHTML = `<div class="empty">
        <div class="emoji">📥</div>
        <div style="font-size:1.05em;font-weight:700;color:#1a5c3a;margin-bottom:8px">${escHtml(branchLbl)} 데이터 미등록</div>
        <div style="line-height:1.6">Vela POS 에서 위판매순.csv 다운로드 후<br>
        매니저에게 전달하면 등록됩니다.<br>
        <span style="color:#9ca3af;font-size:.88em">다른 지점 선택해 보세요 ↑</span></div>
      </div>`;
    } else {
      $('list').innerHTML = `<div class="empty"><div class="emoji">✨</div>해당 항목 없음</div>`;
    }
    return;
  }
  const html = list.map(p => renderRow(p)).join('');
  $('list').innerHTML = html;
}

function computeKpis(){
  let crit=0, low=0, ok=0, unset=0;
  TOP500.forEach(p => {
    const s = statusOf(p.code);
    if (s==='crit') crit++;
    else if (s==='low') low++;
    else if (s==='ok') ok++;
    else unset++;
  });
  $('kpiCrit').textContent = crit;
  $('kpiLow').textContent = low;
  $('kpiOk').textContent = ok;
  $('unsetBtn').textContent = `⬜ 미점검 ${unset}`;
}

function renderRow(p){
  const s = STATE[p.code];
  const status = statusOf(p.code);
  const qty = s && typeof s.qty === 'number' ? s.qty : null;
  const min = minQtyFor(p.code);
  const dailyAvg = (p.qty || 0) / SOURCE_DAYS;
  const rankCls = p.rank <= 10 ? 'top10' : p.rank <= 50 ? 'top50' : '';
  const statusLbl = {crit:'긴급',low:'부족',ok:'정상',unset:'미점검'}[status];
  const qHtml = qty === null
    ? `<div class="qval unset">—</div>`
    : `<div class="qval">${qty}</div>`;
  return `<div class="item-row ${status}" onclick="openQtyOv('${escHtml(p.code)}')">
    <div class="rank ${rankCls}">#${p.rank}</div>
    <div class="body">
      <div class="name">${escHtml(p.name)}</div>
      <div class="meta">
        <span>#${escHtml(p.code)}</span>
        <span class="cat">${escHtml(p.cat||'')}</span>
        <span class="sales">📊 90일 ${p.qty}개</span>
        <span>일평균 ${dailyAvg.toFixed(1)}/일 · 안전 ${min}개</span>
      </div>
    </div>
    <div class="qbox">
      ${qHtml}
      <div class="qstatus ${status}">${statusLbl}</div>
    </div>
  </div>`;
}

// ============== Numpad Modal ==============
let CUR_CODE = null;
let NUMPAD_VAL = '';
function openQtyOv(code){
  CUR_CODE = code;
  const p = TOP500.find(x => x.code === code);
  if (!p) return;
  const s = STATE[code];
  NUMPAD_VAL = s && typeof s.qty === 'number' ? String(s.qty) : '';
  $('qtyProdName').textContent = p.name;
  const min = minQtyFor(code);
  const dailyAvg = (p.qty || 0) / SOURCE_DAYS;
  $('qtyProdMeta').textContent = `#${p.code} · ${p.cat} · 일평균 ${dailyAvg.toFixed(1)}개 · 안전선 ${min}개`;
  $('qtyDisp').textContent = NUMPAD_VAL || '0';
  $('qtyLastCheck').textContent = s
    ? `최근 체크: ${s.by||'?'} · ${new Date(s.ts).toLocaleString('ko-KR')}`
    : '아직 점검 기록 없음';
  $('qtyOv').classList.add('show');
}
function closeQtyOv(){ $('qtyOv').classList.remove('show'); CUR_CODE = null; NUMPAD_VAL = ''; }
function numpadAdd(d){
  if (NUMPAD_VAL === '0') NUMPAD_VAL = '';
  if (NUMPAD_VAL.length >= 4) return;
  NUMPAD_VAL += d;
  $('qtyDisp').textContent = NUMPAD_VAL || '0';
}
function numpadSet(n){
  NUMPAD_VAL = String(n);
  $('qtyDisp').textContent = NUMPAD_VAL;
}
function numpadClear(){
  NUMPAD_VAL = NUMPAD_VAL.slice(0, -1);
  $('qtyDisp').textContent = NUMPAD_VAL || '0';
}
async function saveQty(){
  if (!CUR_CODE) return;
  const n = parseInt(NUMPAD_VAL, 10);
  if (isNaN(n) || n < 0) { showToast('숫자 입력 필요'); return; }
  await saveState(CUR_CODE, n);
  const min = minQtyFor(CUR_CODE);
  let msg;
  if (n === 0) msg = `🔴 ${CUR_CODE} — 품절 기록됨`;
  else if (n < min/2) msg = `🔴 ${CUR_CODE} — 긴급 (${n}개, 안전선 ${min})`;
  else if (n < min) msg = `🟡 ${CUR_CODE} — 부족 (${n}개)`;
  else msg = `🟢 ${CUR_CODE} — 정상 (${n}개)`;
  showToast(msg);
  closeQtyOv();
  render();
}
window.openQtyOv = openQtyOv;
window.closeQtyOv = closeQtyOv;
window.numpadAdd = numpadAdd;
window.numpadSet = numpadSet;
window.numpadClear = numpadClear;
window.saveQty = saveQty;
window.setFilter = setFilter;

// ============== Barcode scan ==============
function startScan(){
  // 간단 버전: ZXing/QuaggaJS 없이 기존 lookup.html 스캐너 페이지로 보낼 수도 있음
  const code = prompt('📷 바코드 입력 (스캐너 없으면 직접):');
  if (!code) return;
  const trimmed = code.trim();
  const hit = TOP500.find(p => p.code === trimmed || p.code.endsWith(trimmed));
  if (hit) { openQtyOv(hit.code); }
  else {
    if (confirm(`🔍 "${trimmed}" — Top 500 에 없음.\n전체 카탈로그 검색하려면 OK.`)) {
      window.location.href = './lookup.html?q=' + encodeURIComponent(trimmed);
    }
  }
}
window.startScan = startScan;

// ============== Init ==============
function init(){
  try { ME = JSON.parse(localStorage.getItem('chat.me')||'null'); } catch(_){ ME = null; }
  // Branch selector
  const sel = $('branchSel');
  sel.innerHTML = BRANCHES.map(b => `<option value="${b.id}">${b[LANG]||b.ko||b.id}</option>`).join('');
  const def = (ME && ME.branch && ME.branch !== '*') ? ME.branch : (localStorage.getItem('hub.branch') || 'HOLLYWOOD');
  if (BRANCHES.find(b => b.id === def)) sel.value = def;
  BRANCH = sel.value;
  sel.addEventListener('change', async () => {
    BRANCH = sel.value;
    try { localStorage.setItem('hub.branch', BRANCH); } catch(_){}
    // 🐛 FIX: branch 변경 시 그 지점의 top500 JSON 도 새로 로드 (이전엔 state 만 갱신)
    await loadTop500();
    await loadState();
    render();
  });
}
(async function(){
  init();
  await loadTop500();
  await loadState();
  render();
})();
</script>
