<style>
/* Layout: printed-checklist grid — two products per line, each with five store columns (store names on top). Category bands span the line. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --line:#cdd5d1; --fg:#17201c; --muted:#5d6b64;
  --band:#8a1c4a; --band-fg:#ffffff;
  --accent:#23395d; --accent-fg:#ffffff;
  --ok:#23804a; --ok-bg:#d9efe1; --warn:#a8660e; --warn-bg:#fbefd9; --bad:#c2341d; --bad-bg:#fbe0da; --none:#98a39e;
  --star:#c98a0b; --mine:#fff6d6;
  --s-hollywood:#2e7d4f; --s-lasolas:#c9771c; --s-pembroke:#7a4fb0; --s-coral:#c2414b; --s-miami:#2a8a93; --s-wpb:#2f5fae;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a211e; --sunk:#242d29; --line:#3a4842; --fg:#e7ede9; --muted:#9aaba2;
  --band:#a8406b; --band-fg:#ffffff; --accent:#9db7e3; --accent-fg:#0f1a2c;
  --ok:#6cc792; --ok-bg:#1c3426; --warn:#e9b25a; --warn-bg:#3a2d15; --bad:#f08a75; --bad-bg:#3d1f19; --none:#64716b; --star:#f0c050; --mine:#33301c;
  --s-hollywood:#5fbf86; --s-lasolas:#e9a04c; --s-pembroke:#b38ce6; --s-coral:#ec7a83; --s-miami:#5cc3cc; --s-wpb:#7fa6eb;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211e; --sunk:#242d29; --line:#3a4842; --fg:#e7ede9; --muted:#9aaba2;
  --band:#a8406b; --band-fg:#ffffff; --accent:#9db7e3; --accent-fg:#0f1a2c;
  --ok:#6cc792; --ok-bg:#1c3426; --warn:#e9b25a; --warn-bg:#3a2d15; --bad:#f08a75; --bad-bg:#3d1f19; --none:#64716b; --star:#f0c050; --mine:#33301c;
  --s-hollywood:#5fbf86; --s-lasolas:#e9a04c; --s-pembroke:#b38ce6; --s-coral:#ec7a83; --s-miami:#5cc3cc; --s-wpb:#7fa6eb;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--f-display);font-size:20px;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.conn{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--none)} .conn.on i{background:var(--ok)}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{padding-block:12px 110px}

.setup{padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 9px;min-height:36px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 10px;min-height:36px;font-weight:500;display:flex;align-items:center;gap:6px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

.dtabs{display:flex;gap:5px;overflow-x:auto;padding-block:10px 6px}
.dtabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;text-align:left;line-height:1.2}
.dtabs button b{display:block;font-size:13.5px}
.dtabs button span{font-size:11.5px;color:var(--muted)}
.dtabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.legend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-block:4px 8px}
.lg{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;border-top:4px solid var(--c);min-width:0}
.lg b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .ini{font-family:var(--f-display);color:var(--c);font-size:17px;margin-right:6px}
.lg .num{font-size:12.5px}
.lg small{display:block;font-size:11px;color:var(--muted)}
.lg .x{color:var(--bad);font-weight:700}
.lg.sent small{color:var(--ok);font-weight:600}
.lg.mine{background:var(--mine)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tools .seg button{min-height:32px;font-size:12.5px;padding:3px 10px}
.tools .count{margin-left:auto;font-size:12.5px;color:var(--muted)}

/* the checklist sheet */
.sheet{border:1px solid var(--line);background:var(--surface);overflow:clip;border-radius:6px}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.band{grid-column:1/-1;background:var(--band);color:var(--band-fg);font-weight:700;font-size:13px;padding:5px 10px;display:flex;gap:10px;align-items:baseline}
.band span{font-weight:500;font-size:11.5px;opacity:.85;margin-left:auto}
/* 2026-10-08 지점 6칸을 빼고 [지금 수량][상태] 둘로 바꿨다.
   남의 지점 칸 옆에서 체크하다 잘못 누르던 문제가 사라지고, 칸이 넓어져 폰에서 누르기 쉽다.

.it{display:grid;grid-template-columns:26px 64px minmax(0,1fr) 62px 62px;border-bottom:1px solid var(--line);min-height:68px}
.it:nth-child(odd of .it){border-right:2px solid var(--line)}
.it>*{border-right:1px solid var(--line);min-width:0}
.it>*:last-child{border-right:0}
.it .n{display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted)}
.it .p{display:flex;align-items:center;justify-content:center;padding:3px}
.it .p img{width:58px;height:58px;object-fit:cover;border-radius:3px;display:block}
.it .p .no{font-size:10px;color:var(--muted);text-align:center}
.it .t{padding:5px 8px;display:flex;flex-direction:column;justify-content:center}
.it .t b{font-size:12.5px;line-height:1.2;text-transform:uppercase}
.it .t .k{font-size:12px;color:var(--muted)}
.it .t .m{font-size:10.5px;color:var(--muted);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .t .star{color:var(--star)}
.sc{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:700;padding:0;position:relative;line-height:1}
.sc small{font-family:var(--f-body);font-size:9.5px;font-weight:700;margin-top:3px;letter-spacing:-.3px;white-space:nowrap;color:var(--muted)}
.sc.o{background:var(--ok-bg)}.sc.w{background:var(--warn-bg)}.sc.x{background:var(--bad-bg)}
.sc.o small{color:var(--ok)}.sc.w small{color:var(--warn)}.sc.x small{color:var(--bad)}
.sc:not(.o):not(.w):not(.x):not(.n)::after{content:"";width:17px;height:17px;border:2px dashed var(--line);border-radius:5px}
/* 지금 수량 */
.qw{display:flex;align-items:center;justify-content:center;padding:4px}
.qi{width:100%;max-width:52px;text-align:center;font-family:var(--f-mono);font-size:16px;font-weight:600;padding:7px 2px;border:1px solid var(--line);border-radius:7px;background:var(--sunk)}
.qi:focus{background:var(--surface);border-color:var(--accent)}
/* 판매량 · 기준 · 연결 */
.sl{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:3px}
.sl .sv{font-size:10.5px;font-weight:700;color:#075985;background:#e0f2fe;border:1px solid #7dd3fc;border-radius:6px;padding:1px 5px}
.sl .pv{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.sl .pv em{font-style:normal;opacity:.6;margin-left:3px}
.sl .lk{font-size:10px;font-weight:700;color:var(--accent);background:none;border:1px dashed var(--line);border-radius:6px;padding:1px 5px}

/* 🔗 POS 연결 창 */
.pop.link{grid-template-columns:1fr}
.pop.link #link-q{width:100%;margin-top:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.pop .lr{max-height:40vh;overflow:auto;margin-top:8px;display:grid;gap:4px;font-size:12px;color:var(--muted)}
.pop .lr button{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;text-align:left;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pop .lr button b{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop .lr button .num{font-size:11px;color:var(--muted)}
.pop .lr button em{font-style:normal;font-size:11px;font-weight:700;color:#075985;white-space:nowrap}
.pop .lr .none{padding:8px}
.pop .lhint{margin-top:6px;font-size:11px;font-weight:700;color:var(--muted)}
.pop .lr .more{display:block;grid-template-columns:none;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--sunk);border-style:dashed}
.pop .lr .oth{display:grid;gap:4px;opacity:.8}
/* 기준 수량 칸 */
.pop .pr{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;padding:8px 10px;background:var(--sunk);border-radius:8px}
.pop .pr label{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:700}
.pop .pr input{width:68px;text-align:center;font-family:var(--f-mono);font-size:15px;font-weight:700;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.pop .pr .hint{font-size:11.5px;color:var(--muted);flex:1 1 180px}
.stat.low b{color:var(--warn)}
.iss{font-size:11.5px;line-height:1.35;color:var(--bad);margin-top:3px;font-weight:600}
.iss .q{font-weight:400;font-style:italic}
.iss .c{display:inline-block;min-width:13px;text-align:center;border-radius:3px;background:var(--c);color:var(--surface);font-family:var(--f-display);font-weight:400;font-size:11px;margin-right:3px;padding:0 2px}
.issues{margin-bottom:10px;border-color:var(--bad)}
.issues.none{border-color:var(--ok);color:var(--ok);padding:9px 14px;font-weight:600}
.ih{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:9px 14px;background:var(--bad-bg);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0}

.ih span{font-size:12.5px;color:var(--muted)}
.ir{display:grid;grid-template-columns:48px minmax(140px,220px) minmax(0,1fr);gap:10px;padding:7px 14px;border-top:1px solid var(--line);align-items:start;cursor:pointer}
.ir:first-of-type{border-top:0}

.ir .in b{display:block;font-size:12.5px;text-transform:uppercase;line-height:1.2}
.ir .in span{font-size:12px;color:var(--muted)}
.ir .in em{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.ist{display:flex;flex-direction:column;gap:4px;min-width:0}
.ic{font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.ic .c{display:inline-block;min-width:18px;text-align:center;border-radius:4px;background:var(--c);color:var(--surface);font-family:var(--f-display);font-size:13px;margin-right:6px;padding:0 3px}
.ic .rs{color:var(--bad);font-weight:700}
.ic .q{font-style:italic}
.ic small{color:var(--muted);font-size:11.5px}
.it.flash{outline:3px solid var(--bad);outline-offset:-3px}
@media (max-width:700px){.ir{grid-template-columns:44px minmax(0,1fr)}.ist{grid-column:1/-1}}
.sc.mine{background:var(--mine)}
.sc.mine:empty::after{content:"";width:16px;height:16px;border:2px solid var(--muted);border-radius:3px}
.sc:not(.mine):empty::after{content:"";width:12px;height:12px;border:1.5px solid var(--line);border-radius:2px}
.sc.o{background:var(--ok-bg);color:var(--ok)}
.sc.x{background:var(--bad-bg);color:var(--bad)}
.sc.n{color:var(--none);font-size:13px}
.sc.mine.o,.sc.mine.x{box-shadow:inset 0 0 0 2px var(--c)}
.sc[disabled]{cursor:default}
.hd{display:grid;grid-template-columns:26px 64px minmax(0,1fr) 62px 62px;background:var(--sunk);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:5}
.hd .sh2{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;font-size:10.5px;font-weight:700;line-height:1.25;text-align:center;color:var(--muted)}
.hd .sh2 small{font-size:9px;font-weight:600;opacity:.75}
.hd:nth-child(odd of .hd){border-right:2px solid var(--line)}
.hd>*{border-right:1px solid var(--line);padding:4px 2px;font-size:10.5px;font-weight:700;color:var(--muted);display:flex;align-items:flex-end;justify-content:center}
.hd>*:last-child{border-right:0}
.hd .sh{align-items:center;justify-content:center;padding:4px 0;color:var(--c);border-top:3px solid var(--c);font-family:var(--f-display);font-size:22px;font-weight:400;line-height:1}
.hd .sh.mine{background:var(--mine)}
.hd .tt{justify-content:flex-start;padding-left:8px}

.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;width:min(520px,calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px}
.pop img{width:72px;height:72px;object-fit:cover;border-radius:6px}
.pop h4{margin:0;font-size:14px}
.pop .sub{font-size:12px;color:var(--muted)}
.pop .rs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px}
.pop .rs button{border:1px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:999px;padding:4px 10px;font-size:12.5px}
.pop .rs button[aria-pressed="true"]{background:var(--bad);color:var(--surface)}
.pop input{grid-column:1/-1;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;width:100%}
.pop .row{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.pop .row button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 12px;font-weight:600}
.pop .row .go{margin-left:auto;background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.pop .why{grid-column:1/-1;color:var(--bad);font-size:13px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:8px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font-family:var(--f-mono);font-size:18px}
.stat span{font-size:11px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.saved{font-size:12px;color:var(--muted)}
.primary{margin-left:auto;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;border-radius:8px;padding:9px 18px;min-height:44px;line-height:1.15}
.primary small{display:block;font-weight:500;font-size:11px;opacity:.85}
.primary:disabled{opacity:.45;cursor:not-allowed}
.primary.done{background:var(--ok);color:var(--surface)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}

/* summary */
.ohead{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.ohead h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:2px 0 0}
.ohead input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{padding:10px 14px} .kpi b{display:block;font-family:var(--f-mono);font-size:24px} .kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}
.mxw{overflow-x:auto;margin-top:12px}

.mx th,.mx td{padding:7px;border-bottom:1px solid var(--line);text-align:center;font-size:13px}
.mx thead th{font-size:12px;color:var(--muted)}

.cell{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:90px;padding:4px 6px;display:inline-flex;flex-direction:column;align-items:center;line-height:1.2}
.cell b{font-family:var(--f-mono)} .cell small{font-size:11px;color:var(--muted)}
.cell.done{border-color:var(--ok);background:var(--ok-bg)} .cell.prog{border-color:var(--warn);background:var(--warn-bg)}
.cell .nb{color:var(--bad);font-weight:700}

  .rows{grid-template-columns:1fr}
  .hd.second{display:none}

}

  .it,.hd{grid-template-columns:52px minmax(0,1fr) repeat(6,32px)}

  .tabs{margin-left:0;width:100%} .tabs button{flex:1}

}

<script>
const STORES=[{key:'coral',name:'Coral Springs'},{key:'hollywood',name:'Hollywood'},{key:'lasolas',name:'Las Olas'},{key:'miami',name:'Miami'},{key:'pembroke',name:'Pembroke Pines'},{key:'wpb',name:'West Palm Beach'}];
const DEPTS=[{key:'produce',en:'Produce',ko:'야채·청과'},{key:'beef',en:'Beef',ko:'소고기'},{key:'pork',en:'Pork',ko:'돼지고기'},{key:'poultry',en:'Poultry',ko:'닭고기'},{key:'seafood',en:'Seafood',ko:'수산'},{key:'banchan',en:'Banchan & Kimchi',ko:'반찬·김치'},{key:'hotfood',en:'Dosirak & Hot Food',ko:'도시락·즉석'}];
const REASONS=[['out','Out of stock','결품'],['delivery','Waiting for delivery','배송 대기 중'],['nodisp','Not displayed','미진열'],['quality','Bad quality','품질 불량'],['price','No price tag','가격표 없음'],['label','Wrong label / date','라벨·날짜']];
/* 🟢🟡🔴 2026-10-08 전무님: "✓/✗ 만으로는 떨어지기 전에 못 잡는다. 얼마나 있는지 적게 하자."
   한 번 누르는 건 그대로 두고 뜻만 셋으로 나눈다. 빈칸 → 🟢 충분 → 🟡 적음 → 🔴 없음 → 빈칸.
   옛 자료의 'o'(=✓)·'x'(=✗)·'n'(미취급) 은 그대로 읽힌다. 'w'(적음) 만 새로 생겼다. */
const LV={o:{ic:'🟢',en:'Enough',ko:'충분'},w:{ic:'🟡',en:'Low',ko:'적음'},x:{ic:'🔴',en:'None',ko:'없음'},n:{ic:'—',en:'Not carried',ko:'미취급'}};
const NEXT={'':'o',o:'w',w:'x',x:''};
const SHORT={out:'결품',delivery:'배송대기',nodisp:'미진열',quality:'품질',price:'가격표',label:'라벨'};
const RS=Object.fromEntries(REASONS.map(r=>[r[0],r]));
const S=Object.fromEntries(STORES.map(s=>[s.key,s]));
const DK=Object.fromEntries(DEPTS.map(d=>[d.key,d]));
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const docId=(date,store,dept)=>`${date}_${store}_${dept}`;
const fmtTime=t=>t?new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'';
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3000)}

/* catalog */
const CAT={};
async function loadCat(k){
  if(CAT[k])return CAT[k];
  if(window.__CAT&&window.__CAT[k])return (CAT[k]=window.__CAT[k]);
  CAT[k]=fetch(`key-fresh-cat/${k}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>(CAT[k]=j.items)).catch(()=>{delete CAT[k];return null});
  return CAT[k];
}
const catOf=k=>Array.isArray(CAT[k])?CAT[k]:null;

/* ===== 판매량 · 기준 수량 · POS 연결 =========================================
   2026-10-08 전무님: "적음·없음 기준이 애매모호. 여기에 판매량 넣을 수 있나?"
   두 갈래로 간다.
     ① POS 와 이어진 품목 → 하루 평균 판매량이 있으니 기준을 앱이 센다 (이틀치 미만이면 적음)
     ② 아직 안 이어진 품목 → 담당자가 '최소 수량' 을 한 번만 정한다
   읽는 곳(모두 inventory 아래라 규칙을 다시 게시할 필요가 없다)
     sales/{지점}      {코드:[7일수량,30일수량], _d:[7일자료일수,30일자료일수]}  ← pos_sales_push.js
     salesNames/{지점} {코드:이름}  — 🔗 연결 창을 열 때만 받는다 (371KB 라 평소엔 안 받는다)
     poslink/{품목id}  {c:POS코드}  — 체인 공통. 한 번 이으면 모두가 쓴다
     par/{지점}_{부서} {품목id:최소수량} — 지점마다 다르다 */
let SALES=null, SNAMES=null, LINK={}, PAR={};
/* 🔗 연결 창에서 그 부서 물건만 먼저 보여 주기.
   2026-10-08 전무님: "야채는 야채에서만 골라야지? 왜 전 품목?"
     — 'Avocado' 로 찾으니 아보카도 오일·연어롤·까는 도구가 나왔다.
   POS 코드가 부서마다 갈려 있다 (할리우드 판매 자료로 확인):
     야채·청과  1~3자리 저울 PLU + 1xxx   (12 POTATO, 51 LEMON, 1625 CARROTS)
     정육·닭    9xxx                      (9101 BEEF BRISKET, 9078 CHICKEN BREAST)
     수산       2xxx·3xxx·6xxx·7xxx       (6003 MACKEREL, 3099 KING TIGER SHRIMP)
     반찬·김치  4xxx                      (4001 KIMCHI, 4057 CUCUMBER KIMCHI)
     도시락·즉석 3xxx·4xxx + 자체 바코드    (4520 KIMBAP, 20000011 삼각김밥)
   맞는 것을 위에 모아 주고, 못 찾으면 '전 품목에서 찾기' 로 풀 수 있게 둔다. */
const DEPT_CODE={
  produce:/^(\d{1,3}|1\d{3})$/,
  beef:/^9\d{3}$/, pork:/^9\d{3}$/, poultry:/^(9\d{3}|2\d{4})$/,
  seafood:/^[2367]\d{3}$/,
  banchan:/^4\d{3}$/,
  hotfood:/^[34]\d{3}$/,
};
let LINKALL=false;   // '전 품목에서 찾기' 를 켰나
const dayAvg=code=>{ if(!SALES||!code)return null; const r=SALES[code]; if(!r)return null;
  const d7=(SALES._d&&SALES._d[0])||1, d30=(SALES._d&&SALES._d[1])||1;
  const a7=r[0]/d7, a30=r[1]/d30; return {a:Math.max(a7,a30*0.6), a7, a30, s:r[0], m:r[1], d7, d30}; };
/* 기준 = 담당자가 정한 값이 있으면 그것, 없으면 하루 평균 × 2일치 (올림, 최소 1) */
function parOf(id){ if(PAR[id]!=null) return {v:PAR[id], from:'set'};
  const s=dayAvg(LINK[id]); if(s&&s.a>0) return {v:Math.max(1,Math.ceil(s.a*2)), from:'sales'};
  return {v:null, from:''}; }
/* 수량을 적었으면 상태를 앱이 고른다 — 사람이 직접 누른 것은 건드리지 않는다 */
function levelFor(id,q){ const p=parOf(id); if(q==null||p.v==null) return null;
  if(q<=0) return 'x'; if(q<p.v) return 'w'; return 'o'; }
async function loadSide(){
  if(!db||!G.my) return;
  try{ const d=await db.doc('sales/'+G.my).get(); SALES=d.exists?d.data():null; }catch(e){ SALES=null; }
  try{ const d=await db.doc('par/'+G.my+'_'+G.dept).get(); PAR=(d.exists&&d.data())||{}; delete PAR._id; }catch(e){ PAR={}; }
  try{ const d=await db.doc('poslink/'+G.dept).get(); LINK=(d.exists&&d.data())||{}; delete LINK._id; }catch(e){ LINK={}; }
}
async function saveSide(col,id,obj){ if(!db)return; try{ await db.doc(col+'/'+id).set(obj); }catch(e){ toast('저장 실패 · could not save'); } }
const byId=k=>{const c=catOf(k);if(!c)return {};return c._ix||(c._ix=Object.fromEntries(c.map(x=>[x.id,x])))};
function counts(items,s){let o=0,w=0,x=0,n=0;for(const it of items){const v=s?.[it.id];if(v==='o')o++;else if(v==='w')w++;else if(v==='x')x++;else if(v==='n')n++}
  return {o,w,x,n,u:items.length-o-w-x-n,t:items.length,order:w+x}}

/* runtime */
let db=null,user=null,uid=null,isOwner=false,canWrite=null;
function setConn(on,m){$('#conn').classList.toggle('on',on);$('#conn').lastElementChild.textContent=m}
(async()=>{
  if(!window.claude||!claude.use){setConn(false,'Offline preview · 저장 안 됨');return}
  try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
  if(user){uid=await user.id();isOwner=await user.isOwner();canWrite=await user.can('data.write')}
  if(!db){setConn(false,'Sign in to save · 로그인 필요');renderBar();return}
  setConn(true,isOwner?'Owner · 실시간':'Live · 실시간 연결');
  subscribe();
})();

/* state */
const P=lsGet('kfd3-prefs')||{};
const G={date:today(),my:P.store||'',name:P.name||'',role:P.role||'Store Manager',dept:P.dept||'produce',filter:'all',docs:{},ready:false,unsub:null};
let MY=null,pending=false,saveT=null,writing=null,status='';
const myKey=()=>docId(G.date,G.my,G.dept);
function blankMine(){return {s:{},r:{},n:{},t:{},q:{},done:false}}
function syncMine(){const d=G.docs[myKey()];MY=d?{s:{...(d.s||{})},r:JSON.parse(JSON.stringify(d.r||{})),n:{...(d.n||{})},t:{...(d.t||{})},q:{...(d.q||{})},done:!!d.done,doneAt:d.doneAt}:blankMine()}
function docFor(store,dept=G.dept){if(store===G.my&&dept===G.dept&&MY)return MY;return G.docs[docId(G.date,store,dept)]}

function subscribe(){
  if(!db)return;if(G.unsub)G.unsub();G.ready=false;
  G.unsub=db.collection('checks').where('date','==',G.date).onSnapshot(snap=>{
    G.docs={};for(const d of snap.docs)G.docs[d.id]=d.data();G.ready=true;
    if(!pending)syncMine();
    paintCells();renderLegend();renderBar();renderDtabs();if(!$('#v-sum').hidden)renderSum();
  },()=>{G.ready=true});
}

/* tabs */
function setTab(t){for(const b of document.querySelectorAll('.tabs button'))b.setAttribute('aria-selected',b.dataset.tab===t);
  $('#v-check').hidden=t!=='check';$('#v-sum').hidden=t!=='sum';$('#bar').hidden=t!=='check';closePop();if(t==='sum')renderSum()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)});

/* ================= DAILY CHECK ================= */
function renderCheck(){
  $('#v-check').innerHTML=`<div class="card setup">
    <div class="field"><span class="lbl">My store · 내 지점 (I check this column)</span><div class="seg">${STORES.map(s=>`<button type="button" data-my="${s.key}" aria-pressed="${G.my===s.key}"><span class="dot" style="background:var(--s-${s.key})"></span>${esc(s.name)}</button>`).join('')}<button type="button" data-my="" aria-pressed="${!G.my}">View only · 보기만</button></div></div>
    <div class="field"><label class="lbl" for="c-date">Date · 날짜</label><input type="date" id="c-date" value="${G.date}"></div>
    <div class="field"><span class="lbl">Role · 직책</span><div class="seg">${['Store Manager','Supervisor'].map(r=>`<button type="button" data-role="${r}" aria-pressed="${G.role===r}">${r}</button>`).join('')}</div></div>
    <div class="field"><label class="lbl" for="c-name">Name · 이름</label><input id="c-name" value="${esc(G.name)}" placeholder="Your name"></div>
  </div>
  <nav class="dtabs" id="dtabs" role="tablist"></nav>
  <div class="legend" id="legend"></div>
  <div id="issues"></div>
  <div class="tools" id="tools"></div>
  <div id="sheet"></div>`;
  renderDtabs();renderLegend();renderSheet();renderBar();
}
function renderDtabs(){
  const el=$('#dtabs');if(!el)return;
  el.innerHTML=DEPTS.map(d=>{const items=catOf(d.key);let sent=0,x=0;
    for(const s of STORES){const doc=docFor(s.key,d.key);if(doc?.done)sent++;if(items&&doc)x+=counts(items,doc.s).x}
    return `<button role="tab" data-dept="${d.key}" aria-selected="${d.key===G.dept}"><b>${d.en} · ${d.ko}</b><span>${items?items.length+' items':'…'} · ${sent}/${STORES.length} sent${x?` · <span style="color:var(--bad);font-weight:700">${x} ✗</span>`:''}</span></button>`}).join('');
}
function renderLegend(){
  const el=$('#legend');if(!el)return;const items=catOf(G.dept);
  el.innerHTML=STORES.map(s=>{const doc=docFor(s.key);const c=items?counts(items,doc?.s):null;
    const st=!doc?'Not started · 미시작':doc.done?`✓ Sent ${fmtTime(doc.doneAt)} · 보고 완료`:'In progress · 진행 중';
    return `<div class="lg ${doc?.done?'sent':''} ${G.my===s.key?'mine':''}" style="--c:var(--s-${s.key})"><b><span class="ini">${s.name[0]}</span>${esc(s.name)}${G.my===s.key?' · ME':''}</b>
      <span class="num">${c?`${c.o+c.x+c.n}/${c.t}`:'—'}</span>${c?.x?` <span class="x">${c.x} ✗</span>`:''}<small>${st}${doc?.name?' · '+esc(doc.name):''}</small></div>`}).join('');
}
async function renderSheet(){
  const el=$('#sheet');if(!el)return;
  let items=catOf(G.dept);
  if(!items){el.innerHTML=`<div class="card empty">Loading photos… · 사진 불러오는 중</div>`;items=await loadCat(G.dept);
    if(!items){el.innerHTML=`<div class="card empty">Photos could not load. Refresh the page. · 새로고침 해 주세요.</div>`;return}
    renderDtabs();renderLegend();renderBar()}
  const f=G.filter;
  const lvOf=it=>docFor(G.my)?.s?.[it.id];
  const shown=items.filter(it=>f==='all'||(f==='x'&&['x','w'].includes(lvOf(it)))||(f==='todo'&&G.my&&!MY?.s?.[it.id])||(f==='star'&&it.star)||(f==='nolink'&&!LINK[it.id]));
  const myc=G.my?counts(items,MY?.s):null;
  const nolink=items.filter(it=>!LINK[it.id]).length;
  $('#tools').innerHTML=`<div class="seg">${[['all','전체 · All'],['x',`🛒 오더할 것${myc?` (${myc.order})`:''}`],...(G.my?[['todo',`내 미확인 (${myc.u})`]]:[]),['star','★ 필수'],['nolink',`🔗 POS 미연결 (${nolink})`]].map(([k,l])=>`<button type="button" data-filter="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
    <span class="count">${shown.length} / ${items.length}개 · ${G.my?'한 번 누를 때마다 🟢 충분 → 🟡 적음 → 🔴 없음 · 수량을 적으면 저절로 잡힙니다':'내 지점을 고르면 체크할 수 있습니다'}</span>`;
  const head=cls=>`<div class="hd ${cls}"><span class="hn">#</span><span>Photo</span><span class="tt">Item · 제품</span><span class="sh2">지금 수량<br><small>Qty</small></span><span class="sh2">상태<br><small>State</small></span></div>`;
  let h=`<div class="sheet"><div class="rows">${head('')}${head('second')}`;
  if(!shown.length)h+=`<div class="band" style="background:var(--sunk);color:var(--muted)">${f==='x'?'No ✗ items in any store · 모든 지점 안됨 없음':f==='todo'?'You checked every item · 모두 확인 완료':'Nothing to show'}</div>`;
  let cat=null,n=0;
  for(const it of shown){
    if(it.cat!==cat){
      if(cat!==null&&n%2===1)h+=`<div class="it"></div>`;
      cat=it.cat;n=0;const tot=shown.filter(x=>x.cat===cat).length;
      h+=`<div class="band">${esc(cat)}<span>${tot} items</span></div>`}
    n++;
    const meta=[it.plu?`PLU ${esc(it.plu)}`:'',it.price?esc(it.price):'',(it.std||[])[0]?esc(it.std[0]):''].filter(Boolean).join(' · ');
    h+=`<div class="it" data-id="${it.id}"><span class="n num">${n}</span>
      <span class="p">${it.img?`<img src="${it.img}" alt="" loading="lazy">`:'<span class="no">No photo<br>사진 없음</span>'}</span>
      <span class="t" title="${esc((it.std||[]).join(' / '))}"><b>${it.star?'<span class="star">★ </span>':''}${esc(it.en)}</b><span class="k">${esc(it.ko)}</span>${meta?`<span class="m">${meta}</span>`:''}<span class="sl" id="sl-${it.id}"></span><span class="iss" id="iss-${it.id}"></span></span>
      <span class="qw"><input class="qi" type="text" inputmode="numeric" id="q-${it.id}" placeholder="—" aria-label="${esc(it.en)} 지금 수량"></span>
      <button type="button" class="sc" id="c-${it.id}" aria-label="${esc(it.en)} 상태"></button>
    </div>`;
  }
  if(n%2===1)h+=`<div class="it"></div>`;
  el.innerHTML=h+`</div></div>`;
  paintCells();
}
function paintCells(){
  const items=catOf(G.dept);if(!items||!$('#sheet'))return;
  const doc=docFor(G.my);const st=doc?.s||{};const qs=doc?.q||{};
  for(const it of items){
    const b=document.getElementById('c-'+it.id);if(!b)continue;
    const v=st[it.id]||'';
    const cls='sc '+v; if(b.className!==cls)b.className=cls;
    const rs0=(v==='x'||v==='w')?(doc?.r?.[it.id]||[]):[];
    const html=v?`${LV[v].ic}<small>${rs0.length?SHORT[rs0[0]]+(rs0.length>1?'+':''):LV[v].ko}</small>`:'';
    if(b.innerHTML!==html)b.innerHTML=html;
    const r=rs0.map(k=>RS[k]?.[1]||k).join(', ')+(doc?.n?.[it.id]?` — ${doc.n[it.id]}`:'');
    b.title=v?`${LV[v].en} · ${LV[v].ko}${r?' · '+r:''}`:'Unchecked · 미확인';
    // 지금 수량
    const qi=document.getElementById('q-'+it.id);
    if(qi&&document.activeElement!==qi){const want=qs[it.id]!=null?String(qs[it.id]):'';if(qi.value!==want)qi.value=want;}
    // 판매량 · 기준 · 연결
    const sl=document.getElementById('sl-'+it.id);
    if(sl){
      const code=LINK[it.id], s=dayAvg(code), p=parOf(it.id);
      let h='';
      if(s) h+=`<span class="sv">📈 하루 ${s.a.toFixed(s.a<10?1:0)}개</span>`;
      if(p.v!=null) h+=`<span class="pv" title="${p.from==='sales'?'판매량으로 앱이 잡은 값 (이틀치)':'담당자가 정한 값'}">기준 ${p.v}${p.from==='sales'?'<em>자동</em>':''}</span>`;
      if(!code) h+=`<button type="button" class="lk" data-link="${it.id}">🔗 POS 연결</button>`;
      if(sl.innerHTML!==h)sl.innerHTML=h;
    }
  }
  for(const it of items){const el=document.getElementById('iss-'+it.id);if(!el)continue;
    const html=xList(G.dept,it.id).map(x=>`<span style="--c:var(--s-${x.store})"><span class="c">${x.ini}</span>${x.rs.length?x.rs.map(k=>SHORT[k]).join('·'):'사유 미입력'}${x.note?` <span class="q">“${esc(x.note)}”</span>`:''}</span>`).join('<br>');
    if(el.innerHTML!==html)el.innerHTML=html;}
  renderIssues();
}
/* 한 품목이 🟡 적음·🔴 없음 인 지점 모으기 (현황판용). stores 를 좁히면 내 지점만 본다 */
function xList(dept,id,only){const out=[];for(const s of STORES){if(only&&s.key!==only)continue;
  const doc=docFor(s.key,dept);const v=doc?.s?.[id];if(v!=='x'&&v!=='w')continue;
  out.push({store:s.key,ini:s.name[0],name:s.name,lv:v,q:doc.q?.[id],rs:doc.r?.[id]||[],note:(doc.n?.[id]||'').trim(),who:doc.name||'',t:doc.t?.[id]||doc.updatedAt})}return out}
function chip(x){return `<div class="ic" style="--c:var(--s-${x.store})"><span class="c">${x.ini}</span><b>${esc(x.name)}</b> · ${LV[x.lv].ic} ${LV[x.lv].ko}${x.q!=null?` <b class="num">${x.q}개</b>`:''} · <span class="rs">${x.rs.length?x.rs.map(k=>RS[k]?`${RS[k][2]} ${RS[k][1]}`:k).join(', '):'사유 미입력 · no reason'}</span>${x.note?` · <span class="q">“${esc(x.note)}”</span>`:''} <small>— ${esc(x.who||'?')} ${fmtTime(x.t)}</small></div>`}
function issueRow(dept,it,xs,showDept){return `<div class="ir" data-jump="${dept}|${it.id}">${it.img?`<img src="${it.img}" alt="">`:'<span class="noimg"></span>'}
  <div class="in"><b>${esc(it.en)}</b><span>${esc(it.ko)}</span>${showDept?`<em>${DK[dept].en} · ${DK[dept].ko}</em>`:''}</div><div class="ist">${xs.map(chip).join('')}</div></div>`}
/* 🛒 오더할 것 — 내 지점에서 🔴 없음·🟡 적음 인 것만 모은다.
   2026-10-08 전무님: "없으면 오더 하라는 표시 하는 게 나을 듯해."
   다른 지점 사정은 여기 말고 현황판(Summary)에서 본다. */
function renderIssues(){
  const el=$('#issues');const items=catOf(G.dept);if(!el||!items)return;
  if(!G.my){el.innerHTML='';return}
  const rows=[];
  for(const it of items){const xs=xList(G.dept,it.id,G.my);if(xs.length)rows.push([it,xs])}
  rows.sort((a,b)=>(b[1][0].lv==='x'?1:0)-(a[1][0].lv==='x'?1:0));
  const d=DK[G.dept];
  const none=rows.filter(r=>r[1][0].lv==='x').length, low=rows.length-none;
  const html=rows.length?`<div class="card issues"><div class="ih"><b>🛒 오더할 것 · Order these — ${d.en} ${d.ko}</b><span>🔴 없음 ${none} · 🟡 적음 ${low} — 줄을 누르면 목록에서 찾아 갑니다</span></div>${rows.map(([it,xs])=>issueRow(G.dept,it,xs,false)).join('')}</div>`
    :`<div class="card issues none">✓ 오더할 것 없음 · nothing to order in ${d.en}</div>`;
  if(el.innerHTML!==html)el.innerHTML=html;
}

/* pop-up for ✗ reasons */
let POP=null;
function closePop(){POP=null;$('#pop-root').innerHTML=''}
function openPop(id,store){
  const it=byId(G.dept)[id];if(!it)return;POP={id,store};const mine=store===G.my;const doc=docFor(store);
  const v=doc?.s?.[id]||'';const rs=doc?.r?.[id]||[];const note=doc?.n?.[id]||'';
  let h=`<div class="pop" role="dialog" aria-label="${esc(it.en)}">${it.img?`<img src="${it.img}" alt="">`:'<span></span>'}
    <div><h4>${esc(it.en)}</h4><div class="sub">${esc(it.ko)} · <span class="dot" style="background:var(--s-${store})"></span> ${esc(S[store].name)}</div>
    <div class="sub">${esc((it.std||[]).join(' · '))}</div></div>`;
  if(mine){
    const p=parOf(id),sv=dayAvg(LINK[id]);
    h+=`<div class="pr">
        <label>기준 수량 · Par<input id="pop-par" type="text" inputmode="numeric" value="${p.from==='set'?p.v:''}" placeholder="${p.from==='sales'?p.v+' (자동)':'예: 6'}"></label>
        <span class="hint">${sv?`📈 하루 평균 ${sv.a.toFixed(sv.a<10?1:0)}개 — 이틀치면 ${Math.max(1,Math.ceil(sv.a*2))}개`:'판매량이 아직 안 이어져 있습니다 · 🔗 POS 연결을 하면 앱이 기준을 잡아 줍니다'}</span>
      </div>
      <div class="rs">${REASONS.map(([k,e,ko])=>`<button type="button" data-r="${k}" aria-pressed="${rs.includes(k)}">${e} · ${ko}</button>`).join('')}</div>
      <input id="pop-note" value="${esc(note)}" placeholder="What is wrong / what you did · 문제와 조치">
      <div class="row"><button type="button" data-pv="n">Not carried · 미취급</button><button type="button" data-pv="">Clear · 지우기</button>${LINK[id]?`<button type="button" data-link="${id}">🔗 연결 바꾸기</button>`:`<button type="button" data-link="${id}">🔗 POS 연결</button>`}<button type="button" class="go" data-pv="close">Done · 확인</button></div>`;
  }else{
    h+=`<div class="why">${v==='x'?'✗ Not OK · 안됨'+(rs.length?' — '+rs.map(k=>RS[k]?`${RS[k][1]} · ${RS[k][2]}`:k).join(', '):''):''}${note?`<br>“${esc(note)}”`:''}</div>
      <div class="row"><button type="button" class="go" data-pv="close">Close · 닫기</button></div>`;
  }
  $('#pop-root').innerHTML=h+`</div>`;
}
$('#pop-root').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.link){openLink(b.dataset.link);return}
  if(b.dataset.all!=null){LINKALL=b.dataset.all==='1';paintLink(document.getElementById('link-q')?.value||'');return}
  if(b.dataset.pick!=null){pickLink(b.dataset.pick);return}
  if(!POP)return;
  if(b.dataset.pv!=null){if(b.dataset.pv==='close'){closePop();return}setMine(POP.id,b.dataset.pv);closePop();return}
  if(b.dataset.r){const a=MY.r[POP.id]=MY.r[POP.id]||[];const i=a.indexOf(b.dataset.r);if(i<0)a.push(b.dataset.r);else a.splice(i,1);b.setAttribute('aria-pressed',i<0);MY.done=false;paintCells();queueSave()}
});
$('#pop-root').addEventListener('input',e=>{
  if(e.target.id==='pop-note'&&POP){MY.n[POP.id]=e.target.value;MY.done=false;paintCells();queueSave();return}
  if(e.target.id==='pop-par'&&POP){
    const raw=e.target.value.replace(/[^0-9]/g,'');if(e.target.value!==raw)e.target.value=raw;
    if(raw==='')delete PAR[POP.id];else PAR[POP.id]=+raw;
    clearTimeout(openPop._pt);openPop._pt=setTimeout(()=>saveSide('par',G.my+'_'+G.dept,PAR),700);
    const q=MY.q?.[POP.id];const lv=levelFor(POP.id,q==null?null:q);
    if(lv&&MY.s[POP.id]!==lv){MY.s[POP.id]=lv;MY.done=false;queueSave()}
    paintCells();return;
  }
  if(e.target.id==='link-q'){paintLink(e.target.value);return}
});

/* ===== 🔗 POS 연결 — 이 품목이 POS 에서 어떤 상품으로 팔리는지 한 번만 고른다 ===== */
let LINKFOR=null;
async function openLink(id){
  LINKFOR=id;const it=byId(G.dept)[id];
  $('#pop-root').innerHTML=`<div class="pop link" role="dialog"><span></span><div>
    <h4>🔗 POS 연결 — ${esc(it?.en||id)}</h4>
    <div class="sub">${esc(it?.ko||'')} · 한 번 고르면 모든 지점이 같이 씁니다</div>
    <input id="link-q" placeholder="POS 상품 이름이나 번호로 찾기 · search POS" autocomplete="off">
    <div class="lhint">이름으로 찾으면 ${esc(DK[G.dept].ko)} 것이 먼저 · <b>번호를 치면 부서와 상관없이</b> 바로 나옵니다</div>
    <div class="lr" id="link-rows">${SNAMES?'이름이나 번호를 적어 보세요':'POS 목록 받는 중… · loading'}</div>
    <div class="row"><button type="button" data-pick="">연결 지우기 · Unlink</button><button type="button" class="go" data-pv="close">닫기 · Close</button></div>
  </div></div>`;
  if(!SNAMES&&db&&G.my){ try{ const d=await db.doc('salesNames/'+G.my).get(); SNAMES=(d.exists&&d.data())||{}; delete SNAMES._id; }catch(e){ SNAMES={}; } }
  paintLink(it?.en||'');
  const q=document.getElementById('link-q');if(q){q.value=it?.en||'';q.focus();q.select()}
}
function paintLink(term){
  const el=document.getElementById('link-rows');if(!el)return;
  if(!SNAMES){el.textContent='POS 목록 받는 중…';return}
  const t=String(term||'').trim().toUpperCase();
  if(!t){el.textContent='이름이나 번호를 적어 보세요';return}
  const words=t.split(/\s+/).filter(Boolean);
  const re=DEPT_CODE[G.dept];
  const mine=[],other=[];
  for(const c in SNAMES){
    const n=String(SNAMES[c]).toUpperCase();
    const byCode=c.startsWith(t);
    if(!(byCode||words.every(w=>n.includes(w))))continue;
    const s=dayAvg(c);const row={c,n:SNAMES[c],q:s?s.a:0};
    // 번호를 직접 친 것은 부서를 가리지 않는다 — 번호를 아는 사람은 이미 답을 아는 것이다.
    // (2026-10-08 전무님: "POS 에서 번호로 찾기 없어?" — 다른 부서 번호가 접힌 쪽으로 밀렸었다)
    if(!re||re.test(c)||byCode)mine.push(row);else other.push(row);
    if(mine.length+other.length>600)break;
  }
  const by=(a,b)=>b.q-a.q; mine.sort(by); other.sort(by);
  const btn=x=>`<button type="button" data-pick="${esc(x.c)}"><b>${esc(x.n)}</b><span class="num">#${esc(x.c)}</span><em>${x.q?x.q.toFixed(x.q<10?1:0)+'개/일':'—'}</em></button>`;
  const d=DK[G.dept];
  let h='';
  if(mine.length)h+=mine.slice(0,40).map(btn).join('');
  else h+=`<span class="none">${esc(d.ko)}에서는 못 찾았습니다 · not found in ${esc(d.en)}</span>`;
  if(other.length){
    h+=`<button type="button" class="more" data-all="${LINKALL?'0':'1'}">${LINKALL?'▲ 다른 부서 접기':`▼ 다른 부서에서도 찾기 (${other.length})`}</button>`;
    if(LINKALL)h+=`<div class="oth">${other.slice(0,40).map(btn).join('')}</div>`;
  }
  el.innerHTML=h;
}
async function pickLink(code){
  if(!LINKFOR)return;
  if(code)LINK[LINKFOR]=code;else delete LINK[LINKFOR];
  await saveSide('poslink',G.dept,LINK);
  const q=MY&&MY.q?MY.q[LINKFOR]:null;const lv=levelFor(LINKFOR,q==null?null:q);
  if(lv&&MY&&MY.s[LINKFOR]!==lv){MY.s[LINKFOR]=lv;MY.done=false;queueSave()}
  const id=LINKFOR;LINKFOR=null;closePop();paintCells();
  toast(code?'연결했습니다 · linked':'연결을 지웠습니다 · unlinked');
  if(POP&&POP.id===id)openPop(id,G.my);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});

function setMine(id,v){
  if(!v)delete MY.s[id];else MY.s[id]=v;
  MY.t=MY.t||{};if(v==='x')MY.t[id]=Date.now();else delete MY.t[id];
  if(v!=='x'){delete MY.r[id];delete MY.n[id]}
  MY.done=false;paintCells();renderLegend();renderBar();queueSave();
}

const vc=$('#v-check');

  const [dept,id]=v.split('|');setTab('check');

  if(!document.getElementById('c-'+id+'-'+STORES[0].key)){G.filter='all';}

  const row=document.querySelector(`.it[data-id="${id}"]`);if(!row)return;
  row.scrollIntoView({behavior:'smooth',block:'center'});row.classList.add('flash');setTimeout(()=>row.classList.remove('flash'),1800);

vc.addEventListener('click',e=>{
  const jr=e.target.closest('[data-jump]');if(jr){jump(jr.dataset.jump);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.my!=null){G.my=b.dataset.my;P.store=G.my;lsSet('kfd3-prefs',P);if(pending)flush();syncMine();SALES=null;SNAMES=null;renderCheck();loadSide().then(paintCells);return}
  if(b.dataset.role){G.role=b.dataset.role;P.role=G.role;lsSet('kfd3-prefs',P);for(const x of b.parentElement.children)x.setAttribute('aria-pressed',x===b);return}
  if(b.dataset.dept){if(pending)flush();G.dept=b.dataset.dept;P.dept=G.dept;lsSet('kfd3-prefs',P);G.filter='all';syncMine();closePop();PAR={};LINK={};renderDtabs();renderLegend();renderSheet();renderBar();loadSide().then(paintCells);return}
  if(b.dataset.filter){G.filter=b.dataset.filter;renderSheet();return}
  if(b.dataset.link){openLink(b.dataset.link);return}
  if(b.classList.contains('sc')){
    const id=b.closest('[data-id]').dataset.id;
    if(!G.my){toast('내 지점을 먼저 고르세요 · choose My store');return}
    if(!db){toast('Log in to the Kimchi app to save · 김치 앱에 로그인해야 저장됩니다');}
    // 빈칸 → 🟢 충분 → 🟡 적음 → 🔴 없음 → 빈칸
    const next=NEXT[MY.s[id]||''] ?? '';
    setMine(id,next);
    if(next==='x'||next==='w')openPop(id,G.my);else closePop();
  }
});

/* save */
function queueSave(){if(!db||!G.my)return;pending=true;status='Saving… · 저장 중';renderBar();clearTimeout(saveT);saveT=setTimeout(flush,800)}
async function flush(){
  clearTimeout(saveT);if(writing)await writing;if(!db||!G.my)return;
  const items=catOf(G.dept)||[];const c=counts(items,MY.s);
  const body={date:G.date,store:G.my,dept:G.dept,name:G.name.trim(),role:G.role,by:uid||null,updatedAt:Date.now(),
    s:MY.s,r:MY.r,n:MY.n,t:MY.t||{},q:MY.q||{},done:!!MY.done,doneAt:MY.doneAt||null,
    total:c.t,ok:c.o,low:c.w,no:c.x,na:c.n};
  writing=db.doc('checks/'+docId(G.date,G.my,G.dept)).set(body).then(()=>{status='Saved · 저장됨 '+fmtTime(Date.now())},
    e=>{status='';toast(e&&e.code==='invalid_argument'?'No permission to save. Log in to the Kimchi app again. · 저장 권한 없음':'Could not save. Check connection. · 저장 실패')});
  await writing;writing=null;pending=false;renderBar();
}
function renderBar(){
  const bar=$('#bar');const items=catOf(G.dept);const d=DK[G.dept];
  if(!G.my){bar.innerHTML=`<div class="wrap"><span class="saved">View only · 보기만 — choose <b>My store</b> at the top to check your column.</span></div>`;return}
  if(!items||!MY){bar.innerHTML=`<div class="wrap"><span class="saved">${d.en}</span></div>`;return}
  const c=counts(items,MY.s);const ready=!!db&&!!G.name.trim()&&canWrite!==false;
  const why=!db?'Open the shared link to save':!G.name.trim()?'Enter your name · 이름 입력':'';
  bar.innerHTML=`<div class="wrap"><span class="dot" style="background:var(--s-${G.my});width:12px;height:12px"></span><b>${esc(S[G.my].name)} · ${d.en}</b>
    <div class="stat"><b>${c.u}</b><span>미확인</span></div><div class="stat ok"><b>${c.o}</b><span>🟢 충분</span></div><div class="stat ${c.w?'low':''}"><b>${c.w}</b><span>🟡 적음</span></div><div class="stat ${c.x?'bad':''}"><b>${c.x}</b><span>🔴 없음</span></div>
    <span class="saved">${esc(status)}</span>
    <button class="primary ${MY.done?'done':''}" id="send" ${ready&&!MY.done?'':'disabled'}>${MY.done?`✓ Sent ${fmtTime(MY.doneAt)}<small>보고 완료</small>`:`Send ${d.en} report<small>${esc(why)||d.ko+' 보고 제출'}</small>`}</button></div>`;

/* ================= SUMMARY ================= */
async function renderSum(){
  const v=$('#v-sum');await Promise.all(DEPTS.map(d=>loadCat(d.key)));
  let h=`<div class="ohead"><div><span class="lbl">Owner · ${STORES.length} stores × ${DEPTS.length} departments</span><h1>${G.date===today()?'오늘':esc(G.date)} 진열 점검 요약</h1></div></div>`;
  if(!db){v.innerHTML=h+`<div class="card empty" style="margin-top:12px">Log in to the Kimchi app to see store reports. · 김치 앱에 로그인해야 지점 보고가 보입니다.</div>`;return}
  let sent=0,checked=0,total=0,no=0,low=0,out=0,nodisp=0,deliv=0;
  for(const s of STORES)for(const d of DEPTS){const items=catOf(d.key)||[];total+=items.length;const doc=docFor(s.key,d.key);if(!doc)continue;
    const c=counts(items,doc.s);if(doc.done)sent++;checked+=c.o+c.w+c.x+c.n;no+=c.x;low+=c.w;
    for(const k in doc.r||{}){if(doc.s?.[k]!=='x')continue;if(doc.r[k].includes('out'))out++;if(doc.r[k].includes('nodisp'))nodisp++;if(doc.r[k].includes('delivery'))deliv++}}
  h+=`<div class="kpis"><div class="card kpi ${sent===STORES.length*DEPTS.length?'ok':''}"><b>${sent}/${STORES.length*DEPTS.length}</b><span>Reports sent · 부문 보고 완료</span></div>
    <div class="card kpi"><b>${total?Math.round(checked/total*100):0}%</b><span>Checked · 확인률 (${checked}/${total})</span></div>
    <div class="card kpi ${no?'bad':''}"><b>${no}</b><span>🔴 없음 · None</span></div>
    <div class="card kpi ${low?'bad':''}"><b>${low}</b><span>🟡 적음 · Low</span></div>
    <div class="card kpi ${out?'bad':''}"><b>${out}</b><span>Out of stock · 결품</span></div>
    <div class="card kpi ${nodisp?'bad':''}"><b>${nodisp}</b><span>Not displayed · 미진열</span></div>
    <div class="card kpi"><b>${deliv}</b><span>Waiting for delivery · 배송 대기 중</span></div></div>
    <div class="card mxw"><table class="mx"><thead><tr><th style="text-align:left">Store · 지점</th>${DEPTS.map(d=>`<th>${d.en}<br><span style="font-weight:400">${d.ko}</span></th>`).join('')}</tr></thead><tbody>`;
  for(const s of STORES){h+=`<tr><th><span class="dot" style="background:var(--s-${s.key})"></span> ${esc(s.name)}</th>`;
    for(const d of DEPTS){const doc=docFor(s.key,d.key);const items=catOf(d.key)||[];
      if(!doc){h+=`<td><button type="button" class="cell" data-go="${d.key}"><b>—</b><small>Not started</small></button></td>`;continue}
      const c=counts(items,doc.s);h+=`<td><button type="button" class="cell ${doc.done?'done':'prog'}" data-go="${d.key}"><b>${c.o+c.w+c.x+c.n}/${c.t}</b><small>${doc.done?'✓ Sent '+fmtTime(doc.doneAt):'In progress'}</small>${c.order?`<small class="nb">${c.order} 🛒</small>`:''}</button></td>`}
    h+=`</tr>`}
  h+=`</tbody></table></div><p class="lbl" style="margin-top:8px">Tap a cell to open that department's photo checklist · 칸을 누르면 해당 부문 사진 체크리스트로 이동</p>`;
  let rows='',cnt=0;
  for(const d of DEPTS){const items=catOf(d.key)||[];
    for(const it of items){const xs=xList(d.key,it.id);if(xs.length){rows+=issueRow(d.key,it,xs,true);cnt++}}}
  h+=cnt?`<div class="card issues" style="margin-top:14px"><div class="ih"><b>🛒 오늘 오더할 것 전체 · All low / out today</b><span>${cnt} items · tap a row to open it</span></div>${rows}</div>`
    :`<div class="card issues none" style="margin-top:14px">✓ 오늘 오더할 것 보고 없음 · nothing reported today</div>`;
  v.innerHTML=h;
}
$('#v-sum').addEventListener('click',e=>{const jr=e.target.closest('[data-jump]');if(jr){jump(jr.dataset.jump);return}const b=e.target.closest('[data-go]');if(!b)return;G.dept=b.dataset.go;G.filter='all';syncMine();setTab('check');renderCheck()});

syncMine();renderCheck();
loadCat(G.dept).then(()=>{renderSheet();renderDtabs();renderLegend();renderBar();loadSide().then(paintCells)});
for(const d of DEPTS)if(d.key!==G.dept)loadCat(d.key).then(renderDtabs);
</script>
</body></html>
