<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⭐ 멤버십 가입 승인</title>
<script>(function(){try{var K='memapps.bust',B='v1';if(localStorage.getItem(K)!==B)localStorage.setItem(K,B);}catch(e){}})();</script>
<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getDatabase, ref, onValue, update, get } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
  const cfg = { apiKey:"AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4", authDomain:"kimchi-mart-order.firebaseapp.com", databaseURL:"https://kimchi-mart-order-default-rtdb.firebaseio.com", projectId:"kimchi-mart-order" };
  const app = getApps().length ? getApp() : initializeApp(cfg);
  window.__fb = { db:getDatabase(app), ref, onValue, update, get };
  window.dispatchEvent(new Event('fb-ready'));
</script>
<script src="./lang-sync.js?v=1"></script>
<script type="module" src="./fb-auth-fetch.js?v=7"></script>
<script type="module" src="./auth-gate.js?v=10"></script>
<script src="./me-persist.js?v=1"></script>
<style>
:root{--green:#1a5c3a;--green2:#15803d;--lgreen:#e8f5ee;--bg:#f4f7f5;--card:#fff;--line:#e2e8e5;
 --text:#1f2937;--mute:#6b7280;--amber:#b45309;--red:#dc2626;--gold:#b8860b;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px}
button{cursor:pointer;font-family:inherit}
.wrap{max-width:1000px;margin:0 auto;padding-bottom:50px}
.topwrap{position:sticky;top:0;z-index:20}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hd{background:var(--green);color:#fff;padding:10px 12px}
.hd .r1,.hd .r2{display:flex;align-items:center;gap:8px}
.hd .r2{margin-top:8px}
.hd h1{font-size:1.05em;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .back{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;font-size:1.5em;font-weight:800;line-height:1}
.lang{flex:none;display:flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px}
.lang button{background:transparent;border:0;color:rgba(255,255,255,.8);font-weight:800;font-size:.8em;min-width:36px;height:32px;border-radius:7px}
.lang button.on{background:#fff;color:var(--green)}
.hd .datenav input{min-width:0;width:150px}
.hd .r2 .sbtn{margin-left:auto}
@media(max-width:759px){.topwrap{display:contents}.hd{position:sticky;top:0;z-index:20}}
@media(min-width:760px){.hd{display:flex;align-items:center;gap:12px}.hd .r1{flex:1;min-width:0}.hd .r2{margin-top:0}}
.hd .datenav{display:flex;align-items:center;gap:6px}
.hd .datenav input{border:0;border-radius:8px;padding:6px 8px;font-weight:700}
.hd .datenav button,.hd .sbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:7px 11px;font-weight:700}
.hd .sbtn.on{background:#fff;color:var(--green)}
.bar{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#f1f5f4;border:1.5px solid var(--line);border-radius:20px;padding:6px 13px;font-weight:700;font-size:.85em;color:var(--mute)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.list{padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:5px solid var(--amber)}
.card.paidClaimed{border-left-color:#1d4ed8}
.card.approved{border-left-color:var(--green2);opacity:.72}
.card.rejected{border-left-color:#9ca3af;opacity:.6}
.pill.paidClaimed{background:#dbeafe;color:#1d4ed8}
.proof{margin:8px 0;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.proof img{width:100%;display:block;cursor:zoom-in;max-height:220px;object-fit:cover}
.proofbadge{display:inline-block;background:#dbeafe;color:#1d4ed8;border-radius:7px;padding:2px 8px;font-size:.74em;font-weight:800;margin-bottom:6px}
@keyframes fl{0%,100%{box-shadow:0 0 0 0 rgba(184,134,11,0)}50%{box-shadow:0 0 0 5px rgba(184,134,11,.35)}}
.card.flash{animation:fl 1s ease-in-out 4}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.plan{font-weight:900;font-size:1.05em}
.k1{color:var(--gold)}.k2{color:var(--red)}
.pill{border-radius:20px;padding:3px 10px;font-size:.72em;font-weight:800;margin-left:auto}
.pill.pending{background:#fef3c7;color:var(--amber)}
.pill.approved{background:#dcfce7;color:var(--green2)}
.pill.rejected{background:#f3f4f6;color:#6b7280}
.ago{color:var(--mute);font-size:.76em}
.cust{font-weight:700;margin-bottom:3px}
.cust a{color:#1d4ed8;text-decoration:none}
.meta{font-size:.85em;color:var(--mute);line-height:1.6;margin-bottom:8px}
.fee{background:#f0f7ff;border-radius:9px;padding:8px 10px;font-size:.86em;margin-bottom:10px}
.biz{background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:8px 10px;font-size:.84em;margin-bottom:10px;color:#9a3412}
.acts{display:flex;gap:6px}
.acts button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:800;font-size:.85em;color:#fff}
.a-ok{background:var(--green2)}.a-no{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.a-reopen{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.empty{padding:50px 16px;text-align:center;color:var(--mute)}
.stats{display:flex;gap:10px;padding:12px 16px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4em;font-weight:900;color:var(--green)}
.stat.p b{color:var(--amber)}
.stat span{font-size:.72em;color:var(--mute);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="topwrap">
  <div class="hd">
    <div class="r1">
      <a class="back" href="./apps.html" onclick="return goBack()" aria-label="Back">‹</a>
      <h1 data-i="title">⭐ 멤버십 가입 승인</h1>
      <div class="lang" id="langBox"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="ko" onclick="setLang('ko')">KO</button><button data-l="es" onclick="setLang('es')">ES</button></div>
    </div>
    <div class="r2">
      <div class="datenav">
        <button onclick="shiftDay(-1)">‹</button>
        <input type="date" id="oDate" onchange="subscribe()">
        <button onclick="shiftDay(1)">›</button>
      </div>
      <button class="sbtn" id="soundBtn" onclick="toggleSound()">🔕</button>
    </div>
  </div>
  <div class="bar" id="chips">
    <button class="chip on" data-s="pending" onclick="setF('pending')" data-i="f_pending">대기중</button>
    <button class="chip" data-s="approved" onclick="setF('approved')" data-i="f_approved">승인됨</button>
    <button class="chip" data-s="all" onclick="setF('all')" data-i="f_all">전체</button>
  </div>
  </div>
  <div class="stats">
    <div class="stat p"><b id="stP">0</b><span data-i="s_pending">대기중</span></div>
    <div class="stat"><b id="stA">0</b><span data-i="s_appr">오늘 승인</span></div>
    <div class="stat"><b id="stRev">$0</b><span data-i="s_fee">오늘 연회비</span></div>
  </div>
  <div class="list" id="list"></div>
</div>
<script>
var APPS={},LAST_STATUS={},FIRST=true,F='pending',SOUND=false,UNSUB=null,AUDIO=null;
/* ===== 언어 (EN/KO/ES) ===== */
var I18N={
 en:{title:'⭐ Membership Approval',f_pending:'Pending',f_approved:'Approved',f_all:'All',s_pending:'Pending',s_appr:'Approved today',s_fee:'Fees today',
  snd_on:'🔔 Sound on',snd_off:'🔕 Sound off',now:'just now',m:'m ago',h:'h ago',d:'d ago',
  c_act:'Activate {p} membership? (annual fee ${f} confirmed)',no_phone:'No phone number — cannot activate',act_fail:'Activation failed: ',c_rej:'Reject this application?',fail:'Failed: ',
  zelle:'📱 Zelle transfer (${f} → kimchimart@gmail.com)',store:'🏪 Pay in store (${f})',cert:'Cert #',orig:'⚠️ Check the original document',proof:'📷 Payment screenshot attached',
  ok:'✅ Activate',no:'Reject',reopen:'Back to pending',p_pending:'Pending',p_paid:'Paid (customer says)',p_appr:'Approved',p_rej:'Rejected',mem:'Membership',per:'/ 1 year',fee:'Annual fee',pay:'💰 Payment: ',empty:'No applications'},
 ko:{title:'⭐ 멤버십 가입 승인',f_pending:'대기중',f_approved:'승인됨',f_all:'전체',s_pending:'대기중',s_appr:'오늘 승인',s_fee:'오늘 연회비',
  snd_on:'🔔 소리 켜짐',snd_off:'🔕 소리 꺼짐',now:'방금',m:'분 전',h:'시간 전',d:'일 전',
  c_act:'{p} 멤버십을 활성화할까요? (연회비 ${f} 확인)',no_phone:'전화번호가 없어 활성화 불가',act_fail:'활성화 실패: ',c_rej:'이 신청을 거절할까요?',fail:'실패: ',
  zelle:'📱 Zelle 송금 (${f} → kimchimart@gmail.com)',store:'🏪 매장 방문 결제 (${f})',cert:'등록증# ',orig:'⚠️ 원본 확인 필요',proof:'📷 입금 스크린샷 첨부됨',
  ok:'✅ 활성화',no:'거절',reopen:'다시 대기',p_pending:'대기중',p_paid:'입금완료 신고',p_appr:'승인됨',p_rej:'거절',mem:'멤버십',per:'/ 1년',fee:'연회비',pay:'💰 결제방법: ',empty:'해당 신청이 없습니다'},
 es:{title:'⭐ Aprobar membresías',f_pending:'Pendientes',f_approved:'Aprobadas',f_all:'Todas',s_pending:'Pendientes',s_appr:'Aprobadas hoy',s_fee:'Cuotas hoy',
  snd_on:'🔔 Sonido activado',snd_off:'🔕 Sonido apagado',now:'ahora',m:' min',h:' h',d:' d',
  c_act:'¿Activar la membresía {p}? (cuota anual ${f} confirmada)',no_phone:'Sin teléfono — no se puede activar',act_fail:'Error al activar: ',c_rej:'¿Rechazar esta solicitud?',fail:'Error: ',
  zelle:'📱 Transferencia Zelle (${f} → kimchimart@gmail.com)',store:'🏪 Pago en tienda (${f})',cert:'Cert. #',orig:'⚠️ Verificar documento original',proof:'📷 Captura de pago adjunta',
  ok:'✅ Activar',no:'Rechazar',reopen:'Volver a pendiente',p_pending:'Pendiente',p_paid:'Pagado (según cliente)',p_appr:'Aprobada',p_rej:'Rechazada',mem:'Membresía',per:'/ 1 año',fee:'Cuota anual',pay:'💰 Pago: ',empty:'No hay solicitudes'}
};
var LANG=(function(){try{var v=localStorage.getItem('kimchi_lang');return I18N[v]?v:'en';}catch(e){return 'en';}})();
function t(k,o){var s=(I18N[LANG]&&I18N[LANG][k]!=null)?I18N[LANG][k]:(I18N.en[k]||k);if(o)Object.keys(o).forEach(function(x){s=s.split('{'+x+'}').join(o[x]);});return s;}
function applyLang(){document.documentElement.lang=LANG;document.title=t('title');document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i);});document.querySelectorAll('#langBox button').forEach(function(b){b.classList.toggle('on',b.dataset.l===LANG);});var sb=document.getElementById('soundBtn');if(sb)sb.textContent=SOUND?t('snd_on'):t('snd_off');}
function setLang(l){if(!I18N[l])return;LANG=l;try{['kimchi_lang','hub.lang','tasks.lang'].forEach(function(k){localStorage.setItem(k,l);});}catch(e){}applyLang();render();}
window.setLang=setLang;
function goBack(){try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return false;}}catch(e){}return true;}
window.goBack=goBack;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ago(ts){if(!ts)return'';var s=Math.floor((Date.now()-ts)/1000);if(s<60)return t('now');if(s<3600)return Math.floor(s/60)+t('m');if(s<86400)return Math.floor(s/3600)+t('h');return Math.floor(s/86400)+t('d');}
function meName(){try{return(JSON.parse(localStorage.getItem('chat.me')||'null')||{}).name||'직원';}catch(e){return'직원';}}
function ensureAudio(){try{if(!AUDIO)AUDIO=new(window.AudioContext||window.webkitAudioContext)();if(AUDIO.state==='suspended')AUDIO.resume();}catch(e){}}
function ding(){if(!SOUND)return;ensureAudio();try{if(!AUDIO)return;[0,.18].forEach(function(off){var o=AUDIO.createOscillator(),g=AUDIO.createGain();o.connect(g);g.connect(AUDIO.destination);o.type='sine';o.frequency.value=900;var t=AUDIO.currentTime+off;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.start(t);o.stop(t+.18);});}catch(e){}try{if(navigator.vibrate)navigator.vibrate([120,60,120]);}catch(e){}}
function toggleSound(){SOUND=!SOUND;var b=document.getElementById('soundBtn');b.classList.toggle('on',SOUND);b.textContent=SOUND?t('snd_on'):t('snd_off');if(SOUND){ensureAudio();ding();}}
window.toggleSound=toggleSound;
function shiftDay(d){var i=document.getElementById('oDate');var dt=i.value?new Date(i.value+'T00:00:00'):new Date();dt.setDate(dt.getDate()+d);i.value=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');subscribe();}
window.shiftDay=shiftDay;
function subscribe(){var fb=window.__fb;if(!fb)return;var dk=document.getElementById('oDate').value||todayKey();document.getElementById('oDate').value=dk;if(UNSUB){try{UNSUB();}catch(e){}}FIRST=true;LAST_STATUS={};UNSUB=fb.onValue(fb.ref(fb.db,'membershipApplications/'+dk),function(snap){APPS=snap.val()||{};var al=0;Object.keys(APPS).forEach(function(id){var st=APPS[id].status||'pending';var prev=LAST_STATUS[id];if(!FIRST){if(prev===undefined&&(st==='pending'||st==='paidClaimed'))al++;else if(prev!=='paidClaimed'&&st==='paidClaimed')al++;}LAST_STATUS[id]=st;});if(al>0)ding();FIRST=false;render();});}
window.subscribe=subscribe;
function setF(s){F=s;document.querySelectorAll('#chips .chip').forEach(function(c){c.classList.toggle('on',c.dataset.s===s);});render();}
window.setF=setF;
function approve(id){
  var fb=window.__fb,dk=document.getElementById('oDate').value||todayKey();var a=APPS[id];if(!a)return;
  if(!confirm(t('c_act',{p:String(a.plan||'').toUpperCase(),f:a.fee})))return;
  var key=String((a.customer&&a.customer.phone)||'').replace(/\D/g,'');
  if(!key){alert(t('no_phone'));return;}
  var membership={plan:a.plan,grantType:'paid',activatedAt:Date.now(),expiresAt:Date.now()+365*86400000,fee:a.fee,activatedBy:meName(),appId:id};
  fb.update(fb.ref(fb.db,'rewards/customers/'+key),{membership:membership})
   .then(function(){return fb.update(fb.ref(fb.db,'membershipApplications/'+dk+'/'+id),{status:'approved',handledBy:meName(),handledAt:Date.now()});})
   .then(function(){}).catch(function(e){alert(t('act_fail')+(e.message||e));});
}
window.approve=approve;
function reject(id){if(!confirm(t('c_rej')))return;var fb=window.__fb,dk=document.getElementById('oDate').value||todayKey();fb.update(fb.ref(fb.db,'membershipApplications/'+dk+'/'+id),{status:'rejected',handledBy:meName(),handledAt:Date.now()}).catch(function(e){alert(t('fail')+(e.message||e));});}
window.reject=reject;
function reopen(id){var fb=window.__fb,dk=document.getElementById('oDate').value||todayKey();fb.update(fb.ref(fb.db,'membershipApplications/'+dk+'/'+id),{status:'pending'}).catch(function(){});}
window.reopen=reopen;
function render(){
  var el=document.getElementById('list');if(!el)return;
  var rows=Object.keys(APPS).map(function(id){return Object.assign({_id:id},APPS[id]);});
  var p=rows.filter(function(a){return(a.status||'pending')==='pending';}).length;
  var ap=rows.filter(function(a){return a.status==='approved';});
  document.getElementById('stP').textContent=p;
  document.getElementById('stA').textContent=ap.length;
  document.getElementById('stRev').textContent='$'+ap.reduce(function(s,a){return s+(+a.fee||0);},0);
  var vis=rows.filter(function(a){var st=a.status||'pending';if(F==='all')return true;if(F==='pending')return st==='pending'||st==='paidClaimed';return st===F;});
  vis.sort(function(a,b){return(b.at||0)-(a.at||0);});
  if(!vis.length){el.innerHTML='<div class="empty">'+t('empty')+'</div>';return;}
  el.innerHTML=vis.map(function(a){
    var st=a.status||'pending';
    var flash=((st==='pending'||st==='paidClaimed')&&(Date.now()-(a.proofAt||a.at||0)<180000))?' flash':'';
    var phone=esc((a.customer&&a.customer.phone)||'');
    var pay=a.payMethod==='zelle'?t('zelle',{f:a.fee}):a.payMethod==='store'?t('store',{f:a.fee}):('💳 '+esc(a.payMethod||''));
    var biz=a.business?('<div class="biz">🏢 '+esc(a.business.name||'')+(a.business.cert?(' · '+t('cert')+esc(a.business.cert)):'')+'<br>'+t('orig')+'</div>'):'';
    var proof=a.proof?('<div class="proofbadge">'+t('proof')+'</div><div class="proof"><img src="'+a.proof+'" onclick="window.open().document.write(\'<img src=\\\''+a.proof+'\\\' style=width:100%>\')"></div>'):'';
    var acts=(st==='pending'||st==='paidClaimed')
      ? '<button class="a-ok" onclick="approve(\''+a._id+'\')">'+t('ok')+'</button><button class="a-no" onclick="reject(\''+a._id+'\')">'+t('no')+'</button>'
      : '<button class="a-reopen" onclick="reopen(\''+a._id+'\')">'+t('reopen')+'</button>';
    var pillTxt=st==='pending'?t('p_pending'):st==='paidClaimed'?t('p_paid'):st==='approved'?t('p_appr'):t('p_rej');
    return '<div class="card '+st+flash+'">'+
      '<div class="top"><span class="plan '+a.plan+'">'+String(a.plan||'').toUpperCase()+' '+t('mem')+'</span>'+
        '<span class="pill '+st+'">'+pillTxt+'</span></div>'+
      '<div class="ago">'+ago(a.at)+' · #'+esc(a.id||a._id)+'</div>'+
      '<div class="cust" style="margin-top:6px">👤 '+esc((a.customer&&a.customer.name)||'-')+(phone?' · <a href="tel:'+phone.replace(/[^0-9+]/g,'')+'">📞 '+phone+'</a>':'')+'</div>'+
      '<div class="meta">'+(a.customer&&a.customer.email?('✉️ '+esc(a.customer.email)+'<br>'):'')+t('fee')+' $'+esc(a.fee)+' '+t('per')+'</div>'+
      biz+
      '<div class="fee">'+t('pay')+pay+'</div>'+
      proof+
      '<div class="acts">'+acts+'</div>'+
    '</div>';
  }).join('');
}
window.render=render;
var booted=false;
applyLang();
function boot(){if(booted)return;if(!window.__fb)return;booted=true;document.getElementById('oDate').value=todayKey();subscribe();}
window.addEventListener('fb-ready',boot);if(window.__fb)boot();
</script>
</body>
</html>
