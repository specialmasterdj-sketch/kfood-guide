(function(){
  var BUST = 'voicestock_2026_07_13_v16_date';
  try {
    var KEY='voicestock.bust';
    if (localStorage.getItem(KEY)!==BUST) localStorage.setItem(KEY,BUST);
    var pendingReload=false;
    setInterval(function(){
      fetch('./voice-stock.html?bust='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
        var m=t.match(/var BUST = '([^']+)'/);
        if(m&&m[1]!==BUST){
          // 사용 중(녹음 중 포함) 강제 리로드 금지 — 화면이 숨겨졌을 때만 반영
          if(document.hidden){location.reload();}else{pendingReload=true;}
        }
      }).catch(function(){});
    },90000);
    document.addEventListener('visibilitychange',function(){ if(pendingReload&&document.hidden)location.reload(); });
  } catch(e){}
})();
</script>

function detectLang(){try{return localStorage.getItem('tasks.lang')||localStorage.getItem('kimchi_lang')||'ko';}catch(e){return 'ko';}}
let LANG=detectLang();
function t(k){const e=T[k];return e?(e[LANG]||e.ko):k;}
function meName(){try{return (JSON.parse(localStorage.getItem('chat.me')||'null')||{}).name||'직원';}catch(e){return '직원';}}
function toast(m,bad){const el=document.getElementById('toast');el.textContent=m;el.style.background=bad?'#dc2626':'#16a34a';el.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.display='none',2600);}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateKey(d){const x=d?new Date(d+'T12:00:00'):new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}

// ===== 상태 =====
// 부서 탭 — 일반은 냉동/냉장/일반(드라이)으로 분리 (전무님 2026-07-12)
const DEPTS=[
  {id:'produce',emoji:'🥬',ko:'야채',en:'Produce',es:'Verduras'},
  {id:'meat',emoji:'🥩',ko:'정육',en:'Meat',es:'Carne'},

let BRANCH='HOLLYWOOD', DATE=dateKey(), DEPT='produce', ENTRIES={}, unsub=null;
let MIC_LANG=LANG;   // 인식 언어 (UI 언어와 별도 선택 가능)

function deptName(l){const d=deptObj();return d.emoji+' '+(d[l||LANG]||d.ko);}
function setDept(id){
  if(!DEPTS.some(d=>d.id===id))return;
  DEPT=id;try{localStorage.setItem('voicestock.dept',id);}catch(e){}

}

  document.getElementById('deptTabs').innerHTML=DEPTS
    .map(d=>'<button class="'+(d.id===DEPT?'on':'')+'" onclick="setDept(\''+d.id+'\')">'+d.emoji+' '+escHtml(d[LANG]||d.ko)+'</button>').join('');

// ===== 품목 사전 + 발음 유사도 교정 =====

const _CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ',_JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ',_JONG='\0ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';
function jamo(s){
  let o='';
  for(const ch of String(s||'').toLowerCase()){
    const c=ch.charCodeAt(0);
    if(c>=0xAC00&&c<=0xD7A3){const i=c-0xAC00;o+=_CHO[Math.floor(i/588)]+_JUNG[Math.floor((i%588)/28)];const j=i%28;if(j)o+=_JONG[j];}
    else if(ch!==' ')o+=ch;
  }
  return o;
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function sim(a,b){
  const ja=jamo(a),jb=jamo(b);
  const L=Math.max(ja.length,jb.length);
  return L?1-lev(ja,jb)/L:0;
}
const SNAP_MIN=0.75;   // 이 이상 비슷하면 사전 품목으로 교정 (0.72 는 비터멜론(0.73)→워터멜론 오교정 — 2026-07-13 상향)
// 매칭 후보: [별칭(들리는 말→영어), 학습 별칭, 표준 영어명, 기존 사전] — 별칭이 앞이라 동점이면 영어 표기 우선
function candList(){
  const out=[];
  const sa=STORE_ALIAS[DEPT]||{};                                     // 매장 별칭 최우선 (갈치→BELT FISH)
  for(const k in sa)out.push({key:k,canon:sa[k]});
  const as=ALIAS_SEED[DEPT]||{};
  for(const k in as)out.push({key:k,canon:as[k]});
  for(const k in ALIAS_LEARNED){const v=ALIAS_LEARNED[k];if(v&&v.f&&v.t)out.push({key:v.f,canon:v.t});}
  const seen=new Set();
  for(const k in as){const c=as[k];const cl=c.toLowerCase();if(!seen.has(cl)){seen.add(cl);out.push({key:c,canon:c});}}
  for(const p of productList())out.push({key:p,canon:p});   // 발주 카탈로그 + 매장 PLU 품목 (영어로 말할 때 직접 매칭)
  for(const v of vocabList())out.push({key:v,canon:v});
  return out;
}
// 토큰 단위 번역: "그레이프 토마토" → "GRAPE TOMATO" (WORD_TR + 별칭 사전, 오인식은 토큰별 유사도로 흡수)
function tokenTranslate(raw){
  const as=ALIAS_SEED[DEPT]||{};
  const sa=STORE_ALIAS[DEPT]||{};
  const lookup=w=>{
    if(sa[w]!==undefined)return sa[w];                                // 매장 별칭 최우선
    const wl=w.toLowerCase();
    if(sa[wl]!==undefined)return sa[wl];
    if(WORD_TR[wl]!==undefined)return WORD_TR[wl];
    if(as[wl]!==undefined)return as[wl];
    if(as[w]!==undefined)return as[w];
    return null;
  };
  let changed=false;
  const out=String(raw).split(/\s+/).map(w=>{
    const hit=lookup(w);
    if(hit!==null){changed=true;return hit;}
    // 복합어 분해 — "비터멜론"=비터+멜론 → BITTER MELON (워터멜론 오교정 방지, 전무님 2026-07-13)
    if(/^[가-힣]{3,}$/.test(w)){
      for(let i=1;i<w.length;i++){
        const a=lookup(w.slice(0,i)),b=lookup(w.slice(i));
        if(a!==null&&b!==null){changed=true;return a+' '+b;}
      }
    }
    let best='',bs=0;
    for(const k in WORD_TR){const s=sim(w,k);if(s>bs){bs=s;best=WORD_TR[k];}}
    for(const k in as){const s=sim(w,k);if(s>bs){bs=s;best=as[k];}}
    if(bs>=0.8){changed=true;return best;}
    return w;
  }).join(' ');
  return {text:out,changed};
}
// 말한 단어가 전부 들어있는 카탈로그 품목 찾기 — 단어 1개면 유일할 때만, 여러 개면 가장 짧은 품목.
// strict=true: 정확일치 또는 유일 후보만 (일반명 ICE CREAM 이 최단 상품으로 잘못 승격되는 것 방지)
function catalogSnap(phrase,strict){
  const norm=t=>t==='BOCK'?'BOK':t;   // 밴더 철자 BOCK ↔ 매장 철자 BOK 통일
  const toks=String(phrase).toUpperCase().split(/\s+/).filter(w=>/[A-Z]/.test(w)).map(norm);
  if(!toks.length)return null;
  const hits=[];let exact=null;
  for(const p of productList()){
    const pts=p.toUpperCase().split(/[^A-Z0-9#]+/).filter(Boolean).map(norm);   // 단어 단위 — EGG 가 EGGPLANT 에 오매칭 방지
    let ok=true;
    for(const t of toks){if(pts.indexOf(t)<0){ok=false;break;}}
    if(ok){
      hits.push(p);
      if(!exact&&pts.length===toks.length)exact=p;   // 단어 구성이 정확히 같은 품목 최우선 (청경채→BOK CHOY, TIP 아님)
    }
  }
  if(exact)return exact;
  if(!hits.length)return null;
  if(strict&&hits.length>1)return null;
  if(toks.length===1&&hits.length>1)return null;
  hits.sort((a,b)=>a.length-b.length);
  return hits[0];
}
function snapToVocab(name){
  const raw=String(name).trim();
  const rl=raw.toLowerCase(),rlns=rl.replace(/\s+/g,'');
  const cands=candList();
  // 1) 별칭/표준명 정확 일치 → 카탈로그 품목까지 좁혀지면 그 이름으로
  for(const c of cands){const kl=c.key.toLowerCase();
    if(kl===rl||kl.replace(/\s+/g,'')===rlns){
      const cat=catalogSnap(c.canon,true);   // 일반명은 유일/정확일치일 때만 카탈로그 품목으로 구체화
      if(!cat&&/[가-힣]/.test(c.canon))break;   // canon 이 한글(구 사전 자기일치)이면 토큰 번역 단계로 진행
      const fin=cat||c.canon;
      if(fin.toLowerCase()!==rl)return {name:fin,heard:raw,score:1};
      return {name:fin,score:1};
    }
  }
  // 2) 토큰 번역("그레이프 토마토"→"GRAPE TOMATO") → 카탈로그 매칭
  const tr=tokenTranslate(raw);
  const cat=catalogSnap(tr.text);
  if(cat)return cat.toLowerCase()===rl?{name:cat,score:1}:{name:cat,heard:raw,score:0.95};
  // 3) 전체 구절 발음 유사도 (기존)
  let best=null,bestS=0;
  for(const c of cands){const s=sim(raw,c.key);if(s>bestS){bestS=s;best=c;}}
  if(best&&bestS>=SNAP_MIN&&best.canon.toLowerCase()!==rl)return {name:best.canon,heard:raw,score:bestS};
  // 4) 번역은 됐지만 카탈로그에 없으면 번역문으로 (영어 표기 유지)
  if(tr.changed&&tr.text.toLowerCase()!==rl)return {name:tr.text,heard:raw,score:0.8};
  return {name:raw,score:bestS};
}
function vocabScore(rows){   // 인식 후보 중 사전과 제일 잘 맞는 것 고르기용 점수
  if(!rows.length)return -1;
  const cands=candList();
  let s=0;
  for(const r of rows){let m=0;for(const c of cands){const x=sim(r.item,c.key);if(x>m)m=x;}s+=m;}
  return s/rows.length+rows.length*0.05;
}
function vocabKey(name){return String(name).trim().replace(/[.#$/\[\]]/g,'_').slice(0,60);}
function learnVocab(name){
  name=String(name||'').trim();
  if(!name||name.length<2)return;
  const seed=(VOCAB_SEED[DEPT]||[]);
  if(seed.some(v=>v.toLowerCase()===name.toLowerCase())||VOCAB_LEARNED[vocabKey(name)])return;
  if(!window.__fb)return;
  const {db,ref,set}=window.__fb;
  set(ref(db,'inventory/voiceVocab/'+DEPT+'/'+vocabKey(name)),name).catch(()=>{});
}
function learnAlias(from,to){
  from=String(from||'').trim();to=String(to||'').trim();
  if(!from||!to||from.length<2||from.toLowerCase()===to.toLowerCase())return;
  if(!window.__fb)return;
  const {db,ref,set}=window.__fb;
  set(ref(db,'inventory/voiceAlias/'+DEPT+'/'+vocabKey(from.toLowerCase())),{f:from,t:to}).catch(()=>{});
}
function subscribeVocab(){
  if(!window.__fb)return;
  const {db,ref,onValue}=window.__fb;
  if(vocabUnsub){try{vocabUnsub();}catch(e){}}
  if(aliasUnsub){try{aliasUnsub();}catch(e){}}
  vocabUnsub=onValue(ref(db,'inventory/voiceVocab/'+DEPT),snap=>{VOCAB_LEARNED=snap.val()||{};},()=>{});
  aliasUnsub=onValue(ref(db,'inventory/voiceAlias/'+DEPT),snap=>{ALIAS_LEARNED=snap.val()||{};},()=>{});
}

// ===== 음성 → 품목/수량/단위 파싱 =====
// 단위 사전 (긴 것 먼저 매칭되도록 길이순 정렬)
const UNITS=['킬로그램','킬로','박스','케이스','카톤','봉지','자루','파운드','팩','병','캔','봉','포','줄','판','단','망','통','개',
  'boxes','box','cases','case','cartons','carton','packs','pack','bottles','bottle','bags','bag','cans','can','pieces','piece','pounds','pound','kilos','kilo','each','ea','kg','lb',
  'cajas','caja','paquetes','paquete','botellas','botella','bolsas','bolsa','latas','lata','piezas','pieza','libras','libra','unidades','unidad']
  .sort((a,b)=>b.length-a.length);
const UNIT_RE=new RegExp('^(?:'+UNITS.join('|')+')$','i');
// 말로 하는 숫자 → 아라비아 숫자 (단위 앞에 올 때만 안전하게 치환)
const WORD_NUM={'하나':1,'한':1,'둘':2,'두':2,'셋':3,'세':3,'넷':4,'네':4,'다섯':5,'여섯':6,'일곱':7,'여덟':8,'아홉':9,'열':10,'스물':20,'스무':20,
  'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,
  'uno':1,'una':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'nueve':9,'diez':10};
// ⚠️ 단위 뒤에 \b 붙이지 말 것 — JS \b 는 한글 뒤에서 매칭 안 됨 (박스, 봉 등 전부 무력화)
const WORD_NUM_RE=new RegExp('(?:^|\\s)('+Object.keys(WORD_NUM).join('|')+')(?=\\s*(?:'+UNITS.join('|')+'))','gi');
function normalizeSpeech(s){
  s=String(s||'');
  s=s.replace(/(\d)\.(\d)/g,'$1‸$2');             // 소수점(2.5) 임시 보호
  s=s.replace(/[,.·;!?]/g,' ');
  s=s.replace(/‸/g,'.');
  // "3박스" 붙어나온 것 분리 + 한글 숫자→아라비아 (단위가 바로 뒤따를 때만)
  s=s.replace(WORD_NUM_RE,(m,w)=>' '+(WORD_NUM[w.toLowerCase()]||WORD_NUM[w]||w)+' ');
  s=s.replace(/(\d+(?:\.\d+)?)([^\d\s.])/g,'$1 $2');   // 3박스 → 3 박스
  s=s.replace(/([^\d\s.])(\d)/g,'$1 $2');              // 양파3 → 양파 3 ('.' 제외 — 2.5 보존)
  return s.replace(/\s+/g,' ').trim();
}
// 토큰 스캔: [품목...] 숫자 [단위] 반복 (한국어 어순) + "3 boxes onions" (영어 어순) 모두 처리
function parseTranscript(raw){
  const s=normalizeSpeech(raw);
  if(!s) return {rows:[],rest:''};
  const toks=s.split(' ').filter(x=>x&&!/^(그리고|and|y|de|of|더|또)$/i.test(x));
  const rows=[]; let buf=[];
  for(let i=0;i<toks.length;i++){
    const tok=toks[i];
    if(/^\d+(?:\.\d+)?$/.test(tok)){
      const qty=parseFloat(tok);
      let unit='';
      if(i+1<toks.length&&UNIT_RE.test(toks[i+1])){unit=toks[i+1];i++;}
      if(buf.length){                       // 한국어 어순: 양파 3 박스
        rows.push({item:buf.join(' '),qty,unit});buf=[];
      }else{                                // 영어 어순: 3 boxes onions → 다음 숫자 전까지가 품목
        const after=[];
        while(i+1<toks.length&&!/^\d+(?:\.\d+)?$/.test(toks[i+1])){after.push(toks[++i]);}
        if(after.length)rows.push({item:after.join(' '),qty,unit});
        else buf=[];                        // 품목 없는 숫자는 버림
      }
    }else buf.push(tok);
  }
  return {rows,rest:buf.join(' ')};
}

// ===== Firebase =====
function basePath(){return 'inventory/voice/'+BRANCH+'/'+DATE+'/'+DEPT;}
function subscribe(){
  if(!window.__fb)return;
  const {db,ref,onValue}=window.__fb;
  if(unsub){try{unsub();}catch(e){}}
  unsub=onValue(ref(db,basePath()),snap=>{ENTRIES=snap.val()||{};render();},err=>{console.warn('[voice-stock]',err);});
}
async function addEntry(item,qty,unit,heard){
  if(!window.__fb){toast(t('waiting'),true);return false;}
  const {db,ref,push,set}=window.__fb;
  const k=push(ref(db,basePath())).key;
  const rec={item:item,qty:qty,unit:unit||'',by:meName(),at:Date.now()};
  if(heard)rec.heard=heard;   // 교정 전 들린 원문 (디버그용)
  await set(ref(db,basePath()+'/'+k),rec);
  return true;
}
async function addRows(rows,opts){
  const snap=!(opts&&opts.noSnap);
  let ok=[];
  for(const r of rows){
    let item=r.item.trim();if(!item)continue;
    let heard='';
    if(snap){const s=snapToVocab(item);if(s.heard){heard=s.heard;item=s.name;}}
    try{
      await addEntry(item,r.qty,r.unit,heard);
      ok.push(item+' '+r.qty+(r.unit||'')+(heard?' ("'+heard+'"→교정)':''));
    }catch(e){toast(t('sendFail')+(e&&e.message||e),true);return;}
  }
  if(ok.length)toast(t('added')+ok.join(' · '));
}
async function delEntry(k){
  if(!window.__fb)return;
  const {db,ref,remove}=window.__fb;
  try{await remove(ref(db,basePath()+'/'+k));toast(t('delOk'));}catch(e){toast(t('sendFail')+(e&&e.message||e),true);}
}
async function setQty(k,v){
  const n=parseFloat(v);if(!(n>=0))return;
  if(!window.__fb)return;
  const {db,ref,update}=window.__fb;
  try{await update(ref(db,basePath()+'/'+k),{qty:n});}catch(e){toast(t('sendFail')+(e&&e.message||e),true);}
}
function manualAdd(){
  const item=document.getElementById('mItem').value.trim();
  const qty=parseFloat(document.getElementById('mQty').value)||1;
  const unit=document.getElementById('mUnit').value.trim();
  if(!item){alert(t('needItem'));return;}
  addRows([{item,qty,unit}],{noSnap:true});   // 직접 타이핑은 그대로 저장
  learnVocab(item);                            // + 사전 학습 → 다음부턴 음성으로 바로 인식
  document.getElementById('mItem').value='';document.getElementById('mQty').value='1';
  document.getElementById('mItem').focus();
}
async function renameEntry(k){
  const e=ENTRIES[k];if(!e)return;
  const nn=prompt(t('renamePh'),e.item||'');
  if(nn===null)return;
  const name=nn.trim();if(!name)return;
  if(!window.__fb)return;
  const {db,ref,update}=window.__fb;
  try{
    await update(ref(db,basePath()+'/'+k),{item:name});
    learnVocab(name);                       // 고친 이름은 사전에 등록 → 같은 실수 반복 안 함
    learnAlias(e.item,name);                // 잘못 기록됐던 이름 → 새 이름 별칭 학습
    if(e.heard)learnAlias(e.heard,name);    // 원래 들린 발음 → 새 이름 별칭 학습
    toast('✏️ '+name);
  }catch(err){toast(t('sendFail')+(err&&err.message||err),true);}
}

// ===== 음성 인식 =====
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, recActive=false;
const SR_LANGS={ko:'ko-KR',en:'en-US',es:'es-US'};
function makeRec(){
  const r=new SR();
  r.lang=SR_LANGS[MIC_LANG]||'ko-KR';
  r.continuous=true;r.interimResults=true;r.maxAlternatives=5;
  r.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i];
      if(res.isFinal){
        showInterim('');
        // 인식 후보 여러 개 중 품목 사전과 제일 잘 맞는 후보 선택
        let best=null;
        for(let a=0;a<res.length;a++){
          const txt=(res[a].transcript||'').trim();if(!txt)continue;
          const p=parseTranscript(txt);
          const score=vocabScore(p.rows);
          if(!best||score>best.score)best={txt,p,score};
        }
        if(best&&best.txt){
          if(best.p.rows.length)addRows(best.p.rows);
          else if(best.p.rest)toast(t('noParse')+'"'+best.p.rest+'"',true);
        }
      }else interim+=res[0].transcript;
    }
    if(interim)showInterim(interim);
  };
  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast(t('micDenied'),true);stopMic();}
    else if(e.error!=='no-speech'&&e.error!=='aborted'){toast(t('micErr')+e.error,true);}
  };
  r.onend=()=>{ if(recActive){try{r.start();}catch(e){}} else updateMicUI(); };
  return r;
}
function toggleMic(){ recActive?stopMic():startMic(); }
function startMic(){
  if(!SR){toast(t('micNo'),true);return;}
  try{rec=makeRec();rec.start();recActive=true;updateMicUI();}
  catch(e){toast(t('micErr')+(e&&e.message||e),true);}
}
function stopMic(){
  recActive=false;
  if(rec){try{rec.stop();}catch(e){}}
  showInterim('');updateMicUI();
}
function updateMicUI(){
  const b=document.getElementById('micBtn'),s=document.getElementById('micState');
  if(!SR){b.style.display='none';s.textContent=t('micNo');s.classList.remove('rec');return;}
  b.classList.toggle('rec',recActive);
  b.textContent=recActive?'⏹':'🎤';
  s.textContent=recActive?t('micRec'):t('micReady');
  s.classList.toggle('rec',recActive);
}
function showInterim(txt){
  const el=document.getElementById('interim');
  el.innerHTML=txt?escHtml(txt):'<span class="ph">'+escHtml(t('interimPh'))+'</span>';
}
function setMicLang(l){
  MIC_LANG=l;
  document.querySelectorAll('#micLang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  if(recActive){stopMic();setTimeout(startMic,250);}   // 언어 바꾸면 재시작
}
function renderMicLang(){
  document.getElementById('micLang').innerHTML=[['ko','🇰🇷 한국어'],['en','🇺🇸 English'],['es','🇪🇸 Español']]
    .map(([l,n])=>'<button data-l="'+l+'" class="'+(MIC_LANG===l?'on':'')+'" onclick="setMicLang(\''+l+'\')">'+n+'</button>').join('');
}

// ===== 렌더 =====
function entryArr(){return Object.entries(ENTRIES).map(([k,v])=>({k,...v})).sort((a,b)=>(b.at||0)-(a.at||0));}
function aggregate(){
  const m={};
  entryArr().forEach(e=>{
    const key=(e.item||'').trim().toLowerCase()+'|'+(e.unit||'').trim().toLowerCase();
    if(!m[key])m[key]={item:(e.item||'').trim(),unit:(e.unit||'').trim(),qty:0,n:0};
    m[key].qty+=(+e.qty||0);m[key].n++;
  });
  return Object.values(m).sort((a,b)=>a.item.localeCompare(b.item,'ko'));
}
function render(){
  const arr=entryArr(),agg=aggregate();
  document.getElementById('sumItems').textContent=agg.length;
  document.getElementById('sumQty').textContent=Math.round(agg.reduce((s,x)=>s+x.qty,0)*10)/10;
  document.getElementById('sumEntries').textContent=arr.length;
  const list=document.getElementById('entryList');
  if(!arr.length){list.innerHTML='<div class="muted" style="text-align:center;padding:16px">'+escHtml(t('empty'))+'</div>';}
  else{
    list.innerHTML=arr.map(e=>'<div class="entry">'+
      '<div class="nm" onclick="renameEntry(\''+e.k+'\')" style="cursor:pointer">'+escHtml(e.item)+' <span style="color:#c4b5fd;font-size:.8em">✏</span>'+
      '<span class="meta">'+(e.heard?'🎤 "'+escHtml(e.heard)+'" · ':'')+escHtml(e.by||'')+' · '+new Date(e.at||0).toLocaleTimeString(LANG==='ko'?'ko-KR':'en-US',{hour:'numeric',minute:'2-digit'})+'</span></div>'+
      '<input class="qty" type="number" step="0.5" min="0" value="'+(+e.qty||0)+'" onchange="setQty(\''+e.k+'\',this.value)">'+
      '<span class="unit">'+escHtml(e.unit||'')+'</span>'+
      '<button class="del" onclick="delEntry(\''+e.k+'\')">✕</button></div>').join('');
  }
  document.getElementById('aggBody').innerHTML=agg.map(x=>'<tr><td>'+escHtml(x.item)+(x.n>1?' <span class="muted">×'+x.n+'</span>':'')+'</td><td class="q">'+x.qty+' '+escHtml(x.unit)+'</td></tr>').join('')
    ||'<tr><td colspan="2" class="muted">'+escHtml(t('noData'))+'</td></tr>';
}

// ===== 내보내기 / 보고 =====
function branchName(){const b=BRANCHES.find(x=>x.id===BRANCH)||{};return b[LANG]||b.ko||BRANCH;}
function exportCsv(){
  const agg=aggregate();
  if(!agg.length){alert(t('noData'));return;}
  let csv='﻿'+t('thItem')+','+t('thQty')+',unit,entries\n';
  agg.forEach(x=>{csv+='"'+x.item.replace(/"/g,'""')+'",'+x.qty+',"'+x.unit+'",'+x.n+'\n';});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='voice-stock_'+BRANCH+'_'+DEPT+'_'+DATE+'.csv';a.click();URL.revokeObjectURL(a.href);
}
function printSummary(){
  const agg=aggregate();
  if(!agg.length){alert(t('noData'));return;}
  document.getElementById('printArea').innerHTML=
    '<h1>'+escHtml(t('reportHead'))+' — '+escHtml(branchName())+' · '+escHtml(deptName())+'</h1>'+
    '<div class="sub">'+escHtml(DATE)+' · '+escHtml(meName())+'</div>'+
    '<table><thead><tr><th>'+escHtml(t('thItem'))+'</th><th style="text-align:right">'+escHtml(t('thQty'))+'</th></tr></thead><tbody>'+
    agg.map(x=>'<tr><td>'+escHtml(x.item)+'</td><td class="q">'+x.qty+' '+escHtml(x.unit)+'</td></tr>').join('')+
    '</tbody></table>'+
    '<div style="margin-top:16px;font-size:10pt;color:#666">'+escHtml(t('printedAt'))+new Date().toLocaleString()+' · KIMCHI MART</div>';
  window.print();
}
async function reportChat(){
  const agg=aggregate();
  if(!agg.length){alert(t('noData'));return;}
  if(!window.__fb){toast(t('waiting'),true);return;}
  const btn=document.getElementById('btnChat');btn.disabled=true;
  const lines=agg.map(x=>'• '+x.item+' — '+x.qty+' '+x.unit).join('\n');
  const now=Date.now();
  // 보고 시간 표기 — 12시간제 (전무님 2026-07-12 "보고시간까지 넣어줘")
  const mkTime=lang=>new Date(now).toLocaleTimeString(lang==='ko'?'ko-KR':lang==='es'?'es-ES':'en-US',{hour:'numeric',minute:'2-digit'});
  const mk=lang=>{const b=BRANCHES.find(x=>x.id===BRANCH)||{};return T.reportHead[lang]+' — '+(b[lang]||b.ko)+' · '+deptName(lang)+' · '+DATE+' '+mkTime(lang)+' ('+meName()+' +1'+(lang==='ko'?'점':'pt')+')\n'+lines;};
  try{
    const {db,ref,set,update}=window.__fb;
    const ts=now,msgId='m'+ts+Math.floor(Math.random()*900);
    const text=mk('ko');
    await set(ref(db,'chat/messages/stock_count/'+msgId),
      {sender:meName(),ts,text,textTr:{ko:text,en:mk('en'),es:mk('es')},meta:{kind:'voice_stock',branch:BRANCH,date:DATE,dept:DEPT}});
    update(ref(db,'chat/rooms/stock_count'),{lastMsg:text.split('\n')[0].slice(0,32),lastTs:ts,lastSender:meName()}).catch(()=>{});
    // 🎤 활동순위 +1점 — 부서·날짜당 1건(덮어쓰기)이라 재보고 중복 적립 없음. leaderboard 가 이 경로 집계.
    set(ref(db,'inventory/voiceReports/'+BRANCH+'/'+DATE+'/'+DEPT),
      {by:meName(),at:ts,items:agg.length,qty:Math.round(agg.reduce((s,x)=>s+x.qty,0)*10)/10}).catch(()=>{});
    toast(t('sent'));
  }catch(e){toast(t('sendFail')+(e&&e.message||e),true);}
  btn.disabled=false;
}

// ===== UI 초기화 =====
function applyLang(){
  document.getElementById('hTitle').textContent=t('title');
  document.getElementById('hint').textContent=t('hint');
  document.getElementById('sumItemsLbl').textContent=t('items');
  document.getElementById('sumQtyLbl').textContent=t('qty');
  document.getElementById('sumEntriesLbl').textContent=t('entries');
  document.getElementById('secManual').textContent=t('manual');
  document.getElementById('secList').textContent=t('list');
  document.getElementById('secAgg').textContent=t('agg');
  document.getElementById('btnPrint').textContent=t('print');
  document.getElementById('btnChat').textContent=t('chat');
  document.getElementById('mItem').placeholder=t('itemPh');
  document.getElementById('mUnit').placeholder=t('unitPh');
  document.getElementById('thItem').textContent=t('thItem');
  document.getElementById('thQty').textContent=t('thQty');
  document.title=t('title')+' · KIMCHI MART';
  updateMicUI();showInterim('');renderBranchSel();renderDepts();render();
}
function setLang(l){
  LANG=l;['tasks.lang','kimchi_lang','hub.lang'].forEach(k=>{try{localStorage.setItem(k,l);}catch(e){}});
  renderLangToggle();applyLang();
}
function renderLangToggle(){
  document.getElementById('langToggle').innerHTML=['ko','en','es']
    .map(l=>'<button class="'+(LANG===l?'active':'')+'" onclick="setLang(\''+l+'\')">'+l.toUpperCase()+'</button>').join('');
}
function renderBranchSel(){
  document.getElementById('branchSel').innerHTML=BRANCHES
    .map(b=>'<option value="'+b.id+'"'+(b.id===BRANCH?' selected':'')+'>'+escHtml(b[LANG]||b.ko)+'</option>').join('');
}
function getParam(k){try{return new URLSearchParams(location.search).get(k);}catch(e){return null;}}
function boot(){
  try{const s=localStorage.getItem('voicestock.branch');if(s&&BRANCHES.some(b=>b.id===s))BRANCH=s;}catch(e){}
  try{const d=localStorage.getItem('voicestock.dept');if(d&&DEPTS.some(x=>x.id===d))DEPT=d;}catch(e){}
  // QR 스캔 진입: ?b=지점&d=부서 — 쿨러/매대에 붙인 부서별 QR 이 바로 그 부서 카운트로 연결
  const pb=getParam('b');if(pb&&BRANCHES.some(b=>b.id===pb)){BRANCH=pb;try{localStorage.setItem('voicestock.branch',pb);}catch(e){}}
  const pd=getParam('d');if(pd&&DEPTS.some(x=>x.id===pd)){DEPT=pd;try{localStorage.setItem('voicestock.dept',pd);}catch(e){}}
  document.getElementById('dateSel').value=DATE;
  document.getElementById('dateSel').onchange=function(){DATE=dateKey(this.value)||dateKey();subscribe();};
  document.getElementById('branchSel').onchange=function(){BRANCH=this.value;try{localStorage.setItem('voicestock.branch',BRANCH);}catch(e){}subscribe();};
  document.getElementById('mItem').addEventListener('keydown',e=>{if(e.key==='Enter')manualAdd();});
  renderLangToggle();renderMicLang();applyLang();subscribe();subscribeVocab();
}
if(window.__fb)boot();else window.addEventListener('fb-ready',boot,{once:true});
window.addEventListener('fb-auth-ready',function(){try{subscribe();subscribeVocab();}catch(e){}});
window.toggleMic=toggleMic;window.setMicLang=setMicLang;window.manualAdd=manualAdd;window.setDept=setDept;
window.delEntry=delEntry;window.setQty=setQty;window.setLang=setLang;window.renameEntry=renameEntry;
window.exportCsv=exportCsv;window.printSummary=printSummary;window.reportChat=reportChat;
</script>
</body>
