@media print{

}
@media(max-width:600px){ .doc{padding:20px 16px} .qrbox{flex-direction:column;text-align:center} }

  body:{

ko:`<p>시행일부터 <b>5개 지점의 모든 벤더 인보이스를 HQ 운영본부가 한 곳에서 접수</b>합니다.
HQ 가 원가 변동을 확인하고 판매가를 조정한 뒤, 지점에 가격표 교체 목록을 보내드립니다.</p>

<h3>1. 어떤 것을 올리나 — 전부입니다</h3>
<ul>
  <li><b>모든 벤더, 모든 인보이스.</b> 종이 · 사진 · 이메일 · PDF · 엑셀 전부</li>
  <li><b>금액과 상관없이 전부.</b> 금액이 작다고 빼지 마세요</li>
  <li><b>반품 · 크레딧 전표(Credit / Return)</b> 도 포함</li>
  <li>배달 명세서(Packing List) 만 먼저 오고 인보이스가 나중에 오면 <b>둘 다</b></li>
  <li>손으로 적은 전표, 영수증 형태도 그대로 올려 주세요</li>
</ul>
<div class="ok">
  ✅ 판단하지 마시고 <b>받은 건 전부</b> 올려 주세요. 무엇이 필요한지는 HQ 가 가려냅니다.
</div>

<h3>2. 어디에 올리나 — 「인보이스 접수」 앱 한 곳</h3>
<p>앱 모음 → 🧾 <b>인보이스 접수</b></p>
<ol class="steps">
  <li><b>지점</b> 확인 (본인 지점이 맞는지)</li>
  <li><b>벤더(거래처)</b> 고르기 — 목록에 없으면 「기타」 에 직접 적으세요</li>
  <li><b>받은 날짜</b> — 배달 받은 날짜로</li>
  <li><b>인보이스 번호</b> — 모르면 비워 두세요</li>
  <li><b>총 몇 장(페이지)</b> — 실제 장수를 적으세요 (3장이면 3). 빠진 장 확인용입니다</li>
  <li><b>사진 찍기</b> 또는 <b>파일 고르기</b> — 여러 장이면 페이지 순서대로</li>
  <li><b>메모</b> — 빠진 장, 냉동만 따로 온 경우 등 특이사항</li>
  <li><b>☁ HQ 운영본부로 보내기</b> 를 누르면 끝입니다</li>
</ol>

<h3>3. 벤더가 이메일로 보내는 경우</h3>
<ul>
  <li>벤더에게 <b>invoice@miamikimchi.com</b> 을 받는 주소에 추가해 달라고 요청하세요</li>
  <li>그러면 지점이 따로 올리지 않아도 HQ 로 바로 들어옵니다</li>
  <li>단, <b>종이 인보이스도 함께 받았다면</b> 앱에 올려 주세요 (금액이 다를 수 있습니다)</li>
  <li>벤더가 거부하거나 방법을 모르면 HQ 에 알려 주세요. HQ 가 직접 연락합니다</li>
</ul>

<h3>4. 언제까지</h3>
<ul>
  <li><b>배달 받은 날 당일</b> 업로드</li>
  <li>늦어도 <b>다음 날 오전 11시</b>까지</li>
  <li>주말 배달분은 <b>월요일 오전</b>까지</li>
</ul>

<h3>5. 종이 원본은 버리지 마세요</h3>
<div class="warn">
  사진을 올렸어도 <b>종이 원본은 지점에서 90일 보관</b>합니다.<br>
  금액 다툼 · 크레딧 청구 · 세무 확인 때 <b>원본이 반드시 필요</b>합니다.
</div>

<h3>6. 사진 찍는 법 — 이것만 지켜 주세요</h3>
<ul>
  <li><b>한 장에 한 페이지.</b> 두 페이지를 한 장에 겹쳐 찍지 마세요</li>
  <li><b>빠진 페이지 없이 전부.</b> 뒷면에 품목이 이어지면 뒷면도 찍으세요</li>
  <li>종이를 <b>평평하게 펴고</b>, 밝은 곳에서, <b>똑바로</b>, 네 모서리가 다 들어오게</li>
  <li>올리기 전에 사진을 <b>확대해서 글자가 읽히는지 확인</b>하세요. 흐리면 다시 찍기</li>
</ul>
<div class="info">
  📸 흐린 사진 한 장 때문에 품목 번호와 단가를 못 읽으면 그 인보이스는 <b>되돌려 드립니다.</b>
  올리기 전 10초만 확인해 주세요.
</div>

<h3>7. 왜 이렇게 하나</h3>
<p>인보이스가 HQ 로 오지 않으면 그 품목의 <b>원가가 갱신되지 않습니다.</b>
원가가 오른 것을 모르고 옛 가격으로 계속 팔면 <b>팔아도 손해가 납니다.</b></p>
<div class="warn">
  지난달 인보이스 대조에서 <b>원가보다 싸게 팔리고 있던 품목이 24건</b> 나왔습니다.
  모두 인보이스가 제때 올라오지 않아 생긴 일입니다.
</div>

<h3>8. 그다음 — 가격표 교체</h3>
<ul>
  <li>HQ 가 원가 변동 확인 → 판매가 조정 → POS 반영</li>
  <li>그 뒤 <b>지점별 가격표 교체 목록</b>을 업무지시로 보냅니다</li>
  <li>지점은 받은 목록대로 <b>매대 가격표만 교체</b>하고 완료를 눌러 주세요</li>
</ul>
<div class="ok">
  ✅ <b>가격은 지점에서 바꾸지 않습니다.</b> HQ 가 보내는 목록으로만 교체합니다.
</div>

<h3>9. 누가 책임지나</h3>
<ul>
  <li><b>각 지점 매니저</b> 책임입니다</li>
  <li>올리는 일을 직원에게 맡겨도 되지만, <b>그 직원 이름을 HQ 에 알려 주세요</b> (아래 확인란)</li>
  <li>매니저 휴무일에도 올라가야 하니 <b>대리 담당을 꼭 정해 두세요</b></li>
</ul>

<h3>10. 문의</h3>
<p>채팅 → <b>업무 지시</b> → 본사 업무지시로 답글을 주시거나, 접수 앱 안에서 바로 물어보셔도 됩니다.</p>`,

en:`<p>Effective on the date above, <b>HQ Operations collects all vendor invoices from all five stores in one place.</b>
HQ reviews cost changes, adjusts retail prices, and then sends each store a price-tag replacement list.</p>

<h3>1. What to upload — everything</h3>
<ul>
  <li><b>Every vendor, every invoice.</b> Paper, photo, email, PDF, Excel — all of it</li>
  <li><b>Regardless of amount.</b> Do not skip small invoices</li>
  <li><b>Credit and return slips</b> are included</li>
  <li>If a packing list arrives first and the invoice comes later, send <b>both</b></li>
  <li>Handwritten slips and receipt-style invoices too</li>
</ul>
<div class="ok">
  ✅ Do not try to judge what matters — <b>upload everything you receive.</b> HQ will sort out what is needed.
</div>

<h3>2. Where to upload — one place: the Invoice Intake app</h3>
<p>Apps → 🧾 <b>Invoice Intake</b></p>
<ol class="steps">
  <li>Check the <b>Store</b> (make sure it is your own store)</li>
  <li>Pick the <b>Vendor</b> — if it is not listed, type it under "Other"</li>
  <li><b>Date received</b> — the day the delivery arrived</li>
  <li><b>Invoice number</b> — leave blank if you do not know it</li>
  <li><b>How many pages</b> — enter the real count (3 sheets → 3). This is how we catch missing pages</li>
  <li><b>Take Photo</b> or <b>Choose File</b> — if several, in page order</li>
  <li><b>Note</b> — anything unusual: a missing page, frozen items billed separately, etc.</li>
  <li>Press <b>☁ Send to HQ Operations</b>. Done.</li>
</ol>

<h3>3. When the vendor emails the invoice</h3>
<ul>
  <li>Ask the vendor to add <b>invoice@miamikimchi.com</b> to their recipient list</li>
  <li>It then reaches HQ directly, with no action from the store</li>
  <li>But if you <b>also received a paper copy</b>, upload it — amounts can differ</li>
  <li>If the vendor refuses or does not know how, tell HQ and we will contact them directly</li>
</ul>

<h3>4. Deadline</h3>
<ul>
  <li>Upload <b>the same day the delivery arrives</b></li>
  <li><b>No later than 11:00 AM the next day</b></li>
  <li>Weekend deliveries: by <b>Monday morning</b></li>
</ul>

<h3>5. Do not throw away the paper original</h3>
<div class="warn">
  Even after uploading a photo, <b>keep the paper original at the store for 90 days.</b><br>

/* ── 렌더 ── */
let LANG='ko';
try{ const v=localStorage.getItem('kimchi_lang'); if(['ko','en','es'].includes(v))LANG=v; }catch(e){}

function cur(){ const id=document.getElementById('pick').value; return NOTICES.find(n=>n.id===id)||NOTICES[0]; }
function g(o,l){ return o?(o[l]||o.ko):''; }

function docHtml(n,l){
  return '<div class="doc">'
   +'<div class="brand"><div class="co">'+g(LBL.co,l)+'</div><div class="dept">'+g(LBL.dept,l)+'</div></div>'
   +'<table class="meta">'
   +'<tr><td class="k">'+g(LBL.no,l)+'</td><td>'+n.no+'</td><td class="k">'+g(LBL.date,l)+'</td><td>'+g(n.date,l)+'</td></tr>'
   +'<tr><td class="k">'+g(LBL.to,l)+'</td><td colspan="3">'+g(LBL.toV,l)+'</td></tr>'
   +'<tr><td class="k">'+g(LBL.from,l)+'</td><td colspan="3">'+g(LBL.fromV,l)+'</td></tr>'
   +'</table>'
   +'<h2 class="title">'+g(n.title,l)+'</h2>'
   +g(n.body,l)
   +(n.qr?('<div class="qrbox"><img src="'+QR+'" alt="QR"><div class="t">'+g(LBL.qrT,l)
     +'<div class="u">'+APP_URL+'</div></div></div>'):'')
   +'<div class="sign"><div class="d">'+g(LBL.signD,l)+'</div><div>'+g(LBL.signP,l)+'</div></div>'
   +'<div class="ack"><div class="h">'+g(LBL.ackH,l)+'</div><table>'
   +'<tr><td class="k">'+g(LBL.ackB,l)+'</td><td></td><td class="k">'+g(LBL.ackD,l)+'</td><td></td></tr>'
   +'<tr><td class="k">'+g(LBL.ackM,l)+'</td><td></td><td class="k">'+g(LBL.ackS,l)+'</td><td></td></tr>'
   +'</table></div>'
   +'</div>';
}

function render(all){
  const n=cur();
  const langs = all ? ['ko','en','es'] : [LANG];
  document.getElementById('out').innerHTML = langs.map(l=>docHtml(n,l)).join('');
  ['ko','en','es'].forEach(l=>document.getElementById('L_'+l).classList.toggle('on',l===LANG));
}
function setLang(l){ LANG=l; try{ localStorage.setItem('kimchi_lang',l); }catch(e){} fillPick(); render(); }
function pr(all){ render(all); setTimeout(function(){ window.print(); setTimeout(function(){ render(); },400); },120); }

/* 채팅용 — 서식 없는 글로 복사 */
function copyChat(){
  const txt=g(cur().chat,LANG);
  const done=function(){ toast('📋 복사했습니다 — 본사 업무지시나 채팅방에 붙여 넣으세요'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){ fallback(txt); });
  } else fallback(txt);
}
function fallback(txt){
  const ta=document.createElement('textarea'); ta.value=txt;
  ta.style.cssText='position:fixed;top:-9999px'; document.body.appendChild(ta);
  ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  ta.remove();
  toast(ok?'📋 복사했습니다':'복사가 안 됩니다 — 글을 직접 선택해 주세요');
}
let tt=null;
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(function(){ el.classList.remove('on'); },2600); }

function fillPick(){
  const sel=document.getElementById('pick'); const keep=sel.value;
  sel.innerHTML = NOTICES.map(function(n){
    return '<option value="'+n.id+'">'+n.no+' — '+g(n.title,LANG)+'</option>'; }).join('');
  if(keep) sel.value=keep;
}
fillPick();
render();
</script>
