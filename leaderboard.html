.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-bottom:18px;align-items:end}
.pod{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px 8px 12px;text-align:center;position:relative}
.pod.gold{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#f59e0b;padding-top:18px;padding-bottom:16px}
.pod.silver{background:linear-gradient(135deg,#e5e7eb,#d1d5db);border-color:#9ca3af}

.pod .av{width:54px;height:54px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2em;margin:0 auto 6px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pod.gold .av{width:64px;height:64px;font-size:1.4em}
.pod .nm{font-weight:800;font-size:.92em;color:#1f2937;line-height:1.2;margin-bottom:2px;word-break:keep-all;overflow-wrap:break-word}
.pod .br{font-size:.74em;color:#6b7280;margin-bottom:6px}
.pod .pt{font-weight:900;font-size:1.15em;color:#1a5c3a}
.pod.gold .pt{font-size:1.3em;color:#92400e}
.pod.empty{opacity:.5}
.pod.empty .nm{color:#9ca3af}
.list{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:14px}
.row{display:grid;grid-template-columns:30px 40px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #f3f4f6}
.row:last-child{border-bottom:0}
.row .rk{font-weight:800;color:#9ca3af;font-size:.92em}
.row .av{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.84em}
.row .info .nm{font-weight:700;font-size:.92em;color:#1f2937}

.row .pt .pts-lbl{display:block;font-size:.66em;color:#9ca3af;font-weight:600}
.empty{padding:30px 20px;text-align:center;color:#9ca3af}

.branch-mvps .mvp .b{color:#166534;font-weight:700}
.branch-mvps .mvp .n{font-weight:700;color:#1f2937;margin-top:2px}

.loading{padding:40px;text-align:center;color:#6b7280}

let LANG = 'en';
try {
  var saved = localStorage.getItem('kimchi_lang') || localStorage.getItem('hub.lang') || localStorage.getItem('tasks.lang');
  if (saved === 'ko' || saved === 'en' || saved === 'es') LANG = saved;
  else {
    // 자동 감지 — 폰 기본 언어
    var nav = (navigator.language || 'en').toLowerCase();
    if (nav.startsWith('ko')) LANG = 'ko';
    else if (nav.startsWith('es')) LANG = 'es';
    else LANG = 'en';
  }
} catch(e){}
function t(key, ...args){
  const entry = T[key];
  if (!entry) return key;
  const v = entry[LANG] || entry.en || entry.ko;
  return typeof v === 'function' ? v(...args) : v;
}
function applyStaticI18n(){
  document.title = t('docTitle');
  const setText = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  setText('pageTitle', t('pageTitle'));
  setText('branchOptAll', t('branchAll'));
  setText('btnRefresh', t('refresh'));
  // 탭 버튼 라벨
  const tabBar = document.getElementById('tabBar');
  if (tabBar) {
    const map = { today: t('tabToday'), week: t('tabWeek'), month: t('tabMonth'), lastmonth: t('tabLastMonth'), all: t('tabAll') };
    tabBar.querySelectorAll('button[data-r]').forEach(btn => {
      const r = btn.getAttribute('data-r');
      if (map[r]) btn.textContent = map[r];
    });
  }
  // 언어 버튼 active 표시
  document.querySelectorAll('#langTabs button[data-lang]').forEach(btn => {
    const isActive = btn.getAttribute('data-lang') === LANG;
    btn.style.background = isActive ? '#1a5c3a' : 'transparent';
    btn.style.color = isActive ? '#fff' : '#6b7280';
  });

      const b = BRANCHES.find(x => x.id === opt.value);
      if (b) opt.textContent = '🏢 ' + (b[LANG] || b.ko);
    });
  }

// 사진 남발 방지 — 한 번에 100장 올려도 점수는 최대 20장까지만 인정.
const MAX_PHOTOS_PER_MSG = 20;
// 🆕 옵션 B — 채팅 농사 방지. 1인당 1일 채팅 관련 점수 최대 10pt.
// 윈도우 길이 비례 (today=10, week=70, month=300, all=거의 무제한).
// 채팅 메시지 + 사진 + 반응 + 댓글 점수 합쳐 이 cap 이상 안 넘게.
const CHAT_DAILY_CAP = 10;

let CUR_RANGE = 'week';
let CUR_BRANCH = 'ALL';

// ============== Time window ==============
function rangeStart(){
  const t = new Date(); t.setHours(0,0,0,0);
  if (CUR_RANGE === 'today')  return t.getTime();
  if (CUR_RANGE === 'week') {
    // Monday-start week (Korean / business convention)
    const day = (t.getDay() + 6) % 7;   // 0=Mon, 6=Sun
    return t.getTime() - day * 86400000;
  }
  if (CUR_RANGE === 'month') {
    const m = new Date(t.getFullYear(), t.getMonth(), 1);
    return m.getTime();
  }
  if (CUR_RANGE === 'lastmonth') {
    // 지난 달 1일 0시 — 상금 정산용. 끝(상한)은 rangeEnd() 가 이번 달 1일로 막음.
    const m = new Date(t.getFullYear(), t.getMonth() - 1, 1);
    return m.getTime();
  }
  return 0;
}
// 윈도우 끝(상한, exclusive). 'lastmonth' 만 상한이 있고 나머지는 '지금까지'(=무한대).
function rangeEnd(){
  if (CUR_RANGE === 'lastmonth') {
    const t = new Date(); t.setHours(0,0,0,0);
    return new Date(t.getFullYear(), t.getMonth(), 1).getTime();   // 이번 달 1일 0시
  }
  return Infinity;
}

// ============== Auth helper for REST ==============
async function authParam(){
  try {
    const u = window.__lbAuth?.currentUser;
    if (!u) return '';
    const tok = await u.getIdToken();
    return tok ? '?auth=' + encodeURIComponent(tok) : '';
  } catch(_) { return ''; }
}

// ============== Branch dropdown ==============
function initBranchSel(){
  const sel = document.getElementById('branchSel');
  BRANCHES.forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.id;
    opt.textContent = '🏢 ' + (b[LANG] || b.ko);
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => { CUR_BRANCH = sel.value; loadAll(); });
}

// ============== Tab handler ==============
function initTabs(){
  document.getElementById('tabBar').addEventListener('click', e => {
    const b = e.target.closest('button[data-r]');
    if (!b) return;
    document.querySelectorAll('#tabBar button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');

// ============== User profile lookup ==============
// /users/{uid} → { name, email, role, branch }
let USERS = {};                  // uid → profile
let NAME_TO_PROFILE = new Map(); // name(lower) → profile (best-effort match for chat senders)
// 🔧 2026-05-15: schedules/{branch}/employees 를 권위 source 로 사용.
// task hint 따라 branch 잘못 박히던 사건 (Anderson Godoy 가 HOLLYWOOD 인데
// 코럴/마이애미로 표시) 해결. 같은 이름이 여러 매장에 있으면 첫번째 매장으로.
let NAME_TO_BRANCH = new Map();  // name(normalized, no spaces, uppercase) → branchId
function _normForBranchLookup(s){
  return String(s||'').toUpperCase().replace(/\s+/g,'').replace(/[^A-Z0-9_가-힣]/g,'');
}
async function loadBranchEmployees(){
  const aq = await authParam();
  NAME_TO_BRANCH.clear();
  await Promise.all(BRANCHES.map(async b => {
    try {
      const r = await fetch(`${FB_DB}/schedules/${b.id}/employees.json${aq}`, { cache:'no-store' });
      if (!r.ok) return;
      const arr = await r.json();
      if (!Array.isArray(arr)) return;
      arr.forEach(e => {
        if (!e || !e.name) return;
        const key = _normForBranchLookup(e.name);
        if (key && !NAME_TO_BRANCH.has(key)) NAME_TO_BRANCH.set(key, b.id);
      });
    } catch(_){}
  }));
  console.info('[lb] schedules NAME_TO_BRANCH ready —', NAME_TO_BRANCH.size, 'employees mapped');
}
async function loadUsers(){
  const aq = await authParam();
  // schedules 기반 매장 매핑 먼저
  await loadBranchEmployees();
  const r = await fetch(`${FB_DB}/users.json${aq}`, { cache: 'no-store' });
  if (!r.ok) { USERS = {}; return; }
  const d = await r.json();
  USERS = d || {};
  NAME_TO_PROFILE.clear();
  OWNER_UIDS.clear();
  for (const [uid, p] of Object.entries(USERS)) {
    if (!p) continue;
    if (p.role === 'OWNER') OWNER_UIDS.add(uid);
    if (p.email && EXCLUDE_EMAILS.has(p.email.toLowerCase())) OWNER_UIDS.add(uid);
    if (p.name) NAME_TO_PROFILE.set(p.name.toLowerCase(), { uid, ...p });
  }
}

function isExcludedSender(name, branch){
  if (!name) return true;
  const low = String(name).toLowerCase().trim();
  if (EXCLUDE_NAMES.has(low) || EXCLUDE_NAMES.has(name)) return true;
  // Cross-check with /users record by name → role==='OWNER'
  const p = NAME_TO_PROFILE.get(low);
  if (p && (p.role === 'OWNER' || p.role === 'EXECUTIVE' || EXCLUDE_EMAILS.has((p.email||'').toLowerCase()))) return true;
  return false;
}

// ============== Aggregation ==============
// agg[name] = { name, branch, color, expiryAdd, expiryCheck, expiryDiscard,
//   taskComplete, taskPoints, chatMsg, chatPhoto, reaction, reply, score }
// taskPoints = 매니저가 task 발송 시 선택한 1·2·3 점 합 (실 score 계산용).
// taskComplete = 완료 건수만 (배지 노출용).
const _DEFAULT_ROW = () => ({ expiryAdd:0, expiryCheck:0, expiryDiscard:0, taskComplete:0, taskPoints:0, chatMsg:0, chatPhoto:0, reaction:0, reactionGiven:0, reply:0, score:0 });
function bumpAgg(agg, name, branchHint, key, n=1, color){
  if (!name || isExcludedSender(name, branchHint)) return;
  const k = name.trim();
  // 🔧 2026-05-15: 우선순위 1 — schedules/{branch}/employees 에 등록된 매장 (권위).
  //   같은 이름이 다른 매장 task 를 도와줘도 본인 등록 매장으로 표시.
  // 우선순위 2 — users/{uid}.branch
  // 우선순위 3 — branchHint (task.branchId / senderBranch)
  const schedBranch = NAME_TO_BRANCH.get(_normForBranchLookup(k));
  const usersProfile = NAME_TO_PROFILE.get(k.toLowerCase());
  const usersBranch = (usersProfile && usersProfile.branch && usersProfile.branch !== '*') ? usersProfile.branch : null;
  const authoritativeBranch = schedBranch || usersBranch || branchHint || '';
  if (!agg[k]) agg[k] = Object.assign({ name: k, branch: authoritativeBranch, color: color || '' }, _DEFAULT_ROW());
  agg[k][key] = (agg[k][key] || 0) + n;
  // 권위 branch 가 있으면 항상 그걸로 — task hint 가 다른 매장이었어도 무시
  if (schedBranch || usersBranch) agg[k].branch = authoritativeBranch;
}
function colorFor(name){
  let h = 0; for (const c of (name||'')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const palette = ['#1a5c3a','#0369a1','#7c3aed','#db2777','#dc2626','#d97706','#059669','#0891b2','#2563eb'];
  return palette[h % palette.length];
}

async function fetchExpiry(agg, since, until){
  const aq = await authParam();
  const branches = (CUR_BRANCH === 'ALL') ? BRANCHES.map(b => b.id) : [CUR_BRANCH];
  await Promise.all(branches.map(async (br) => {
    try {
      const r = await fetch(`${FB_DB}/expiry/${br}/products.json${aq}`, { cache:'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      if (!d) return;
      Object.values(d).forEach(p => {
        if (!p || typeof p !== 'object') return;
        // Add event — 사진 첨부 시에만 점수 인정 (사진 1장당 0.3)
        if ((p.addedAt || 0) >= since && (p.addedAt || 0) < until && p.addedBy && p.photo) {
          bumpAgg(agg, p.addedBy, br, 'expiryAdd', 1);
        }
        // Check event (separate from add — counts re-checks)
        if ((p.lastCheckedAt || 0) >= since && (p.lastCheckedAt || 0) < until && p.lastCheckedBy
            && (p.lastCheckedAt !== p.addedAt)) {
          bumpAgg(agg, p.lastCheckedBy, br, 'expiryCheck', 1);
        }
        // Discard event — using discardedAt if present; otherwise count
        // any record currently 'discarded' added/checked in window
        if (p.status === 'discarded') {
          const ts = p.discardedAt || p.lastCheckedAt || p.addedAt || 0;
          if (ts >= since && ts < until) bumpAgg(agg, p.lastCheckedBy || p.addedBy, br, 'expiryDiscard', 1);
        }
      });
    } catch(e) { console.warn('[lb] expiry', br, e); }
  }));
}

// Tasks live at /tasks/{branch}/{YYYY-MM-DD}/{taskId}. Each completed
// task awards +1.0 to t.completedBy. We walk every branch's full
// year-bucket tree so any task completed in the time window counts.
async function fetchTasks(agg, since, until){
  const aq = await authParam();
  const branches = (CUR_BRANCH === 'ALL') ? BRANCHES.map(b => b.id) : [CUR_BRANCH];
  await Promise.all(branches.map(async (br) => {
    try {
      const r = await fetch(`${FB_DB}/tasks/${br}.json${aq}`, { cache:'no-store' });
      if (!r.ok) return;
      const tree = await r.json();
      if (!tree) return;
      // tree is { dateString: { taskId: taskObj } }
      Object.values(tree).forEach(dayBucket => {
        if (!dayBucket || typeof dayBucket !== 'object') return;
        Object.values(dayBucket).forEach(t => {
          if (!t || typeof t !== 'object') return;
          if (!t.completedAt || !t.completedBy) return;
          if (t.completedAt < since || t.completedAt >= until) return;
          // taskComplete = 완료 건수 (배지용), taskPoints = 매니저가 부여한
          // 1·2·3 점 합 (실제 score 계산용). points 필드 없는 레거시 task 는
          // 기본 1점 처리해 호환성 유지.
          bumpAgg(agg, t.completedBy, br, 'taskComplete', 1);
          const pts = (typeof t.points === 'number' && t.points >= 1 && t.points <= 5) ? t.points : 1;
          bumpAgg(agg, t.completedBy, br, 'taskPoints', pts);
        });
      });
    } catch(e) { console.warn('[lb] tasks', br, e); }
  }));
}

async function fetchChat(agg, since, until){
  const aq = await authParam();
  // First grab the rooms list — cheaper than guessing IDs.
  let rooms = {};
  try {
    const r = await fetch(`${FB_DB}/chat/rooms.json${aq}`, { cache:'no-store' });
    if (r.ok) rooms = (await r.json()) || {};
  } catch(e){ console.warn('[lb] rooms', e); }
  const ids = Object.keys(rooms);
  if (!ids.length) return;
  await Promise.all(ids.map(async (rid) => {
    try {
      const r = await fetch(`${FB_DB}/chat/messages/${encodeURIComponent(rid)}.json${aq}`, { cache:'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      if (!d) return;
      Object.values(d).forEach(m => {
        if (!m || typeof m !== 'object') return;
        const ts = m.ts || 0;
        // Note: we DON'T filter the whole message out by ts here — we
        // need to evaluate replies (each has its own ts) even if the
        // parent thread is old. Main-message scoring still gates on ts.
        const inWindow = ts >= since && ts < until;
        const branchOk = (CUR_BRANCH === 'ALL') || !m.senderBranch || (m.senderBranch === CUR_BRANCH);

        if (inWindow && branchOk && m.sender) {
          bumpAgg(agg, m.sender, m.senderBranch || '', 'chatMsg', 1, m.color);
          // 한 메시지에 사진 21장 이상 올려도 점수는 20장까지만 — 21번째부터는
          // 보너스 0점으로 처리해서 점수 부풀리기 방지.
          const phRaw = (m.photos && m.photos.length) || 0;
          const ph = Math.min(phRaw, MAX_PHOTOS_PER_MSG);
          if (ph > 0) bumpAgg(agg, m.sender, m.senderBranch || '', 'chatPhoto', ph, m.color);

          // 👍 Reactions — 2026-05-28 옵션 B (전무님 지시):
          //   - 받은 사람(메시지 작성자): +1 reaction (0.2pt) — 큰 보상
          //   - 누른 사람(reactor): +1 reactionGiven (0.05pt) — 응원자도 인정
          //   - self-react (자기 메시지에 자기 좋아요) 는 양쪽 다 카운트 제외 (어뷰징 방지)
          if (m.reactions && typeof m.reactions === 'object' && m.sender){
            for (const emoji of Object.keys(m.reactions)) {
              const usersMap = m.reactions[emoji];
              if (!usersMap || typeof usersMap !== 'object') continue;
              for (const [, displayName] of Object.entries(usersMap)) {
                if (!displayName) continue;
                if (displayName === m.sender) continue;  // self-react 제외
                // 받은 사람 (메시지 작성자)
                bumpAgg(agg, m.sender, m.senderBranch || '', 'reaction', 1, m.color);
                // 누른 사람 (응원자) — 적은 점수
                bumpAgg(agg, displayName, '', 'reactionGiven', 1);
              }
            }
          }
        }

        // 💬 Replies — each carries its own ts so score it independently.
        // A reply on an old parent still earns points for the replier
        // when made within the current window.
        if (m.replies && typeof m.replies === 'object') {
          for (const r of Object.values(m.replies)) {
            if (!r || typeof r !== 'object') continue;
            const rts = r.ts || 0;
            if (rts < since || rts >= until) continue;
            if (CUR_BRANCH !== 'ALL' && r.senderBranch && r.senderBranch !== CUR_BRANCH) continue;
            if (!r.sender) continue;
            bumpAgg(agg, r.sender, r.senderBranch || '', 'reply', 1);
          }
        }
      });
    } catch(e){ console.warn('[lb] msgs', rid, e); }
  }));
}

function computeScores(agg){
  // 🆕 옵션 B — 윈도우 길이 비례 채팅 cap.
  const days = CUR_RANGE === 'today' ? 1
             : CUR_RANGE === 'week'  ? 7
             : CUR_RANGE === 'month' ? 30
             : CUR_RANGE === 'lastmonth' ? 31
             :                         9999;   // 'all' = 사실상 무제한
  const chatCap = CHAT_DAILY_CAP * days;
  Object.values(agg).forEach(r => {
    // 채팅 관련 점수 (메시지·사진·댓글) → cap 적용
    // 2026-05-27 전무님 지시: reaction (받은 좋아요) 은 캡에서 제외 — 받는 사람이
    // 직접 조작 못 함 (남이 줘야 받음) → 어뷰징 위험 낮음 → 무제한 누적 OK.
    const chatRaw = r.chatMsg     * SCORE.chatMessage
                  + r.chatPhoto   * SCORE.chatPhoto
                  + r.reply       * SCORE.reply;
    const chatCapped = Math.min(chatRaw, chatCap);
    const reactionScore = r.reaction * SCORE.reaction;           // 받은 좋아요 (캡 없음, 0.2/개)
    const reactionGivenScore = (r.reactionGiven||0) * SCORE.reactionGiven;  // 누른 좋아요 (캡 없음, 0.05/개)
    // 💎 task 점수는 taskPoints (매니저가 부여한 1·2·3 합) 그대로 사용
    r.score =
      r.expiryAdd     * SCORE.expiryAdd
    + r.expiryCheck   * SCORE.expiryCheck
    + r.expiryDiscard * SCORE.expiryDiscard
    + r.taskPoints    // 그대로 합산 (1·2·3 점)
    + chatCapped      // 채팅 cap 적용된 점수
    + reactionScore   // 받은 좋아요 점수 (캡 없음, 0.2/개)
    + reactionGivenScore;  // 누른 좋아요 점수 (캡 없음, 0.05/개) — 옵션 B
    r.score = Math.round(r.score * 10) / 10;
    // 디버깅용 — 채팅이 cap 으로 깎였는지 표시 (UI 배지에 활용 가능)
    r.chatCapped = (chatRaw > chatCap);
    if (!r.color) r.color = colorFor(r.name);
  });
}

// ============== Render ==============
function initials(name){
  if (!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0]||'') + (parts[1][0]||'');
  return name.slice(0, 2);
}
function branchLabel(id){
  const b = BRANCHES.find(b => b.id === id);
  if (!b) return id || '';
  return b[LANG] || b.ko;
}
function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderPodium(top3){
  if (top3.length === 0) {
    return `<div class="empty">${escHtml(t('noData'))}</div>`;
  }
  const slots = [top3[1], top3[0], top3[2]];   // silver, gold, bronze
  const classes = ['silver','gold','bronze'];
  const ranks = ['🥈','🥇','🥉'];
  return `<div class="podium">${
    slots.map((r, i) => {
      if (!r) return `<div class="pod ${classes[i]} empty"><div class="rank">${ranks[i]}</div><div class="av" style="background:#9ca3af">·</div><div class="nm">—</div><div class="pt">0</div></div>`;
      return `<div class="pod ${classes[i]}">
        <div class="rank">${ranks[i]}</div>
        <div class="av" style="background:${r.color}">${escHtml(initials(r.name).toUpperCase())}</div>
        <div class="nm">${escHtml(r.name)}</div>
        <div class="br">🏢 ${escHtml(branchLabel(r.branch))}</div>
        <div class="pt">${r.score}${t('pt')}</div>
      </div>`;
    }).join('')
  }</div>`;
}

function renderRows(rest){
  if (rest.length === 0) {
    return `<div class="list"><div class="empty" style="padding:18px 14px">${escHtml(t('noMore'))}</div></div>`;
  }
  return `<div class="list">${
    rest.map((r, i) => {
      const bd = [];
      if (r.expiryAdd)     bd.push(`📦${r.expiryAdd}`);
      if (r.expiryCheck)   bd.push(`✅${r.expiryCheck}`);
      if (r.expiryDiscard) bd.push(`❌${r.expiryDiscard}`);
      if (r.taskComplete)  bd.push(`📋${r.taskComplete}${r.taskPoints && r.taskPoints !== r.taskComplete ? '⭐'+r.taskPoints : ''}`);
      if (r.chatMsg)       bd.push(`💬${r.chatMsg}`);
      if (r.chatPhoto)     bd.push(`📷${r.chatPhoto}`);
      if (r.reply)         bd.push(`↩️${r.reply}`);
      if (r.reaction)      bd.push(`👍${r.reaction}`);
      return `<div class="row">
        <div class="rk">${i + 4}</div>
        <div class="av" style="background:${r.color}">${escHtml(initials(r.name).toUpperCase())}</div>
        <div class="info">
          <div class="nm">${escHtml(r.name)}</div>
          <div class="br">🏢 ${escHtml(branchLabel(r.branch) || '—')}</div>
          <div class="breakdown">${bd.join(' · ') || '—'}</div>
        </div>
        <div class="pt">${r.score}<span class="pts-lbl">${t('pt')}</span></div>
      </div>`;
    }).join('')
  }</div>`;
}

function renderBranchMVPs(allRows){
  if (CUR_BRANCH !== 'ALL') return '';
  // Group by branch, pick top scorer per branch
  const byBranch = {};
  for (const r of allRows) {
    if (!r.branch) continue;
    if (!byBranch[r.branch] || byBranch[r.branch].score < r.score) byBranch[r.branch] = r;
  }
  const cards = BRANCHES.map(b => {
    const lbl = b[LANG] || b.ko;
    const mvp = byBranch[b.id];
    if (!mvp) return `<div class="mvp"><div class="b">🏢 ${escHtml(lbl)}</div><div class="n" style="color:#9ca3af">${escHtml(t('noActivity'))}</div></div>`;
    return `<div class="mvp"><div class="b">🏢 ${escHtml(lbl)}</div><div class="n">${escHtml(mvp.name)}</div><div class="p">${mvp.score}${t('pt')}</div></div>`;
  }).join('');
  return `<div class="branch-mvps">
    <h3>${escHtml(t('branchMvpsHd'))}</h3>
    <div class="mvp-grid">${cards}</div>
  </div>`;
}

// 🏪 매장 합산 순위 — 각 지점 전 직원 점수 합산 후 등수. 상금/정산용.
function renderStoreRank(allRows){
  if (CUR_BRANCH !== 'ALL') return '';
  const sums = {};
  for (const r of allRows) {
    if (!r.branch) continue;
    sums[r.branch] = (sums[r.branch] || 0) + (r.score || 0);
  }
  const ranked = BRANCHES
    .map(b => ({ id:b.id, label:(b[LANG]||b.ko), score: Math.round((sums[b.id]||0)*10)/10 }))
    .filter(x => x.score > 0)
    .sort((a,b) => b.score - a.score);
  if (!ranked.length) return '';
  const medals = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];
  const rows = ranked.map((s, i) => `
    <div class="sr-row${i===0?' top1':''}">
      <div class="sr-medal">${medals[i] || (i+1)}</div>
      <div class="sr-name">${escHtml(s.label)}</div>
      <div class="sr-pt">${s.score}${t('pt')}</div>
    </div>`).join('');
  return `<div class="store-rank">
    <h3>${escHtml(t('branchRankHd'))}</h3>
    ${rows}
  </div>`;
}

function renderLegend(){
  return `<div class="legend">
    <b>${escHtml(t('legendHd'))}</b><br>
    📦 ${escHtml(t('legExpAdd'))} <code>+0.3</code> ${escHtml(t('legExpAddNote'))} · ✅ ${escHtml(t('legExpCheck'))} <code>+0.2</code> · ❌ ${escHtml(t('legExpDisc'))} <code>+0.2</code><br>
    📋 ${escHtml(t('legTask'))} <code>+1~+3</code> ${escHtml(t('legTaskNote'))}<br>
    💬 ${escHtml(t('legChatMsg'))} <code>+0.3</code> · 📷 ${escHtml(t('legChatPhoto'))} <code>+0.1</code><br>
    ↩️ ${escHtml(t('legReply'))} <code>+0.2</code> · 👍 ${escHtml(t('legReaction'))} <code>+0.2</code><br>
    <span style="color:#92400e;font-weight:600;font-size:.95em">${escHtml(t('legChatCap'))}</span>
  </div>`;
}

// ============== Main ==============
async function loadAll(){
  document.getElementById('content').innerHTML = `<div class="loading"><div class="ic">⏳</div>${escHtml(t('loading'))}</div>`;
  const since = rangeStart();
  const until = rangeEnd();
  const agg = {};
  // Wait for auth before pulling /users (rules likely require auth!=null)
  await new Promise(res => {
    if (window.__lbAuth?.currentUser) return res();
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (window.__lbAuth?.currentUser || Date.now() - t0 > 5000) {
        clearInterval(iv); res();
      }
    }, 150);
  });
  await loadUsers();
  await Promise.all([fetchExpiry(agg, since, until), fetchChat(agg, since, until), fetchTasks(agg, since, until)]);
  computeScores(agg);
  // Filter to anyone with score > 0
  const rows = Object.values(agg).filter(r => r.score > 0).sort((a,b) => b.score - a.score);
  const top3 = rows.slice(0, 3);
  const rest = rows.slice(3, 50);

  const rangeLbl = CUR_RANGE === 'today' ? t('rangeTodayLbl')
                 : CUR_RANGE === 'week'  ? t('rangeWeekLbl')
                 : CUR_RANGE === 'month' ? t('rangeMonthLbl')
                 : CUR_RANGE === 'lastmonth' ? t('rangeLastMonthLbl')
                 :                          t('rangeAllLbl');
  const totalPts = rows.reduce((s,r) => s + r.score, 0).toFixed(1);
  document.getElementById('subText').textContent =
    `${rangeLbl} · ${t('statsActive', rows.length)} · ${t('statsTotal', totalPts)}`;

  const html = `${renderPodium(top3)}${renderStoreRank(rows)}${renderBranchMVPs(rows)}${renderRows(rest)}${renderLegend()}`;
  document.getElementById('content').innerHTML = html;
}

initBranchSel();
initTabs();
applyStaticI18n();   // 언어 버튼·탭 라벨·refresh 버튼 즉시 다국어 적용
loadAll();
window.loadAll = loadAll;

// 🖨 프린트 — 현재 범위·지점 표시 후 인쇄 다이얼로그 호출
function printLeaderboard(){
  const rangeLabel = { today:'오늘', week:'이번 주', month:'이번 달', lastmonth:'지난 달', all:'전체' }[CUR_RANGE] || CUR_RANGE;
  const branchSel = document.getElementById('branchSel');
  const branchLabel = branchSel && branchSel.selectedOptions[0] ? branchSel.selectedOptions[0].textContent.trim() : 'ALL';
  const dateStr = new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'});
  document.body.dataset.printTitle = `${branchLabel} · ${rangeLabel} (${dateStr})`;
  setTimeout(() => window.print(), 100);
}
window.printLeaderboard = printLeaderboard;
</script>
