<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Pretendard Variable','Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f4f6f9;color:#1f2937;font-size:14px;padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 60px;padding-left:54px}
@media(min-width:761px){.wrap{padding-left:14px;margin-left:240px}}
h1{font-size:1.3em;font-weight:800;color:#1a5c3a;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sub{color:#6b7280;font-size:.85em;margin-bottom:14px}
.toolbar{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar select{padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;font-family:inherit;font-size:.85em;background:#fff;outline:none}
.tab-bar{display:flex;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:6px;margin-bottom:14px}
.tab-bar button{flex:1;min-width:70px;background:transparent;border:0;padding:8px 10px;border-radius:8px;font-family:inherit;font-size:.85em;font-weight:600;color:#6b7280;cursor:pointer}
.tab-bar button.active{background:#1a5c3a;color:#fff;font-weight:700}
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-bottom:18px;align-items:end}
.pod{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px 8px 12px;text-align:center;position:relative}
.pod.gold{background:linear-gradient(135deg,#fef3c7,#fde68a);border-color:#f59e0b;padding-top:18px;padding-bottom:16px}
.pod.silver{background:linear-gradient(135deg,#e5e7eb,#d1d5db);border-color:#9ca3af}
.pod.bronze{background:linear-gradient(135deg,#fed7aa,#fdba74);border-color:#f97316}
.pod .rank{font-size:1.6em;line-height:1;margin-bottom:4px}
.pod.gold .rank{font-size:2em}
.pod .av{width:54px;height:54px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2em;margin:0 auto 6px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pod.gold .av{width:64px;height:64px;font-size:1.4em}
.pod .nm{font-weight:800;font-size:.92em;color:#1f2937;line-height:1.2;margin-bottom:2px;word-break:keep-all;overflow-wrap:break-word}
.pod .br{font-size:.74em;color:#6b7280;margin-bottom:6px}
.pod .pt{font-weight:900;font-size:1.15em;color:#1a5c3a}
.pod.gold .pt{font-size:1.3em;color:#92400e}
.pod .pod-bd{font-size:.62em;color:#6b7280;margin-top:7px;line-height:1.55;word-break:break-word;font-family:'SF Mono',Consolas,monospace}
.pod.empty{opacity:.5}
.pod.empty .nm{color:#9ca3af}
.list{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:14px}
.row{display:grid;grid-template-columns:30px 40px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #f3f4f6}
.row:last-child{border-bottom:0}
.row .rk{font-weight:800;color:#9ca3af;font-size:.92em}
.row .av{width:34px;height:34px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.84em}
.row .info .nm{font-weight:700;font-size:.92em;color:#1f2937}
.row .info .br{font-size:.74em;color:#6b7280}
.row .info .breakdown{font-size:.72em;color:#9ca3af;margin-top:2px;font-family:'SF Mono',Consolas,monospace}
.row .pt{font-weight:900;color:#1a5c3a;font-size:1em;text-align:right}
.row .pt .pts-lbl{display:block;font-size:.66em;color:#9ca3af;font-weight:600}
.empty{padding:30px 20px;text-align:center;color:#9ca3af}
.legend{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;font-size:.78em;color:#6b7280;line-height:1.6}
.legend b{color:#1f2937}
.legend code{background:#f3f4f6;padding:1px 6px;border-radius:4px;color:#1a5c3a;font-weight:700;font-family:inherit}
.branch-mvps{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1px solid #bbf7d0;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.branch-mvps h3{font-size:.88em;font-weight:800;color:#166534;margin-bottom:8px}
.branch-mvps .mvp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.branch-mvps .mvp{background:#fff;border-radius:8px;padding:8px 10px;font-size:.78em}
.branch-mvps .mvp .b{color:#166534;font-weight:700}
.branch-mvps .mvp .n{font-weight:700;color:#1f2937;margin-top:2px}
.branch-mvps .mvp .p{color:#1a5c3a;font-weight:800;font-size:.92em}
/* 🏪 매장 합산 순위 */
.store-rank{background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1px solid #fde68a;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.store-rank h3{font-size:.88em;font-weight:800;color:#92400e;margin-bottom:8px}
.store-rank .sr-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:8px;padding:9px 12px;margin-bottom:6px}
.store-rank .sr-row:last-child{margin-bottom:0}
.store-rank .sr-medal{font-size:1.25em;width:30px;text-align:center;flex-shrink:0}
.store-rank .sr-name{font-weight:800;color:#1f2937;flex:1}
.store-rank .sr-sub{font-size:.72em;color:#9ca3af;font-weight:600}
.store-rank .sr-pt{font-weight:900;color:#b45309;font-size:1.02em}
.store-rank .sr-row.top1{background:linear-gradient(135deg,#fef9c3,#fde68a);border:1px solid #f59e0b}
/* 💰 월간 보너스 트랙 */
.bonus-track{background:linear-gradient(135deg,#fef9c3,#fde68a);border:2px solid #f59e0b;border-radius:14px;padding:14px 14px 12px;margin-bottom:14px;position:relative;overflow:hidden}
.bonus-track::before{content:'💰';position:absolute;right:-8px;top:-12px;font-size:5em;opacity:.08;transform:rotate(15deg)}
.bonus-track h3{font-size:1.02em;font-weight:900;color:#92400e;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.bonus-track .b-sub{font-size:.78em;color:#b45309;margin-bottom:10px;font-weight:700}
.bonus-track .b-group{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid #fef3c7}
.bonus-track .b-group:last-child{margin-bottom:0}
.bonus-track .b-grp-hd{font-size:.84em;font-weight:800;color:#1f2937;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.bonus-track .b-grp-sub{font-size:.7em;color:#6b7280;margin-bottom:8px;font-weight:600}
.bonus-track .b-row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid #f3f4f6;font-size:.85em}
.bonus-track .b-row:last-child{border-bottom:0}
.bonus-track .b-row .b-ic{font-size:1em;text-align:center}
.bonus-track .b-row .b-name{font-weight:700;color:#1f2937}
.bonus-track .b-row .b-name .b-meta{display:block;font-size:.74em;color:#9ca3af;font-weight:500;margin-top:1px}
.bonus-track .b-row .b-amt{font-weight:900;color:#059669;font-size:.94em;background:#d1fae5;padding:3px 9px;border-radius:6px;white-space:nowrap}
.bonus-track .b-row.empty .b-name{color:#9ca3af;font-weight:500;font-style:italic}
.bonus-track .b-row.empty .b-amt{color:#9ca3af;background:#f3f4f6}
.bonus-track .b-note{font-size:.7em;color:#92400e;margin-top:8px;font-style:italic;text-align:center;font-weight:600}
/* 🏆 Top 1 — 현금 보너스 강조 */
.bonus-track .b-group.top1{background:linear-gradient(135deg,#fef2f2,#fee2e2);border:2px solid #dc2626;position:relative}
.bonus-track .b-group.top1 .b-grp-hd{color:#991b1b}
.bonus-track .b-group.top1 .b-grp-sub{color:#b91c1c}
.bonus-track .b-row .b-amt.cash{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.bonus-track .b-row .b-cash-tag{display:inline-block;background:#dc2626;color:#fff;font-size:.62em;font-weight:900;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle;letter-spacing:.04em}
/* ⚠️ BETA / 확정 전 표시 */
.bonus-track .beta-tag{display:inline-block;background:#dc2626;color:#fff;font-size:.5em;font-weight:900;padding:3px 7px;border-radius:4px;margin-left:8px;vertical-align:middle;letter-spacing:.08em;animation:beta-pulse 2s ease-in-out infinite}
@keyframes beta-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.96)}}
.bonus-track .beta-banner{background:#fef3c7;border:2px dashed #f59e0b;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:.78em;color:#92400e;font-weight:700;text-align:center;line-height:1.4}
.bonus-track .beta-banner .ic{font-size:1.1em;margin-right:4px}
/* 차순위 표시 (Top 1 중복 → 지점 MVP 차순위 배지) */
.bonus-track .b-row .b-runner-tag{display:inline-block;background:#7c3aed;color:#fff;font-size:.6em;font-weight:800;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle;letter-spacing:.04em}
.loading{padding:40px;text-align:center;color:#6b7280}
.loading .ic{font-size:2em;animation:spin 1.4s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* 🖨 프린트 전용 — 버튼·필터 숨기고 순위표만 깔끔하게 */
@media print {
  body{background:#fff !important;font-size:11pt}
  #btnPrint, #btnRefresh, .tab-bar, nav, .top-actions, .lang-toggle,
  button[id^="btn"], #branchSel, .filter-bar select,
  .menu-toggle, .nav-sidebar, .back-button, .home-btn { display:none !important; }
  .container, main, .wrap { max-width:100% !important; padding:0 !important; box-shadow:none !important; }
  .row, .rank-row { break-inside:avoid; page-break-inside:avoid; }
  .branch-mvps .mvp-grid { display:grid !important; grid-template-columns:repeat(3,1fr) !important; gap:6pt !important; }
  /* 인쇄 헤더 — 현재 범위·지점 표시 */
  body::before { content:"매장 활동 순위표 — " attr(data-print-title); display:block; font-size:14pt; font-weight:800; padding:10pt 0 6pt; border-bottom:2px solid #000; margin-bottom:10pt; }
  .pt, .score { font-weight:800 !important; }
  /* 카드/그림자 제거 */
  * { box-shadow:none !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px">
    <h1 id="pageTitle">🏆 활동 순위</h1>
    <div id="langTabs" style="display:flex;gap:4px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:3px;flex-shrink:0">
      <button onclick="setLang('ko')" data-lang="ko" style="background:transparent;border:0;padding:5px 10px;border-radius:6px;font-family:inherit;font-size:.78em;font-weight:600;color:#6b7280;cursor:pointer">한국어</button>
      <button onclick="setLang('en')" data-lang="en" style="background:transparent;border:0;padding:5px 10px;border-radius:6px;font-family:inherit;font-size:.78em;font-weight:600;color:#6b7280;cursor:pointer">EN</button>
      <button onclick="setLang('es')" data-lang="es" style="background:transparent;border:0;padding:5px 10px;border-radius:6px;font-family:inherit;font-size:.78em;font-weight:600;color:#6b7280;cursor:pointer">ES</button>
    </div>
  </div>
  <div class="sub" id="subText">전 직원 활동 종합 — 등록·체크·폐기·채팅 합산</div>

  <!-- 🏆 2026-06-08 이달의 챔피언 슬라이드 배너 (활동순위 첫 화면, 전무님 요청) — tasks.html 배너와 동일. 매월/수상자 갱신 시 tasks.html 의 CHAMP.slides 와 함께 수정. -->
  <style>
    .champ-banner{border:2px solid #f5c542;border-radius:18px;overflow:hidden;margin:0 0 16px;background:linear-gradient(180deg,#fffdf5 0%,#fff7e3 100%);box-shadow:0 8px 28px rgba(217,160,30,.18);}
    .champ-banner>summary{list-style:none;cursor:pointer;padding:14px 18px;background:linear-gradient(135deg,#f6c645 0%,#e6a417 100%);color:#5a3d00;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .champ-banner>summary::-webkit-details-marker{display:none}
    .champ-banner>summary .t1{font-weight:900;font-size:1.04em;letter-spacing:-.01em}
    .champ-banner>summary .t2{font-weight:800;font-size:.78em;opacity:.82;margin-left:2px}
    .champ-banner>summary .chev{margin-left:auto;font-size:.9em;opacity:.7;transition:.2s}
    .champ-banner[open]>summary .chev{transform:rotate(180deg)}
    .champ-carousel{position:relative;padding:0 44px}
    .champ-slide{display:none}
    .champ-slide.active{display:block;animation:champFade .45s ease}
    @keyframes champFade{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
    .champ-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#b07a00;font-size:1.45em;font-weight:900;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;padding:0 0 3px}
    .champ-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
    .champ-arrow.prev{left:4px}.champ-arrow.next{right:4px}
    .champ-wrap{display:flex;gap:18px;padding:18px 4px;align-items:center;flex-wrap:wrap;justify-content:center}
    .champ-photo{flex:0 0 auto;max-width:300px;width:100%;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:block}
    .champ-side{flex:1 1 260px;min-width:230px}
    .champ-store{font-weight:800;color:#b07a00;font-size:.84em;letter-spacing:.02em;margin-bottom:10px}
    .champ-rank{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:12px;margin-bottom:8px;background:#fff;border:1px solid #f0e2bd;box-shadow:0 2px 6px rgba(0,0,0,.04)}
    .champ-rank .medal{font-size:1.5em;line-height:1}
    .champ-rank .nm{font-weight:900;font-size:1.12em;color:#1f2937;letter-spacing:-.01em}
    .champ-rank .pos{margin-left:auto;font-weight:800;font-size:.8em;color:#9a7400;background:#fdf3d4;border-radius:20px;padding:4px 11px}
    .champ-rank.r1{background:linear-gradient(135deg,#fff8e1,#ffeeba);border-color:#f5c542}
    .champ-dots{display:flex;justify-content:center;gap:8px;padding:2px 0 14px}
    .champ-dot{width:9px;height:9px;border-radius:50%;border:0;background:#e7cf94;cursor:pointer;padding:0;transition:.2s}
    .champ-dot.active{background:#e6a417;width:24px;border-radius:5px}
    .champ-cta{margin:2px 14px 16px;text-align:center;font-weight:800;color:#8a5a00;font-size:.92em;line-height:1.5;background:#fffaef;border:1.5px dashed #e9c45e;border-radius:12px;padding:11px 12px}
    .champ-cta small{display:block;font-weight:700;color:#a9842f;font-size:.82em;margin-top:3px}
    .champ-banner.single .champ-arrow,.champ-banner.single .champ-dots{display:none}
    @media(max-width:520px){.champ-photo{max-width:100%}.champ-wrap{padding:14px 6px;gap:14px}.champ-carousel{padding:0}.champ-arrow{display:none}}
  </style>
  <!-- 🏆 MONTHLY CHAMPIONS 사진 배너는 leaderboard 에서 제거 (2026-06-14 사장님 지시).
       사진 + 5초 자동회전(지점별 순환) 둘 다 여기선 표시 안 함. tasks.html 에만 유지.
       복원하려면 아래 한 줄(<div class="champ-banner-mount"></div>)을 다시 넣으면 됨. -->
  <script>
  (function(){
    if (window.__champInit) return; window.__champInit = true;
    var CHAMP = {
      title:'MONTHLY CHAMPIONS · 이달의 챔피언',
      period:'MAY 2026 · Mayo 2026',
      cta:'👏 축하합니다! 수고하신 만큼 보상받습니다.',
      ctaSub:'Next month it could be YOU! · ¡El próximo mes podrías ser TÚ! 🔥',
      slides:[
        { store:'KIMCHI MART · HOLLYWOOD', photo:'champions-2026-05.jpg?v=1', alt:'헐리우드 5월 수상자',
          ranks:[ {m:'🥇',n:'MIRNA',p:'1위 · 1ST',top:true},
                  {m:'🥈',n:'ANDERSON',p:'2위 · 2ND'},
                  {m:'🥉',n:'SHREYA',p:'3위 · 3RD'} ] },
        { store:'KIMCHI MART · MIAMI', photo:'champions-2026-05-miami.jpg?v=1', alt:'마이애미 5월 1등 STEVEN',
          ranks:[ {m:'🥇',n:'STEVEN',p:'1위 · 1ST',top:true} ] },
        { store:'KIMCHI MART · MIAMI', photo:'champions-2026-05-miami-leonardo.jpg?v=1', alt:'마이애미 5월 2등 LEONARDO',
          ranks:[ {m:'🥈',n:'LEONARDO',p:'2위 · 2ND'} ] },
        { store:'KIMCHI MART · LAS OLAS', photo:'champions-2026-05-lasolas.jpg?v=1', alt:'라스올라스 5월 수상자',
          ranks:[ {m:'🥇',n:'ALFONSO MONTES',p:'1위 · 1ST',top:true},
                  {m:'🥈',n:'LIZBETH PÉREZ',p:'2위 · 2ND'} ] }
      ]
    };
    function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function slideHTML(s){
      var ranks = s.ranks.map(function(r){
        return '<div class="champ-rank'+(r.top?' r1':'')+'"><span class="medal">'+r.m+'</span><span class="nm">'+esc(r.n)+'</span><span class="pos">'+esc(r.p)+'</span></div>';
      }).join('');
      return '<div class="champ-slide"><div class="champ-wrap">'+
        '<img class="champ-photo" src="'+esc(s.photo)+'" alt="'+esc(s.alt)+'" loading="lazy">'+
        '<div class="champ-side"><div class="champ-store">🏬 '+esc(s.store)+'</div>'+ranks+'</div>'+
        '</div></div>';
    }
    function bannerHTML(){
      var slides = CHAMP.slides.map(slideHTML).join('');
      var dots = CHAMP.slides.map(function(_,i){ return '<button class="champ-dot'+(i===0?' active':'')+'" data-i="'+i+'" aria-label="'+(i+1)+'"></button>'; }).join('');
      return '<details class="champ-banner'+(CHAMP.slides.length<2?' single':'')+'" open>'+
        '<summary><span style="font-size:1.25em">🏆</span>'+
          '<span class="t1">'+esc(CHAMP.title)+'</span>'+
          '<span class="t2">'+esc(CHAMP.period)+'</span>'+
          '<span class="chev">▾</span></summary>'+
        '<div class="champ-carousel">'+
          '<button class="champ-arrow prev" aria-label="이전">‹</button>'+
          '<div class="champ-track">'+slides+'</div>'+
          '<button class="champ-arrow next" aria-label="다음">›</button>'+
        '</div>'+
        '<div class="champ-dots">'+dots+'</div>'+
        '<div class="champ-cta">'+esc(CHAMP.cta)+'<small>'+esc(CHAMP.ctaSub)+'</small></div>'+
        '</details>';
    }
    function initBanner(root){
      root.innerHTML = bannerHTML();
      var det = root.querySelector('.champ-banner');
      var slides = root.querySelectorAll('.champ-slide');
      var dots = root.querySelectorAll('.champ-dot');
      var n = slides.length, idx = 0, timer = null;
      if (n) slides[0].classList.add('active');
      function show(i){ idx=(i%n+n)%n; for(var k=0;k<n;k++){ slides[k].classList.toggle('active',k===idx); if(dots[k]) dots[k].classList.toggle('active',k===idx);} }
      function start(){ if(n<2) return; stop(); timer=setInterval(function(){show(idx+1);},5000); }
      function stop(){ if(timer){ clearInterval(timer); timer=null; } }

// ============== Time window ==============
function rangeStart(){
  const t = new Date(); t.setHours(0,0,0,0);
  if (CUR_RANGE === 'today')  return t.getTime();
  if (CUR_RANGE === 'week') {
    // Monday-start week (Korean / business convention)
    const day = (t.getDay() + 6) % 7;   // 0=Mon, 6=Sun
    return t.getTime() - day * 86400000;
  }
  if (CUR_RANGE === 'month') {
    const m = new Date(t.getFullYear(), t.getMonth(), 1);
    return m.getTime();
  }
  if (CUR_RANGE === 'lastmonth') {
    // 지난 달 1일 0시 — 상금 정산용. 끝(상한)은 rangeEnd() 가 이번 달 1일로 막음.
    const m = new Date(t.getFullYear(), t.getMonth() - 1, 1);
    return m.getTime();
  }
  return 0;
}
// 윈도우 끝(상한, exclusive). 'lastmonth' 만 상한이 있고 나머지는 '지금까지'(=무한대).
function rangeEnd(){
  if (CUR_RANGE === 'lastmonth') {
    const t = new Date(); t.setHours(0,0,0,0);
    return new Date(t.getFullYear(), t.getMonth(), 1).getTime();   // 이번 달 1일 0시
  }
  return Infinity;
}

// 선택한 기간(today/week/month)만 받도록 Firebase REST 쿼리로 서버에서 잘라옴.
function _zk(n){ return String(n).padStart(2,'0'); }
function _dateKey(d){ return d.getFullYear() + '-' + _zk(d.getMonth()+1) + '-' + _zk(d.getDate()); }
// task 는 '배정일' 버킷에 저장되는데 점수는 '완료일' 기준 → 배정 후 며칠 뒤 완료되는 걸

function tasksStartKey(){
  if (CUR_RANGE === 'all') return null;
  return _dateKey(new Date(rangeStart() - 21*86400000));
}
// 채팅방별로 최근 N건만 받음 (push key 는 시간순이라 limitToLast 로 최신만). 'all' 은 무제한.
// ⚠️ 채팅 사진은 메시지 안에 base64 로 통째 저장 → 옛 메시지까지 받으면 폰에서 수십 MB.
//    채팅 점수는 어차피 1일 10pt 캡(소액)이라, 최근 일부만 받아도 순위 영향 거의 없음.
const CHAT_LIMIT_BY_RANGE = { today:100, week:200, month:350, lastmonth:600 };
// 2026-06-08 사장님 지시: 지난달(5월)은 정산 당시 limitToLast=600 으로 보너스 지급됨.

// 'all' 은 옛날에도 무제한이라 그대로. today/week/month 은 현재 윈도우라 최신 N건 OK.
function chatLimit(){

    return CHAT_LIMIT_BY_RANGE[CUR_RANGE] || 0;
  return 0;   // 'all' = 전체 (과거 메시지 정확히 포착)
}
// FB REST URL 에 쿼리 파라미터 안전하게 덧붙임 (aq 가 '?auth=' 일 수도, '' 일 수도).
function _fbq(base, aq, extra){
  let url = base + aq;
  if (extra) url += (aq ? '&' : '?') + extra;
  return url;
}
// ⚡ 타임아웃 fetch — 한 방/지점이 너무 크면 ms 후 중단하고 건너뜀(그 데이터만 누락).
//    덕분에 거대한 사진방 하나 때문에 페이지 전체가 멈추는 일이 없음.
function fetchT(url, opts, ms){
  ms = ms || 9000;
  let ctrl = null, timer = null;
  try { if (typeof AbortController !== 'undefined') { ctrl = new AbortController(); timer = setTimeout(function(){ try{ctrl.abort();}catch(_){} }, ms); } } catch(_){}
  const o = Object.assign({}, opts || {}, ctrl ? { signal: ctrl.signal } : {});
  return fetch(url, o).then(function(r){ if(timer) clearTimeout(timer); return r; },
                           function(e){ if(timer) clearTimeout(timer); throw e; });
}
// ⚡ 2026-06-14 — fetchT + 자동 재시도(2회). 타임아웃/오류면 한 번 더 시도하고, 그래도
//   실패하면 실패 카운터++ 후 null 반환. loadAll 이 '부분 로드'를 감지해 ① 깨진 숫자를
//   캐시에 저장하지 않고 ② 경고 + 자동 재시도 하게 함. kind==='chat' 은 가벼운 실패로 분류
//   (채팅 점수는 1일 10pt 캡이라 순위 영향 작음 → 핵심 순위는 안 막음).
let CORE_FAILS = 0, CHAT_FAILS = 0;
function resetLoadStats(){ CORE_FAILS = 0; CHAT_FAILS = 0; }
async function fetchTR(url, opts, ms, kind){
  for (let i = 0; i < 2; i++){
    try { const r = await fetchT(url, opts, ms); if (r && r.ok) return r; }
    catch(e){ /* 타임아웃/네트워크 → 재시도 */ }
  }
  if (kind === 'chat') CHAT_FAILS++; else CORE_FAILS++;
  return null;
}

let NAME_TO_BRANCH = new Map();  // name(normalized, no spaces, uppercase) → branchId
function _normForBranchLookup(s){
  return String(s||'').toUpperCase().replace(/\s+/g,'').replace(/[^A-Z0-9_가-힣]/g,'');

async function loadBranchEmployees(){
  const aq = await authParam();

}

function isExcludedSender(name, branch){

// ============== Aggregation ==============
// agg[name] = { name, branch, color, expiryAdd, expiryCheck, expiryDiscard,
//   taskComplete, taskPoints, chatMsg, chatPhoto, reaction, reply, score }
// taskPoints = 매니저가 task 발송 시 선택한 1·2·3 점 합 (실 score 계산용).
// taskComplete = 완료 건수만 (배지 노출용).
const _DEFAULT_ROW = () => ({ expiryAdd:0, expiryCheck:0, expiryDiscard:0, taskComplete:0, taskPoints:0, taskPointsByDay:{}, taskGiven:0, taskGivenByDay:{}, chatMsg:0, chatPhoto:0, reaction:0, reactionGiven:0, reply:0, bonus:0, score:0 });
function bumpAgg(agg, name, branchHint, key, n=1, color){
  if (!name || isExcludedSender(name, branchHint)) return;
  const k = name.trim();
  // 🔧 2026-05-15: 우선순위 1 — schedules/{branch}/employees 에 등록된 매장 (권위).
  //   같은 이름이 다른 매장 task 를 도와줘도 본인 등록 매장으로 표시.
  // 우선순위 2 — users/{uid}.branch
  // 우선순위 3 — branchHint (task.branchId / senderBranch)
  const schedBranch = NAME_TO_BRANCH.get(_normForBranchLookup(k));
  const usersProfile = NAME_TO_PROFILE.get(k.toLowerCase());
  const usersBranch = (usersProfile && usersProfile.branch && usersProfile.branch !== '*') ? usersProfile.branch : null;
  const authoritativeBranch = schedBranch || usersBranch || branchHint || '';
  if (!agg[k]) agg[k] = Object.assign({ name: k, branch: authoritativeBranch, color: color || '' }, _DEFAULT_ROW());
  agg[k][key] = (agg[k][key] || 0) + n;
  // 권위 branch 가 있으면 항상 그걸로 — task hint 가 다른 매장이었어도 무시
  if (schedBranch || usersBranch) agg[k].branch = authoritativeBranch;
}
function colorFor(name){
  let h = 0; for (const c of (name||'')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const palette = ['#1a5c3a','#0369a1','#7c3aed','#db2777','#dc2626','#d97706','#059669','#0891b2','#2563eb'];
  return palette[h % palette.length];
}

async function fetchExpiry(agg, since, until){
  const aq = await authParam();
  const branches = (CUR_BRANCH === 'ALL') ? BRANCHES.map(b => b.id) : [CUR_BRANCH];
  await Promise.all(branches.map(async (br) => {
    try {
      const r = await fetchTR(`${FB_DB}/expiry/${br}/products.json${aq}`, { cache:'no-store' }, 9000);
      if (!r) return;
      const d = await r.json();
      if (!d) return;
      Object.values(d).forEach(p => {
        if (!p || typeof p !== 'object') return;
        // Add event — 사진 첨부 시에만 점수 인정 (사진 1장당 0.3)
        if ((p.addedAt || 0) >= since && (p.addedAt || 0) < until && p.addedBy && p.photo) {
          bumpAgg(agg, p.addedBy, br, 'expiryAdd', 1);
        }
        // Check event (separate from add — counts re-checks)
        if ((p.lastCheckedAt || 0) >= since && (p.lastCheckedAt || 0) < until && p.lastCheckedBy
            && (p.lastCheckedAt !== p.addedAt)) {
          bumpAgg(agg, p.lastCheckedBy, br, 'expiryCheck', 1);
        }
        // Discard event — using discardedAt if present; otherwise count
        // any record currently 'discarded' added/checked in window
        if (p.status === 'discarded') {
          const ts = p.discardedAt || p.lastCheckedAt || p.addedAt || 0;
          if (ts >= since && ts < until) bumpAgg(agg, p.lastCheckedBy || p.addedBy, br, 'expiryDiscard', 1);
        }
      });
    } catch(e) { console.warn('[lb] expiry', br, e); }
  }));
}

// Tasks live at /tasks/{branch}/{YYYY-MM-DD}/{taskId}. Each completed
// task awards +1.0 to t.completedBy. We walk every branch's full
// year-bucket tree so any task completed in the time window counts.
async function fetchTasks(agg, since, until){
  const aq = await authParam();
  const branches = (CUR_BRANCH === 'ALL') ? BRANCHES.map(b => b.id) : [CUR_BRANCH];
  await Promise.all(branches.map(async (br) => {
    try {
      // ⚡ 기간 한정 — 시작 날짜키 이후 버킷만 (orderBy $key, index 불필요). 'all' 은 전체.
      const _sk = tasksStartKey();
      const _extra = _sk ? ('orderBy=' + encodeURIComponent('"$key"') + '&startAt=' + encodeURIComponent('"'+_sk+'"')) : '';
      const r = await fetchTR(_fbq(`${FB_DB}/tasks/${br}.json`, aq, _extra), { cache:'no-store' }, 9000);
      if (!r) return;
      const tree = await r.json();
      if (!tree) return;
      // tree is { dateString: { taskId: taskObj } }
      Object.values(tree).forEach(dayBucket => {
        if (!dayBucket || typeof dayBucket !== 'object') return;
        Object.values(dayBucket).forEach(t => {
          if (!t || typeof t !== 'object') return;
          if (!t.completedAt || !t.completedBy) return;
          if (t.completedAt < since || t.completedAt >= until) return;
          // taskComplete = 완료 건수 (배지용), taskPoints = 매니저가 부여한
          // 1·2·3 점 합 (실제 score 계산용). points 필드 없는 레거시 task 는
          // 기본 1점 처리해 호환성 유지.
          bumpAgg(agg, t.completedBy, br, 'taskComplete', 1);
          const pts = _taskScore(t);
          bumpAgg(agg, t.completedBy, br, 'taskPoints', pts);
          // 🆕 Task 일일 상한용 — 완료일(completedAt)별로 점수 누적. computeScores 에서
          // 하루치 합이 TASK_DAILY_CAP 넘으면 초과분 컷. bumpAgg 가 제외(OWNER 등)한
          // 직원은 agg 에 없으므로 guard 로 건너뜀.
          const _tk = String(t.completedBy).trim();
          // ⏱️ 새 규칙은 컷오프(2026-06-01) 이후 완료분에만. 이전(이미 지급된 5월 등)은
          //    아래 per-day/발송자 누적을 건너뜀 → computeScores 에서 옛 규칙(무캡·발송자0)으로 처리.
          if (t.completedAt >= RULE_START_TS) {
            if (agg[_tk]) {
              const _td = new Date(t.completedAt);
              const _tday = _td.getFullYear() + '-' + (_td.getMonth()+1) + '-' + _td.getDate();
              if (!agg[_tk].taskPointsByDay) agg[_tk].taskPointsByDay = {};
              agg[_tk].taskPointsByDay[_tday] = (agg[_tk].taskPointsByDay[_tday] || 0) + pts;
            }
            // 🆕 업무 발송자(지시한 사람)에게 완료 1건당 +1pt. 발송자 = from/createdBy/assignedBy.
            //    자기 자신에게 준 task 는 제외(완료 점수와 중복 방지).
            // 🛡 2026-06-10 전무님 지시: 온도 일괄 발송 task 의 from 은 "이름 (온도 일괄 발송)"
            //    형태라 본인과 다른 사람으로 분리돼 별도 줄로 떴음. 점수 집계 시 이 표시용
            //    라벨을 떼서 본인(예: "Yonsu Lee") 점수에 합산. (task UI 의 from 라벨은 그대로 유지)
            const _giver = String(t.from || t.createdBy || t.assignedBy || '')
              .replace(/\s*\(온도 일괄 발송\)\s*$/, '').trim();
            if (_giver && _giver !== _tk) {
              bumpAgg(agg, _giver, br, 'taskGiven', 1);
              if (agg[_giver]) {
                const _gd = new Date(t.completedAt);
                const _gday = _gd.getFullYear() + '-' + (_gd.getMonth()+1) + '-' + _gd.getDate();
                if (!agg[_giver].taskGivenByDay) agg[_giver].taskGivenByDay = {};
                agg[_giver].taskGivenByDay[_gday] = (agg[_giver].taskGivenByDay[_gday] || 0) + 1;
              }
            }
          }
        });
      });
    } catch(e) { console.warn('[lb] tasks', br, e); }
  }));
}

async function fetchChat(agg, since, until){
  const aq = await authParam();
  // First grab the rooms list — cheaper than guessing IDs.
  let rooms = {};
  try {
    const r = await fetch(`${FB_DB}/chat/rooms.json${aq}`, { cache:'no-store' });
    if (r.ok) rooms = (await r.json()) || {};
  } catch(e){ console.warn('[lb] rooms', e); }
  const ids = Object.keys(rooms);
  if (!ids.length) return;
  await Promise.all(ids.map(async (rid) => {
    try {
      // ⚡ 기간별 최근 N건만 — push key 시간순이라 limitToLast 로 최신만 받음 (index 불필요).
      const _lim = chatLimit();
      const _extra = _lim ? ('orderBy=' + encodeURIComponent('"$key"') + '&limitToLast=' + _lim) : '';
      const r = await fetchTR(_fbq(`${FB_DB}/chat/messages/${encodeURIComponent(rid)}.json`, aq, _extra), { cache:'no-store' }, 8000, 'chat');
      if (!r) return;
      const d = await r.json();
      if (!d) return;
      Object.values(d).forEach(m => {
        if (!m || typeof m !== 'object') return;
        const ts = m.ts || 0;
        // Note: we DON'T filter the whole message out by ts here — we
        // need to evaluate replies (each has its own ts) even if the
        // parent thread is old. Main-message scoring still gates on ts.
        const inWindow = ts >= since && ts < until;
        const branchOk = (CUR_BRANCH === 'ALL') || !m.senderBranch || (m.senderBranch === CUR_BRANCH);

        if (inWindow && branchOk && m.sender) {
          // 🛡️ 2026-06-10 전무님 지시: 자동 완료/보고 메시지(업무완료·일일/온도 보고)는
          //   채팅 활동 점수(메시지·사진)에서 제외. 업무 점수는 task 기준으로 따로 1회만
          //   집계되므로, 같은 보고가 채팅에 여러 번 올라와도 점수 중복(부풀리기) 0.
          //   (좋아요·답글은 실제 참여라 아래에서 그대로 인정)
          const __isAutoReport = !!(m._dailyReport || m._tempReport ||
            (m.meta && (m.meta.kind === 'task_complete' || m.meta.kind === 'temp_daily_summary')));
          if (!__isAutoReport) {
            bumpAgg(agg, m.sender, m.senderBranch || '', 'chatMsg', 1, m.color);
            // 한 메시지에 사진 11장 이상 올려도 점수는 10장까지만 — 11번째부터는
            // 보너스 0점으로 처리해서 점수 부풀리기 방지.
            const phRaw = (m.photos && m.photos.length) || 0;
            const ph = Math.min(phRaw, MAX_PHOTOS_PER_MSG);
            if (ph > 0) bumpAgg(agg, m.sender, m.senderBranch || '', 'chatPhoto', ph, m.color);
          }

          // 👍 Reactions — 2026-05-28 옵션 B (전무님 지시):
          //   - 받은 사람(메시지 작성자): +1 reaction (0.2pt) — 큰 보상
          //   - 누른 사람(reactor): +1 reactionGiven (0.05pt) — 응원자도 인정
          //   - self-react (자기 메시지에 자기 좋아요) 는 양쪽 다 카운트 제외 (어뷰징 방지)
          if (m.reactions && typeof m.reactions === 'object' && m.sender){
            for (const emoji of Object.keys(m.reactions)) {
              const usersMap = m.reactions[emoji];
              if (!usersMap || typeof usersMap !== 'object') continue;
              for (const [, displayName] of Object.entries(usersMap)) {
                if (!displayName) continue;
                if (displayName === m.sender) continue;  // self-react 제외
                // 받은 사람 (메시지 작성자)
                bumpAgg(agg, m.sender, m.senderBranch || '', 'reaction', 1, m.color);
                // 누른 사람 (응원자) — 적은 점수
                bumpAgg(agg, displayName, '', 'reactionGiven', 1);
              }
            }
          }
        }

        // 💬 Replies — each carries its own ts so score it independently.
        // A reply on an old parent still earns points for the replier
        // when made within the current window.
        if (m.replies && typeof m.replies === 'object') {
          for (const r of Object.values(m.replies)) {
            if (!r || typeof r !== 'object') continue;
            const rts = r.ts || 0;
            if (rts < since || rts >= until) continue;
            if (CUR_BRANCH !== 'ALL' && r.senderBranch && r.senderBranch !== CUR_BRANCH) continue;
            if (!r.sender) continue;
            bumpAgg(agg, r.sender, r.senderBranch || '', 'reply', 1);
          }
        }
      });
    } catch(e){ console.warn('[lb] msgs', rid, e); }
  }));
}

// ============== Bonus Track data (lastmonth only) ==============
// 💰 분야별 방에서 sender 별 받은 좋아요 + 받은 답글 카운트.
// 💰 매니저 룸 활동 (메시지·사진·댓글) + 전 지점 task 발송(from/createdBy) 카운트.
// BONUS_DEPT[deptKey][senderName] = { likes, replies, branch }
// BONUS_MGR[senderName] = { tasksSent, mgrRoomActivity, branch }
let BONUS_DEPT = {};
let BONUS_MGR  = {};
function _bonusDeptBump(deptKey, name, branch, field, n){
  if (!name || isExcludedSender(name)) return;
  const k = name.trim();
  if (!BONUS_DEPT[deptKey]) BONUS_DEPT[deptKey] = {};
  const slot = BONUS_DEPT[deptKey];
  if (!slot[k]) slot[k] = { likes:0, replies:0, branch: branch || '' };
  slot[k][field] += n;
  // 권위 branch 적용
  const schedBranch = NAME_TO_BRANCH.get(_normForBranchLookup(k));
  const usersProfile = NAME_TO_PROFILE.get(k.toLowerCase());
  const usersBranch = (usersProfile && usersProfile.branch && usersProfile.branch !== '*') ? usersProfile.branch : null;
  if (schedBranch || usersBranch) slot[k].branch = schedBranch || usersBranch;
  else if (!slot[k].branch && branch) slot[k].branch = branch;
}
function _bonusMgrBump(name, branch, field, n){
  if (!name || isExcludedSender(name)) return;
  const k = name.trim();
  if (!BONUS_MGR[k]) BONUS_MGR[k] = { tasksSent:0, mgrRoomActivity:0, branch: branch || '' };
  BONUS_MGR[k][field] += n;
  const schedBranch = NAME_TO_BRANCH.get(_normForBranchLookup(k));
  const usersProfile = NAME_TO_PROFILE.get(k.toLowerCase());
  const usersBranch = (usersProfile && usersProfile.branch && usersProfile.branch !== '*') ? usersProfile.branch : null;
  if (schedBranch || usersBranch) BONUS_MGR[k].branch = schedBranch || usersBranch;
  else if (!BONUS_MGR[k].branch && branch) BONUS_MGR[k].branch = branch;
}
// 분야별 방에서 sender 별 받은 좋아요/답글 + 매니저 룸 활동 집계.
// fetchChat 와 별도로 돌리는 이유: fetchChat 은 점수 계산용으로 룸 ID 를
// 안 남김. 보너스는 룸별 분리가 필수라 한 번 더 훑음. (월 1회 정산용이라
// 비용 OK.)
async function fetchBonusChat(since, until){
  const aq = await authParam();
  BONUS_DEPT = {};
  BONUS_MGR  = {};
  // roomId → deptKey 역인덱스
  const ROOM_TO_DEPT = {};
  DEPT_ROOMS.forEach(d => d.rooms.forEach(r => ROOM_TO_DEPT[r] = d.key));
  const targetRooms = new Set([...Object.keys(ROOM_TO_DEPT), MGR_ROOM_ID]);
  await Promise.all([...targetRooms].map(async rid => {
    try {
      const r = await fetch(`${FB_DB}/chat/messages/${encodeURIComponent(rid)}.json${aq}`, { cache:'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      if (!d) return;
      const isDept = !!ROOM_TO_DEPT[rid];
      const isMgr  = rid === MGR_ROOM_ID;
      Object.values(d).forEach(m => {
        if (!m || typeof m !== 'object') return;
        const ts = m.ts || 0;
        const inWindow = ts >= since && ts < until;

        // — 매니저 룸: 작성한 메시지/사진 활동 점수
        if (isMgr && inWindow && m.sender) {
          _bonusMgrBump(m.sender, m.senderBranch || '', 'mgrRoomActivity', 1);
          const ph = Math.min((m.photos && m.photos.length) || 0, MAX_PHOTOS_PER_MSG);
          if (ph) _bonusMgrBump(m.sender, m.senderBranch || '', 'mgrRoomActivity', ph * 0.5);
        }

        // — 분야 룸: 받은 좋아요 (메시지 작성자가 점수 받음)
        if (isDept && inWindow && m.sender && m.reactions && typeof m.reactions === 'object') {
          let likeCount = 0;
          for (const emoji of Object.keys(m.reactions)) {
            const usersMap = m.reactions[emoji];
            if (!usersMap || typeof usersMap !== 'object') continue;
            for (const [, displayName] of Object.entries(usersMap)) {
              if (!displayName || displayName === m.sender) continue;
              likeCount++;
            }
          }
          if (likeCount) _bonusDeptBump(ROOM_TO_DEPT[rid], m.sender, m.senderBranch || '', 'likes', likeCount);
        }

        // — 답글: 분야 룸은 부모 메시지 작성자(받은 답글), 매니저 룸은 답글 작성자(피드백 활동)
        if (m.replies && typeof m.replies === 'object') {
          for (const rep of Object.values(m.replies)) {
            if (!rep || typeof rep !== 'object') continue;
            const rts = rep.ts || 0;
            if (rts < since || rts >= until) continue;
            if (isDept && m.sender) {
              // 부모 메시지 작성자가 답글 1개 받음
              if (rep.sender && rep.sender !== m.sender) {
                _bonusDeptBump(ROOM_TO_DEPT[rid], m.sender, m.senderBranch || '', 'replies', 1);
              }
            }
            if (isMgr && rep.sender) {
              // 매니저 룸 답글 = 피드백 활동
              _bonusMgrBump(rep.sender, rep.senderBranch || '', 'mgrRoomActivity', 1);
            }
          }
        }
      });
    } catch(e){ console.warn('[lb-bonus] msgs', rid, e); }
  }));
}
// 매니저 리더용 — 지난 달 모든 지점에서 task 발송(from/createdBy) 카운트.

function computeScores(agg){
  // 🆕 옵션 B — 윈도우 길이 비례 채팅 cap.
  const days = CUR_RANGE === 'today' ? 1
             : CUR_RANGE === 'week'  ? 7
             : CUR_RANGE === 'month' ? 30
             : CUR_RANGE === 'lastmonth' ? 31
             :                         9999;   // 'all' = 사실상 무제한
  const chatCap = CHAT_DAILY_CAP * days;
  // 2026-06-08 전무님: 유통기한 가중치 인하(등록 0.2·체크 0.1·폐기 0.1). 지난달(지급완료)은
  //   옛 가중치(0.3/0.2/0.2) 유지 — 정산 끝난 순위 소급 변경 방지 (RULE_START_TS 정신과 동일).
  const _eAdd = (CUR_RANGE === 'lastmonth') ? 0.3 : SCORE.expiryAdd;
  const _eChk = (CUR_RANGE === 'lastmonth') ? 0.2 : SCORE.expiryCheck;
  const _eDis = (CUR_RANGE === 'lastmonth') ? 0.2 : SCORE.expiryDiscard;
  Object.values(agg).forEach(r => {
    // 채팅 관련 점수 (메시지·사진·댓글) → cap 적용
    // 2026-05-27 전무님 지시: reaction (받은 좋아요) 은 캡에서 제외 — 받는 사람이
    // 직접 조작 못 함 (남이 줘야 받음) → 어뷰징 위험 낮음 → 무제한 누적 OK.
    const chatRaw = r.chatMsg     * SCORE.chatMessage
                  + r.chatPhoto   * SCORE.chatPhoto
                  + r.reply       * SCORE.reply;
    const chatCapped = Math.min(chatRaw, chatCap);
    const reactionScore = r.reaction * SCORE.reaction;           // 받은 좋아요 (캡 없음, 0.2/개)
    const reactionGivenScore = (r.reactionGiven||0) * SCORE.reactionGiven;  // 누른 좋아요 (캡 없음, 0.05/개)
    // 💎 task 점수 — 완료일(day)별로 TASK_DAILY_CAP 적용 후 합산. 하루에 몰아주기/쪼개기
    //    해도 그날치는 cap 까지만. taskPoints(raw) 는 배지 표시용으로 그대로 둠.
    // taskPointsByDay 에는 컷오프(2026-06-01) '이후' 완료분만 담겨 있음(fetchTasks 에서 분리).
    // 이후분 = 일별 캡 적용, 이전분(=raw 전체 - 이후분 합) = 옛 규칙대로 무캡 그대로.
    let _postRaw = 0, _postCapped = 0;
    const tDays = r.taskPointsByDay ? Object.keys(r.taskPointsByDay) : [];
    for (const dk of tDays) { _postRaw += r.taskPointsByDay[dk]; _postCapped += Math.min(r.taskPointsByDay[dk], TASK_DAILY_CAP); }
    const _preCutoff = (r.taskPoints || 0) - _postRaw;   // 컷오프 이전 완료분 (무캡)
    const taskCapped = _preCutoff + _postCapped;
    // 🆕 발송자(업무 지시) 점수 — 완료일별 GIVE_DAILY_CAP 적용. taskGiven 1건당 1pt.
    let giveCapped = 0;
    const gDays = r.taskGivenByDay ? Object.keys(r.taskGivenByDay) : [];
    if (gDays.length) {
      for (const dk of gDays) giveCapped += Math.min(r.taskGivenByDay[dk] * SCORE.taskGiven, GIVE_DAILY_CAP);
    } else {
      giveCapped = (r.taskGiven || 0) * SCORE.taskGiven;
    }
    r.score =
      r.expiryAdd     * _eAdd
    + r.expiryCheck   * _eChk
    + r.expiryDiscard * _eDis
    + taskCapped      // 일별 cap 적용된 task 완료 점수
    + giveCapped      // 일별 cap 적용된 업무 발송 점수
    + chatCapped      // 채팅 cap 적용된 점수
    + reactionScore   // 받은 좋아요 점수 (캡 없음, 0.2/개)
    + reactionGivenScore  // 누른 좋아요 점수 (캡 없음, 0.05/개) — 옵션 B
    + (r.bonus || 0)   // 🎖 매니저 보너스 (가중치 1.0, 캡 없음 — 주간 한도로 통제, 화면 표시됨)
    + (r.omerit || 0); // ⭐ 사장님 상점 (점수엔 합산, 출처/표시는 숨김 — 배지·보너스트랙 비표시)
    r.score = Math.round(r.score * 10) / 10;
    // 디버깅용 — cap 으로 깎였는지 표시 (UI 배지에 활용 가능)
    r.chatCapped = (chatRaw > chatCap);
    r.taskCapped = (taskCapped < (r.taskPoints || 0));
    if (!r.color) r.color = colorFor(r.name);
  });
}

// ============== Render ==============
function initials(name){
  if (!name) return '?';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0]||'') + (parts[1][0]||'');
  return name.slice(0, 2);
}
function branchLabel(id){
  const b = BRANCHES.find(b => b.id === id);
  if (!b) return id || '';
  return b[LANG] || b.ko;
}
function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// 📊 2026-06-14 — 점수 내역 배지 (포디움·리스트 공용). 활동별 횟수:
//   📦유통기한등록 ✅체크 ❌폐기 · 📋완료(⭐=점수합) · 📤업무발송(지시) ·
//   💬채팅 📷사진 ↩️답글 · 👍받은좋아요 · 🎖보너스. (사장님이 1~3위도 감사 가능하게)
function _bdBadges(r){
  const bd = [];
  if (r.expiryAdd)     bd.push(`📦${r.expiryAdd}`);
  if (r.expiryCheck)   bd.push(`✅${r.expiryCheck}`);
  if (r.expiryDiscard) bd.push(`❌${r.expiryDiscard}`);
  if (r.taskComplete)  bd.push(`📋${r.taskComplete}${r.taskPoints && r.taskPoints !== r.taskComplete ? '⭐'+r.taskPoints : ''}`);
  if (r.taskGiven)     bd.push(`📤${r.taskGiven}`);
  if (r.chatMsg)       bd.push(`💬${r.chatMsg}`);
  if (r.chatPhoto)     bd.push(`📷${r.chatPhoto}`);
  if (r.reply)         bd.push(`↩️${r.reply}`);
  if (r.reaction)      bd.push(`👍${r.reaction}`);
  if (r.bonus)         bd.push(`🎖${r.bonus}`);
  return bd.join(' · ') || '—';
}

function renderBranchMVPs(allRows){

  }

function renderStoreRank(allRows){
  if (CUR_BRANCH !== 'ALL') return '';
  const sums = {};
  for (const r of allRows) {
    if (!r.branch) continue;
    sums[r.branch] = (sums[r.branch] || 0) + (r.score || 0);
  }
  const ranked = BRANCHES
    .map(b => ({ id:b.id, label:(b[LANG]||b.ko), score: Math.round((sums[b.id]||0)*10)/10 }))
    .filter(x => x.score > 0)
    .sort((a,b) => b.score - a.score);
  if (!ranked.length) return '';
  const medals = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'];

  // 0) 전체 1등 — 종합 점수 최상위 직원 (현금 보너스)

    if (!top1) return `<div class="b-row empty"><div class="b-ic">🏆</div><div class="b-name">${escHtml(t('bonusNoWinner'))}</div><div class="b-amt cash">$${BONUS.top1Cash}<span class="b-cash-tag">${escHtml(t('bonusCashTag'))}</span></div></div>`;
    const brLbl = top1.branch ? branchLabel(top1.branch) : '';

  })();

  // 1) 지점별 이달의 직원 — 지점별 1등.
  // 🆕 2026-06-06 사장님 지시: Top 1 이 자기 지점 1등도 겸하면 그 지점 MVP 는
  //   차순위(2등)에게 자동 승계. 예: Mirna 가 전체 Top 1 + Hollywood 1등 →
  //   Hollywood MVP 는 Shreya 가 받음 ($250 현금 + $150 기프트카드 중복 방지).
  const byBranchRanked = {};  // branchId → 점수 내림차순 직원 배열
  for (const r of allRows) {
    if (!r.branch) continue;
    if (!byBranchRanked[r.branch]) byBranchRanked[r.branch] = [];
    byBranchRanked[r.branch].push(r);
  }
  // 각 지점 배열은 이미 allRows 점수 내림차순 정렬을 따라가지만 안전하게 한 번 더.
  Object.values(byBranchRanked).forEach(arr => arr.sort((a,b) => b.score - a.score));
  const branchRows = BRANCHES
    .filter(b => b.id !== 'WEST_PALM' || (byBranchRanked[b.id] && byBranchRanked[b.id].length))
    .map(b => {
      const arr = byBranchRanked[b.id] || [];
      const lbl = b[LANG] || b.ko;
      if (!arr.length) return `<div class="b-row empty"><div class="b-ic">🏢</div><div class="b-name">${escHtml(lbl)}<span class="b-meta">${escHtml(t('bonusNoWinner'))}</span></div><div class="b-amt">$${BONUS.branchMVP}</div></div>`;
      // 차순위 승계 로직 — 1등이 top1Name 과 같으면 무조건 2등 선택.
      //   사장님 명시: Mirna 중복 절대 안 됨. 차순위 없으면(직원 1명뿐) MVP 비움.
      let mvp = arr[0];
      let isRunnerUp = false;
      if (top1Name && mvp.name === top1Name) {
        if (arr.length >= 2) {
          mvp = arr[1];
          isRunnerUp = true;
        } else {
          // 차순위 없음 — MVP 자리 비움 (No winner)
          return `<div class="b-row empty"><div class="b-ic">🏢</div><div class="b-name">${escHtml(lbl)}<span class="b-meta">${escHtml(t('bonusRunnerUpNone', top1Name))}</span></div><div class="b-amt">$${BONUS.branchMVP}</div></div>`;
        }

      const runnerTag = isRunnerUp ? `<span class="b-runner-tag">${escHtml(t('bonusRunnerUpTag'))}</span>` : '';
      const noteLine = isRunnerUp ? `<br><span style="color:#7c3aed;font-size:.92em">↳ ${escHtml(t('bonusRunnerUpNote', top1Name))}</span>` : '';
      return `<div class="b-row"><div class="b-ic">🏢</div><div class="b-name">${escHtml(mvp.name)}${runnerTag}<span class="b-meta">${escHtml(lbl)} · ${mvp.score}${t('pt')}${noteLine}</span></div><div class="b-amt">$${BONUS.branchMVP}</div></div>`;

  // West Palm 활동 여부 (총 풀 계산용)
  const branchCountKey = BRANCHES.filter(b => b.id !== 'WEST_PALM' || (byBranchRanked[b.id] && byBranchRanked[b.id].length)).length;

  // 2) 분야별 인기 직원 — 좋아요 + 답글 합산 1등
  const deptRows = DEPT_ROOMS.map(d => {
    const slot = BONUS_DEPT[d.key] || {};

      .map(([name, v]) => ({ name, score: v.likes + v.replies, likes: v.likes, replies: v.replies, branch: v.branch }))
      .filter(x => x.score > 0)
      .sort((a,b) => b.score - a.score);

    if (!ranked.length) return `<div class="b-row empty"><div class="b-ic">${d.icon}</div><div class="b-name">${escHtml(lbl)}<span class="b-meta">${escHtml(t('bonusNoWinner'))}</span></div><div class="b-amt">$${BONUS.deptPopular}</div></div>`;
    const w = ranked[0];
    const brLbl = w.branch ? branchLabel(w.branch) : '';
    return `<div class="b-row"><div class="b-ic">${d.icon}</div><div class="b-name">${escHtml(w.name)}<span class="b-meta">${escHtml(lbl)}${brLbl?' · 🏢 '+escHtml(brLbl):''} · 👍${w.likes} ↩️${w.replies}</span></div><div class="b-amt">$${BONUS.deptPopular}</div></div>`;
  }).join('');

  // 3) 매니저/슈퍼바이저 리더 — 2026-06-07 비활성화 (사장님 지시).
  //   BONUS_MGR 집계 / fetchBonusTaskSenders / i18n 키는 dormant 로 유지.
  //   재활성화하려면 BONUS.mgrLeader 값 복원 + 아래 매니저 그룹 div 살리면 됨.

  // 총 풀 계산: West Palm 활동 없으면 5개 지점으로 카운트
  const totalPool = BONUS.top1Cash + (branchCountKey * BONUS.branchMVP) + (DEPT_ROOMS.length * BONUS.deptPopular);

  return `<div class="bonus-track">
    <h3>${escHtml(t('bonusHd'))} <span class="beta-tag">${escHtml(t('bonusBetaTag'))}</span></h3>
    <div class="b-sub">${escHtml(t('bonusSub', totalPool.toLocaleString()))}</div>
    <div class="beta-banner"><span class="ic">🚧</span>${escHtml(t('bonusBetaBanner'))}</div>
    <div class="b-group top1">
      <div class="b-grp-hd">${escHtml(t('bonusTop1Hd'))}</div>
      <div class="b-grp-sub">${escHtml(t('bonusTop1Sub', BONUS.top1Cash))}</div>
      ${top1Row}
    </div>
    <div class="b-group">
      <div class="b-grp-hd">${escHtml(t('bonusBranchHd'))}</div>
      <div class="b-grp-sub">${escHtml(t('bonusBranchSub', BONUS.branchMVP))}</div>
      ${branchRows}
    </div>
    <div class="b-group">
      <div class="b-grp-hd">${escHtml(t('bonusDeptHd'))}</div>
      <div class="b-grp-sub">${escHtml(t('bonusDeptSub', BONUS.deptPopular))}</div>
      ${deptRows}
    </div>
    <div class="b-note">${escHtml(t('bonusOnlyLast'))}</div>
  </div>`;
}

function _partNorm(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
const PART_OVERRIDES = { 'erika garcia':'K-Food', 'anderson godoy':['정육','Seafood'], 'limberkin aparicio':['정육','Seafood'], 'rolando':['스시','K-Food'] };   // 보정 + 겸업(롤란도=스시·K-Food)
// 이름 정확 일치 우선, 없으면 한 단어 키(이름)는 토큰 포함으로 매칭(풀네임 몰라도 OK)
function _partOverride(nm){
  if (PART_OVERRIDES[nm]) return PART_OVERRIDES[nm];
  const toks = String(nm||'').split(' ');
  for (const k in PART_OVERRIDES){ if (k.indexOf(' ') < 0 && toks.includes(k)) return PART_OVERRIDES[k]; }
  return null;
}
function _partOf(role, position){
  const s = (String(role||'') + ' ' + String(position||'')).toLowerCase();
  if (/sushi|스시|초밥/.test(s)) return '스시';
  if (/kitchen|cocina|주방|hot\s*food|k-?food|반찬|k[-\s]?side|yumsem|bbq/.test(s)) return 'K-Food';
  if (/meat\s*&?\s*seafood/.test(s)) return '정육';
  if (/seafood|marisco|pescado|해산|생선|\bfish/.test(s)) return 'Seafood';
  if (/produce|vegetable|verdura|fruta|농산|청과|야채/.test(s)) return 'Produce';
  if (/meat|정육|carne|beef|pork|cerdo|pollo|chicken/.test(s)) return '정육';
  return null;
}
let LB_PART_ROSTER = null, __lbRosterLoading = false;
async function loadLBPartRoster(){
  if (__lbRosterLoading) return; __lbRosterLoading = true;
  const aq = await authParam(); const roster = []; const seen = new Set();
  for (const b of BRANCHES){
    try {
      const data = await fetch(`${FB_DB}/schedules/${b.id}.json${aq}`, { cache:'no-store' }).then(r=>r.json());
      const emps = (data && Array.isArray(data.employees)) ? data.employees : [];
      const shifts = (data && data.shifts) ? data.shifts : {};
      const posByEmp = {};
      Object.keys(shifts).forEach(k => { const at=k.indexOf('@'); if(at<0)return; const eid=k.slice(0,at); const p=_partOf('',(shifts[k]&&shifts[k].position)||''); if(!p)return; (posByEmp[eid]=posByEmp[eid]||{}); posByEmp[eid][p]=(posByEmp[eid][p]||0)+1; });
      emps.forEach(e => {
        if (!e || !e.name) return;
        const nm = _partNorm(e.name);
        const ov = _partOverride(nm);
        let parts = ov ? (Array.isArray(ov) ? ov : [ov]) : null;
        if (!parts){
          const c = (e.id!=null) ? posByEmp[e.id] : null;
          if (c){ const mx = Math.max.apply(null, Object.values(c)); parts = Object.keys(c).filter(p => c[p] >= mx*0.5); }  // 겸업: 최다의 50%+ 포지션 모두
          if (!parts || !parts.length){ const rp = _partOf(e.role,''); parts = rp ? [rp] : []; }
        }
        parts.forEach(part => { const key = part + '|' + nm; if (seen.has(key)) return; seen.add(key); roster.push({ name:e.name, branch:b.id, part }); });
      });
    } catch(_){}
  }
  LB_PART_ROSTER = roster; __lbRosterLoading = false;
  try { renderPartRankLB(window.__lbLastRows || []); } catch(_){}
}
function renderPartRankLB(rows){
  window.__lbLastRows = rows;
  let el = document.getElementById('lbPartRank');
  if (!el){ const c = document.getElementById('content'); if (!c) return; el = document.createElement('div'); el.id='lbPartRank'; el.style.cssText='margin-top:18px'; c.parentNode.insertBefore(el, c.nextSibling); }
  if (LB_PART_ROSTER === null) loadLBPartRoster();
  const scoreMap = {};
  (rows||[]).forEach(r => { if(!r||!r.name) return; const k=_partNorm(r.name); scoreMap[k]=Math.max(scoreMap[k]||0, r.score||0); });
  const PARTS = [['정육','🥩 정육','#d97706'],['스시','🍣 스시','#c026d3'],['K-Food','🍙 K-Food','#2563eb'],['Seafood','🐟 해산물','#0891b2'],['Produce','🥬 농산물','#16a34a']];
  const unit = (LANG==='ko')?'점':'pts';
  const title = LANG==='en'?'🏅 Part rankings (total)':LANG==='es'?'🏅 Ranking por parte (total)':'🏅 파트별 순위 (활동 총점)';
  const emptyLbl = LANG==='en'?'No members in schedule':LANG==='es'?'Sin personal':'스케줄 명단 없음';
  const loadingLbl = (LB_PART_ROSTER===null) ? (LANG==='en'?' (loading…)':LANG==='es'?' (cargando…)':' (불러오는 중…)') : '';
  let html = `<div style="font-weight:800;font-size:1.05em;color:#1f2937;margin:6px 2px 10px">${title}<span style="font-size:.7em;color:#9ca3af;font-weight:600">${loadingLbl}</span></div><div style="display:flex;flex-direction:column;gap:10px">`;
  PARTS.forEach(([cat,label,color]) => {
    const members = (LB_PART_ROSTER||[]).filter(r => r.part===cat && (CUR_BRANCH==='ALL' || r.branch===CUR_BRANCH));
    let body;
    if (!members.length){ body = `<div style="font-size:.82em;color:#9ca3af;padding:3px 2px">${emptyLbl}</div>`; }
    else {
      const ranked = members.map(m => ({ name:m.name, score: scoreMap[_partNorm(m.name)] || 0 })).sort((a,b)=>b.score-a.score || String(a.name).localeCompare(String(b.name)));
      body = ranked.map((r,i) => { const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1); const dim=r.score===0?'opacity:.5':''; return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;${i?'border-top:1px solid #f3f4f6':''};${dim}"><span style="width:22px;text-align:center;font-weight:800;color:#9ca3af;font-size:.85em">${medal}</span><span style="flex:1;min-width:0;font-size:.9em;color:#1f2937;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(r.name)}</span><span style="font-weight:900;color:${color};font-size:.92em">${r.score}<span style="font-size:.7em;color:#9ca3af;margin-left:2px">${unit}</span></span></div>`; }).join('');
    }
    html += `<div style="background:#fff;border:1px solid #e5e7eb;border-left:4px solid ${color};border-radius:10px;padding:9px 12px"><div style="font-weight:800;font-size:.92em;color:${color};margin-bottom:3px">${label} <span style="font-size:.78em;color:#9ca3af;font-weight:600">${members.length}${LANG==='ko'?'명':''}</span></div>${body}</div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

// ====== 🎖 매니저/오너 보너스 점수 (2026-06-08) ======
// 오너·매니저가 직원에게 보너스 포인트(+2/+3/+5)를 이유와 함께 부여 → 활동순위 점수에 합산.
// 데이터: mgrBonus/{branch}/{pushId} = {to, points, reason, by, byRole, branch, ts}
// ⚠️ RTDB 규칙에 mgrBonus 경로 read/write(auth!=null) 허용 필요. 동결(지난달) 기간엔 ts 윈도우로 자동 제외.
const BONUS_WEEKLY_BUDGET = 15;   // 매니저 1인 주간 한도 (오너/임원 무제한)
const BONUS_PRESETS = [
  { p:2, ko:'지시 잘 따름',        en:'Followed instructions', es:'Siguió instrucciones' },
  { p:3, ko:'솔선수범·추가 도움',  en:'Went above & beyond',   es:'Hizo más de lo pedido' },
  { p:5, ko:'이달의 모범',         en:'Outstanding',           es:'Excepcional' },
];
const AWARD_ROLES = new Set(['OWNER','EXECUTIVE','MANAGER','ASSISTANT_MANAGER']);
let EMP_ROSTER = [];   // [{name, branch}] — loadBranchEmployees 에서 채움
let _bonusUIReady = false;
function _bt(ko,en,es){ return LANG==='en' ? en : LANG==='es' ? (es||en) : ko; }
function _myProfile(){ const u = window.__lbAuth && window.__lbAuth.currentUser; return (u && USERS[u.uid]) ? USERS[u.uid] : null; }
// 오너/임원(B.H.K 등)은 OWNER_UIDS(이메일 화이트리스트 포함)로도 인정 — 역할 문자열이 '전무'/'MANAGER' 등이어도 무제한.
function _isOwnerUid(){ const u=window.__lbAuth && window.__lbAuth.currentUser; return !!(u && OWNER_UIDS.has(u.uid)); }
function _canAward(){ if(_isOwnerUid()) return true; const p=_myProfile(); return !!(p && p.role && AWARD_ROLES.has(p.role)); }
function _isUnlimitedAwarder(){ if(_isOwnerUid()) return true; const p=_myProfile(); return !!(p && (p.role==='OWNER' || p.role==='EXECUTIVE')); }

// 보너스 읽어서 순위 점수에 합산 (ts 윈도우 밖이면 제외 → 지난달 동결과 충돌 없음)
async function fetchMgrBonus(agg, since, until){
  try {
    const aq = await authParam();
    const branches = (CUR_BRANCH === 'ALL') ? BRANCHES.map(b=>b.id) : [CUR_BRANCH];
    await Promise.all(branches.map(async (br) => {
      try {
        const r = await fetchTR(`${FB_DB}/mgrBonus/${br}.json${aq}`, { cache:'no-store' }, 8000);
        if (!r) return;
        const d = await r.json();
        if (!d) return;
        Object.values(d).forEach(a => {
          if (!a || typeof a !== 'object' || !a.to) return;
          const ts = a.ts || 0;
          if (ts < since || ts >= until) return;
          const pts = (typeof a.points === 'number') ? a.points : 0;
          // ⭐ 사장님 상점(kind:'owner')은 'omerit' 로 분리 — 점수엔 합산되나 🎖배지·보너스트랙엔 안 나옴(출처 숨김).
          if (pts > 0) bumpAgg(agg, a.to, br, (a.kind === 'owner' ? 'omerit' : 'bonus'), pts);
        });
      } catch(e){ console.warn('[lb] mgrBonus', br, e); }
    }));
  } catch(e){ console.warn('[lb] fetchMgrBonus', e); }   // 절대 순위 렌더를 막지 않게
}

// 이번 주(월 0시) 시작 ts
function _weekStartMs(){ const d=new Date(); d.setHours(0,0,0,0); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return d.getTime(); }
// 내가 이번 주에 준 보너스 합 (전 지점)
async function _myWeekBonusUsed(){
  const p=_myProfile(); if(!p) return 0;
  const myName=p.name; const aq=await authParam(); const wk=_weekStartMs(); let used=0;
  await Promise.all(BRANCHES.map(async b=>{
    try{ const r=await fetch(`${FB_DB}/mgrBonus/${b.id}.json${aq}`,{cache:'no-store'}); if(!r.ok)return; const d=await r.json(); if(!d)return;
      Object.values(d).forEach(a=>{ if(a && a.by===myName && (a.ts||0)>=wk) used += (a.points||0); }); }catch(_){}
  }));
  return used;
}

function _openBonusModal(){
  if(!_canAward()) return;
  const m=document.getElementById('bonusModal'); if(!m) return;
  const sel=document.getElementById('bonusEmp'); sel.innerHTML='';
  const seen=new Set();
  EMP_ROSTER.filter(e => CUR_BRANCH==='ALL' || e.branch===CUR_BRANCH)
    .filter(e => !isExcludedSender(e.name, e.branch))
    .sort((a,b)=> String(a.name).localeCompare(String(b.name)))
    .forEach(e=>{ const k=String(e.name).trim().toLowerCase(); if(seen.has(k))return; seen.add(k);
      const o=document.createElement('option'); o.value=e.name; o.dataset.branch=e.branch;
      o.textContent=e.name+' · '+branchLabel(e.branch); sel.appendChild(o); });
  const pr=document.getElementById('bonusPresets');
  pr.innerHTML = BONUS_PRESETS.map((b,i)=>`<button type="button" class="bonus-preset${i===0?' on':''}" data-p="${b.p}">+${b.p}<small>${escHtml(_bt(b.ko,b.en,b.es))}</small></button>`).join('');
  pr.querySelectorAll('.bonus-preset').forEach(btn=>btn.addEventListener('click',()=>{ pr.querySelectorAll('.bonus-preset').forEach(x=>x.classList.remove('on')); btn.classList.add('on'); }));
  document.getElementById('bonusReason').value='';
  const bd=document.getElementById('bonusBudget');
  if(_isUnlimitedAwarder()){ bd.textContent=_bt('한도 없음 (오너)','No limit (owner)','Sin límite (dueño)'); }
  else { bd.textContent='…'; _myWeekBonusUsed().then(used=>{ const rem=Math.max(0,BONUS_WEEKLY_BUDGET-used);
    bd.textContent=_bt(`이번 주 남은 한도: ${rem} / ${BONUS_WEEKLY_BUDGET}pt`,`Weekly left: ${rem}/${BONUS_WEEKLY_BUDGET}pt`,`Semanal: ${rem}/${BONUS_WEEKLY_BUDGET}pt`); }); }
  m.style.display='flex';
}
function _closeBonusModal(){ const m=document.getElementById('bonusModal'); if(m) m.style.display='none'; }
async function _submitBonus(){
  if(!_canAward()) return;
  const sel=document.getElementById('bonusEmp'); const to=sel.value;
  const branch=(sel.selectedOptions[0] && sel.selectedOptions[0].dataset.branch) || '';
  const onBtn=document.querySelector('#bonusPresets .bonus-preset.on'); const points=onBtn?+onBtn.dataset.p:0;
  const reason=document.getElementById('bonusReason').value.trim();
  if(!to){ alert(_bt('직원을 선택하세요','Select an employee','Selecciona un empleado')); return; }
  if(!points){ alert(_bt('점수를 선택하세요','Select points','Selecciona puntos')); return; }
  if(!reason){ alert(_bt('이유를 적어주세요 (필수)','Enter a reason (required)','Escribe el motivo')); document.getElementById('bonusReason').focus(); return; }
  if(!_isUnlimitedAwarder()){
    const used=await _myWeekBonusUsed(); const rem=BONUS_WEEKLY_BUDGET-used;
    if(points>rem){ alert(_bt(`주간 한도 초과 — 남은 한도 ${Math.max(0,rem)}pt`,`Over weekly limit — ${Math.max(0,rem)}pt left`,`Límite semanal — quedan ${Math.max(0,rem)}pt`)); return; }
  }
  const me=_myProfile();
  const award={ to, points, reason, by:(me&&me.name)||'', byRole:(me&&me.role)||'', branch, ts: Date.now() };
  const aq=await authParam();
  const btn=document.getElementById('bonusSubmit'); btn.disabled=true; const _orig=btn.textContent; btn.textContent='…';
  try{
    const r=await fetch(`${FB_DB}/mgrBonus/${branch}.json${aq}`,{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(award) });
    if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,140));
    _closeBonusModal();
    alert(_bt(`✅ ${to} 에게 +${points}pt 부여`,`✅ +${points}pt to ${to}`,`✅ +${points}pt a ${to}`));
    loadAll(true);
  }catch(e){
    alert(_bt('저장 실패 — Firebase 규칙에 mgrBonus 쓰기 허용이 필요할 수 있습니다.\n','Save failed — RTDB rules may need mgrBonus write.\n','Error al guardar.\n')+e.message);
  }finally{ btn.disabled=false; btn.textContent=_orig; }
}

let _lbLoadSeq = 0;
async function loadAll(force){
  const _seq = ++_lbLoadSeq;   // 탭 빠르게 바꿔도 옛 응답이 새 화면 덮어쓰지 않게
  // ⚡ 캐시 즉시 표시. 충분히 최신이면(지난달=동결 무기한 / 그 외 30초) 네트워크 재요청 생략 → 탭 전환 즉시.
  const _cached = _lbReadCache();
  const _ttl = (CUR_RANGE === 'lastmonth') ? Infinity : 30000;
  const _fresh = !!(_cached && !force && (Date.now() - (_cached.ts || 0)) < _ttl);
  if (_cached) buildAndRender(_cached.rows, !_fresh);
  else document.getElementById('content').innerHTML = `<div class="loading"><div class="ic">⏳</div>${escHtml(t('loading'))}</div>`;
  if (_fresh) return;   // 즉시 표시로 끝 — 재요청 생략 (새로고침 버튼/보너스부여는 force=true 로 무시)
  const since = rangeStart();
  const until = rangeEnd();
  const agg = {};
  resetLoadStats();
  // Wait for auth before pulling /users (rules likely require auth!=null)
  await new Promise(res => {
    if (window.__lbAuth?.currentUser) return res();
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (window.__lbAuth?.currentUser || Date.now() - t0 > 5000) {
        clearInterval(iv); res();
      }
    }, 150);
  });
  if (_seq !== _lbLoadSeq) return;
  await loadUsers();
  try { initBonusUI(); } catch(e){ console.warn('[lb] initBonusUI', e); }   // 🎖 권한자에게 보너스 주기 버튼 (1회)
  BONUS_DEPT = {}; BONUS_MGR = {};   // 보너스 트랙 비활성(2026-06-07) — 빈 객체 유지 ([[project_bonus_track_hold]])

  // agg → 정렬된 rows. Phase 1·2 양쪽에서 재사용. (점수 계산식은 기존 그대로)
  // 🔒 한 지점 선택 시 그 지점 등록자만 (ALL 이면 전원).
  const _rowsFromAgg = () => {
    computeScores(agg);
    return Object.values(agg)
      .filter(r => r.score > 0)
      .filter(r => CUR_BRANCH === 'ALL' || r.branch === CUR_BRANCH)
      .sort((a,b) => b.score - a.score);
  };
  // 부분 로드(핵심 지점 실패) 시: 깨진 값은 캐시에 저장하지 않고 경고 + 1회 자동 재시도.
  //   → 다음 방문/다른 기계가 깨진 값을 물려받지 않게. (이게 "2~3점" 붕괴의 근본 원인이었음)
  const _partialFallback = () => {
    const warn = (LANG==='en') ? '⚠️ Some branches failed to load — retrying, or tap ↻ Refresh'
               : (LANG==='es') ? '⚠️ Algunas sucursales no cargaron — reintentando, o toca ↻'
               :                 '⚠️ 일부 지점을 불러오지 못했습니다 — 잠시 후 다시 시도하거나 ↻ 새로고침';
    buildAndRender(_rowsFromAgg(), true, warn);
    if (!force) setTimeout(() => { if (_seq === _lbLoadSeq) loadAll(true); }, 2500);
  };

  // 🔒 2026-06-14 사장님 지시: ACTIVITY RANKING 은 '고정 화면'.
  //   단계식(Phase1→2) 중간 렌더를 제거 — 화면이 도중에 바뀌지 않게 모든 점수
  //   (업무·유통기한·보너스·채팅)를 한 번에 받고 '딱 한 번만' 그린다.
  //   (탭 재진입/새로고침은 캐시로 즉시 표시 → 체감 속도는 유지. 자동 갱신 없음.)
  await Promise.all([
    fetchExpiry(agg, since, until),
    fetchTasks(agg, since, until),
    fetchMgrBonus(agg, since, until),
    fetchChat(agg, since, until),
  ]);
  if (_seq !== _lbLoadSeq) return;
  if (CORE_FAILS > 0) { _partialFallback(); return; }   // 핵심 지점 실패 → 경고 + 재시도
  const rows = _rowsFromAgg();
  _lbWriteCache(rows);
  buildAndRender(rows, false);   // 단 한 번만 렌더 — 도중에 안 바뀜 (고정 화면)
}

initBranchSel();
initTabs();
applyStaticI18n();   // 언어 버튼·탭 라벨·refresh 버튼 즉시 다국어 적용
loadAll();
window.loadAll = loadAll;

// 🖨 프린트 — 현재 범위·지점 표시 후 인쇄 다이얼로그 호출
function printLeaderboard(){
  const rangeLabel = { today:'오늘', week:'이번 주', month:'이번 달', lastmonth:'지난 달', all:'전체' }[CUR_RANGE] || CUR_RANGE;
  const branchSel = document.getElementById('branchSel');
  const branchLabel = branchSel && branchSel.selectedOptions[0] ? branchSel.selectedOptions[0].textContent.trim() : 'ALL';
  const dateStr = new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'});
  document.body.dataset.printTitle = `${branchLabel} · ${rangeLabel} (${dateStr})`;
  setTimeout(() => window.print(), 100);
}
window.printLeaderboard = printLeaderboard;
</script>
