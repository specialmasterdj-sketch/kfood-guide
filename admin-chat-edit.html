<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>채팅 메시지 편집 — 어드민</title>
<link rel="manifest" href="pwa-assets/manifest.webmanifest">
<meta name="theme-color" content="#1a5c3a">
<script type="module" src="./fb-auth-fetch.js?v=2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f4f6f9;padding-bottom:80px;color:#0f172a;font-size:14px}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.topbar{background:linear-gradient(135deg,#1a5c3a,#2e7d32);color:#fff;padding:16px 20px;border-radius:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.topbar h1{font-size:1.2em;font-weight:900}
.topbar .sub{font-size:.82em;opacity:.85;margin-top:2px}
.warn{background:#fff8e1;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:8px;margin-bottom:14px;font-size:.85em;line-height:1.5;color:#5d4037}
.controls{background:#fff;padding:12px 14px;border-radius:10px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86em;border:1px solid #e5e7eb}
.controls label{font-weight:700;color:#374151;margin-right:4px}
.controls select,.controls input,.controls button{border:1px solid #d1d5db;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:.95em}
.controls button{background:#1a5c3a;color:#fff;border:0;cursor:pointer;font-weight:700}
.msg{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.msg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.msg-sender{font-weight:800;color:#1a5c3a;font-size:.95em}
.msg-time{font-size:.76em;color:#6b7280;white-space:nowrap}
.msg-text{font-size:.86em;color:#374151;white-space:pre-wrap;line-height:1.5;border-left:3px solid #e5e7eb;padding-left:10px;max-height:200px;overflow-y:auto}
.msg-actions{display:flex;gap:6px;margin-top:8px}
.msg-actions button{font-size:.78em;padding:5px 10px;border-radius:6px;border:0;cursor:pointer;font-weight:700}
.btn-edit{background:#0891b2;color:#fff}
.btn-del{background:#fff;color:#dc2626;border:1px solid #fca5a5 !important}
.empty{padding:40px;text-align:center;color:#9ca3af;background:#fff;border-radius:10px;border:1px solid #e5e7eb}
#busy{position:fixed;top:0;left:0;right:0;background:#1a5c3a;color:#fff;text-align:center;padding:6px;font-size:.85em;font-weight:700;z-index:1000;display:none}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;align-items:center;justify-content:center;padding:14px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:18px 20px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 16px 40px rgba(15,23,42,.18)}
.modal h2{font-size:1.05em;font-weight:800;color:#1a5c3a;margin-bottom:12px}
.modal label{display:block;font-size:.78em;font-weight:700;color:#374151;margin-top:10px;margin-bottom:4px}
.modal input,.modal textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;font-family:inherit;font-size:.92em}
.modal textarea{min-height:160px;resize:vertical}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal-foot button{padding:8px 16px;border-radius:8px;border:0;cursor:pointer;font-weight:700;font-size:.88em}
.btn-cancel{background:#f1f5f9;color:#475569}
.btn-save{background:#16a34a;color:#fff}
.preview-photos{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.preview-photos img{width:60px;height:60px;object-fit:cover;border-radius:4px;border:1px solid #e5e7eb}
.badge{display:inline-block;background:#f0fdf4;color:#15803d;padding:1px 6px;border-radius:4px;font-size:.72em;font-weight:700;margin-left:4px}
</style>
</head>
<body>
<div id="busy">⏳ 처리 중…</div>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>💬 채팅 메시지 편집</h1>
      <div class="sub">평가방 메시지의 sender / text 수정 + 삭제</div>
    </div>
    <a href="apps.html" style="color:#fff;text-decoration:none;font-size:.85em;opacity:.85">← apps</a>
  </div>

  <div class="warn">
    ⚠️ 매니저/오너 전용. 채팅 메시지의 sender(작성자 이름) + text(본문) 를 RTDB 에서 직접 수정합니다.
    예: 작업 완료 보고가 잘못된 이름으로 올라간 경우 sender = "Anderson Godoy" → "Limberkin", 본문 안 "담당:" 줄도 함께 수정.
  </div>

  <div class="controls">
    <label>채팅방:</label>
    <select id="roomSel">
      <option value="meat_evalution_room">🥩 정육 평가방</option>
      <option value="seafood_evalution_room">🐟 Seafood 평가방</option>
      <option value="sushi">🍣 Sushi</option>
      <option value="kfood_eval">🥘 K-Food 평가방</option>
      <option value="produce">🥬 Produce</option>
      <option value="grocery_eval">📦 Grocery 평가방</option>
      <option value="general">💬 General</option>
    </select>
    <label>표시 개수:</label>
    <select id="limitSel">
      <option value="20">20</option>
      <option value="50" selected>50</option>
      <option value="100">100</option>
      <option value="200">200</option>
    </select>
    <button onclick="loadMessages()">🔄 다시 불러오기</button>
  </div>

  <div id="msgList"></div>
</div>

<!-- Edit Modal -->
<div class="modal-bg" id="editModal" onclick="if(event.target.id==='editModal') closeModal()">
  <div class="modal">
    <h2>✏️ 메시지 편집</h2>
    <label>작성자 (sender)</label>
    <input id="edSender" type="text">
    <label>본문 (text)</label>
    <textarea id="edText"></textarea>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveEdit()">💾 저장</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const FB_DB_URL = 'https://kimchi-mart-order-default-rtdb.firebaseio.com';
const cfg = {
  apiKey: "AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4",
  authDomain: "kimchi-mart-order.firebaseapp.com",
  databaseURL: FB_DB_URL,
  projectId: "kimchi-mart-order"
};
const app = getApps().length ? getApp() : initializeApp(cfg);
const auth = getAuth(app);

const busy = (on) => document.getElementById('busy').style.display = on ? 'block' : 'none';
let CURRENT_ROOM = 'meat_evalution_room';
let CURRENT_MSGS = {};  // msgId -> msg
let EDIT_ID = null;

async function authQ(){
  try {
    const u = auth.currentUser;
    if (u) {
      const t = await u.getIdToken();
      return '?auth=' + encodeURIComponent(t);
    }
  } catch(_){}
  // fb-auth-fetch monkey-patches fetch so this still works, but for PATCH/DELETE
  // some hosting setups don't accept the patched call — we attach explicitly.
  if (window.__getAuthToken){
    const t = await window.__getAuthToken();
    if (t) return '?auth=' + encodeURIComponent(t);
  }
  return '';
}

function escHtml(s){
  return String(s||'').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function fmtTs(ts){
  if (!ts) return '';
  try {
    const d = new Date(Number(ts));
    return d.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:true });
  } catch(_){ return String(ts); }
}

window.loadMessages = async function(){
  busy(true);
  try {
    const room = document.getElementById('roomSel').value;
    const limit = parseInt(document.getElementById('limitSel').value, 10) || 50;
    CURRENT_ROOM = room;
    const q = await authQ();
    const url = `${FB_DB_URL}/chat/messages/${room}.json${q}`;
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok){
      const errTxt = await r.text().catch(()=>'');
      alert('불러오기 실패: ' + r.status + '\n' + errTxt + '\n\n관리자 로그인 필요 — auth.html 에서 매니저 계정으로 로그인 후 다시 시도');
      return;
    }
    const all = await r.json() || {};
    // 클라이언트에서 ts 내림차순 정렬 → 상위 limit 개만
    const ids = Object.keys(all).sort((a,b) => (all[b]?.ts||0) - (all[a]?.ts||0)).slice(0, limit);
    const slice = {};
    ids.forEach(id => { slice[id] = all[id]; });
    CURRENT_MSGS = slice;
    renderList(slice);
  } catch (e) {
    console.error(e);
    alert('오류: ' + e.message);
  } finally {
    busy(false);
  }
};

function renderList(data){
  const list = document.getElementById('msgList');
  const ids = Object.keys(data || {});
  if (!ids.length){
    list.innerHTML = '<div class="empty">메시지가 없습니다.</div>';
    return;
  }
  ids.sort((a,b) => (data[b]?.ts||0) - (data[a]?.ts||0));
  list.innerHTML = ids.map(id => {
    const m = data[id] || {};
    const photos = Array.isArray(m.photos) ? m.photos.slice(0,4) : [];
    return `
      <div class="msg" data-id="${escHtml(id)}">
        <div class="msg-head">
          <div>
            <span class="msg-sender">${escHtml(m.sender || '(no sender)')}</span>
            ${m.senderBranch ? `<span class="badge">${escHtml(m.senderBranch)}</span>` : ''}
            ${m.meta && m.meta.kind ? `<span class="badge" style="background:#fef3c7;color:#92400e">${escHtml(m.meta.kind)}</span>` : ''}
          </div>
          <div class="msg-time">${fmtTs(m.ts)}</div>
        </div>
        <div class="msg-text">${escHtml((m.text||'').slice(0,1200))}${(m.text||'').length>1200?'…':''}</div>
        ${photos.length ? `<div class="preview-photos">${photos.map(p=>`<img src="${escHtml(p)}" loading="lazy">`).join('')}</div>` : ''}
        <div class="msg-actions">
          <button class="btn-edit" onclick="openEdit('${escHtml(id)}')">✏️ 편집</button>
          <button class="btn-del" onclick="delMsg('${escHtml(id)}')">🗑️ 삭제</button>
        </div>
      </div>
    `;
  }).join('');
}

window.openEdit = function(id){
  const m = CURRENT_MSGS[id];
  if (!m) return;
  EDIT_ID = id;
  document.getElementById('edSender').value = m.sender || '';
  document.getElementById('edText').value = m.text || '';
  document.getElementById('editModal').classList.add('show');
};
window.closeModal = function(){
  EDIT_ID = null;
  document.getElementById('editModal').classList.remove('show');
};

window.saveEdit = async function(){
  if (!EDIT_ID) return;
  const newSender = document.getElementById('edSender').value.trim();
  const newText = document.getElementById('edText').value;
  if (!newSender){ alert('작성자 비울 수 없음'); return; }
  busy(true);
  try {
    const q = await authQ();
    const url = `${FB_DB_URL}/chat/messages/${CURRENT_ROOM}/${EDIT_ID}.json${q}`;
    const patch = { sender: newSender, text: newText, editedAt: Date.now() };
    // meta.completedBy 도 업데이트 (있을 때)
    const m = CURRENT_MSGS[EDIT_ID];
    if (m && m.meta && m.meta.kind === 'task_complete'){
      patch['meta/completedBy'] = newSender;
    }
    const r = await fetch(url, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patch)
    });
    if (!r.ok){
      const t = await r.text();
      alert('저장 실패: ' + r.status + '\n' + t);
      return;
    }
    // 🆕 2026-05-22 — task_complete 메시지면 원본 task 레코드도 같이 패치.
    // 안 그러면 leaderboard 가 task.completedBy 만 보기 때문에 점수가
    // 잘못된 사람한테 그대로 남음.
    let taskFixMsg = '';
    if (m && m.meta && m.meta.kind === 'task_complete' && m.meta.taskId && m.meta.branch){
      try {
        const dateStr = new Date(m.ts || m.meta.completedAt || Date.now()).toLocaleDateString('en-CA', { timeZone:'America/New_York' });
        const taskUrl = `${FB_DB_URL}/tasks/${m.meta.branch}/${dateStr}/${m.meta.taskId}.json${q}`;
        const tr = await fetch(taskUrl, {
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ completedBy: newSender, completedByEditedAt: Date.now() })
        });
        if (tr.ok) {
          taskFixMsg = '\n✅ task 레코드 completedBy 도 갱신됨 → 점수 ' + newSender + ' 에게 적립';
        } else {
          const body = await tr.text().catch(()=>'');
          taskFixMsg = '\n⚠️ task 레코드 갱신 실패 (HTTP ' + tr.status + ') — leaderboard 점수는 옛 이름으로 남을 수 있음.\n경로: ' + taskUrl.split('?')[0] + '\n' + body.slice(0, 120);
        }
      } catch(e) {
        taskFixMsg = '\n⚠️ task 갱신 오류: ' + (e?.message || e);
      }
    }
    // 메모리 동기화
    Object.assign(CURRENT_MSGS[EDIT_ID], patch);
    renderList(CURRENT_MSGS);
    closeModal();
    if (taskFixMsg) alert('💾 채팅 저장 완료' + taskFixMsg);
  } catch(e){
    alert('오류: ' + e.message);
  } finally {
    busy(false);
  }
};

window.delMsg = async function(id){
  const m = CURRENT_MSGS[id];
  const preview = (m?.text||'').slice(0,40);
  if (!confirm('이 메시지를 삭제할까요?\n\n' + preview)) return;
  busy(true);
  try {
    const q = await authQ();
    const url = `${FB_DB_URL}/chat/messages/${CURRENT_ROOM}/${id}.json${q}`;
    const r = await fetch(url, { method: 'DELETE' });
    if (!r.ok){
      alert('삭제 실패: ' + r.status);
      return;
    }
    delete CURRENT_MSGS[id];
    renderList(CURRENT_MSGS);
  } catch(e){
    alert('오류: ' + e.message);
  } finally {
    busy(false);
  }
};

// auth ready 후 자동 로드
window.addEventListener('fb-auth-ready', () => loadMessages(), { once: true });
// 안전망 — 3초 안에 auth 이벤트 안 오면 그냥 시도
setTimeout(() => { if (!Object.keys(CURRENT_MSGS).length) loadMessages(); }, 3000);

document.getElementById('roomSel').addEventListener('change', () => loadMessages());
document.getElementById('limitSel').addEventListener('change', () => loadMessages());
</script>
</body>
</html>
