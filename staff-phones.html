<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>직원 전화번호 등록 — 어드민</title>
<link rel="manifest" href="pwa-assets/manifest.webmanifest">
<meta name="theme-color" content="#1a5c3a">
<script type="module" src="./fb-auth-fetch.js?v=2"></script>
<script type="module" src="./auth-gate.js?v=4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f4f6f9;padding:14px;color:#0f172a;font-size:14px;padding-bottom:80px}
.wrap{max-width:760px;margin:0 auto}
.topbar{background:linear-gradient(135deg,#0277BD,#0288D1);color:#fff;padding:16px 20px;border-radius:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:1.15em;font-weight:900}
.topbar .sub{font-size:.82em;opacity:.9;margin-top:4px}
.topbar a{color:#fff;text-decoration:none;font-size:.85em;opacity:.9}
.warn{background:#e1f5fe;border-left:4px solid #0288D1;padding:12px 16px;border-radius:8px;margin-bottom:14px;font-size:.86em;line-height:1.6;color:#01579b}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:.95em;color:#0277BD;margin-bottom:12px;font-weight:800}
.field{margin-bottom:10px}
.field label{display:block;font-size:.78em;color:#6b7280;margin-bottom:4px;font-weight:700}
.field input,.field select{width:100%;border:1.5px solid #d1d5db;border-radius:9px;padding:11px 12px;font-family:inherit;font-size:1em;outline:0;background:#fff}
.addbtn{width:100%;background:#0277BD;color:#fff;border:0;border-radius:9px;padding:13px;font-weight:800;cursor:pointer;font-size:1em;margin-top:4px}
.addbtn:disabled{opacity:.5;cursor:wait}
.row{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .nm{font-weight:800;font-size:1em}
.row .meta{font-size:.8em;color:#6b7280;margin-top:2px}
.row .ph{font-family:Menlo,Consolas,monospace;font-weight:700;color:#0277BD}
.row .del{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:.82em;white-space:nowrap}
.branch-group{margin-top:14px}
.branch-group .bh{font-size:.85em;font-weight:800;color:#0277BD;margin:14px 0 8px;border-bottom:1px solid #e5e7eb;padding-bottom:4px}
.empty{text-align:center;color:#9ca3af;padding:24px;font-size:.9em}
#busy{position:fixed;top:0;left:0;right:0;background:#0277BD;color:#fff;text-align:center;padding:6px;font-size:.85em;font-weight:700;z-index:1000;display:none}
.msg{font-size:.82em;margin-top:8px;min-height:1.1em}
.msg.ok{color:#16a34a}.msg.err{color:#dc2626}
</style>
</head>
<body>
<div id="busy">⏳ 처리 중…</div>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>📱 직원 전화번호 등록</h1>
      <div class="sub">등록한 직원은 전화번호+문자코드만으로 바로 입장 (PIN·승인 불필요)</div>
    </div>
    <a href="apps.html">← apps</a>
  </div>

  <div class="warn">
    💡 매니저+ 전용. 여기에 직원 <b>이름·전화번호·지점</b>을 등록하면, 그 직원은
    로그인 페이지에서 <b>전화번호 입력 → 문자코드 → 바로 입장</b>합니다 (매장 PIN·매니저 승인 생략).
    번호는 미국 형식이면 10자리만 넣어도 됩니다 (예: 954-123-4567).
  </div>

  <div class="card">
    <h2>➕ 직원 추가</h2>
    <div class="field"><label>이름 / Name</label><input id="inName" type="text" placeholder="직원 이름" autocomplete="off"></div>
    <div class="field"><label>전화번호 / Phone</label><input id="inPhone" type="tel" inputmode="tel" placeholder="954-123-4567" autocomplete="off"></div>
    <div class="field"><label>지점 / Branch</label>
      <select id="inBranch"><option value="">📍 지점 선택</option></select>
    </div>
    <div class="field"><label>직책 / Role</label>
      <select id="inRole">
        <option value="">👤 일반 직원 / Staff</option>
        <option value="SUPERVISOR">🎖️ 슈퍼바이저 / Supervisor</option>
        <option value="ASSISTANT_MANAGER">🥈 부매니저 / Assistant Manager</option>
        <option value="MANAGER">⭐ 매니저 / Manager</option>
      </select>
    </div>
    <button class="addbtn" id="addBtn" onclick="addStaff()">➕ 등록</button>
    <div class="msg" id="addMsg"></div>
  </div>

  <div class="card">
    <h2>📋 등록된 직원</h2>
    <div id="list"><div class="empty">불러오는 중...</div></div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const FB_DB = 'https://kimchi-mart-order-default-rtdb.firebaseio.com';
const cfg = { apiKey:"AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4", authDomain:"kimchi-mart-order.firebaseapp.com", databaseURL:FB_DB, projectId:"kimchi-mart-order" };
const app = getApps().length ? getApp() : initializeApp(cfg);
const auth = getAuth(app);

const BRANCHES = [
  { id:'HOLLYWOOD',      label:'HOLLYWOOD'      },
  { id:'MIAMI',          label:'MIAMI'          },
  { id:'LASOLAS',        label:'LASOLAS'        },
  { id:'CORAL_SPRINGS',  label:'CORAL SPRINGS'  },
  { id:'PEMBROKE_PINES', label:'PEMBROKE PINES' },
];
const BR_LABEL = Object.fromEntries(BRANCHES.map(b => [b.id, b.label]));
const ROLE_LABEL = { '':'일반 직원', SUPERVISOR:'🎖️ 슈퍼바이저', ASSISTANT_MANAGER:'🥈 부매니저', MANAGER:'⭐ 매니저' };
const busy = (on) => document.getElementById('busy').style.display = on ? 'block' : 'none';
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 미국 기준 E.164: 10자리→+1, 11자리(1로 시작)→+, 그 외 +붙임
function toE164(raw){
  let d = String(raw||'').replace(/[^\d+]/g,'');
  if (d.startsWith('+')) return d;
  d = d.replace(/\D/g,'');
  if (d.length === 10) return '+1' + d;
  if (d.length === 11 && d[0] === '1') return '+' + d;
  if (d.length >= 11) return '+' + d;
  return '';
}
const digitsKey = (e164) => String(e164||'').replace(/\D/g,'');
const fmtUS = (e164) => { const d=digitsKey(e164); if(d.length===11&&d[0]==='1'){const n=d.slice(1);return `+1 ${n.slice(0,3)}-${n.slice(3,6)}-${n.slice(6)}`;} return e164; };

async function authQ(){
  try { const u = auth.currentUser; if (u){ const t = await u.getIdToken(); return '?auth=' + encodeURIComponent(t); } } catch(_){}
  return '';
}

function fillBranches(){
  const sel = document.getElementById('inBranch');
  BRANCHES.forEach(b => { const o=document.createElement('option'); o.value=b.id; o.textContent=b.label; sel.appendChild(o); });
}

window.addStaff = async function(){
  const name = (document.getElementById('inName').value||'').trim();
  const phoneRaw = (document.getElementById('inPhone').value||'').trim();
  const branch = document.getElementById('inBranch').value;
  const role = document.getElementById('inRole').value || '';
  const msg = document.getElementById('addMsg');
  msg.className = 'msg';
  if (!name){ msg.textContent='⚠️ 이름을 입력하세요.'; msg.className='msg err'; return; }
  const e164 = toE164(phoneRaw);
  if (!e164 || digitsKey(e164).length < 11){ msg.textContent='⚠️ 전화번호를 정확히 입력하세요 (예: 954-123-4567).'; msg.className='msg err'; return; }
  if (!branch){ msg.textContent='⚠️ 지점을 선택하세요.'; msg.className='msg err'; return; }
  const key = digitsKey(e164);
  busy(true);
  document.getElementById('addBtn').disabled = true;
  try {
    const q = await authQ();
    const r = await fetch(`${FB_DB}/phoneRoster/${key}.json${q}`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, branch, role, e164, addedAt: Date.now() })
    });
    if (!r.ok){ const t=await r.text().catch(()=>''); msg.textContent='❌ 등록 실패: '+r.status+' '+t.slice(0,80); msg.className='msg err'; return; }
    msg.textContent='✅ '+name+' 등록됨 ('+fmtUS(e164)+')'; msg.className='msg ok';
    document.getElementById('inName').value=''; document.getElementById('inPhone').value='';
    loadRoster();
  } catch(e){ msg.textContent='❌ '+e.message; msg.className='msg err'; }
  finally { busy(false); document.getElementById('addBtn').disabled=false; }
};

window.delStaff = async function(key, name){
  if (!confirm((name||'이 직원')+' 등록을 삭제할까요?\n(삭제해도 이미 만든 계정은 남습니다 — 새 로그인만 차단)')) return;
  busy(true);
  try {
    const q = await authQ();
    const r = await fetch(`${FB_DB}/phoneRoster/${key}.json${q}`, { method:'DELETE' });
    if (!r.ok){ alert('삭제 실패: '+r.status); return; }
    loadRoster();
  } catch(e){ alert('오류: '+e.message); } finally { busy(false); }
};

window.loadRoster = async function(){
  busy(true);
  const list = document.getElementById('list');
  try {
    const q = await authQ();
    const r = await fetch(`${FB_DB}/phoneRoster.json${q}`, { cache:'no-store' });
    if (!r.ok){ const t=await r.text().catch(()=>''); list.innerHTML='<div class="empty" style="color:#dc2626">읽기 실패: '+r.status+'<br><small>'+esc(t)+'</small><br><br>Firebase RTDB 규칙에 phoneRoster 게시가 필요합니다.</div>'; return; }
    const data = await r.json() || {};
    const entries = Object.entries(data);
    if (!entries.length){ list.innerHTML='<div class="empty">아직 등록된 직원이 없습니다.<br>위에서 추가하세요 ↑</div>'; return; }
    // 지점별 그룹
    const byBranch = {};
    entries.forEach(([key,v]) => { const b=v.branch||'(지점없음)'; (byBranch[b]=byBranch[b]||[]).push([key,v]); });
    let html='';
    BRANCHES.forEach(b => {
      const rows = byBranch[b.id]; if (!rows||!rows.length) return;
      rows.sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
      html += `<div class="branch-group"><div class="bh">📍 ${b.label} (${rows.length})</div>`;
      rows.forEach(([key,v]) => {
        const roleLbl = ROLE_LABEL[v.role || ''] || (v.role || '일반 직원');
        html += `<div class="row"><div><div class="nm">${esc(v.name)} <span style="font-size:.72em;font-weight:700;color:#0277BD;background:#e1f5fe;padding:1px 7px;border-radius:9px;margin-left:4px">${esc(roleLbl)}</span></div><div class="meta"><span class="ph">${esc(fmtUS(v.e164||key))}</span></div></div><button class="del" onclick="delStaff('${key}','${esc(v.name)}')">🗑 삭제</button></div>`;
      });
      html += `</div>`;
    });
    list.innerHTML = html || '<div class="empty">등록된 직원이 없습니다.</div>';
  } catch(e){ list.innerHTML='<div class="empty" style="color:#dc2626">오류: '+esc(e.message)+'</div>'; }
  finally { busy(false); }
};

fillBranches();
window.addEventListener('fb-auth-ready', () => loadRoster(), { once:true });
setTimeout(() => { if (document.getElementById('list').innerHTML.includes('불러오는 중')) loadRoster(); }, 3000);
</script>
</body>
</html>
