<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>직원 전화번호 등록 — 어드민</title>
<link rel="manifest" href="pwa-assets/manifest.webmanifest">
<meta name="theme-color" content="#1a5c3a">
<script type="module" src="./fb-auth-fetch.js?v=2"></script>
<script type="module" src="./auth-gate.js?v=4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f4f6f9;padding:14px;color:#0f172a;font-size:14px;padding-bottom:80px}
.wrap{max-width:760px;margin:0 auto}
.topbar{background:linear-gradient(135deg,#0277BD,#0288D1);color:#fff;padding:16px 20px;border-radius:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-size:1.15em;font-weight:900}
.topbar .sub{font-size:.82em;opacity:.9;margin-top:4px}
.topbar a{color:#fff;text-decoration:none;font-size:.85em;opacity:.9}
.langs{display:flex;gap:4px}
.langs button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:7px;padding:5px 10px;font-weight:800;cursor:pointer;font-size:.78em}
.langs button.on{background:#fff;color:#0277BD}
.warn{background:#e1f5fe;border-left:4px solid #0288D1;padding:12px 16px;border-radius:8px;margin-bottom:14px;font-size:.86em;line-height:1.6;color:#01579b}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:.95em;color:#0277BD;margin-bottom:12px;font-weight:800}
.field{margin-bottom:10px}
.field label{display:block;font-size:.78em;color:#6b7280;margin-bottom:4px;font-weight:700}
.field input,.field select{width:100%;border:1.5px solid #d1d5db;border-radius:9px;padding:11px 12px;font-family:inherit;font-size:1em;outline:0;background:#fff}
.addbtn{width:100%;background:#0277BD;color:#fff;border:0;border-radius:9px;padding:13px;font-weight:800;cursor:pointer;font-size:1em;margin-top:4px}
.addbtn:disabled{opacity:.5;cursor:wait}
.row{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .nm{font-weight:800;font-size:1em}
.row .meta{font-size:.8em;color:#6b7280;margin-top:2px}
.row .ph{font-family:Menlo,Consolas,monospace;font-weight:700;color:#0277BD}
.row .del{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:.82em;white-space:nowrap}
.branch-group .bh{font-size:.85em;font-weight:800;color:#0277BD;margin:14px 0 8px;border-bottom:1px solid #e5e7eb;padding-bottom:4px}
.empty{text-align:center;color:#9ca3af;padding:24px;font-size:.9em}
#busy{position:fixed;top:0;left:0;right:0;background:#0277BD;color:#fff;text-align:center;padding:6px;font-size:.85em;font-weight:700;z-index:1000;display:none}
.msg{font-size:.82em;margin-top:8px;min-height:1.1em}
.msg.ok{color:#16a34a}.msg.err{color:#dc2626}
</style>
</head>
<body>
<div id="busy">⏳ <span data-i="busy">처리 중…</span></div>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>📱 <span data-i="title">직원 전화번호 등록</span></h1>
      <div class="sub" data-i="sub">등록한 직원은 전화번호+문자코드만으로 바로 입장 (PIN·승인 불필요)</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div class="langs">
        <button data-l="ko" onclick="setLang('ko')">KO</button>
        <button data-l="en" onclick="setLang('en')">EN</button>
        <button data-l="es" onclick="setLang('es')">ES</button>
      </div>
      <a href="apps.html">← apps</a>
    </div>
  </div>

  <div class="warn" data-ih="warn"></div>

  <div class="card">
    <h2>➕ <span data-i="addTitle">직원 추가</span></h2>
    <div class="field"><label data-i="lName">이름 / Name</label><input id="inName" type="text" data-iph="phName" placeholder="직원 이름" autocomplete="off"></div>
    <div class="field"><label data-i="lPhone">전화번호 / Phone</label><input id="inPhone" type="tel" inputmode="tel" placeholder="954-123-4567" autocomplete="off"></div>
    <div class="field"><label data-i="lBranch">지점 / Branch</label>
      <select id="inBranch"></select>
    </div>
    <div class="field"><label data-i="lRole">직책 / Role</label>
      <select id="inRole"></select>
    </div>
    <button class="addbtn" id="addBtn" onclick="addStaff()">➕ <span data-i="btnAdd">등록</span></button>
    <div class="msg" id="addMsg"></div>
  </div>

  <div class="card">
    <h2>📋 <span data-i="listTitle">등록된 직원</span></h2>
    <div id="list"><div class="empty" data-i="loading">불러오는 중...</div></div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const FB_DB = 'https://kimchi-mart-order-default-rtdb.firebaseio.com';
const cfg = { apiKey:"AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4", authDomain:"kimchi-mart-order.firebaseapp.com", databaseURL:FB_DB, projectId:"kimchi-mart-order" };
const app = getApps().length ? getApp() : initializeApp(cfg);
const auth = getAuth(app);

const BRANCHES = [
  { id:'HOLLYWOOD',      label:'HOLLYWOOD'      },
  { id:'MIAMI',          label:'MIAMI'          },
  { id:'LASOLAS',        label:'LASOLAS'        },
  { id:'CORAL_SPRINGS',  label:'CORAL SPRINGS'  },
  { id:'PEMBROKE_PINES', label:'PEMBROKE PINES' },
];

// ---- i18n ----
const I18N = {
  ko:{ busy:'처리 중…', title:'직원 전화번호 등록', sub:'등록한 직원은 전화번호+문자코드만으로 바로 입장 (PIN·승인 불필요)',
    warn:'💡 매니저+ 전용. 직원 <b>이름·전화번호·지점·직책</b>을 등록하면, 그 직원은 로그인에서 <b>전화번호 → 문자코드 → 바로 입장</b>합니다 (매장 PIN·매니저 승인 생략). 미국 번호는 10자리만 넣어도 됩니다 (예: 954-123-4567).',
    addTitle:'직원 추가', lName:'이름', lPhone:'전화번호', lBranch:'지점', lRole:'직책', phName:'직원 이름', branchDef:'📍 지점 선택', btnAdd:'등록',
    listTitle:'등록된 직원', loading:'불러오는 중...', empty:'아직 등록된 직원이 없습니다.<br>위에서 추가하세요 ↑',
    rStaff:'👤 일반 직원', rSup:'🎖️ 슈퍼바이저', rAsst:'🥈 부매니저', rMgr:'⭐ 매니저', del:'🗑 삭제',
    errName:'⚠️ 이름을 입력하세요.', errPhone:'⚠️ 전화번호를 정확히 입력하세요 (예: 954-123-4567).', errBranch:'⚠️ 지점을 선택하세요.',
    okAdd:(n,p)=>'✅ '+n+' 등록됨 ('+p+')', failAdd:(c,t)=>'❌ 등록 실패: '+c+' '+t, readFail:(c,t)=>'읽기 실패: '+c+' — Firebase RTDB 규칙(phoneRoster) 게시 필요',
    delConfirm:(n)=>(n||'이 직원')+' 등록을 삭제할까요?\n(삭제해도 이미 만든 계정은 남습니다 — 새 로그인만 차단)', readErr:'오류: ' },
  en:{ busy:'Processing…', title:'Staff Phone Registration', sub:'Registered staff sign in with phone + SMS code only (no PIN / approval)',
    warn:'💡 Manager+ only. Register a staff member\'s <b>name · phone · branch · role</b>, and they sign in with <b>phone → SMS code → instant entry</b> (no store PIN / manager approval). US numbers can be 10 digits (e.g. 954-123-4567).',
    addTitle:'Add Staff', lName:'Name', lPhone:'Phone', lBranch:'Branch', lRole:'Role', phName:'Staff name', branchDef:'📍 Select branch', btnAdd:'Register',
    listTitle:'Registered Staff', loading:'Loading...', empty:'No staff registered yet.<br>Add one above ↑',
    rStaff:'👤 Staff', rSup:'🎖️ Supervisor', rAsst:'🥈 Assistant Manager', rMgr:'⭐ Manager', del:'🗑 Delete',
    errName:'⚠️ Enter a name.', errPhone:'⚠️ Enter a valid phone (e.g. 954-123-4567).', errBranch:'⚠️ Select a branch.',
    okAdd:(n,p)=>'✅ '+n+' registered ('+p+')', failAdd:(c,t)=>'❌ Failed: '+c+' '+t, readFail:(c,t)=>'Read failed: '+c+' — publish Firebase RTDB rules (phoneRoster)',
    delConfirm:(n)=>'Delete '+(n||'this staff')+'?\n(Existing account stays — only new logins are blocked)', readErr:'Error: ' },
  es:{ busy:'Procesando…', title:'Registro de Teléfono de Personal', sub:'El personal registrado inicia solo con teléfono + código SMS (sin PIN / aprobación)',
    warn:'💡 Solo Gerente+. Registra <b>nombre · teléfono · sucursal · rol</b> del empleado, y entrará con <b>teléfono → código SMS → entrada directa</b> (sin PIN ni aprobación). Números de EE.UU. pueden ser 10 dígitos (ej. 954-123-4567).',
    addTitle:'Agregar Personal', lName:'Nombre', lPhone:'Teléfono', lBranch:'Sucursal', lRole:'Rol', phName:'Nombre del empleado', branchDef:'📍 Selecciona sucursal', btnAdd:'Registrar',
    listTitle:'Personal Registrado', loading:'Cargando...', empty:'Aún no hay personal registrado.<br>Agrega uno arriba ↑',
    rStaff:'👤 Personal', rSup:'🎖️ Supervisor', rAsst:'🥈 Subgerente', rMgr:'⭐ Gerente', del:'🗑 Eliminar',
    errName:'⚠️ Ingresa un nombre.', errPhone:'⚠️ Ingresa un teléfono válido (ej. 954-123-4567).', errBranch:'⚠️ Selecciona una sucursal.',
    okAdd:(n,p)=>'✅ '+n+' registrado ('+p+')', failAdd:(c,t)=>'❌ Falló: '+c+' '+t, readFail:(c,t)=>'Error de lectura: '+c+' — publica las reglas RTDB (phoneRoster)',
    delConfirm:(n)=>'¿Eliminar '+(n||'este empleado')+'?\n(La cuenta existente permanece — solo se bloquean nuevos inicios)', readErr:'Error: ' },
};
let LANG = (function(){ try { return localStorage.getItem('kimchi_lang') || 'ko'; } catch(_){ return 'ko'; } })();
if (!I18N[LANG]) LANG = 'ko';
const T = () => I18N[LANG];
const roleLabel = (role) => ({ '':T().rStaff, SUPERVISOR:T().rSup, ASSISTANT_MANAGER:T().rAsst, MANAGER:T().rMgr })[role||''] || (role||T().rStaff);

function fillSelects(){
  const bsel = document.getElementById('inBranch');
  const bv = bsel.value;
  bsel.innerHTML = '<option value="">'+T().branchDef+'</option>' + BRANCHES.map(b=>`<option value="${b.id}">${b.label}</option>`).join('');
  bsel.value = bv;
  const rsel = document.getElementById('inRole');
  const rv = rsel.value;
  rsel.innerHTML = `<option value="">${T().rStaff}</option><option value="SUPERVISOR">${T().rSup}</option><option value="ASSISTANT_MANAGER">${T().rAsst}</option><option value="MANAGER">${T().rMgr}</option>`;
  rsel.value = rv;
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(el => { const k=el.getAttribute('data-i'); if(I18N[LANG][k]!=null) el.innerHTML = I18N[LANG][k]; });
  document.querySelectorAll('[data-ih]').forEach(el => { const k=el.getAttribute('data-ih'); if(I18N[LANG][k]!=null) el.innerHTML = I18N[LANG][k]; });
  document.querySelectorAll('[data-iph]').forEach(el => { const k=el.getAttribute('data-iph'); if(I18N[LANG][k]!=null) el.setAttribute('placeholder', I18N[LANG][k]); });
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.getAttribute('data-l')===LANG));
  fillSelects();
}
window.setLang = function(l){ if(!I18N[l]) return; LANG=l; try{ localStorage.setItem('kimchi_lang', l); }catch(_){ } applyLang(); loadRoster(); };

const busy = (on) => document.getElementById('busy').style.display = on ? 'block' : 'none';
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toE164(raw){ let d=String(raw||'').replace(/[^\d+]/g,''); if(d.startsWith('+'))return d; d=d.replace(/\D/g,''); if(d.length===10)return '+1'+d; if(d.length===11&&d[0]==='1')return '+'+d; if(d.length>=11)return '+'+d; return ''; }
const digitsKey = (e164) => String(e164||'').replace(/\D/g,'');
const fmtUS = (e164) => { const d=digitsKey(e164); if(d.length===11&&d[0]==='1'){const n=d.slice(1);return `+1 ${n.slice(0,3)}-${n.slice(3,6)}-${n.slice(6)}`;} return e164; };
async function authQ(){ try { const u=auth.currentUser; if(u){ const t=await u.getIdToken(); return '?auth='+encodeURIComponent(t);} } catch(_){} return ''; }

window.addStaff = async function(){
  const name=(document.getElementById('inName').value||'').trim();
  const phoneRaw=(document.getElementById('inPhone').value||'').trim();
  const branch=document.getElementById('inBranch').value;
  const role=document.getElementById('inRole').value||'';
  const msg=document.getElementById('addMsg'); msg.className='msg';
  if(!name){ msg.textContent=T().errName; msg.className='msg err'; return; }
  const e164=toE164(phoneRaw);
  if(!e164||digitsKey(e164).length<11){ msg.textContent=T().errPhone; msg.className='msg err'; return; }
  if(!branch){ msg.textContent=T().errBranch; msg.className='msg err'; return; }
  const key=digitsKey(e164);
  busy(true); document.getElementById('addBtn').disabled=true;
  try {
    const q=await authQ();
    const r=await fetch(`${FB_DB}/phoneRoster/${key}.json${q}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, branch, role, e164, addedAt: Date.now() }) });
    if(!r.ok){ const t=await r.text().catch(()=>''); msg.textContent=T().failAdd(r.status, t.slice(0,80)); msg.className='msg err'; return; }
    msg.textContent=T().okAdd(name, fmtUS(e164)); msg.className='msg ok';
    document.getElementById('inName').value=''; document.getElementById('inPhone').value='';
    loadRoster();
  } catch(e){ msg.textContent='❌ '+e.message; msg.className='msg err'; }
  finally { busy(false); document.getElementById('addBtn').disabled=false; }
};
window.delStaff = async function(key, name){
  if(!confirm(T().delConfirm(name))) return;
  busy(true);
  try { const q=await authQ(); const r=await fetch(`${FB_DB}/phoneRoster/${key}.json${q}`, { method:'DELETE' }); if(!r.ok){ alert('실패: '+r.status); return; } loadRoster(); }
  catch(e){ alert(T().readErr+e.message); } finally { busy(false); }
};
window.loadRoster = async function(){
  busy(true); const list=document.getElementById('list');
  try {
    const q=await authQ();
    const r=await fetch(`${FB_DB}/phoneRoster.json${q}`, { cache:'no-store' });
    if(!r.ok){ const t=await r.text().catch(()=>''); list.innerHTML='<div class="empty" style="color:#dc2626">'+esc(T().readFail(r.status, t.slice(0,60)))+'</div>'; return; }
    const data=await r.json()||{}; const entries=Object.entries(data);
    if(!entries.length){ list.innerHTML='<div class="empty">'+T().empty+'</div>'; return; }
    const byBranch={}; entries.forEach(([k,v])=>{ const b=v.branch||'(?)'; (byBranch[b]=byBranch[b]||[]).push([k,v]); });
    let html='';
    BRANCHES.forEach(b => { const rows=byBranch[b.id]; if(!rows||!rows.length) return;
      rows.sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
      html += `<div class="branch-group"><div class="bh">📍 ${b.label} (${rows.length})</div>`;
      rows.forEach(([k,v]) => { const rl=roleLabel(v.role||'');
        html += `<div class="row"><div><div class="nm">${esc(v.name)} <span style="font-size:.72em;font-weight:700;color:#0277BD;background:#e1f5fe;padding:1px 7px;border-radius:9px;margin-left:4px">${esc(rl)}</span></div><div class="meta"><span class="ph">${esc(fmtUS(v.e164||k))}</span></div></div><button class="del" onclick="delStaff('${k}','${esc(v.name)}')">${T().del}</button></div>`; });
      html += `</div>`;
    });
    list.innerHTML = html || '<div class="empty">'+T().empty+'</div>';
  } catch(e){ list.innerHTML='<div class="empty" style="color:#dc2626">'+esc(T().readErr+e.message)+'</div>'; }
  finally { busy(false); }
};

applyLang();
window.addEventListener('fb-auth-ready', () => loadRoster(), { once:true });
setTimeout(() => { if (document.getElementById('list').querySelector('[data-i="loading"]')) loadRoster(); }, 3000);
</script>
</body>
</html>
