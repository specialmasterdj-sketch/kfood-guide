<!--
  📹 화상 회의 (2026-10-11)
  전무님: "각 지점 매니저나 슈퍼바이저들과 화상통화를 해 업무지시나 보고를 받고 싶은데"
          "일대일밖에 안 돼? 동시에 5지점이 같이해야 하는데?"

  ■ 왜 영상 자체는 남의 것을 쓰나
    회사 메일이 Google Workspace 위에 있다(MX 가 전부 aspmx.l.google.com).
    유료 Workspace 는 Meet 그룹 통화에 시간 제한이 없고 100명까지 들어온다 — 5지점은 넉넉하다.
    우리가 WebRTC 를 직접 만들면 3명째부터 중계 서버(SFU)와 TURN 이 필요해 돈과 손이 든다.
    얻을 게 없어 안 만든다.

  ■ 그런데 왜 이 화면이 필요한가 — Meet 가 못 하는 것을 한다
    · 누가 들어왔는지 **남는다** (5지점 중 어디가 빠졌는지 기록)
    · 회의 방이 지점별로 **고정**돼 매번 링크를 찾아 보내지 않아도 된다
    · 회의 중에도 업무지시 앱 안이라 바로 업무를 찍어 내려보낼 수 있다
    · 🔴 플로리다는 녹음·녹화에 **양쪽 동의**가 필요한 주다 — 참가 직전에 고지하고 동의를 받는다

  ■ 저장 (전부 inventory 아래 — 승인된 직원이면 읽고 써서 규칙을 새로 게시할 필요가 없다)
    inventory/meet/rooms/{방}            { url, by, ts }        회의 링크 (임원만 고침)
    inventory/meet/live/{방}/{이름키}     { name, branch, ts }   지금 들어와 있는 사람 (2분 넘으면 나간 것)
    inventory/meet/log/{방}/{날짜}/{이름키} { name, branch, role, inAt, outAt }  참석 기록

  ■ 알림에 대해
    완전 종료 푸시(FCM)는 사장님이 **일부러 꺼 두신 것**이다 (PUSH-SETUP.md, 2026-08-30:
    "앱을 완전히 꺼 두었다면 쉬고 싶다는 뜻이니 방해하고 싶지 않아").
    그래서 여기서도 푸시를 쓰지 않는다. 대신 [회의 소집] 은 **매니저 채팅방에 글을 올린다** —
    앱이 열려 있거나 백그라운드인 사람에게는 기존 채팅 알림이 그대로 뜬다.

  ■ 나중에 앱 안에 영상까지 넣고 싶어지면
    km-meet-config.js 의 window.KM_MEET.dailyDomain 을 채우면 iframe 으로 이 화면 안에서 열린다.
    비어 있는 동안은 완전 무동작 — Meet 링크를 새 창으로 여는 지금 방식 그대로다.
-->

.hsub{font-size:.78em;opacity:.92;margin-top:6px}
main{max-width:780px;margin:0 auto;padding:12px 12px 90px}

.room.all{border-color:var(--brand);background:var(--brand-soft)}
.room .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.room .nm{font-weight:800;flex:1 1 140px}
.room .sub{font-size:.8em;color:var(--muted);margin-top:3px}

.badge.live{background:var(--live-bg);color:var(--live)}
.who{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.who span{font-size:.75em;font-weight:700;padding:3px 9px;border-radius:11px;background:var(--live-bg);color:var(--live)}
.who span.off{background:var(--sunk);color:var(--muted)}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}

.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.g{background:var(--live);border-color:var(--live);color:#fff}

.note{background:var(--warn-bg);border:1.5px solid var(--warn);border-radius:12px;padding:11px 13px;font-size:.84em;color:var(--warn);margin-bottom:12px;line-height:1.55}
.note b{display:block;margin-bottom:3px}
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8em;color:var(--muted);margin:-4px 0 12px;padding:0 2px}
.acct b{color:var(--fg)}
label{display:block;font-size:.8em;font-weight:800;color:var(--muted);margin:10px 0 4px}
input[type=url],input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--surface)}
h2{font-size:.86em;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:.86em}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:.84em;color:var(--muted);font-weight:700}
.empty{color:var(--muted);font-size:.88em;padding:14px 2px}

.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}

.min .body{white-space:pre-wrap;font-size:.9em;line-height:1.5;background:var(--sunk);border-radius:10px;padding:9px 10px}
</style>
</head>

const t = (k,n)=>{ const a=T[k]; let s=a?(a[L3.indexOf(LANG)]||a[0]):k; if(n!=null) s=s.split('%n').join(n); return s; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bname = id => { const b = BRANCHES.find(x=>x.id===id); return b ? (LANG==='ko'?b.ko:b.en) : id; };

/* 내가 누구인가 — auth-gate.js 가 세워 준 값이 먼저다 */
function me(){ try { return window.__currentUser || JSON.parse(localStorage.getItem('chat.me')||'{}'); } catch(e){ return {}; } }
const ROLE   = () => String(me().role || '').toUpperCase();
/* ⚠️ isOwner() 류가 EXECUTIVE 를 빠뜨린 적이 여러 번 있었다 — 두 토큰을 다 본다
   ([[project_exec_permission_pattern]], [[project_exec_branch_browse]]) */
const isExec = () => ['OWNER','EXECUTIVE'].includes(ROLE());
const myBranch = () => {
  const m = me();
  if (BRANCHES.some(b=>b.id===m.branch)) return m.branch;
  try { const b = localStorage.getItem('km_branch'); if (BRANCHES.some(x=>x.id===b)) return b; } catch(e){}
  return 'HOLLYWOOD';
};
/* RTDB 열쇠로 쓸 수 있게 이름을 다듬는다 — 점·#·$·[·]·/ 는 열쇠에 못 쓴다
   (급여 명단에서 "B.H.K" 가 B_H_K 가 된 것과 같은 규칙) */
const nkey = s => String(s||'').trim().replace(/\s+/g,'_').replace(/[.#$\[\]\/]/g,'_').toUpperCase() || 'UNKNOWN';
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const hhmm = ts => { if(!ts) return '-'; const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };

/* 방 목록 — 전 지점 1개 + 지점마다 1개 */
function rooms(){
  const out = [{ id:'all', all:true, name:t('roomAll'), sub:t('roomAllS') }];
  for (const b of BRANCHES) out.push({ id:b.id, all:false, name:bname(b.id)+' '+t('roomOne'), sub:'' });
  return out;
}
/* 내가 들어갈 수 있는 방 — 임원은 전부, 나머지는 전 지점 회의 + 내 지점
   ([[project_branch_scoped_access]] 와 같은 규칙) */
const canSee = r => isExec() || r.all || r.id === myBranch();

let URLS = {}, LIVE = {}, LOG = {}, JOINED = null, beat = null;
let LINES = {}, CALLS = {}, MINS = {};   // 📞 바로 통화 · 📋 회의록 (아래)

/* 📧 브라우저에 구글 계정이 여러 개면 회의 링크가 '기본 계정' 으로 열린다.
   2026-10-12 전무님: 회사 계정(info@miamikimchi.com)으로 만든 방인데 앱에서 열면
   개인 Gmail 로 열려 [Ask to join] 이 떴다. 방 주인인데 문을 두드리는 꼴이다.
   → 이 기기에서 쓸 계정을 한 번 적어 두면 회의를 그 계정으로 연다 (authuser).
   기기마다 따로 둔다 — 매니저 폰에는 그 사람 계정이 없으니 건드리지 않는다. */
const ACCT_KEY = 'km.meet.gacct';
const getAcct = () => { try { return localStorage.getItem(ACCT_KEY) || ''; } catch(e){ return ''; } };
function withAcct(u){
  const a = getAcct();
  if (!a || !u || /[?&]authuser=/.test(u)) return u;
  return u + (u.indexOf('?') < 0 ? '?' : '&') + 'authuser=' + encodeURIComponent(a);
}
function askAcct(){
  const v = prompt(t('acctAsk'), getAcct());
  if (v === null) return;
  const a = String(v).trim();
  if (a && a.indexOf('@') < 1) { alert(t('acctBad')); return; }
  try { if (a) localStorage.setItem(ACCT_KEY, a); else localStorage.removeItem(ACCT_KEY); } catch(e){}
  render();
}

/* ── 읽기 ─────────────────────────────────────────────────────────── */
function watch(){
  const F = window.__fb; if (!F) return;
  F.onValue(F.ref(F.db, BASE+'/rooms'), s => { URLS = s.val() || {}; render(); });
  F.onValue(F.ref(F.db, BASE+'/live'),  s => { LIVE = s.val() || {}; render(); });
  F.onValue(F.ref(F.db, BASE+'/lines'), s => { LINES = s.val() || {}; render(); });
  F.onValue(F.ref(F.db, BASE+'/calls'), s => { CALLS = s.val() || {}; render(); });
  F.onValue(F.ref(F.db, BASE+'/minutes'), s => { MINS = s.val() || {}; render(); openHash(); });
  F.onValue(F.ref(F.db, BASE+'/log/'+'all'), ()=>{});   // (전체 로그는 아래에서 날짜별로 읽는다)
  for (const r of rooms()) {
    F.onValue(F.ref(F.db, BASE+'/log/'+r.id+'/'+today()), s => {
      LOG[r.id] = s.val() || {}; renderLog();
    });
  }
}
/* 2분 넘게 소식이 없으면 나간 것으로 본다 (브라우저를 그냥 닫는 사람이 많다) */
const FRESH = 120000;
function inRoom(roomId){
  const m = LIVE[roomId] || {};
  const now = Date.now();
  return Object.keys(m).map(k=>m[k]).filter(v => v && v.ts && now - v.ts < FRESH);
}

/* ── 그리기 ───────────────────────────────────────────────────────── */
function render(){
  document.documentElement.lang = LANG;
  document.getElementById('hTitle').textContent = t('title');
  document.getElementById('hSub').textContent  = t('sub');
  document.getElementById('legal').innerHTML = '<b>⚖️ '+esc(t('legalT'))+'</b>'+esc(t('legalB'));
  document.getElementById('hLog').textContent = t('logH');
  const ab = document.getElementById('acct');
  if (ab) ab.innerHTML = '<span>' + esc(t('acctL')) + ' · <b>' + esc(getAcct() || t('acctNo'))
        + '</b></span> <button class="btn sm" id="acctBtn">' + esc(t('acctSet')) + '</button>';
  document.getElementById('leaveBtn').textContent = t('leave');
  document.querySelectorAll('.hbtn[data-l]').forEach(b => b.classList.toggle('on', b.dataset.l===LANG));

  renderDial();
  renderMins();
  const list = rooms().filter(canSee);
  document.getElementById('rooms').innerHTML = list.map(r => {
    const url = (URLS[r.id] || {}).url || '';
    const who = inRoom(r.id);
    const live = who.length > 0;
    // 사람이 있을 때만 이름을 늘어놓는다 — 없을 땐 위 뱃지가 이미 '아무도 없음' 이라 두 번 쓰지 않는다
    // 내가 지금 이 방에 들어가 있나 — 새로고침해도 알 수 있게 live 기록으로 본다
    const iAmIn = who.some(v => nkey(v.name) === nkey(me().name));
    const whoHtml = who.length
      ? '<div class="who">' + who.map(v => '<span>'+esc(v.name)+'</span>').join('') + '</div>'
      : '';
    return '<div class="room '+(r.all?'all':'')+'">'
      + '<div class="top"><div class="nm">'+esc(r.name)+'</div>'
      + '<span class="badge '+(live?'live':'')+'">'+(live ? '● '+esc(t('live'))+' · '+esc(t('inRoom', who.length)) : esc(t('nobody')))+'</span></div>'
      + (r.sub ? '<div class="sub">'+esc(r.sub)+'</div>' : '')
      + (url ? '' : '<div class="sub">⚠ '+esc(t('noUrl'))+'</div>')
      + whoHtml
      + '<div class="acts">'
      +   (iAmIn
            ? '<button class="btn g" data-leave="'+esc(r.id)+'">'+esc(t('leaveR'))+'</button>'
            : '<button class="btn p" data-join="'+esc(r.id)+'"'+(url?'':' disabled')+'>'+esc(t('join'))+'</button>')
      +   (isExec() ? '<button class="btn sm" data-call="'+esc(r.id)+'"'+(url?'':' disabled')+'>'+esc(t('call'))+'</button>' : '')
      +   (isExec() ? '<button class="btn sm" data-url="'+esc(r.id)+'">'+esc(t('setUrl'))+'</button>' : '')
      + '</div></div>';
  }).join('');
  renderLog();
}

function renderLog(){
  const list = rooms().filter(canSee);
  let html = '';
  for (const r of list) {
    const m = LOG[r.id] || {};
    const rowsArr = Object.keys(m).map(k=>m[k]).filter(Boolean).sort((a,b)=>(a.inAt||0)-(b.inAt||0));
    // 창을 그냥 닫으면 나간 시각이 안 적힌다 — 그런 사람을 '참가 중' 으로 두면 영영 그대로다
    const liveNow = new Set(inRoom(r.id).map(v => nkey(v.name)));
    if (!rowsArr.length) continue;
    html += '<div style="font-weight:800;margin:10px 0 4px">'+esc(r.name)+'</div>'
      + '<table><tr><th>'+esc(t('cName'))+'</th><th>'+esc(t('cBranch'))+'</th><th>'+esc(t('cIn'))+'</th><th>'+esc(t('cOut'))+'</th></tr>'
      + rowsArr.map(v => '<tr><td>'+esc(v.name)+'</td><td>'+esc(bname(v.branch))+'</td><td>'+hhmm(v.inAt)+'</td><td>'
          + (v.outAt ? hhmm(v.outAt)
             : liveNow.has(nkey(v.name)) ? '<b style="color:var(--live)">'+esc(t('still'))+'</b>'
             : esc(t('gone'))) + '</td></tr>').join('')
      + '</table>';
  }
  document.getElementById('log').innerHTML = html || '<div class="empty">'+esc(t('logNone'))+'</div>';
}

let PENDING = null;
function askJoin(roomId){
  PENDING = roomId;
  document.getElementById('ovT').textContent = t('ovT');
  document.getElementById('ovP').textContent = t('ovP');
  document.getElementById('ovC').textContent = t('ovC');
  document.getElementById('ovGo').textContent = t('ovGo');
  document.getElementById('ovNo').textContent = t('ovNo');
  document.getElementById('ovChk').checked = false;
  document.getElementById('ov').classList.add('on');
}
async function doJoin(){
  const roomId = PENDING; if (!roomId) return;
  if (!document.getElementById('ovChk').checked) return;
  document.getElementById('ov').classList.remove('on');
  const F = window.__fb; const m = me();
  const k = nkey(m.name);
  const rec = { name: m.name || '', branch: m.branch || myBranch(), role: ROLE(), ts: Date.now() };
  JOINED = roomId;
  try {
    await F.set(F.ref(F.db, BASE+'/live/'+roomId+'/'+k), rec);
    // 들어온 시각은 처음 한 번만 적는다 (끊겼다 다시 들어와도 첫 시각을 지키려고)
    const g = await F.get(F.ref(F.db, BASE+'/log/'+roomId+'/'+today()+'/'+k));
    if (!g.exists()) {
      await F.set(F.ref(F.db, BASE+'/log/'+roomId+'/'+today()+'/'+k),
        { name: rec.name, branch: rec.branch, role: rec.role, inAt: Date.now(), outAt: 0 });
    } else {
      await F.update(F.ref(F.db, BASE+'/log/'+roomId+'/'+today()+'/'+k), { outAt: 0 });
    }
  } catch(e){ console.warn('[meet] 기록 실패', e); }

  if (beat) clearInterval(beat);
  beat = setInterval(() => {
    try { F.update(F.ref(F.db, BASE+'/live/'+JOINED+'/'+k), { ts: Date.now() }); } catch(e){}
  }, 45000);

  const url = (URLS[roomId]||{}).url || '';
  const dom = (window.KM_MEET && window.KM_MEET.dailyDomain) || '';
  if (dom) {
    // 앱 안에서 열기 — Daily 를 붙였을 때만 (Google Meet 은 iframe 을 막는다)
    document.getElementById('stageIn').innerHTML =
      '<iframe allow="camera;microphone;fullscreen;display-capture;autoplay" src="'
      + esc('https://'+dom+'.daily.co/'+encodeURIComponent(roomId)) + '"></iframe>';
    document.getElementById('stage').classList.add('on');
    window.scrollTo({ top:0, behavior:'smooth' });
  } else if (url) {
    document.getElementById('stage').classList.add('on');
    document.getElementById('stageIn').innerHTML =
      '<div class="card" style="margin:0"><div style="font-weight:800;margin-bottom:6px">📹 '
      + esc(rooms().find(r=>r.id===roomId).name) + '</div><div class="sub">'
      + esc(url) + '</div></div>';
    window.open(withAcct(url), '_blank', 'noopener');
  }
  render();
}
async function doLeave(){
  const F = window.__fb; const k = nkey(me().name);
  if (beat) { clearInterval(beat); beat = null; }
  if (JOINED) {
    try {
      await F.remove(F.ref(F.db, BASE+'/live/'+JOINED+'/'+k));
      await F.update(F.ref(F.db, BASE+'/log/'+JOINED+'/'+today()+'/'+k), { outAt: Date.now() });
    } catch(e){}

  document.getElementById('stageIn').innerHTML = '';

/* ══ 📞 바로 화상 통화 (2026-10-30) ══════════════════════════════════
   사장님: "전 직원 중 누구누구를 클릭하면 바로 비디오 콜로 초대 — 상대 화면에 즉시 접속 대기 창이 뜨고,
            나는 바로 기다렸다 대화." / "수퍼바이저 이상은 지점 간이 아니라 다른 지점 수퍼바이저·매니저·
            실무 직원과 언제든 회의를 만들 수 있게."
   · 거는 사람: 수퍼바이저 이상 (OWNER·EXECUTIVE·MANAGER·ASSISTANT_MANAGER·SUPERVISOR)
   · 받는 사람: 승인된 전 직원(users 명단). 받는 쪽 창은 fb-auth-fetch.js 가 앱 어느 화면에서든 띄운다.
   · 회의방: Google Meet 는 앱이 방을 새로 만들 수 없다 → 미리 만든 링크(⚙ 통화 회선)를 돌려 쓰고,
             모자라면 비어 있는 지점 회의방을 빌린다. 비어 있음 = 아무도 없고 진행 중 통화도 없음.
   저장 (inventory 아래 — 승인 직원 읽기·쓰기):
     meet/lines/{L1..}              { url, by, ts }
     meet/calls/{통화id}             { by, byUid, byBranch, room, roomName, url, ts, ended, inv/{uid}={name,branch,state,at} }
     meet/ring/{받는uid}/{통화id}     { from, fromBranch, url, room, ts, state: ringing|accepted|declined|ended } */
const canDial = () => /OWNER|EXECUTIVE|MANAGER|SUPERVISOR/.test(ROLE());
const CALL_TTL = 60*60*1000;   // [통화 끝] 을 안 눌러도 1시간 지나면 끝난 것으로 본다
const RING_TTL = 3*60*1000;    // 3분 안에 안 받으면 '응답 없음'
const callActive = c => !!c && !c.ended && Date.now() - (c.ts||0) < CALL_TTL;
const myUid = () => me().uid || '';
function roomBusy(id){
  if (inRoom(id).length) return true;
  return Object.keys(CALLS).some(k => callActive(CALLS[k]) && CALLS[k].room === id);
}
function pickLine(){
  const pool = [];
  Object.keys(LINES).sort().forEach((k, i) => {
    const u = (LINES[k]||{}).url;
    if (u) pool.push({ id:'line_'+k, url:u, name:t('dialT')+' #'+(i+1) });
  });
  // 빌려 쓰는 지점 회의방 — 지점 방 먼저(뒤에서부터), 전 지점 회의방은 맨 나중
  const rs = rooms();
  rs.slice(1).reverse().concat(rs.slice(0,1)).forEach(r => {
    const u = (URLS[r.id]||{}).url;
    if (u) pool.push({ id:r.id, url:u, name:r.name });
  });
  return pool.find(p => !roomBusy(p.id)) || null;
}

/* 직원 명단 — users(승인된 계정). 같은 사람이 기기·계정을 여러 개 쓰면 한 줄로 묶고 전부 부른다 */
let ROSTER = null, ROSTER_ERR = false, PK_SEL = new Map(), PK_BR = '', PK_ADD = null, GROUPS = {};
const GENERIC = ['staff','manager','employee','admin','user','직원','매니저','스태프','사원','관리자'];
async function loadRoster(){
  ROSTER_ERR = false;
  try {
    const r = await fetch(FB+'/users.json', { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP '+r.status);
    const u = (await r.json()) || {};
    const meK = nkey(me().name), mine = myUid();
    const by = new Map();
    for (const uid of Object.keys(u)) {
      const v = u[uid];
      if (!v || v.status !== 'approved') continue;
      const nm = String(v.name||'').trim();
      if (!nm || GENERIC.includes(nm.toLowerCase())) continue;
      const k = nkey(nm);
      if (uid === mine || k === meK) continue;
      const e = by.get(k) || { key:k, name:nm, branch:'', role:'', uids:[] };
      e.uids.push(uid);
      if (!e.branch || e.branch === '*') e.branch = v.branch || e.branch;
      if (!e.role) e.role = v.role || '';
      by.set(k, e);
    }
    const order = id => { const i = BRANCHES.findIndex(b=>b.id===id); return i < 0 ? 9 : i; };
    ROSTER = [...by.values()].sort((a,b) => order(a.branch)-order(b.branch) || a.name.localeCompare(b.name));
  } catch(e){ console.warn('[meet] 명단 실패', e); ROSTER = null; ROSTER_ERR = true; }
}
const brLabel = id => id === '*' ? t('allBr') : bname(id || '');
function openPicker(addTo){
  if (!canDial()) { alert(t('dialOnly')); return; }
  PK_ADD = addTo || null; PK_SEL = new Map(); PK_BR = '';
  document.getElementById('pkQ').value = '';
  document.getElementById('pk').classList.add('on');
  drawPicker();
  if (!ROSTER) loadRoster().then(drawPicker);
  loadGroups().then(drawPicker);
}
/* ⭐ 저장한 멤버 (2026-10-30 사장님: "6명 7명 골라 한 방에서 전체 화상 회의") — 자주 부르는 묶음을 한 번에.
   저장: meet/groups/{내uid}/{g…} = { name, keys:[이름키], names:[이름], ts } — 나만 쓰는 목록 */
async function loadGroups(){
  const uid = myUid(); if (!uid) { GROUPS = {}; return; }
  try { const r = await fetch(FB+'/'+BASE+'/groups/'+encodeURIComponent(uid)+'.json', { cache:'no-store' });
        GROUPS = (r.ok && await r.json()) || {}; } catch(e){ GROUPS = {}; }
}
async function saveGroup(){
  const uid = myUid(); if (!uid || !PK_SEL.size) return;
  const nm = (prompt(t('grpAsk'), '') || '').trim(); if (!nm) return;
  const ps = [...PK_SEL.values()];
  const g = { name:nm.slice(0,40), keys:ps.map(p=>p.key), names:ps.map(p=>p.name), ts:Date.now() };
  const id = 'g' + g.ts;
  try { const F = window.__fb; await F.set(F.ref(F.db, BASE+'/groups/'+uid+'/'+id), g);
        GROUPS[id] = g; drawPicker(); alert(t('grpOk')); } catch(e){ alert('저장 실패 · could not save'); }
}
async function delGroup(id){
  const g = GROUPS[id]; if (!g) return;
  if (!confirm(t('grpDel').split('%s').join(g.name))) return;
  try { const F = window.__fb; await F.remove(F.ref(F.db, BASE+'/groups/'+myUid()+'/'+id)); delete GROUPS[id]; drawPicker(); } catch(e){}
}
function useGroup(id){
  const g = GROUPS[id]; if (!g || !ROSTER) return;
  let miss = 0;
  (g.keys||[]).forEach(k => { const p = ROSTER.find(x => x.key === k); if (p) PK_SEL.set(k, p); else miss++; });
  drawPicker();
  if (miss) alert(t('grpMiss', miss));
}
function closePicker(){ document.getElementById('pk').classList.remove('on'); PK_ADD = null; }
function drawPicker(){
  document.getElementById('pkT').textContent = t('pkT');
  document.getElementById('pkQ').placeholder = t('pkQ');
  document.getElementById('pkNo').textContent = t('ovNo');
  document.getElementById('pkGo').textContent = t(PK_ADD ? 'pkAddGo' : 'pkGo', PK_SEL.size);
  document.getElementById('pkGo').disabled = PK_SEL.size === 0;
  document.getElementById('pkN').textContent = t('pkN', PK_SEL.size);
  // 선택한 사람 — 지점 칩으로 걸러도 누가 골라졌는지 늘 보이게
  document.getElementById('pkSH').textContent = t('pkSH');
  document.getElementById('pkSW').style.display = PK_SEL.size ? '' : 'none';
  document.getElementById('pkS').innerHTML = [...PK_SEL.values()].map(p =>
    '<button class="chip" data-pkrm="'+esc(p.key)+'">'+esc(p.name)+' ✕</button>').join('')
    + (PK_ADD ? '' : '<button class="chip grp" data-grpsave="1">'+esc(t('grpSave'))+'</button>');
  const gids = Object.keys(GROUPS).sort((a,b) => (GROUPS[a].name||'').localeCompare(GROUPS[b].name||''));
  document.getElementById('pkGH').textContent = t('pkGH');
  document.getElementById('pkGW').style.display = gids.length ? '' : 'none';
  document.getElementById('pkG').innerHTML = gids.map(id =>
    '<button class="chip grp" data-grp="'+esc(id)+'">⭐ '+esc(GROUPS[id].name)+' · '+((GROUPS[id].keys||[]).length)+'</button>'
    + '<button class="chip" data-grpdel="'+esc(id)+'" aria-label="delete" style="padding:5px 8px">🗑</button>').join('');
  const brs = [''].concat(BRANCHES.map(b=>b.id));
  document.getElementById('pkB').innerHTML = brs.map(id =>
    '<button class="chip'+(PK_BR===id?' on':'')+'" data-pkbr="'+esc(id)+'">'+esc(id ? bname(id) : t('pkAll'))+'</button>').join('');
  const L = document.getElementById('pkL');
  if (!ROSTER) { L.innerHTML = '<div class="empty" style="padding:14px">'+esc(ROSTER_ERR ? t('pkFail') : t('pkLoad'))+'</div>'; return; }
  const q = document.getElementById('pkQ').value.trim().toLowerCase();
  const list = ROSTER.filter(p => (!PK_BR || p.branch === PK_BR) && (!q || p.name.toLowerCase().includes(q)));
  if (!list.length) { L.innerHTML = '<div class="empty" style="padding:14px">'+esc(t('pkNone'))+'</div>'; return; }
  L.innerHTML = (PK_BR && !q ? '<div class="prow" data-pkallbr="1" style="font-weight:800;color:var(--brand)">☑ '+esc(t('pkSelB'))+'</div>' : '')
    + list.map(p => {
      const on = PK_SEL.has(p.key);
      return '<div class="prow'+(on?' sel':'')+'" data-pk="'+esc(p.key)+'"><input type="checkbox" tabindex="-1"'+(on?' checked':'')+'>'
        + '<span class="pn">'+esc(p.name)+'</span><span class="pb">'+esc(brLabel(p.branch))+(p.role?'<br>'+esc(String(p.role).replace(/_/g,' ')):'')+'</span></div>';
    }).join('');
}
function pkToggle(k){
  const p = (ROSTER||[]).find(x => x.key === k); if (!p) return;
  if (PK_SEL.has(k)) PK_SEL.delete(k); else PK_SEL.set(k, p);
  drawPicker();
}
function pkAllBranch(){
  const list = (ROSTER||[]).filter(p => p.branch === PK_BR);
  const all = list.every(p => PK_SEL.has(p.key));
  list.forEach(p => { if (all) PK_SEL.delete(p.key); else PK_SEL.set(p.key, p); });
  drawPicker();
}
/* 나도 그 방에 들어가 있음 — 다른 통화가 같은 방을 집어 가지 않게 (doJoin 과 같은 심장박동) */
function markMeIn(roomId){
  const F = window.__fb; const m = me(); const k = nkey(m.name);
  JOINED = roomId;
  try { F.set(F.ref(F.db, BASE+'/live/'+roomId+'/'+k), { name:m.name||'', branch:m.branch||myBranch(), role:ROLE(), ts:Date.now() }); } catch(e){}
  if (beat) clearInterval(beat);
  beat = setInterval(() => { try { F.update(F.ref(F.db, BASE+'/live/'+JOINED+'/'+k), { ts: Date.now() }); } catch(e){} }, 45000);
}
async function startCall(){
  const people = [...PK_SEL.values()];
  if (!people.length) return;
  const m = me(); const ts = Date.now();
  let id, line;
  const adding = PK_ADD && callActive(CALLS[PK_ADD]);
  if (adding) { id = PK_ADD; const c = CALLS[id]; line = { id:c.room, url:c.url, name:c.roomName }; }
  else {
    line = pickLine();
    if (!line) { alert(t('noLine')); return; }
    id = 'c' + ts + '_' + Math.random().toString(36).slice(2,6);
    // 새 창은 반드시 누른 그 순간에 연다 (기다렸다 열면 브라우저가 막는다) → 나는 먼저 들어가 기다린다
    window.open(withAcct(line.url), '_blank', 'noopener');
  }
  closePicker();
  const inv = {}, upd = {};
  for (const p of people) for (const uid of p.uids) {
    inv[uid] = { name:p.name, branch:p.branch||'', state:'ringing', at:ts };
    upd['ring/'+uid+'/'+id] = { from:m.name||'', fromBranch:bname(myBranch()), url:line.url, room:line.id, ts, state:'ringing' };
  }
  if (adding) Object.keys(inv).forEach(uid => { upd['calls/'+id+'/inv/'+uid] = inv[uid]; });
  else upd['calls/'+id] = { by:m.name||'', byUid:myUid(), byBranch:myBranch(), room:line.id, roomName:line.name, url:line.url, ts, ended:0, inv };
  try {
    const F = window.__fb;
    await F.update(F.ref(F.db, BASE), upd);
    if (!adding) markMeIn(line.id);
  } catch(e){ console.warn('[meet] 부르기 실패', e); alert(t('ringFail')); }
}
const iMade = c => c && ((c.byUid && c.byUid === myUid()) || nkey(c.by) === nkey(me().name));
async function ringAgain(id){
  const c = CALLS[id]; if (!callActive(c)) return;
  const now = Date.now(), upd = {};
  Object.keys(c.inv||{}).forEach(uid => {
    if ((c.inv[uid]||{}).state === 'accepted') return;
    upd['calls/'+id+'/inv/'+uid+'/state'] = 'ringing'; upd['calls/'+id+'/inv/'+uid+'/at'] = now;
    upd['ring/'+uid+'/'+id+'/state'] = 'ringing'; upd['ring/'+uid+'/'+id+'/ts'] = now;
  });
  try { const F = window.__fb; await F.update(F.ref(F.db, BASE), upd); } catch(e){ alert(t('ringFail')); }
}
/* ⏹ 회의 끝 = 회의록 (2026-10-30 사장님: "회의 끝나면 모든 내용을 정리해서 모두가 공유하고 볼 수 있도록")
   meet/minutes/{통화id} = { title, by, byUid, byBranch, ts, end, people/{uid}={name,branch,state},
                            members/{uid}=true, files/{…}, notes, ntBy, ntTs }
   members = 부른 사람 전부 + 연 사람 → 그 사람들 화면의 📋 회의록 에 보이고, 임원은 전부 본다.
   알림: ring/{uid}/m_{통화id} state 'minutes' → fb-auth-fetch.js 가 어느 화면에서든 [회의록 보기] 를 띄운다. */
function buildMinutes(id, c, end){
  const people = {}, members = {};
  Object.keys(c.inv||{}).forEach(uid => {
    const v = c.inv[uid] || {};
    people[uid] = { name:v.name||'', branch:v.branch||'', state: v.state === 'accepted' ? 'accepted' : (v.state === 'declined' ? 'declined' : 'missed') };
    members[uid] = true;
  });
  if (c.byUid) members[c.byUid] = true;
  const n = c.notes || {};
  return { title: t('minT').split('%s').join(c.by||''), by:c.by||'', byUid:c.byUid||'', byBranch:c.byBranch||'',
           ts:c.ts||end, end, room:c.roomName||'', people, members, files:c.files||null,
           notes:n.text||'', ntBy:n.by||'', ntTs:n.ts||0 };
}
async function endCall(id, auto){
  const c = CALLS[id]; if (!c || c.ended) return;
  if (!auto && !confirm(t('endAsk'))) return;
  const end = auto ? Math.min(Date.now(), (c.ts||0) + CALL_TTL) : Date.now();
  const upd = { ['calls/'+id+'/ended']: end, ['minutes/'+id]: buildMinutes(id, c, end) };
  const notify = Object.keys(c.inv||{});
  Object.keys(c.inv||{}).forEach(uid => { if ((c.inv[uid]||{}).state === 'ringing') upd['ring/'+uid+'/'+id+'/state'] = 'ended'; });
  notify.forEach(uid => { upd['ring/'+uid+'/m_'+id] = { from:c.by||'', fromBranch:bname(c.byBranch||''), min:id, ts:Date.now(), state:'minutes' }; });
  try { const F = window.__fb; await F.update(F.ref(F.db, BASE), upd);
        if (!auto) { alert(t('endOk', new Set(notify.map(u => nkey((c.inv[u]||{}).name))).size)); location.hash = 'min-'+id; } }
  catch(e){ console.warn('[meet] 회의록 실패', e); if (!auto) alert('저장 실패 · could not save'); }
  if (!auto && JOINED === c.room) doLeave();
}

/* 📎 회의 자료 — Storage 'invoices/_MEETING/…' 에 올린다.
   왜 그 자리인가: Storage 규칙이 PDF·엑셀 같은 이미지 아닌 파일을 invoices/{x}/{파일} 에서만 받는다
   (로그인한 사람만, 25MB 미만). 규칙을 새로 배포하지 않고 오늘 바로 쓰려고 그 칸 안에 _MEETING 묶음을 둔다.
   목록: meet/calls/{통화id}/files/{f…} = { name, url, size, type, by, ts } — 회의록에도 그대로 옮겨 간다. */
const FILE_MAX = 25 * 1024 * 1024;
let UP_CALL = null, UP_BUSY = {};
const fsize = n => n > 1048576 ? (n/1048576).toFixed(1)+'MB' : Math.max(1, Math.round(n/1024))+'KB';
const ficon = f => /^image\//.test(f.type||'') ? '🖼' : /pdf/i.test(f.type||f.name||'') ? '📕' : /sheet|excel|\.xlsx?$|\.csv$/i.test((f.type||'')+(f.name||'')) ? '📗' : /presentation|powerpoint|\.pptx?$/i.test((f.type||'')+(f.name||'')) ? '📙' : /word|\.docx?$/i.test((f.type||'')+(f.name||'')) ? '📘' : '📄';
function filesHtml(files){
  const ks = Object.keys(files||{}).sort((a,b) => (files[a].ts||0) - (files[b].ts||0));
  return ks.map(k => { const f = files[k] || {};
    return '<a href="'+esc(f.url)+'" target="_blank" rel="noopener"><span>'+ficon(f)+'</span><span class="fn">'+esc(f.name)+'</span>'
      + '<span class="fb">'+esc(f.by||'')+(f.size ? ' · '+fsize(f.size) : '')+'</span></a>'; }).join('');
}
async function uploadFiles(id, list){
  const F = window.__fb; const m = me();
  if (!F || !F.st) { alert(t('fFail').split('%s').join('')); return; }
  for (const file of list) {
    if (file.size >= FILE_MAX) { alert(t('fBig').split('%s').join(file.name)); continue; }
    UP_BUSY[id] = (UP_BUSY[id]||0) + 1; renderDial();
    try {
      const ts = Date.now();
      const safe = String(file.name||'file').replace(/[^\w.\-가-힣]+/g, '_').slice(-80);
      const path = 'invoices/_MEETING/' + id + '_' + ts + '_' + safe;
      const snap = await F.uploadBytes(F.sRef(F.st, path), file, { contentType: file.type || 'application/octet-stream' });
      const url = await F.getDownloadURL(snap.ref);
      await F.set(F.ref(F.db, BASE+'/calls/'+id+'/files/f'+ts+Math.random().toString(36).slice(2,5)),
                  { name:file.name||safe, url, size:file.size||0, type:file.type||'', by:m.name||'', ts });
    } catch(e){ console.warn('[meet] 파일 실패', e); alert(t('fFail').split('%s').join(file.name)); }
    UP_BUSY[id]--; renderDial();
  }
}

/* 📝 회의 메모 — 참가자 모두 같은 칸. 적는 동안에는 화면을 다시 그리지 않는다(글자가 날아가지 않게) */
const NOTE_T = {};
function saveNote(id, text){
  clearTimeout(NOTE_T[id]);
  NOTE_T[id] = setTimeout(() => {
    try { const F = window.__fb; F.set(F.ref(F.db, BASE+'/calls/'+id+'/notes'), { text:String(text).slice(0,20000), by:me().name||'', ts:Date.now() }); } catch(e){}
  }, 900);
}
const typing = () => { const a = document.activeElement; return !!(a && a.classList && a.classList.contains('note-ta')); };

/* 📋 회의록 목록 */
const iMember = mn => isExec() || (mn.members && myUid() && mn.members[myUid()]) || (mn.byUid && mn.byUid === myUid()) || nkey(mn.by) === nkey(me().name);
const canEditMin = mn => isExec() || (mn.byUid && mn.byUid === myUid()) || nkey(mn.by) === nkey(me().name);
const ymdhm = ts => { const d = new Date(ts||0); return (d.getMonth()+1)+'/'+d.getDate()+' '+hhmm(ts); };
function renderMins(){
  const el = document.getElementById('mins'); if (!el) return;
  if (typing()) return;
  const ids = Object.keys(MINS).filter(k => MINS[k] && iMember(MINS[k])).sort((a,b) => (MINS[b].end||0) - (MINS[a].end||0)).slice(0, 30);
  const open = new Set([...el.querySelectorAll('details[open]')].map(d => d.dataset.min));
  let h = '<h3>'+esc(t('minH'))+'</h3>';
  if (!ids.length) h += '<div class="sub" style="font-size:.82em;color:var(--muted)">'+esc(t('minNone'))+'</div>';
  for (const id of ids) {
    const mn = MINS[id]; const ps = mn.people || {};
    const per = new Map();
    Object.keys(ps).forEach(u => { const v = ps[u]||{}; const k = nkey(v.name); const p = per.get(k);
      if (!p || (v.state === 'accepted' && p.state !== 'accepted')) per.set(k, v); });
    const yes = [mn.by].concat([...per.values()].filter(v => v.state === 'accepted').map(v => v.name)).filter(Boolean);
    const no  = [...per.values()].filter(v => v.state !== 'accepted').map(v => v.name);
    const mins = Math.max(1, Math.round(((mn.end||0) - (mn.ts||0)) / 60000));
    h += '<details class="min" data-min="'+esc(id)+'" id="min-'+esc(id)+'"'+(open.has(id)?' open':'')+'>'
      + '<summary>📋 '+esc(mn.title||'')+' <span class="md">· '+esc(ymdhm(mn.ts))+' · '+esc(t('minLen', mins))+' · '+yes.length+'명</span></summary>'
      + '<div class="sec">'+esc(t('minWho'))+'</div><div class="who">'+yes.map(n => '<span class="st ok">'+esc(n)+'</span>').join('')+'</div>'
      + (no.length ? '<div class="sec">'+esc(t('minAbs'))+'</div><div class="who">'+no.map(n => '<span class="st">'+esc(n)+'</span>').join('')+'</div>' : '')
      + (mn.files ? '<div class="sec">'+esc(t('fH'))+'</div><div class="files">'+filesHtml(mn.files)+'</div>' : '')
      + '<div class="sec">'+esc(t('minNotes'))+'</div>'
      + (canEditMin(mn)
          ? '<textarea class="note-ta" data-mnote="'+esc(id)+'" placeholder="'+esc(t('gem'))+'">'+esc(mn.notes||'')+'</textarea>'
            + '<div class="acts"><button class="btn sm p" data-minsave="'+esc(id)+'">'+esc(t('minEdit'))+'</button></div>'
          : '<div class="body">'+esc(mn.notes || t('minEmpty'))+'</div>')
      + (mn.ntBy ? '<div class="saved">'+esc(t('nSaved', ymdhm(mn.ntTs)).split('%s').join(mn.ntBy))+'</div>' : '')
      + '</details>';
  }
  el.className = 'mins';
  el.innerHTML = h;
}
async function saveMin(id){
  const ta = document.querySelector('textarea[data-mnote="'+id+'"]'); if (!ta) return;
  try { const F = window.__fb;
        await F.update(F.ref(F.db, BASE+'/minutes/'+id), { notes:String(ta.value).slice(0,40000), ntBy:me().name||'', ntTs:Date.now() });
        alert(t('minOk')); } catch(e){ alert('저장 실패 · could not save'); }
}
/* 알림 창의 [회의록 보기] 는 meet.html#min-{id} 로 온다 → 그 회의록을 펼쳐서 보여 준다 */
let HASH_DONE = '';
function openHash(){
  const m = /^#(min|call)-(.+)$/.exec(location.hash || ''); if (!m || HASH_DONE === location.hash) return;
  const el = document.getElementById(m[1]+'-'+m[2]); if (!el) return;
  HASH_DONE = location.hash;
  if (el.tagName === 'DETAILS') el.open = true;
  el.scrollIntoView({ behavior:'smooth', block:'start' });
}
window.addEventListener('hashchange', () => { HASH_DONE = ''; openHash(); });
function reopen(id){
  const c = CALLS[id]; if (!c) return;
  window.open(withAcct(c.url), '_blank', 'noopener');
  if (iMade(c)) markMeIn(c.room);
}
async function setLines(){
  if (!isExec()) { alert(t('onlyExec')); return; }
  const cur = Object.keys(LINES).sort().map(k => (LINES[k]||{}).url).filter(Boolean).join(' ');
  const v = prompt(t('askLines'), cur);
  if (v === null) return;
  const urls = String(v).split(/[\s,]+/).map(x=>x.trim()).filter(Boolean);
  if (urls.some(u => !/^https:\/\//i.test(u))) { alert(t('badUrl')); return; }
  const obj = {}; urls.forEach((u,i) => { obj['L'+(i+1)] = { url:u, by:me().name||'', ts:Date.now() }; });
  try {
    const F = window.__fb;
    if (urls.length) await F.set(F.ref(F.db, BASE+'/lines'), obj); else await F.remove(F.ref(F.db, BASE+'/lines'));
    alert(t('linesOk', urls.length));
  } catch(e){ alert('저장 실패 · could not save'); }
}
function renderDial(){
  const el = document.getElementById('dial'); if (!el) return;
  if (typing()) return;
  const now = Date.now();
  // [회의 끝] 을 안 누르고 1시간이 지난 내 회의 → 그때까지 내용으로 회의록을 남긴다
  Object.keys(CALLS).forEach(k => { const c = CALLS[k]; if (c && !c.ended && !callActive(c) && iMade(c)) endCall(k, true); });
  const inCall = c => !!(c && c.inv && myUid() && c.inv[myUid()]);
  const calls = Object.keys(CALLS).filter(k => callActive(CALLS[k]) && (isExec() || iMade(CALLS[k]) || inCall(CALLS[k])))
                 .sort((a,b) => (CALLS[b].ts||0) - (CALLS[a].ts||0));
  let h = '<div class="hd"><b>'+esc(t('dialT'))+'</b>'
    + (isExec() ? '<button class="btn sm" data-lines="1">'+esc(t('lines'))+' · '+Object.keys(LINES).length+'</button>' : '')
    + '</div><div class="sub" style="font-size:.8em;color:var(--muted);margin-top:3px">'+esc(canDial() ? t('dialS') : t('dialOnly'))+'</div>';
  if (canDial()) h += '<button class="btn g big" data-pick="1">'+esc(t('dialGo'))+'</button>';
  for (const id of calls) {
    const c = CALLS[id]; const mine = iMade(c);
    const inv = c.inv || {};
    // 같은 사람이 계정 여러 개면 한 번만 — 가장 앞선 상태(참가 > 부르는 중 > 거절 > 응답 없음)
    const per = new Map(); const rank = { accepted:3, ringing:2, declined:1, missed:0 };
    Object.keys(inv).forEach(uid => {
      const v = inv[uid] || {}; let st = v.state || 'ringing';
      if (st === 'ringing' && now - (v.at||0) > RING_TTL) st = 'missed';
      const k = nkey(v.name); const p = per.get(k);
      if (!p || rank[st] > rank[p.st]) per.set(k, { name:v.name, branch:v.branch, st });
    });
    const lab = { accepted:['ok',t('sOk')], ringing:['ring',t('sRing')], declined:['no',t('sNo')], missed:['',t('sMiss')] };
    h += '<div class="call" id="call-'+esc(id)+'"><div class="ct">'+esc(t('callBy').split('%s').join(c.by||''))+' · '+hhmm(c.ts)+'</div>'
      + '<div class="cs">'+esc(c.roomName||'')+'</div>'
      + '<div class="who">'+[...per.values()].map(p => '<span class="st '+lab[p.st][0]+'">'+esc(p.name)+' · '+esc(lab[p.st][1])+'</span>').join('')+'</div>'
      + '<div class="acts">'
      +   '<button class="btn sm p" data-creopen="'+esc(id)+'">'+esc(t('reopen'))+'</button>'
      +   (mine ? '<button class="btn sm" data-cring="'+esc(id)+'">'+esc(t('ringAgain'))+'</button>' : '')
      +   (mine && canDial() ? '<button class="btn sm" data-cadd="'+esc(id)+'">'+esc(t('addPpl'))+'</button>' : '')
      +   (mine || isExec() ? '<button class="btn sm" data-cend="'+esc(id)+'">'+esc(t('endCall'))+'</button>' : '')
      + '</div>'
      + '<div class="tip">'+esc(t('tile'))+(mine ? '<br>'+esc(t('gem')) : '')+'</div>'
      + '<div class="sec">'+esc(t('fH'))+'</div>'
      + '<div class="files">'+(filesHtml(c.files) || '<div class="sub" style="font-size:.78em;color:var(--muted)">'+esc(t('fNone'))+'</div>')+'</div>'
      + '<div class="acts"><button class="btn sm" data-cfile="'+esc(id)+'"'+(UP_BUSY[id] ? ' disabled' : '')+'>'
      +   esc(UP_BUSY[id] ? t('fBusy', UP_BUSY[id]) : t('fUp'))+'</button></div>'
      + '<div class="sec">'+esc(t('nH'))+'</div>'
      + '<textarea class="note-ta" data-cnote="'+esc(id)+'" placeholder="'+esc(t('nPh'))+'">'+esc((c.notes||{}).text||'')+'</textarea>'
      + ((c.notes||{}).by ? '<div class="saved">'+esc(t('nSaved', hhmm(c.notes.ts)).split('%s').join(c.notes.by))+'</div>' : '')
      + '</div>';
  }
  el.className = 'dial';
  el.innerHTML = h;
}

/* ── 이어 붙이기 ──────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.l)    { LANG = b.dataset.l;
                        try{ localStorage.setItem('km.lang', LANG); }catch(_){}
                        try{ window.dispatchEvent(new CustomEvent('km-lang-changed',{detail:LANG})); }catch(_){}
                        render(); return; }
  if (b.id === 'acctBtn'){ askAcct(); return; }
  if (b.dataset.join) { askJoin(b.dataset.join); return; }
  if (b.dataset.leave){ JOINED = b.dataset.leave; doLeave(); return; }
  if (b.dataset.url)  { setUrl(b.dataset.url);  return; }
  if (b.dataset.call) { callIn(b.dataset.call); return; }
  if (b.id === 'ovGo'){ doJoin(); return; }
  if (b.id === 'ovNo'){ document.getElementById('ov').classList.remove('on'); PENDING=null; return; }
  if (b.id === 'leaveBtn'){ doLeave(); return; }
  if (b.dataset.pick)   { openPicker(); return; }
  if (b.dataset.lines)  { setLines(); return; }
  if (b.dataset.pkbr != null) { PK_BR = b.dataset.pkbr; drawPicker(); return; }
  if (b.id === 'pkNo')  { closePicker(); return; }
  if (b.id === 'pkGo')  { startCall(); return; }
  if (b.dataset.pkrm)   { PK_SEL.delete(b.dataset.pkrm); drawPicker(); return; }
  if (b.dataset.grpsave){ saveGroup(); return; }
  if (b.dataset.grp)    { useGroup(b.dataset.grp); return; }
  if (b.dataset.grpdel) { delGroup(b.dataset.grpdel); return; }
  if (b.dataset.cfile)  { UP_CALL = b.dataset.cfile; const fi = document.getElementById('fileIn'); fi.value = ''; fi.click(); return; }
  if (b.dataset.minsave){ saveMin(b.dataset.minsave); return; }
  if (b.dataset.creopen){ reopen(b.dataset.creopen); return; }
  if (b.dataset.cring)  { ringAgain(b.dataset.cring); return; }
  if (b.dataset.cadd)   { openPicker(b.dataset.cadd); return; }
  if (b.dataset.cend)   { endCall(b.dataset.cend); return; }
});
// 사람 고르기 — 줄 어디를 눌러도 선택
document.addEventListener('click', e => {
  const row = e.target.closest('.prow'); if (!row) return;
  if (row.dataset.pkallbr) { pkAllBranch(); return; }
  if (row.dataset.pk) pkToggle(row.dataset.pk);
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'pkQ') drawPicker();
  if (e.target && e.target.dataset && e.target.dataset.cnote) saveNote(e.target.dataset.cnote, e.target.value);
});
// 메모 칸을 떠나면 그동안 미뤄 둔 화면 갱신을 한다
document.addEventListener('focusout', e => { if (e.target && e.target.classList && e.target.classList.contains('note-ta')) setTimeout(render, 50); });
document.getElementById('fileIn').addEventListener('change', e => {
  const fs = [...(e.target.files||[])]; if (UP_CALL && fs.length) uploadFiles(UP_CALL, fs);
});
window.addEventListener('km-lang-changed', e => {
  const l = e && e.detail; if (L3.includes(l) && l !== LANG) { LANG = l; render(); }
});
// 누가 들어오고 나가는지 시계도 같이 흘러야 하므로 30초마다 다시 그린다
setInterval(() => { if (document.visibilityState === 'visible') render(); }, 30000);

render();
if (window.__fb) watch(); else window.addEventListener('fb-ready', watch, { once:true });
</script>
</body></html>
