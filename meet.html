<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>화상 회의 — 김치마트</title>
<link rel="icon" href="./pwa-assets/icon-192.png" type="image/png">
<script type="module" src="./fb-auth-fetch.js?v=7"></script>
<script type="module" src="./auth-gate.js?v=10"></script>
<script src="./km-back-button.js?v=3"></script>
<!--
  📹 화상 회의 (2026-10-11)
  전무님: "각 지점 매니저나 슈퍼바이저들과 화상통화를 해 업무지시나 보고를 받고 싶은데"
          "일대일밖에 안 돼? 동시에 5지점이 같이해야 하는데?"

  ■ 왜 영상 자체는 남의 것을 쓰나
    회사 메일이 Google Workspace 위에 있다(MX 가 전부 aspmx.l.google.com).
    유료 Workspace 는 Meet 그룹 통화에 시간 제한이 없고 100명까지 들어온다 — 5지점은 넉넉하다.
    우리가 WebRTC 를 직접 만들면 3명째부터 중계 서버(SFU)와 TURN 이 필요해 돈과 손이 든다.
    얻을 게 없어 안 만든다.

  ■ 그런데 왜 이 화면이 필요한가 — Meet 가 못 하는 것을 한다
    · 누가 들어왔는지 **남는다** (5지점 중 어디가 빠졌는지 기록)
    · 회의 방이 지점별로 **고정**돼 매번 링크를 찾아 보내지 않아도 된다
    · 회의 중에도 업무지시 앱 안이라 바로 업무를 찍어 내려보낼 수 있다
    · 🔴 플로리다는 녹음·녹화에 **양쪽 동의**가 필요한 주다 — 참가 직전에 고지하고 동의를 받는다

  ■ 저장 (전부 inventory 아래 — 승인된 직원이면 읽고 써서 규칙을 새로 게시할 필요가 없다)
    inventory/meet/rooms/{방}            { url, by, ts }        회의 링크 (임원만 고침)
    inventory/meet/live/{방}/{이름키}     { name, branch, ts }   지금 들어와 있는 사람 (2분 넘으면 나간 것)
    inventory/meet/log/{방}/{날짜}/{이름키} { name, branch, role, inAt, outAt }  참석 기록

  ■ 알림에 대해
    완전 종료 푸시(FCM)는 사장님이 **일부러 꺼 두신 것**이다 (PUSH-SETUP.md, 2026-08-30:
    "앱을 완전히 꺼 두었다면 쉬고 싶다는 뜻이니 방해하고 싶지 않아").
    그래서 여기서도 푸시를 쓰지 않는다. 대신 [회의 소집] 은 **매니저 채팅방에 글을 올린다** —
    앱이 열려 있거나 백그라운드인 사람에게는 기존 채팅 알림이 그대로 뜬다.

  ■ 나중에 앱 안에 영상까지 넣고 싶어지면
    km-meet-config.js 의 window.KM_MEET.dailyDomain 을 채우면 iframe 으로 이 화면 안에서 열린다.
    비어 있는 동안은 완전 무동작 — Meet 링크를 새 창으로 여는 지금 방식 그대로다.
-->
<script src="./km-chat-queue.js?v=1"></script>
<script src="./km-meet-config.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --sunk:#eef1f4; --line:#dfe5ea; --fg:#18202a; --muted:#64748b;
  --brand:#1d4ed8; --brand-soft:#e6edfd; --live:#16a34a; --live-bg:#e3f6ea;
  --warn:#b45309; --warn-bg:#fdf3e2; --bad:#dc2626;
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#182029; --sunk:#212b36; --line:#333f4b; --fg:#e6ecf2; --muted:#94a3b8;
  --brand:#7aa2f7; --brand-soft:#17243d; --live:#5fbf86; --live-bg:#14301f;
  --warn:#e3ac52; --warn-bg:#352a13; --bad:#f08a75; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.45}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:20}
header .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:1.12em;margin:0;flex:1}
.hbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:18px;padding:6px 12px;font-weight:700;font-size:.86em}
.hbtn.on{background:#fff;color:#1d4ed8}
.hsub{font-size:.78em;opacity:.92;margin-top:6px}
main{max-width:780px;margin:0 auto;padding:12px 12px 90px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.room{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
.room.all{border-color:var(--brand);background:var(--brand-soft)}
.room .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.room .nm{font-weight:800;flex:1 1 140px}
.room .sub{font-size:.8em;color:var(--muted);margin-top:3px}
.badge{font-size:.72em;font-weight:800;padding:2px 9px;border-radius:11px;background:var(--sunk);color:var(--muted)}
.badge.live{background:var(--live-bg);color:var(--live)}
.who{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.who span{font-size:.75em;font-weight:700;padding:3px 9px;border-radius:11px;background:var(--live-bg);color:var(--live)}
.who span.off{background:var(--sunk);color:var(--muted)}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:800;font-size:.9em}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.g{background:var(--live);border-color:var(--live);color:#fff}
.btn.sm{padding:6px 11px;font-size:.8em;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{background:var(--warn-bg);border:1.5px solid var(--warn);border-radius:12px;padding:11px 13px;font-size:.84em;color:var(--warn);margin-bottom:12px;line-height:1.55}
.note b{display:block;margin-bottom:3px}
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8em;color:var(--muted);margin:-4px 0 12px;padding:0 2px}
.acct b{color:var(--fg)}
label{display:block;font-size:.8em;font-weight:800;color:var(--muted);margin:10px 0 4px}
input[type=url],input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--surface)}
h2{font-size:.86em;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:.86em}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:.84em;color:var(--muted);font-weight:700}
.empty{color:var(--muted);font-size:.88em;padding:14px 2px}
/* 동의 창 */
.ov{position:fixed;inset:0;background:rgba(10,15,22,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.ov.on{display:flex}
.ov .box{background:var(--surface);border-radius:16px;padding:18px;max-width:430px;width:100%}
.ov h3{margin:0 0 8px;font-size:1.04em}
.ov p{font-size:.88em;color:var(--muted);line-height:1.6;margin:0 0 12px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:.88em;font-weight:700;margin-bottom:14px}
.chk input{width:19px;height:19px;margin:1px 0 0;flex:0 0 auto}
/* 앱 안 영상 (Daily 를 쓸 때만) */
#stage{display:none;margin-bottom:12px}
#stage.on{display:block}
#stage iframe{width:100%;height:min(62vh,460px);border:0;border-radius:var(--r);background:#000}
/* 📞 바로 통화 (2026-10-30) */
.dial{background:var(--surface);border:2px solid var(--live);border-radius:var(--r);padding:14px;margin-bottom:12px}
.dial .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dial .hd b{flex:1 1 160px;font-size:1.02em}
.dial .big{width:100%;margin-top:10px;padding:14px;font-size:1.02em}
.call{border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.call .ct{font-weight:800;font-size:.9em}
.call .cs{font-size:.78em;color:var(--muted);margin-top:2px}
.st{font-size:.74em;font-weight:800;padding:3px 9px;border-radius:11px;background:var(--sunk);color:var(--muted)}
.st.ring{background:var(--warn-bg);color:var(--warn)}
.st.ok{background:var(--live-bg);color:var(--live)}
.st.no{background:#fde8e8;color:var(--bad)}
.pk .box{max-width:520px;max-height:min(88vh,760px);display:flex;flex-direction:column;padding:14px}
.pk input[type=search]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;background:var(--surface);margin:4px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;flex:0 0 auto}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 11px;font-size:.8em;font-weight:700;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.plist{flex:1 1 auto;overflow-y:auto;border:1.5px solid var(--line);border-radius:12px;min-height:160px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow input{width:20px;height:20px;flex:0 0 auto}
.prow .pn{font-weight:700;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pb{font-size:.74em;color:var(--muted);flex:0 0 auto;text-align:right}
.prow.sel{background:var(--brand-soft)}
.prow .mute{font-size:.72em;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 5px;white-space:nowrap}
.mutewarn{padding:9px 12px;background:var(--warn-bg);color:var(--warn);font-size:.84em;font-weight:700;border-bottom:1px solid var(--line)}
#pushBar:empty{display:none}
#pushBar{margin:0 0 10px;padding:11px 13px;background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px}
#pushBar .pbT{font-weight:800;color:var(--warn);font-size:.92em}
#pushBar .pbS{font-size:.82em;color:var(--muted);margin:4px 0 8px;line-height:1.45}
#pushBar .btn{width:100%}
.pfoot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pfoot .csave{border:2px solid #d4a017;background:#fff8e1;color:#7a4b00;font-weight:800}
.pfoot .cnt{flex:1 1 120px;font-size:.85em;font-weight:800}
.pk .lab{font-size:.74em;font-weight:800;color:var(--muted);margin:2px 0 4px}
.selbar{display:flex;gap:6px;flex-wrap:wrap;max-height:84px;overflow-y:auto;margin-bottom:8px;flex:0 0 auto}
.selbar .chip{background:var(--brand-soft);border-color:var(--brand)}
.chip.grp{border-color:var(--warn)}
/* 회의 자료·메모·회의록 (2026-10-30) */
.tip{font-size:.78em;background:var(--sunk);border-radius:10px;padding:8px 10px;margin-top:9px;line-height:1.45}
.sec{font-size:.78em;font-weight:800;color:var(--muted);margin:11px 0 5px}
.files{display:flex;flex-direction:column;gap:5px}
.files a{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;text-decoration:none;color:inherit;font-size:.86em;font-weight:700;background:var(--surface)}
.files a .fn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files a .fb{font-size:.82em;color:var(--muted);font-weight:600;flex:0 0 auto}
.note-ta{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:.9em;background:var(--surface);color:inherit;resize:vertical}
.saved{font-size:.72em;color:var(--muted);margin-top:3px}
.mins{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.mins h3{margin:0 0 6px;font-size:1em}
.min{border-top:1px solid var(--line);padding:9px 0}
.min:first-of-type{border-top:0}
.min summary{cursor:pointer;font-weight:800;font-size:.92em;list-style:none}
.min summary::-webkit-details-marker{display:none}
.min summary .md{font-weight:600;color:var(--muted);font-size:.85em}
.min .body{white-space:pre-wrap;font-size:.9em;line-height:1.5;background:var(--sunk);border-radius:10px;padding:9px 10px}
/* 🪟 참가 현황 창 (2026-10-30 사장님: "내가 초대한 사람 명단이 쭉 나오고, 조인했는지 실시간으로")
   meet.html?panel={통화id} — Meet 옆에 띄우는 작은 창. 그 회의 카드만 크게 보인다 */
body.panel header,body.panel #legal,body.panel #acct,body.panel #rooms,body.panel #hLog,body.panel #log,body.panel #mins,
body.panel .dial>.hd,body.panel .dial>.sub,body.panel .dial>.big,body.panel #km-side-nav,body.panel .km-side-btn{display:none!important}
body.panel main{padding:8px}
body.panel .dial{border-width:0;padding:6px 4px}
body.panel .call{border-top:0;margin-top:0;padding-top:0}
body.panel .who.big{display:grid;grid-template-columns:1fr;gap:6px}
body.panel .who.big .st{font-size:.95em;padding:9px 12px;border-radius:10px;display:flex;justify-content:space-between}
.pnlhd{display:none}
body.panel .pnlhd{display:block;font-weight:800;font-size:1.05em;margin:2px 0 8px}
.cnts{font-size:.8em;font-weight:800;margin:6px 0 4px;color:var(--muted)}
.inv{margin:9px 0 6px;padding:9px 10px;border:1.5px solid #86efac;background:#f0fdf4;border-radius:11px}
.invh{font-size:.8em;font-weight:800;color:#166534;margin-bottom:6px}
.invr{display:flex;gap:6px;flex-wrap:wrap}
.inv-ph{flex:1 1 160px;min-width:0;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:.95em;background:#fff;color:#111}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kind{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.kind b{display:block;font-size:.95em}
.kind small{display:block;font-size:.72em;color:var(--muted);margin-top:3px;line-height:1.35}
.kind.urgent{border-color:var(--bad);background:#fde8e8}
.kind.urgent b{color:var(--bad)}
.kind.top{grid-column:1/-1;border:2px solid #d4a017;background:linear-gradient(135deg,#fff8e1,#fdecc8);padding:14px 14px}
.kind.top b{font-size:1.12em;color:#7a4b00}
.kind.top small{color:#8a5a00;font-weight:700}
.call.urgent{border-left:4px solid var(--bad);padding-left:10px}
@media (max-width:420px){.kinds{grid-template-columns:1fr}}
/* 🗣 2026-11-06 — 영상이 앱 안에 있을 때는 통역 창을 **바닥 시트**로 띄운다.
   화면을 다 덮으면 영상이 안 보여 "한 화면에서 둘 다" 가 안 된다. */
/* 🗣 2026-11-06 전무님 "화상은 나오는데 통역 버튼이 안 뜬다" — 버튼이 영상 위에 있어 폰에서 화면 밖으로
   밀려났다. 회의 중에는 **화면에 떠 있는 버튼**으로 둔다. 스크롤과 상관없이 늘 보인다. */
#trFab{position:fixed;right:14px;bottom:16px;z-index:70;
  display:none;background:#7c3aed;color:#fff;border:0;border-radius:999px;padding:14px 20px;
  font:inherit;font-weight:800;font-size:1.02em;box-shadow:0 8px 22px rgba(124,58,237,.45);cursor:pointer}
@supports(padding:env(safe-area-inset-bottom)){#trFab{bottom:calc(16px + env(safe-area-inset-bottom))}}
#trFab.on{display:block}
.ov.sheet{align-items:flex-end;padding:0}
.ov.sheet .box{max-width:100%;border-radius:16px 16px 0 0;max-height:54vh}
.ov.sheet .trbox{max-height:54vh}
.trbox{max-width:560px!important;max-height:92vh;display:flex;flex-direction:column;gap:10px}
.trhd{display:flex;align-items:center;gap:8px}
.trhd h3{flex:1;margin:0!important}
.trlang{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85em;font-weight:700}
.trlang button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer;color:inherit}
.trlang button.on{background:#7c3aed;border-color:#7c3aed;color:#fff}
.trmic{border:0;border-radius:14px;padding:16px;font-size:1.1em;font-weight:900;cursor:pointer;background:#16a34a;color:#fff}
.trmic.on{background:#dc2626;animation:trPulse 1.4s infinite}
@keyframes trPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
.trint{font-size:.9em;color:var(--muted);min-height:1.3em;font-style:italic}
.trlist{flex:1;overflow:auto;min-height:140px;max-height:48vh;background:var(--sunk);border-radius:12px;padding:8px 10px}
.trl{padding:8px 0;border-bottom:1px solid var(--line)}
.trl:last-child{border-bottom:0}
.trl .n{font-size:.75em;font-weight:800;color:var(--muted)}
.trl .x{font-size:1.15em;font-weight:700;line-height:1.45;margin-top:2px}
.trl .o{font-size:.78em;color:var(--muted);margin-top:2px}
.trl.me .x{color:#7c3aed}
.trtip{font-size:.75em;color:var(--muted);line-height:1.5}
.lockr{font-size:.8em;font-weight:800;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:7px 10px;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="hTitle">📹 화상 회의</h1>
    <button class="hbtn" data-l="ko">KO</button>
    <button class="hbtn" data-l="en">EN</button>
    <button class="hbtn" data-l="es">ES</button>
  </div>
  <div class="hsub" id="hSub"></div>
</header>

<main>
  <div class="note" id="legal"></div>
  <div id="pushBar"></div>
  <div class="acct" id="acct"></div>
<button id="trFab"></button>
  <div id="stage"><div id="stageIn"></div>
    <div class="acts"><button class="btn" id="leaveBtn"></button></div></div>
  <h2 id="hRooms"></h2>
  <div id="rooms"></div>
  <div id="dial"></div>
  <div id="mins"></div>
  <input type="file" id="fileIn" multiple hidden>
  <h2 id="hLog"></h2>
  <div class="card" id="log"></div>
</main>

<div class="ov" id="ov"><div class="box">
  <h3 id="ovT"></h3>
  <p id="ovP"></p>
  <label class="chk"><input type="checkbox" id="ovChk"><span id="ovC"></span></label>
  <div class="acts">
    <button class="btn p" id="ovGo"></button>
    <button class="btn" id="ovNo"></button>
  </div>
</div></div>

<!-- 🗣 실시간 통역 (2026-10-31) -->
<div class="ov" id="tr"><div class="box trbox">

const t = (k,n)=>{ const a=T[k]; let s=a?(a[L3.indexOf(LANG)]||a[0]):k; if(n!=null) s=s.split('%n').join(n); return s; };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bname = id => { const b = BRANCHES.find(x=>x.id===id); return b ? (LANG==='ko'?b.ko:b.en) : id; };

/* 내가 누구인가 — auth-gate.js 가 세워 준 값이 먼저다 */
function me(){ try { return window.__currentUser || JSON.parse(localStorage.getItem('chat.me')||'{}'); } catch(e){ return {}; } }
const ROLE   = () => String(me().role || '').toUpperCase();
/* ⚠️ isOwner() 류가 EXECUTIVE 를 빠뜨린 적이 여러 번 있었다 — 두 토큰을 다 본다
   ([[project_exec_permission_pattern]], [[project_exec_branch_browse]]) */
const isExec = () => ['OWNER','EXECUTIVE'].includes(ROLE());
const myBranch = () => {
  const m = me();
  if (BRANCHES.some(b=>b.id===m.branch)) return m.branch;
  try { const b = localStorage.getItem('km_branch'); if (BRANCHES.some(x=>x.id===b)) return b; } catch(e){}
  return 'HOLLYWOOD';
};
/* RTDB 열쇠로 쓸 수 있게 이름을 다듬는다 — 점·#·$·[·]·/ 는 열쇠에 못 쓴다
   (급여 명단에서 "B.H.K" 가 B_H_K 가 된 것과 같은 규칙) */
const nkey = s => String(s||'').trim().replace(/\s+/g,'_').replace(/[.#$\[\]\/]/g,'_').toUpperCase() || 'UNKNOWN';
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const hhmm = ts => { if(!ts) return '-'; const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };

function rooms(){
  // 👑📅🚨 관리자 회의 3종도 고정 방 — [회의 시작] 으로 부르든, 여기서 [참가] 를 누르든 같은 방
  const out = [
    { id:'k_mgr',    key:'Council',     mgr:true, name:kindLab('mgr'),    sub:t('kMgrS') },
    { id:'k_bm',     key:'BranchMgrs',  mgr:true, name:kindLab('bm'),     sub:t('kBmS') },
    { id:'k_urgent', key:'Emergency',   mgr:true, name:kindLab('urgent'), sub:t('kUrgS') },
    { id:'all', key:'AllBranch', all:true, name:t('roomAll'), sub:t('roomAllS') }];
  for (const b of BRANCHES) out.push({ id:b.id, key:'Store-'+b.id, all:false, name:bname(b.id)+' '+t('roomOne'), sub:'' });
  return out;
}

   기기마다 따로 둔다 — 매니저 폰에는 그 사람 계정이 없으니 건드리지 않는다. */
const ACCT_KEY = 'km.meet.gacct';
const getAcct = () => { try { return localStorage.getItem(ACCT_KEY) || ''; } catch(e){ return ''; } };
function withAcct(u){
  const a = getAcct();
  if (!a || !u || /[?&]authuser=/.test(u)) return u;
  return u + (u.indexOf('?') < 0 ? '?' : '&') + 'authuser=' + encodeURIComponent(a);
}
/* 🎥 2026-11-03 사장님: "동시 로그인 문제, 방을 또 새로 만들고, 로그아웃·로그인 반복 — 40분간 시작을 못 하고
   Ana·Daniel Banos 는 결국 전화로" → 화상 방을 구글 Meet 에서 로그인 없는 Jitsi 서버(meet.ffmuc.net)로 바꾼다.
   · 회의 종류·지점마다 이름이 정해진 고정 방 하나 → 누가 몇 번 시작해도 같은 방 (새 방이 안 생긴다)
   · 앱에 로그인돼 있으면 내 이름을 미리 채워 [참가] 한 번에 바로 들어간다 — 구글 계정·[참여 요청]·호스트 수락 없음
   · 방 이름 끝 열쇠는 meet/jkey (앱 로그인한 사람만 읽음). 리포가 공개라 코드에 두지 않는다 */
const JHOST = 'meet.ffmuc.net';
let JKEY = '';
const isJ = u => !!u && u.indexOf('https://'+JHOST+'/') === 0;
const jRoom = name => JKEY ? 'https://'+JHOST+'/KimchiMart-'+name+'-'+JKEY : '';
function jName(u){
  if (!isJ(u) || u.indexOf('#') >= 0) return u;
  const n = String(me().name || '').trim();
  return u + '#config.prejoinConfig.enabled=false&config.disableDeepLinking=true'
    + (n ? '&userInfo.displayName=' + encodeURIComponent(JSON.stringify(n)) : '');
}
const openMeet = u => window.open(isJ(u) ? jName(u) : withAcct(u), '_blank', 'noopener');
/* 📹 2026-11-06 — Daily 방은 **이 화면 안에서** 연다(전무님: 폰에서 통역 창이 안 보인다).
   지금 쓰는 Jitsi 서버(meet.ffmuc.net)는 X-Frame-Options 로 끼워넣기를 막아 두어 새 창밖에 안 됐다.
   Daily 는 끼워넣기를 허용한다 — 영상과 통역이 한 화면에 선다. 목록에 없는 방은 예전대로 새 창. */
const DAILY = (window.KM_MEET || {});
const dailyUrl = id => { const n = (DAILY.dailyRooms || {})[id]; return (DAILY.dailyDomain && n) ? ('https://' + DAILY.dailyDomain + '.daily.co/' + n) : ''; };
let DCALL = null;
function dailyLib(){
  if (window.DailyIframe) return Promise.resolve();
  if (window.__dailyLib) return window.__dailyLib;
  window.__dailyLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@daily-co/daily-js@0.94.0/dist/daily-iframe.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  return window.__dailyLib;
}
async function openDaily(url, roomId){
  await dailyLib();
  const host = document.getElementById('dailyBox');
  if (!host) return;
  if (DCALL) { try { DCALL.destroy(); } catch(e){} DCALL = null; }
  DCALL = window.DailyIframe.createFrame(host, {
    showLeaveButton: true, showFullscreenButton: true,
    iframeStyle: { width:'100%', height:'min(62vh,460px)', border:'0', borderRadius:'12px', background:'#000' },
  });
  try { await DCALL.join({ url, userName: (me().name || "Kimchi Mart") }); }
  catch(e){
    const why = (e && (e.errorMsg || e.message)) || '';
    console.warn('[daily]', why || e);
    try { host.innerHTML = '<div class="sub" style="color:var(--warn)">⚠ ' + esc(t('dFail')) + (why ? ' (' + esc(why) + ')' : '') + '</div>'; } catch(_){}
    closeDaily();
    openMeet(roomUrl(roomId));   // 📹 회의가 아예 안 열리는 일은 없게 — 예전 길로 간다
    return;
  }
  // 통역 창이 먼저 열렸으면(들어갈 때 자동으로 연다) 영상이 생긴 지금 바닥 시트로 내린다
  try { const el = document.getElementById('tr'); if (el) el.classList.add('sheet'); } catch(e){}
}
function closeDaily(){ if (DCALL) { try { DCALL.destroy(); } catch(e){} DCALL = null; } }
const roomUrl = id => { const r = rooms().find(x => x.id === id); return r ? jRoom(r.key) : ''; };
function askAcct(){
  const v = prompt(t('acctAsk'), getAcct());
  if (v === null) return;
  const a = String(v).trim();
  if (a && a.indexOf('@') < 1) { alert(t('acctBad')); return; }
  try { if (a) localStorage.setItem(ACCT_KEY, a); else localStorage.removeItem(ACCT_KEY); } catch(e){}
  render();
}

/* ── 읽기 ─────────────────────────────────────────────────────────── */
function watch(){
  const F = window.__fb; if (!F) return;
  F.onValue(F.ref(F.db, BASE+'/jkey'), s => {
    JKEY = String(s.val() || '').replace(/[^a-z0-9]/gi, '');
    // 열쇠가 아직 없으면 임원 화면이 한 번 만든다 (그 뒤로는 모두 같은 열쇠 = 같은 방)
    if (!JKEY && isExec()) F.set(F.ref(F.db, BASE+'/jkey'), Math.random().toString(36).slice(2,8) + Math.random().toString(36).slice(2,6)).catch(()=>{});
    render();
  });
  F.onValue(F.ref(F.db, BASE+'/rooms'), s => { URLS = s.val() || {}; render(); });
  F.onValue(F.ref(F.db, BASE+'/live'),  s => { LIVE = s.val() || {}; render(); });
  F.onValue(F.ref(F.db, BASE+'/lines'), s => { LINES = s.val() || {}; render(); });
  F.onValue(F.ref(F.db, BASE+'/calls'), s => { CALLS = s.val() || {}; render(); });
  F.onValue(F.ref(F.db, BASE+'/minutes'), s => { MINS = s.val() || {}; render(); openHash(); });
  F.onValue(F.ref(F.db, BASE+'/log/'+'all'), ()=>{});   // (전체 로그는 아래에서 날짜별로 읽는다)
  for (const r of rooms()) {
    F.onValue(F.ref(F.db, BASE+'/log/'+r.id+'/'+today()), s => {
      LOG[r.id] = s.val() || {}; renderLog();
    });
  }
}
/* 2분 넘게 소식이 없으면 나간 것으로 본다 (브라우저를 그냥 닫는 사람이 많다) */
const FRESH = 120000;
function inRoom(roomId){
  const m = LIVE[roomId] || {};
  const now = Date.now();
  return Object.keys(m).map(k=>m[k]).filter(v => v && v.ts && now - v.ts < FRESH);
}

/* ── 그리기 ───────────────────────────────────────────────────────── */
function render(){
  document.documentElement.lang = LANG;
  document.getElementById('hTitle').textContent = t('title');
  // 🔎 2026-11-06 — 어느 버전이 돌고 있는지 눈으로 보려고 부제 끝에 찍는다.
  //    폰이 옛 파일을 쓰고 있는지 아닌지를 두고 몇 번을 헤맸다.
  document.getElementById('hSub').textContent  = t('sub') + '  ·  v' + KM_VER;
  document.getElementById('legal').innerHTML = '<b>⚖️ '+esc(t('legalT'))+'</b>'+esc(t('legalB'));
  drawPushBar();
  document.getElementById('hLog').textContent = t('logH');
  // 🎥 2026-11-03 구글 Meet 을 안 쓰므로 '회의를 열 구글 계정' 줄은 감춘다
  const ab = document.getElementById('acct');
  if (ab) ab.style.display = 'none';
  document.getElementById('hRooms').textContent = t('roomsH');
  document.getElementById('leaveBtn').textContent = t('leave');
  document.querySelectorAll('.hbtn[data-l]').forEach(b => b.classList.toggle('on', b.dataset.l===LANG));

  renderDial();
  renderMins();
  const list = rooms().filter(canSee);
  document.getElementById('rooms').innerHTML = list.map(r => {
    const url = roomUrl(r.id);
    const who = inRoom(r.id);
    const live = who.length > 0;
    // 사람이 있을 때만 이름을 늘어놓는다 — 없을 땐 위 뱃지가 이미 '아무도 없음' 이라 두 번 쓰지 않는다
    // 내가 지금 이 방에 들어가 있나 — 새로고침해도 알 수 있게 live 기록으로 본다
    const iAmIn = who.some(v => nkey(v.name) === nkey(me().name));
    const lockId = Object.keys(CALLS).find(k => callActive(CALLS[k]) && CALLS[k].room === r.id);
    const locked = !!lockId && !iMade(CALLS[lockId]) && !inCallOf(CALLS[lockId]);
    const whoHtml = who.length
      ? '<div class="who">' + who.map(v => '<span>'+esc(v.name)+'</span>').join('') + '</div>'
      : '';
    return '<div class="room '+(r.all?'all':'')+'">'
      + '<div class="top"><div class="nm">'+esc(r.name)+'</div>'
      + '<span class="badge '+(live?'live':'')+'">'+(live ? '● '+esc(t('live'))+' · '+esc(t('inRoom', who.length)) : esc(t('nobody')))+'</span></div>'
      + (r.sub ? '<div class="sub">'+esc(r.sub)+'</div>' : '')
      + (url ? '' : '<div class="sub">⚠ '+esc(t('noUrl'))+'</div>')
      + whoHtml
      + '<div class="acts">'
      +   (iAmIn
            ? '<button class="btn g" data-leave="'+esc(r.id)+'">'+esc(t('leaveR'))+'</button>'
            : '<button class="btn p" data-join="'+esc(r.id)+'"'+(url && !locked ?'':' disabled')+'>'+esc(t('join'))+'</button>')
      +   (isExec() && !r.mgr ? '<button class="btn sm" data-call="'+esc(r.id)+'"'+(url?'':' disabled')+'>'+esc(t('call'))+'</button>' : '')
      +   (url && canDial() ? '<button class="btn sm p" data-rcall="'+esc(r.id)+'">'+esc(t('rCall'))+'</button>' : '')
      +   (url ? '<button class="btn sm p" data-rtr="'+esc(r.id)+'" style="background:#7c3aed;border-color:#7c3aed">'+esc(t('trRoom'))+'</button>' : '')
      + '</div></div>';
  }).join('');
  // 잠긴 방 안내 — 카드 맨 아래
  rooms().filter(canSee).forEach(r => {
    const lockId = Object.keys(CALLS).find(k => callActive(CALLS[k]) && CALLS[k].room === r.id);
    if (lockId && !iMade(CALLS[lockId]) && !inCallOf(CALLS[lockId])) {
      const b = document.querySelector('#rooms [data-join="'+r.id+'"]');
      const card = b && b.closest('.room');
      if (card && !card.querySelector('.lockr')) card.insertAdjacentHTML('beforeend', '<div class="lockr">'+esc(t('locked'))+'</div>');
    }
  });
  renderLog();
}

function renderLog(){
  const list = rooms().filter(canSee);
  let html = '';
  for (const r of list) {
    const m = LOG[r.id] || {};
    const rowsArr = Object.keys(m).map(k=>m[k]).filter(Boolean).sort((a,b)=>(a.inAt||0)-(b.inAt||0));
    // 창을 그냥 닫으면 나간 시각이 안 적힌다 — 그런 사람을 '참가 중' 으로 두면 영영 그대로다
    const liveNow = new Set(inRoom(r.id).map(v => nkey(v.name)));
    if (!rowsArr.length) continue;
    html += '<div style="font-weight:800;margin:10px 0 4px">'+esc(r.name)+'</div>'
      + '<table><tr><th>'+esc(t('cName'))+'</th><th>'+esc(t('cBranch'))+'</th><th>'+esc(t('cIn'))+'</th><th>'+esc(t('cOut'))+'</th></tr>'
      + rowsArr.map(v => '<tr><td>'+esc(v.name)+'</td><td>'+esc(bname(v.branch))+'</td><td>'+hhmm(v.inAt)+'</td><td>'
          + (v.outAt ? hhmm(v.outAt)
             : liveNow.has(nkey(v.name)) ? '<b style="color:var(--live)">'+esc(t('still'))+'</b>'
             : esc(t('gone'))) + '</td></tr>').join('')
      + '</table>';
  }
  document.getElementById('log').innerHTML = html || '<div class="empty">'+esc(t('logNone'))+'</div>';
}

/* ── 들어가기 / 나가기 ─────────────────────────────────────────────── */
let PENDING = null;
function askJoin(roomId){
  { const lk = Object.keys(CALLS).find(k => callActive(CALLS[k]) && CALLS[k].room === roomId);
    if (lk && !iMade(CALLS[lk]) && !inCallOf(CALLS[lk])) { alert(t('locked')); return; } }
  // 🎥 2026-11-03 [참가] 한 번 = 바로 회의 화면 (동의 창 없음 — 위 '녹화 안내' 로 갈음)
  PENDING = roomId; doJoin();
}
async function doJoin(){
  const roomId = PENDING; if (!roomId) return;
  document.getElementById('ov').classList.remove('on');
  // 새 창은 누른 그 순간에 연다 — 기록(await)을 먼저 하면 폰 브라우저가 팝업을 막는다
  const url = roomUrl(roomId);
  if (!url) { alert(t('noLine')); return; }
  const dUrl = dailyUrl(roomId);
  if (!dUrl) openMeet(url);   // 📹 Daily 목록에 없는 방은 예전대로 새 창 (2026-11-06)
  /* 🗣 2026-11-06 — 들어갈 때 통역 창을 자동으로 열던 것을 뺀다(11/5 에 넣었다).
     창이 화면 아래를 덮어 떠 있는 통역 버튼을 가렸고, 전무님이 '버튼이 안 뜬다' 고 하셨다.
     이제 들어가면 보라색 버튼만 떠 있고, 누를 때 창이 열린다 — 한 가지만 보인다. */
  document.getElementById('stage').classList.add('on');
  document.getElementById('stageIn').innerHTML =
    '<div class="card" style="margin:0"><div style="font-weight:800;margin-bottom:6px">📹 '
    + esc((rooms().find(r=>r.id===roomId)||{}).name||'') + '</div><div class="sub">'
    + esc(t('jTip')) + '</div>'
    // 🗣 2026-11-05 전무님 "회의에 들어간 다음 통역 버튼 누르는 게 없나?" — 들어간 자리에 바로 둔다
    + '<button class="btn p" data-rtr="'+esc(roomId)+'" style="width:100%;margin-top:10px;background:#7c3aed;border-color:#7c3aed">'
    +   esc(t('trRoom')) + '</button>'
    + (dUrl ? '<div id="dailyBox" style="margin-top:10px"></div>' : '')
    + '</div>';
  if (dUrl) openDaily(dUrl, roomId);   // 📹 자리를 만든 뒤에 띄운다
  // 🗣 회의 중에는 통역 버튼을 화면에 띄워 둔다 (스크롤해도 안 사라지게)
  const _fab = document.getElementById('trFab');
  if (_fab) { _fab.textContent = t('trRoom'); _fab.dataset.rtr = roomId; _fab.classList.add('on'); }
  /* 📹 2026-11-06 — 들어가면 영상 자리로 올려 준다.
     영상은 화면 맨 위에 뜨는데 방 목록은 아래라, 방 카드에서 [참가] 를 누르면
     영상이 화면 밖에 생겨 '영상이 안 들어온다' 로 보였다(전무님). 떠 있는 버튼만 보였다. */
  try { setTimeout(() => { const st = document.getElementById('stage');
    if (st && st.scrollIntoView) st.scrollIntoView({ behavior:'smooth', block:'start' }); }, 120); } catch(e){}
  const F = window.__fb; const m = me();
  const k = nkey(m.name);
  const rec = { name: m.name || '', branch: m.branch || myBranch(), role: ROLE(), ts: Date.now() };
  JOINED = roomId;
  try {
    await F.set(F.ref(F.db, BASE+'/live/'+roomId+'/'+k), rec);
    // 들어온 시각은 처음 한 번만 적는다 (끊겼다 다시 들어와도 첫 시각을 지키려고)
    const g = await F.get(F.ref(F.db, BASE+'/log/'+roomId+'/'+today()+'/'+k));
    if (!g.exists()) {
      await F.set(F.ref(F.db, BASE+'/log/'+roomId+'/'+today()+'/'+k),
        { name: rec.name, branch: rec.branch, role: rec.role, inAt: Date.now(), outAt: 0 });
    } else {
      await F.update(F.ref(F.db, BASE+'/log/'+roomId+'/'+today()+'/'+k), { outAt: 0 });
    }
  } catch(e){ console.warn('[meet] 기록 실패', e); }

  if (beat) clearInterval(beat);
  beat = setInterval(() => {
    try { F.update(F.ref(F.db, BASE+'/live/'+JOINED+'/'+k), { ts: Date.now() }); } catch(e){}
  }, 45000);
  render();
}
async function doLeave(){
  closeDaily();   // 📹 앱 안 영상도 같이 닫는다 (2026-11-06)
  try { const f = document.getElementById('trFab'); if (f) { f.classList.remove('on'); delete f.dataset.rtr; } } catch(e){}
  const F = window.__fb; const k = nkey(me().name);
  if (beat) { clearInterval(beat); beat = null; }
  if (JOINED) {
    try {
      await F.remove(F.ref(F.db, BASE+'/live/'+JOINED+'/'+k));
      await F.update(F.ref(F.db, BASE+'/log/'+JOINED+'/'+today()+'/'+k), { outAt: Date.now() });
    } catch(e){}
  }
  JOINED = null;
  document.getElementById('stage').classList.remove('on');
  document.getElementById('stageIn').innerHTML = '';
  render();
}
// 창을 그냥 닫아도 나간 것으로 남긴다 (sendBeacon 은 토큰을 못 붙여 쓰지 않는다)
window.addEventListener('pagehide', () => { if (JOINED) { try { doLeave(); } catch(e){} } });

/* ── 임원 전용 — 회의 링크 넣기 / 회의 소집 ─────────────────────────── */
async function setUrl(roomId){
  if (!isExec()) { alert(t('onlyExec')); return; }
  const cur = (URLS[roomId]||{}).url || '';
  const v = prompt(t('askUrl'), cur);
  if (v === null) return;
  const u = String(v).trim();
  if (u && !/^https:\/\//i.test(u)) { alert(t('badUrl')); return; }
  const F = window.__fb;
  try {
    if (!u) await F.remove(F.ref(F.db, BASE+'/rooms/'+roomId));
    else await F.set(F.ref(F.db, BASE+'/rooms/'+roomId), { url:u, by: me().name||'', ts: Date.now() });
    if (!u) alert(t('clrUrl'));
  } catch(e){ alert('저장 실패 · could not save'); }
}
async function callIn(roomId){
  { const lk = Object.keys(CALLS).find(k => callActive(CALLS[k]) && CALLS[k].room === roomId);
    if (lk && !iMade(CALLS[lk])) { alert(t('locked')); return; } }
  if (!isExec()) { alert(t('onlyExec')); return; }
  const r = rooms().find(x=>x.id===roomId);
  const m = me();
  const ts = Date.now();
  const msgId = 'meet_' + ts;
  const text = t('callMsg').split('%s').join(r.name);
  const msg = {
    sender: m.name || '', senderBranch: m.branch || myBranch(), senderRole: ROLE(),
    isManager: true, color: m.color || '#1d4ed8', text, ts, photos: [],
    meta: { kind:'meet_call', room: roomId }
  };
  try {
    if (window.kmChatQueue && typeof window.kmChatQueue.send === 'function') {
      await window.kmChatQueue.send({ room:'managing', msgId, msg,   // 2026-10-25 매니징 룸 통일
        roomPatch: { lastMsg:'📹 '+r.name, lastTs: ts, lastSender: msg.sender } });
    } else {
      await fetch(FB+'/chat/messages/managing/'+msgId+'.json',
        { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(msg) });
      await fetch(FB+'/chat/rooms/managing.json',
        { method:'PATCH', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ lastMsg:'📹 '+r.name, lastTs: ts, lastSender: msg.sender }) });
    }
    alert(t('called'));
  } catch(e){ console.warn('[meet] 소집 실패', e); alert(t('callFail')); }
}

/* ══ 📞 바로 화상 통화 (2026-10-30) ══════════════════════════════════
   사장님: "전 직원 중 누구누구를 클릭하면 바로 비디오 콜로 초대 — 상대 화면에 즉시 접속 대기 창이 뜨고,
            나는 바로 기다렸다 대화." / "수퍼바이저 이상은 지점 간이 아니라 다른 지점 수퍼바이저·매니저·
            실무 직원과 언제든 회의를 만들 수 있게."
   · 거는 사람: 수퍼바이저 이상 (OWNER·EXECUTIVE·MANAGER·ASSISTANT_MANAGER·SUPERVISOR)
   · 받는 사람: 승인된 전 직원(users 명단). 받는 쪽 창은 fb-auth-fetch.js 가 앱 어느 화면에서든 띄운다.
   · 회의방: Google Meet 는 앱이 방을 새로 만들 수 없다 → 미리 만든 링크(⚙ 통화 회선)를 돌려 쓰고,
             모자라면 비어 있는 지점 회의방을 빌린다. 비어 있음 = 아무도 없고 진행 중 통화도 없음.
   저장 (inventory 아래 — 승인 직원 읽기·쓰기):
     meet/lines/{L1..}              { url, by, ts }
     meet/calls/{통화id}             { by, byUid, byBranch, room, roomName, url, ts, ended, inv/{uid}={name,branch,state,at} }
     meet/ring/{받는uid}/{통화id}     { from, fromBranch, url, room, ts, state: ringing|accepted|declined|ended } */
const canDial = () => /OWNER|EXECUTIVE|MANAGER|SUPERVISOR/.test(ROLE());
const CALL_TTL = 60*60*1000;   // [통화 끝] 을 안 눌러도 1시간 지나면 끝난 것으로 본다
const RING_TTL = 3*60*1000;    // 3분 안에 안 받으면 '응답 없음'
const callActive = c => !!c && !c.ended && Date.now() - (c.ts||0) < CALL_TTL;
const myUid = () => me().uid || '';
function roomBusy(id){
  if (inRoom(id).length) return true;
  return Object.keys(CALLS).some(k => callActive(CALLS[k]) && CALLS[k].room === id);
}
/* 🎥 2026-11-03 회의방 = 로그인 없는 고정 방. 관리자 회의 3종은 늘 같은 방(누가 몇 번 눌러도),
   1:1·면접·교육은 그때마다 새 이름의 방 하나. 아래 옛 구글 Meet 회선 고르기(pickLineOld)는 쓰지 않는다 */
function pickLine(kind){
  if (!JKEY) return null;
  const r = rooms().find(x => x.id === 'k_' + kind);
  if (r) return { id:r.id, url:jRoom(r.key), name:r.name };
  const s = Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2,5);
  return { id:'x_'+s, url:jRoom((kind || 'Meet') + '-' + s), name: kindLab(kind) || t('dialT') };
}
function pickLineOld(){
  const pool = [];
  Object.keys(LINES).sort().forEach((k, i) => {
    const u = (LINES[k]||{}).url;
    if (u) pool.push({ id:'line_'+k, url:u, name:t('dialT')+' #'+(i+1), by:(LINES[k]||{}).by });
  });
  // 빌려 쓰는 지점 회의방 — 지점 방 먼저(뒤에서부터), 전 지점 회의방은 맨 나중
  const rs = rooms();
  rs.slice(1).reverse().concat(rs.slice(0,1)).forEach(r => {
    const u = (URLS[r.id]||{}).url;
    if (u) pool.push({ id:r.id, url:u, name:r.name, by:(URLS[r.id]||{}).by });
  });
  // 🔑 2026-10-31 사장님: "10명 정도 단체 회의가 잘 작동이 안돼"
  //   기록을 보니 사장님 회의가 김병호 님이 만든 지점 방 링크로 열렸다 → Meet 주인(호스트)이 없는 방이라
  //   직원들이 [참여 요청] 을 해도 받아 줄 사람이 없다. → **내가 만든 링크를 먼저** 쓴다 (호스트 = 나).
  const mine = p => !!p.by && nkey(p.by) === nkey(me().name);
  const free = pool.filter(p => !roomBusy(p.id));
  return free.find(mine) || free[0] || null;
}

const GENERIC = ['staff','manager','employee','admin','user','직원','매니저','스태프','사원','관리자'];
/* 🔐 2026-11-02 사장님 신고("지점별로 이름을 클릭해서 선택하는 기능이 없어졌어" =
   고르기 창에 'Could not load the staff list'): /users 와 inventory/meet 는 규칙이
   auth != null 을 요구하는데 여기서 생 fetch 로 읽었다. fb-auth-fetch.js 가 토큰을
   붙여 주긴 하지만 토큰 복원을 최대 1초만 기다리고 없으면 그냥 보낸다 — PWA 를
   백그라운드에서 깨워 바로 누르면 그 1초를 못 넘겨 401 → ROSTER_ERR 로 굳고
   창을 닫았다 열기 전엔 다시 시도하지 않았다.
   → Firebase SDK get() 은 인증이 준비될 때까지 알아서 기다린다. SDK 가 아직 안
   떴을 때만 생 fetch 로 폴백. (chat.html 이 2026-06-10 에 같은 이유로 한 수정) */
function fbReady(ms){
  if (window.__fb && window.__fb.get) return Promise.resolve(window.__fb);
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; res(window.__fb && window.__fb.get ? window.__fb : null); };
    window.addEventListener('fb-ready', fin, { once:true });
    setTimeout(fin, ms || 8000);
  });
}
async function fbGet(path){
  const F = await fbReady();
  if (F) return (await F.get(F.ref(F.db, path))).val();
  const r = await fetch(FB+'/'+path+'.json', { cache:'no-store' });   // SDK 못 뜬 기기용
  if (!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
}
async function loadRoster(){
  ROSTER_ERR = false;
  try {
    const u = (await fbGet('users')) || {};
    const meK = nkey(me().name), mine = myUid();
    const by = new Map();
    for (const uid of Object.keys(u)) {
      const v = u[uid];
      if (!v || v.status !== 'approved') continue;
      const nm = String(v.name||'').trim();
      if (!nm || GENERIC.includes(nm.toLowerCase())) continue;
      const k = nkey(nm);
      if (uid === mine || k === meK) continue;
      const e = by.get(k) || { key:k, name:nm, branch:'', role:'', uids:[], since:0 };
      e.uids.push(uid);
      e.fcm = (e.fcm || 0) + (v.fcm ? Object.keys(v.fcm).length : 0);   // 🔕 폰 알림이 닿는 기기 수 (0 = 안 울림)
      e.since = Math.max(e.since || 0, v.approvedAt || v.createdAt || 0);   // 🎓 신입 교육 미리 고르기용
      if (!e.branch || e.branch === '*') e.branch = v.branch || e.branch;
      if (!e.role) e.role = v.role || '';
      by.set(k, e);
    }
    const order = id => { const i = BRANCHES.findIndex(b=>b.id===id); return i < 0 ? 9 : i; };
    ROSTER = [...by.values()].sort((a,b) => order(a.branch)-order(b.branch) || a.name.localeCompare(b.name));
  } catch(e){ console.warn('[meet] 명단 실패', e); ROSTER = null; ROSTER_ERR = true; }
}

function buildMinutes(id, c, end){

const FILE_MAX = 25 * 1024 * 1024;

async function uploadFiles(id, list){
  const F = window.__fb; const m = me();
  if (!F || !F.st) { alert(t('fFail').split('%s').join('')); return; }
  for (const file of list) {
    if (file.size >= FILE_MAX) { alert(t('fBig').split('%s').join(file.name)); continue; }
    UP_BUSY[id] = (UP_BUSY[id]||0) + 1; renderDial();
    try {
      const ts = Date.now();
      const safe = String(file.name||'file').replace(/[^\w.\-가-힣]+/g, '_').slice(-80);
      const path = 'invoices/_MEETING/' + id + '_' + ts + '_' + safe;
      const snap = await F.uploadBytes(F.sRef(F.st, path), file, { contentType: file.type || 'application/octet-stream' });
      const url = await F.getDownloadURL(snap.ref);
      await F.set(F.ref(F.db, BASE+'/calls/'+id+'/files/f'+ts+Math.random().toString(36).slice(2,5)),
                  { name:file.name||safe, url, size:file.size||0, type:file.type||'', by:m.name||'', ts });
    } catch(e){ console.warn('[meet] 파일 실패', e); alert(t('fFail').split('%s').join(file.name)); }
    UP_BUSY[id]--; renderDial();
  }
}

  openMeet(c.url);
  if (iMade(c)) markMeIn(c.room);
}
async function setLines(){
  if (!isExec()) { alert(t('onlyExec')); return; }
  const cur = Object.keys(LINES).sort().map(k => (LINES[k]||{}).url).filter(Boolean).join(' ');
  const v = prompt(t('askLines'), cur);
  if (v === null) return;
  const urls = String(v).split(/[\s,]+/).map(x=>x.trim()).filter(Boolean);
  if (urls.some(u => !/^https:\/\//i.test(u))) { alert(t('badUrl')); return; }
  const obj = {}; urls.forEach((u,i) => { obj['L'+(i+1)] = { url:u, by:me().name||'', ts:Date.now() }; });
  try {
    const F = window.__fb;
    if (urls.length) await F.set(F.ref(F.db, BASE+'/lines'), obj); else await F.remove(F.ref(F.db, BASE+'/lines'));
    alert(t('linesOk', urls.length));
  } catch(e){ alert('저장 실패 · could not save'); }
}
function renderDial(){
  const el = document.getElementById('dial'); if (!el) return;
  if (typing()) return;
  const now = Date.now();
  // [회의 끝] 을 안 누르고 1시간이 지난 내 회의 → 그때까지 내용으로 회의록을 남긴다
  Object.keys(CALLS).forEach(k => { const c = CALLS[k]; if (c && !c.ended && !callActive(c) && iMade(c)) endCall(k, true); });
  const inCall = inCallOf;
  const calls = Object.keys(CALLS).filter(k => (!PANEL || k === PANEL) && callActive(CALLS[k]) && (isExec() || iMade(CALLS[k]) || inCall(CALLS[k])))
                 .sort((a,b) => (CALLS[b].ts||0) - (CALLS[a].ts||0));
  let h = '<div class="hd"><b>'+esc(t('dialT'))+'</b>'
    + '</div><div class="sub" style="font-size:.8em;color:var(--muted);margin-top:3px">'+esc(canDial() ? t('dialS') : t('dialOnly'))+'</div>';
  if (canDial()) {
    // 종류별 지난 회의 날짜 (회의록에서)
    const last = {};
    Object.keys(MINS).forEach(k => { const mn = MINS[k]; if (mn && mn.kind && (!last[mn.kind] || mn.end > last[mn.kind])) last[mn.kind] = mn.end; });
    h += '<div class="kinds">' + Object.keys(KINDS).filter(k => !KINDS[k].exec || isExec()).map(k =>
      '<button class="kind'+(k === 'urgent' ? ' urgent' : '')+(KINDS[k].top ? ' top' : '')+'" data-kind="'+k+'"><b>'+esc(kindLab(k))+'</b><small>'+esc(t(KINDS[k].sub))
      + (last[k] ? '<br>'+esc(t('kLast').split('%s').join(ymdhm(last[k]))) : '')+'</small></button>').join('') + '</div>';
    h += '<button class="btn g big" data-pick="1">'+esc(t('dialGo'))+'</button>';
  }
  for (const id of calls) {
    const c = CALLS[id]; const mine = iMade(c);
    const inv = c.inv || {};
    // 같은 사람이 계정 여러 개면 한 번만 — 가장 앞선 상태(참가 > 부르는 중 > 거절 > 응답 없음)
    const per = new Map(); const rank = { accepted:3, ringing:2, declined:1, missed:0 };
    Object.keys(inv).forEach(uid => {
      const v = inv[uid] || {}; let st = v.state || 'ringing';
      if (st === 'ringing' && now - (v.at||0) > RING_TTL) st = 'missed';
      const k = nkey(v.name); const p = per.get(k);
      if (!p || rank[st] > rank[p.st]) per.set(k, { name:v.name, branch:v.branch, st });
    });
    const lab = { accepted:['ok',t('sOk')], ringing:['ring',t('sRing')], declined:['no',t('sNo')], missed:['',t('sMiss')] };
    h += '<div class="call'+(c.kind === 'urgent' ? ' urgent' : '')+'" id="call-'+esc(id)+'"><div class="ct">'+(c.kind ? esc(kindLab(c.kind))+' · '+esc(c.by||'') : esc(t('callBy').split('%s').join(c.by||'')))+' · '+hhmm(c.ts)+'</div>'
      + '<div class="cs">'+esc(c.roomName||'')+'</div>'
      + (PANEL ? '<div class="pnlhd">'+esc(t('pnlHd'))+'</div>' : '')
      + ((mine || isExec()) && c.url ? '<div class="inv"><div class="invh">'+esc(t('invH'))+'</div><div class="invr">'
      +   '<input class="inv-ph" type="tel" inputmode="tel" autocomplete="off" data-cinvph="'+esc(id)+'" placeholder="'+esc(t('invPh'))+'" value="'+esc(INV_PH[id]||'')+'">'
      +   '<button class="btn sm p" data-cinv="'+esc(id)+'">'+esc(t('invSend'))+'</button>'
      +   '<button class="btn sm" data-cinvcp="'+esc(id)+'">'+esc(t('invCopy'))+'</button></div></div>' : '')
      + '<div class="cnts">'+esc(t('cnts', [...per.values()].filter(p => p.st === 'accepted').length)
            .split('%a').join([...per.values()].filter(p => p.st === 'ringing').length)
            .split('%b').join([...per.values()].filter(p => p.st === 'declined').length)
            .split('%c').join([...per.values()].filter(p => p.st === 'missed').length))+'</div>'
      + '<div class="who'+(PANEL ? ' big' : '')+'">'+[...per.values()].sort((a,b) => rank[b.st] - rank[a.st]).map(p => '<span class="st '+lab[p.st][0]+'"><span>'+esc(p.name)+'</span><span>'+esc(lab[p.st][1])+'</span></span>').join(' ')+'</div>'
      + '<div class="acts">'
      +   '<button class="btn sm p" data-ctr="'+esc(id)+'" style="background:#7c3aed;border-color:#7c3aed">'+esc(t('trOpen'))+'</button>'
      +   (PANEL ? '' : '<button class="btn sm p" data-cpanel="'+esc(id)+'">'+esc(t('pnlOpen'))+'</button>')
      +   '<button class="btn sm'+(PANEL ? ' p' : '')+'" data-creopen="'+esc(id)+'">'+esc(t('reopen'))+'</button>'
      +   (mine ? '<button class="btn sm" data-cring="'+esc(id)+'">'+esc(t('ringAgain'))+'</button>' : '')
      +   (mine && canDial() ? '<button class="btn sm" data-cadd="'+esc(id)+'">'+esc(t('addPpl'))+'</button>' : '')
      +   ((KINDS[c.kind]||{}).copyLink && (mine || isExec()) ? '<button class="btn sm" data-ccopy="'+esc(id)+'">'+esc(t('copyL'))+'</button>' : '')
      +   (mine || isExec() ? '<button class="btn sm" data-cend="'+esc(id)+'">'+esc(t('endCall'))+'</button>' : '')
      +   (mine || isExec() ? '<button class="btn sm" data-cdel="'+esc(id)+'" style="color:var(--bad,#dc2626)">'+esc(t('delCall'))+'</button>' : '')
      + '</div>'
      + '<div class="tip">'+esc(t('tile'))+(mine ? '<br>'+esc(t('gem'))+'<br>'+esc(t('privTip')) : '')+'</div>'
      + '<div class="sec">'+esc(t('fH'))+'</div>'
      + '<div class="files">'+(filesHtml(c.files) || '<div class="sub" style="font-size:.78em;color:var(--muted)">'+esc(t('fNone'))+'</div>')+'</div>'
      + '<div class="acts"><button class="btn sm" data-cfile="'+esc(id)+'"'+(UP_BUSY[id] ? ' disabled' : '')+'>'
      +   esc(UP_BUSY[id] ? t('fBusy', UP_BUSY[id]) : t('fUp'))+'</button></div>'
      + '<div class="sec">'+esc(t('nH'))+'</div>'
      + '<textarea class="note-ta" data-cnote="'+esc(id)+'" placeholder="'+esc(t('nPh'))+'">'+esc((c.notes||{}).text||'')+'</textarea>'
      + ((c.notes||{}).by ? '<div class="saved">'+esc(t('nSaved', hhmm(c.notes.ts)).split('%s').join(c.notes.by))+'</div>' : '')
      + '</div>';
  }
  el.className = 'dial';
  el.innerHTML = h;
}

/* ── 이어 붙이기 ──────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.l)    { LANG = b.dataset.l;
                        try{ localStorage.setItem('km.lang', LANG); }catch(_){}
                        try{ window.dispatchEvent(new CustomEvent('km-lang-changed',{detail:LANG})); }catch(_){}
                        render(); return; }
  if (b.id === 'acctBtn'){ askAcct(); return; }
  if (b.dataset.join) { askJoin(b.dataset.join); return; }
  if (b.dataset.leave){ JOINED = b.dataset.leave; doLeave(); return; }
  if (b.dataset.url)  { setUrl(b.dataset.url);  return; }
  if (b.dataset.call) { callIn(b.dataset.call); return; }
  if (b.id === 'ovGo'){ doJoin(); return; }
  if (b.id === 'ovNo'){ document.getElementById('ov').classList.remove('on'); PENDING=null; return; }
  if (b.id === 'leaveBtn'){ doLeave(); return; }
  if (b.dataset.pick)   { openPicker(); return; }
  if (b.dataset.kind && (KINDS[b.dataset.kind]||{}).direct) {   // 🔗 면접 = 고르기 없이 바로 열고 링크 보내기
    if (!canDial()) { alert(t('dialOnly')); return; }
    PK_ADD = null; PK_SEL = new Map(); PK_KIND = b.dataset.kind;
    startCall().then(r => { if (r) showShare(r.url); });
    return; }
  if (b.dataset.kind)   { openPicker(null, b.dataset.kind); return; }
  if (b.dataset.cinv)   { sendInvite(b.dataset.cinv); return; }
  if (b.dataset.cinvcp) { sendInvite(b.dataset.cinvcp, 'copy'); return; }
  if (b.dataset.ccopy)  { const c = CALLS[b.dataset.ccopy]; if (!c) return; showShare(c.url || ''); return; }
  if (b.dataset.lines)  { setLines(); return; }
  if (b.dataset.pkbr != null) { PK_BR = b.dataset.pkbr; drawPicker(); return; }
  if (b.id === 'pkNo')  { closePicker(); return; }
  if (b.id === 'pkCs')  { updateGroup(); return; }
  if (b.id === 'pbBtn') { askPush(); return; }
  if (b.id === 'pkGo')  { startCall(); return; }
  if (b.dataset.pkrm)   { PK_SEL.delete(b.dataset.pkrm); drawPicker(); return; }
  if (b.dataset.grpsave){ saveGroup(); return; }
  if (b.dataset.grp)    { useGroup(b.dataset.grp); return; }
  if (b.dataset.grpdel) { delGroup(b.dataset.grpdel); return; }
  if (b.dataset.cfile)  { UP_CALL = b.dataset.cfile; const fi = document.getElementById('fileIn'); fi.value = ''; fi.click(); return; }
  if (b.dataset.minsave){ saveMin(b.dataset.minsave); return; }
  if (b.dataset.creopen){ reopen(b.dataset.creopen); return; }
  if (b.dataset.cpanel) { openPanel(b.dataset.cpanel); return; }
  if (b.dataset.ctr)    { trOpen(trKeyOf(b.dataset.ctr)); return; }
  if (b.dataset.rcall)  { PK_ROOM = b.dataset.rcall; openPicker(); return; }
  if (b.dataset.rtr)    { trOpen('room_' + b.dataset.rtr); return; }   // 🗣 같은 방 사람끼리 같은 통역 칸
  if (b.dataset.cring)  { ringAgain(b.dataset.cring); return; }
  if (b.dataset.cadd)   { openPicker(b.dataset.cadd); return; }
  if (b.dataset.cend)   { endCall(b.dataset.cend); return; }
  if (b.dataset.cdel)   { delCall(b.dataset.cdel); return; }
});
// 사람 고르기 — 줄 어디를 눌러도 선택
document.addEventListener('click', e => {
  const row = e.target.closest('.prow'); if (!row) return;
  if (row.dataset.pkallbr) { pkAllBranch(); return; }
  if (row.dataset.pk) pkToggle(row.dataset.pk);
});
document.addEventListener('input', e => {
  if (e.target && e.target.id === 'pkQ') drawPicker();
  if (e.target && e.target.dataset && e.target.dataset.cinvph) INV_PH[e.target.dataset.cinvph] = e.target.value;
  if (e.target && e.target.dataset && e.target.dataset.cnote) saveNote(e.target.dataset.cnote, e.target.value);
});
// 메모 칸을 떠나면 그동안 미뤄 둔 화면 갱신을 한다
document.addEventListener('focusout', e => { if (e.target && e.target.classList && (e.target.classList.contains('note-ta') || e.target.classList.contains('inv-ph'))) setTimeout(render, 50); });
// 전화번호 칸에서 Enter = 초대 문자
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.cinvph) { e.preventDefault(); sendInvite(e.target.dataset.cinvph); } });
document.getElementById('fileIn').addEventListener('change', e => {
  const fs = [...(e.target.files||[])]; if (UP_CALL && fs.length) uploadFiles(UP_CALL, fs);
});
window.addEventListener('km-lang-changed', e => {
  const l = e && e.detail; if (L3.includes(l) && l !== LANG) { LANG = l; render(); }
});
// 누가 들어오고 나가는지 시계도 같이 흘러야 하므로 30초마다 다시 그린다
setInterval(() => { if (document.visibilityState === 'visible') render(); }, 30000);

render();
if (window.__fb) watch(); else window.addEventListener('fb-ready', watch, { once:true });
</script>
</body></html>
