<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:linear-gradient(135deg,#1a5c3a,#2e7d32);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1f2937}
.card{background:#fff;border-radius:24px;max-width:420px;width:100%;padding:36px 32px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.logo{width:74px;height:74px;border-radius:18px;background:linear-gradient(135deg,#1a5c3a,#2e7d32);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:900;margin:0 auto 18px}
h1{font-size:1.4em;font-weight:800;color:#1a5c3a;text-align:center;margin-bottom:6px}
.sub{font-size:.92em;color:#6b7280;text-align:center;margin-bottom:30px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border:1.5px solid #d1d5db;color:#1f2937;border-radius:14px;padding:14px 18px;font-size:1em;font-weight:600;cursor:pointer;width:100%;font-family:inherit;transition:.15s}
.gbtn:hover{background:#f9fafb;border-color:#1a5c3a;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.gbtn:disabled{opacity:.5;cursor:wait}
.gbtn img{width:22px;height:22px}
.divider{display:flex;align-items:center;gap:10px;color:#9ca3af;font-size:.78em;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
.note{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;font-size:.82em;color:#6b7280;line-height:1.5;margin-top:18px}
.note b{color:#1a5c3a}
.lang-toggle{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.lang-toggle button{background:transparent;border:1px solid #e5e7eb;color:#6b7280;border-radius:8px;padding:4px 10px;font-size:.76em;font-weight:700;cursor:pointer}
.lang-toggle button.active{background:#1a5c3a;color:#fff;border-color:#1a5c3a}
.error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:10px;padding:10px 14px;font-size:.86em;margin-top:14px;display:none}
.error.show{display:block}
.profile{display:flex;align-items:center;gap:12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin-bottom:18px}
.profile img{width:42px;height:42px;border-radius:50%}
.profile .nm{font-weight:700;font-size:.92em}
.profile .em{font-size:.76em;color:#9ca3af}
.status-card{border-radius:14px;padding:18px;margin-top:14px;text-align:center}
.status-card.pending{background:#fffbeb;border:2px solid #fde68a;color:#92400e}
.status-card.blocked{background:#fef2f2;border:2px solid #fecaca;color:#991b1b}
.status-card .ic{font-size:2.4em;margin-bottom:6px}
.status-card .t{font-weight:800;font-size:1em;margin-bottom:4px}
.status-card .d{font-size:.85em;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1;background:#fff;border:1.5px solid #e5e7eb;color:#374151;border-radius:10px;padding:10px;font-weight:700;font-size:.88em;cursor:pointer;font-family:inherit}
.actions button.primary{background:#1a5c3a;color:#fff;border-color:#1a5c3a}
</style>

<body class="kmd">
<div class="card">
  <div class="lang-toggle">
    <button data-l="ko" onclick="setLang('ko')">한국어</button>
    <button data-l="en" onclick="setLang('en')">English</button>
    <button data-l="es" onclick="setLang('es')">Español</button>
  </div>
  <img class="brand-logo" src="./pwa-assets/kimchi-mart-full-logo.png?v=2" alt="KIMCHI MART">
  <h1 id="title">김치마트</h1>
  <div class="sub" id="subtitle">매니저 앱 · 직원 로그인</div>
  <div id="signinView">
    <button class="gbtn" id="googleBtn" onclick="doGoogleSignIn()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
      <span id="googleBtnText">Google 계정으로 로그인</span>
    </button>
    <div style="display:flex;align-items:center;gap:10px;margin:14px 0;color:#9ca3af;font-size:.82em">

      <span id="orLabel">또는</span>
      <span style="flex:1;height:1px;background:#e5e7eb"></span>
    </div>
    <input id="emEmail" type="email" placeholder="manager@miamikimchi.com" autocomplete="email"
      style="width:100%;padding:11px 13px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.95em;font-family:inherit;outline:0;margin-bottom:8px;box-sizing:border-box">
    <input id="emPwd" type="password" placeholder="비밀번호 / Password" autocomplete="current-password"
      style="width:100%;padding:11px 13px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.95em;font-family:inherit;outline:0;margin-bottom:12px;box-sizing:border-box">

    <!-- 지점 + 본인 이름 — 한 번에 다 처리 (Pembroke Pines 등 공유 계정용).

        style="flex:1;padding:11px 13px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.95em;font-family:inherit;outline:0;background:#fff;cursor:pointer">
        <option value="" id="loginBranchDefault">📍 지점 선택 / Branch</option>
      </select>

    <select id="loginName"
      style="width:100%;padding:11px 13px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.95em;font-family:inherit;outline:0;margin-bottom:8px;box-sizing:border-box;background:#fff;cursor:pointer">
      <option value="" id="loginNameDefault">👤 본인 이름 선택 / Your Name (지점 선택 후)</option>
    </select>
    <input id="loginNameCustom" type="text" placeholder="또는 직접 입력 / Or type your name" autocomplete="name"
      style="width:100%;padding:11px 13px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.95em;font-family:inherit;outline:0;margin-bottom:12px;box-sizing:border-box">

    <button class="gbtn" id="emBtn" onclick="doEmailSignIn()" style="background:#1a5c3a;color:#fff;border-color:#1a5c3a;justify-content:center">
      <span id="emBtnText">이메일로 로그인</span>

    <div class="note" id="firstHint">
      <b id="firstHintTitle">처음 사용?</b><br>
      <span id="firstHintBody">구글 계정으로 로그인하면 매니저가 승인해드립니다. 본인 직장 이메일을 사용하세요.</span>
    </div>

  <div id="loadingView" style="display:none;text-align:center;padding:30px 0">

  </div>
  <div id="statusView" style="display:none">
    <div class="profile">
      <img id="meImg" src="" alt="">
      <div>
        <div class="nm" id="meName"></div>
        <div class="em" id="meEmail"></div>
      </div>
    </div>
    <div id="statusCard"></div>
    <div class="actions">
      <button onclick="doSignOut()" id="btnLogout">로그아웃</button>
      <button class="primary" onclick="goHome()" id="btnEnter" style="display:none">입장</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, indexedDBLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getDatabase, ref, get, set, onValue } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

const cfg = { apiKey:"AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4", authDomain:"kimchi-mart-order.firebaseapp.com", databaseURL:"https://kimchi-mart-order-default-rtdb.firebaseio.com", projectId:"kimchi-mart-order" };
const app = getApps().length ? getApp() : initializeApp(cfg);
const auth = getAuth(app);
const db = getDatabase(app);
// auth-gate.js 와 동일 — IndexedDB 우선, localStorage fallback. 한 번 로그인
// 하면 페이지 이동 / 앱 재시작에도 세션 유지됨.
setPersistence(auth, indexedDBLocalPersistence)
  .catch(() => setPersistence(auth, browserLocalPersistence))
  .catch(()=>{});
const provider = new GoogleAuthProvider();

const BOOTSTRAP_ADMINS = {
  'specialmasterdj@gmail.com':  { role: 'OWNER',     branch: '*', name: 'DJ' },
  'byhoki64@gmail.com':         { role: 'EXECUTIVE', branch: '*', name: 'B.H.K' },
  // Shared role accounts — quick replacement for the legacy "manager PIN"
  // until each staff has an individual account. Anyone using these gets
  // auto-approved with the listed role.
  'manager@miamikimchi.com':    { role: 'MANAGER',    branch: '*', name: 'Manager' },
  'staff@miamikimchi.com':      { role: 'SUPERVISOR', branch: '*', name: 'Staff'   },
};
function bootstrapFor(email){ return email ? (BOOTSTRAP_ADMINS[email.toLowerCase()] || null) : null; }

// 지점 + 이름 한 번에 — Pembroke Pines 등 공유 계정 직원이 로그인 단계에서
// 바로 본인 정보를 입력할 수 있도록. 로그인 성공 시 chat.me 에 저장되어
// chat.html 의 별도 '이름 선택' 모달이 안 뜸.
const BRANCHES = [
  { id:'MIAMI',           ko:'마이애미',       en:'Miami',           es:'Miami' },
  { id:'PEMBROKE_PINES',  ko:'펨브로크 파인즈', en:'Pembroke Pines',  es:'Pembroke Pines' },
  { id:'HOLLYWOOD',       ko:'할리우드',       en:'Hollywood',       es:'Hollywood' },
  { id:'CORAL_SPRINGS',   ko:'코럴 스프링스',  en:'Coral Springs',   es:'Coral Springs' },
  { id:'LASOLAS',         ko:'라스올라스',     en:'Las Olas',        es:'Las Olas' },
  { id:'WEST_PALM',       ko:'웨스트 팜 비치', en:'West Palm Beach', es:'West Palm Beach' },
];
function fillLoginBranches(){
  const sel = document.getElementById('loginBranch');
  if (!sel || sel.options.length > 1) return; // already filled
  // Restore last selection so returning users don't have to re-pick
  let lastBranch = ''; let lastName = '';
  try {
    const me = JSON.parse(localStorage.getItem('chat.me') || 'null');
    if (me) { lastBranch = me.branch || ''; lastName = me.name || ''; }
  } catch(_){}
  for (const b of BRANCHES) {
    const opt = document.createElement('option');
    opt.value = b.id;
    opt.textContent = '📍 ' + (b[LANG] || b.ko);
    if (b.id === lastBranch) opt.selected = true;
    sel.appendChild(opt);
  }
  if (lastBranch) {
    onLoginBranchChange();
    // pre-select last name once list loads
    setTimeout(() => {
      const nameSel = document.getElementById('loginName');
      const opt = Array.from(nameSel.options).find(o => o.value === lastName);
      if (opt) opt.selected = true;
      else if (lastName) document.getElementById('loginNameCustom').value = lastName;
    }, 800);
  }
}

const FB_DB_URL = 'https://kimchi-mart-order-default-rtdb.firebaseio.com';
window.onLoginBranchChange = async function(){
  const branchId = document.getElementById('loginBranch').value;
  const sel = document.getElementById('loginName');
  if (!branchId) {
    sel.innerHTML = '<option value="">👤 본인 이름 선택 / Your Name (지점 선택 후)</option>';
    return;
  }
  sel.innerHTML = '<option value="">⏳ 로딩…</option>';
  let employees = [];
  try {
    // localStorage cache 우선 — chat.html 가 평소 채워둠
    const cached = JSON.parse(localStorage.getItem('shifts.' + branchId) || 'null');
    if (cached && cached.employees) employees = cached.employees;
  } catch(_){}
  // RTDB fetch — 캐시 없거나 오래됐을 때
  try {
    const r = await fetch(`${FB_DB_URL}/schedules/${branchId}.json`, { cache:'no-store' });
    if (r.ok) {
      const data = await r.json();
      if (data && data.employees) {
        employees = data.employees;
        try { localStorage.setItem('shifts.' + branchId, JSON.stringify(data)); } catch(_){}
      }
    }
  } catch(_){}
  // OWNER 도 묶어 보여주기 (DJ, B.H.K)
  let owners = [];
  try {
    const g = JSON.parse(localStorage.getItem('shifts.global') || 'null');
    if (g && g.owners) owners = g.owners;
  } catch(_){}
  if (owners.length === 0) {
    try {
      const r = await fetch(`${FB_DB_URL}/schedules/_global.json`, { cache:'no-store' });
      if (r.ok) {
        const d = await r.json();
        if (d && d.owners) {
          owners = d.owners;
          try { localStorage.setItem('shifts.global', JSON.stringify(d)); } catch(_){}
        }
      }
    } catch(_){}
  }
  const all = [...owners, ...employees];
  if (all.length === 0) {
    sel.innerHTML = '<option value="">— 명단 없음, 직접 입력해주세요 —</option>';
    return;
  }
  sel.innerHTML = '<option value="">— 직접 입력 —</option>' +
    all.map(e => `<option value="${e.name||''}" data-role="${e.role||''}">${e.name||''}${e.role?' ('+e.role+')':''}</option>`).join('');
};

const I18N = {
  ko:{ title:'김치마트', subtitle:'매니저 앱 · 직원 로그인', googleBtn:'Google 계정으로 로그인', firstHintTitle:'처음 사용?', firstHintBody:'구글 계정으로 로그인하면 매니저가 승인해드립니다. 본인 직장 이메일을 사용하세요.', loading:'로그인 중…', logout:'로그아웃', enter:'입장', pendingT:'매니저 승인 대기 중', pendingD:'가입 신청이 접수되었습니다. 매니저가 승인하면 자동으로 입장됩니다.', blockedT:'접근 차단됨', blockedD:'이 계정은 차단되었습니다. 매니저에게 문의하세요.', popupBlocked:'팝업이 차단되었습니다. 잠시 후 다시 시도합니다.', signinErr:'로그인 실패: ' },
  en:{ title:'Kimchi Mart', subtitle:'Manager app · Staff login', googleBtn:'Sign in with Google', firstHintTitle:'First time?', firstHintBody:'Sign in with Google and a manager will approve you. Use your work email.', loading:'Signing in…', logout:'Sign out', enter:'Enter', pendingT:'Awaiting manager approval', pendingD:'Your request has been submitted. You will be admitted automatically when a manager approves.', blockedT:'Access blocked', blockedD:'This account has been blocked. Please contact a manager.', popupBlocked:'Popup blocked. Retrying…', signinErr:'Sign-in failed: ' },
  es:{ title:'Kimchi Mart', subtitle:'App de gerente · Inicio de sesión', googleBtn:'Iniciar con Google', firstHintTitle:'¿Primera vez?', firstHintBody:'Inicia con Google y un gerente te aprobará. Usa tu correo de trabajo.', loading:'Iniciando…', logout:'Cerrar sesión', enter:'Entrar', pendingT:'Esperando aprobación', pendingD:'Tu solicitud fue enviada. Entrarás automáticamente al ser aprobado.', blockedT:'Acceso bloqueado', blockedD:'Esta cuenta fue bloqueada. Contacta a un gerente.', popupBlocked:'Popup bloqueado. Reintentando…', signinErr:'Error de inicio: ' },
};
let LANG = (function(){
  for (const k of ['tasks.lang','kimchi_lang','hub.lang']) { const v = localStorage.getItem(k); if (v && I18N[v]) return v; }
  const nav = (navigator.language || 'ko').slice(0,2).toLowerCase();
  return I18N[nav] ? nav : 'ko';
})();
function t(k){ return (I18N[LANG] && I18N[LANG][k]) || I18N.ko[k] || k; }
function applyLang(){
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.l === LANG));
  document.getElementById('title').textContent = t('title');
  document.getElementById('subtitle').textContent = t('subtitle');
  document.getElementById('googleBtnText').textContent = t('googleBtn');
  document.getElementById('firstHintTitle').textContent = t('firstHintTitle');
  document.getElementById('firstHintBody').textContent = t('firstHintBody');
  document.getElementById('loadingText').textContent = t('loading');
  document.getElementById('btnLogout').textContent = t('logout');
  document.getElementById('btnEnter').textContent = t('enter');
  document.documentElement.lang = LANG;
  // 로그인 화면 한 번에 받기 — 지점 + 이름 placeholder/옵션 라벨도 다국어
  const placeholders = {
    branchDefault:  { ko:'📍 지점 선택 / Branch',         en:'📍 Select Branch',          es:'📍 Sucursal' },
    nameDefault:    { ko:'👤 본인 이름 선택 / Your Name (지점 선택 후)',
                      en:'👤 Select your name (after branch)',
                      es:'👤 Selecciona tu nombre (después de sucursal)' },
    customPh:       { ko:'또는 직접 입력 / Or type your name',
                      en:'Or type your name',
                      es:'O escribe tu nombre' },
    emPh:           { ko:'비밀번호 / Password', en:'Password', es:'Contraseña' },
    emBtnT:         { ko:'이메일로 로그인',     en:'Sign in with email', es:'Iniciar con email' },
    orLabel:        { ko:'또는',                en:'or',                 es:'o' },
  };
  const set = (id, key) => { const el = document.getElementById(id); if (el && placeholders[key]) el.textContent = placeholders[key][LANG] || placeholders[key].ko; };
  set('loginBranchDefault', 'branchDefault');
  set('loginNameDefault', 'nameDefault');
  const cust = document.getElementById('loginNameCustom');
  if (cust) cust.placeholder = placeholders.customPh[LANG] || placeholders.customPh.ko;
  const pwd = document.getElementById('emPwd');
  if (pwd) pwd.placeholder = placeholders.emPh[LANG] || placeholders.emPh.ko;
  const btnT = document.getElementById('emBtnText');
  if (btnT) btnT.textContent = placeholders.emBtnT[LANG] || placeholders.emBtnT.ko;
  const orL = document.getElementById('orLabel');
  if (orL) orL.textContent = placeholders.orLabel[LANG] || placeholders.orLabel.ko;
  // 지점 dropdown 라벨 갱신 (언어 바뀌면 지점 이름도 바뀜)
  const bSel = document.getElementById('loginBranch');
  if (bSel && bSel.options.length > 1) {
    const cur = bSel.value;
    for (const b of BRANCHES) {
      const opt = Array.from(bSel.options).find(o => o.value === b.id);
      if (opt) opt.textContent = '📍 ' + (b[LANG] || b.ko);
    }
    bSel.value = cur;
  }
}
window.setLang = function(l){ if (!I18N[l]) return; LANG = l; ['tasks.lang','kimchi_lang','hub.lang'].forEach(k => localStorage.setItem(k, l)); applyLang(); renderProfile(); };
applyLang();

function show(viewId){ ['signinView','loadingView','statusView'].forEach(id => document.getElementById(id).style.display = id === viewId ? '' : 'none'); }
function showError(msg){
  const el = document.getElementById('err');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

let __currentProfile = null;
function renderProfile(){
  const u = auth.currentUser;
  if (!u || !__currentProfile) return;
  document.getElementById('meImg').src = u.photoURL || '';
  document.getElementById('meName').textContent = __currentProfile.name || u.displayName || '';
  document.getElementById('meEmail').textContent = u.email;
  const card = document.getElementById('statusCard');
  const enterBtn = document.getElementById('btnEnter');
  if (__currentProfile.status === 'approved') {
    card.className = 'status-card';
    card.style.background = '#f0fdf4';
    card.style.border = '2px solid #bbf7d0';
    card.style.color = '#15803d';
    card.innerHTML = `<div class="ic">✅</div><div class="t">${LANG==='ko'?'승인 완료':LANG==='en'?'Approved':'Aprobado'}</div><div class="d">${escapeHtml(__currentProfile.role||'')}${__currentProfile.branch && __currentProfile.branch!=='*' ? ' · '+escapeHtml(__currentProfile.branch) : ''}</div>`;
    enterBtn.style.display = '';
  } else if (__currentProfile.status === 'pending') {
    card.className = 'status-card pending';
    card.innerHTML = `<div class="ic">⏳</div><div class="t">${t('pendingT')}</div><div class="d">${t('pendingD')}</div>`;
    enterBtn.style.display = 'none';
  } else if (__currentProfile.status === 'blocked') {
    card.className = 'status-card blocked';
    card.innerHTML = `<div class="ic">🚫</div><div class="t">${t('blockedT')}</div><div class="d">${t('blockedD')}</div>`;
    enterBtn.style.display = 'none';
  }
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

// 지점 + 이름을 chat.me 에 미리 저장 — 로그인 후 chat.html 등에서
// '이름 선택' 모달이 다시 안 뜨게. onAuthStateChanged 콜백에서도
// preserveExistingName 로 보존됨.
function _captureLoginIdentity(){
  const branchId = document.getElementById('loginBranch').value || '';
  const fromSel = document.getElementById('loginName').value || '';
  const fromCustom = (document.getElementById('loginNameCustom').value || '').trim();
  const name = fromCustom || fromSel;
  if (!branchId || !name) return null;
  // role 추론 — select option 의 data-role 또는 employees 캐시에서
  const sel = document.getElementById('loginName');
  let role = sel.options[sel.selectedIndex]?.dataset.role || '';
  if (!role && fromCustom) {
    try {
      const data = JSON.parse(localStorage.getItem('shifts.' + branchId) || 'null');
      const emp = data?.employees?.find(e => e.name && e.name.toLowerCase() === fromCustom.toLowerCase());
      role = emp?.role || '';
    } catch(_){}
  }
  return { name, branch: branchId, role };
}
function _saveChatMe(identity, fbUser, profile){
  if (!identity || !identity.name || !identity.branch) return false;
  try {
    const existing = JSON.parse(localStorage.getItem('chat.me') || '{}');
    const isManagerRole = ['OWNER','EXECUTIVE','MANAGER','ASSISTANT_MANAGER','SUPERVISOR'].includes(String(identity.role || '').toUpperCase());
    const next = Object.assign({}, existing, {
      uid: fbUser?.uid || existing.uid,
      email: fbUser?.email || existing.email,
      name: identity.name,
      branch: identity.branch,
      role: identity.role || (profile && profile.role) || existing.role || '',
      photoURL: fbUser?.photoURL || existing.photoURL,
      isManager: isManagerRole,
      authProvider: existing.authProvider || 'pre-set',
    });
    localStorage.setItem('chat.me', JSON.stringify(next));
    try { window.dispatchEvent(new Event('km-identity-changed')); } catch(_) {}
    return true;
  } catch(e) { console.warn('saveChatMe', e); return false; }
}

window.doEmailSignIn = async function(){
  const email = (document.getElementById('emEmail').value || '').trim();
  const pwd = document.getElementById('emPwd').value || '';
  if (!email || !pwd) { showError('이메일과 비밀번호를 입력하세요.'); return; }
  // 지점·이름이 비어있어도 부트스트랩 어드민 (DJ/B.H.K) 은 통과 — 그 외는 권장
  const boot = bootstrapFor(email);
  const id = _captureLoginIdentity();
  if (!boot && !id) {
    const msg = (LANG==='en') ? 'Please pick your branch and name first.'
              : (LANG==='es') ? 'Selecciona la sucursal y tu nombre primero.'
              :                 '지점과 본인 이름을 먼저 선택해주세요.';
    showError(msg);
    return;
  }
  // 미리 chat.me 저장 — 로그인 직후 chat.html 등에서 '이름 선택' 다시 안 뜨도록
  if (id) _saveChatMe(id, null, null);
  const btn = document.getElementById('emBtn');
  btn.disabled = true;
  show('loadingView');
  try {
    await signInWithEmailAndPassword(auth, email, pwd);
    // onAuthStateChanged below takes over from here
  } catch (e) {
    btn.disabled = false;
    show('signinView');
    showError(t('signinErr') + (e.code || e.message || 'unknown'));
  }
};

window.doGoogleSignIn = async function(){
  // Google 계정도 지점 + 이름 미리 잡았으면 그대로 chat.me 에 저장
  const id = _captureLoginIdentity();
  if (id) _saveChatMe(id, null, null);
  const btn = document.getElementById('googleBtn');
  btn.disabled = true;
  show('loadingView');
  try {
    await signInWithPopup(auth, provider);
    // onAuthStateChanged below will take it from here
  } catch (e) {
    btn.disabled = false;
    show('signinView');
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user') {
      // Popup blocked — fall back to redirect flow
      try { await signInWithRedirect(auth, provider); return; } catch(_){}
    }
    showError(t('signinErr') + (e.code || e.message || 'unknown'));
  }
};

// 페이지 로드 시 지점 dropdown 즉시 채우기
fillLoginBranches();

window.doSignOut = async function(){
  try { await signOut(auth); } catch(e){}
  __currentProfile = null;
  show('signinView');
};

window.goHome = function(){
  const params = new URLSearchParams(location.search);
  const ret = params.get('return');
  // Only allow same-origin relative returns
  if (ret && ret.startsWith('/') && !ret.startsWith('//')) {
    location.replace(ret);
  } else {
    location.replace('./hub.html');
  }
};

let __unsub = null;
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    if (__unsub) { try{__unsub();}catch(e){} __unsub = null; }
    show('signinView');
    return;
  }
  show('loadingView');
  const userRef = ref(db, 'users/' + user.uid);
  // First-time login: create record and bootstrap admins
  let snap;
  try { snap = await get(userRef); } catch(e){ console.warn(e); }
  if (!snap || !snap.exists()) {
    const boot = bootstrapFor(user.email);
    const profile = {
      email: user.email,
      name: boot?.name || user.displayName || user.email.split('@')[0],
      photoURL: user.photoURL || null,
      status: boot ? 'approved' : 'pending',
      role: boot?.role || null,
      branch: boot?.branch || null,
      createdAt: Date.now(),
      approvedAt: boot ? Date.now() : null,
      approvedBy: boot ? 'bootstrap' : null,
    };
    try { await set(userRef, profile); } catch(e){ showError('계정 생성 실패: ' + e.message); }
  } else {
    // Existing record — if the user is a bootstrap admin (added to the
    // hardcoded list later, or whose role is missing), upgrade them to
    // approved on-the-fly so they don't get stuck on "매니저 승인 대기".
    const existing = snap.val() || {};
    const boot = bootstrapFor(user.email);
    if (boot && (existing.status !== 'approved' || !existing.role)) {
      try {
        await set(userRef, Object.assign({}, existing, {
          status: 'approved',
          role: boot.role,
          branch: boot.branch,
          name: existing.name || boot.name,
          approvedAt: existing.approvedAt || Date.now(),
          approvedBy: existing.approvedBy || 'bootstrap-upgrade',
        }));
      } catch (e) { console.warn('bootstrap-upgrade failed:', e); }
    }
  }
  // Subscribe so manager approval applies live
  if (__unsub) { try{__unsub();}catch(e){} }
  __unsub = onValue(userRef, (snap2) => {
    __currentProfile = snap2.val();
    if (!__currentProfile) return;
    // Sync chat.me so other pages' sidebar gates pick up the role
    // (manager-only links, payroll access, etc) without a separate
    // "Select Your Name" step. Branch defaults to MIAMI when '*'.
    //
    // PRESERVE PERSONAL NAME: shared accounts (staff@/manager@) have a
    // generic profile name like "Staff" or "Manager". If a staff member
    // has already set their real name via the "Select Your Name" dialog,
    // don't overwrite it on every login — chat messages would all show
    // as "Staff" otherwise. Same for branch when the staff is at a
    // specific store but the shared profile says branch:'*'.
    try {
      const existing = (() => { try { return JSON.parse(localStorage.getItem('chat.me') || 'null'); } catch(_) { return null; } })();
      const profileName = __currentProfile.name || user.displayName || user.email.split('@')[0];
      const isSharedAccount = (user.email === 'staff@miamikimchi.com' || user.email === 'manager@miamikimchi.com');
      // 로그인 화면에서 '본인 이름 + 지점' 을 미리 골랐다면 그 값을 최우선 보존.
      // (Pembroke Pines 등 공유 계정 로그인 — 한 번에 다 처리하는 신규 흐름)
      const presetIdentity = _captureLoginIdentity();
      // If user has an existing personal chat.me name and is on a shared
      // account, keep their personal name. Otherwise use the profile name.
      const name = (presetIdentity && presetIdentity.name)
        || ((isSharedAccount && existing && existing.name && existing.name !== 'Staff' && existing.name !== 'Manager')
            ? existing.name
            : profileName);
      const profileBranch = (__currentProfile.branch && __currentProfile.branch !== '*')
        ? __currentProfile.branch
        : null;
      const branch = (presetIdentity && presetIdentity.branch)
        || profileBranch
        || (existing && existing.branch)
        || localStorage.getItem('hub.branch')
        || 'MIAMI';
      const role = (presetIdentity && presetIdentity.role)
        || __currentProfile.role
        || (existing && existing.role)
        || '';
      const chatMe = Object.assign({}, existing || {}, {
        name, branch, role,
        isManager: ['OWNER','EXECUTIVE','MANAGER','ASSISTANT_MANAGER','SUPERVISOR'].includes(String(role).toUpperCase())
      });
      localStorage.setItem('chat.me', JSON.stringify(chatMe));
      try { window.dispatchEvent(new Event('km-identity-changed')); } catch(_) {}
    } catch(_) {}
    show('statusView');
    renderProfile();
    // Auto-enter as soon as approved (covers both initial bootstrap and live approval)
    if (__currentProfile.status === 'approved') {
      // Keep the user on the status screen for ~1 second so they see "approved",
      // then take them where they were headed
      setTimeout(() => {
        const params = new URLSearchParams(location.search);
        const ret = params.get('return');
        if (ret && ret.startsWith('/') && !ret.startsWith('//')) location.replace(ret);
        else location.replace('./hub.html');
      }, 800);
    }
  });
});

getRedirectResult(auth).catch(()=>{});
