<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>김치마트 — 로그인</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:linear-gradient(135deg,#1a5c3a,#2e7d32);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1f2937}
.card{background:#fff;border-radius:24px;max-width:420px;width:100%;padding:36px 32px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.logo{width:74px;height:74px;border-radius:18px;background:linear-gradient(135deg,#1a5c3a,#2e7d32);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:900;margin:0 auto 18px}
h1{font-size:1.4em;font-weight:800;color:#1a5c3a;text-align:center;margin-bottom:6px}
.sub{font-size:.92em;color:#6b7280;text-align:center;margin-bottom:30px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border:1.5px solid #d1d5db;color:#1f2937;border-radius:14px;padding:14px 18px;font-size:1em;font-weight:600;cursor:pointer;width:100%;font-family:inherit;transition:.15s}
.gbtn:hover{background:#f9fafb;border-color:#1a5c3a;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.gbtn:disabled{opacity:.5;cursor:wait}
.gbtn img{width:22px;height:22px}
.divider{display:flex;align-items:center;gap:10px;color:#9ca3af;font-size:.78em;margin:18px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
.note{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;font-size:.82em;color:#6b7280;line-height:1.5;margin-top:18px}
.note b{color:#1a5c3a}
.lang-toggle{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.lang-toggle button{background:transparent;border:1px solid #e5e7eb;color:#6b7280;border-radius:8px;padding:4px 10px;font-size:.76em;font-weight:700;cursor:pointer}
.lang-toggle button.active{background:#1a5c3a;color:#fff;border-color:#1a5c3a}
.error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:10px;padding:10px 14px;font-size:.86em;margin-top:14px;display:none}
.error.show{display:block}
.profile{display:flex;align-items:center;gap:12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin-bottom:18px}
.profile img{width:42px;height:42px;border-radius:50%}
.profile .nm{font-weight:700;font-size:.92em}
.profile .em{font-size:.76em;color:#9ca3af}
.status-card{border-radius:14px;padding:18px;margin-top:14px;text-align:center}
.status-card.pending{background:#fffbeb;border:2px solid #fde68a;color:#92400e}
.status-card.blocked{background:#fef2f2;border:2px solid #fecaca;color:#991b1b}
.status-card .ic{font-size:2.4em;margin-bottom:6px}
.status-card .t{font-weight:800;font-size:1em;margin-bottom:4px}
.status-card .d{font-size:.85em;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button{flex:1;background:#fff;border:1.5px solid #e5e7eb;color:#374151;border-radius:10px;padding:10px;font-weight:700;font-size:.88em;cursor:pointer;font-family:inherit}
.actions button.primary{background:#1a5c3a;color:#fff;border-color:#1a5c3a}
/* 모바일 친화 — 터치 영역 키우기 + 키보드 가리지 않게 */
input, select { font-size: 16px !important; min-height: 48px; }
.gbtn { min-height: 52px; font-size: 1.02em; }
@media (max-width: 600px) { .card { padding: 24px 20px; max-width: 100% } }
/* 빠른 로그인 — 재방문자 전용 큰 버튼 */
.quick-card{background:linear-gradient(135deg,#1a5c3a,#2e7d32);color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px;cursor:pointer;border:0;width:100%;font-family:inherit;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 4px 14px rgba(26,92,58,.3)}
.quick-card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(26,92,58,.4)}
.quick-card .ic{font-size:1.8em}
.quick-card .info{flex:1;min-width:0}
.quick-card .lbl{font-size:.72em;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.quick-card .nm{font-size:1.08em;font-weight:800;line-height:1.2;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quick-card .br{font-size:.82em;opacity:.9;margin-top:2px}
.quick-card .arrow{font-size:1.3em;opacity:.7}
.alt-link{display:block;width:100%;text-align:center;color:#6b7280;font-size:.84em;background:transparent;border:0;padding:6px;cursor:pointer;font-family:inherit;margin-bottom:8px}
.alt-link:hover{color:#1a5c3a;text-decoration:underline}
/* 비밀번호 입력 + 표시 토글 */
.pwd-wrap{position:relative;margin-bottom:8px}
.pwd-wrap input{width:100%;padding:11px 44px 11px 13px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:.95em;font-family:inherit;outline:0;box-sizing:border-box}
.pwd-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;font-size:1.1em;cursor:pointer;padding:8px 10px;color:#6b7280}
.pwd-toggle:hover{color:#1a5c3a}
/* 빠른 계정 픽 - 공유 계정용 */
.shared-pick{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.shared-pick button{flex:1;min-width:120px;background:#f8fafc;border:1.5px solid #e5e7eb;color:#374151;border-radius:9px;padding:8px;font-size:.78em;font-weight:700;cursor:pointer;font-family:inherit}
.shared-pick button:hover{background:#f0fdf4;border-color:#1a5c3a;color:#1a5c3a}
.shared-label{font-size:.74em;color:#9ca3af;text-align:center;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
</style>

<body class="kmd">
<div class="card">
  <div class="lang-toggle">
    <button data-l="ko" onclick="setLang('ko')">한국어</button>
    <button data-l="en" onclick="setLang('en')">English</button>
    <button data-l="es" onclick="setLang('es')">Español</button>
  </div>
  <img class="brand-logo" src="./pwa-assets/kimchi-text-logo.png?v=2" alt="KIMCHI">
  <h1 id="title">김치마트</h1>
  <div class="sub" id="subtitle">매니저 앱 · 직원 로그인</div>
  <div id="signinView">
    <!-- 재방문자 빠른 로그인 — chat.me 에 정보 있으면 큰 버튼 한 번에. -->
    <button class="quick-card" id="quickContinue" onclick="doQuickContinue()" style="display:none">
      <div class="ic">👋</div>
      <div class="info">
        <div class="lbl" id="quickLbl">계속하기 / Continue as</div>
        <div class="nm" id="quickNm">—</div>
        <div class="br" id="quickBr">—</div>
      </div>
      <div class="arrow">▶</div>
    </button>
    <button class="alt-link" id="altLink" onclick="showFullLogin()" style="display:none">
      다른 계정으로 로그인 / Use different account
    </button>

    <div id="fullLoginForm">
      <button class="gbtn" id="googleBtn" onclick="doGoogleSignIn()">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
        <span id="googleBtnText">Google 계정으로 로그인</span>
      </button>
      <div style="display:flex;align-items:center;gap:10px;margin:14px 0;color:#9ca3af;font-size:.82em">
        <span style="flex:1;height:1px;background:#e5e7eb"></span>
        <span id="orLabel">또는</span>
        <span style="flex:1;height:1px;background:#e5e7eb"></span>
      </div>

      <!-- 공유 계정 빠른 선택 제거 — 신입 직원에게 매니저/스태프 이메일이 노출되고
           브라우저 자동완성으로 비번까지 채워져 권한 탈취 위험. 본인 이메일/비번은
           아래 input 에 직접 입력하도록. -->

      <input id="emEmail" name="emEmail" type="email" placeholder="이메일 / Email"
        autocomplete="off" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false"
        style="width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:inherit;outline:0;margin-bottom:8px;box-sizing:border-box">
      <div class="pwd-wrap">
        <input id="emPwd" name="emPwd" type="password" placeholder="비밀번호 / Password"
          autocomplete="new-password" data-lpignore="true" data-form-type="other"
          onkeydown="if(event.key==='Enter') doEmailSignIn()">
        <button type="button" class="pwd-toggle" onclick="togglePwd()" id="pwdToggle" aria-label="show password">👁️</button>
      </div>

      <!-- 지점 + 본인 이름 — 한 번에 다 처리 (Pembroke Pines 등 공유 계정용).
           로그인 성공 시 chat.me 에 같이 저장되어 별도 '이름 선택' 단계 불필요. -->
      <div style="display:flex;gap:8px;margin-top:12px;margin-bottom:8px">
        <select id="loginBranch" onchange="onLoginBranchChange()"
          style="flex:1;padding:13px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:inherit;outline:0;background:#fff;cursor:pointer">
          <option value="" id="loginBranchDefault">📍 지점 선택 / Branch</option>
        </select>
      </div>
      <select id="loginName"
        style="width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:inherit;outline:0;margin-bottom:8px;box-sizing:border-box;background:#fff;cursor:pointer">
        <option value="" id="loginNameDefault">👤 본인 이름 선택 / Your Name (지점 선택 후)</option>
      </select>
      <input id="loginNameCustom" type="text" placeholder="또는 직접 입력 / Or type your name" autocomplete="name"
        style="width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:inherit;outline:0;margin-bottom:8px;box-sizing:border-box">

      <!-- 신규 가입자 — 매장 PIN 입력 (4자리). 기존 가입자는 비워두고 로그인 가능. -->
      <input id="loginJoinPin" type="text" inputmode="numeric" pattern="\d{4}" maxlength="4"
        placeholder="🔐 매장 PIN (신규 가입자만 / 4자리)"
        autocomplete="off"
        style="width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:inherit;outline:0;margin-bottom:12px;box-sizing:border-box;text-align:center;letter-spacing:.15em;font-size:1em;font-weight:700">

      <button class="gbtn" id="emBtn" onclick="doEmailSignIn()" style="background:#1a5c3a;color:#fff;border-color:#1a5c3a;justify-content:center">
        <span id="emBtnText">이메일로 로그인</span>
      </button>

      <!-- 전화번호 + SMS 인증 로그인 (로그인 어려운 직원용 · 1회 인증 후 유지) -->
      <div style="display:flex;align-items:center;gap:10px;margin:14px 0;color:#9ca3af;font-size:.82em">
        <span style="flex:1;height:1px;background:#e5e7eb"></span>
        <span id="orPhoneLabel">또는 전화번호로</span>
        <span style="flex:1;height:1px;background:#e5e7eb"></span>
      </div>
      <div id="phoneStep1">
        <input id="phNumber" type="tel" inputmode="tel" placeholder="📱 휴대폰 번호 (예: 954-123-4567)"
          autocomplete="tel"
          style="width:100%;padding:13px;border:1.5px solid #e5e7eb;border-radius:10px;font-family:inherit;outline:0;margin-bottom:8px;box-sizing:border-box;text-align:center;letter-spacing:.02em">
        <button class="gbtn" id="phSendBtn" onclick="doSendPhoneCode()" style="background:#0277BD;color:#fff;border-color:#0277BD;justify-content:center">
          <span id="phSendText">📩 인증코드 문자 받기</span>
        </button>
      </div>
      <div id="phoneStep2" style="display:none">
        <div style="font-size:.85em;color:#0277BD;margin:4px 0 8px;text-align:center" id="phSentMsg">📨 문자로 받은 6자리 코드를 입력하세요</div>
        <input id="phCode" type="text" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="– – – – – –"
          autocomplete="one-time-code"
          onkeydown="if(event.key==='Enter') doVerifyPhoneCode()"
          style="width:100%;padding:13px;border:1.5px solid #0277BD;border-radius:10px;font-family:inherit;outline:0;margin-bottom:8px;box-sizing:border-box;text-align:center;letter-spacing:.4em;font-size:1.3em;font-weight:700">
        <button class="gbtn" id="phVerifyBtn" onclick="doVerifyPhoneCode()" style="background:#0277BD;color:#fff;border-color:#0277BD;justify-content:center">
          <span id="phVerifyText">✅ 코드 확인 · 로그인</span>
        </button>
        <button class="gbtn" id="phResetBtn" onclick="resetPhoneLogin()" style="justify-content:center;margin-top:6px;font-size:.85em">
          <span>↩︎ 번호 다시 입력</span>
        </button>
      </div>
      <div id="recaptcha-container" style="margin-top:8px"></div>

      <div class="error" id="err"></div>
      <div class="note" id="firstHint">
        <b id="firstHintTitle">처음 사용?</b><br>
        <span id="firstHintBody">구글 계정으로 로그인하면 매니저가 승인해드립니다. 본인 직장 이메일을 사용하세요.</span>
      </div>
    </div>
  </div>
  <div id="loadingView" style="display:none;text-align:center;padding:30px 0">
    <div style="font-size:2em">⏳</div>
    <div style="font-size:.95em;color:#6b7280;margin-top:6px" id="loadingText">로그인 중…</div>
  </div>
  <div id="statusView" style="display:none">
    <div class="profile">
      <img id="meImg" src="" alt="">
      <div>
        <div class="nm" id="meName"></div>
        <div class="em" id="meEmail"></div>
      </div>
    </div>
    <div id="statusCard"></div>
    <div class="actions">
      <button onclick="doSignOut()" id="btnLogout">로그아웃</button>
      <button class="primary" onclick="goHome()" id="btnEnter" style="display:none">입장</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, indexedDBLocalPersistence, RecaptchaVerifier, signInWithPhoneNumber } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getDatabase, ref, get, set, onValue } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

const cfg = { apiKey:"AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4", authDomain:"kimchi-mart-order.firebaseapp.com", databaseURL:"https://kimchi-mart-order-default-rtdb.firebaseio.com", projectId:"kimchi-mart-order" };
const app = getApps().length ? getApp() : initializeApp(cfg);
const auth = getAuth(app);
const db = getDatabase(app);
// auth-gate.js 와 동일 — IndexedDB 우선, localStorage fallback. 한 번 로그인
// 하면 페이지 이동 / 앱 재시작에도 세션 유지됨.
setPersistence(auth, indexedDBLocalPersistence)
  .catch(() => setPersistence(auth, browserLocalPersistence))
  .catch(()=>{});
const provider = new GoogleAuthProvider();

const BOOTSTRAP_ADMINS = {
  // 사장 계정만 자동 OWNER/EXECUTIVE 승인. 다른 모든 계정은 매니저 명시적 승인 필요.
  // 🔒 2026-05-28: 공유 계정 (manager@/staff@miamikimchi.com) 제거 — 외부 유출 / 퇴사자
  // 비밀번호 보유 시 자동 매니저 권한 입장 가능했음. 이제 모든 신규 로그인은 pending.
  // 🆕 2026-05-28: Sun Kim 도 DJ 와 동일한 OWNER (branch '*') — 새 디바이스 재로그인 시 자동 권한 유지.
  'specialmasterdj@gmail.com':  { role: 'OWNER',     branch: '*', name: 'DJ' },
  'byhoki64@gmail.com':         { role: 'EXECUTIVE', branch: '*', name: 'B.H.K' },
  'kdaisy81@yahoo.com':         { role: 'OWNER',     branch: '*', name: 'Sun Kim' },
};
function bootstrapFor(email){ return email ? (BOOTSTRAP_ADMINS[email.toLowerCase()] || null) : null; }
// 전화번호 로그인 관리자 자동승인 (E.164). 전화 사용자는 email 이 없으므로 별도 맵.
// 번호는 +1XXXXXXXXXX 형식. 관리자 추가 시 여기에만 넣으면 됨.
const BOOTSTRAP_PHONES = {
  '+13059264744': { role: 'OWNER', branch: '*', name: 'DJ' },
};
function bootstrapForPhone(phone){ return phone ? (BOOTSTRAP_PHONES[String(phone).trim()] || null) : null; }
function bootstrapForUser(user){ return bootstrapFor(user && user.email) || bootstrapForPhone(user && user.phoneNumber); }

// 지점 + 이름 한 번에 — Pembroke Pines 등 공유 계정 직원이 로그인 단계에서
// 바로 본인 정보를 입력할 수 있도록. 로그인 성공 시 chat.me 에 저장되어
// chat.html 의 별도 '이름 선택' 모달이 안 뜸.
const BRANCHES = [
  { id:'MIAMI',           ko:'마이애미',       en:'Miami',           es:'Miami' },
  { id:'PEMBROKE_PINES',  ko:'펨브로크 파인즈', en:'Pembroke Pines',  es:'Pembroke Pines' },
  { id:'HOLLYWOOD',       ko:'할리우드',       en:'Hollywood',       es:'Hollywood' },
  { id:'CORAL_SPRINGS',   ko:'코럴 스프링스',  en:'Coral Springs',   es:'Coral Springs' },
  { id:'LASOLAS',         ko:'라스올라스',     en:'Las Olas',        es:'Las Olas' },
  { id:'WEST_PALM',       ko:'웨스트 팜 비치', en:'West Palm Beach', es:'West Palm Beach' },
];
function fillLoginBranches(){
  const sel = document.getElementById('loginBranch');
  if (!sel || sel.options.length > 1) return; // already filled
  // Restore last selection so returning users don't have to re-pick
  let lastBranch = ''; let lastName = '';
  try {
    const me = JSON.parse(localStorage.getItem('chat.me') || 'null');
    if (me) { lastBranch = me.branch || ''; lastName = me.name || ''; }
  } catch(_){}
  for (const b of BRANCHES) {
    const opt = document.createElement('option');
    opt.value = b.id;
    opt.textContent = '📍 ' + (b[LANG] || b.ko);
    if (b.id === lastBranch) opt.selected = true;
    sel.appendChild(opt);
  }
  if (lastBranch) {
    onLoginBranchChange();
    // pre-select last name once list loads
    setTimeout(() => {
      const nameSel = document.getElementById('loginName');
      const opt = Array.from(nameSel.options).find(o => o.value === lastName);
      if (opt) opt.selected = true;
      else if (lastName) document.getElementById('loginNameCustom').value = lastName;
    }, 800);
  }
}

const FB_DB_URL = 'https://kimchi-mart-order-default-rtdb.firebaseio.com';
// 직원 데이터 정규화 — 레거시 string 배열 / 잘못된 형식도 안전하게.
// 폰에서 사파리/크롬 캐시가 옛 포맷을 갖고 있을 때 dropdown 이 깨지는 경우 방지.
function _normalizeEmployees(arr){
  if (!Array.isArray(arr)) return [];
  return arr.map(e => {
    if (!e) return null;
    if (typeof e === 'string') return { name: e.trim() };
    if (typeof e === 'object') {
      const name = String(e.name || e.fullName || e.displayName || '').trim();
      if (!name) return null;
      return { name, role: String(e.role || '').trim() };
    }
    return null;
  }).filter(Boolean);
}

// 명단 비었을 때 시각적 강조 + 직접 입력 input 자동 focus.
// "이름 선택이 안 됨" 신고의 주된 원인 — dropdown 비어있어 막혔다고 느낌.
function _highlightCustomInput(message){
  const cust = document.getElementById('loginNameCustom');
  if (!cust) return;
  cust.style.borderColor = '#1a5c3a';
  cust.style.borderWidth = '2px';
  cust.style.background = '#f0fdf4';

window.onLoginBranchChange = async function(){
  const branchId = document.getElementById('loginBranch').value;
  const sel = document.getElementById('loginName');
  if (!branchId) {
    sel.innerHTML = '<option value="">👤 본인 이름 선택 / Your Name (지점 선택 후)</option>';
    _resetCustomInputStyle();
    return;
  }
  sel.innerHTML = '<option value="">⏳ 로딩…</option>';
  let employees = [];
  try {
    // localStorage cache 우선 — chat.html 가 평소 채워둠
    const cached = JSON.parse(localStorage.getItem('shifts.' + branchId) || 'null');
    if (cached && cached.employees) employees = _normalizeEmployees(cached.employees);
  } catch(_){}
  // RTDB fetch — 캐시 없거나 오래됐을 때.
  // 로그인 전엔 401 (auth != null) 일 수 있음 — 그러면 캐시만 사용.
  try {
    const r = await fetch(`${FB_DB_URL}/schedules/${branchId}.json`, { cache:'no-store' });
    if (r.ok) {
      const data = await r.json();
      if (data && data.employees) {
        const fresh = _normalizeEmployees(data.employees);
        if (fresh.length) {
          employees = fresh;
          try { localStorage.setItem('shifts.' + branchId, JSON.stringify(data)); } catch(_){}
        }
      }
    }
  } catch(_){}
  // OWNER 도 묶어 보여주기 (DJ, B.H.K)
  let owners = [];
  try {
    const g = JSON.parse(localStorage.getItem('shifts.global') || 'null');
    if (g && g.owners) owners = _normalizeEmployees(g.owners);
  } catch(_){}
  if (owners.length === 0) {
    try {
      const r = await fetch(`${FB_DB_URL}/schedules/_global.json`, { cache:'no-store' });
      if (r.ok) {
        const d = await r.json();
        if (d && d.owners) {
          owners = _normalizeEmployees(d.owners);
          try { localStorage.setItem('shifts.global', JSON.stringify(d)); } catch(_){}
        }
      }
    } catch(_){}
  }
  const all = [...owners, ...employees];
  if (all.length === 0) {
    // 명단 비었음 — 폰 첫 방문 + 인증 전 RTDB read 차단된 경우. 직접 입력 박스 강조.
    _highlightCustomInput('⌨️ 아래 칸에 이름을 직접 입력하세요');
    return;
  }
  _resetCustomInputStyle();
  // 옵션 표시: 사장님 DJ 본인은 OWNER 유지, 그 외 OWNER 라벨이 붙은 사람(B.H.K 등)은
  // 라벨만 숨김. 권한은 data-role 로 그대로 전달 (chat.me 에 정확히 저장).
  function _roleSuffix(role, name){
    const r = String(role||'').toUpperCase();
    if (!r) return '';
    // DJ 본인은 OWNER 라벨 유지 — 진짜 사장님
    if (r === 'OWNER' && String(name||'').toUpperCase() !== 'DJ') return '';
    return ' (' + role + ')';
  }
  sel.innerHTML = '<option value="">— 직접 입력 —</option>' +
    all.map(e => `<option value="${e.name||''}" data-role="${e.role||''}">${e.name||''}${_roleSuffix(e.role, e.name)}</option>`).join('');
};

// 지점 + 이름을 chat.me 에 미리 저장 — 로그인 후 chat.html 등에서
// '이름 선택' 모달이 다시 안 뜨게. onAuthStateChanged 콜백에서도
// preserveExistingName 로 보존됨.
function _captureLoginIdentity(){
  const branchId = document.getElementById('loginBranch').value || '';
  const fromSel = document.getElementById('loginName').value || '';
  const fromCustom = (document.getElementById('loginNameCustom').value || '').trim();
  const joinPin = (document.getElementById('loginJoinPin')?.value || '').trim();
  const name = fromCustom || fromSel;
  if (!branchId || !name) return null;
  // role 추론 — select option 의 data-role 또는 employees 캐시에서
  const sel = document.getElementById('loginName');
  let role = sel.options[sel.selectedIndex]?.dataset.role || '';
  if (!role && fromCustom) {
    try {
      const data = JSON.parse(localStorage.getItem('shifts.' + branchId) || 'null');
      const emp = data?.employees?.find(e => e.name && e.name.toLowerCase() === fromCustom.toLowerCase());
      role = emp?.role || '';
    } catch(_){}
  }
  return { name, branch: branchId, role, joinPin };
}
function _saveChatMe(identity, fbUser, profile){
  if (!identity || !identity.name || !identity.branch) return false;
  try {
    const existing = JSON.parse(localStorage.getItem('chat.me') || '{}');
    const isManagerRole = ['OWNER','EXECUTIVE','MANAGER','ASSISTANT_MANAGER','SUPERVISOR'].includes(String(identity.role || '').toUpperCase());
    const next = Object.assign({}, existing, {
      uid: fbUser?.uid || existing.uid,
      email: fbUser?.email || existing.email,
      name: identity.name,
      branch: identity.branch,
      role: identity.role || (profile && profile.role) || existing.role || '',
      photoURL: fbUser?.photoURL || existing.photoURL,
      isManager: isManagerRole,
      authProvider: existing.authProvider || 'pre-set',
    });
    localStorage.setItem('chat.me', JSON.stringify(next));
    // 신규 가입용 매장 PIN — auth-gate.js 가 신규 user 레코드 만들 때 검증.
    // sessionStorage 에 임시 저장 (보안: 페이지 닫으면 사라짐, localStorage 노출 방지).
    if (identity.joinPin) {
      try { sessionStorage.setItem('km.joinPin', identity.joinPin); } catch(_){}
    }
    try { window.dispatchEvent(new Event('km-identity-changed')); } catch(_) {}
    return true;
  } catch(e) { console.warn('saveChatMe', e); return false; }
}

};

// ===== 전화번호 + SMS 인증 (1회 인증 후 영구 세션 유지) =====
function _toE164(raw){
  let d = String(raw||'').replace(/[^\d+]/g,'');
  if (d.startsWith('+')) return d;
  d = d.replace(/\D/g,'');
  if (d.length === 10) return '+1' + d;            // US 10자리
  if (d.length === 11 && d[0] === '1') return '+' + d;
  if (d.length >= 11) return '+' + d;              // 국가코드 포함된 경우
  return '';
}

    // 폼 보여주고 이메일/지점/이름 모두 미리 채움 → 비밀번호만 입력하면 됨
    document.getElementById('quickContinue').style.display = 'none';
    document.getElementById('altLink').style.display = 'none';
    document.getElementById('fullLoginForm').style.display = '';
    if (me.email) document.getElementById('emEmail').value = me.email;
    if (me.branch) {
      const bsel = document.getElementById('loginBranch');
      bsel.value = me.branch;
      onLoginBranchChange();
      // 이름 dropdown 채워질 때까지 대기 후 선택
      setTimeout(() => {
        const nsel = document.getElementById('loginName');
        const opt = Array.from(nsel.options).find(o => o.value === me.name);
        if (opt) opt.selected = true;
        else if (me.name) document.getElementById('loginNameCustom').value = me.name;
      }, 400);
    }
    // 비번 input 으로 즉시 focus
    setTimeout(() => {
      const pwd = document.getElementById('emPwd');
      if (pwd) pwd.focus();
    }, 200);
  } catch(_) { showFullLogin(); }
};

window.showFullLogin = function(){
  document.getElementById('quickContinue').style.display = 'none';
  document.getElementById('altLink').style.display = 'none';
  document.getElementById('fullLoginForm').style.display = '';
};

window.togglePwd = function(){
  const pwd = document.getElementById('emPwd');
  const btn = document.getElementById('pwdToggle');
  if (pwd.type === 'password'){ pwd.type = 'text'; btn.textContent = '🙈'; }
  else { pwd.type = 'password'; btn.textContent = '👁️'; }
};

// 이메일 input 에서 Enter → 비밀번호로 이동, 비번에서 Enter → 제출 (already inline)
document.getElementById('emEmail')?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('emPwd')?.focus(); }
});

// 이메일 미리 채우기 — chat.me 에서 (빠른 로그인 카드 안 보이는 경우라도)
(function prefillEmail(){
  try {
    const me = JSON.parse(localStorage.getItem('chat.me') || 'null');
    if (me && me.email) {
      const e = document.getElementById('emEmail');
      if (e && !e.value) e.value = me.email;
    }
  } catch(_){}
})();

// Firebase 에러 코드 → 한/영/스 친절한 메시지
function friendlyAuthError(code){
  const map = {
    'auth/wrong-password':       { ko: '❌ 비밀번호가 틀렸습니다',         en: '❌ Wrong password',        es: '❌ Contraseña incorrecta' },
    'auth/invalid-credential':   { ko: '❌ 이메일 또는 비밀번호 오류',     en: '❌ Wrong email or password',es: '❌ Correo o contraseña incorrectos' },
    'auth/user-not-found':       { ko: '❌ 등록되지 않은 이메일',           en: '❌ Email not registered',   es: '❌ Correo no registrado' },
    'auth/invalid-email':        { ko: '❌ 이메일 형식이 올바르지 않습니다', en: '❌ Invalid email format',  es: '❌ Formato de correo inválido' },
    'auth/too-many-requests':    { ko: '⏳ 시도 너무 많음 — 잠시 후 다시',  en: '⏳ Too many attempts — try later', es: '⏳ Muchos intentos — espere' },
    'auth/network-request-failed':{ko: '⚠️ 네트워크 오류 — Wi-Fi 확인',     en: '⚠️ Network error — check Wi-Fi', es: '⚠️ Error de red' },
    'auth/user-disabled':        { ko: '🚫 계정이 비활성화됨 — 매니저 문의', en: '🚫 Account disabled',     es: '🚫 Cuenta desactivada' },
    'auth/popup-blocked':        { ko: '🚫 팝업 차단됨 — 잠시 후 자동 재시도', en: '🚫 Popup blocked', es: '🚫 Popup bloqueado' },
    'auth/popup-closed-by-user': { ko: '✕ 로그인 창 닫힘 — 다시 시도',     en: '✕ Sign-in window closed',  es: '✕ Ventana cerrada' },
  };
  const m = map[code];
  return m ? (m[LANG] || m.ko) : null;
}
window.__friendlyAuthError = friendlyAuthError;

window.doSignOut = async function(){
  try { await signOut(auth); } catch(e){}
  __currentProfile = null;
  show('signinView');
};

window.goHome = function(){
  const params = new URLSearchParams(location.search);
  const ret = params.get('return');
  // Only allow same-origin relative returns
  if (ret && ret.startsWith('/') && !ret.startsWith('//')) {
    location.replace(ret);
  } else {
    location.replace('./hub.html');
  }
};

let __unsub = null;
// 🚪 ?fresh=1 — apps.html 의 강제 로그아웃에서 도착. 살아남은 Firebase 세션이
// 있어도 자동 입장 시키지 말고 명시적 로그인 화면 노출. IndexedDB persistence
// 까지 삭제해야 새 탭/리프레시에서도 다시 안 들어옴.
//
// 🛡️ 2026-05-15: fresh 동작은 *최초 진입 1회만*. 그 후 사용자가 새로 로그인
// 하면 정상 흐름 (loadingView → statusView → redirect) 으로 들어가야 함.
// 이전 버그: __fresh 가 script-load 시점에 고정되어 사용자가 로그인해도
// onAuthStateChanged 가 'fresh 모드'로 인식 → signinView 만 다시 표시 →
// 무한 spinner. 새 fresh 모드는 1 회만, signout 끝나면 자동 해제.
let __freshMode = (function(){ try { return new URLSearchParams(location.search).get('fresh') === '1'; } catch(_){ return false; } })();
let __freshHandled = false;
async function __doFreshSignout(){
  if (__freshHandled) return;
  __freshHandled = true;
  try { await signOut(auth); } catch(_){}
  try { localStorage.removeItem('chat.me'); } catch(_){}
  try { localStorage.removeItem('hub.branch'); } catch(_){}
  try { sessionStorage.clear(); } catch(_){}
  // Firebase Auth IndexedDB persistence 강제 삭제 — signOut 이 race 로 안 지운 케이스
  try {
    if (indexedDB.databases) {
      var dbs = await indexedDB.databases();
      dbs.forEach(function(d){
        if (d.name && d.name.toLowerCase().indexOf('firebase') >= 0) {
          try { indexedDB.deleteDatabase(d.name); } catch(_){}
        }
      });
    } else {
      try { indexedDB.deleteDatabase('firebaseLocalStorageDb'); } catch(_){}
    }
  } catch(_){}
  show('signinView');
  try { history.replaceState({}, '', location.pathname); } catch(_){}
  // 🔑 fresh 모드 해제 — 이제부터 새 로그인 시도는 정상 흐름으로
  __freshMode = false;
}
// fresh=1 으로 도착하면 onAuthStateChanged 가 user 를 받기 전에 미리 시작 —
// IndexedDB persistence 가 user 를 복원하기 전에 삭제 끝내려는 의도.
if (__freshMode) { __doFreshSignout(); }

onAuthStateChanged(auth, async (user) => {
  // fresh 모드는 *아직 signout 안 끝났을 때만* 살아남은 user 차단.
  // signout 끝나면 __freshMode=false 라서 새 로그인은 정상 처리.
  if (__freshMode) {
    if (!__freshHandled) await __doFreshSignout();
    else show('signinView');
    return;
  }
  if (!user) {
    if (__unsub) { try{__unsub();}catch(e){} __unsub = null; }
    show('signinView');
    return;
  }
  show('loadingView');
  // 🛡️ Safety net — 10초 이상 loadingView 머무르면 자동으로 signinView 복귀 +
  // 진단 메시지 표시. 이전엔 onValue 가 null 던지면 무한 spinner 였음.
  const __loadingGuard = setTimeout(() => {
    if (document.getElementById('loadingView').style.display === '') {
      show('signinView');
      showError('로그인이 완료되지 않았습니다. 다시 시도하거나 로그아웃 후 재로그인 해주세요. (timeout)');
    }
  }, 10000);
  const userRef = ref(db, 'users/' + user.uid);
  // First-time login: create record and bootstrap admins
  let snap, getErr = null;
  try { snap = await get(userRef); } catch(e){ getErr = e; console.warn('[auth] get(userRef) failed:', e); }
  if (getErr) {
    clearTimeout(__loadingGuard);
    show('signinView');
    showError('계정 정보 조회 실패: ' + (getErr.message || getErr) + ' — 다시 로그인 해주세요.');
    return;
  }
  if (!snap || !snap.exists()) {
    const boot = bootstrapForUser(user);
    const profile = {
      email: user.email || null,
      phone: user.phoneNumber || null,
      name: boot?.name || user.displayName || (user.email ? user.email.split('@')[0] : (user.phoneNumber || ('user-' + String(user.uid).slice(0,5)))),
      photoURL: user.photoURL || null,
      status: boot ? 'approved' : 'pending',
      role: boot?.role || null,
      branch: boot?.branch || null,
      createdAt: Date.now(),
      approvedAt: boot ? Date.now() : null,
      approvedBy: boot ? 'bootstrap' : null,
    };
    try { await set(userRef, profile); } catch(e){
      clearTimeout(__loadingGuard);
      show('signinView');
      showError('계정 생성 실패: ' + (e.message || e) + ' — Firebase 규칙 또는 네트워크 문제일 수 있습니다.');
      return;
    }
  } else {
    // Existing record — if the user is a bootstrap admin (added to the
    // hardcoded list later, or whose role is missing), upgrade them to
    // approved on-the-fly so they don't get stuck on "매니저 승인 대기".
    const existing = snap.val() || {};
    const boot = bootstrapForUser(user);
    if (boot && (existing.status !== 'approved' || !existing.role)) {
      try {
        await set(userRef, Object.assign({}, existing, {
          status: 'approved',
          role: boot.role,
          branch: boot.branch,
          name: existing.name || boot.name,
          approvedAt: existing.approvedAt || Date.now(),
          approvedBy: existing.approvedBy || 'bootstrap-upgrade',
        }));
      } catch (e) { console.warn('bootstrap-upgrade failed:', e); }
    }
  }
  // Subscribe so manager approval applies live
  if (__unsub) { try{__unsub();}catch(e){} }
  __unsub = onValue(userRef, (snap2) => {
    __currentProfile = snap2.val();
    if (!__currentProfile) {
      // 🚨 레코드 없음 — set() 실패했거나 RTDB 규칙으로 막힘. 무한 spinner
      // 대신 sign-in 화면으로 복귀 + 진단 메시지.
      clearTimeout(__loadingGuard);
      show('signinView');
      showError('계정 정보를 불러올 수 없습니다 (uid=' + (user.uid||'?').slice(0,8) + '). 매니저에게 문의하거나 다시 로그인 해주세요.');
      return;
    }
    clearTimeout(__loadingGuard);
    // Sync chat.me so other pages' sidebar gates pick up the role
    // (manager-only links, payroll access, etc) without a separate
    // "Select Your Name" step. Branch defaults to MIAMI when '*'.
    //
    // PRESERVE PERSONAL NAME: shared accounts (staff@/manager@) have a
    // generic profile name like "Staff" or "Manager". If a staff member
    // has already set their real name via the "Select Your Name" dialog,
    // don't overwrite it on every login — chat messages would all show
    // as "Staff" otherwise. Same for branch when the staff is at a
    // specific store but the shared profile says branch:'*'.
    try {
      const existing = (() => { try { return JSON.parse(localStorage.getItem('chat.me') || 'null'); } catch(_) { return null; } })();
      const profileName = __currentProfile.name || user.displayName || (user.email ? user.email.split('@')[0] : (user.phoneNumber || 'User'));
      const isSharedAccount = (user.email === 'staff@miamikimchi.com' || user.email === 'manager@miamikimchi.com');
      // 로그인 화면에서 '본인 이름 + 지점' 을 미리 골랐다면 그 값을 최우선 보존.
      // (Pembroke Pines 등 공유 계정 로그인 — 한 번에 다 처리하는 신규 흐름)
      const presetIdentity = _captureLoginIdentity();
      // If user has an existing personal chat.me name and is on a shared
      // account, keep their personal name. Otherwise use the profile name.
      const name = (presetIdentity && presetIdentity.name)
        || ((isSharedAccount && existing && existing.name && existing.name !== 'Staff' && existing.name !== 'Manager')
            ? existing.name
            : profileName);
      const profileBranch = (__currentProfile.branch && __currentProfile.branch !== '*')
        ? __currentProfile.branch
        : null;
      const branch = (presetIdentity && presetIdentity.branch)
        || profileBranch
        || (existing && existing.branch)
        || localStorage.getItem('hub.branch')
        || 'MIAMI';
      const role = (presetIdentity && presetIdentity.role)
        || __currentProfile.role
        || (existing && existing.role)
        || '';
      const chatMe = Object.assign({}, existing || {}, {
        name, branch, role,
        email: user?.email || (existing && existing.email) || '',   // 다음 방문 시 prefill 용
        uid: user?.uid || (existing && existing.uid),
        photoURL: user?.photoURL || (existing && existing.photoURL) || '',
        lastLogin: Date.now(),
        isManager: ['OWNER','EXECUTIVE','MANAGER','ASSISTANT_MANAGER','SUPERVISOR'].includes(String(role).toUpperCase())
      });
      localStorage.setItem('chat.me', JSON.stringify(chatMe));
      try { window.dispatchEvent(new Event('km-identity-changed')); } catch(_) {}
      // 인증 직후 직원 명단 백그라운드 캐싱 — 다음 방문 시 dropdown 즉시 표시.
      // 폰 첫 방문에서 명단 비어있어 막힌 사용자 케이스 해결.
      if (typeof window.__refreshEmployeesAfterAuth === 'function' && branch) {
        window.__refreshEmployeesAfterAuth(branch).catch(()=>{});
      }
    } catch(_) {}
    show('statusView');
    renderProfile();
    // Auto-enter as soon as approved (covers both initial bootstrap and live approval)
    if (__currentProfile.status === 'approved') {
      // Keep the user on the status screen for ~1 second so they see "approved",
      // then take them where they were headed
      setTimeout(() => {
        const params = new URLSearchParams(location.search);
        const ret = params.get('return');
        if (ret && ret.startsWith('/') && !ret.startsWith('//')) location.replace(ret);
        else location.replace('./hub.html');
      }, 800);
    }
  });
});

// Handle redirect-flow result if signInWithPopup fell back
getRedirectResult(auth).catch(()=>{});
</script>
