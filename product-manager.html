<style>
:root{--green:#1a5c3a;--green2:#15803d;--lgreen:#e8f5ee;--bg:#f4f7f5;--card:#fff;--line:#e2e8e5;
 --text:#1f2937;--mute:#6b7280;--amber:#b45309;--red:#dc2626;--blue:#1d4ed8;--gold:#b8860b;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px}
button,input,select{font-family:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding-bottom:60px}
.hd{background:var(--green);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd h1{font-size:1.1em;font-weight:800;flex:1;min-width:150px}
.hd .add{background:#fff;color:var(--green);border:0;border-radius:9px;padding:9px 14px;font-weight:800;font-size:.9em}
.tools{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:52px;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input.search{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.95em}
.tools select{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:700;background:#fff}
.chips{padding:8px 16px 0;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#f1f5f4;border:1.5px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:700;font-size:.82em;color:var(--mute)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.count{padding:10px 16px 2px;color:var(--mute);font-size:.85em}
.list{padding:8px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;gap:12px;position:relative}
.card.mod{border-left:5px solid var(--blue)}
.card.custom{border-left:5px solid var(--green2)}
.card.hidden{opacity:.55;border-left:5px solid #9ca3af}
.thumb{width:76px;height:76px;flex:0 0 76px;border-radius:10px;overflow:hidden;background:#f3f4f6;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .ph{font-size:.7em;color:#9ca3af;font-weight:800;text-align:center;padding:4px}
.info{flex:1;min-width:0}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:3px}
.tag{border-radius:6px;padding:1px 7px;font-size:.68em;font-weight:800}
.tag.mod{background:#dbeafe;color:var(--blue)}
.tag.custom{background:#dcfce7;color:var(--green2)}
.tag.hidden{background:#f3f4f6;color:#6b7280}
.brand{font-size:.72em;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.4px}
.nm{font-weight:700;line-height:1.3;margin:1px 0 2px;word-break:break-word}
.sub{font-size:.8em;color:var(--mute)}
.price{font-weight:900;color:var(--red);margin-top:3px}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button{border:0;border-radius:8px;padding:7px 11px;font-weight:800;font-size:.8em}
.b-edit{background:var(--green);color:#fff}
.b-hide{background:#fff;color:var(--amber);border:1.5px solid #fcd9a8}
.b-show{background:#fff;color:var(--green2);border:1.5px solid #bbf7d0}
.b-reset{background:#fff;color:var(--mute);border:1.5px solid var(--line)}
.b-del{background:#fff;color:var(--red);border:1.5px solid #fecaca}
.empty{padding:50px 16px;text-align:center;color:var(--mute)}
.loading{padding:40px 16px;text-align:center;color:var(--mute)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.ov.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:18px;margin:auto}
.modal h2{font-size:1.1em;font-weight:800;margin-bottom:12px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:.8em;font-weight:800;color:var(--mute);margin-bottom:4px}
.fld input,.fld select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:.95em}
.frow{display:flex;gap:8px}
.frow .fld{flex:1}
.photobox{display:flex;gap:10px;align-items:center}
.photobox .pv{width:70px;height:70px;flex:0 0 70px;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:#f3f4f6;display:flex;align-items:center;justify-content:center}
.photobox .pv img{width:100%;height:100%;object-fit:contain}
.photobox .pv .ph{font-size:.65em;color:#9ca3af;text-align:center}
.photobtns{flex:1;display:flex;flex-direction:column;gap:6px}
.photobtns button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-weight:700;font-size:.82em}
.mact{display:flex;gap:8px;margin-top:14px}
.mact button{flex:1;border:0;border-radius:10px;padding:12px;font-weight:800}
.m-save{background:var(--green);color:#fff}
.m-cancel{background:#f1f5f4;color:var(--text)}
.hint{font-size:.76em;color:var(--mute);margin-top:3px}
.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:9px;padding:9px 11px;font-size:.85em;margin:8px 16px}
.langbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:7px;padding:6px 10px;font-weight:800;font-size:.8em;cursor:pointer}
.langbtn.on{background:#fff;color:var(--green)}
</style>

<body>
<div class="wrap">
  <div class="hd">
    <h1 data-i18n="title">🛠️ 상품 관리</h1>
    <div style="display:flex;gap:3px">
      <button class="langbtn" data-lang="ko" onclick="setLang('ko')">KO</button>
      <button class="langbtn" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="langbtn" data-lang="es" onclick="setLang('es')">ES</button>
    </div>
    <button class="add" id="csToggle" onclick="toggleComingSoon()" style="background:#fff3cd;color:#92400e;">🚧 …</button>
    <button class="add" onclick="evOpen()" data-i18n="events" style="background:#e0edff;color:#1d4ed8;">🎪 이벤트 관리</button>
    <button class="add" onclick="openAdd()" data-i18n="addProduct">＋ 새 상품 추가</button>
  </div>
  <div class="tools">
    <input class="search" id="q" type="search" data-ph="searchPh" placeholder="🔍 이름·브랜드·코드 검색" oninput="render()">
    <select id="catSel" onchange="render()"><option value="" data-i18n="allCats">전체 카테고리</option></select>
  </div>
  <div class="chips" id="chips">
    <button class="chip on" data-f="all" onclick="setF('all')" data-i18n="fAll">전체</button>
    <button class="chip" data-f="mod" onclick="setF('mod')" data-i18n="fMod">수정됨</button>
    <button class="chip" data-f="custom" onclick="setF('custom')" data-i18n="fNew">신규추가</button>
    <button class="chip" data-f="hidden" onclick="setF('hidden')" data-i18n="fHidden">숨김</button>
  </div>
  <div class="count" id="count"></div>
  <div id="errbox"></div>
  <div class="list" id="list"><div class="loading" data-i18n="loading">상품 불러오는 중…</div></div>
</div>

<!-- EDIT / ADD MODAL -->
<div class="ov" id="ov">
  <div class="modal">
    <h2 id="mTitle">상품 수정</h2>
    <div class="fld" style="background:#eff6ff;border:1px solid #dbeafe;border-radius:10px;padding:10px">
      <label style="color:#1d4ed8" data-i18n="posLbl">🔎 POS에서 찾기 (이름·바코드 검색 → 자동 채움)</label>
      <input id="posQ" type="search" data-ph="posPh" placeholder="예: 신라면 / 08180K" oninput="posSearch()" autocomplete="off">
      <div id="posResults" style="max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:6px;background:#fff;display:none"></div>
      <div class="hint" style="margin-top:4px" data-i18n="posHint">POS 상품 2만개에서 검색해 이름·가격·바코드를 자동으로 채워요. (처음 검색 시 목록 불러오는 데 몇 초)</div>
    </div>
    <div class="fld">
      <label data-i18n="nameEn">상품명 (영어)</label>
      <input id="f_name" type="text" placeholder="SHIN RAMEN (4P)">
    </div>
    <div class="fld">
      <label data-i18n="nameKr">상품명 (한글, 선택)</label>
      <input id="f_nameKr" type="text" placeholder="신라면 4개입">
    </div>
    <div class="frow">
      <div class="fld"><label data-i18n="brand">브랜드</label><input id="f_brand" type="text" placeholder="NONGSHIM"></div>
      <div class="fld"><label data-i18n="size">용량/사이즈</label><input id="f_size" type="text" placeholder="4.2 OZ"></div>
    </div>
    <div class="frow">
      <div class="fld"><label data-i18n="price">가격 ($) · 나중에 입력 가능</label><input id="f_price" type="number" step="0.01" min="0" placeholder="5.99"></div>
      <div class="fld"><label data-i18n="category">카테고리</label><select id="f_cat"></select></div>
    </div>
    <div class="fld">
      <label data-i18n="barcode">바코드 (선택)</label>
      <input id="f_barcode" type="text" placeholder="8801043...">
    </div>
    <div class="fld" id="f_codeWrap" style="display:none">
      <label data-i18n="code">상품 코드 (선택)</label>
      <input id="f_code" type="text" data-ph="codePh" placeholder="비워두면 자동 생성">
    </div>
    <div class="fld">
      <label data-i18n="photo">사진</label>
      <div class="photobox">
        <div class="pv" id="f_pv"><span class="ph" data-i18n="none">없음</span></div>
        <div class="photobtns">
          <button type="button" onclick="document.getElementById('f_file').click()" data-i18n="upload">📷 사진 업로드</button>
          <button type="button" onclick="pasteUrl()" data-i18n="pasteUrl">🔗 이미지 주소 붙여넣기</button>
          <button type="button" onclick="clearPhoto()" data-i18n="removePhoto">✕ 사진 제거</button>
        </div>
      </div>
      <input id="f_file" type="file" accept="image/*" style="display:none" onchange="onFile(event)">
      <div class="hint" data-i18n="photoHint">업로드하면 자동으로 작게 저장돼요. 원본 사진으로 되돌리려면 아래 "원복".</div>
    </div>
    <div class="mact">
      <button class="m-cancel" onclick="closeModal()" data-i18n="cancel">취소</button>
      <button class="m-save" id="mSave" onclick="saveModal()" data-i18n="save">저장</button>
    </div>
  </div>
</div>

<!-- EVENTS MANAGER MODAL -->
<div class="ov" id="evOv">
  <div class="modal" style="max-width:600px">
    <h2><span data-i18n="evTitle">🎪 이벤트 관리</span> <span style="font-size:.6em;font-weight:600;color:var(--mute)" data-i18n="evSub">(홈 왼쪽 사이드바)</span></h2>
    <div style="font-size:.82em;color:var(--mute);margin-bottom:10px;line-height:1.5" data-i18n="evDesc">아이콘·이름·배지·연결할 곳을 정하세요. ↑↓로 순서 변경. 저장하면 쇼핑몰에 바로 반영돼요.</div>
    <div id="evList"></div>
    <button type="button" onclick="evAdd()" data-i18n="evAddBtn" style="width:100%;border:1.5px dashed var(--line);background:#fafafa;border-radius:10px;padding:11px;font-weight:800;color:var(--green);margin-top:6px">＋ 이벤트 추가</button>
    <div class="mact">
      <button class="m-cancel" onclick="evClose()" data-i18n="close">닫기</button>
      <button class="m-save" id="evSaveBtn" onclick="evSave()" data-i18n="save">저장</button>
    </div>
  </div>
</div>

<!-- PER-EVENT PRODUCT PICKER MODAL -->
<div class="ov" id="pkOv">
  <div class="modal" style="max-width:560px">
    <h2 id="pkTitle">🛒 상품 편집</h2>
    <div style="font-size:.82em;color:var(--mute);margin-bottom:6px" id="pkDesc" data-i18n="pkDesc">이 이벤트에 넣을 상품을 골라요. ↑↓로 순서, ✕로 제거. 비워두면 자동(인기순)으로 채워져요.</div>
    <div id="pkCount" style="font-size:.8em;font-weight:800;color:var(--green);margin-bottom:8px"></div>
    <div id="pkSelected" style="max-height:220px;overflow:auto;margin-bottom:12px;padding:2px"></div>
    <div style="font-size:.8em;font-weight:800;color:var(--mute);margin-bottom:6px" data-i18n="pkSearchLbl">상품 검색해서 추가</div>
    <input id="pkSearch" type="search" data-ph="pkSearchPh" placeholder="🔍 이름·브랜드·코드" oninput="pkSearch()" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px">
    <div id="pkResults" style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px"></div>
    <div class="mact">
      <button class="m-cancel" onclick="pkClose()" data-i18n="close">닫기</button>
      <button class="m-save" id="pkSaveBtn" onclick="pkSave()" data-i18n="save">저장</button>
    </div>
  </div>
</div>

function fetchProducts(i){
  if(i>=PRODUCTS_SOURCES.length) return Promise.reject(new Error('상품 목록 로드 실패 (모든 주소 실패 / Failed to fetch)'));
  return fetch(PRODUCTS_SOURCES[i],{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(txt){
    var fn=new Function(txt+'\n; return {P:(typeof PRODUCTS!=="undefined"?PRODUCTS:[]),C:(typeof CATEGORIES!=="undefined"?CATEGORIES:{})};');
    var res=fn();
    if(!res.P||!res.P.length) throw new Error('empty');
    STATIC=(res.P||[]).map(function(p){return p;});
    CATS=res.C||{};
    STATIC_BY={};STATIC.forEach(function(p){STATIC_BY[p.id]=p;});
    fillCatSelects();
  }).catch(function(){ return fetchProducts(i+1); });
}

function subscribe(){
  var fb=window.__fb;if(!fb)return;

// ---- merged view ----
function merged(){
  var out=[];
  // static + overrides
  STATIC.forEach(function(p){
    var o=OV[p.id];
    var m=Object.assign({},p);
    m._id=p.id;m._custom=false;m._mod=false;m._hidden=false;
    if(o){
      ['name','nameKr','brand','size','category','barcode'].forEach(function(k){if(o[k]!==undefined&&o[k]!=='')m[k]=o[k];});
      if(o.price!==undefined&&o.price!==''&&o.price!==null)m.price=+o.price;
      if(o.image!==undefined)m.image=o.image;
      m._hidden=!!o.hidden;
      m._mod=Object.keys(o).some(function(k){return ['name','nameKr','brand','size','category','price','image','barcode'].indexOf(k)>=0;});
    }
    out.push(m);
  });
  // custom (ids not in static)
  Object.keys(OV).forEach(function(id){
    if(STATIC_BY[id])return;
    var o=OV[id]||{};
    out.push(Object.assign({},o,{_id:id,id:id,_custom:true,_mod:false,_hidden:!!o.hidden,price:+o.price||0}));
  });
  return out;
}

  var el=document.getElementById('list');if(!el)return;
  var q=(document.getElementById('q').value||'').trim().toLowerCase();

  var rows=merged();
  var tot=rows.length;
  rows=rows.filter(function(m){
    if(F==='mod'&&!m._mod)return false;
    if(F==='custom'&&!m._custom)return false;
    if(F==='hidden'&&!m._hidden)return false;
    if(cat&&m.category!==cat)return false;
    if(q){var hay=((m.name||'')+' '+(m.nameKr||'')+' '+(m.brand||'')+' '+(m._id||'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  // modified/custom/hidden first, then by name
  rows.sort(function(a,b){var ra=(a._custom?0:a._mod?1:a._hidden?2:3),rb=(b._custom?0:b._mod?1:b._hidden?2:3);if(ra!==rb)return ra-rb;return String(a.name||'').localeCompare(String(b.name||''));});
  document.getElementById('count').textContent=tf('countTpl',{t:tot,n:rows.length});
  if(!rows.length){el.innerHTML='<div class="empty">'+t('noResult')+'</div>';return;}
  var MAX=300, slice=rows.slice(0,MAX);

    var cls='card'+(m._custom?' custom':m._mod?' mod':'')+(m._hidden?' hidden':'');
    var im=imgSrc(m.image);
    var thumb=im?'<img src="'+esc(im)+'" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span class=ph>'+t('noImg')+'</span>\'">':'<span class="ph">'+t('noImg')+'</span>';
    var badges='';
    if(m._custom)badges+='<span class="tag custom">'+t('tagNew')+'</span>';
    if(m._mod)badges+='<span class="tag mod">'+t('tagMod')+'</span>';
    if(m._hidden)badges+='<span class="tag hidden">'+t('tagHidden')+'</span>';
    var acts='<button class="b-edit" onclick="openEdit(\''+esc(m._id)+'\')">'+t('edit')+'</button>';

      ?'<button class="b-show" onclick="toggleHide(\''+esc(m._id)+'\',false)">'+t('show')+'</button>'
      :'<button class="b-hide" onclick="toggleHide(\''+esc(m._id)+'\',true)">'+t('hide')+'</button>';
    if(m._custom)acts+='<button class="b-del" onclick="delCustom(\''+esc(m._id)+'\')">'+t('del')+'</button>';
    else if(m._mod||m._hidden)acts+='<button class="b-reset" onclick="resetItem(\''+esc(m._id)+'\')">'+t('reset')+'</button>';
    var priceHtml=(Number(m.price)>0)?('$'+Number(m.price).toFixed(2)):('<span style="color:#b45309">⚠️ '+t('noPrice')+'</span>');
    return '<div class="'+cls+'">'+
      '<div class="thumb">'+thumb+'</div>'+
      '<div class="info">'+
        (badges?'<div class="badges">'+badges+'</div>':'')+
        (m.brand?'<div class="brand">'+esc(m.brand)+'</div>':'')+

        '<div class="price">'+priceHtml+'</div>'+
        '<div class="acts">'+acts+'</div>'+
      '</div>'+
    '</div>';
  }).join('')+(rows.length>MAX?'<div class="empty">'+tf('moreItems',{n:rows.length-MAX})+'</div>':'');
}

function onFile(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=700,w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      var data=c.toDataURL('image/jpeg',0.82);
      setPhoto(data);
    };
    img.onerror=function(){alert('이미지를 읽을 수 없어요.');};
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
  ev.target.value='';
}

var POS_DATA=null, POS_LOADING=false, POS_HITS=[];

function extractPOS(txt){
  var i=txt.indexOf('PRODUCTS_DATA');
  while(i>=0){
    var eq=txt.indexOf('=',i), br=txt.indexOf('[',eq);
    if(eq>=0&&br>=0&&br-eq<12){
      var depth=0,inStr=false,esc=false,qc='',j=br;
      for(;j<txt.length;j++){var c=txt[j];
        if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c===qc)inStr=false;}
        else{if(c==='"'||c==="'"){inStr=true;qc=c;}else if(c==='[')depth++;else if(c===']'){depth--;if(depth===0){j++;break;}}}}
      try{var arr=JSON.parse(txt.slice(br,j));if(Array.isArray(arr)&&arr.length>10)return arr;}catch(e){}
    }
    i=txt.indexOf('PRODUCTS_DATA',i+1);
  }
  return [];
}
function loadPOS(cb){
  if(POS_DATA){cb();return;}
  if(POS_LOADING){setTimeout(function(){loadPOS(cb);},400);return;}
  POS_LOADING=true;
  var box=document.getElementById('posResults');if(box){box.style.display='block';box.innerHTML='<div style="padding:10px;color:var(--mute);font-size:.85em">'+t('posLoading')+'</div>';}
  fetch('lookup.html',{cache:'force-cache'}).then(function(r){return r.text();}).then(function(txt){
    POS_DATA=extractPOS(txt)||[];POS_LOADING=false;cb();
  }).catch(function(){POS_LOADING=false;POS_DATA=[];if(box)box.innerHTML='<div style="padding:10px;color:var(--red);font-size:.85em">'+t('posFail')+'</div>';});
}
function catFromPOS(catStr){
  var s=(catStr||'').toUpperCase();
  if(/RAMEN|NOODLE|MYUN/.test(s))return 'ramyun';
  if(/SNACK|CHIP|COOKIE|CANDY|BISCUIT|CRACKER/.test(s))return 'snacks';
  if(/BEVERAGE|DRINK|JUICE|SODA|WATER|COFFEE/.test(s))return 'beverages';
  if(/\bTEA\b/.test(s))return 'tea';
  if(/KIMCHI|BANCHAN|SIDE\s*DISH/.test(s))return 'kimchi';
  if(/FROZEN|\(FZ\)|\(FF\)/.test(s))return 'frozen';
  if(/RICE|GRAIN|FLOUR/.test(s))return 'rice';
  if(/MEAT|PORK|BEEF|CHICKEN|POULTRY/.test(s))return 'meat';
  if(/SEAWEED|LAVER|\bGIM\b|NORI|KELP/.test(s))return 'seaweed';
  if(/SAUCE|PASTE|MARINADE|SEASON|\bOIL\b|VINEGAR|\bSOY\b/.test(s))return 'seasonings';
  if(/MILK|DAIRY|CHEESE|YOGURT/.test(s))return 'dairy';
  if(/PRODUCE|VEGET|FRUIT/.test(s))return 'produce';
  if(/BREAD|BAKERY|CAKE|PASTRY/.test(s))return 'bakery';
  if(/HOUSE|KITCHEN|\bBOWL\b|UTENSIL|WARE/.test(s))return 'houseware';
  return null;
}
function posSearch(){
  var q=(document.getElementById('posQ').value||'').trim().toLowerCase();
  var box=document.getElementById('posResults');if(!box)return;
  if(!q){box.style.display='none';box.innerHTML='';return;}
  box.style.display='block';
  loadPOS(function(){
    var qq=q.replace(/\s+/g,'');
    POS_HITS=POS_DATA.filter(function(p){
      var nm=(p.NAME||'').toLowerCase();
      var code=(p.CODE||'')+'';var fb=(p.FULL_BARCODE||'')+'';
      return nm.indexOf(q)>=0 || code.indexOf(qq)>=0 || fb.indexOf(qq)>=0;
    }).slice(0,25);
    if(!POS_HITS.length){box.innerHTML='<div style="padding:10px;color:var(--mute);font-size:.85em">'+t('posNoResult')+'</div>';return;}
    box.innerHTML=POS_HITS.map(function(p,i){
      return '<div onclick="posPick('+i+')" style="cursor:pointer;border-bottom:1px solid var(--line);padding:8px 10px;font-size:.85em" onmouseover="this.style.background=\'#f1f5f9\'" onmouseout="this.style.background=\'#fff\'">'
        +'<div style="font-weight:700">'+esc(p.NAME||'')+'</div>'
        +'<div style="color:var(--mute);font-size:.9em">💲'+Number(p.PRICE||0).toFixed(2)+' · 코드 '+esc(p.CODE||'')+(p.VENDOR?(' · '+esc(p.VENDOR)):'')+'</div>'
      +'</div>';
    }).join('');
  });
}
window.posSearch=posSearch;
function posPick(i){
  var p=POS_HITS[i];if(!p)return;
  document.getElementById('f_name').value=p.NAME||'';
  if(p.PRICE!=null&&!isNaN(+p.PRICE))document.getElementById('f_price').value=+p.PRICE;
  var bc=(p.FULL_BARCODE&&(''+p.FULL_BARCODE).length>=8)?p.FULL_BARCODE:(p.CODE||'');
  document.getElementById('f_barcode').value=bc||'';
  // fill product code (add mode only, if empty)
  var codeEl=document.getElementById('f_code');
  if(codeEl&&document.getElementById('f_codeWrap').style.display!=='none'&&!codeEl.value.trim())codeEl.value=(p.CODE||'');
  var ck=catFromPOS(p.CATEGORY);
  if(ck&&CATS[ck])document.getElementById('f_cat').value=ck;
  resetPOS();
}
window.posPick=posPick;

// ---- quick actions ----
function toggleHide(id,hide){
  var fb=window.__fb;if(!fb)return;
  fb.update(fb.ref(fb.db,'shopCatalog/items/'+id),{hidden:hide,updatedAt:Date.now(),updatedBy:meName()}).catch(function(e){alert('실패: '+(e.message||e));});
}
window.toggleHide=toggleHide;
function resetItem(id){
  if(!confirm(t('confirmReset')))return;
  var fb=window.__fb;if(!fb)return;
  fb.remove(fb.ref(fb.db,'shopCatalog/items/'+id)).catch(function(e){alert(t('fail')+(e.message||e));});
}
window.resetItem=resetItem;
function delCustom(id){
  if(!confirm(t('confirmDel')))return;
  var fb=window.__fb;if(!fb)return;
  fb.remove(fb.ref(fb.db,'shopCatalog/items/'+id)).catch(function(e){alert(t('fail')+(e.message||e));});
}
window.delCustom=delCustom;

// ---- boot ----
var booted=false;
// ---- Coming Soon (준비중) toggle ----
var CS_ON=true;
function subscribeCS(){
  var fb=window.__fb;if(!fb)return;
  fb.onValue(fb.ref(fb.db,'shopCatalog/config/comingSoon'),function(snap){
    var v=snap.val();
    CS_ON=(v!==false); // undefined/null/true => ON, only explicit false => OFF
    paintCS();
  },function(){});
}
function paintCS(){
  var b=document.getElementById('csToggle');if(!b)return;
  if(CS_ON){b.textContent=t('csOn');b.style.background='#fde68a';b.style.color='#92400e';}
  else{b.textContent=t('csOpen');b.style.background='#dcfce7';b.style.color='#15803d';}
}
function toggleComingSoon(){
  var fb=window.__fb;if(!fb){alert(t('waiting'));return;}
  var next=!CS_ON; // toggling: if currently ON -> set false (open), if OFF -> set true
  var msg=next?t('csConfirmOn'):t('csConfirmOff');
  if(!confirm(msg))return;
  fb.set(fb.ref(fb.db,'shopCatalog/config/comingSoon'),next)
    .then(function(){CS_ON=next;paintCS();})
    .catch(function(e){alert(t('fail')+(e.message||e));});
}
window.toggleComingSoon=toggleComingSoon;

// ---- Events manager (홈 사이드바 이벤트) ----
var EV=[];
var EV_ACTIONS=[['best','evActBadge'],['sale','evActSale'],['new','evActNew'],['weekly','evActWeekly'],['deals','evActDeals'],['all','evActAll'],['pickup','evActPickup'],['category','evActCat']];
function defaultEvents(){return [
  {icon:'🏆',label:'베스트셀러',badge:'HOT',action:'best',category:''},
  {icon:'🌸',label:'봄맞이 세일',badge:'SALE',action:'sale',category:''},
  {icon:'✨',label:'신상품',badge:'NEW',action:'new',category:''},
  {icon:'🍜',label:'라면 페스티벌',badge:'NEW',action:'category',category:'ramyun'},
  {icon:'💰',label:'매일 최저가',badge:'',action:'weekly',category:''},
  {icon:'🥬',label:'EBT/SNAP',badge:'',action:'pickup',category:''}
];}
function evOpen(){
  var fb=window.__fb;if(!fb){alert(t('waiting'));return;}
  fb.get(fb.ref(fb.db,'shopCatalog/events')).then(function(snap){
    var ev=snap.val();
    if(Array.isArray(ev))EV=ev.filter(Boolean);
    else if(ev&&typeof ev==='object')EV=Object.keys(ev).map(function(k){return ev[k];}).filter(Boolean);
    else EV=defaultEvents();
    EV.sort(function(a,b){return (a.order||0)-(b.order||0);});
    renderEvList();document.getElementById('evOv').classList.add('on');
  }).catch(function(){EV=defaultEvents();renderEvList();document.getElementById('evOv').classList.add('on');});
}
function evClose(){document.getElementById('evOv').classList.remove('on');}
function evAdd(){EV.push({icon:'⭐',label:(LANG==='en'?'New Event':LANG==='es'?'Nuevo evento':'새 이벤트'),badge:'',action:'best',category:''});renderEvList();}
function evDel(i){EV.splice(i,1);renderEvList();}
function evMove(i,d){var j=i+d;if(j<0||j>=EV.length)return;var t=EV[i];EV[i]=EV[j];EV[j]=t;renderEvList();}
function evSet(i,f,v){if(!EV[i])return;EV[i][f]=v;if(f==='action')renderEvList();}
window.evOpen=evOpen;window.evClose=evClose;window.evAdd=evAdd;window.evDel=evDel;window.evMove=evMove;window.evSet=evSet;
function renderEvList(){
  var el=document.getElementById('evList');if(!el)return;
  var badges=['','HOT','SALE','NEW'];
  var S='border:1.5px solid var(--line);border-radius:8px;padding:7px';
  el.innerHTML=EV.map(function(e,i){
    var actSel=EV_ACTIONS.map(function(a){return '<option value="'+a[0]+'"'+(e.action===a[0]?' selected':'')+'>'+t(a[1])+'</option>';}).join('');
    var badgeSel=badges.map(function(b){return '<option value="'+b+'"'+((e.badge||'')===b?' selected':'')+'>'+(b||t('evBadgeNone'))+'</option>';}).join('');
    var catRow=e.action==='category'?('<select onchange="evSet('+i+',\'category\',this.value)" style="flex:1;'+S+'">'+Object.keys(CATS||{}).map(function(k){return '<option value="'+k+'"'+(e.category===k?' selected':'')+'>'+esc(catName(k))+'</option>';}).join('')+'</select>'):'';
    return '<div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff">'
      +'<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'
        +'<input value="'+esc(e.icon||'')+'" onchange="evSet('+i+',\'icon\',this.value)" maxlength="4" style="width:52px;text-align:center;font-size:1.15em;'+S+'">'
        +'<input value="'+esc(e.label||'')+'" onchange="evSet('+i+',\'label\',this.value)" placeholder="'+t('evName')+'" style="flex:1;'+S+'">'
      +'</div>'
      +'<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
        +'<select onchange="evSet('+i+',\'badge\',this.value)" style="width:110px;'+S+'">'+badgeSel+'</select>'
        +'<select onchange="evSet('+i+',\'action\',this.value)" style="flex:1;min-width:120px;'+S+'">'+actSel+'</select>'
        +catRow
      +'</div>'
      +'<div style="display:flex;gap:6px;margin-top:8px;justify-content:space-between;align-items:center">'
        + (evColKey(e) ? '<button type="button" onclick="pkOpen(\''+evColKey(e)+'\',\''+esc(e.label||'').replace(/\'/g,"")+'\')" style="border:1.5px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:7px;padding:6px 12px;font-weight:800">'+t('evEditProds')+'</button>' : '<span style="font-size:.76em;color:var(--mute)">'+t('evAuto')+'</span>')
        +'<span style="display:flex;gap:6px">'
          +'<button type="button" onclick="evMove('+i+',-1)" style="border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;font-weight:700">↑</button>'
          +'<button type="button" onclick="evMove('+i+',1)" style="border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;font-weight:700">↓</button>'
          +'<button type="button" onclick="evDel('+i+')" style="border:1.5px solid #fecaca;background:#fff;color:var(--red);border-radius:7px;padding:6px 11px;font-weight:800">🗑</button>'
        +'</span>'
      +'</div>'
    +'</div>';
  }).join('')||'<div style="color:var(--mute);text-align:center;padding:20px">'+t('evNone')+'</div>';
}
function evSave(){
  var fb=window.__fb;if(!fb)return;
  var btn=document.getElementById('evSaveBtn');btn.disabled=true;btn.textContent=t('saving');
  var payload=EV.map(function(e,i){return {icon:e.icon||'⭐',label:e.label||'',badge:e.badge||'',action:e.action||'best',category:e.action==='category'?(e.category||''):'',order:i};});
  fb.set(fb.ref(fb.db,'shopCatalog/events'),payload)
    .then(function(){evClose();})
    .catch(function(e){alert(t('saveFail')+(e.message||e));})
    .then(function(){btn.disabled=false;btn.textContent=t('save');});
}
window.evSave=evSave;
document.getElementById('evOv').addEventListener('click',function(e){if(e.target===this)evClose();});

// ---- Per-event product picker (curated collections) ----
function evColKey(e){
  if(!e)return null;
  if(e.action==='category')return e.category?('cat_'+e.category):null;
  if(['best','new','sale','weekly','deals'].indexOf(e.action)>=0)return e.action;
  return null; // all/pickup: shop fills automatically
}
window.evColKey=evColKey;
var PK={key:null,title:'',ids:[]};
// apply staff override (edited name/price/photo) on top of a base product
function pkMerge(p){
  if(!p)return p;var o=OV[p.id];if(!o)return p;var m=Object.assign({},p);
  ['name','nameKr','brand','size','category'].forEach(function(k){if(o[k]!==undefined&&o[k]!=='')m[k]=o[k];});
  if(o.price!==undefined&&o.price!==''&&o.price!==null&&!isNaN(+o.price))m.price=+o.price;
  if(o.image!==undefined&&o.image!=='')m.image=o.image;
  return m;
}
function pkProd(id){var base=STATIC_BY[id]?STATIC_BY[id]:(OV[id]?Object.assign({id:id},OV[id]):null);return pkMerge(base);}
function pkName(id){var p=pkProd(id);return p?esc(p.nameKr&&p.nameKr!==''?p.nameKr:(p.name||id)):esc(id);}
function pkImg(id){var p=pkProd(id);return p?imgSrc(p.image):'';}
function pkOpen(key,title){
  if(!key){alert(t('posAuto'));return;}
  var fb=window.__fb;if(!fb){alert(t('waiting'));return;}
  PK={key:key,title:title||key,ids:[]};
  fb.get(fb.ref(fb.db,'shopCatalog/curated/'+key)).then(function(snap){
    var v=snap.val();
    if(Array.isArray(v))PK.ids=v.filter(Boolean);
    else if(v&&typeof v==='object')PK.ids=Object.keys(v).map(function(k){return v[k];}).filter(Boolean);
    else PK.ids=[];
    document.getElementById('pkTitle').textContent='🛒 '+PK.title+' — '+t('pkEdit');
    document.getElementById('pkSearch').value='';document.getElementById('pkResults').innerHTML='';
    renderPk();document.getElementById('pkOv').classList.add('on');
  }).catch(function(){PK.ids=[];renderPk();document.getElementById('pkOv').classList.add('on');});
}
function pkClose(){document.getElementById('pkOv').classList.remove('on');}
window.pkOpen=pkOpen;window.pkClose=pkClose;
function pkAdd(id){if(PK.ids.indexOf(id)<0){PK.ids.push(id);renderPk();pkSearch();}}
function pkRemove(id){var i=PK.ids.indexOf(id);if(i>=0){PK.ids.splice(i,1);renderPk();pkSearch();}}
function pkMove(id,d){var i=PK.ids.indexOf(id);var j=i+d;if(i<0||j<0||j>=PK.ids.length)return;var t=PK.ids[i];PK.ids[i]=PK.ids[j];PK.ids[j]=t;renderPk();}
window.pkAdd=pkAdd;window.pkRemove=pkRemove;window.pkMove=pkMove;
function renderPk(){
  var el=document.getElementById('pkSelected');if(!el)return;
  document.getElementById('pkCount').textContent=tf('pkCount',{n:PK.ids.length});
  if(!PK.ids.length){el.innerHTML='<div style="color:var(--mute);text-align:center;padding:16px;font-size:.85em">'+t('pkEmpty')+'</div>';return;}
  el.innerHTML=PK.ids.map(function(id){
    var im=pkImg(id);
    return '<div style="display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:6px;background:#fff">'
      +'<div style="width:38px;height:38px;flex:0 0 38px;border-radius:7px;overflow:hidden;background:#f3f4f6;display:flex;align-items:center;justify-content:center">'+(im?'<img src="'+esc(im)+'" style="width:100%;height:100%;object-fit:contain" onerror="this.style.display=\'none\'">':'')+'</div>'
      +'<div style="flex:1;min-width:0;font-size:.85em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+pkName(id)+' <span style="color:var(--mute);font-weight:500">· '+esc(id)+'</span></div>'
      +'<button type="button" onclick="pkMove(\''+esc(id)+'\',-1)" style="border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px">↑</button>'
      +'<button type="button" onclick="pkMove(\''+esc(id)+'\',1)" style="border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 8px">↓</button>'
      +'<button type="button" onclick="pkRemove(\''+esc(id)+'\')" style="border:1.5px solid #fecaca;background:#fff;color:var(--red);border-radius:6px;padding:4px 8px;font-weight:800">✕</button>'
    +'</div>';
  }).join('');
}
function pkSearch(){
  var q=(document.getElementById('pkSearch').value||'').trim().toLowerCase();
  var box=document.getElementById('pkResults');if(!box)return;
  if(!q){box.innerHTML='';return;}
  // Search both the original catalog (STATIC) AND staff-added custom products (OV)
  var custom=Object.keys(OV||{}).filter(function(id){return !STATIC_BY[id]&&OV[id]&&!OV[id].hidden;}).map(function(id){return Object.assign({id:id,_custom:true},OV[id]);});
  var source=STATIC.concat(custom);
  var hits=source.filter(function(p){
    if(PK.ids.indexOf(p.id)>=0)return false;
    var hay=((p.name||'')+' '+(p.nameKr||'')+' '+(p.brand||'')+' '+(p.id||'')).toLowerCase();
    return hay.indexOf(q)>=0;
  }).slice(0,30);
  if(!hits.length){box.innerHTML='<div style="color:var(--mute);padding:10px;font-size:.85em">'+t('pkNoResult')+'</div>';return;}
  box.innerHTML=hits.map(function(p0){
    var p=pkMerge(p0); // show edited photo/name/price if staff changed it
    var im=imgSrc(p.image);
    var isCustom=!STATIC_BY[p.id];
    var edited=!isCustom&&OV[p.id];
    var tag=isCustom?'<span style="background:#dcfce7;color:#15803d;border-radius:5px;padding:1px 6px;font-size:.72em;font-weight:800;margin-left:4px">'+t('tagNew')+'</span>':(edited?'<span style="background:#dbeafe;color:#1d4ed8;border-radius:5px;padding:1px 6px;font-size:.72em;font-weight:800;margin-left:4px">'+t('tagMod')+'</span>':'');
    return '<div style="display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:7px 4px">'
      +'<div style="width:36px;height:36px;flex:0 0 36px;border-radius:7px;overflow:hidden;background:#f3f4f6;display:flex;align-items:center;justify-content:center">'+(im?'<img src="'+esc(im)+'" style="width:100%;height:100%;object-fit:contain" onerror="this.style.display=\'none\'">':'')+'</div>'
      +'<div style="flex:1;min-width:0;font-size:.84em;overflow:hidden"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(p.nameKr&&p.nameKr!==""?p.nameKr:p.name)+tag+'</div><div style="color:var(--mute);font-size:.9em">'+esc(p.brand||'')+' · '+esc(p.id)+' · $'+Number(p.price||0).toFixed(2)+'</div></div>'
      +'<button type="button" onclick="pkAdd(\''+esc(p0.id)+'\')" style="border:0;background:var(--green);color:#fff;border-radius:7px;padding:7px 12px;font-weight:800">'+t('add')+'</button>'
    +'</div>';
  }).join('');
}
window.pkSearch=pkSearch;
function pkSave(){
  var fb=window.__fb;if(!fb||!PK.key)return;
  var btn=document.getElementById('pkSaveBtn');btn.disabled=true;btn.textContent=t('saving');
  fb.set(fb.ref(fb.db,'shopCatalog/curated/'+PK.key),PK.ids)
    .then(function(){pkClose();})
    .catch(function(e){alert(t('saveFail')+(e.message||e));})
    .then(function(){btn.disabled=false;btn.textContent=t('save');});
}
window.pkSave=pkSave;
document.getElementById('pkOv').addEventListener('click',function(e){if(e.target===this)pkClose();});

function boot(){
  if(booted)return;if(!window.__fb)return;booted=true;
  applyStatic();paintCS();subscribeCS();
  loadStatic().then(function(){subscribe();}).catch(function(e){
    document.getElementById('list').innerHTML='<div class="empty">'+t('loadFail')+'<br>'+esc(e.message||e)+'</div>';
  });
}
window.addEventListener('fb-ready',boot);if(window.__fb)boot();
</script>
