<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#1a5c3a">
<title>🚻 화장실 청소 스케줄 — KIMCHI MART</title>
<link rel="manifest" href="pwa-assets/manifest.webmanifest">
<link rel="icon" type="image/png" href="pwa-assets/icon-192.png">
<script type="module" src="./fb-auth-fetch.js?v=1"></script>
<script type="module" src="./auth-gate.js?v=4"></script>
<script src="./me-persist.js?v=1"></script>
<script src="./nav-sidebar.js?v=21-no-payroll" defer></script>
<script src="./back-nav.js?v=1"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Pretendard Variable','Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f4f6f9;color:#1f2937;font-size:14px;padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:1100px;margin:0 auto;padding:14px;padding-left:54px}
@media(min-width:761px){.wrap{padding-left:14px;margin-left:240px}}
h1{font-size:1.35em;font-weight:800;color:#1a5c3a;margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:#6b7280;font-size:.85em;margin-bottom:14px}

.toolbar{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar select,.toolbar button{padding:8px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:.9em;background:#fff;color:#1f2937;cursor:pointer;font-weight:600}
.toolbar .mnav{display:flex;gap:6px;align-items:center}
.toolbar .mnav button{padding:6px 12px}
.toolbar .mnav .cur{background:#1a5c3a;color:#fff;border-color:#1a5c3a;min-width:160px;text-align:center}
.toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.toolbar .right button{background:#1a5c3a;color:#fff;border-color:#1a5c3a}
.toolbar .right button.sec{background:#fff;color:#1f2937;border-color:#e5e7eb}

.legend{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 14px;font-size:.82em;color:#92400e;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.cal{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;margin-bottom:14px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:#f8fafc;border-bottom:1px solid #e5e7eb}
.cal-head div{padding:10px 8px;font-size:.78em;font-weight:800;color:#1a5c3a;text-align:center}
.cal-head div:first-child{color:#dc2626}
.cal-head div:last-child{color:#2563eb}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);min-height:600px}
.cal-cell{border-right:1px solid #f3f4f6;border-bottom:1px solid #f3f4f6;padding:6px;min-height:96px;position:relative;cursor:pointer;transition:background .1s}
.cal-cell:hover{background:#f9fafb}
.cal-cell.empty{background:#fafbfc;cursor:default}
.cal-cell.today{background:#eef2ff}
.cal-cell.today .dn{color:#3730a3;font-weight:900}
.cal-cell .dn{font-size:.78em;font-weight:700;color:#6b7280;margin-bottom:4px}
.cal-cell.sun .dn{color:#dc2626}
.cal-cell.sat .dn{color:#2563eb}
.cal-cell .slot{background:#dbeafe;color:#1e40af;border-radius:5px;padding:3px 6px;font-size:.74em;font-weight:700;margin-bottom:3px;line-height:1.25;word-break:keep-all;cursor:pointer;display:flex;align-items:center;gap:4px}
.cal-cell .slot .t{font-size:.68em;color:#64748b;font-weight:600}
.cal-cell .slot.morning{background:#fef3c7;color:#92400e}
.cal-cell .slot.afternoon{background:#dbeafe;color:#1e40af}
.cal-cell .slot.closing{background:#e0e7ff;color:#3730a3}
.cal-cell .add{font-size:.72em;color:#9ca3af;border:1px dashed #d1d5db;border-radius:5px;padding:3px;text-align:center;margin-top:3px}
.cal-cell:hover .add{color:#1a5c3a;border-color:#1a5c3a}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;z-index:9000;padding:18px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px}
.modal h3{font-size:1.1em;font-weight:800;color:#1f2937;margin-bottom:6px}
.modal .meta{color:#6b7280;font-size:.82em;margin-bottom:12px}
.modal .field{margin-bottom:10px}
.modal label{display:block;font-size:.84em;font-weight:700;color:#374151;margin-bottom:4px}
.modal select,.modal input{width:100%;padding:9px 11px;border:1.5px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:.92em;color:#1f2937;background:#fff;outline:none}
.modal .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal .btn{flex:1;min-width:90px;padding:10px;border:0;border-radius:8px;font-family:inherit;font-size:.9em;font-weight:700;cursor:pointer}
.modal .btn.primary{background:#1a5c3a;color:#fff}
.modal .btn.danger{background:#dc2626;color:#fff;flex:0 0 auto}
.modal .btn.sec{background:#f3f4f6;color:#374151}

.slots-list{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px;max-height:200px;overflow:auto}
.slots-list .si{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px}
.slots-list .si .n{flex:1;font-weight:700;color:#1f2937;font-size:.86em}
.slots-list .si .t{font-size:.75em;color:#6b7280}
.slots-list .si button{background:transparent;border:0;color:#dc2626;cursor:pointer;font-size:1.1em;padding:2px 6px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a5c3a;color:#fff;padding:12px 22px;border-radius:24px;font-weight:700;font-size:.9em;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

@media print {
  body{background:#fff !important;padding:0}
  .wrap{padding:0 !important;margin:0 !important;max-width:100% !important}
  .toolbar,.legend,nav,.nav-sidebar,.back-button,button{display:none !important}
  .cal{box-shadow:none !important;border:1px solid #000}
  body::before{content:"🚻 화장실 청소 스케줄 — " attr(data-print-title);display:block;font-size:18pt;font-weight:800;text-align:center;padding:8pt 0;border-bottom:2px solid #000;margin-bottom:8pt}
}
</style>
</head>
<body>

<div class="wrap">
  <h1>🚻 <span id="pageTitle">화장실 청소 스케줄</span></h1>
  <div class="sub">매니저 전용 · 매장별 청소 담당자 월간 일정</div>

  <div class="toolbar">
    <select id="branchSel" onchange="onBranchChange()"></select>
    <div class="mnav">
      <button onclick="shiftMonth(-1)" title="이전 달">←</button>
      <button class="cur" id="curMonthBtn" onclick="goToday()"></button>
      <button onclick="shiftMonth(+1)" title="다음 달">→</button>
    </div>
    <div class="right">
      <button class="sec" onclick="window.print()">🖨 인쇄</button>
      <button onclick="openAddBatch()">＋ 일괄 배정</button>
    </div>
  </div>

  <div class="legend">
    💡 <b>사용법:</b> 날짜 칸 클릭 → 직원·시간 배정. 같은 날 여러 명 배정 가능. 1-2주 단위 일괄 배정도 가능.
  </div>

  <div class="cal">
    <div class="cal-head">
      <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>

<!-- 단일 날짜 배정 모달 -->
<div class="overlay" id="dayOv">
  <div class="modal">
    <h3 id="dayTitle">날짜</h3>
    <div class="meta" id="dayMeta"></div>

    <div class="field">
      <label>이 날 배정된 직원</label>
      <div class="slots-list" id="dayList"></div>
    </div>

    <div class="field" style="background:#f0fdf4;border:1px dashed #86efac;border-radius:8px;padding:10px">
      <label style="color:#166534">＋ 새 배정 추가</label>
      <div class="field">
        <label>직원 선택</label>
        <select id="addEmp"></select>
      </div>
      <div class="field">
        <label>시간 (선택)</label>
        <select id="addTime">
          <option value="">시간 미지정</option>
          <option value="morning">🌅 오전 (8-12시)</option>
          <option value="afternoon">☀️ 오후 (12-17시)</option>
          <option value="closing">🌙 마감 (17-21시)</option>
        </select>
      </div>
      <button class="btn primary" style="width:100%;padding:10px;border:0;border-radius:8px;font-weight:700;cursor:pointer" onclick="addAssign()">＋ 추가</button>
    </div>

    <div class="actions">
      <button class="btn danger" onclick="clearDay()">🗑 이 날 모두 비우기</button>
      <button class="btn sec" onclick="closeOv('dayOv')">닫기</button>
    </div>
  </div>
</div>

<!-- 일괄 배정 모달 -->
<div class="overlay" id="batchOv">
  <div class="modal">
    <h3>일괄 배정</h3>
    <div class="meta">기간 + 요일 패턴 선택 → 직원 자동 분배</div>

    <div class="field">
      <label>시작 날짜</label>
      <input type="date" id="batchStart">
    </div>
    <div class="field">
      <label>종료 날짜</label>
      <input type="date" id="batchEnd">
    </div>
    <div class="field">
      <label>요일 선택 (없으면 전체)</label>
      <div style="display:flex;gap:4px;flex-wrap:wrap" id="batchDows">
        <!-- DOW chips dynamically inserted -->
      </div>
    </div>
    <div class="field">
      <label>배정할 직원들 (Ctrl/Cmd 다중 선택 → 순환 분배)</label>
      <select id="batchEmps" multiple size="6" style="height:auto"></select>
    </div>
    <div class="field">
      <label>시간</label>
      <select id="batchTime">
        <option value="">시간 미지정</option>
        <option value="morning">🌅 오전</option>
        <option value="afternoon">☀️ 오후</option>
        <option value="closing">🌙 마감</option>
      </select>
    </div>
    <div class="field" style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:8px;font-size:.78em;color:#92400e">
      ⚠️ 기존 배정에 <b>추가</b> 됩니다 (덮어쓰기 X). 중복 원하지 않으면 먼저 비우기.
    </div>

    <div class="actions">
      <button class="btn primary" onclick="runBatch()">＋ 적용</button>
      <button class="btn sec" onclick="closeOv('batchOv')">취소</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const FB_DB = 'https://kimchi-mart-order-default-rtdb.firebaseio.com';
const BRANCHES = [
  {id:'HOLLYWOOD',     ko:'헐리우드'},
  {id:'PEMBROKE_PINES',ko:'펨브로크 파인즈'},
  {id:'CORAL_SPRINGS', ko:'코럴 스프링스'},
  {id:'LAS_OLAS',      ko:'라스올라스'},
  {id:'MIAMI',         ko:'마이애미'},
  {id:'WEST_PALM',     ko:'웨스트 팜'},
];

// ============ 🔒 매니저 전용 접근 차단 ============
(function _gate(){
  let me = null;
  try { me = JSON.parse(localStorage.getItem('chat.me') || 'null'); } catch(_){}
  if (!me || !me.role) return;
  const r = String(me.role).toUpperCase();
  const ALLOWED = ['OWNER','EXECUTIVE','MANAGER','ASSISTANT MANAGER','ASST MANAGER','ASST. MANAGER',
    'BOSS','오너','사장','대표','전무','매니저','점장','부매니저','VICE PRESIDENT','VP',
    'GERENTE','GERENTE ASISTENTE','DUEÑO','DUENO','PROPIETARIO'];
  if (ALLOWED.some(t => r.indexOf(t.toUpperCase()) >= 0)) return;
  document.documentElement.innerHTML =
    '<head><meta charset="UTF-8"><title>접근 권한 없음</title></head>' +
    '<body style="margin:0;font-family:system-ui,sans-serif;background:#1f2937;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center">' +
    '<div style="max-width:480px">' +
    '<div style="font-size:72px;margin-bottom:16px">🔒</div>' +
    '<h1 style="font-size:24px;font-weight:800;margin-bottom:12px">매니저 전용 페이지</h1>' +
    '<p style="color:#9ca3af;line-height:1.6;margin-bottom:24px">화장실 청소 스케줄은 매니저·점장·오너 전용입니다.<br>본인 역할 확인은 매니저에게 문의.</p>' +
    '<p style="color:#9ca3af;font-size:13px;margin-bottom:24px">현재 역할: ' + (me.role || '없음') + ' · ' + (me.name || '익명') + '</p>' +
    '<a href="./hub.html" style="display:inline-block;background:#1a5c3a;color:#fff;text-decoration:none;padding:12px 28px;border-radius:8px;font-weight:700">← 홈으로</a>' +
    '</div></body>';
  throw new Error('bathroom-schedule: access denied');
})();

// ============ 상태 ============
let CUR_BRANCH = 'HOLLYWOOD';
let CUR_YM = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); })();
let DATA = {};        // { '2026-06-01': [{name, time}, ...], ... }
let EMPLOYEES = [];   // 매장 직원 목록

// URL 파라미터에서 branch 추출
try {
  const u = new URL(location.href);
  const b = u.searchParams.get('branch');
  if (b) CUR_BRANCH = b.toUpperCase();
} catch(_){}

// ============ Helpers ============
const id = (x) => document.getElementById(x);
function fbKey(){ return `bathroom_schedule/${CUR_BRANCH}/${CUR_YM}`; }
function dateKey(y, m, d){ return y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }
function showToast(msg, isErr){
  const t = id('toast'); t.textContent = msg; t.style.background = isErr ? '#dc2626' : '#1a5c3a'; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function closeOv(o){ id(o).classList.remove('show'); }
window.closeOv = closeOv;

// ============ 초기화 ============
async function init(){
  // 브랜치 셀렉트
  const bs = id('branchSel');
  bs.innerHTML = BRANCHES.map(b => `<option value="${b.id}"${b.id===CUR_BRANCH?' selected':''}>${b.ko}</option>`).join('');
  // DOW chips
  const dows = ['일','월','화','수','목','금','토'];
  id('batchDows').innerHTML = dows.map((d,i) => `
    <label style="display:inline-flex;align-items:center;gap:4px;padding:5px 9px;background:#f3f4f6;border-radius:14px;cursor:pointer;font-size:.84em;font-weight:600">
      <input type="checkbox" value="${i}" style="margin:0">${d}
    </label>
  `).join('');
  await loadAll();
}

async function loadAll(){
  await Promise.all([loadEmployees(), loadSchedule()]);
  renderCalendar();
}

async function loadEmployees(){
  let aq = '';
  try { const tok = window.__getAuthToken && await window.__getAuthToken(); if (tok) aq = '?auth=' + encodeURIComponent(tok); } catch(_){}
  try {
    const r = await fetch(`${FB_DB}/schedules/${CUR_BRANCH}.json${aq}&_t=${Date.now()}`.replace('?&','?'), {cache:'no-store'});
    const d = await r.json() || {};
    EMPLOYEES = Array.isArray(d.employees) ? d.employees.filter(e => e && e.name).map(e => e.name).sort() : [];
  } catch(_){ EMPLOYEES = []; }
}

async function loadSchedule(){
  let aq = '';
  try { const tok = window.__getAuthToken && await window.__getAuthToken(); if (tok) aq = '?auth=' + encodeURIComponent(tok); } catch(_){}
  try {
    const r = await fetch(`${FB_DB}/${fbKey()}.json${aq}&_t=${Date.now()}`.replace('?&','?'), {cache:'no-store'});
    DATA = await r.json() || {};
    if (!DATA) DATA = {};
  } catch(_){ DATA = {}; }
}

async function saveSchedule(){
  let aq = '';
  try { const tok = window.__getAuthToken && await window.__getAuthToken(); if (tok) aq = '?auth=' + encodeURIComponent(tok); } catch(_){}
  try {
    const r = await fetch(`${FB_DB}/${fbKey()}.json${aq}`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(DATA)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return true;
  } catch(e){ showToast('저장 실패: ' + e.message, true); return false; }
}

// ============ 달력 렌더링 ============
function renderCalendar(){
  const [y, m] = CUR_YM.split('-').map(Number);
  id('curMonthBtn').textContent = y + '년 ' + m + '월';
  const firstDow = new Date(y, m-1, 1).getDay();
  const lastDay = new Date(y, m, 0).getDate();
  const today = new Date(); const todayStr = dateKey(today.getFullYear(), today.getMonth()+1, today.getDate());
  document.body.dataset.printTitle = (BRANCHES.find(b=>b.id===CUR_BRANCH)||{}).ko + ' · ' + y + '년 ' + m + '월';

  const grid = id('calGrid');
  const cells = [];
  // 앞 빈 칸 (이전 달)
  for (let i=0; i<firstDow; i++){
    cells.push('<div class="cal-cell empty"></div>');
  }
  // 이번 달
  for (let d=1; d<=lastDay; d++){
    const dk = dateKey(y, m, d);
    const dow = new Date(y, m-1, d).getDay();
    const slots = DATA[dk] || [];
    const slotsHtml = slots.map(s => `
      <div class="slot ${s.time||''}" title="${s.name||''}${s.time?' · '+timeLabel(s.time):''}">
        <span>${s.name||'?'}</span>
        ${s.time ? `<span class="t">${timeIcon(s.time)}</span>` : ''}
      </div>
    `).join('');
    const cls = ['cal-cell'];
    if (dow === 0) cls.push('sun');
    if (dow === 6) cls.push('sat');
    if (dk === todayStr) cls.push('today');
    cells.push(`
      <div class="${cls.join(' ')}" onclick="openDay('${dk}')">
        <div class="dn">${d}</div>
        ${slotsHtml}
        ${slots.length === 0 ? '<div class="add">＋ 배정</div>' : ''}
      </div>
    `);
  }
  // 마지막 빈 칸 (다음 달) — 7의 배수 채우기
  const totalCells = firstDow + lastDay;
  const remainder = (7 - (totalCells % 7)) % 7;
  for (let i=0; i<remainder; i++) cells.push('<div class="cal-cell empty"></div>');
  grid.innerHTML = cells.join('');
}

function timeLabel(t){ return {morning:'🌅 오전', afternoon:'☀️ 오후', closing:'🌙 마감'}[t] || ''; }
function timeIcon(t){ return {morning:'🌅', afternoon:'☀️', closing:'🌙'}[t] || ''; }

// ============ 월 이동 ============
function shiftMonth(delta){
  let [y, m] = CUR_YM.split('-').map(Number);
  m += delta;
  if (m < 1){ m = 12; y--; }
  if (m > 12){ m = 1; y++; }
  CUR_YM = y + '-' + String(m).padStart(2,'0');
  loadAll();
}
window.shiftMonth = shiftMonth;
function goToday(){
  const d = new Date();
  CUR_YM = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  loadAll();
}
window.goToday = goToday;
function onBranchChange(){
  CUR_BRANCH = id('branchSel').value;
  loadAll();
}
window.onBranchChange = onBranchChange;

// ============ 단일 날짜 모달 ============
let _curDayKey = null;
function openDay(dk){
  _curDayKey = dk;
  const [y, m, d] = dk.split('-').map(Number);
  const dowKr = ['일','월','화','수','목','금','토'][new Date(y, m-1, d).getDay()];
  id('dayTitle').textContent = `${y}년 ${m}월 ${d}일 (${dowKr})`;
  id('dayMeta').textContent = (BRANCHES.find(b=>b.id===CUR_BRANCH)||{}).ko + ' 매장';
  // 직원 셀렉트 채우기
  const sel = id('addEmp');
  sel.innerHTML = '<option value="">— 직원 선택 —</option>' + EMPLOYEES.map(n => `<option value="${n}">${n}</option>`).join('');
  id('addTime').value = '';
  renderDayList();
  id('dayOv').classList.add('show');
}
window.openDay = openDay;
function renderDayList(){
  const slots = DATA[_curDayKey] || [];
  const list = id('dayList');
  if (!slots.length){
    list.innerHTML = '<div style="color:#9ca3af;text-align:center;padding:10px;font-size:.85em">아직 배정 없음</div>';
    return;
  }
  list.innerHTML = slots.map((s, i) => `
    <div class="si">
      <span class="n">${s.name}</span>
      ${s.time ? `<span class="t">${timeLabel(s.time)}</span>` : ''}
      <button onclick="removeSlot(${i})" title="삭제">✕</button>
    </div>
  `).join('');
}
async function addAssign(){
  const name = id('addEmp').value;
  if (!name){ showToast('직원 선택 필요', true); return; }
  const time = id('addTime').value;
  if (!DATA[_curDayKey]) DATA[_curDayKey] = [];
  // 중복 방지 — 같은 이름 + 같은 시간 이미 있으면 스킵
  const dup = DATA[_curDayKey].some(s => s.name === name && (s.time||'') === (time||''));
  if (dup){ showToast('이미 배정됨', true); return; }
  DATA[_curDayKey].push({ name, time });
  if (await saveSchedule()){
    showToast('✓ 추가됨');
    renderDayList();
    renderCalendar();
    id('addEmp').value = '';
    id('addTime').value = '';
  }
}
window.addAssign = addAssign;
async function removeSlot(i){
  if (!DATA[_curDayKey]) return;
  DATA[_curDayKey].splice(i, 1);
  if (DATA[_curDayKey].length === 0) delete DATA[_curDayKey];
  if (await saveSchedule()){
    renderDayList();
    renderCalendar();
  }
}
window.removeSlot = removeSlot;
async function clearDay(){
  if (!confirm('이 날 배정 모두 삭제할까요?')) return;
  delete DATA[_curDayKey];
  if (await saveSchedule()){
    showToast('✓ 비움');
    renderDayList();
    renderCalendar();
  }
}
window.clearDay = clearDay;

// ============ 일괄 배정 ============
function openAddBatch(){
  const [y, m] = CUR_YM.split('-').map(Number);
  const lastDay = new Date(y, m, 0).getDate();
  id('batchStart').value = dateKey(y, m, 1);
  id('batchEnd').value = dateKey(y, m, lastDay);
  id('batchEmps').innerHTML = EMPLOYEES.map(n => `<option value="${n}">${n}</option>`).join('');
  id('batchTime').value = '';
  document.querySelectorAll('#batchDows input').forEach(cb => cb.checked = false);
  id('batchOv').classList.add('show');
}
window.openAddBatch = openAddBatch;
async function runBatch(){
  const start = id('batchStart').value;
  const end = id('batchEnd').value;
  if (!start || !end || start > end){ showToast('날짜 범위 확인', true); return; }
  const sel = Array.from(id('batchEmps').selectedOptions).map(o => o.value);
  if (!sel.length){ showToast('배정할 직원 선택', true); return; }
  const dows = Array.from(document.querySelectorAll('#batchDows input:checked')).map(cb => Number(cb.value));
  const time = id('batchTime').value;

  let added = 0, rot = 0;
  const sd = new Date(start), ed = new Date(end);
  for (let d = new Date(sd); d <= ed; d.setDate(d.getDate()+1)){
    const dow = d.getDay();
    if (dows.length && !dows.includes(dow)) continue;
    const dk = dateKey(d.getFullYear(), d.getMonth()+1, d.getDate());
    // 같은 달 데이터만 처리 (다른 달은 다른 키)
    const dkYm = dk.slice(0,7);
    if (dkYm !== CUR_YM) continue;
    const name = sel[rot % sel.length];
    rot++;
    if (!DATA[dk]) DATA[dk] = [];
    const dup = DATA[dk].some(s => s.name === name && (s.time||'') === (time||''));
    if (!dup){ DATA[dk].push({ name, time }); added++; }
  }
  if (await saveSchedule()){
    showToast(`✓ ${added}개 추가됨 (순환 분배)`);
    closeOv('batchOv');
    renderCalendar();
  }
}
window.runBatch = runBatch;

// ============ Start ============
init();
</script>
