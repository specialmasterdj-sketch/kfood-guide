<!-- fb-auth-fetch 먼저 — fetch 에 로그인 토큰 자동 부착. auth-gate 가 로그인/승인 확인. -->

<style>
:root{--line:#e5e7eb;--sub:#64748b;--brand:#1a5c3a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f6f8f7;color:#0f172a;font-size:15px;padding:12px;padding-bottom:90px}
.wrap{max-width:860px;margin:0 auto}
.top{background:linear-gradient(135deg,#1a5c3a,#15803d);color:#fff;padding:16px 18px;border-radius:14px;margin-bottom:12px;position:relative}
.top h1{font-size:1.18em;font-weight:900;padding-right:112px}
.top .s{font-size:.84em;opacity:.93;margin-top:5px;line-height:1.5}
.lang{position:absolute;right:14px;top:14px;display:flex;gap:4px}
.lang b{background:rgba(255,255,255,.18);border-radius:7px;padding:5px 9px;font-size:.74em;cursor:pointer;font-weight:800}
.lang b.on{background:#fff;color:var(--brand)}

.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.btn{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9em;
     font-weight:800;cursor:pointer;font-family:inherit;color:#0f172a}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.go{background:#1565C0;border-color:#1565C0;color:#fff}
.btn.sm{padding:7px 11px;font-size:.84em}
select.btn{min-width:150px}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.card .ttl{font-weight:900;font-size:1.03em}
.card .sub{font-size:.82em;color:var(--sub);margin-top:3px;line-height:1.5}
.pill{font-size:.76em;font-weight:900;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill.a{background:#dcfce7;color:#15803d}
.pill.b{background:#fef3c7;color:#92400e}

table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92em}
th{background:#f1f5f9;font-size:.82em;font-weight:800;padding:8px 6px;border:1px solid var(--line);text-align:left}
td{padding:9px 6px;border:1px solid var(--line);vertical-align:middle}
td.c{text-align:center}
.bc{font-family:Consolas,monospace;font-size:.86em;color:#475569}
.old{color:#94a3b8;text-decoration:line-through}
.now{font-size:1.14em;font-weight:900;color:#C00000}
tr.ok td{background:#f0fdf4}
input[type=checkbox]{width:22px;height:22px;cursor:pointer}

.empty{text-align:center;color:var(--sub);padding:40px 16px;line-height:1.7;font-size:.92em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;
  padding:12px 20px;border-radius:24px;font-size:.9em;font-weight:700;z-index:99;opacity:0;
  pointer-events:none;transition:opacity .22s;max-width:92vw;text-align:center}
.toast.on{opacity:.96}
.hint{font-size:.84em;color:var(--sub);line-height:1.6;padding:10px 12px;background:#fff;
  border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:10px;padding:10px;
  font-family:Consolas,monospace;font-size:.84em;resize:vertical}
.fld{margin-bottom:8px}
.fld label{display:block;font-size:.8em;font-weight:800;color:#334155;margin-bottom:4px}
.fld input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px;font-size:.92em;font-family:inherit}
.row2{display:flex;gap:8px}.row2>*{flex:1}

/* ── 인쇄 ── */
#pr{display:none}
@media print{
  @page{size:letter portrait;margin:11mm}
  body{background:#fff;padding:0;font-size:10.5pt}
  .wrap,.toast,.km-back,#kmBack{display:none!important}
  #pr{display:block!important}
  #pr h1{font-size:16pt;font-weight:900;margin-bottom:2mm}
  #pr .sub{font-size:9pt;color:#444;margin-bottom:2mm}
  #pr .g{font-size:9pt;line-height:1.5;margin-bottom:3mm;border-left:3px solid #1a5c3a;padding-left:3mm}
  #pr table{width:100%;border-collapse:collapse;font-size:10pt}
  #pr th{background:#eef2f7;border:1px solid #999;padding:4px;font-size:8.5pt}
  #pr td{border:1px solid #999;padding:5px 4px}
  #pr .now{font-weight:900;font-size:12pt}
  #pr .old{color:#888;text-decoration:line-through}
  #pr .sg{margin-top:6mm;border:1px solid #999;padding:4mm;font-size:9pt}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="lang"><b id="Lko" onclick="setLang('ko')">KO</b><b id="Len" onclick="setLang('en')">EN</b><b id="Les" onclick="setLang('es')">ES</b></div>
    <h1 id="tT">🏷 가격표 교체</h1>
    <div class="s" id="tS"></div>
  </div>

  <div class="bar">
    <select id="br" class="btn" onchange="pickBranch()"></select>
    <button class="btn" id="bNew" onclick="toggleNew()" style="display:none">➕ <span id="tNew"></span></button>
  </div>

  <div id="newBox" style="display:none" class="card">
    <div class="row2">
      <div class="fld"><label id="lVend"></label><input id="nVend" placeholder="RHEE BROS"></div>
      <div class="fld"><label id="lInv"></label><input id="nInv" placeholder="PSI-0186099"></div>
    </div>
    <div class="fld"><label id="lEff"></label><input id="nEff" type="date"></div>
    <div class="fld"><label id="lPaste"></label>
      <div class="bar" style="margin-bottom:6px">
        <button class="btn sm" onclick="document.getElementById('nFile').click()" id="bFile"></button>
        <span id="fName" style="font-size:.84em;color:var(--sub);align-self:center"></span>
      </div>
      <input type="file" id="nFile" accept=".txt,.csv,.tsv,.xlsx,.xls" style="display:none" onchange="loadFile(this)">
      <textarea id="nData" placeholder="08165219494&#9;ASSI SEAWEED STEM 1KG&#9;REFRIGERATED-OTHERS (F)&#9;5.99&#9;7.49"></textarea></div>
    <div class="hint" id="hPaste"></div>
    <button class="btn go" onclick="createBatch()" id="bSave"></button>
  </div>

  <div id="list"><div class="empty">⏳</div></div>
</div>

<div id="pr"></div>
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getDatabase, ref, push, set, update, remove, onValue, get } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
  const cfg = { apiKey:"AIzaSyBwL0Wa1Q8aFhZp5hsn9gTw5aZwXUdAVy4", authDomain:"kimchi-mart-order.firebaseapp.com",
                databaseURL:"https://kimchi-mart-order-default-rtdb.firebaseio.com", projectId:"kimchi-mart-order",
                storageBucket:"kimchi-mart-order.firebasestorage.app" };
  const app = getApps().length ? getApp() : initializeApp(cfg);
  window.__fb = { db:getDatabase(app), ref, push, set, update, remove, onValue, get };
  window.dispatchEvent(new Event('fb-ready'));
</script>

<script>
/* ===== 말 ===== */
const HQ={ko:'HQ 운영본부',en:'HQ Operations',es:'Operaciones HQ'};
const L={
 title:{ko:'🏷 가격표 교체',en:'🏷 Price Tag Change',es:'🏷 Cambio de etiquetas'},
 sub:{ko:'새 가격으로 매대 가격표를 바꾸고, 바꾼 것에 ✓ 하세요. 인쇄해서 들고 다니셔도 됩니다.',
      en:'Replace the shelf tags with the new price and tick each one. You can print this and carry it.',
      es:'Cambie las etiquetas al precio nuevo y marque cada una. Puede imprimir esta lista.'},
 newB:{ko:'새 목록 올리기',en:'New list',es:'Nueva lista'},
 vend:{ko:'거래처',en:'Vendor',es:'Proveedor'},
 inv:{ko:'인보이스 번호 (선택)',en:'Invoice no. (optional)',es:'N.º factura (opcional)'},
 eff:{ko:'적용일',en:'Effective date',es:'Fecha de vigencia'},
 paste:{ko:'목록 붙여넣기',en:'Paste the list',es:'Pegue la lista'},
 pasteH:{ko:'한 줄에 하나씩, 탭으로 구분: <b>바코드 ⇥ 상품명 ⇥ 매대 ⇥ 현재가 ⇥ 새 가격</b><br>엑셀에서 그대로 복사해 붙여 넣으면 됩니다.',
         en:'One per line, tab separated: <b>barcode ⇥ name ⇥ section ⇥ old ⇥ new</b><br>Copy straight from Excel.',
         es:'Uno por línea, separado por tabulación: <b>código ⇥ nombre ⇥ sección ⇥ actual ⇥ nuevo</b><br>Copie directo de Excel.'},
 save:{ko:'📤 지점에 내려보내기',en:'📤 Send to the store',es:'📤 Enviar a la tienda'},
 pick:{ko:'📁 파일 고르기',en:'📁 Choose a file',es:'📁 Elegir archivo'},
 read:{ko:'⏳ 읽는 중…',en:'⏳ Reading…',es:'⏳ Leyendo…'},
 readOk:{ko:'✅ {f} — {n}줄 읽었습니다',en:'✅ {f} — {n} lines',es:'✅ {f} — {n} líneas'},
 readNo:{ko:'파일을 읽지 못했습니다',en:'Could not read the file',es:'No se pudo leer el archivo'},
 prn:{ko:'🖨 인쇄',en:'🖨 Print',es:'🖨 Imprimir'},
 none:{ko:'아직 내려온 가격표 교체 목록이 없습니다.',en:'No price tag lists yet.',es:'Todavía no hay listas.'},
 items:{ko:'{n}개 상품',en:'{n} items',es:'{n} productos'},
 prog:{ko:'{a} / {b} 교체함',en:'{a} of {b} done',es:'{a} de {b} hechas'},
 allDone:{ko:'✅ 다 바꿨습니다',en:'✅ All done',es:'✅ Todo listo'},
 eff2:{ko:'적용일',en:'Effective',es:'Vigencia'},
 thBc:{ko:'바코드',en:'Barcode',es:'Código'},
 thNm:{ko:'상품명',en:'Product',es:'Producto'},
 thCat:{ko:'매대',en:'Section',es:'Sección'},
 thOld:{ko:'현재',en:'Old',es:'Actual'},
 thNew:{ko:'새 가격',en:'NEW',es:'NUEVO'},
 thOk:{ko:'교체',en:'Done',es:'Hecho'},
 guide:{ko:'벨라포스 가격은 HQ 가 이미 바꿔 놓았습니다. 매대 가격표만 바꾸시면 됩니다. 상품을 못 찾으면 그 줄을 HQ 에 알려 주세요.',
        en:'HQ has already updated the price in VelaPOS. You only change the shelf tag. If you cannot find an item, tell HQ which line.',
        es:'HQ ya actualizó el precio en VelaPOS. Usted solo cambia la etiqueta. Si no encuentra un producto, avise a HQ.'},
 sign:{ko:'완료일 ______________    매니저 서명 ______________________',
       en:'Date ______________    Manager ______________________',
       es:'Fecha ______________    Gerente ______________________'},
 needD:{ko:'목록을 붙여넣어 주세요',en:'Please paste the list',es:'Pegue la lista'},
 bad:{ko:'{n}번째 줄을 못 읽었습니다 — 탭으로 5칸인지 봐 주세요',en:'Could not read line {n} — needs 5 tab-separated columns',es:'No se pudo leer la línea {n} — se requieren 5 columnas'},
 sent:{ko:'✅ {n}개 상품을 내려보냈습니다',en:'✅ Sent {n} items',es:'✅ Se enviaron {n} productos'},
 failS:{ko:'보내지 못했습니다',en:'Could not send',es:'No se pudo enviar'},
 delQ:{ko:'이 목록을 지울까요?',en:'Delete this list?',es:'¿Eliminar esta lista?'},
 del:{ko:'🗑 지우기',en:'🗑 Delete',es:'🗑 Eliminar'}
};
let LANG=(function(){ try{ const v=localStorage.getItem('kimchi_lang'); return ['ko','en','es'].includes(v)?v:'ko'; }catch(e){ return 'ko'; } })();
function t(k,v){ const o=L[k]; let s=o?(o[LANG]||o.ko):k; if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]); return s; }

const BRANCHES=[
  {id:'HOLLYWOOD',ko:'할리우드',en:'Hollywood'},{id:'MIAMI',ko:'마이애미',en:'Miami'},
  {id:'PEMBROKE_PINES',ko:'펨브로크 파인즈',en:'Pembroke Pines'},
  {id:'CORAL_SPRINGS',ko:'코럴 스프링스',en:'Coral Springs'},
  {id:'LASOLAS',ko:'라스올라스',en:'Las Olas'}];
const bName=id=>{const b=BRANCHES.find(x=>x.id===id); return b?(LANG==='ko'?b.ko:b.en):id;};

function me(){ try{ return window.__currentUser||JSON.parse(localStorage.getItem('chat.me')||'{}'); }catch(e){ return {}; } }
const isBoss=()=>{ const m=me(); return m.branch==='*'||['OWNER','EXECUTIVE'].includes(m.role); };
let BRANCH=(function(){ try{ const b=localStorage.getItem('km_branch'); if(BRANCHES.some(x=>x.id===b))return b; }catch(e){}
  const m=me(); return (m&&BRANCHES.some(x=>x.id===m.branch))?m.branch:'HOLLYWOOD'; })();
let DATA={}, OPEN=null, unsub=null;

const $=s=>document.getElementById(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=v=>'$'+(Number(v)||0).toFixed(2);
let tt=null;
function toast(m){ const el=$('toast'); el.innerHTML=m; el.classList.add('on'); clearTimeout(tt);
  tt=setTimeout(()=>el.classList.remove('on'),2800); }

function setLang(l){ LANG=l; try{ localStorage.setItem('kimchi_lang',l); }catch(e){} paint(); render(); }
function paint(){
  ['ko','en','es'].forEach(l=>$('L'+l).classList.toggle('on',l===LANG));
  $('tT').textContent=t('title'); $('tS').textContent=t('sub');
  $('tNew').textContent=t('newB');
  $('lVend').textContent=t('vend'); $('lInv').textContent=t('inv'); $('lEff').textContent=t('eff');
  $('lPaste').textContent=t('paste'); $('hPaste').innerHTML=t('pasteH'); $('bSave').textContent=t('save'); $('bFile').textContent=t('pick');
  const sel=$('br'), keep=sel.value;
  sel.innerHTML=BRANCHES.filter(b=>isBoss()||b.id===BRANCH)
    .map(b=>'<option value="'+b.id+'">'+(LANG==='ko'?b.ko:b.en)+'</option>').join('');
  sel.value=keep||BRANCH; if(!sel.value)sel.value=BRANCH;
  $('bNew').style.display=isBoss()?'':'none';
}
function pickBranch(){ BRANCH=$('br').value; try{ localStorage.setItem('km_branch',BRANCH); }catch(e){} watch(); }
function toggleNew(){ const b=$('newBox'); b.style.display=b.style.display==='none'?'':'none';
  if(b.style.display===''&&!$('nEff').value) $('nEff').value=new Date().toISOString().slice(0,10); }

/* ---- 목록 구독 ----
   저장 위치는 expiry/{지점}/priceTags — expiry 규칙이 '본인 지점 또는 전 지점(*)' 으로
   이미 잡혀 있어서 규칙을 새로 게시하지 않아도 된다. 크레딧·인보이스와 섞이지 않는다. */
function watch(){
  if(unsub){try{unsub();}catch(e){} unsub=null;}
  $('list').innerHTML='<div class="empty">⏳</div>';
  const F=window.__fb;
  unsub=F.onValue(F.ref(F.db,'expiry/'+BRANCH+'/priceTags'),
    s=>{ DATA=s.val()||{}; render(); },
    e=>{ $('list').innerHTML='<div class="empty">'+esc(e.message||'')+'</div>'; });
}
function render(){
  const ids=Object.keys(DATA).sort((a,b)=>(DATA[b].ts||0)-(DATA[a].ts||0));
  if(!ids.length){ $('list').innerHTML='<div class="empty">'+t('none')+'</div>'; return; }
  $('list').innerHTML=ids.map(id=>{
    const b=DATA[id], items=b.items||[], done=b.done||{};
    const n=items.length, a=items.filter(i=>done[i.code]).length;
    const all=n>0&&a===n;
    return '<div class="card"><div class="h" onclick="openB(\''+id+'\')">'+
      '<div><div class="ttl">'+esc(b.vendor||'')+(b.inv?' · '+esc(b.inv):'')+'</div>'+
      '<div class="sub">'+t('eff2')+' '+esc(b.eff||'')+' · '+t('items',{n:n})+'</div></div>'+
      '<div class="pill '+(all?'a':'b')+'">'+(all?t('allDone'):t('prog',{a:a,b:n}))+'</div></div>'+
      (OPEN===id?body(id,b,items,done):'')+'</div>';
  }).join('');
}
function body(id,b,items,done){
  return '<div class="bar" style="margin:12px 0 0">'+
    '<button class="btn go sm" onclick="event.stopPropagation();doPrint(\''+id+'\')">'+t('prn')+'</button>'+
    (isBoss()?'<button class="btn sm" onclick="event.stopPropagation();delB(\''+id+'\')">'+t('del')+'</button>':'')+
    '</div>'+
    '<table><tr><th>'+t('thBc')+'</th><th>'+t('thNm')+'</th><th>'+t('thCat')+'</th>'+
    '<th class="c">'+t('thOld')+'</th><th class="c">'+t('thNew')+'</th><th class="c">'+t('thOk')+'</th></tr>'+
    items.map(i=>'<tr class="'+(done[i.code]?'ok':'')+'">'+
      '<td class="bc">'+esc(i.code)+'</td><td>'+esc(i.name)+'</td><td style="font-size:.84em;color:#64748b">'+esc(i.cat||'')+'</td>'+
      '<td class="c old">'+money(i.old)+'</td><td class="c now">'+money(i.now)+'</td>'+
      '<td class="c"><input type="checkbox" '+(done[i.code]?'checked':'')+
      ' onclick="event.stopPropagation();tick(\''+id+'\',\''+esc(i.code)+'\',this.checked)"></td></tr>').join('')+
    '</table>';
}
function openB(id){ OPEN=OPEN===id?null:id; render(); }

async function tick(id,code,on){
  const F=window.__fb;
  try{
    await F.update(F.ref(F.db,'expiry/'+BRANCH+'/priceTags/'+id+'/done'),
      { [code]: on ? { by:(me().name||''), ts:Date.now() } : null });
  }catch(e){ toast(esc(e.message||'')); }
}
async function delB(id){ if(!confirm(t('delQ')))return;
  const F=window.__fb;
  try{ await F.remove(F.ref(F.db,'expiry/'+BRANCH+'/priceTags/'+id)); OPEN=null; }
  catch(e){ toast(esc(e.message||'')); } }

/* ---- 파일에서 불러오기 — 메모장 열고 복사하는 수고를 없앤다 ----
   .txt/.csv 는 그대로 읽고, 엑셀은 SheetJS 를 그때 받아서 탭 구분으로 바꾼다. */
function loadFile(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  $('fName').textContent=t('read');
  const done=(txt,n)=>{ $('nData').value=txt;
    $('fName').textContent=t('readOk',{f:f.name,n:n});
    toast(t('readOk',{f:f.name,n:n})); inp.value=''; };
  const fail=e=>{ $('fName').textContent=''; toast(t('readNo')+(e?(' — '+esc(e)):'')); inp.value=''; };
  const cnt=s=>s.split(/\r?\n/).filter(x=>x.trim()).length;

  if(/\.(xlsx|xls)$/i.test(f.name)){
    const go=()=>{ const rd=new FileReader();
      rd.onload=e=>{ try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const txt=XLSX.utils.sheet_to_csv(ws,{FS:'\t'});
        done(txt,cnt(txt));
      }catch(err){ fail(err.message); } };
      rd.onerror=()=>fail(); rd.readAsArrayBuffer(f); };
    if(window.XLSX) go();
    else { const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload=go; s.onerror=()=>fail('엑셀 읽기 도구를 못 받았습니다'); document.head.appendChild(s); }
    return;
  }
  const rd=new FileReader();
  rd.onload=e=>done(String(e.target.result),cnt(String(e.target.result)));
  rd.onerror=()=>fail(); rd.readAsText(f,'utf-8');
}

/* ---- HQ: 새 목록 내려보내기 ---- */
async function createBatch(){
  const raw=$('nData').value.trim();
  if(!raw){ toast(t('needD')); return; }
  /* 제목 줄·안내문이 섞여 들어와도 그냥 건너뛴다 — 인쇄용 표를 통째로 붙여넣는 일이 잦다.
     쓸 수 있는 줄은 '맨 앞이 숫자(바코드) + 가격 두 개가 숫자' 인 줄뿐이다. */
  /* 칸 위치를 고정으로 보지 않는다 — 인쇄용 표는 맨 앞에 빈 칸이 하나 있고,
     뒤에 '교체 ✓' 빈 칸이 붙기도 한다. 그래서 줄마다 직접 찾는다:
       · 바코드 = 6자리 이상 숫자인 첫 칸
       · 가격   = 그 뒤에 나오는 숫자 칸들 (둘이면 현재가·새 가격, 하나면 새 가격) */
  const items=[]; let skipped=0;
  const money=s=>{ const t=String(s==null?'':s).replace(/[^0-9.]/g,'');
                   const v=parseFloat(t); return (t&&isFinite(v))?v:null; };
  raw.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const c=line.split('\t').map(x=>String(x==null?'':x).trim());
    let b=-1;
    for(let i=0;i<c.length;i++){
      /* 숫자만 있고 6자리 이상인 칸 = 바코드. 가격($5.99)은 점이 있어 안 걸린다 */
      if(/^[0-9\s]+$/.test(c[i]) && c[i].replace(/[^0-9]/g,'').length>=6){ b=i; break; } }
    if(b<0){ skipped++; return; }
    const code=c[b].replace(/[^0-9]/g,'');
    const nums=[]; for(let i=b+1;i<c.length;i++){ const v=money(c[i]); if(v!=null&&v>0)nums.push(v); }
    if(!nums.length){ skipped++; return; }
    const now=nums[nums.length-1], old=nums.length>1?nums[nums.length-2]:0;
    items.push({code,name:c[b+1]||'',cat:c[b+2]||'',old,now});
  });
  if(!items.length){ toast(t('bad',{n:1})); return; }
  const F=window.__fb;
  try{
    const r=F.push(F.ref(F.db,'expiry/'+BRANCH+'/priceTags'));
    await F.set(r,{ vendor:$('nVend').value.trim()||'-', inv:$('nInv').value.trim()||'',
      eff:$('nEff').value||new Date().toISOString().slice(0,10),
      ts:Date.now(), by:(me().name||''), items });
    $('nData').value=''; $('newBox').style.display='none';
    toast(t('sent',{n:items.length})+(skipped?('  (제목·빈 줄 '+skipped+'줄은 건너뛰었습니다)'):''));
  }catch(e){ toast(t('failS')+' — '+esc(e.message||'')); }
}

/* ---- 인쇄 ---- */
function doPrint(id){
  const b=DATA[id]; if(!b)return;
  const items=b.items||[], done=b.done||{};
  $('pr').innerHTML=
    '<h1>🏷 '+esc(bName(BRANCH))+' — '+t('title').replace('🏷 ','')+'</h1>'+
    '<div class="sub">'+esc(b.vendor||'')+(b.inv?' · '+esc(b.inv):'')+' · '+t('eff2')+' '+esc(b.eff||'')+
      ' · '+t('items',{n:items.length})+' · '+esc(HQ[LANG]||HQ.ko)+'</div>'+
    '<div class="g">'+esc(t('guide'))+'</div>'+
    '<table><tr><th>'+t('thBc')+'</th><th>'+t('thNm')+'</th><th>'+t('thCat')+'</th>'+
      '<th>'+t('thOld')+'</th><th>'+t('thNew')+'</th><th>'+t('thOk')+'</th></tr>'+
    items.map(i=>'<tr><td style="font-family:Consolas,monospace;font-size:8.5pt">'+esc(i.code)+'</td>'+
      '<td>'+esc(i.name)+'</td><td style="font-size:8pt">'+esc(i.cat||'')+'</td>'+
      '<td class="old">'+money(i.old)+'</td><td class="now">'+money(i.now)+'</td>'+
      '<td style="text-align:center">'+(done[i.code]?'✔':'☐')+'</td></tr>').join('')+
    '</table><div class="sg">'+esc(t('sign'))+'</div>';
  setTimeout(()=>window.print(),80);
}

window.setLang=setLang; window.pickBranch=pickBranch; window.toggleNew=toggleNew;
window.createBatch=createBatch; window.loadFile=loadFile; window.openB=openB; window.tick=tick; window.delB=delB; window.doPrint=doPrint;

function boot(){ paint(); $('br').value=BRANCH; watch(); }
if(window.__fb) boot(); else window.addEventListener('fb-ready',boot,{once:true});
</script>
